<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>댓글 증강 시스템</title>
  <style>
    body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #f4f6fb; color: #222; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
    h1 { text-align: center; color: #3182f6; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .search { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .search input { width: 240px; padding: 8px 10px; border: 1px solid #ccd; border-radius: 6px; }
    .search button { padding: 8px 16px; border: 0; border-radius: 6px; background: #3182f6; color: #fff; cursor: pointer; }
    .hint { text-align: center; font-size: 13px; color: #888; margin-top: 8px; }

    /* 자동완성 후보 목록 */
    .autocomplete { position: relative; }
    .suggest-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10;
                    margin: 0; padding: 4px 0; list-style: none; background: #fff;
                    border: 1px solid #dde; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.1);
                    max-height: 320px; overflow-y: auto; }
    .suggest-list[hidden] { display: none; }
    .suggest-list li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
    .suggest-list li:hover, .suggest-list li.active { background: #eef4ff; }
    .suggest-list mark { background: none; color: #3182f6; font-weight: bold; }
    .suggest-list .meta { color: #999; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 댓글 증강 시스템</h1>

    <div class="card">
      <form class="search" id="search-form" action="{% url 'comments:company' %}" method="GET">
        <label for="comname">회사 이름 입력:</label>
        <div class="autocomplete">
          <input type="text" id="comname" name="comname" placeholder="예: 삼성전자" autocomplete="off"
                 value="{{ comname|default:'' }}">
          <ul class="suggest-list" id="suggest-list" hidden></ul>
        </div>
        <button type="submit">검색</button>
      </form>
      <p class="hint">회사명 일부만 입력해도 됩니다 (가장 상단의 검색 결과를 자동 선택)</p>
    </div>

    {% block content %}{% endblock %}
  </div>

  <script>
    // ------------------------------------------------------------
    // 검색창 자동완성 : 입력할 때마다 /comments/suggest?q=... 로 후보를 받아 목록으로 보여줌
    // ------------------------------------------------------------
    const SUGGEST_URL = "{% url 'comments:suggest' %}";
    const form = document.getElementById('search-form');
    const input = document.getElementById('comname');
    const list = document.getElementById('suggest-list');

    let items = [];       // 지금 보이는 후보들
    let activeIndex = -1; // 방향키로 고른 후보 번호 (-1 = 고른 것 없음)
    let timer = null;

    function closeList() {
      list.hidden = true;
      list.innerHTML = '';
      items = [];
      activeIndex = -1;
    }

    // 이름 중 입력한 부분을 <mark> 로 강조 (textContent 로 넣어 HTML 주입 방지)
    function highlight(name, q) {
      const span = document.createElement('span');
      const i = name.toLowerCase().indexOf(q.toLowerCase());
      if (i < 0) { span.textContent = name; return span; }
      const mark = document.createElement('mark');
      mark.textContent = name.slice(i, i + q.length);
      span.append(name.slice(0, i), mark, name.slice(i + q.length));
      return span;
    }

    function render(results, q) {
      list.innerHTML = '';
      items = results;
      activeIndex = -1;
      if (!results.length) { list.hidden = true; return; }

      results.forEach((stock, i) => {
        const li = document.createElement('li');
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = `${stock.market} · ${stock.code}`;
        li.append(highlight(stock.name, q), meta);
        // mousedown : input 의 blur(목록 닫힘)보다 먼저 실행되도록
        li.addEventListener('mousedown', (e) => { e.preventDefault(); choose(i); });
        list.appendChild(li);
      });
      list.hidden = false;
    }

    // 후보를 고르면 입력창에 채우고 바로 검색
    function choose(i) {
      input.value = items[i].name;
      closeList();
      form.submit();
    }

    function setActive(i) {
      const lis = list.querySelectorAll('li');
      lis.forEach((li) => li.classList.remove('active'));
      activeIndex = (i + lis.length) % lis.length; // 끝에서 다시 처음으로
      lis[activeIndex].classList.add('active');
      lis[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('input', () => {
      const q = input.value.trim();
      clearTimeout(timer);
      if (!q) { closeList(); return; }
      // 타이핑이 0.2초 멈췄을 때만 요청 (글자마다 요청하지 않도록)
      timer = setTimeout(async () => {
        const res = await fetch(`${SUGGEST_URL}?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (input.value.trim() === q) render(data.results, q); // 그사이 입력이 바뀌었으면 무시
      }, 200);
    });

    input.addEventListener('keydown', (e) => {
      if (e.isComposing || list.hidden) return; // 한글 조합 중에는 키 처리 안 함
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
      else if (e.key === 'Enter' && activeIndex >= 0) { e.preventDefault(); choose(activeIndex); }
      else if (e.key === 'Escape') { closeList(); }
    });

    input.addEventListener('blur', closeList);
  </script>
</body>
</html>
