<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSAFY 이론 퀴즈 — 모의고사 기반 개념 점검</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
  font-weight: 400;
}
:root{
  /* ---- OKLCH "field notebook" tokens, shared with hallmark palette ---- */
  --navy:        oklch(28% 0.075 258);
  --navy-light:  oklch(35% 0.085 258);
  --navy-deep:   oklch(23% 0.070 258);
  --blue:        oklch(55% 0.18  258);
  --indigo:      oklch(50% 0.20  275);
  --green:       oklch(53% 0.14  145);
  --amber:       oklch(50% 0.13  65);
  --red:         oklch(53% 0.18  25);
  --slate:       oklch(48% 0.020 258);

  --bg:#f5f6f9;
  --panel:#ffffff;
  --border: oklch(90% 0.010 258);
  --text: oklch(24% 0.014 258);
  --sub: oklch(46% 0.018 258);
  --accent: var(--blue);
  --accent-soft: oklch(93% 0.03 258);
  --good: var(--green);
  --good-bg: oklch(94% 0.05 145);
  --bad: var(--red);
  --bad-bg: oklch(94% 0.05 25);
  --skip: var(--amber);
  --skip-bg: oklch(94% 0.05 65);
  --radius:14px;
  --shadow: 0 1px 3px oklch(20% 0.03 258 / .06), 0 8px 24px oklch(20% 0.03 258 / .07);
}
html.dark{
  --navy-light:  oklch(45% 0.09 258);
  --bg: oklch(20% 0.012 258);
  --panel: oklch(26% 0.014 258);
  --border: oklch(34% 0.016 258);
  --text: oklch(93% 0.006 258);
  --sub: oklch(68% 0.014 258);
  --accent: oklch(68% 0.16 258);
  --accent-soft: oklch(30% 0.06 258);
  --good: oklch(68% 0.15 145);
  --good-bg: oklch(28% 0.06 150);
  --bad: oklch(68% 0.16 25);
  --bad-bg: oklch(28% 0.07 25);
  --skip: oklch(70% 0.12 70);
  --skip-bg: oklch(28% 0.06 70);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html{overflow-x:clip;}
body{
  margin:0; overflow-x:clip;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:background .2s,color .2s;
  min-height:100vh;
}
.katex{font-size:1em;}
a{color:inherit;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid oklch(100% 0 0 / .14);
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 65%, oklch(38% 0.09 250) 100%);
  color:oklch(97% 0.006 258);
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 10px oklch(20% 0.03 258 / .18);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:inherit;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--indigo));box-shadow:0 0 0 3px oklch(100% 0 0 / .12);}
.topnav{display:flex;align-items:center;gap:18px;font-size:13px;color:oklch(85% 0.02 258);}
.topnav span{cursor:default;}
.themebtn{
  width:34px;height:34px;border-radius:50%;border:1px solid oklch(100% 0 0 / .22);
  background:oklch(100% 0 0 / .08);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:inherit;
}
.layout{display:flex;max-width:1180px;margin:0 auto;padding:24px 20px 80px;gap:22px;align-items:flex-start;}
.sidebar{
  width:250px;flex-shrink:0;position:sticky;top:78px;
}
.sidenav-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:12px;margin-bottom:10px;
  background:var(--panel);border:1px solid var(--border);
  cursor:pointer;font-weight:700;font-size:14px;
}
.sidenav-item:hover{border-color:var(--accent);}
.sidenav-item.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sec-title{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--sub);font-weight:700;margin:18px 4px 10px;
}
.sec-title button{
  background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;
}
.cat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:border-color .12s, transform .08s;
}
.cat-card:hover{border-color:var(--accent);}
.cat-card.selected{border-color:var(--accent);background:var(--accent-soft);}
.cat-icon{font-size:18px;}
.cat-name{font-weight:700;font-size:13.5px;}
.cat-count{font-size:12px;color:var(--sub);margin-top:2px;}
.check{
  margin-left:auto;width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;flex-shrink:0;
}
.cat-card.selected .check{background:var(--accent);border-color:var(--accent);}
.badge{
  background:var(--bad);color:#fff;font-size:11px;font-weight:800;
  border-radius:20px;padding:2px 7px;margin-left:auto;
}
.main{flex:1;min-width:0;}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.empty-state{
  padding:100px 20px;text-align:center;color:var(--sub);
}
.empty-state .emoji{font-size:34px;margin-bottom:14px;}
.empty-state .lead{font-weight:700;color:var(--text);font-size:15px;margin-bottom:6px;}
.settings{padding:26px 28px;}
.settings h2{margin:0 0 20px;font-size:18px;}
.opt-group{margin-bottom:22px;}
.opt-label{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:10px;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-btn{
  padding:9px 16px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:13.5px;font-weight:700;cursor:pointer;
}
.opt-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.opt-hint{font-size:11.5px;color:var(--sub);margin-top:8px;}
.start-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:800;font-size:15px;cursor:pointer;
  margin-top:6px;
}
.start-btn:disabled{opacity:.5;cursor:not-allowed;}

/* quiz taking */
.quiz-wrap{display:flex;gap:20px;align-items:flex-start;}
.quiz-main{flex:1;min-width:0;}
.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:13px;color:var(--sub);}
.progress-track{flex:1;height:7px;background:var(--border);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .25s;}
.exit-link{cursor:pointer;font-weight:700;color:var(--sub);font-size:13px;}
.qcount{font-size:12.5px;color:var(--sub);margin-bottom:10px;}
.qcard{padding:26px 26px 22px;}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;}
.qtext{font-size:16px;font-weight:700;line-height:1.6;}
.report-chip{
  flex-shrink:0;font-size:11.5px;font-weight:700;color:var(--skip);background:var(--skip-bg);
  border:1px solid transparent;padding:5px 10px;border-radius:20px;white-space:nowrap;
}
.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
  border:1px solid var(--border);cursor:pointer;font-size:14.5px;line-height:1.5;
}
.opt-item:hover{border-color:var(--accent);}
.opt-item.picked{border-color:var(--accent);background:var(--accent-soft);}
.opt-item.correct{border-color:var(--good);background:var(--good-bg);}
.opt-item.wrong{border-color:var(--bad);background:var(--bad-bg);}
.opt-item.disabled{cursor:default;}
.opt-letter{
  width:24px;height:24px;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  color:var(--sub);
}
.opt-item.picked .opt-letter{background:var(--accent);color:#fff;}
.opt-item.correct .opt-letter{background:var(--good);color:#fff;}
.opt-item.wrong .opt-letter{background:var(--bad);color:#fff;}
.opt-mark{margin-left:auto;font-weight:800;}
.feedback{
  margin-top:16px;padding:16px 18px;border-radius:12px;font-size:13.5px;line-height:1.6;
  border:1px solid;
}
.feedback.good{background:var(--good-bg);border-color:var(--good);color:var(--good);}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.feedback .fl{font-weight:800;margin-bottom:6px;display:block;}
.feedback .body{color:var(--text);}
.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
.nav-btn{
  padding:11px 20px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer;
}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.nav-btn.ghost{background:none;}
.right-panel{
  width:210px;flex-shrink:0;
}
.qlist-title{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:12px;padding:0 4px;}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 4px;}
.qgrid button{
  aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--panel);
  font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;
}
.qgrid button.current{background:var(--accent);border-color:var(--accent);color:#fff;}
.qgrid button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);}
.qgrid button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.qgrid button.skip{background:var(--skip-bg);border-color:var(--skip);color:var(--skip);}
.legend{padding:14px 4px 0;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;gap:5px;}
.legend span.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

/* result */
.result-top{padding:30px 28px;}
.result-summary{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.donut-wrap{position:relative;width:118px;height:118px;flex-shrink:0;}
.donut-wrap svg{transform:rotate(-90deg);}
.donut-label{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.donut-pct{font-size:20px;font-weight:800;}
.donut-frac{font-size:11px;color:var(--sub);}
.score-text h3{margin:0 0 4px;font-size:22px;}
.score-text p{margin:0;color:var(--sub);font-size:13.5px;}
.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.res-btn{
  padding:9px 15px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;
}
.res-btn.wrongonly{color:var(--bad);border-color:var(--bad-bg);}
.res-btn.retry{color:var(--accent);border-color:var(--accent-soft);}
.res-note{font-size:12px;color:var(--sub);margin-top:12px;}
.tabs{display:flex;gap:8px;padding:0 28px;margin-top:6px;flex-wrap:wrap;}
.tab-btn{
  padding:9px 16px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
  color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;
}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.review-list{padding:18px 28px 30px;display:flex;flex-direction:column;gap:12px;}
.review-item{border-radius:12px;padding:16px 18px;border:1px solid;font-size:13.5px;line-height:1.6;}
.review-item.correct{background:var(--good-bg);border-color:var(--good);}
.review-item.wrong{background:var(--bad-bg);border-color:var(--bad);}
.review-item.skip{background:var(--skip-bg);border-color:var(--skip);}
.review-q{font-weight:700;margin-bottom:8px;display:flex;gap:8px;}
.review-meta{color:var(--sub);font-size:12.5px;margin-bottom:4px;}
.review-exp{color:var(--text);font-size:12.5px;margin-top:6px;opacity:.9;}

/* wrongnote */
.wn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:22px 26px;}
.wn-card{
  border-radius:12px;border:1px solid var(--border);background:var(--panel);
  padding:16px 16px 14px;border-top:3px solid var(--skip);cursor:pointer;
}
.wn-card:hover{border-color:var(--accent);}
.wn-cat{font-size:11px;color:var(--sub);margin-bottom:4px;}
.wn-name{font-weight:800;font-size:14px;margin-bottom:8px;}
.wn-count{color:var(--skip);font-weight:800;font-size:12.5px;}
.wn-empty{padding:60px 20px;text-align:center;color:var(--sub);}

footer.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:11.5px;text-align:center;}
@media(max-width:820px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;position:static;}
  .quiz-wrap{flex-direction:column-reverse;}
  .right-panel{width:100%;}
  .qgrid{grid-template-columns:repeat(8,1fr);}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span> SSAFY 이론 퀴즈</div>
  <div class="topnav">
    <span id="wnTopLink" style="cursor:pointer;">오답노트</span>
    <button class="themebtn" id="themeBtn">🌙</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidenav-item" id="navHome">🏠 카테고리 홈</div>
    <div class="sidenav-item" id="navWrong">📕 오답노트 <span class="badge" id="wnBadge" style="display:none;">0</span></div>
    <div class="sec-title">퀴즈 카테고리 <button id="selAllBtn">전체 선택</button></div>
    <div id="catList"></div>
  </div>

  <div class="main">
    <div class="panel" id="mainPanel"></div>
  </div>
</div>
<footer class="foot">모의고사 5회차(선형회귀·신경망 / EDA·모델학습 / CNN / RNN·어텐션·ViT·학습전략 / NLP·LLM) + LLM 에이전트·RAG·MCP 확장 문제 은행 기반 · 카테고리별 문제 수는 상이, 총 241문제</footer>

링하는 방식", "여러 응답을 서로 비교(pairwise comparison)하는 방식", "응답에 절대 점수를 직접 매기는 방식"], "answerIdx": 2, "exp": "인간 판단의 비일관성 문제를 완화하기 위해 직접 점수를 매기기보다 응답 간 비교 데이터를 수집해 리워드 모델을 학습시킨다."}, {"q": "Bradley-Terry 비교 모델 손실함수에서 $y_w$와 $y_l$이 각각 의미하는 것은?", "opts": ["$y_w$: 쿼리, $y_l$: 검색된 문서", "$y_w$와 $y_l$은 동일한 응답을 의미", "$y_w$: 학습 데이터, $y_l$: 검증 데이터", "$y_w$: 더 선호되는 winning 응답, $y_l$: 덜 선호되는 losing 응답"], "answerIdx": 3, "exp": "$y_w$는 사람이 더 선호한 winning sample, $y_l$은 덜 선호한 losing sample이며, 리워드 모델은 $y_w$가 더 높은 점수를 받도록 학습된다."}, {"q": "RLHF 파이프라인의 3단계 순서로 옳은 것은?", "opts": ["보상모델 학습 → PPO 정책 최적화 → Instruction-tuning", "Instruction-tuning → 비교 데이터 수집 및 보상모델 학습 → PPO로 정책 최적화", "비교 데이터 수집 → PPO 정책 최적화 → Instruction-tuning", "PPO 정책 최적화 → Instruction-tuning → 비교 데이터 수집"], "answerIdx": 1, "exp": "RLHF는 ① 시범 데이터로 Instruction-tuning ② 비교 데이터 수집 및 보상모델 학습 ③ PPO를 통한 정책 최적화 순으로 진행된다."}, {"q": "리워드 해킹(Reward Hacking)에 대한 설명으로 가장 적절한 것은?", "opts": ["챗봇이 정답 여부와 관계없이 생산적이고 도움이 되어 보이는 답을 생성해 환각을 유발할 수 있는 현상", "인간 피드백을 완전히 대체하는 자동화 기법", "IR 검색 정확도를 항상 높이는 기법", "보상 모델이 필요 없게 만드는 최적화 기법"], "answerIdx": 0, "exp": "리워드 해킹은 강화학습에서 자주 발생하는 문제로, 챗봇이 정답 여부와 무관하게 그럴듯한 답을 생성하며 환각(Hallucination) 문제로 이어질 수 있다."}, {"q": "DPO(Direct Preference Optimization)의 핵심 아이디어는?", "opts": ["RLHF에서 강화학습(RL) 단계를 제거하고 preference data로 최종 LM을 직접(maximum likelihood) 학습", "PPO 업데이트 횟수를 늘리는 것", "인간 피드백을 전혀 사용하지 않는 것", "보상 모델을 더 크게 만들어 정확도를 높이는 것"], "answerIdx": 0, "exp": "DPO는 RLHF의 'RL'을 제거하고, 선호 데이터로부터 최종 언어모델을 maximum likelihood로 직접 학습하여 별도의 보상모델과 강화학습을 생략한다."}, {"q": "RLVR(RL with Verifiable Reward)이 주로 적용되는 상황은?", "opts": ["감성 분석처럼 정답이 주관적인 문제", "문서 요약의 스타일 선호 평가", "수학 문제처럼 정답 여부가 명확하게 검증 가능한 문제", "이미지 생성 품질 평가"], "answerIdx": 2, "exp": "RLVR은 정답이 분명한 문제(예: 수학 문제)에 대해 정답 여부로 리워드를 직접 부여하는 방식이며, DeepSeek-R1이 대표적 성공 사례이다."}, {"q": "Retrieval-augmented Generation(RAG)의 핵심 동작 방식은?", "opts": ["Datastore에서 관련 정보를 검색(Retrieval)해 언어모델의 생성(Generation) 단계에 함께 활용", "강화학습만으로 정답을 생성", "이미지 데이터만을 검색해 활용", "모델 파라미터에 저장된 지식만으로 답변을 생성"], "answerIdx": 0, "exp": "RAG는 사용자 질문에 답하기 위해 datastore에서 관련 정보를 검색해와 이를 생성 단계에서 함께 활용하는 방법이다."}, {"q": "Retrieval-augmented LM의 구성요소로 옳지 않은 것은?", "opts": ["Index", "Datastore", "Reward Model", "Query"], "answerIdx": 2, "exp": "Retrieval-augmented LM의 핵심 구성요소는 Datastore, Query, Index, Retrieval이며 Reward Model은 RLHF 관련 개념이다."}, {"q": "Sparse Retriever의 예시로 옳은 것은?", "opts": ["DPR, Contriever", "TF-IDF, BM-25", "OpenAI embeddings", "BERT 기반 dense embedding"], "answerIdx": 1, "exp": "Sparse Retriever는 쿼리-문서 간 정확한 용어 일치에 기반한 전통적 IR 기법으로 TF-IDF, BM-25가 대표적이다."}, {"q": "TF-IDF에서 IDF(Inverse Document Frequency)가 하는 역할은?", "opts": ["많은 문서에 공통적으로 등장하는 단어의 가중치를 낮춘다", "단어의 의미적 유사도를 계산한다", "문서 내 단어 등장 빈도만을 그대로 반영한다", "임베딩 벡터의 차원을 축소한다"], "answerIdx": 0, "exp": "IDF는 너무 많은 문서에 등장하는 단어(예: this, is, and)의 가중치를 낮춰, 흔한 단어보다 특정 문서에서 자주 등장하는 단어를 더 중요하게 만든다."}, {"q": "Bi-encoder와 Cross-encoder를 비교한 설명으로 옳은 것은?", "opts": ["Bi-encoder는 query와 document를 하나의 시퀀스로 결합해 처리한다", "Cross-encoder는 항상 Bi-encoder보다 빠르다", "Bi-encoder는 쿼리와 문서를 따로 인코딩해 빠르지만 정확도는 상대적으로 낮다", "Cross-encoder는 대규모 검색에 가장 적합하다"], "answerIdx": 2, "exp": "Bi-encoder는 두 문장을 따로 인코딩해 매우 빠르지만 정확도가 낮고, Cross-encoder는 하나의 시퀀스로 결합해 self-attention으로 상호작용시켜 정확하지만 느리다."}, {"q": "Dense Retriever의 단점으로 언급된 것은?", "opts": ["높은 연산 비용과 제한된 투명성(블랙박스적 특성)", "동의어나 다양한 표현을 전혀 처리하지 못한다", "inverted index를 사용할 수 없어 검색 자체가 불가능하다", "어휘가 정확히 일치해야만 검색이 가능하다"], "answerIdx": 0, "exp": "Dense Retriever는 의미적 이해와 풍부한 쿼리 표현이 장점이지만, 높은 연산 비용과 블랙박스적 특성(제한된 투명성), 학습 데이터 의존성이 단점이다."}, {"q": "RAG(Retrieval-augmented LM)가 필요한 이유로 옳지 않은 것은?", "opts": ["LLM이 가진 지식은 시간이 지나면 뒤쳐지고 갱신이 어렵기 때문", "기업 내부 보안 정보는 학습에 활용하기 어렵기 때문", "LLM 답변의 해석과 검증이 어렵기 때문", "LLM이 모든 지식을 파라미터에 완벽히 저장할 수 있기 때문"], "answerIdx": 3, "exp": "거대언어모델은 모든 지식을 파라미터에 저장하지 못하며, 특히 자주 등장하지 않는 정보에 RAG가 큰 효과를 보인다."}, {"q": "RAG에서 컨텍스트를 어떻게 구성해야 하는가(Challenge 1)에 대한 해결책으로 언급된 것은?", "opts": ["검색 단계를 아예 제거", "Position embedding, Efficient inference 등으로 언어모델의 컨텍스트 길이를 확장", "항상 가장 짧은 컨텍스트만 사용", "IDF 값을 인위적으로 높임"], "answerIdx": 1, function buildSession(){
  let pool = [];
  selectedCats.forEach(cat=>{
    QUIZ_DATA[cat].forEach((q,idx)=>pool.push({cat, idx, ...q}));
  });
  if(quizOrder==='random'){
    pool = pool.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v);
  }
  let n = quizCount==='all' ? pool.length : Math.min(quizCount, pool.length);
  pool = pool.slice(0, n);
  session = {
    questions: pool,
    answers: pool.map(()=>({picked:null, state:'unanswered'})), // unanswered|correct|wrong|skipped
    cur: 0
  };
  view='quiz';
}

function buildWrongOnlySession(cat){
  const idxs = [...(wrongNotes[cat]||[])];
  const pool = idxs.map(idx=>({cat, idx, ...QUIZ_DATA[cat][idx]}));
  session = { questions: pool, answers: pool.map(()=>({picked:null,state:'unanswered'})), cur:0 };
  view='quiz';
}

  const total = questions.length;
  const answeredCount = answers.filter(a=>a.state!=='unanswered').length;
  const pct = Math.round((answeredCount/total)*100);
  const q = questions[cur];
  const a = answers[cur];
  const done = a.state !== 'unanswered';

  let optsHTML = q.opts.map((opt,i)=>{
    let cls = 'opt-item';
    let mark = '';
    if(done){
      cls += ' disabled';
      if(i===q.answerIdx){ cls+=' correct'; mark='✓'; }
      else if(i===a.picked){ cls+=' wrong'; mark='✕'; }
    } else if(a.picked===i){
      cls += ' picked';
    }
    return `<div class="${cls}" data-opt="${i}">
      <span class="opt-letter">${letters(i)}</span>
      <span>${opt}</span>
      ${mark?`<span class="opt-mark">${mark}</span>`:''}
    </div>`;
  }).join('');

  let feedback = '';
  if(done){
    const good = a.state==='correct';
    feedback = `<div class="feedback ${good?'good':'bad'}">
      <span class="fl">${good?'✓ 정답입니다!':'✕ 오답입니다'}</span>
      <span class="body">${good?'':'정답: '+letters(q.answerIdx)+' '+q.opts[q.answerIdx]+'<br>'}${q.exp}</span>
    </div>`;
  }

  const gridBtns = questions.map((qq,i)=>{
    let cls='';
    const st = answers[i].state;
    if(i===cur) cls='current';
    else if(st==='correct') cls='correct';
    else if(st==='wrong') cls='wrong';
    else if(st==='skipped') cls='skip';
    return `<button class="${cls}" data-jump="${i}">${i+1}</button>`;
  }).join('');

  const isLast = cur===total-1;

  return `<div class="quiz-wrap">
    <div class="quiz-main">
      <div class="progress-row">
        <span>${answeredCount} / ${total}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
        <span class="exit-link" id="exitBtn">나가기</span>
      </div>
      <div class="qcount">${cur+1} / ${total} · ${CAT_META[q.cat].icon} ${CAT_META[q.cat].label}</div>
      <div class="panel qcard">
        <div class="qhead">
          <div class="qtext">${q.q}</div>
          <span class="report-chip">⚠ 신고하기</span>
        </div>
        <div class="opt-list">${optsHTML}</div>
        ${feedback}
      </div>
      <div class="actions-row">
        <button class="nav-btn ghost" id="prevBtn" ${cur===0?'disabled':''}>← 이전</button>
        <div style="display:flex;gap:8px;">
          ${!done?`<button class="nav-btn" id="skipBtn">건너뛰기</button>
          <button class="nav-btn primary" id="checkBtn" ${a.picked===null?'disabled':''}>정답 확인</button>`
          : isLast ? `<button class="nav-btn primary" id="finishBtn">결과 보기 →</button>`
          : `<button class="nav-btn primary" id="nextBtn">다음 →</button>`}
        </div>
      </div>
    </div>
    <div class="right-panel">
      <div class="panel" style="padding:16px;">
        <div class="qlist-title">문제 목록</div>
        <div class="qgrid">${gridBtns}</div>
        <div class="legend">
          <div><span class="dot" style="background:var(--good)"></span>정답</div>
          <div><span class="dot" style="background:var(--bad)"></span>오답</div>
          <div><span class="dot" style="background:var(--skip)"></span>건너뜀</div>
          <div><span class="dot" style="background:var(--border)"></span>숫자 미풀이</div>
        </div>
      </div>
    </div>
  </div>`;
}

function scoreOf(){
  const correct = session.answers.filter(a=>a.state==='correct').length;
  const total = session.answers.length;
  return {correct, total, pct: total? Math.round(correct/total*100):0};
}

function resultHTML(){
  const {correct,total,pct} = scoreOf();
  const skipped = session.answers.filter(a=>a.state==='skipped').length;
  const wrong = session.answers.filter(a=>a.state==='wrong').length;
  const circumference = 2*Math.PI*50;
  const dash = circumference*pct/100;
  const msg = pct>=80?'완벽해요! 🔥':pct>=50?'조금만 더 다듬어봐요 💪':'더 연습해봐요 🙂';

  const filters = {all: session.questions.map((_,i)=>i),
    correct: session.answers.map((a,i)=>a.state==='correct'?i:null).filter(v=>v!==null),
    wrong: session.answers.map((a,i)=>a.state==='wrong'?i:null).filter(v=>v!==null),
    skipped: session.answers.map((a,i)=>a.state==='skipped'?i:null).filter(v=>v!==null)};
  const idxs = filters[resultTab];

  const reviewHTML = idxs.map(i=>{
    const q = session.questions[i];
    const a = session.answers[i];
    const cls = a.state==='correct'?'correct':a.state==='wrong'?'wrong':'skip';
    const icon = a.state==='correct'?'✓':a.state==='wrong'?'✕':'○';
    let bodyMeta = '';
    if(a.state==='skipped'){
      bodyMeta = `<div class="review-meta">건너뜀 · 정답: ${letters(q.answerIdx)} ${q.opts[q.answerIdx]}</div>`;
    } else {
      bodyMeta = `<div class="review-meta">내 답: ${a.picked!==null?letters(a.picked)+' '+q.opts[a.picked]:'(미답변)'}</div>
      <div class="review-meta">정답: ${letters(q.answerIdx)} ${q.opts[q.answerIdx]}</div>`;
    }
    return `<div class="review-item ${cls}">
      <div class="review-q"><span>${icon}</span><span>${q.q}</span></div>
      ${bodyMeta}
      ${a.state!=='skipped'?`<div class="review-exp">${q.exp}</div>`:''}
    </div>`;
  }).join('') || `<div class="wn-empty">해당하는 문제가 없어요.</div>`;

  return `<div>
    <div class="result-top">
      <div class="result-summary">
        <div class="donut-wrap">
          <svg width="118" height="118" viewBox="0 0 118 118">
            <circle cx="59" cy="59" r="50" fill="none" stroke="var(--border)" stroke-width="12"/>
            <circle cx="59" cy="59" r="50" fill="none" stroke="var(--accent)" stroke-width="12"
              stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"/>
          </svg>
          <div class="donut-label"><div class="donut-pct">${pct}%</div><div class="donut-frac">${correct}/${total}</div></div>
        </div>
        <div class="score-text">
          <h3>${correct} / ${total} 정답</h3>
          <p>정답률 ${pct}% · ${msg}</p>
          <div class="result-actions">
            <button class="res-btn wrongonly" id="retryWrongBtn" ${wrong+skipped===0?'disabled':''}>오답만 다시 풀기</button>
            <button class="res-btn retry" id="retrySameBtn">같은 문제 다시 풀기</button>
            <button class="res-btn" id="newQuizBtn">새 퀴즈 생성</button>
            <button class="res-btn" id="copyBtn">🗒 결과 복사</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${resultTab==='all'?'active':''}" data-tab="all">전체 (${total})</button>
      <button class="tab-btn ${resultTab==='correct'?'active':''}" data-tab="correct">맞은 (${correct})</button>
      <button class="tab-btn ${resultTab==='wrong'?'active':''}" data-tab="wrong">틀린 (${wrong})</button>
      <button class="tab-btn ${resultTab==='skipped'?'active':''}" data-tab="skipped">건너뜀 (${skipped})</button>
    </div>
    <div class="review-list">${reviewHTML}</div>
  </div>`;
}

function wrongHTML(){
  const cats = Object.keys(wrongNotes).filter(k=>wrongNotes[k] && wrongNotes[k].size>0);
  if(cats.length===0){
    return `<div class="wn-empty">
      <div style="font-size:30px;margin-bottom:10px;">🎉</div>
      아직 오답노트가 비어있어요. 퀴즈를 풀면 틀린 문제가 여기 쌓여요.
    </div>`;
  }
  const totalWrong = wrongCount();
  return `<div style="padding:22px 26px 4px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-weight:800;font-size:16px;">오답노트 <span style="color:var(--sub);font-weight:500;font-size:13px;">총 ${totalWrong}문제 · ${cats.length}개 카테고리</span></div>
    <div style="display:flex;gap:8px;">
      <button class="res-btn wrongonly" id="wnAllBtn">전체 오답 풀기</button>
      <button class="res-btn" id="wnClearBtn">전체 삭제</button>
    </div>
  </div>
  <div class="wn-grid">
    ${cats.map(k=>`<div class="wn-card" data-wncat="${k}">
      <div class="wn-cat">${CAT_META[k].icon} 오답노트</div>
      <div class="wn-name">${CAT_META[k].label}</div>
      <div class="wn-count">${wrongNotes[k].size}문제</div>
    </div>`).join('')}
  </div>`;
}

// ---------- handlers ----------
function attachHandlers(){
  document.getElementById('navHome').onclick = ()=>{ view = selectedCats.size? 'settings':'home'; render(); };
  document.getElementById('navWrong').onclick = ()=>{ view='wrong'; render(); };
  document.getElementById('wnTopLink').onclick = ()=>{ view='wrong'; render(); };
  document.getElementById('selAllBtn').onclick = ()=>{
    if(selectedCats.size===CAT_KEYS.length) selectedCats.clear();
    else CAT_KEYS.forEach(k=>selectedCats.add(k));
    view = selectedCats.size?'settings':'home';
    render();
  };
  document.querySelectorAll('.cat-card').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.cat;
      if(selectedCats.has(k)) selectedCats.delete(k); else selectedCats.add(k);
      view = selectedCats.size? 'settings':'home';
      render();
    };
  });

  if(view==='settings'){
    document.querySelectorAll('#countRow button').forEach(b=>{
      b.onclick=()=>{ const v=b.dataset.count; quizCount = v==='all'?'all':parseInt(v); render(); };
    });
    document.querySelectorAll('#orderRow button').forEach(b=>{
      b.onclick=()=>{ quizOrder=b.dataset.order; render(); };
    });
    document.getElementById('startBtn').onclick = ()=>{ buildSession(); render(); };
  }

  if(view==='quiz'){
    const {cur} = session;
    const a = session.answers[cur];
    const done = a.state!=='unanswered';
    if(!done){
      document.querySelectorAll('.opt-item').forEach(el=>{
        el.onclick = ()=>{ a.picked = parseInt(el.dataset.opt); render(); };
      });
      const checkBtn = document.getElementById('checkBtn');
      if(checkBtn) checkBtn.onclick = ()=>{
        const q = session.questions[cur];
        a.state = (a.picked===q.answerIdx)?'correct':'wrong';
        if(a.state==='wrong') saveWrong(q.cat, q.idx); else clearWrong(q.cat, q.idx);
        render();
      };
      const skipBtn = document.getElementById('skipBtn');
      if(skipBtn) skipBtn.onclick = ()=>{ a.state='skipped'; render(); };
    } else {
      const nextBtn = document.getElementById('nextBtn');
      if(nextBtn) nextBtn.onclick = ()=>{ session.cur++; render(); };
      const finishBtn = document.getElementById('finishBtn');
      if(finishBtn) finishBtn.onclick = ()=>{ tryFinish(); };
    }
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.onclick = ()=>{ session.cur=Math.max(0,cur-1); render(); };
    const exitBtn = document.getElementById('exitBtn');
    if(exitBtn) exitBtn.onclick = ()=>{ view = selectedCats.size?'settings':'home'; render(); };
    document.querySelectorAll('[data-jump]').forEach(el=>{
      el.onclick = ()=>{ session.cur = parseInt(el.dataset.jump); render(); };
    });
  }

  if(view==='result'){
    document.querySelectorAll('.tab-btn').forEach(el=>{
      el.onclick = ()=>{ resultTab = el.dataset.tab; render(); };
    });
    const rw = document.getElementById('retryWrongBtn');
    if(rw) rw.onclick = ()=>{
      const pool = session.questions.filter((q,i)=>session.answers[i].state!=='correct');
      session = {questions:pool, answers:pool.map(()=>({picked:null,state:'unanswered'})), cur:0};
      resultTab='all'; view='quiz'; render();
    };
    document.getElementById('retrySameBtn').onclick = ()=>{
      const pool = session.questions;
      session = {questions:pool, answers:pool.map(()=>({picked:null,state:'unanswered'})), cur:0};
      resultTab='all'; view='quiz'; render();
    };
    document.getElementById('newQuizBtn').onclick = ()=>{ view='settings'; render(); };
    document.getElementById('copyBtn').onclick = ()=>{
      const {correct,total,pct} = scoreOf();
      const txt = `SSAFY 이론 퀴즈 결과\\n${correct}/${total} 정답 (정답률 ${pct}%)`;
      navigator.clipboard && navigator.clipboard.writeText(txt).catch(()=>{});
      const btn = document.getElementById('copyBtn');
      const orig = btn.textContent; btn.textContent='✓ 복사됨'; setTimeout(()=>btn.textContent=orig,1200);
    };
  }

  if(view==='wrong'){
    document.querySelectorAll('.wn-card').forEach(el=>{
      el.onclick = ()=>{ buildWrongOnlySession(el.dataset.wncat); resultTab='all'; render(); };
    });
    const wnAll = document.getElementById('wnAllBtn');
    if(wnAll) wnAll.onclick = ()=>{
      let pool=[];
      Object.keys(wrongNotes).forEach(cat=>{
        [...wrongNotes[cat]].forEach(idx=>pool.push({cat,idx,...QUIZ_DATA[cat][idx]}));
      });
      session = {questions:pool, answers:pool.map(()=>({picked:null,state:'unanswered'})), cur:0};
      resultTab='all'; view='quiz'; render();
    };
    const wnClear = document.getElementById('wnClearBtn');
    if(wnClear) wnClear.onclick = ()=>{ wrongNotes={}; render(); };
  }
}

function tryFinish(){
  const unfinished = session.answers.filter(a=>a.state==='unanswered').length;
  if(unfinished>0){
    if(!confirm(`아직 풀지 않은 문제가 ${unfinished}개 있어요. 그래도 제출할까요?`)) return;
    session.answers.forEach(a=>{ if(a.state==='unanswered') a.state='skipped'; });
  }
  resultTab='all';
  view='result';
  render();
}

// theme
function initTheme(){
  const btn = document.getElementById('themeBtn');
  btn.onclick = ()=>{
    document.documentElement.classList.toggle('dark');
    btn.textContent = document.documentElement.classList.contains('dark') ? '☀️':'🌙';
  };
}

initTheme();
render();
</script>
</body>
</html>
