뢰도는 타당도의 필수조건이지만 충분조건은 아니어서 신뢰도가 높다고 해서 타당도가 반드시 높다고 할 수 없음","신뢰도는 측정대상의 특성을 얼마나 충실하게 측정하는가이며, 신뢰도가 높으면 타당도도 반드시 높음","신뢰도는 타당도의 충분조건임","신뢰도와 타당도는 서로 무관함"],"a":0,"exp":"신뢰도는 안정적 측정 정도이며, 타당도의 필수조건이지만 충분조건은 아니다.","id":"pyeongga-m164"},{"ch":"CH04 교육평가의 실제","t":"신뢰도","q":"신뢰도에 영향을 미치는 요인 중 '피험자 관련 요인'에 대한 설명으로 옳은 것은?","opts":["피험자 집단의 능력이 이질적(집단 내에 능력이 낮은 피험자부터 높은 피험자까지 고르게 포함)일 경우 검사의 신뢰도가 높음","검사의 문항 수가 증가하면 신뢰도는 증가함","검사가 시행되는 환경, 감독관, 채점자와 피험자의 관계 등이 신뢰도에 영향을 미침","문항의 난이도와 변별도를 조정함으로써 신뢰도를 높일 수 있음"],"a":0,"exp":"피험자 관련 요인은 집단의 능력이 이질적일 경우 신뢰도가 높다는 것이다. ②는 검사도구 관련 요인, ③은 검사시행 관련 요인이다.","id":"pyeongga-m165"},{"ch":"CH04 교육평가의 실제","t":"신뢰도","q":"신뢰도를 높이는 구체적인 방안으로 옳지 않은 것은?","opts":["좁은 범위의 내용을 포함하는 검사보다 넓은 범위의 내용을 포함하는 검사가 신뢰도가 더 높다","동일 조건이라면 문항 수가 많을수록 신뢰도는 높아질 수 있으며, 기존 문항의 내용과 특성이 잘 부합하는 양질의 문항이 추가될 때 신뢰도가 증가한다","문항의 난이도와 변별도를 조정함으로써 신뢰도를 높일 수 있다","요인분석 또는 문항분석을 실시하여 신뢰도를 낮추고 있는 문항을 찾아낸 후에 제거한다"],"a":0,"exp":"'넓은 범위의 내용을 포함하는 검사보다 좁은 범위의 내용을 포함하는 검사가 신뢰도가 더 높음'이 원칙이므로 ①은 정반대이다.","id":"pyeongga-m166"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"내적 일관성 신뢰도의 개념과 추정할 수 있는 계수로 옳은 것은?","opts":["검사를 한 번 실시하여 신뢰도를 추정하는 방법 / 동질성계수","검사를 두 번 실시하여 신뢰도를 추정하는 방법 / 안정성계수","서로 비슷한 검사를 두 번 시행하는 방법 / 동형성계수","채점자 간 일치도를 구하는 방법 / 객관도계수"],"a":0,"exp":"내적 일관성 신뢰도는 검사를 한 번 실시하여 신뢰도를 추정하는 방법이며 동질성계수를 추정한다. 추정방법은 반분신뢰도와 문항내적합치도이다.","id":"pyeongga-m167"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"반분신뢰도의 개념으로 옳은 것은?","opts":["하나의 검사를 시행하고 검사를 두 부분으로 분할한 후 두 검사의 문항 간 상관관계를 이용하여 신뢰도를 추정하는 방법으로, 스피어만-브라운 공식을 적용함","검사 속의 문항들을 각각 독립된 한 개의 검사로 보고 응답의 일관성에 근거하여 합치도를 종합하는 방법","동일한 평가도구를 시간 간격을 두고 두 번 실시하는 방법","서로 비슷한 검사를 두 번 시행하는 방법"],"a":0,"exp":"반분신뢰도는 하나의 검사를 두 부분으로 분할한 후 두 검사의 문항 간 상관관계를 이용해 신뢰도를 추정하는 방법이며 스피어만-브라운 공식을 적용한다.","id":"pyeongga-m168"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"반분신뢰도의 단점으로 옳은 것은?","opts":["검사를 분할하는 방법(짝수·홀수 문항, 검사의 전·후반부, 무작위 등)에 따라서 신뢰도에 영향을 줌","검사를 두 번 시행해야 하므로 기억효과가 발생함","동형검사를 제작하기 어려움","채점자에 따라 결과가 달라짐"],"a":0,"exp":"반분신뢰도의 단점은 검사를 분할하는 방법에 따라 신뢰도에 영향을 준다는 것이다(분할된 두 개의 검사가 동형검사가 되어야 함). 장점은 검사를 두 번 시행할 필요가 없어 시행이 편리하고 기억이나 연습효과를 배제할 수 있다는 점이다.","id":"pyeongga-m169"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"문항내적합치도의 개념과 사용되는 계수로 옳은 것은?","opts":["검사 속의 문항들을 각각 독립된 한 개의 검사로 보고, 문항에 반응하는 응답의 일관성에 근거하여 그들 간의 합치도·동질성·일치성을 종합하는 신뢰도 추정방법 / 크론바흐 α계수, KR-20, KR-21 등","검사를 두 부분으로 분할하여 상관을 구하는 방법 / 스피어만-브라운 공식","시간 간격을 두고 두 번 실시하는 방법 / 안정성계수","서로 비슷한 검사를 두 번 시행하는 방법 / 동형성계수"],"a":0,"exp":"문항내적합치도는 문항 각각을 독립된 검사로 보고 응답의 일관성에 근거하여 합치도·동질성·일치성을 종합하는 방법이며, 크론바흐 α계수, KR-20, KR-21 등을 사용한다. 장점은 하나의 검사로 신뢰도를 추정할 수 있다는 점이다.","id":"pyeongga-m170"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"검사-재검사 신뢰도의 개념과 추정 계수로 옳은 것은?","opts":["동일한 평가도구를 동일한 피험자들에게 시간 간격을 두고 두 번 실시한 다음 두 점수 간의 상관관계로 신뢰도를 추정하는 방법 / 안정성계수","하나의 검사를 두 부분으로 나누어 상관을 구하는 방법 / 동질성계수","서로 비슷한 검사를 두 번 시행하는 방법 / 동형성계수","문항들의 응답 일관성을 종합하는 방법 / 크론바흐 α계수"],"a":0,"exp":"검사-재검사 신뢰도는 동일 평가도구를 시간 간격을 두고 두 번 실시하여 두 점수 간 상관으로 추정하며 안정성계수를 얻는다.","id":"pyeongga-m171"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"검사-재검사 신뢰도의 단점으로 옳은 것은?","opts":["검사를 두 번 치르기 때문에 기억효과, 연습효과, 높은 피로 발생 등 시행효과가 발생하므로 검사 실시 간격을 적절하게 설정해야 함","동형검사 제작이 현실적으로 어려움","검사 분할 방법에 따라 신뢰도가 달라짐","하나의 검사로 신뢰도를 추정할 수 없음"],"a":0,"exp":"검사-재검사 신뢰도의 단점은 기억효과·연습효과·피로 등 시행효과 발생이며, 장점은 동일 검사를 두 번 시행하므로 검사 시행과 신뢰도 추정이 비교적 쉽다는 점이다.","id":"pyeongga-m172"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"동형검사 신뢰도와 동형검사에 대한 설명으로 옳은 것은?","opts":["동형검사 신뢰도는 동일한 피험자에게 똑같은 검사가 아닌 서로 비슷한 검사를 두 번 시행하여 상관계수로 신뢰도를 추정하며, 동형검사는 문항의 수, 난이도, 문항의 내용과 형식 등에서 동등한 검사이다","동형검사 신뢰도는 동일한 검사를 두 번 시행하는 방법이며, 동형검사는 문항 수만 같은 검사이다","동형검사 신뢰도는 하나의 검사를 반분하여 상관을 구하는 방법이다","동형검사 신뢰도는 채점자 간 일치도를 구하는 방법이다"],"a":0,"exp":"동형검사 신뢰도는 서로 비슷한 검사를 두 번 시행하여 상관계수로 추정하며(동형성계수), 동형검사는 문항 수·난이도·내용과 형식 등에서 동등한 검사이다.","id":"pyeongga-m173"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"동형검사 신뢰도의 장점과 단점으로 옳은 것은?","opts":["장점: 검사-재검사 신뢰도와는 달리 연습효과나 망각에 의하여 신뢰도 추정에 영향을 끼치는 것을 최소화할 수 있음 / 단점: 내용과 형식이 동일한 두 개의 동형검사를 제작하는 것이 현실적으로 쉽지 않음","장점: 검사를 한 번만 시행하면 됨 / 단점: 분할 방법에 따라 결과가 달라짐","장점: 기억효과가 발생함 / 단점: 시행이 번거로움","장점: 채점이 객관적임 / 단점: 채점자 훈련이 필요함"],"a":0,"exp":"동형검사 신뢰도의 장점은 연습효과나 망각의 영향을 최소화할 수 있다는 것이고, 단점은 동형검사 제작이 현실적으로 쉽지 않다는 것이다.","id":"pyeongga-m174"},{"ch":"CH04 교육평가의 실제","t":"객관도","q":"객관도의 개념으로 옳은 것은?","opts":["결과에 대해 여러 검사자나 채점자가 어느 정도로 일치된 평가를 하는가의 정도로, '검사자의 신뢰도'라고도 함","측정하고자 하는 것을 얼마나 안정적으로 측정하고 있는가","평가도구가 측정대상의 특성을 얼마나 충실하게 측정하고 있는지","평가에 소요되는 자원의 양과 질이 실용적인가를 나타내는 정도"],"a":0,"exp":"객관도는 여러 검사자나 채점자가 어느 정도로 일치된 평가를 하는가의 정도이며 '검사자의 신뢰도'라고도 한다.","id":"pyeongga-m175"},{"ch":"CH04 교육평가의 실제","t":"객관도","q":"객관도의 종류 중 '채점자 내 신뢰도'에 해당하는 것은?","opts":["한 채점자가 같은 측정대상을 여러 번 채점한 결과가 일관성이 있는가를 나타냄","2명 이상의 채점자가 채점을 했을 때 결과가 어느 정도 일치하는가","동일한 검사를 시간 간격을 두고 두 번 실시했을 때의 상관","동형검사를 두 번 시행했을 때의 상관"],"a":0,"exp":"채점자 내 신뢰도는 한 채점자가 같은 측정대상을 여러 번 채점한 결과의 일관성이다. ②는 채점자 간 신뢰도(일치도)이다.","id":"pyeongga-m176"},{"ch":"CH04 교육평가의 실제","t":"평정의 오류","q":"평정의 오류 중 '후광효과(인상의 오류)'에 해당하는 것은?","opts":["평정대상에 대하여 가진 특정 인상을 토대로 다른 특성을 좋거나 나쁘게 평정하는 오류","논리적으로 전혀 관계가 없는 두 가지 행동특성을 관련 있는 것으로 판단하는 오류","다른 사람을 판단함에 있어서 절대적 기준에 기초하지 않고 다른 대상과의 비교 또는 자신과의 비교를 통해 평가하는 오류","비교적 유사한 항목들이 시간적·공간적으로 가까이 있을 때 비슷하게 평정하는 오류"],"a":0,"exp":"후광효과(인상의 오류)는 특정 인상을 토대로 다른 특성을 좋거나 나쁘게 평정하는 오류이다. ②는 논리적 오류, ③은 대비의 오류, ④는 근접의 오류이다.","id":"pyeongga-m177"},{"ch":"CH04 교육평가의 실제","t":"평정의 오류","q":"평정의 오류 중 '집중경향의 오류'에 해당하는 것은?","opts":["평정 시 극단적 평정치를 주는 것을 피하고 중간 점수를 주로 주는 오류","평가자가 표준을 어디에 두는가에서 오는 오류","평가자가 피평가자의 행동을 면밀하게 관찰하지 못한 경우 발생하는 오류","특정 학생에게 특정한 상을 주기 위해 관찰결과와 다르게 과장하여 평가하는 오류"],"a":0,"exp":"집중경향(집중화경향)의 오류는 극단적 평정치를 피하고 중간 점수를 주로 주는 오류이다. ②는 표준의 오류, ③은 무관심의 오류, ④는 의도적 오류이다.","id":"pyeongga-m178"},{"ch":"CH04 교육평가의 실제","t":"평정의 오류","q":"평정의 오류 중 '일반화 오류'에 해당하는 것은?","opts":["한 교과에서 학생이 보이는 정의적 특성이 다른 교과에도 적용된다고 판단하는 오류","평가자가 자신과 관련되어 있는 피평가자의 실제 직무수행이나 성과보다 높게 평가하는 오류","평가자가 평가대상자의 실제 수행수준보다 낮은 수준으로 평가하는 오류","논리적으로 관계가 없는 두 행동특성을 관련 있는 것으로 판단하는 오류"],"a":0,"exp":"일반화 오류는 한 교과에서의 정의적 특성이 다른 교과에도 적용된다고 판단하는 오류이다. ②는 관대의 오류, ③은 엄격의 오류, ④는 논리적 오류이다.","id":"pyeongga-m179"},{"ch":"CH04 교육평가의 실제","t":"평정의 오류","q":"평정의 오류 중 '대비의 오류'에 대한 설명으로 옳은 것은?","opts":["다른 사람을 판단함에 있어서 절대적 기준에 기초하지 않고 다른 대상과의 비교 또는 자신과의 비교를 통해 평가하는 오류","비교적 유사한 항목들이 시간적·공간적으로 가까이 있을 때 비슷하게 평정하는 오류","평가자가 표준을 어디에 두는가에서 오는 오류","중간 점수를 주로 주는 오류"],"a":0,"exp":"대비의 오류는 절대적 기준이 아니라 다른 대상 또는 자신과의 비교를 통해 평가하는 오류이다.","id":"pyeongga-m180"},{"ch":"CH04 교육평가의 실제","t":"실용도","q":"실용도의 개념으로 옳은 것은?","opts":["평가방법, 도구의 제작과정, 시행방법, 절차, 평가결과를 채점하거나 분석하기 위해 소요되는 인적·물적 자원의 양과 질이 주변 여건에 비추어 실용적인가를 나타내는 정도","측정대상의 특성을 얼마나 충실하게 측정하는가","얼마나 안정적으로 측정하는가","여러 채점자가 얼마나 일치된 평가를 하는가"],"a":0,"exp":"실용도는 평가에 소요되는 인적·물적 자원의 양과 질이 주변 여건에 비추어 실용적인가를 나타내는 정도이다.","id":"pyeongga-m181"},{"ch":"CH04 교육평가의 실제","t":"실용도","q":"실용도 확보 시 고려사항으로 옳지 않은 것은?","opts":["문항의 난이도가 높아야 함","실시 방법이 쉬워야 함","실시하는 데 소요되는 시간이 적절해야 함","채점하기 쉽고 결과를 해석하거나 활용하기 쉬워야 함"],"a":0,"exp":"실용도의 고려사항은 ①실시 방법이 쉬워야 함 ②소요 시간이 적절해야 함 ③채점하기 쉬워야 함 ④결과를 해석하거나 활용하기 쉬워야 함이다.","id":"pyeongga-m182"},{"ch":"CH04 교육평가의 실제","t":"문항분석","q":"문항분석의 개념으로 옳은 것은?","opts":["검사에 포함된 문항 하나하나를 평가가 의도한 기능을 제대로 수행하고 있는가를 점검하는 것으로, 문항의 양호도에 대한 판단을 의미함","평가에 대한 평가","검사 전체의 신뢰도를 추정하는 것","평가결과를 학생에게 피드백하는 것"],"a":0,"exp":"문항분석은 검사에 포함된 문항 하나하나가 평가가 의도한 기능을 제대로 수행하는지 점검하는 것으로 문항의 양호도에 대한 판단을 의미한다.","id":"pyeongga-m183"},{"ch":"CH04 교육평가의 실제","t":"문항분석","q":"문항분석의 필요성으로 제시되지 않은 것은?","opts":["학생의 상대적 서열을 정확히 산출하기 위함","문항분석을 통하여 문항이 평가목적을 제대로 수행하고 있는지를 확인하는 작업이 필요함","개별 문항 자체의 양호도를 분석하여 문항의 질을 개선하기 위함","만들어진 문항의 장기적인 사용을 위해서는 문제은행을 개발해야 하는데, 이때 문항분석은 선행조건이 됨"],"a":0,"exp":"문항분석의 필요성은 ②③④이다.","id":"pyeongga-m184"},{"ch":"CH04 교육평가의 실제","t":"문항 지표","q":"'문항변별도'의 개념으로 옳은 것은?","opts":["문항이 검사를 통해 측정하고자 하는 능력의 수준이 높은 사람과 낮은 사람을 구별해낼 수 있는 정도","문항이 어려운 정도를 나타내는 것","능력이 전혀 없는 학생이 추측을 통해 정답을 맞힐 정도","문항의 수행 정도가 피검자나 문항 특성에 따라 불리하거나 유리한 정도"],"a":0,"exp":"문항변별도는 능력 수준이 높은 사람과 낮은 사람을 구별해낼 수 있는 정도이다. ②는 문항곤란도, ③은 문항추측도, ④는 문항편파성이다.","id":"pyeongga-m185"},{"ch":"CH04 교육평가의 실제","t":"문항 지표","q":"'문항적합도'의 개념으로 옳은 것은?","opts":["특정 문항에 대하여 모형에서 예측한 응답유형과 실제 자료상의 응답유형 간의 차이를 통해 해당 문항이 일반적인 응답유형과 비교하여 얼마나 일치하는지를 보여주는 통계지수","문항이 어려운 정도","높은 능력자와 낮은 능력자를 구별하는 정도","추측을 통해 정답을 맞힐 정도"],"a":0,"exp":"문항적합도는 모형에서 예측한 응답유형과 실제 자료상의 응답유형 간 차이를 통해 해당 문항이 일반적인 응답유형과 얼마나 일치하는지 보여주는 통계지수이다.","id":"pyeongga-m186"},{"ch":"CH04 교육평가의 실제","t":"문항 지표","q":"'문항편파성'의 개념으로 옳은 것은?","opts":["문항의 수행 정도가 피검자나 문항 특성에 따라 불리하거나 유리한 정도를 의미","문항이 어려운 정도를 나타내는 것","능력이 없는 학생이 추측으로 맞힐 정도","모형 예측 응답유형과 실제 응답유형의 일치 정도"],"a":0,"exp":"문항편파성은 문항의 수행 정도가 피검자나 문항 특성에 따라 불리하거나 유리한 정도를 의미한다.","id":"pyeongga-m187"},{"ch":"CH04 교육평가의 실제","t":"질적 문항분석","q":"질적 문항분석 시 확인사항으로 옳지 않은 것은?","opts":["문항의 정답이 논쟁거리가 되더라도 변별력이 높으면 그대로 사용한다","문항이 검사목적을 잘 수행하고 있는지, 모집단을 잘 대표하는 문항으로 구성되어 있는지 살펴보아야 하며, 미리 문항 개발 당시 제작한 이원분류표와 일치하는지 확인한다","문항이 해당 학생의 언어수준이나 검사 시행상황 등을 고려하여 출제되었는가를 확인한다","선다형 문항이라면 오답지가 매력적인가를 확인한다"],"a":0,"exp":"'문항의 정답이 논쟁거리가 되지는 않는가를 확인함'이 확인사항이므로 ①은 정반대이다.","id":"pyeongga-m188"}],"essay":[{"ch":"CH01 교육평가의 이해","t":"기본가정","q":"교육평가의 기본가정 3가지를 제시하시오.","ans":"① 학습자의 잠재능력 개발 가능성: 인간은 개발할 수 있는 무한한 잠재능력을 지니고 있음\n② 교육평가의 대상과 자료의 무한성: 어떠한 행위, 대상, 자료도 교육평가의 대상으로 자료는 무한함\n③ 시간의 연속성: 일회적으로 실시하고 종료하는 것이 아니라 지속적으로 이루어져야 함\n④ 평가의 종합성: 평가대상이 가지고 있는 모든 자료를 종합적으로 수집하여 평가하여야 함","kw":["잠재능력","무한성","시간의 연속성","종합성"],"id":"pyeongga-e0"},{"ch":"CH01 교육평가의 이해","t":"목적과 기능","q":"교육평가의 목적과 기능 각각 2가지를 제시하시오.","ans":"목적\n① 학습을 극대화함 ② 학업성취수준을 총평함 ③ 교육의 질을 향상시킴 ④ 교육과정, 교수·학습 프로그램, 교육자료 등을 개선함 ⑤ 정책구안이나 의사결정을 위한 기초를 제공함 ⑥ 공공기금의 지출을 점검함\n기능\n① 교육의 진행과정에 있는 교육과정, 프로그램, 교구, 교재 등을 개선하고 발전시킴\n② 신입생 또는 신입사원을 선발하거나 자격증을 부여함\n③ 교육의 질을 통제하기 위하여 국가단위나 지역단위의 학업성취도 시험을 실시하여 교육에 대한 책임 여부를 점검함\n④ 평가 자체가 행위에 대한 동기를 부여함","kw":["학습을 극대화","교육의 질","개선","선발","자격증","책임","동기"],"id":"pyeongga-e1"},{"ch":"CH01 교육평가의 이해","t":"측정관","q":"평가의 개념에 따른 분류 중 측정관의 의미, 특징 2가지, 이와 관련된 교육관의 명칭을 이것의 개념과 함께 제시하시오.","ans":"의미: 정해진 규정 및 법칙에 따라 사물의 속성을 수량화·객관화하는 것\n특징\n① 신뢰성이 높고 객관성 있는 측정을 위해서는 어떤 상황이나 시점, 평가자와 상관없이 동일한 결과를 얻어야 함\n② 측정하는 절차에 대한 표준화가 요구됨\n③ 사람이나 사물의 속성을 측정할 때에는 측정단위인 '척도(scale)'를 설정해야 함\n교육관 — 선발적 교육관: 인간의 지적 능력은 타고난다고 생각하며 우수자 선발을 평가의 목적으로 삼음. 교육을 통한 인간 행동 변화에 부정적","kw":["수량화","객관화","표준화","척도","선발적 교육관","타고난다"],"id":"pyeongga-e2"},{"ch":"CH01 교육평가의 이해","t":"총평관","q":"평가의 개념에 따른 분류 중 총평관의 의미와 특징 각각 1가지, 이러한 관점에서 학생을 평가하는 방안 1가지, 이와 관련된 교육관의 명칭을 이것의 개념과 함께 제시하시오.","ans":"의미: 수집된 정보뿐만 아니라 측정되지 않은 정보, 즉 수량화되지 않은 정보까지 모두 포함해서 사물을 종합적으로 파악하는 것\n특징\n① 양적 자료와 질적 자료를 모두 이용할 수 있음\n② 주로 평가대상에 대해서 전인적 평가를 진행하고자 할 때 사용함\n방안\n① 학교생활기록부: 해당 학생의 교과별 학업성취도뿐 아니라 출석정보, 전인적 발달을 포함하는 행동특성, 면담기록, 독서기록, 희망진로 등 학생을 종합적으로 파악할 수 있는 다양한 정보를 기술함\n② 수행평가: 지필검사에 의하여 학습자를 평가하는 수준을 넘어 보다 종합적인 평가를 통해 학생들을 평가함\n교육관 — 인본주의적 교육관: 교육은 자아실현의 과정으로 보며, 학습자는 환경과 능동적으로 상호작용하는 존재로 여김. 교육 실패는 학습자와 교사의 공동책임. 전인적인 특성을 파악하고자 함","kw":["종합적으로 파악","양적 자료","질적 자료","전인적 평가","학교생활기록부","수행평가","인본주의적 교육관","자아실현","공동책임"],"id":"pyeongga-e3"},{"ch":"CH01 교육평가의 이해","t":"평가관","q":"평가의 개념에 따른 분류 중 평가관의 의미와 특징 1가지, 이를 적용하여 학생을 평가하는 방안 1가지, 이와 관련된 교육관의 명칭을 이것의 개념과 함께 제시하시오.","ans":"평가관: 검사를 통해 사물의 속성을 수량화하거나 관찰, 면담 등 수량화하기 어려운 정보를 종합적으로 수집하는 것에서 나아가 그 결과에 대한 가치판단을 통하여 사물의 속성을 세밀하게 파악하는 것까지 포함\n특징\n① 평가도구가 의도한 목표를 얼마나 잘 대표하고 있는가, 교육목표 달성 여부를 판단하기 위한 증거들이 타당한가에 중점을 둠\n② 평가는 측정과 총평 양쪽 모두를 포괄할 수는 있으나 가치판단 요소가 내재되어 있어야 함\n방안: 학업성취도에 대해서 검사도구를 활용하여 '측정'하거나 평소 학생의 수업 참여도에 대해서 비공식적 관찰을 통해 '총평'하는 것에서 나아가 최근 몇 개월간의 학습 개선도 등을 기준으로 개별 학생에 대한 가치판단을 하는 것으로, 즉 우수하거나 미흡한지에 대한 종합적 판단과 강·약점에 대한 진단 및 개선방안에 대한 조언을 함께 제시함\n교육관 — 발달적 교육관: 모든 학습자에게 적절한 교수·학습방법만 제시되면 누구나 의도하는 바의 주어진 교육목표를 달성할 수 있다고 여김. 교육의 실패는 교사의 책임으로 여김","kw":["가치판단","측정","총평","포괄","발달적 교육관","교사의 책임"],"id":"pyeongga-e4"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"총괄적 평가의 목적과 총괄적 평가 수행 시 학습과 평가의 관계를 설명하시오.","ans":"목적: 학생의 인지적·정의적·심동적 영역의 성장·발달 수준을 변별하거나 판단하기 위함\n학습과 평가의 관계: 학습에 대한 평가\n∙규준참조평가 ⇒ 학생의 성취도가 규준을 바탕으로 어디에 위치하는지를 판단\n∙준거참조평가 ⇒ 성취기준에 어느 정도 도달했는지 판단","kw":["변별","판단","학습에 대한 평가","규준참조평가","준거참조평가"],"id":"pyeongga-e5"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"형성적 평가의 목적과 형성적 평가 수행 시 학습과 평가의 관계 2가지를 설명하시오.","ans":"목적\n① 학생의 인지적·정의적·심동적 영역의 성장·발달 수준을 이해하여 교수·학습과정을 개선하기 위함\n② 평가가 교수·학습을 만들어간다는 의미로, 평가를 통해 개별 학생들의 학습을 돕기 위함\n학습과 평가의 관계\n① 학습을 위한 평가: 교수·학습과정 중에 시행하여 그다음 단계의 교수법을 개선하고 피드백을 제공하기 위한 평가\n② 학습으로서의 평가: 교사는 학생이 문제해결 과정에서 드러내는 탁월성(지식이나 기능)이나 적극성(태도)을 평가하고 피드백을 통해 학생의 학습과정을 지도·조언함. 학생은 교사의 피드백이나 자기평가를 통해 학습과정을 주도적으로 성찰함","kw":["교수·학습과정을 개선","학습을 위한 평가","학습으로서의 평가","탁월성","적극성","주도적으로 성찰"],"id":"pyeongga-e6"},{"ch":"CH01 교육평가의 이해","t":"평가결과 활용","q":"평가결과를 효과적으로 활용하기 위한 교사의 역할 3가지를 제시하시오.","ans":"① 유용한 정보 제공: 평가결과가 학생의 다음 단계의 학습을 위한 유용한 정보를 제공해야 함\n② 실질적인 의사소통: 학생을 적절하게 동기화하기 위해서는 단순 보고와 기록에 그치지 않고 평가결과를 토대로 학생 및 학부모와의 실질적인 의사소통을 해야 함\n③ 풍부한 피드백 제공: 교사의 구체적이고 풍부한 피드백을 통해 학생은 자신의 학습상태를 스스로 이해하고, 다음 단계의 학습을 계획하도록 할 필요가 있음\n④ 다음 단계 학습을 위한 계획: 교사는 학생의 다음 단계 학습을 위하여 교사가 가르쳐야 할 내용이나 안내해야 하는 활동에 대해 계획할 수 있음","kw":["유용한 정보 제공","실질적인 의사소통","풍부한 피드백","다음 단계 학습을 위한 계획"],"id":"pyeongga-e7"},{"ch":"CH01 교육평가의 이해","t":"학습을 위한 평가","q":"평가결과가 학습을 위한 평가로 활용되기 위한 과제 2가지를 제시하시오.","ans":"① 준거참조평가와 성장참조평가 강조: 학습의 목표에 비추어 자신의 현 상태를 이해하고, 그 목표를 성취하기 위해 필요한 정보를 얻기 위해서 평가를 받도록 함\n② 교사의 긍정적인 피드백: 피드백은 1차적으로 학생 스스로 자신의 학습에 대해 반성할 수 있는 기회를 제공하고, 나아가 긍정적인 피드백은 그 자체로 학생의 학습동기를 촉진하는 데 상당한 효과가 있음\n③ 교사의 전문성 계발 지원: 교사의 학생평가 전문성은 교수·학습활동 자체를 위해 중요함","kw":["준거참조평가","성장참조평가","긍정적인 피드백","전문성 계발"],"id":"pyeongga-e8"},{"ch":"CH01 교육평가의 이해","t":"메타평가","q":"메타평가의 개념, 목적 2가지, 유형 3가지와 메타평가의 평가기준 3가지를 제시하시오.","ans":"메타평가: 평가에 대한 평가\n목적\n① 평가 자체를 보다 정확하게 이해하고 평가활동의 질적 수준을 향상시키기 위해 실시함\n② 평가상의 문제점을 파악하고 확인하여 개선하고자 함\n③ 평가과정 중 안내지침을 제공하고, 수행된 평가에 대한 가치와 장점을 판단함\n유형\n① 평가계획에 대한 진단적 메타평가\n② 평가 실행과정에 대한 형성적 메타평가\n③ 평가결과에 대한 총괄적 메타평가(평가의 가치, 장점, 확인)\n평가기준\n① 실현성(feasibility): 평가가 실현 가능하였는가\n② 실용성(utility): 평가가 실제적으로 필요하였는가\n③ 적합성(propriety): 평가가 도덕적으로 적합하게 실시되었는가\n④ 정확성(accuracy): 정확한 정보를 전달하였는가","kw":["평가에 대한 평가","진단적","형성적","총괄적","실현성","실용성","적합성","정확성"],"id":"pyeongga-e9"},{"ch":"CH02 교육평가의 모형","t":"타일러","q":"타일러(Tyler)의 목표중심평가모형의 특징 2가지, 장점과 단점 각각 2가지를 제시하시오.","ans":"특징\n① 교육목표가 평가에서 핵심적인 역할을 함\n② 교육목표의 행동적 정의와 명세적 진술은 측정 및 평가를 용이하게 해주며 평가의 효율성을 증대시킴\n③ 교육평가가 평가 자체를 위해 존재하는 것이 아니라 교육의 전체 과정과 관련되어 있다고 봄\n장점\n① 교육과정과 평가 사이의 논리적 일관성이 유지될 수 있음\n② 교육목표가 구체적이어서 정확한 평가기준의 적용이 가능함\n③ 논리적·합리적 절차가 명확히 제시되어 있어 적용이 쉬움\n단점\n① 사전 목표의 설정을 강조함으로써 부수적·확산적 목표의 중요성을 간과할 수 있음\n② 행동적 용어로 진술하기 힘든 목표에 대해서는 평가가 어려움\n③ 과정보다는 결과에 대한 평가를 강조하고 있어 수업이 평가에 종속될 수 있음\n④ 교육 실제의 복합적이고 복잡한 측면을 평가하기 어려움","kw":["교육목표","행동적 정의","명세적 진술","논리적 일관성","부수적","확산적 목표","수업이 평가에 종속"],"id":"pyeongga-e10"},{"ch":"CH02 교육평가의 모형","t":"프로버스","q":"프로버스(Provus)의 불일치평가모형에서 평가의 역할 1가지, 불일치 정보를 도출하는 방안 1가지와 이의 활용방안 1가지를 제시하시오.","ans":"평가의 역할\n① 평가를 프로그램의 운영과 개발로 나누어 단계별로 의사결정을 도와주기 위하여 정보를 지속적으로 관리하는 과정으로 봄\n② 프로그램의 개선·유지·종료 여부를 결정하기 위하여 불일치에 대한 정보를 사용하는 과정임\n불일치 정보 도출 방안: 성취기준과 수행을 비교함\n활용방안: 불일치 정보는 프로그램의 개선·유지·종료를 위한 정보로 활용됨. 불일치가 발견될 경우 프로그램 진행자와 평가자가 협동적인 문제해결 과정을 통해 불일치를 제거함","kw":["단계별 의사결정","불일치","성취기준과 수행","개선·유지·종료","협동적인 문제해결"],"id":"pyeongga-e11"},{"ch":"CH02 교육평가의 모형","t":"해몬드","q":"해몬드(Hammond)의 평가과정모형에서 3차원 입방체의 요소 3가지와 이 모형의 장점과 단점 각각 1가지를 제시하시오.","ans":"3차원 입방체 요소: 수업, 기관, 행동\n장점\n① 새로운 프로그램을 개발하고 적합성, 효율성을 확인하는 데 이용 가능함\n② 현재 실행하고 있는 프로그램의 수정·보완에 필요한 정보를 수집하는 데 사용됨\n단점\n① 평가할 차원 또는 요소가 너무 많음\n② 평가결과를 수량화시키기 어려운 부분이 있음","kw":["수업","기관","행동","적합성","효율성","수정·보완","수량화"],"id":"pyeongga-e12"},{"ch":"CH02 교육평가의 모형","t":"스크리븐","q":"스크리븐(Scriven)의 탈목표평가모형의 특징 4가지, 장점과 단점 각각 2가지를 제시하시오.","ans":"특징\n① 탈목표(goal-free) 평가 강조: 프로그램이 의도했던 효과뿐만 아니라 부수적인 효과까지 포함하여 실제 효과를 평가하는 방식으로, 프로그램의 모든 효과를 포괄적인 입장에서 검토할 필요성을 강조함\n② 교육목표 자체의 질과 가치를 평가: 교육목표 자체의 질과 가치를 중시하는 평가의 필요성을 강조함\n③ 내재적 준거에 의한 평가뿐만 아니라 외재적 준거에 의한 평가도 강조: 프로그램에 내재된 기본적 속성(목표, 내용선정과 조직 등)인 내재적 준거에 의한 평가뿐 아니라 프로그램이 발휘하는 기능적 속성(실제 운영상황, 프로그램의 효과 등)인 외재적 준거에 의한 평가를 통해 실제 결과에 초점을 둠\n④ 형성평가와 총괄평가(총합평가) 구별: 진행 중인 프로그램을 개선하기 위하여 실시하는 '형성평가'와 이미 완성된 프로그램의 가치를 총합적으로 판단하기 위해 실시하는 '총괄평가'를 구별하여 판단함\n⑤ 비(非)비교평가뿐만 아니라 비교평가도 강조: 다른 여러 가지 교육 프로그램과 교육목표 등을 서로 비교하여 판단하는 평가를 강조함\n장점\n① 교육과정 중 발생하는 잠재적 결과까지 포함해 교육의 실제적 효과를 평가함\n② 교육의 결과를 총체적으로 판단하는 전문적 평가를 중시함\n③ 목표가 전혀 없는 상황에서도 평가 수행이 가능함\n④ 목표에 반영되어 있지 않은 프로그램의 부수적 효과 탐색에도 관심이 있음\n단점\n① 각기 다른 판단준거를 사용하여 내린 결과를 동일하게 생각하는 문제가 발생할 수 있음\n② 판단의 타당성을 평가하는 방법이 부재함","kw":["탈목표","부수적인 효과","교육목표 자체의 질과 가치","내재적 준거","외재적 준거","형성평가","총괄평가","비교평가","판단준거","타당성"],"id":"pyeongga-e13"},{"ch":"CH02 교육평가의 모형","t":"스테이크","q":"스테이크(Stake)의 반응적 평가모형의 목적 1가지와 평가의 대상 3가지를 제시하시오.","ans":"목적: 교육 프로그램의 여러 측면에 대한 전체적인 실상을 평가하기 위함\n평가의 대상\n① 선행조건: 수업 실시 이전의 학습자 및 교사의 특성, 교육과정, 교육시설, 학교환경 등\n② 실행과정: 수업 중 교사와 학생 또는 학생과 학생 간의 상호작용 과정\n③ 성과요인: 수업 프로그램의 효과","kw":["전체적인 실상","선행조건","실행과정","성과요인"],"id":"pyeongga-e14"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner)의 평가모형의 특징 2가지와 이 모형에서 평가관점 2가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"특징\n① 예술교육에 대한 관점을 질적인 형태로 조합하여 교육적 감식안과 교육비평이라는 평가관점을 제시함\n② 자료에 대한 통계적 분석을 지양함\n③ 평가자의 전문성이나 경험에 입각한 질적 평가를 중시함\n④ 평가자의 지각적 민감성, 풍부한 경험, 세련된 통찰, 전문가적 판단 등과 같은 평가자의 전문성과 자질이 무엇보다 중시됨\n평가관점\n① 교육적 감식안: 교육현장에서 관찰할 수 있는 일상적인 것들 간 존재하는 미묘한 질적 차이를 감지하는 것 ⇒ 감식의 대상: 교육의 의도, 학교의 구조, 교육과정, 교수법, 평가\n② 교육비평: 교육적 감식안을 통해 지각한 사건이나 사물의 특징과 중요성을 비판적인 글로 표현하는 일종의 표출예술, 공적인 성질의 행동","kw":["교육적 감식안","교육비평","통계적 분석을 지양","질적 평가","지각적 민감성","표출예술"],"id":"pyeongga-e15"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너 평가모형에서 비평의 3가지 측면을 설명하고, 장점과 단점 각각 1가지를 제시하시오.","ans":"비평의 측면\n① 기술적 측면: 교육현상을 사진 보듯이 사실 그대로 묘사하고 표현함. 관찰과 감상을 통해 얻은 교육현상의 질적 속성을 정확하게 기술하고 묘사하는 데 중점을 둠\n② 해석적 측면: 교육현상에 대한 기술을 바탕으로 사회적 맥락 속에서 수행되는 다양한 형태의 행동이 지닌 의미와 중요성을 이해하고 그 가치를 논리적으로 설명함\n③ 평가적 측면: 기술하고 해석한 교육현상에 대하여 교육적 의미와 가치를 발견하고 질적으로 판단함\n장점\n① 교육적 관찰에 대한 질적인 해석을 시도함\n② 선행훈련, 경험, 정련된 지각능력을 강조함으로써 다양한 교육 실제에 대한 교사의 이해력을 높임\n③ 평가자료의 해석을 깊이 있게 할 수 있음\n단점: 평가자의 전문성에 지나치게 의존하므로 평가의 주관성에 관한 문제를 초래할 수 있음","kw":["기술적 측면","해석적 측면","평가적 측면","질적인 해석","주관성"],"id":"pyeongga-e16"},{"ch":"CH02 교육평가의 모형","t":"CIPP","q":"스터플빔(Stufflebeam)의 CIPP 모형에서 평가의 개념과 이 모형의 장점과 단점 각각 2가지를 제시하시오.","ans":"개념\n① 교육평가의 기능은 (교육목표의 달성도를 확인하는 것이 아니라) 교육에 관한 의사결정을 촉진하고 도와주는 것으로 보는 평가모형임\n② 평가란 의사결정의 대안을 판단하는 데 필요한 정보를 획득·기술·제공하는 과정임\n장점\n① 어떠한 프로그램의 단계에서도 평가를 실행할 수 있고 여러 상황 또는 모든 요소에 대한 평가가 가능함\n② 피드백에 민감하며 의사결정과 평가 간에 체계적인 접근이 가능함\n③ 프로그램의 개선에 직접적으로 기여할 수 있음\n단점\n① 의사결정 과정이 명확하지 않고 의사결정 방법이 구체적으로 정의되지 않음\n② 평가자는 정보를 수집·제공만 하고 가치판단은 의사결정자에게 위임 ⇒ 평가자의 역할이 경시됨\n③ 모든 과정에 대해 평가하기에는 비용이 많이 들고 복잡함\n④ 가치평가는 이루어지지 않고, 오직 가치평가에 필요한 정보만 수집하여 제공함","kw":["의사결정을 촉진","획득","기술","제공","피드백에 민감","가치판단","의사결정자에게 위임"],"id":"pyeongga-e17"},{"ch":"CH02 교육평가의 모형","t":"CIPP","q":"스터플빔(Stufflebeam)의 CIPP 모형에서 이루어지는 하위평가의 유형 4가지와 각 단계별 평가를 통해 획득한 정보를 활용하여 이루어지는 의사결정 유형의 명칭을 이의 구체적인 내용과 함께 제시하시오.","ans":"C: 상황평가 — 계획 의사결정: 목표를 설정하려는 의사결정으로, 목표설정을 위한 합리적 기초나 이유를 제공하기 위한 평가\nI: 투입평가 — 구조화 의사결정: 설정된 목표 달성에 적합한 전략과 절차 등 프로그램 구성에 대한 의사결정을 위한 평가\nP: 과정평가 — 실행 의사결정: 수립된 전략과 절차의 실행 등 프로그램 실행에 도움을 주는 평가\nP: 산출평가 — 재순환 의사결정: 목표 달성 정도의 판단 및 프로그램의 존속·변경 여부 판단","kw":["상황평가","계획 의사결정","투입평가","구조화 의사결정","과정평가","실행 의사결정","산출평가","재순환 의사결정"],"id":"pyeongga-e18"},{"ch":"CH02 교육평가의 모형","t":"제4세대 평가","q":"구바(Guba)와 링컨(Lincoln)의 관점에 따를 때 제4세대 평가모형의 특징 2가지를 제시하시오.","ans":"① 현상학적·해석학적·구성주의적 패러다임에 대한 새로운 평가적 접근방법을 제안함\n② 평가자의 주관적 관찰과 판단을 지나치게 강조 ⇒ 평가자의 선입견·임의성 등이 평가 계획·실시·결과에 악영향을 미칠 수 있음","kw":["현상학적","해석학적","구성주의적","주관적 관찰","선입견","임의성"],"id":"pyeongga-e19"},{"ch":"CH03 교육평가의 유형","t":"규준지향평가","q":"규준지향평가의 개념과 규준지향평가의 장점과 단점 각각 2가지를 제시하시오.","ans":"개념: 학습자의 평가결과를 (그가 속한) 규준집단(비교집단) 내에서의 상대적 위치나 서열을 통해 밝히는 평가방식. '상대평가' 또는 '상대비교평가'라고도 함\n장점\n① 상대적인 비교가 가능한 표준점수를 활용하기 때문에 개인차 변별이 용이함\n② 선발적 교육관에 바탕을 두며 경쟁학습을 강조하기 때문에 외적 동기유발에 긍정적으로 작용함\n③ 객관적 검사를 통해 성적이 표시되므로 교사의 편견이 배제됨\n단점\n① 학생 간의 경쟁을 고조시켜 서열 위주의 사고방식이 팽배해짐\n② 교실에서의 협동학습이 무시될 수 있음\n③ 학생이 교수·학습목표를 얼마나 달성하였고, 구체적으로 무엇을 알고, 얼마나 수행할 수 있는지를 파악하기 어려움\n④ 상대적 위치에 관한 정보만 제공하므로 개인의 결손 확인 후 개선되어야 할 정보 제공을 충분히 하지 못함","kw":["규준집단","상대적 위치","서열","상대평가","개인차 변별","외적 동기유발","경쟁","협동학습"],"id":"pyeongga-e20"},{"ch":"CH03 교육평가의 유형","t":"규준","q":"규준의 개념과 규준의 필요성 1가지를 제시하시오.","ans":"규준: 원점수를 의미 있게 비교·해석할 수 있도록 변환한 점수의 척도. 대상집단의 전형적인 수행수준을 보여주는 규준집단의 점수분포를 의미함\n필요성: 시험을 통하여 얻은 원점수는 그 자체로 상대적 비교를 하는 데 직접적으로 활용되기 어려움 ⇒ 규준지향평가에서는 상대적인 비교의 근거가 되는 규준이 필요함","kw":["원점수","변환한 점수의 척도","규준집단","점수분포","상대적 비교"],"id":"pyeongga-e21"},{"ch":"CH03 교육평가의 유형","t":"규준점수","q":"규준점수의 개념과 규준점수(표준점수)의 종류 3가지를 제시하시오.","ans":"규준점수: 규준을 기준으로 원점수에 대한 상대적 위치를 나타내는 점수\n종류: ① Z점수 ② T점수 ③ 스테나인 점수(9분점수)","kw":["상대적 위치","Z점수","T점수","스테나인","9분점수"],"id":"pyeongga-e22"},{"ch":"CH03 교육평가의 유형","t":"스테나인","q":"스테나인 점수의 개념과 스테나인 점수의 장점과 단점 각각 2가지를 제시하시오.","ans":"스테나인 점수: 평균 5, 표준편차를 2로 표준화하여 9개의 범주로 표현한 표준점수(9개의 범주를 가진 표준점수) ⇒ 모든 원점수를 1~9까지의 한 자리 숫자 체계로 전환시킨 것\n장점\n① 피검사자를 일정 비율로 대략 분류하므로 피검사자의 점수가 작은 점수차로도 확대 해석되는 것을 방지할 수 있음\n② 상대평가에서 점수가 주는 영향을 교육적으로 약화시킬 수 있음\n단점\n① 구간의 경계에 위치한 점수를 받은 학생이 사소한 점수 차이로 등급이 달라지는 일이 일어날 수 있음 ⇒ 학생의 점수가 구간의 경계에 위치하는 경우 사소한 점수 차이가 과장될 수 있음\n② 모든 피검사자들의 점수를 9개의 유목으로 분류하기 때문에 피검사자들을 세밀하게 변별할 수 없음 ⇒ 단일 점수가 점수의 범위를 나타내므로 정밀성이 떨어짐","kw":["평균 5","표준편차 2","9개의 범주","확대 해석","구간의 경계","세밀하게 변별","정밀성"],"id":"pyeongga-e23"},{"ch":"CH03 교육평가의 유형","t":"준거지향평가","q":"준거지향평가와 준거 각각의 개념과 특징 2가지를 제시하시오.","ans":"준거지향평가: 준거에 비추어 학습자가 성취해야 할 과제의 영역 또는 분야를 알고 얼마만큼 수행할 수 있는가에 관심을 두는 평가방식 ⇒ '목표지향평가' 또는 '절대평가'라고 함\n준거: 교육목표를 설정할 때 도달해야 하는 최저기준 ⇒ 준거 도달 여부를 판정함\n특징\n① 발달적 교육관을 가정하여 개별 학습자의 잠재가능성을 최대한 개발시키는 데 목적을 둠\n② 적절한 교수·학습방법과 개인의 노력에 의하여 학교에서 달성하고자 하는 교육목표에 거의 모든 학습자가 도달할 수 있다고 봄\n③ 검사점수의 분포가 오른쪽으로 치우친 부적편포를 기대함\n④ 경쟁보다는 협력 위주의 교수·학습이 바람직하다는 인식을 반영하고 있음\n⑤ 검사의 타당도를 중시함","kw":["준거","목표지향평가","절대평가","최저기준","발달적 교육관","부적편포","협력","타당도"],"id":"pyeongga-e24"},{"ch":"CH03 교육평가의 유형","t":"준거지향평가","q":"준거지향평가에서 가정하는 교육관의 명칭과 준거지향평가의 장점과 단점 각각 2가지를 제시하시오.","ans":"준거지향평가에서 가정하는 교육관: 발달적 교육관\n장점\n① 개인이 무엇을 알고 얼마만큼 수행할 수 있는지에 관심을 기울이므로 학습과정에서 실패의 원인을 찾을 수 있음\n② 교육목표, 교육과정, 교수방법 등에 대한 개선점을 모색할 수 있음\n③ 개인차를 줄이고 모든 학습자가 학습목표에 도달 가능하다는 발달적 교육관에 바탕을 두므로 협동학습과 내재적 동기유발에 적합함\n단점\n① 준거를 설정함에 있어 교수·학습목표를 누가, 어떻게 정하는지에 대해서 고도의 전문성이 요구됨\n② 전문성을 갖추지 못할 경우에는 점수 해석에 자의성이 높을 수 있음","kw":["발달적 교육관","실패의 원인","개선점","협동학습","내재적 동기유발","전문성","자의성"],"id":"pyeongga-e25"},{"ch":"CH03 교육평가의 유형","t":"평가 비교","q":"'규준지향평가와 준거지향평가 비교'의 항목을 각각 제시하시오.","ans":"규준지향평가: 선발적 (교육관) / 외재적 (동기) / 서열·순위 / 상대적 (비교) / 행정적 (기능) / 신뢰도 / 변별 (강조)\n준거지향평가: 발달적 (교육관) / 내재적 (동기) / 교육목표 도달 여부 / 교수적 (기능) / 내용타당도 / 자격 (부여) / 목표 (강조)","kw":["선발적","외재적","서열","상대적","행정적","신뢰도","발달적","내재적","교육목표 도달 여부","교수적","내용타당도"],"id":"pyeongga-e26"},{"ch":"CH03 교육평가의 유형","t":"성취평가제","q":"성취평가제의 개념과 성취평가제의 학생 입장에서의 장점과 교사 입장에서의 장점 각각 2가지를 제시하시오.","ans":"개념: 국가수준의 교육과정에 근거하여 개발된 교과목별 성취기준을 토대로 교수·학습이 이루어지고 성취기준에 따라 학생의 성취수준을 평가하는 교육제도\n학생 입장에서의 장점\n① 학습해야 할 목표와 내용이 무엇인지 구체적으로 알 수 있음\n② 어떤 영역에서 얼마만큼 성취했는지 구체적인 피드백을 받을 수 있음\n③ 성취기준에 비추어 부족한 점을 파악하여 학습을 개선할 수 있음\n④ 다른 학생의 성적에 관계없이 내가 노력한 만큼 성적을 받을 수 있음\n⑤ 개인의 관심과 흥미, 진로에 적합한 다양한 교과목을 배울 수 있음\n⑥ 무분별한 경쟁이 줄어들고 협동학습의 분위기가 조성됨\n교사 입장에서의 장점\n① 성취기준에 근거하여 학생이 도달해야 할 목표와 내용을 명확히 할 수 있음\n② 학생이 성취기준에 도달한 정도를 파악할 수 있다\n③ 성취기준에 근거해 학생에게 학습에 관한 피드백을 제공할 수 있음\n④ 학생의 학업성취수준에 대한 정보를 바탕으로 교수·학습과 평가의 개선이 가능함\n⑤ 학생 중심의 맞춤형 교육과정 운영이 가능함\n⑥ 성취기준, 교수·학습, 평가의 유기적 연계를 통해 교사의 전문성을 신장시킬 수 있음","kw":["국가수준의 교육과정","성취기준","성취수준","구체적인 피드백","협동학습","맞춤형 교육과정","유기적 연계","전문성"],"id":"pyeongga-e27"},{"ch":"CH03 교육평가의 유형","t":"진단·형성·총괄평가","q":"진단평가, 형성평가, 총괄평가 각각의 개념을 그에 적합한 기능 2가지와 함께 제시하시오.","ans":"진단평가: 교수·학습이 시작되기 전 학습자의 능력이나 특성을 체계적으로 파악하는 평가\n기능 ① 개별 학생이 어떤 출발점을 가지는지 파악함으로써 그들에게 적절한 과제를 제공하거나 상호작용할 수 있음 ② 학생의 결함이나 환경적 정보를 수집하여 진단하고 이를 개선할 수 있음 ③ 교수·학습을 투입하기 전에 학생이 소유하고 있는 특성을 체계적으로 관찰, 측정하여 사전학습의 정도, 지능, 적성, 태도, 흥미, 동기, 자아개념, 불안, 가정환경 등을 분석함 ④ 학습을 극대화하는 데 목적이 있음. 진단을 제대로 하지 못하면 적절한 교수·학습행위가 이루어지지 않아 교육목표 도달이 어려움\n형성평가: 교수학습이 진행되는 도중에 실시하는 평가. 학습내용에 대한 학습자의 이해 정도나 기능 수준을 확인하여 학생에게 피드백을 주고, 교육과정 및 수업방법을 개선하기 위한 평가\n기능 ① 형성평가의 목표는 즉각적·구체적 피드백을 통해 학생의 학습동기와 능력을 향상시키는 것 ② 형성평가는 교수목표에 비추어 무엇을 성취했고 무엇을 더 학습해야 하는지를 구체적으로 알려주기 때문에, 학습자는 자신의 학습곤란을 교사로부터 또는 스스로 발견하여 이를 해소할 수 있음 ③ 교수자 측면에서 학습자들의 학습목표 달성 정도에 비추어 교수·학습 내용과 방법을 점검하고 학습 진행 속도를 조절하며 개선점을 모색하여 다음 수업에 대한 교정을 할 수 있음 ④ 형성평가를 통해 학생 개개인의 결과를 확인할 수 있게 되어 개인별 학습능력에 맞추어 개인학습을 진행할 수 있도록 돕는 등 학습의 개별화를 추구할 수 있음 ⑤ 비공식적 관찰, 질문, 자기평가, 동료평가 등을 통해 학생의 향상도를 평가할 수 있음\n총괄평가: 장기간에 걸친 일정 단위의 교수·학습과정이나 프로그램이 종료된 후 교육목표 달성 여부와 정도를 종합적으로 판정하는 평가\n기능 ① 학습자들의 교수·학습 결과의 수준을 판단하고 평점이나 서열을 결정함 ② 학습자의 미래 학업성적을 예측하는 자료로 활용될 수 있음 ③ 교수·학습과정을 이수한 학습자의 자격을 인정하기 위한 자료로 활용됨 ④ 학습자 집단 간 학습성과에 대하여 교수방법이나 자료의 차이 등과 관련지어 비교·분석함으로써 정보를 제공함 ⑤ 학습자의 성취도를 평가하여 교육자와 교육기관에 책무성을 부여하고, 교육 프로그램의 시행 여부를 결정함","kw":["진단평가","출발점","형성평가","즉각적","구체적 피드백","학습의 개별화","총괄평가","평점","서열","자격을 인정","책무성"],"id":"pyeongga-e28"},{"ch":"CH03 교육평가의 유형","t":"형성평가","q":"형성평가를 수행하는 방법 2가지와 형성평가 도구 제작 시 유의사항 2가지를 제시하시오.","ans":"수행 방법\n① 구조화된 형성평가: 계획·공지된 평가활동으로 다양한 수업방법과 연계하여 실시. 예) 시험, 보고서, 연습문제, 실험, 실습, 글쓰기, 프로젝트, 토론 등\n② 비구조화된 형성평가: 수업이 진행되는 동안 교사가 학생의 반응을 수집하는 방식. 예) 관찰, 질의응답, 수업 분위기 등\n유의사항\n① 준거참조평가를 지향하며 주로 교사 중심으로 평가도구 제작이 이루어짐\n② 구조화된 방식으로 실시할 경우 ⇒ 학습내용에 적절한 난이도 문제를 출제하여 최저성취기준을 따라 학습곤란도를 파악하는 것이 적절함\n③ 학습자가 드러낼 가능성이 있는 오류를 가능한 한 다양하게 파악할 수 있는 문항들로 구성하되 평가결과는 최종 성적에 반영하지 않거나 최소한으로만 반영하여 학습자의 학습동기를 유발할 수 있도록 함","kw":["구조화된 형성평가","비구조화된 형성평가","준거참조평가","최저성취기준","오류","학습동기"],"id":"pyeongga-e29"},{"ch":"CH03 교육평가의 유형","t":"피드백","q":"학생의 학습 향상을 위한 피드백의 종류 3가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 목표참조 피드백: 학생이 성취해야 할 학습목표를 기준으로 학생의 도달 정도에 대한 피드백을 구성함(학생의 능력에 따라 다른 목표)\n② 비계식 피드백: 학생이 학습목표를 달성할 수 있도록 교사가 과제를 단계적으로 제시하거나 학생이 해결하기 어려워할 때 정보, 전략, 새로운 자료, 힌트, 관련 정보 등을 제공함\n③ 자기참조 피드백: (공동의 학습목표나 성취기준에 비추어 피드백 내용을 구성하여 제공하는 것이 아니라) 학생이 이전에 비해 어떻게 향상되어 왔으며 앞으로 어떻게 나아가야 할지에 대한 내용을 담아 피드백을 제공함\n④ 성취기준참조 피드백: 해당 학년이 해당 학기에 달성해야 할 성취기준에 비추어 피드백을 구성함","kw":["목표참조","비계식","자기참조","성취기준참조","단계적","향상"],"id":"pyeongga-e30"},{"ch":"CH03 교육평가의 유형","t":"피드백","q":"자기참조 피드백과 성취기준참조 피드백의 장점 각각 2가지를 제시하시오.","ans":"자기참조 피드백 장점\n① 개별 학생이 과거에 보인 강점과 약점에 대한 분석을 바탕으로 약점이 되는 부분의 개선을 도모하자는 것이므로 학생의 수준과 목표를 모두 반영한 맞춤형 피드백이 될 수 있음\n② 학생이 들인 노력과 관심도 함께 피드백으로 제공할 수 있으므로 학습동기 유발에 효과적임\n③ 학습수준이 낮은 학생에게는 비록 이들의 성취 정도가 낮더라도 노력과 열정을 다한 것에 대해 칭찬해줌으로써 효과적인 피드백 구성 가능\n성취기준참조 피드백 장점\n① 학교에서 이루어지는 교수·학습과 평가의 근거가 되는 성취기준에 따라 구성된 것이므로 학생이 교수·학습과 평가를 연계할 수 있음\n② 스스로 자기평가를 할 수 있게 함","kw":["맞춤형 피드백","노력과 관심","학습동기","교수·학습과 평가를 연계","자기평가"],"id":"pyeongga-e31"},{"ch":"CH03 교육평가의 유형","t":"피드백","q":"초점 수준에 따른 피드백의 유형 4가지와 유형별 개념, 효과적인 피드백의 요소 3가지를 설명하시오.","ans":"① 과제 수준 피드백: 정답, 오류, 결과 중심의 피드백\n② 과정 수준 피드백: 전략, 방법, 사고과정의 피드백 ⇒ 학습방법 개선 안내. 효과적인 피드백\n③ 자기조절 수준 피드백: 학습자 스스로 계획, 점검하도록 유도하는 피드백 ⇒ 가장 효과적인 피드백\n④ 자기 수준 피드백: 학생 개인에 대한 평가적 판단을 하는 피드백 ⇒ 학습에 필요한 정보는 제공하지 않고 학생의 능력이 고정되어 있다고 인식하게 하는 경향이 있으므로 학습 개선에 도움이 되지 않음\n효과적인 피드백의 요소\n① Feed up: 목표 제시 ⇒ 학습목표의 명확화\n② Feedback: 현재 위치 ⇒ 현재 수행 진단\n③ Feed Forward: 다음 단계 행동 제시 ⇒ 개선 행동 유도","kw":["과제 수준","과정 수준","자기조절 수준","자기 수준","Feed up","Feedback","Feed Forward"],"id":"pyeongga-e32"},{"ch":"CH03 교육평가의 유형","t":"총괄평가 문항구성","q":"총괄평가를 규준참조평가로 진행할 때의 평가도구의 문항구성 방안과 준거참조평가로 진행할 때의 평가도구 문항구성 방안 각각 1가지를 제시하시오.","ans":"규준참조평가로 진행 시: 다양한 난이도의 문항이나 평가도구를 제작함\n준거참조평가로 진행 시: 최저 준거에 부합하는 난이도의 문항이나 평가도구를 제작함","kw":["다양한 난이도","최저 준거"],"id":"pyeongga-e33"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 목적과 역동적 평가의 전체적인 구성을 설명하시오.","ans":"목적\n① 학습자의 잠재력을 자극해 개인의 근접발달영역(ZPD)을 측정하고 개인이 교육목표를 제대로 달성할 수 있게 개별적으로 도움을 주기 위함\n② 교수·학습과정에서 개별 학생의 강점과 약점을 파악하고 개인이 교육목표를 제대로 달성할 수 있도록 개별적으로 도움을 주기 위함\n구성: 검사 - 중재(교육적 처방) - 재검사","kw":["잠재력","근접발달영역","ZPD","강점과 약점","검사","중재","재검사"],"id":"pyeongga-e34"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가와 고정적 평가의 차이점을 평가목적과 평가시기 각각의 측면에서 설명하시오.","ans":"평가목적: 고정적 평가는 교육목표 달성도에 대한 정보만을 제공하고자 하나, 역동적 평가는 개별 학생의 강점과 약점을 파악하고, 개인이 교육목표를 제대로 달성할 수 있도록 개별적으로 도움을 주기 위한 목적으로 학습향상도를 평가함\n평가시기: 고정적 평가는 특정 시점(주로 도착점), 역동적 평가는 출발점 및 도착점을 포함한 교수·학습활동의 전 과정","kw":["교육목표 달성도","학습향상도","특정 시점","도착점","전 과정"],"id":"pyeongga-e35"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 유형 2가지 각각의 구체적인 수행방안을 설명하시오.","ans":"① 샌드위치 방식: 사전검사와 사후검사 사이에 수업을 끼워 넣는 방식. 사전검사를 치른 후, 측정한 기능을 바탕으로 수업이 개별적 또는 집단적으로 진행됨\n② 케이크 방식: 학습자가 검사문항을 풀 때마다 반응을 제시하는 방식. 문항의 반응에 따라 지속적으로 힌트 등의 활동을 제공하므로 문항과 힌트가 순차적으로 쌓임","kw":["샌드위치 방식","케이크 방식","사전검사","사후검사","힌트","순차적"],"id":"pyeongga-e36"},{"ch":"CH03 교육평가의 유형","t":"능력지향평가","q":"능력지향평가의 개념과 특징 2가지, 장점과 한계점 각각 2가지를 제시하시오.","ans":"개념: 학생이 지니는 능력에 비추어 얼마나 최선을 다했는가, 능력의 최대치가 발휘되었는가에 초점을 두는 평가\n특징\n① 우수한 능력을 지녔음에도 최선을 다하지 않은 학생보다 능력이 낮더라도 최선을 다한 학생이 더 좋은 평가를 받음\n② 학생이 본인의 능력과 더불어 최선을 다할 수 있도록 돕는 평가. 학습태도를 바람직한 방향성으로 이끌기 위한 평가로 학습동기를 높이기 위함\n③ 학생이 지닌 능력에 대한 정확한 정보가 존재하지 않을 경우 평가를 적용하기 어렵다는 단점이 있음\n장점\n① 교사가 개별 학생의 파악된 능력수준에 비추어 학생들의 수행을 평가하는 일은 학생 개개인의 수준을 고려해 이루어지는 개별화된 평가로 교수-학습과정에서 유용하게 활용됨\n② 개별 학생의 파악된 능력수준에서 그들의 최선을 인정해주고 학습에 기울인 노력 정도에 대한 피드백이 가능함\n③ 평가의 교수적 기능이나 상담적 기능 강조\n한계점\n① 학생의 능력에 대한 정확한 파악이 요구되나 교사는 학습자의 능력을 막연하게 짐작할 뿐임\n② 표준화검사가 교사들에게 학생의 능력에 대한 정보를 제공해 주기도 하지만 그 정보는 대단히 제한적임\n③ 어떤 능력이 학습과제에 필요한 필수적인 능력인지를 확인하고 그 능력과 관련된 개별 학생의 수준을 정확하게 파악하는 것도 쉽지 않음\n④ 학습자가 지닌 능력에 대한 정확한 정보가 없을 경우 활용이 어려움\n⑤ 대학 진학이나 자격증 취득을 위한 행정적 기능이 강조되는 고부담검사와 같은 평가환경에서는 평가결과에 대한 공정성 문제가 제기되어 적용하기 어려움 ⇒ 성장지향평가와 공통된 한계점","kw":["능력의 최대치","최선을 다한","개별화된 평가","교수적 기능","상담적 기능","막연하게 짐작","표준화검사","고부담검사","공정성"],"id":"pyeongga-e37"},{"ch":"CH03 교육평가의 유형","t":"성장지향평가","q":"성장지향평가의 개념과 장점, 한계점 각각 3가지를 제시하시오.","ans":"개념: 초기의 능력수준과 비교했을 때 학생이 얻은 점수가 과거보다 얼마만큼의 향상을 보였는가를 강조하는 평가\n장점\n① 교육적 기능이 강조되는 교수-학습 상황에서 학생의 성장과 진보 정도에 대한 확인은 가장 궁극적인 학생평가의 목적임 ⇒ 이는 학생의 학습을 이해하고 지원하기 위해 유용하게 활용됨\n② 학생들에게 성취수준의 향상이 지니는 교육적 의미를 강조\n③ 개별 학생의 수준에서 학습을 촉진시킬 수 있음\n④ 평가의 교수적 기능이나 상담적 기능이 강조\n한계점\n① 일반적으로 학생평가에서의 성적은 현재 학생이 도달해 있는 성취수준과 동일시되므로 진보나 향상의 정도로 성적을 부여하고자 할 경우에는 성적의 의미가 왜곡될 수 있음\n② 사전 성취검사 점수와 현재 성취검사 점수의 차로 점수를 부여할 경우 학생이 의도적으로 사전 성취검사에서 낮은 점수를 받고 진보나 향상의 정도를 과장할 가능성이 있음\n③ 성적이 높은 학습자의 경우 향상될 수 있는 범위가 적어 동기가 저하될 수 있음\n④ 평가결과가 중요한 의사결정에 활용되는 고부담검사에서는 성장지향평가의 결과에 대한 공정성이 문제될 수 있음 ⇒ 능력지향평가와 공통된 한계점","kw":["초기의 능력수준","향상","성장과 진보","교수적 기능","성적의 의미가 왜곡","과장","동기가 저하","공정성"],"id":"pyeongga-e38"},{"ch":"CH03 교육평가의 유형","t":"성장지향평가","q":"성장지향평가의 결과가 타당하기 위한 조건 3가지를 제시하시오.","ans":"① 현재 성취도검사의 신뢰도가 높아야 함\n② 과거의 성취도검사의 신뢰도가 높아야 함\n③ 현재 성적과 과거 성적 사이의 상관이 낮아야 함 (만약 사전 측정치나 현재의 측정치가 본질적으로 상관이 높다면 이는 성장에 의한 것이 아니라 관계에 의한 당연한 결과를 가져오게 됨)","kw":["현재 성취도검사","과거의 성취도검사","신뢰도","상관이 낮아야"],"id":"pyeongga-e39"},{"ch":"CH03 교육평가의 유형","t":"평가 유형 분류","q":"개인차를 고려하지 않는 평가의 유형 2가지, 교수적 기능을 강조하는 평가의 유형 3가지 각각의 명칭을 제시하시오.","ans":"개인차를 고려하지 않는 평가: 능력지향평가, 성장지향평가\n교수적 기능을 강조하는 평가: 준거지향평가, 능력지향평가, 성장지향평가","kw":["능력지향평가","성장지향평가","준거지향평가"],"id":"pyeongga-e40"},{"ch":"CH03 교육평가의 유형","t":"검사의 기능","q":"검사의 기능 3가지의 명칭을 이의 구체적인 교육적 효과와 함께 제시하시오.","ans":"① 교수적 기능: 교사들에게 교과목표를 확인시켜 주고 학생과 교사들에게 피드백 효과를 제공하고 학습동기 유발. *효과 ⇒ 검사를 통하여 잘못된 인지구조나 학습태도를 고칠 수 있음\n② 행정적 기능: 교육 프로그램이나 학교 혹은 교사를 평가하고 학생들을 분류, 배치하는 데 사용. *효과 ⇒ 학교나 학교 구조의 질을 통제할 수 있음\n③ 상담적 기능: 피험자의 정의적 행동특성을 진단·치료하는 데 사용함. *효과 ⇒ 적성검사, 흥미검사, 성격검사 등을 통하여 피험자가 지니고 있는 문제점을 발견할 수 있음","kw":["교수적 기능","행정적 기능","상담적 기능","인지구조","학교 구조의 질","정의적 행동특성"],"id":"pyeongga-e41"},{"ch":"CH03 교육평가의 유형","t":"고부담평가","q":"고부담평가의 개념과 장점, 단점 각 1가지를 제시하시오.","ans":"개념: 검사결과가 학교 행정가, 교육정책 결정자, 자격증 발급청, 인사선발 주체 등이 중요한 결정을 내리는 데 활용되어 피험자에게 지대한 영향을 미치므로, 피험자에게 큰 심적 부담으로 작용하는 평가\n장점: 객관적인 측정과 교육적 결정에 필요한 일정한 기준을 제공하고, 수업의 질을 높이고, 학생과 교사의 동기를 유발하며, 고부담평가에서 실패한 학생에게는 개인교수를 제공할 수 있는 계기가 됨\n단점: 고부담검사는 학생의 성취도를 향상시키지 못하며, 성취도가 낮은 학생들에게는 부정적인 영향을 미칠 수 있음. 검사가 고부담으로 작용할 때 피험자에게 지나친 불안과 스트레스를 야기하여 정신건강을 저해할 수 있음. 학교는 고부담검사에 출제되는 내용만 반복적으로 가르치고 훈련시키는 데 집중하여 교과의 본질을 소홀히 하게 됨","kw":["중요한 결정","심적 부담","일정한 기준","동기를 유발","불안","스트레스","교과의 본질"],"id":"pyeongga-e42"},{"ch":"CH03 교육평가의 유형","t":"학생참여형 평가","q":"학생참여형 평가의 종류 2가지와 각각의 개념을 제시하시오.","ans":"자기평가: 학습자 스스로 특정 주제나 교수·학습영역에 대하여 학습과정이나 결과에 대해 자세하게 평가한 후에 자기평가 보고서를 작성 및 제출하도록 하여 평가하는 것\n동료평가: 동료 학생들이 상대방을 서로 평가한 후에 동료평가 보고서를 작성·제출하여 평가하는 것","kw":["자기평가","동료평가","보고서"],"id":"pyeongga-e43"},{"ch":"CH03 교육평가의 유형","t":"자기평가","q":"자기평가의 장점 2가지를 설명하고, 자기평가의 한계점 2가지를 각각 이에 적합한 보완방안과 함께 제시하시오.","ans":"장점\n① 학습에 대한 주도성이 높아지고 학습동기를 유발하여 학습 향상에 도움을 줌\n② 자신의 문제해결 과정, 사고과정을 지속적으로 성찰하는 과정에서 초인지 능력 향상\n③ 학습자가 자신이 배우는 것이 무엇인지에 대한 보다 명확한 목표를 갖고 계획적으로 학습하도록 함\n④ 학습자는 학습과 평가의 주체로서 학습과정에 대한 책임감이 높아져 교사와 학생 간의 관계가 더욱 협력적으로 되는 데 기여함\n⑤ 학습자의 자기조절학습을 가능하게 함\n한계점 & 보완방안\n① 학생들은 자신의 성취도를 높게 평가하는 경향이 있음 ⇒ 학생들이 자기평가에 대한 기준을 명확히 이해하고 숙지한 후 수행해야 함\n② 학생의 허위보고, 잘못된 평가, 학생 개인의 특성으로 인해 발생하는 엄격성의 차이로 인해 평가의 신뢰성과 타당성이 위협당할 수 있음 ⇒ 채점결과의 처리방안에 대해서는 신중하게 접근해야 함","kw":["주도성","초인지 능력","책임감","자기조절학습","높게 평가","기준을 명확히","허위보고","채점결과의 처리방안"],"id":"pyeongga-e44"},{"ch":"CH03 교육평가의 유형","t":"동료평가","q":"동료평가의 수행방안 2가지, 동료평가의 장점과 한계점 각각 2가지를 제시하시오.","ans":"수행방안\n① 팀 외부의 동료들에 의해 이루어지는 학습결과물에 대한 평가\n② 팀 내부의 동료들에 의해 이루어지는 팀 활동에 대한 참여도 및 기여도에 대한 평가\n장점\n① 학생들이 평가자로서의 역할을 통해 다각도로 생각하는 기회를 가질 수 있음\n② 평가과정을 통해 자신의 장단점을 인지하게 되고, 평가하는 능력 자체가 향상됨 ⇒ 초인지 능력 향상\n③ 동료평가를 통해 학생 과제의 질이 향상되며, 과제에 대한 책임감이 증가함\n④ 평가자로서 역할을 수행하는 과정에서 평가기준에 대해 명확한 이해가 높아짐\n⑤ 학습자가 평가과정의 주체가 되고, 학습과정에 대한 평가를 수행한다는 측면에서 자기주도적 학습자가 됨\n한계점\n① 평가를 수행하기 위한 동료의 능력에 대한 부정적 인식으로 평가결과에 대한 불신이 있을 수 있음\n② 평가 수행에 대한 태도 및 동료 간 교우관계, 개인적 친분, 사적인 감정이 평가결과에 영향을 줄 수 있음","kw":["팀 외부","팀 내부","참여도","기여도","다각도","초인지","책임감","불신","사적인 감정"],"id":"pyeongga-e45"},{"ch":"CH03 교육평가의 유형","t":"학생참여형 평가","q":"수행평가에서 학생참여형 평가 운영 시 유의점 2가지를 제시하시오.","ans":"① 자기평가와 동료평가가 타당하고 신뢰 있게 이루어지기 위해서는 성취기준과 평가요소를 바탕으로 자세하고 구체적인 평가준거(루브릭)를 제공해야 함\n② 점수만으로 전달할 수 없는 구체적이고 정확한 피드백을 얻기 위해서는 서술 형태로 평가결과를 작성해야 함\n③ 동료평가 시 공정성 제고를 위하여 최고점과 최하점은 제외하고 평가에 반영하거나, 점수에 대한 근거를 서술하게 함으로써 학생 스스로 공정성을 높이도록 함","kw":["평가준거","루브릭","서술 형태","공정성","최고점","최하점"],"id":"pyeongga-e46"},{"ch":"CH03 교육평가의 유형","t":"학습을 위한 평가","q":"학습을 위한 평가의 개념과 특징 2가지를 제시하시오.","ans":"개념: 교수·학습을 개선하기 위해 교사와 학생이 정보를 수집하고, 반성하고, 반응하는 교실활동\n특징\n① 평가의 목표는 학습의 결과를 판단하는 게 아니라 교수·학습을 돕는 것\n② 평가를 통해 교사와 학생 모두에게 학습을 위해 무엇을 해야 하는지 안내할 수 있음\n③ 교사와 학생이 교수·학습에 대해 스스로 반성하고, 판단하고, 이해하는 것이 강조됨\n④ 평가방법은 학생의 학습과정이나 결과에 대해 분석할 수 있는 자료를 수집·해석하는 과정을 포함함","kw":["교수·학습을 개선","정보를 수집","반성","반응","교실활동","안내"],"id":"pyeongga-e47"},{"ch":"CH03 교육평가의 유형","t":"학습을 위한 평가","q":"평가가 학습을 위해 이루어지도록 하기 위한 평가설계와 평가시행, 평가결과 활용 측면에서의 전략 각각 1가지를 제시하시오.","ans":"① 평가의 설계 측면: 평가의 내용과 방법은 학생이 수업을 통해 배워야 할 내용이나 역량을 분명하게 반영해야 하며, 학습목표와 평가기준이 분명하고 구체적인 언어로 전체 학생에게 이해·공유되어야 함\n② 평가의 시행 측면: 교사는 학생이 평가활동에 자발적이고 적극적으로 참여하도록 해야 함. 학생 개개인이 자신의 학습 및 평가과정에 주도적으로 참여할 뿐만 아니라 동료를 통해서 서로의 학습과정을 확인하고 서로에게 피드백을 제공할 수 있도록 지도해야 함\n③ 평가결과 활용의 측면: 평가결과는 교사의 풍부한 피드백을 통하여 학생에게 현재의 학습상태에 대한 정보를 제공하는 동시에 향후 학습방향을 안내할 수 있어야 함","kw":["역량","학습목표","평가기준","이해·공유","자발적","주도적","풍부한 피드백","학습방향"],"id":"pyeongga-e48"},{"ch":"CH03 교육평가의 유형","t":"수행평가","q":"수행평가의 특징 3가지를 제시하시오.","ans":"① 학생이 정답을 선택하게 하는 것이 아니라 자기 스스로 답을 작성(서술 또는 구성)하거나 행동으로 나타내도록 함\n② 창의성, 문제해결력, 비판력, 판단력, 정보수집·분석력, 통합력과 같은 고등사고기능의 파악을 중시함\n③ 교수·학습의 결과뿐만 아니라 과정도 함께 중시\n④ 학생의 학습과정을 진단하고 개별학습을 촉진하는 노력을 중시함\n⑤ 학생 개개인의 변화·발달과정을 종합적으로 평가하기 위해 전체적·지속적으로 평가하는 것이 중요함\n⑥ 학생의 인지적 영역뿐만 아니라 정의적 영역(개개인의 행동발달, 흥미, 태도), 심동적 영역에 대한 종합적인 평가도 중시함","kw":["직접 작성","고등사고기능","과정","개별학습","전체적","지속적","정의적 영역","심동적 영역"],"id":"pyeongga-e49"},{"ch":"CH03 교육평가의 유형","t":"채점","q":"총체적 채점과 분석적 채점 각각의 개념, 장점과 단점 2가지씩 서술하시오.","ans":"총체적(총괄적) 채점: 학생의 전반적인 수행수준을 하나의 척도로 평가하는 방법. 종합적인 관점에서 채점하고 단일의 점수나 등급을 부여\n*장점 ① 채점시간과 채점자 훈련시간이 적게 걸려 경제적임 ② 수행을 전체적으로 판단하기에 유용함 ③ 효율적이고 요약적인 채점이 가능(모든 특성을 한 번에 고려하기 때문)\n*단점 ① 학생이 무엇을 잘했고, 어떤 점을 개선해야 하는지에 대해 구체적인 정보를 거의 제공하지 못함 ② 학생의 수행에 대한 풍부한 이해와 진단을 목적으로 할 때에는 쓰기 어려움\n분석적 채점: 구별되는 몇 가지 채점요소나 평가기준별로 점수를 부여. 응답 내용을 요소로 구분하여 점수를 부여하는 채점\n*장점 ① 채점요소나 평가기준에 대한 채점자의 충분한 이해를 전제로 했을 때 채점자 간 또는 채점자 내 신뢰도가 높음 ② 명확한 기준을 제공하므로 더욱 일관된 채점을 가능하게 함 ③ 수행을 구성요소별로 평가하므로 학생의 수행에 구체적인 피드백이 가능함 ④ 학생의 강점과 약점에 대한 정보를 쉽게 파악 ⇒ 적절한 피드백을 주기에 용이 ⑤ 채점기준에 대한 의사소통이 보다 효율적이어서 채점자들 사이의 조정에 효율적\n*단점 ① 분석적 채점기준을 만드는 데에 시간이 오래 걸림 ② 평가요소별로 여러 번 채점하기 때문에 채점시간이 많이 소요됨","kw":["총체적","하나의 척도","단일의 점수","경제적","구체적인 정보","분석적","채점요소","평가기준","채점자 간","신뢰도","시간이 오래"],"id":"pyeongga-e50"},{"ch":"CH03 교육평가의 유형","t":"수행평가 신뢰도","q":"수행평가의 신뢰도를 높이는 구체적인 방안 2가지를 제시하시오.","ans":"① 교과협의회에서 토론과 합의를 통하여 채점기준을 정하고 이를 공유함\n② 학생이 과제를 수행함으로써 성취하기를 기대하는 지식, 기술, 태도 등을 진술하고 수행수준에서의 성취기준을 명세화한 루브릭을 제작하여 사전에 제시함\n③ 평가에 참여하는 평가자에게 평가자 오리엔테이션을 실시하여, 채점기준표를 설명하고 예비채점, 채점기준 수정, 점수 기록 등의 훈련 과정을 거침\n④ 동일한 과제에 대해 수행과정 및 결과를 여러 명의 교사가 채점하고, 채점결과의 평균값을 활용함\n⑤ 교사뿐 아니라 학생도 평가에 참여하도록 하여 동료평가 및 자기평가를 평가요소로 적용 시 채점의 신뢰도를 높일 수 있음","kw":["교과협의회","합의","루브릭","사전에 제시","오리엔테이션","예비채점","평균값","동료평가"],"id":"pyeongga-e51"},{"ch":"CH03 교육평가의 유형","t":"루브릭","q":"루브릭(Rubric)의 개념과 루브릭의 포함요소 4가지를 설명하시오.","ans":"개념: 학생의 수행과정과 수행수준에서의 성취기준을 명세화한 평가안내서이자 평가척도\n포함요소\n① 과제진술: 과제에 대한 명확하고 구체적인 설명으로 학생이 과제의 내용과 특성, 형식 등을 충분히 이해할 수 있는 언어로 제시함\n② 평가기준 및 차원: 과제의 평가 세부항목을 구체화하는 것으로 과제를 수행할 때 무엇이 중요하며 어떤 부분을 성취해야 하는가를 결정하는 것으로, 초·중·고등학교에서는 국가교육과정의 성취기준을 근거로 과제의 목표가 충실히 반영되도록 평가기준을 설정함\n③ 평정을 위한 척도·단계 설정: 주어진 과제가 얼마나 잘 수행되었는가를 판단하는 척도·단계를 설정하며 '우수/보통/미흡' 또는 '5/4/3/2/1' 등으로 구분함\n④ 수행수준에 대한 기술: 평가기준 및 차원별로 설정한 척도나 단계에 따라 기대되거나 실제 나타나는 과제의 특징이나 학생의 행동특성을 기술함","kw":["명세화","평가안내서","평가척도","과제진술","평가기준 및 차원","척도·단계 설정","수행수준에 대한 기술"],"id":"pyeongga-e52"},{"ch":"CH03 교육평가의 유형","t":"루브릭","q":"루브릭의 교육적 효과 3가지를 제시하시오.","ans":"① 다양한 수준의 수행을 평가자가 효과적으로 변별할 수 있도록 타당하고 신뢰롭게 구축되도록 함 ⇒ 평가기준이 명확하여 결과가 일관적이고 신뢰도가 높기 때문에 기존 수행평가의 약점인 객관도와 신뢰도를 보완할 수 있음\n② 교육목표로부터 수행준거를 달성하기 위한 적절하고 핵심적인 수준을 추출, 기술함 ⇒ 수행 특성을 여러 단계 수준으로 세분화하여 제시하기 때문에 학생이 도달한 수행의 현재 상태와 발달 가능성 및 방향을 제공함\n③ 수행의 양적 정보가 아닌 질적 정보에 초점을 두어 수행의 개선을 유도함 ⇒ 학생의 강점과 약점을 파악할 수 있어 자기조절적 학습태도 증진에 도움을 줌","kw":["변별","객관도","신뢰도","세분화","발달 가능성","질적 정보","자기조절적 학습태도"],"id":"pyeongga-e53"},{"ch":"CH03 교육평가의 유형","t":"포트폴리오","q":"포트폴리오 평가의 개념과 장점, 단점 각각 2가지를 제시하시오.","ans":"개념\n① 자신이 쓰거나 만든 작품을 누적하여 체계적으로 모아둔 개인 작품집이나 서류철을 이용한 평가\n② 단편적인 영역에 대하여 일회적으로 평가하지 않고 학생 개개인의 변화·발달과정을 종합적으로 평가하기 위하여 전체적·지속적으로 평가 ⇒ 수행평가의 대표적인 방법 중의 하나\n예) 그림, 사진, 시, 소설 등의 작품집, 글짓기 결과물, 독서장, 관찰기록, 일화노트, 과목의 과제물, 연구보고서나 실험·실습 결과보고서 등을 정리한 자료집\n장점\n① 학생 스스로의 변화과정을 알 수 있고 자신의 강점이나 약점, 성실성, 잠재가능성 등을 스스로 인식할 수 있음\n② 교사는 학생의 과거와 현재의 상태를 쉽게 파악할 수 있고 앞으로의 발전방향에 대해 쉽게 조언할 수 있으며 과정과 결과에 드러난 학생의 정의적 특성에 대한 평가가 가능함\n③ 학생이 자신의 지식과 기술을 이용하여 과제를 수행하고, 산출물을 만들어내는 과정과 그 결과물을 관찰하여 판단하는 평가이므로 수행과정과 결과 모두 평가할 수 있음\n단점\n① 포트폴리오에 포함되는 수행과제에 대한 정답이 없기 때문에 채점 시 채점자의 주관이 개입될 여지가 많아 신뢰도 및 객관도 확보가 어려움 ⇒ 루브릭(채점기준표)을 개발할 필요가 있음","kw":["개인 작품집","서류철","변화·발달과정","전체적","지속적","잠재가능성","정의적 특성","주관이 개입","루브릭"],"id":"pyeongga-e54"},{"ch":"CH03 교육평가의 유형","t":"수행평가 방안","q":"수행평가의 구체적인 방안 3가지를 제시하시오.","ans":"① 서술형 및 논술형 ② 연구보고서법 ③ 프로젝트 평가 ④ 실기시험 ⑤ 실험·실습법 ⑥ 구술시험 ⑦ 면접법 ⑧ 관찰법 ⑨ 토론법","kw":["서술형","논술형","연구보고서법","프로젝트","실기시험","실험·실습법","구술시험","면접법","관찰법","토론법"],"id":"pyeongga-e55"},{"ch":"CH03 교육평가의 유형","t":"인지적 평가","q":"인지적 평가를 비형식적으로 수행하는 방안과 형식적으로 수행하는 방안 각각 1가지를 제시하시오.","ans":"비형식적 수행방안: 비형식적 관찰\n형식적 수행방안: 교실성취도검사, 수행평가, 산출물 평가","kw":["비형식적 관찰","교실성취도검사","수행평가","산출물 평가"],"id":"pyeongga-e56"},{"ch":"CH03 교육평가의 유형","t":"정의적 평가","q":"정의적 평가의 구체적인 평가대상의 예시와 수행방안 3가지를 제시하시오.","ans":"평가대상: 인간의 정서 및 의지의 발달을 바탕으로 형성되는 태도, 흥미, 자아개념, 가치, 불안, 도덕성, 학업적 자기존중, 통제, 동기 등\n수행방안\n① 질문지법(자기보고서법): 구체적인 질문을 던져 응답하게 하는 측정방법\n② 관찰법: 피험자를 통제하지 않으며, 일정한 시간에 걸쳐 피험자를 지켜보고 그 결과를 기록함\n③ 면담법: 대화를 통해서 특성을 파악하는 방법\n④ 투사법: 개인의 욕구 등이 밖으로 나올 수 있는 자극을 제시함으로써 인간의 내면에 숨어 있는 특성을 표출하게 하는 방법. 예) 잉크반점검사, 드로잉 테스트\n⑤ 의미분석법: 여러 가지 사물, 인간, 사상 등의 개념에 대한 심리적인 의미를 분석해 의미공간상의 위치로 표현하는 방법\n⑥ Q방법론: 인간의 관점, 의견과 같은 주관성을 과학적으로 연구하는 방법\n⑦ 사회성측정법: 소집단 내 구성원 간의 호의, 혐오, 무관심 등의 관계를 조사하여 집단 자체의 역동적 구조 상태를 알아보기 위한 방법","kw":["태도","흥미","자아개념","가치","불안","도덕성","질문지법","관찰법","면담법","투사법","의미분석법","Q방법론","사회성측정법"],"id":"pyeongga-e57"},{"ch":"CH03 교육평가의 유형","t":"사회성측정법","q":"사회성측정법의 개념과 장점, 단점 각각 2가지를 제시하시오.","ans":"개념: 소집단 내 구성원 간의 호의, 혐오, 무관심 등의 관계를 조사하여 집단 자체의 역동적 구조 상태를 알아보기 위한 방법\n장점\n① 개인의 사회적 적응 개선, 집단의 사회적 구조 개선, 집단 재조직 등에 도움을 줌\n② 전문적 훈련 없이도 작성·실시할 수 있어 일선 교사들에게 유용함\n단점\n① 한 번의 측정결과를 가지고 집단 구성원 간의 관계를 고정적으로 보는 오류를 범할 수 있음\n② 질문의 내용에 따라 학생들의 관계에 악영향을 줄 수도 있음","kw":["호의","혐오","무관심","역동적 구조","사회적 적응","전문적 훈련","고정적","악영향"],"id":"pyeongga-e58"},{"ch":"CH03 교육평가의 유형","t":"CBT","q":"컴퓨터 이용 검사(CBT)의 장점 3가지를 제시하시오.","ans":"① 검사결과의 채점 및 보고에 소요되는 시간과 경비를 줄일 수 있음\n② 응답결과나 검사결과의 즉각적인 피드백은 검사를 통한 학습 향상을 도모할 수 있음\n③ 동영상이나 음향파일, 그래프, 사진 등을 이용하여 다양한 형태의 문항을 제작할 수 있음\n④ 네트워크를 이용하면 어디서든 응시가 가능\n⑤ 기존의 지필검사를 치르지 못하던 피험자에게도 검사 실시 가능 ⇒ 시각장애자나 유아에게 음성을 이용한 검사 실시 가능\n⑥ 문항과 피험자에 대한 다양한 정보를 제공하고 지속적으로 저장, 관리할 수 있음","kw":["시간과 경비","즉각적인 피드백","다양한 형태의 문항","네트워크","지필검사","저장","관리"],"id":"pyeongga-e59"},{"ch":"CH03 교육평가의 유형","t":"CAT","q":"단순히 컴퓨터를 이용하는 검사방법과 구별되는 컴퓨터 능력적응검사(CAT)의 특징 2가지와 이에 따른 장점 2가지를 제시하시오.","ans":"특징\n① 개별 피험자의 능력에 맞는 문항을 제시하여 문항을 맞히면 더 어려운 문항을, 틀리면 더 쉬운 문항을 제시하여 피험자의 응답 결과에 적응하는 방식으로 실시함\n② 지필검사보다 충분한 수의 양질의 문항(높은 변별도와 낮은 추측도를 가진 문항)을 가진 문제은행을 필요로 함\n③ 컴퓨터화 능력적응검사에는 고전검사이론보다 문항반응이론(∵문항모수와 피험자 능력모수의 불변성을 가지므로)이 적합함\n장점\n① 피험자의 능력에 맞는 문제를 제시함으로써 동기를 유발하고 사기를 진작시킴\n② 피험자의 능력수준에 부합한 검사를 실시했을 때 보다 정확한 결과를 얻을 수 있으므로 컴퓨터 능력적응검사를 이용하면 보다 적은 수의 문항으로 보다 정확한 피험자의 능력을 추정할 수 있음 ⇒ 측정의 효율성\n③ 개인마다 다른 형태의 검사를 시행함으로써 검사 도중 발생하는 부정행위를 방지할 수 있음\n④ 검사문항 내용에 대한 정보 유출의 가능성을 최소화할 수 있음","kw":["적응","문제은행","문항반응이론","동기를 유발","측정의 효율성","부정행위","정보 유출"],"id":"pyeongga-e60"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가의 개념과 특징 3가지를 제시하시오.","ans":"개념: 평가도구의 개발, 시행, 채점, 결과분석, 피드백 등을 포함한 평가의 모든 과정이 디지털 환경에서 이루어지는 평가방식\n특징 및 장점\n① 텍스트 기반의 평가를 넘어 멀티미디어 및 상호작용적 요소를 활용하여 다양한 방식의 평가가 가능함\n② 개별화된 학습경험을 제공함 ⇨ AI와 빅데이터 분석기술을 활용한 디지털평가는 개별화된 피드백을 실시간으로 제공할 수 있어 학생의 학습경험을 최적화함\n③ 자동화된 채점 및 피드백이 용이함 ⇨ 평가와 동시에 채점이 즉시 이루어지며, 학생들에게는 즉각적인 피드백이 제공됨\n④ 평가에 대한 접근성이 향상됨 ⇨ 시간과 장소에 구애받지 않고 평가를 진행할 수 있어 다양한 교육상황에서 유용함\n⑤ 학생의 응답에 따라 문항 난이도를 실시간으로 조절하는 등 적응형 평가(adaptive test)로 구현될 수 있음 ⇨ 평가의 정확성과 효율성을 높일 수 있음\n⑥ 인공지능과 빅데이터 분석을 활용하여 학생의 학습스타일과 능력에 따라 평가할 내용을 조정하는 맞춤형 평가가 가능함\n⑦ 학생의 성장과 변화를 추정할 수 있음 ⇨ 실시간으로 학습데이터를 수집하고 분석할 수 있으며, 시간 경과에 따라 축적된 데이터를 기반으로 학습자의 성취 변화와 학습 경향을 보다 정확하고 세밀하게 추정할 수 있음\n⑧ 디지털평가에서 학습지원을 위한 유니버설 디자인(UDL)과 보조기술(assistive technology)의 통합이 가능함 ⇨ 평가의 공정성을 증진하는 데 기여함","kw":["디지털 환경","멀티미디어","개별화된 피드백","자동화된 채점","접근성","적응형 평가","맞춤형 평가","유니버설 디자인","보조기술"],"id":"pyeongga-e61"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가의 구성요소 5가지를 제시하시오.","ans":"① 평가도구 및 플랫폼: 온라인 시험 시스템, 학습관리시스템(LMS), 자동채점 도구 등\n② 문항 설계 및 구현방식\n③ 채점 및 피드백 시스템\n④ 학습데이터 수집 및 분석 도구\n⑤ 보안 및 개인정보 보호","kw":["평가도구 및 플랫폼","LMS","문항 설계","채점 및 피드백","학습데이터","보안","개인정보 보호"],"id":"pyeongga-e62"},{"ch":"CH03 교육평가의 유형","t":"디지털 포트폴리오","q":"디지털 포트폴리오와 일반 포트폴리오의 공통점 2가지, 일반 포트폴리오와 구별되는 디지털 포트폴리오의 장점 2가지를 제시하시오.","ans":"공통점\n① 학습과정의 기록과 반영이라는 측면에서 두 방식 모두 학생의 학습 여정을 보여주며, 단순한 결과물보다는 과정을 중시하는 평가방식을 지향함\n② 개별 학습자의 특성과 성취를 반영하는 맞춤형 평가도구로 널리 활용됨\n③ 학생의 다양한 학습성과를 종합적으로 평가할 수 있음\n장점\n① 자료의 저장 및 관리가 용이함\n② 다양한 미디어 형식의 자료를 통합할 수 있어 학생의 다양한 능력과 역량을 보다 효과적으로 반영할 수 있음\n③ 저장된 자료에 대한 수정과 재편집이 가능하여 학습자가 지속적으로 자신의 학습결과를 보완할 수 있는 기회를 제공함\n④ 피드백이 즉각적으로 제공됨\n⑤ 텍스트와 이미지에 기반한 기존 포트폴리오 방식과 달리 비디오, 오디오 파일 등 다양한 멀티미디어 자료를 포함할 수 있고, 정적인 페이지가 아닌 플립북 형태의 동적인 페이지 전환, 슬라이드 쇼 등을 통해 더욱 생동감 있는 콘텐츠 표현이 용이함","kw":["학습 여정","과정을 중시","맞춤형 평가도구","저장 및 관리","미디어 형식","수정과 재편집","즉각적","멀티미디어","플립북"],"id":"pyeongga-e63"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가 개발 및 적용의 고려사항 3가지를 제시하시오.","ans":"① 학생마다 다른 시험을 치르고 개별 피드백을 받기 때문에, 평가의 목적에 따라 디지털평가가 실시되어야 함\n② 디지털평가의 무결성(데이터의 정확성과 안정성을 보장하는 것)이 필요함 ⇨ 디지털화된 학생의 답안이 시스템 오류나 서버 다운 같은 기술적 문제로 인해 손상되거나 누락되지 않도록 백업 시스템, 자동저장 기능, 정기적인 시스템 점검 등의 기술적인 조치를 취함으로써 안정성이 확보되어야 함\n③ 디지털평가의 확산과 함께 평가기준 개발과 윤리적 책임이 요구됨\n④ 디지털평가의 보안 및 개인정보 보호가 고려되어야 함\n⑤ 디지털평가의 공정성과 관련하여 학생들의 디지털 격차와 기술 및 정보 접근성의 환경적 불균형 문제가 발생할 수 있음\n⑥ 디지털평가를 위해 디지털 역량 및 전문성 개발이 필요함","kw":["무결성","백업 시스템","자동저장","윤리적 책임","보안","개인정보 보호","디지털 격차","전문성 개발"],"id":"pyeongga-e64"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항 제작 시 질문과 선지 작성의 유의사항 각각 2가지를 제시하시오.","ans":"질문 작성의 유의사항\n① 출제 의도가 학생에게 분명하게 전달되도록 질문이 무엇에 대해 묻는 것인지 명확하게 드러나도록 작성함\n② 질문은 가급적 긍정문으로 하고, 부정문일 경우 밑줄로 표시함\n③ 질문 중 답을 암시하거나 단서가 되는 내용이 포함되지 않도록 함\n④ 가능한 단순하게 제시하되, 조건이 부족하지 않도록 유의함\n선지 작성의 유의사항\n① 일차적으로 문두에 대한 답지의 호응이 적절한지 확인함\n② 가능한 한 간단명료하게 제시하고, 반복되는 단어는 문두에 제시함\n③ 오답지는 그럴듯하고 매력적으로 만들어야 함\n④ 정답의 단서가 될 수 있는 요소들은 가급적 제거해야 함\n⑤ 답지들은 너무 이질적이지 않도록 해야 함\n⑥ 답지의 길이는 가급적 비슷하게 맞추되 길이가 다를 경우 짧은 것부터 긴 것 순서로 배열함. 단, 답지에 논리적 순서가 있는 경우에는 논리적 순서로 배열해야 함","kw":["긍정문","밑줄","단서","호응","간단명료","매력적","이질적","길이"],"id":"pyeongga-e65"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 채점이 쉽고, 객관성과 신뢰성이 높음\n② 문항의 답지를 조금만 수정해도 쉽게 문항의 난이도 조정이 용이함\n단점\n① 교수·학습과정에 대한 정보를 제공하지 못함\n② 문항의 제작이 다소 어렵고, 추측 요인을 배제할 수 없음","kw":["채점이 쉽고","객관성","신뢰성","난이도 조정","교수·학습과정","추측 요인"],"id":"pyeongga-e66"},{"ch":"CH04 교육평가의 실제","t":"논·서술형 문항","q":"논·서술형 문항의 특징 2가지와 논술형 문항의 제작원리 3가지를 제시하시오.","ans":"특징\n① 학생이 답이라고 생각하는 지식이나 의견 등을 직접 서술하는 방식\n② 학생의 생각이나 의견을 직접 서술하도록 하기 때문에 창의성, 문제해결력, 비판력, 판단력, 통합력, 정보수집력 및 분석력 등 고등사고기능 평가 가능\n③ 기술된 응답의 내용을 통해 학생이 어떠한 과정을 거쳐 그러한 답에 도달했는지와 같은 학습과 성취에 대한 풍부한 정보를 얻을 수 있음\n제작원리\n① 가능한 한 학생이 자신의 생각이나 의견을 드러낼 수 있도록 작성해야 함\n② 구체적인 교육목적을 평가할 수 있도록 문항을 구조화시키고 제한성을 갖도록 출제해야 함\n③ 출제 과정에서 출제자는 사전에 모범답안을 작성해야 하며, 모범답안 작성 후에는 채점기준표를 작성해야 함\n④ 선발을 위한 시험에서는 여러 문항 중 일부만 선택하여 응답하게 하는 일이 없도록 해야 함\n⑤ 평가결과는 학생의 현재 학습에 대한 정보를 수집하는 데 활용될 수 있어야 함\n⑥ 평가결과는 학생의 성장을 이끌 수 있는 피드백으로 작용하도록 해야 함","kw":["직접 서술","고등사고기능","풍부한 정보","구조화","제한성","모범답안","채점기준표","일부만 선택"],"id":"pyeongga-e67"},{"ch":"CH04 교육평가의 실제","t":"논술형 문항","q":"논술형 문항의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 피험자의 응답을 어느 형태로든 제한하지 않고 자유를 주므로 피험자가 지니고 있는 모든 정신능력을 발휘할 수 있음\n② 피험자들의 조직력, 분석력, 비판력, 종합력, 창의력, 문제해결능력을 함양시킬 수 있음\n단점\n① 논술형 검사는 많은 문항을 출제하기가 용이하지 않으므로 학업성취도 검사 시 넓은 교과 영역을 측정하기 쉽지 않음\n② 광범위한 내용을 논술하는 문제는 어려움\n③ 문장력이 작용하여 채점에 영향을 줄 수 있음\n④ 논술형 문항의 답을 여러 채점자가 채점할 때 모두 다른 점수를 부여할 수밖에 없고, 같은 피험자의 답안지를 같은 채점자가 다른 시간에 채점할 때도 다른 점수를 부여할 수 있으므로 채점의 일관성이 문제됨\n⑤ 문항이 제대로 제작되지 않는다면 선택형보다 더욱 단순한 지식의 인지 여부를 묻는 질문이 될 수 있음","kw":["모든 정신능력","조직력","분석력","비판력","종합력","창의력","넓은 교과 영역","문장력","채점의 일관성"],"id":"pyeongga-e68"},{"ch":"CH04 교육평가의 실제","t":"논·서술형 효과","q":"논·서술형 평가의 교육적 효과를 학생 측면, 교사 측면에서 각각 2가지씩 서술하시오.","ans":"학생 측면\n① 학생 스스로 사고하고 표현할 수 있는 기회 제공 ⇒ 학생들이 문항이 지시하는 범위 내에서 자유롭게 사고하여 답을 서술할 수 있기 때문에 보다 자유로운 표현과 반응을 보일 수 있음\n② 창의력, 표현력, 문제해결력과 같은 다양한 역량을 측정하고, 학생들의 추론, 해석, 적용의 과정을 포함하여 평가하므로 이를 촉진할 수 있음 ⇒ 자기의 지식이나 기능을 다양한 역량을 바탕으로 활용하게 되는 직접적 반응을 보여 자기주도적 역량 등 다양한 역량들을 활용하게 됨\n③ 학생들의 도달 수준에 따라 부분점수를 부여함 ⇒ 잘하는 학생뿐 아니라 평가결과에 대해 자신감을 가지지 못했던 학생들도 성취를 맛볼 수 있는 경험을 제공하고, 학습욕구 자극이 가능함\n교사 측면\n① 학생에 대한 깊이 있는 이해가 가능함 ⇒ 교사들은 문항을 보다 깊고 넓게 다룰 수 있기 때문에 학생들 개개인의 사고와 지식의 폭을 확인할 수 있으며 개별 학생들의 답안을 여러 번 살펴보는 과정을 통해 개별 학생들의 성취수준이 어느 정도인지 파악할 수 있음\n② 교수학습에 필요한 정보를 얻을 수 있음 ⇒ 학생들의 답안지를 직접 채점하면서 전체적인 학생들의 답안을 살펴봄으로써 자신이 가르친 내용에 대한 학생들의 전반적인 이해 정도를 비교적 정확하게 파악할 수 있음","kw":["사고하고 표현","자유로운 표현","창의력","표현력","문제해결력","부분점수","깊이 있는 이해","교수학습에 필요한 정보"],"id":"pyeongga-e69"},{"ch":"CH04 교육평가의 실제","t":"타당도","q":"타당도의 개념과 타당도의 종류 6가지를 제시하시오.","ans":"개념: 평가도구가 측정대상의 특성을 얼마나 충실하게 측정하고 있는지를 의미함\n종류: ① 내용타당도 ② 안면타당도 ③ 준거타당도 ④ 구인타당도 ⑤ 결과타당도 ⑥ 생태학적 타당도","kw":["충실하게 측정","내용타당도","안면타당도","준거타당도","구인타당도","결과타당도","생태학적 타당도"],"id":"pyeongga-e70"},{"ch":"CH04 교육평가의 실제","t":"내용타당도","q":"내용타당도의 개념과 내용타당도를 높이는 방법 1가지, 내용타당도 중 교수타당도와 교과타당도 각각의 개념을 제시하시오.","ans":"개념: 검사를 구성하는 문항들이 검사에서 측정하고자 하는 내용과 행동영역을 대표하고 있는 정도\n내용타당도를 높이는 방법: 교육목표를 내용과 행동영역으로 이분화해서 표현한 이원분류표를 작성한 후 제작된 검사도구에 잘 반영되었는지를 판단함\n교수타당도: 검사 내용이 교사가 학생에게 가르친 수업내용과 일치하는 정도. 학생이 학교에서 배운 지식과 기술을 검사가 얼마나 충실하게 측정하는가\n교과타당도: 검사 문항이 교육과정에서 다루는 내용을 얼마나 잘 대표하는가","kw":["내용과 행동영역","대표","이원분류표","교수타당도","수업내용","교과타당도","교육과정"],"id":"pyeongga-e71"},{"ch":"CH04 교육평가의 실제","t":"안면타당도","q":"안면타당도를 확보하는 방법 2가지를 제시하시오.","ans":"① 평가전문가가 특정 평가방법이나 도구에 대해 전문가 입장에서 검토하여 타당성 여부를 판단함\n② 평가대상이 될 학생들과 비슷한 수준에 있는 다른 학생들에게 평가도구를 보여주고 평가내용이나 방법 등이 적절한지 여부를 확인함","kw":["평가전문가","검토","비슷한 수준","적절한지"],"id":"pyeongga-e72"},{"ch":"CH04 교육평가의 실제","t":"준거타당도","q":"준거타당도의 개념과 준거타당도의 종류 2가지 각각의 명칭, 개념, 장점과 단점 1가지씩을 제시하시오.","ans":"개념: 검사점수와 외적 준거와의 관계를 통해 도구의 타당성을 평가하는 것\n종류\n*예언타당도: 현재 검사에서 획득한 점수가 미래의 행동특성을 얼마나 잘 예측하는가\n∙장점: 계량화된 수치로 타당도를 제공함\n∙단점: 예언변수가 미래 행위이므로 동시 측정이 불가능하고, 검사의 타당성을 검증하기 위해서는 시간이 필요함\n*공인타당도: 이미 타당성을 인정받은 기존 검사의 점수를 준거변수로 하여 검사의 타당도를 평가하는 방법\n∙장점: 계량화된 수치로 타당도를 제공함\n∙단점: 타당성이 입증된 기존의 검사가 없으면 타당도를 추정할 수 없음","kw":["외적 준거","예언타당도","미래의 행동특성","계량화된 수치","동시 측정","공인타당도","준거변수","기존의 검사"],"id":"pyeongga-e73"},{"ch":"CH04 교육평가의 실제","t":"구인타당도","q":"구인타당도와 구인 각각의 개념, 구인타당도를 평가하는 방법 1가지를 제시하시오.","ans":"구인타당도: 검사를 통해 측정하고자 하는 구인이 무엇인지에 대한 조작적 정의를 내리고 검사가 정의된 구인을 얼마나 제대로 측정하고 있는지를 판단하여 검사의 타당도를 평가하는 것\n구인: 개인이 가지고 있는 특성으로 이론적 근거에 기반을 둔 추상적·가설적인 개념으로서 직접적 관찰이 불가능한 잠재적 변인\n평가방법\n① 요인분석법: 문항 간의 상관관계를 바탕으로 검사에서 측정하고 있는 구인이 무엇인지, 각 문항들이 의도한 대로 구인을 잘 측정하고 있는지 등을 파악하기 위한 통계적 방법\n② 중다특성-중다방법 행렬표: 구인타당도를 평가하기 위해 이미 널리 알려진 다른 검사와의 상관관계를 이용하여 검사의 타당도를 평가하는 방법","kw":["조작적 정의","추상적","가설적","잠재적 변인","요인분석법","중다특성-중다방법"],"id":"pyeongga-e74"},{"ch":"CH04 교육평가의 실제","t":"결과·생태학적 타당도","q":"결과타당도와 생태학적 타당도 각각의 개념을 제시하시오.","ans":"결과타당도(체제적 타당도): 어떤 검사를 실시함으로써 체제(system) 전체에 교육적으로 이점이 있었는가의 여부를 검토하는 것. 검사의 시행이나 결과에 의해 발생할 수 있는 교육적·사회적 파급효과를 중시함\n생태학적 타당도: 검사의 내용이나 절차가 피험자들의 사회·문화적인 배경이나 주변 상황에 타당한가","kw":["체제적 타당도","교육적 이점","파급효과","사회·문화적인 배경","주변 상황"],"id":"pyeongga-e75"},{"ch":"CH04 교육평가의 실제","t":"신뢰도","q":"신뢰도의 개념과 신뢰도와 타당도의 관계를 설명하시오.","ans":"개념: 검사를 통하여 측정하고자 하는 것을 얼마나 안정적으로 측정하고 있는가\n신뢰도와 타당도의 관계: 신뢰도는 타당도의 필수조건이지만 충분조건은 아님 ⇒ 신뢰도가 높다고 해서 타당도가 반드시 높다고 할 수 없음","kw":["안정적으로 측정","필수조건","충분조건"],"id":"pyeongga-e76"},{"ch":"CH04 교육평가의 실제","t":"신뢰도","q":"신뢰도에 영향을 미치는 요인 2가지와 신뢰도를 높이는 구체적인 방안 2가지를 제시하시오.","ans":"요인\n① 피험자 관련 요인: 피험자 집단의 능력이 이질적(집단 내에 능력이 낮은 피험자부터 높은 피험자까지 고르게 포함)일 경우 검사의 신뢰도가 높음\n② 검사도구 관련 요인: 검사의 문항 수가 증가하면 신뢰도는 증가함\n③ 검사시행 관련 요인: 검사가 시행되는 환경, 검사를 시행하는 감독관, 채점자와 피험자의 관계 등의 요인이 검사의 신뢰도에 영향을 미칠 수 있음\n방안\n① 동일 조건이라면 문항 수가 많을수록 신뢰도는 높아질 수 있음 ⇒ 검사에 포함된 기존 문항의 내용과 특성이 잘 부합하는 양질의 문항이 추가될 때 신뢰도가 증가함\n② 넓은 범위의 내용을 포함하는 검사보다 좁은 범위의 내용을 포함하는 검사가 신뢰도가 더 높음\n③ 문항의 난이도와 변별도를 조정함으로써 신뢰도를 높일 수 있음\n④ 요인분석 또는 문항분석을 실시하여 신뢰도를 낮추고 있는 문항을 찾아낸 후에 제거함","kw":["피험자 관련 요인","이질적","검사도구 관련 요인","문항 수","검사시행 관련 요인","좁은 범위","난이도","변별도"],"id":"pyeongga-e77"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"내적 일관성 신뢰도의 개념, 이를 통해 추정할 수 있는 계수의 명칭, 내적 일관성 신뢰도를 추정하는 방법 2가지를 제시하시오.","ans":"개념: 검사를 한 번 실시하여 신뢰도를 추정하는 방법\n추정할 수 있는 계수: 동질성계수\n추정방법: ① 반분신뢰도 ② 문항내적합치도","kw":["한 번 실시","동질성계수","반분신뢰도","문항내적합치도"],"id":"pyeongga-e78"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"반분신뢰도의 개념과 장점, 단점 각각 1가지를 제시하시오.","ans":"개념: 하나의 검사를 시행하고 검사를 두 부분으로 분할한 후 두 검사의 문항 간 상관관계를 이용하여 신뢰도를 추정하는 방법. 스피어만-브라운 공식 적용\n장점: 검사를 두 번 시행할 필요가 없다는 점에서 시행이 편리함. 기억이나 연습효과를 배제할 수 있음\n단점: 검사를 분할하는 방법에 따라서 신뢰도에 영향을 줌. 분할방법: 짝수·홀수 문항, 검사의 전·후반부, 무작위(random)로 나누는 방법 등(분할된 두 개의 검사가 동형검사가 되어야 함)","kw":["두 부분으로 분할","스피어만-브라운","기억","연습효과","분할하는 방법","동형검사"],"id":"pyeongga-e79"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"문항내적합치도의 개념과 장점 1가지를 제시하시오.","ans":"개념: 검사 속의 문항들을 각각 독립된 한 개의 검사로 보고, 문항에 반응하는 응답의 일관성에 근거하여 그들 간의 합치도, 동질성, 일치성을 종합하는 신뢰도 추정방법. 크론바흐 α계수(Cronbach alpha), KR-20, KR-21 등의 계수 사용\n장점: 하나의 검사로 신뢰도를 추정할 수 있음","kw":["독립된 한 개의 검사","응답의 일관성","합치도","동질성","크론바흐","KR-20","KR-21"],"id":"pyeongga-e80"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"검사-재검사 신뢰도의 개념, 이를 통해 추정할 수 있는 계수의 명칭, 이러한 추정방식의 장점과 단점 각각 1가지를 제시하시오.","ans":"개념: 동일한 평가도구를 동일한 피험자들에게 시간 간격을 두고 두 번 실시한 다음 두 점수 간의 상관관계로 신뢰도를 추정하는 방법\n추정할 수 있는 계수: 안정성계수\n장점: 동일한 검사를 두 번 시행하기 때문에 검사 시행과 신뢰도의 추정이 비교적 쉬움\n단점: 검사를 두 번 치르기 때문에 기억효과, 연습효과, 높은 피로 발생 등 시행효과가 발생 ⇒ 검사 실시 간격을 적절하게 설정해야 함","kw":["시간 간격","두 번 실시","안정성계수","기억효과","연습효과","시행효과"],"id":"pyeongga-e81"},{"ch":"CH04 교육평가의 실제","t":"신뢰도 추정","q":"동형검사 신뢰도와 동형검사 각각의 개념, 이를 통해 추정할 수 있는 계수의 명칭, 이러한 추정방식의 장점과 단점 각각 1가지를 제시하시오.","ans":"동형검사 신뢰도: 동일한 피험자에게 똑같은 검사가 아닌 서로 비슷한 검사를 두 번 시행하여 상관계수로 신뢰도를 추정함\n동형검사: 문항의 수, 난이도, 문항의 내용과 형식 등에서 동등한 검사\n추정할 수 있는 계수: 동형성계수\n장점: 검사-재검사 신뢰도와는 달리 연습효과나 망각에 의하여 신뢰도 추정에 영향을 끼치는 것을 최소화할 수 있음\n단점: 내용과 형식이 동일한 두 개의 동형검사를 제작하는 것이 현실적으로 쉽지 않음","kw":["비슷한 검사","동형성계수","문항의 수","난이도","연습효과","망각","제작"],"id":"pyeongga-e82"},{"ch":"CH04 교육평가의 실제","t":"객관도","q":"객관도의 개념과 객관도의 종류 2가지의 명칭을 그에 적합한 개념과 함께 제시하시오.","ans":"개념: 결과에 대해 여러 검사자나 채점자가 어느 정도로 일치된 평가를 하는가의 정도를 의미함. '검사자의 신뢰도'라고도 함\n종류\n① 채점자 내 신뢰도: 한 채점자가 같은 측정대상을 여러 번 채점한 결과가 일관성이 있는가를 나타냄\n② 채점자 간 신뢰도(일치도): 2명 이상의 채점자가 채점을 했을 때 결과가 어느 정도 일치하는가","kw":["일치된 평가","검사자의 신뢰도","채점자 내 신뢰도","채점자 간 신뢰도","일치도"],"id":"pyeongga-e83"},{"ch":"CH04 교육평가의 실제","t":"평정의 오류","q":"교사가 수행평가 상황에서 유의해야 할 평정의 오류 3가지를 설명하시오.","ans":"① 논리적 오류: 논리적으로 전혀 관계가 없는 두 가지 행동특성을 관련 있는 것으로 판단하는 오류\n② 후광효과(인상의 오류): 평정대상에 대하여 가진 특정 인상을 토대로 다른 특성을 좋거나 나쁘게 평정하는 오류\n③ 대비의 오류: 다른 사람을 판단함에 있어서 절대적 기준에 기초하지 않고 다른 대상과의 비교 또는 자신과의 비교를 통해 평가하는 오류\n④ 근접의 오류: 비교적 유사한 항목들이 시간적·공간적으로 가까이 있을 때 비슷하게 평정하는 오류\n⑤ 표준의 오류: 평가자가 표준을 어디에 두는가에서 오는 오류\n⑥ 집중경향의 오류(집중화경향의 오류): 평정 시 극단적 평정치를 주는 것을 피하고 중간 점수를 주로 주는 오류\n⑦ 무관심의 오류: 평가자가 피평가자의 행동을 면밀하게 관찰하지 못한 경우 발생하는 오류\n⑧ 의도적 오류: 특정 학생에게 특정한 상을 주기 위해 관찰결과와 다르게 과장하여 평가하는 오류\n⑨ 일반화 오류: 한 교과에서 학생이 보이는 정의적 특성이 다른 교과에도 적용된다고 판단하는 오류\n⑩ 관대의 오류: 평가자가 자신과 관련되어 있는 피평가자의 실제 직무수행이나 성과보다 높게 평가하는 오류\n⑪ 엄격의 오류: 평가자가 평가대상자의 실제 수행수준보다 낮은 수준으로 평가하는 오류","kw":["논리적 오류","후광효과","인상의 오류","대비의 오류","근접의 오류","표준의 오류","집중경향","무관심","의도적","일반화","관대","엄격"],"id":"pyeongga-e84"},{"ch":"CH04 교육평가의 실제","t":"실용도","q":"실용도의 개념과 확보 시 고려사항 2가지를 제시하시오.","ans":"개념: 평가방법, 도구의 제작과정, 시행방법, 절차, 평가결과를 채점하거나 분석하기 위해 소요되는 인적·물적 자원의 양과 질이 주변 여건에 비추어 실용적인가를 나타내는 정도\n고려사항\n① 실시 방법이 쉬워야 함\n② 실시하는 데 소요되는 시간이 적절해야 함\n③ 채점하기 쉬워야 함\n④ 결과를 해석하거나 활용하기 쉬워야 함","kw":["인적","물적 자원","주변 여건","실시 방법","소요되는 시간","채점","해석","활용"],"id":"pyeongga-e85"},{"ch":"CH04 교육평가의 실제","t":"문항분석","q":"문항분석의 개념과 문항분석의 필요성 2가지를 제시하시오.","ans":"개념: 검사에 포함된 문항 하나하나를 평가가 의도한 기능을 제대로 수행하고 있는가를 점검하는 것. 문항의 양호도, 즉 문항이 양호한 정도에 대한 판단을 의미함\n필요성\n① 문항분석을 통하여 문항이 평가목적을 제대로 수행하고 있는지를 확인하는 작업이 필요함\n② 개별 문항 자체의 양호도를 분석하여 문항의 질을 개선하기 위함\n③ 만들어진 문항의 장기적인 사용을 위해서는 문제은행을 개발해야 하는데, 이때 문항분석은 선행조건이 됨","kw":["의도한 기능","양호도","평가목적","질을 개선","문제은행"],"id":"pyeongga-e86"},{"ch":"CH04 교육평가의 실제","t":"문항 지표","q":"문항곤란도, 문항변별도, 문항추측도, 문항적합도, 문항편파성 각각의 개념을 서술하시오.","ans":"문항곤란도: 문항이 어려운 정도를 나타내는 것. '문항난이도'라고도 함\n문항변별도: 문항이 검사를 통해 측정하고자 하는 능력의 수준이 높은 사람과 낮은 사람을 구별해낼 수 있는 정도\n문항추측도: 능력이 전혀 없는 학생이 추측을 통해 정답을 맞힐 정도를 나타냄\n문항적합도: 특정 문항에 대하여 모형에서 예측한 응답유형과 실제 자료상의 응답유형 간의 차이를 통해 해당 문항이 일반적인 응답유형과 비교하여 얼마나 일치하는지를 보여주는 통계지수\n문항편파성: 문항의 수행 정도가 피검자나 문항 특성에 따라 불리하거나 유리한 정도를 의미","kw":["문항곤란도","문항난이도","문항변별도","구별","문항추측도","문항적합도","응답유형","문항편파성"],"id":"pyeongga-e87"},{"ch":"CH04 교육평가의 실제","t":"질적 문항분석","q":"질적 문항분석 시 확인사항 2가지를 제시하시오.","ans":"① 문항이 검사목적을 잘 수행하고 있는지, 모집단을 잘 대표하는 문항으로 구성되어 있는지 살펴보아야 함. 이를 확인하는 방법은 미리 문항 개발 당시 제작한 이원분류표와 일치하는지 확인함\n② 문항이 해당 학생의 언어수준이나 검사 시행상황 등을 고려하여 출제되었는가를 확인함\n③ 문항의 정답이 논쟁거리가 되지는 않는가를 확인함\n④ (선다형 문항이라면) 오답지가 매력적인가를 확인함","kw":["검사목적","모집단","이원분류표","언어수준","논쟁거리","오답지"],"id":"pyeongga-e88"}]},"교육과정":{"mc":[{"ch":"CH01 교육과정의 개념과 유형","t":"교육과정의 수준","q":"교육과정의 진행과정에 따른 수준 중 '계획된 교육과정'의 개념으로 옳은 것은?","opts":["공식적인 문서로서의 교육과정으로, 교육과정을 실행하기 위한 지침의 역할을 함","교사들이 학교에서 실제로 전개한 교육과정으로, 교사의 실천적인 수업행위를 지칭함","교육의 결과로 학생들에게 구현된 교육과정","학교가 계획하거나 의도하지 않았음에도 학생이 경험한 교육과정"],"a":0,"exp":"계획된 교육과정은 공식적인 문서로서의 교육과정이며 교육과정 실행 지침의 역할을 한다. ②는 실행된 교육과정, ③은 경험된 교육과정, ④는 잠재적 교육과정이다.","id":"gwajeong-m0"},{"ch":"CH01 교육과정의 개념과 유형","t":"교육과정의 수준","q":"'계획된 교육과정'의 특징으로 옳은 것은?","opts":["진행될 교육활동에서 기대하는 바를 담고 있으며 교육목표와 내용, 교수-학습방법, 평가 등에 관한 사항을 포함함","교사의 가치관이나 신념에 기반하여 문서를 해석하고 실천함","학생들이 결과적으로 획득한 경험이나 성취, 태도 등을 포함함","의도한 교육과정의 실질적인 성과를 판단하도록 해줌"],"a":0,"exp":"계획된 교육과정의 특징은 ①교육목표와 내용, 교수-학습방법, 평가 등에 관한 사항 포함 ②국가·지역·학교 수준에서 계획된 문서, 개별 교사가 자신의 수업을 위해 계획한 문서 등을 포함함이다.","id":"gwajeong-m1"},{"ch":"CH01 교육과정의 개념과 유형","t":"교육과정의 수준","q":"'실행된 교육과정'의 특징으로 옳은 것은?","opts":["계획된 문서와 실행된 교육과정은 달라질 수 있으며, 실행된 교육과정은 학생들에게 직접적인 영향을 미침","교육목표와 내용, 평가 등에 관한 사항을 문서로 포함함","학생들이 결과적으로 획득한 경험이나 성취, 태도 등을 포함함","계획되고 실행된 교육과정이 학생들에게 어떻게 받아들여지는가에 초점을 둠"],"a":0,"exp":"실행된 교육과정은 계획된 문서와 달라질 수 있으며(교사의 가치관·신념, 교실맥락, 학생 배경 고려), 학생들에게 직접적인 영향을 미친다. ③④는 경험된 교육과정이다.","id":"gwajeong-m2"},{"ch":"CH01 교육과정의 개념과 유형","t":"교육과정의 수준","q":"'경험된 교육과정'의 특징으로 옳지 않은 것은?","opts":["계획되고 전개된 교육과정은 본래 의도한 바대로 학생들에게 그대로 경험된다","교수-학습의 과정을 통해 학생들이 결과적으로 획득한 경험이나 성취, 태도 등을 포함함","계획되고 실행된 교육과정이 학생들에게 어떻게 받아들여지는가에 초점을 둠","의도한 교육과정의 실질적인 성과를 판단하도록 해줌"],"a":0,"exp":"'계획되고 전개된 교육과정은 본래 의도한 바대로 학생들에게 경험되지 않는 경우가 많음'이 특징이므로 ①은 정반대이다.","id":"gwajeong-m3"},{"ch":"CH01 교육과정의 개념과 유형","t":"공식적 교육과정","q":"공식적 교육과정의 개념으로 옳은 것은?","opts":["무엇을, 어떻게, 왜 가르칠 것인가에 대한 계획을 담고 있는 가시적·표면적인 교육과정으로, 사전에 의도되고 계획된 문서로서의 교육과정","학교에서 계획하거나 의도하지 않았음에도 학생이 학교생활을 통해 경험한 교육과정","가르칠 만한 가치가 있지만 배제된 교육과정","교사와 학생이 함께 만들어가는 교육과정"],"a":0,"exp":"공식적 교육과정은 가시적·표면적 교육과정으로 사전에 의도되고 계획된 문서로서의 교육과정이며 '계획된 교육과정'에 해당한다.","id":"gwajeong-m4"},{"ch":"CH01 교육과정의 개념과 유형","t":"공식적 교육과정","q":"교육과정의 결정 주체에 따른 공식적 교육과정 중 '지역 교육과정'에 해당하는 것은?","opts":["국가교육과정을 기초로 하여 17개 시·도 교육청이 관내 학교를 위해 마련한 교육과정 편성·운영지침","교육부장관의 이름으로 고시되는 초·중등학교 교육과정 문서","국가교육과정과 지역교육과정을 근거로 하여 편성된 학교운영계획","교사가 자신의 수업을 위해 계획한 문서"],"a":0,"exp":"지역 교육과정은 17개 시·도 교육청이 관내 학교를 위해 마련한 교육과정 편성·운영지침이다. ②는 국가교육과정(총론과 각론으로 구분), ③은 학교교육과정이다.","id":"gwajeong-m5"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정","q":"잠재적 교육과정의 개념으로 옳은 것은?","opts":["학교에서 계획하거나 의도하지 않았음에도 불구하고 학생이 학교생활을 통해 경험한 교육과정","가르칠 만한 가치가 있지만 배제되어 실제로 존재하지 않는 교육과정","사전에 의도되고 계획된 문서로서의 교육과정","교사가 실제로 전개한 교육과정"],"a":0,"exp":"잠재적 교육과정은 학교가 계획·의도하지 않았음에도 학생이 학교생활을 통해 경험한 교육과정이다. ②는 영교육과정이다.","id":"gwajeong-m6"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정","q":"잠재적 교육과정의 특징으로 옳지 않은 것은?","opts":["공개적으로 드러난 상태에서 일어나는 학습이라는 점에서 공식적 교육과정에 속한다","학급문화, 수업 분위기 등 학생의 지식, 태도, 행동에 영향을 미치는 것이다","학생이 은연중에 학습하게 되는 것이다","공개적으로 드러나지 않은 상태에서 일어나는 학습이라는 점에서 비공식적 교육과정이다"],"a":0,"exp":"잠재적 교육과정은 공개적으로 드러나지 않은 상태에서 일어나는 학습이라는 점에서 비공식적 교육과정이므로 ①은 옳지 않다.","id":"gwajeong-m7"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정","q":"잠재적 교육과정에 대한 '의도성이 있다는 관점'의 설명으로 옳은 것은?","opts":["교육과정을 결정하는 권력자나 집단에 의해 계획되었다고 보는 관점으로, 잠재적 교육과정을 '숨겨진 교육과정'이라고 하며 공식적 교육과정에 특정 의도나 가치가 숨겨져 있다고 봄","계획되거나 의도되지 않았다고 보는 관점으로, 잠재적 교육과정을 공식적 교육과정의 부산물로 바라봄","공식적 교육과정을 가르칠 때 필연적으로 따르는 것","학교가 가르치지 않아 학습자가 배울 기회를 갖지 못하는 것"],"a":0,"exp":"의도성이 있다는 관점은 권력자나 집단에 의해 계획되었다고 보아 '숨겨진 교육과정'이라 한다. ②③은 의도성이 없다는 관점이다.","id":"gwajeong-m8"},{"ch":"CH01 교육과정의 개념과 유형","t":"잭슨","q":"잭슨(Jackson)이 주장한 잠재적 교육과정의 원천 중 '군집성(crowd)'에 해당하는 설명은?","opts":["학교라는 제한된 물리적 공간 속에서 다양한 계층의 학생들이 함께 생활하면서 상호간의 어울림을 통하여 집단생활에서 규칙을 준수하는 태도를 배우는 것","학생들이 상호간 또는 교사에 의하여 얻게 되는 평가와 그에 따른 보상 및 처벌 행위를 경험하며 그 안에서 살아가는 방법을 배우는 것","학교조직을 통하여 권력관계를 배우고 교사와 학교의 권위에 적응·순종하는 방법을 배우는 것","학교가 의도적으로 특정 지식을 배제하는 것"],"a":0,"exp":"군집성은 제한된 물리적 공간에서 다양한 계층의 학생들이 함께 생활하며 집단생활의 규칙 준수 태도를 배우는 것이다. ②는 상찬/평가(praise), ③은 권력(power)이다.","id":"gwajeong-m9"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정 극복","q":"잠재적 교육과정을 극복하기 위한 '교육평가' 측면의 방안으로 옳은 것은?","opts":["의도한 목표를 얼마나 달성했는지에 중점을 두는 목표중심 평가에서 벗어나, 의도하지 않은 결과까지 중시하는 탈목표(goal-free) 평가 또한 중시되어야 함","인지적 교육목표뿐만 아니라 정의적이고 인성적인 측면을 고려한 교육목표를 설정함","문화다원론적 관점에서 신중하게 교육내용을 선정하고 조직함","교사는 자신의 의식적·무의식적 태도와 반응이 학생에게 미칠 잠재적 영향력을 고려해야 함"],"a":0,"exp":"교육평가 측면의 방안은 탈목표(goal-free) 평가를 중시하여 교육의 결과를 종합적으로 평가하려는 태도이다. ②는 교육목표, ③은 교육내용, ④는 교사역할 측면이다.","id":"gwajeong-m10"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정 극복","q":"잠재적 교육과정 극복을 위한 '교육내용' 측면의 방안으로 옳은 것은?","opts":["학습경험을 선정하고 조직할 때 학습내용이 학습자에게 미칠 영향을 다각도로 고려하며, 특히 문화다원론적 관점에서 신중하게 교육내용을 선정하고 조직하는 태도가 요구됨","탈목표 평가를 중시함","교사가 모든 장면에서 모범을 보임","다양한 관점에서 교육목표를 검토하여 수립함"],"a":0,"exp":"교육내용 측면의 방안은 학습내용이 학습자에게 미칠 영향을 다각도로 고려하며 문화다원론적 관점에서 신중히 선정·조직하는 것이다.","id":"gwajeong-m11"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 개념으로 옳은 것은?","opts":["가르칠 만한 가치가 있지만 배제된 교육과정으로 실제로 존재하지 않는(null, 0이라는 뜻) 교육과정","계획하거나 의도하지 않았음에도 학생이 경험한 교육과정","사전에 의도되고 계획된 문서로서의 교육과정","교사가 실제로 전개한 교육과정"],"a":0,"exp":"영교육과정은 배울 만한 가치가 있지만 공식적 교육과정에 포함되지 않은 교육내용, 또는 교육과정에 포함되어 있지만 학교나 교사가 의도적·무의식적으로 가르치지 않은 학습내용이다.","id":"gwajeong-m12"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 조건으로 옳지 않은 것은?","opts":["학교가 이미 가르치고 있으나 학생이 이해하지 못한 내용","학교가 설정한 교육목표에 부합","학습자에게 가르칠 만한 가치가 있는 내용","학교가 가르치지 않아 학습자가 배울 기회를 갖지 못함"],"a":0,"exp":"영교육과정의 조건은 ②③④이다. 학교가 가르치지 않아 배울 기회가 없어야 하므로 ①은 옳지 않다.","id":"gwajeong-m13"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 발생원인으로 제시되지 않은 것은?","opts":["학생의 학업능력 부족에 의해 발생","정치적·사회적 요인에 의해 발생","교육과정 개발자가 지니는 편견이나 경직된 신념에 의해 발생","교육과정 개발자나 교사가 타성에 젖거나 의욕이 부족하여 발생"],"a":0,"exp":"영교육과정의 발생원인은 ②③④이다.","id":"gwajeong-m14"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 특징으로 옳은 것은?","opts":["선택의 결과로 포함과 배제의 산물이라는 점에서 공식적 교육과정의 필연적 산물임","학생이 은연중에 학습하게 되는 비공식적 교육과정임","교사가 실제로 전개한 교육과정임","학습자가 결과적으로 획득한 경험임"],"a":0,"exp":"영교육과정은 선택의 결과로 포함과 배제의 산물이라는 점에서 공식적 교육과정의 필연적 산물이며, 공식적 교육과정에 특정 교과가 없거나 특정 주제가 배제되면 학생들이 학습할 수 없다.","id":"gwajeong-m15"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정이 교육내용 선정에 주는 시사점으로 옳은 것은?","opts":["공식적으로 가르치지 않거나 소홀히 되는 영역은 시대와 사회가 변화함에 따라 더 중요해지기도 하며, 특정 정치(이념)·경제·문화(종교) 세력들에 의해 금기시된 영교육과정을 새롭게 조명함으로써 공식적 교육과정이 풍성해질 수 있음","교육과정 내용은 학문적 체계에 따라 고정되어야 함","잠재적 교육과정을 완전히 배제해야 함","교육내용은 교사의 신념에 따라 선정되어야 함"],"a":0,"exp":"영교육과정의 시사점은 금기시된 영역을 새롭게 조명함으로써 공식적 교육과정이 풍성해질 수 있다는 것이다.","id":"gwajeong-m16"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"'적극적 의미에서의 영교육과정'에 해당하는 설명은?","opts":["의도적으로 특정 지식, 가치, 행동양식을 배제시켜 아예 접할 수 없도록 지워버린 것으로, 잠재적 교육과정보다 고의성·의도성이 더 짙은 교육과정","학생들이 공식적 교육과정을 배우는 동안 놓치게 되는 '기회학습' 내용","학생이 은연중에 학습하게 되는 내용","교사가 전개한 실제 수업내용"],"a":0,"exp":"적극적 의미의 영교육과정은 의도적으로 특정 지식·가치·행동양식을 배제한 것으로 잠재적 교육과정보다 고의성·의도성이 짙다. ②는 소극적 의미이다.","id":"gwajeong-m17"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 개념으로 옳은 것은?","opts":["지식을 주된 내용으로 하는 교육과정으로, 전통적 문화유산과 학문적 성취 중 가장 본질적·항존적인 것을 선정하여 다음 세대에게 전달하는 교육과정","아동의 흥미와 관심을 바탕으로 경험의 계속적인 성장을 도모할 수 있는 환경을 제공하는 교육과정","각 학문에 내재되어 있는 '지식의 구조'와 지식의 탐구과정을 익히도록 하는 교육과정","교육과 학교환경의 인간화를 중시하며 학생의 잠재적인 능력 계발과 자아실현을 지향하는 교육과정"],"a":0,"exp":"교과중심 교육과정은 지식을 주된 내용으로 하며 본질적·항존적인 것을 선정하여 전달하는 교육과정이다. ②는 경험중심, ③은 학문중심, ④는 인간중심 교육과정이다.","id":"gwajeong-m18"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 철학적 기초 중 '항존주의'에 해당하는 설명은?","opts":["시간과 공간을 초월하여 변하지 않는 진리를 모든 학생이 똑같이 배워야 한다고 주장하며, 교육과정은 보편적이고 변하지 않는 인간의 삶의 주제를 다뤄야 한다고 봄","문화유산의 본질적 가치를 유지하고 전달하는 것이 교육의 목표라고 보며, 인류가 오랫동안 쌓아온 경험의 축적인 교과지식을 강조함","개인들의 실존적 선택과 행동을 통해 삶의 가치와 의미를 창조해나감","인간의 마음에 있는 능력을 단련하여 발달시킬 수 있다고 봄"],"a":0,"exp":"항존주의는 시공을 초월한 불변의 진리를 모두가 똑같이 배워야 한다고 본다. ②는 본질주의, ③은 실존주의, ④는 능력심리학이다.","id":"gwajeong-m19"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 심리학적 기초인 능력심리학의 주요 주장으로 옳은 것은?","opts":["인간 정신기능의 본체인 마음에 있는 몇 가지의 능력이 사물의 인식, 기억, 상상, 추리하는 기능을 한다고 봄","인간의 경험은 상호작용과 계속성의 원리에 따라 성장한다고 봄","지식은 개인의 자아성찰적 작용과 사회적 참여를 통해 구성된다고 봄","학습은 관찰 가능한 행동의 변화라고 봄"],"a":0,"exp":"능력심리학은 마음에 있는 몇 가지 능력이 인식·기억·상상·추리 기능을 한다고 보며, 인간의 정신은 단련에 의해 발달시킬 수 있다고 본다.","id":"gwajeong-m20"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 '교육방법' 측면 특징으로 옳은 것은?","opts":["교사중심의 일방적·직접적 교수법인 설명식·강의식 수업으로 진행하며, 교과지식의 정확한 이해를 중시하므로 반복 암기와 문제풀이 훈련을 강조함","학습자의 자발적인 활동을 강조하여 경험을 통한 배움(learning by doing)의 방법을 활용함","최소의 필수적인 사실을 먼저 제시하고 학습자가 시사점을 이끌어내도록 함","자기주도적 학습, 협동학습, 비지시적 수업의 방법을 활용함"],"a":0,"exp":"교과중심 교육과정의 교육방법은 설명식·강의식 수업, 반복 암기와 문제풀이 훈련이다. ②는 경험중심, ③은 학문중심(발견학습), ④는 인간중심 교육과정이다.","id":"gwajeong-m21"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 '교육평가' 측면 특징으로 옳은 것은?","opts":["지식 및 가치를 이해하고 내면화하였는지를 평가의 주요 과제로 삼기 때문에 지필시험을 주로 사용함","결과뿐 아니라 과정에 중심을 두는 종합적·다면적 평가를 사용함","학생의 성취형태 간 미묘한 차이를 감지하는 질적 평가를 사용함","수행과제 중심의 참평가를 사용함"],"a":0,"exp":"교과중심 교육과정은 지식 및 가치의 이해·내면화 여부를 평가하기 위해 지필시험을 주로 사용한다. ②는 경험중심 교육과정이다.","id":"gwajeong-m22"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 장점으로 옳지 않은 것은?","opts":["학습자의 창의성과 문제해결력 및 비판적 사고력 등 고등능력 함양에 유리함","체계적인 지식 및 문화유산의 효율적인 전달이 용이함","사전계획이 뚜렷하여 교사와 학생에게 안정감 제공","객관적인 평가기준에 의해서 학습결과가 쉽게 평가됨"],"a":0,"exp":"'창의성과 문제해결력 및 비판적 사고력 등의 고등능력 함양이 어려움'은 단점이므로 ①은 정반대이다.","id":"gwajeong-m23"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 단점으로 옳지 않은 것은?","opts":["교과 조직이 복잡하고 모호하다","학습자의 요구와 흥미를 무시하는 경향성을 지님","실제 생활과 유리되어 실용적이지 못하거나 단편적인 지식을 학습함","학습자의 학습태도를 수동적으로 만듦"],"a":0,"exp":"'교과 조직이 단순하고 명료함'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m24"},{"ch":"CH02 교육과정의 관점","t":"형식도야론","q":"형식도야론의 주요 주장으로 옳은 것은?","opts":["운동을 통해 신체의 근육이 단련되는 것처럼 마음의 근육을 단련하여 정신능력을 도야시킬 수 있으며, 교과의 반복적인 암기나 연습을 통해 도야된 정신능력은 다른 사태에 일반적으로 전이가 가능함","이전의 학습과 새로운 학습이 동일한 요소를 많이 포함할수록 전이가 잘 일어남","일반 원리나 법칙을 학습하면 전이가 잘 일어남","문제의 구조적 성질을 이해하였을 때 전이가 잘 일어남"],"a":0,"exp":"형식도야론은 마음의 근육 단련 비유와 반복 암기·연습을 통한 정신능력 도야, 일반적 전이 가능성을 주장한다.","id":"gwajeong-m25"},{"ch":"CH02 교육과정의 관점","t":"형식도야론","q":"형식도야론에 대한 비판 중 '능력심리학에 대한 비판'에 해당하는 것은?","opts":["전통적인 교과(역사, 라틴어)에 대한 학습이 다른 교과(타자, 속기)에 비해 일반적인 정신능력을 계발하기에 적합하지 않음","전통적인 교육내용은 학생에게 미래의 삶을 준비시키기에 적절하지 않음","반복 암기가 학습동기를 저하시킴","교과지식의 위계가 불분명함"],"a":0,"exp":"능력심리학에 대한 비판은 전통적 교과 학습이 다른 교과에 비해 일반적 정신능력 계발에 적합하지 않다는 것이다. ②는 교육내용의 적합성에 대한 비판이다.","id":"gwajeong-m26"},{"ch":"CH02 교육과정의 관점","t":"허스트","q":"허스트(Hirst)의 '지식의 형식론'이 주장하는 교육의 목적으로 옳은 것은?","opts":["'합리적 마음의 계발'이라고 하는 교육목적의 달성을 위해 개인을 공적인 삶의 형식 또는 사고의 형식에 입문시켜야 함","아동의 흥미와 관심을 바탕으로 경험의 계속적인 성장을 도모함","학문을 공부하는 학자와 같은 탐구력을 배양함","학생의 잠재적인 능력 계발과 자아실현을 지향함"],"a":0,"exp":"허스트의 지식의 형식론은 '합리적 마음의 계발'을 위해 개인을 공적인 삶의 형식 또는 사고의 형식에 입문시켜야 한다고 본다.","id":"gwajeong-m27"},{"ch":"CH02 교육과정의 관점","t":"허스트","q":"허스트의 '지식의 형식' 개념과 '선험적 정당화'에 대한 설명으로 옳은 것은?","opts":["지식의 형식은 인간 경험 전체를 이해하는 방식이며, 선험적 정당화는 개인이 그것을 수용하는가와 무관하게 어떤 명제가 논리적으로 성립함을 정당화하는 것","지식의 형식은 각 학문의 핵심 개념과 원리의 체계이며, 선험적 정당화는 경험적 증거로 검증하는 것","지식의 형식은 교과의 위계 구조이며, 선험적 정당화는 사회적 합의를 통한 정당화","지식의 형식은 학습자의 경험이며, 선험적 정당화는 실용적 유용성에 근거한 정당화"],"a":0,"exp":"지식의 형식은 인간 경험 전체를 이해하는 방식으로 다양한 지식형식으로 구조화되며 각 형식은 서로 다른 유형의 인간 경험을 반영한다. 선험적 정당화는 개인의 수용 여부와 무관하게 명제가 논리적으로 성립함을 정당화하는 것이다.","id":"gwajeong-m28"},{"ch":"CH02 교육과정의 관점","t":"허스트","q":"허스트의 지식의 형식론의 한계로 옳은 것은?","opts":["주지교과에 특권적 지위를 부여했다고 볼 수 있는데 주지교과만이 내재적 가치를 지닌다고 할 수 없으며, 합리성의 계발은 교육목적의 하나로 간주될 수 있으나 전부가 될 수는 없음","경험적 검증이 불가능함","교과 간 통합이 지나치게 강조됨","학문의 구조를 무시함"],"a":0,"exp":"한계는 ①주지교과에 특권적 지위를 부여 ②합리성의 계발이 교육목적의 전부가 될 수는 없음이다.","id":"gwajeong-m29"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 개념으로 옳은 것은?","opts":["아동의 흥미와 관심을 바탕으로 경험의 계속적인 성장을 도모할 수 있는 환경을 제공하는 교육과정","지식을 주된 내용으로 하는 교육과정","각 학문에 내재된 지식의 구조를 익히도록 하는 교육과정","사회적 삶에서 필요한 역량을 강화시키는 방향으로 교육내용을 제공하려는 교육과정"],"a":0,"exp":"경험중심 교육과정은 아동의 흥미와 관심을 바탕으로 경험의 계속적 성장을 도모할 수 있는 환경을 제공하는 교육과정이다.","id":"gwajeong-m30"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 '교육내용' 측면 특징으로 옳은 것은?","opts":["경험을 중심요소로 삼고, 이와 관련된 여러 교과지식과 활동을 통합적으로 조직하며, 아동이 사물에 대한 직접적 경험으로부터 점차 논리적으로 조직된 체계적인 지식을 획득하도록 내용을 조직함","인류의 문화유산 중에서 중요하고 핵심적이라고 여겨지는 사실·개념·법칙·가치 등을 선정함","각 학문의 핵심적 개념과 원리를 나선형으로 조직함","역량을 우선적으로 고려하여 지식과 내용을 조직함"],"a":0,"exp":"경험중심 교육과정의 교육내용은 경험을 중심요소로 삼고 교과지식과 활동을 통합적으로 조직하며, 직접적 경험에서 체계적 지식으로 나아가도록 조직한다.","id":"gwajeong-m31"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 '교육평가' 측면 특징으로 옳은 것은?","opts":["실제 학생의 과제처리능력을 확인하는 평가방법을 사용하고, 결과뿐 아니라 과정에 중심을 두며 종합적이고 다면적인(전인적인) 평가를 함","지필시험을 주로 사용하여 지식의 내면화를 평가함","객관적 평가기준으로 학습결과를 쉽게 평가함","교육적 감식안에 기초한 질적 평가를 함"],"a":0,"exp":"경험중심 교육과정의 평가는 과제처리능력 확인, 결과뿐 아니라 과정 중심, 종합적·다면적(전인적) 평가이다.","id":"gwajeong-m32"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 장점으로 옳지 않은 것은?","opts":["위계성이 높은 교과를 체계적으로 학습하기에 유리함","학습자의 흥미와 필요를 중시하므로 학습자의 자발성이 높음","실제적인 생활문제 해결력이 향상됨","민주시민으로서의 자질을 함양할 수 있으며 학교와 지역사회의 유대가 강화됨"],"a":0,"exp":"'기초학력의 저하를 초래할 수 있음 — 위계성이 높은 교과를 체계적으로 학습하기 어려움'은 단점이므로 ①은 정반대이다.","id":"gwajeong-m33"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 단점으로 옳지 않은 것은?","opts":["학습자의 자발성이 지나치게 낮아진다","기초학력의 저하를 초래할 수 있음","교육의 효율성과 경제성이 낮을 수 있음","교육과정 조직의 논리성과 체계성이 부족할 수 있음"],"a":0,"exp":"경험중심 교육과정은 학습자의 자발성이 높은 것이 장점이므로 ①은 옳지 않다. 단점에는 '경험이 적은 교사가 운영하기 어려울 수 있음'도 포함된다.","id":"gwajeong-m34"},{"ch":"CH02 교육과정의 관점","t":"킬패트릭","q":"킬패트릭(Kilpatrick)이 제안한 대표적인 아동중심 교육방법의 명칭은?","opts":["프로젝트 학습법","발견학습","백워드 설계","비지시적 수업"],"a":0,"exp":"킬패트릭이 제안한 대표적 아동중심 교육방법은 프로젝트 학습법이다.","id":"gwajeong-m35"},{"ch":"CH02 교육과정의 관점","t":"킬패트릭","q":"킬패트릭의 프로젝트 학습법에서 '프로젝트'의 개념과 학습과정으로 옳은 것은?","opts":["사회적 장면에서 온 힘을 쏟을 만한 목적을 가지고 행하는 일련의 활동들 / 목적설정 ⇒ 계획 ⇒ 실험 ⇒ 판단","학문의 구조를 발견하는 일련의 활동 / 관찰 ⇒ 가설 ⇒ 검증","경험의 계속적 재구성 / 상호작용 ⇒ 계속성","역량을 개발하는 과제 / 지식 ⇒ 기능 ⇒ 인성"],"a":0,"exp":"프로젝트는 사회적 장면에서 온 힘을 쏟을 만한 목적을 가지고 행하는 일련의 활동이며, 학습과정은 목적설정 ⇒ 계획 ⇒ 실험 ⇒ 판단이다.","id":"gwajeong-m36"},{"ch":"CH02 교육과정의 관점","t":"킬패트릭","q":"프로젝트 학습법에서 교과를 바라보는 관점으로 옳은 것은?","opts":["교과를 경험의 풍부한 재구성과 사고기능 향상이라는 목적을 달성하기 위한 수단이자 도구로 간주함","교과를 최소한의 핵심요소와 당위적으로 배워야 하는 내용으로 규정함","교과를 학문의 구조로 규정함","교과를 역량 개발의 최종 목표로 규정함"],"a":0,"exp":"전통적 교육과정이 교과를 당위적으로 배워야 할 내용으로 규정한 반면, 프로젝트 학습법은 교과를 경험의 재구성과 사고기능 향상을 위한 수단이자 도구로 본다.","id":"gwajeong-m37"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 '경험의 원리' 중 '계속성의 원리'에 해당하는 설명은?","opts":["습득된 경험이 차후에 다른 문제 사태를 접할 때 새로운 경험이 획득될 수 있는 토대가 되며 경험이 확장되는 것","환경 속에서 문제 사태를 지각하고, 사태와 상호작용하면서 자기 자신과 환경 모두를 변화시키는 것","중요한 경험요소가 반복되도록 조직해야 하는 것","각 학습경험이 조화롭게 연결되도록 조직하는 것"],"a":0,"exp":"계속성의 원리는 습득된 경험이 차후 새로운 경험 획득의 토대가 되며 경험이 확장되는 것이다. ②는 상호작용의 원리이다.","id":"gwajeong-m38"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 관점에서 교육의 목적으로 옳은 것은?","opts":["'교육적인 경험'을 제공하는 것으로, 이는 '상호작용의 원리'와 '계속성의 원리'에 충실한 경험","합리적 마음의 계발","학문을 공부하는 학자와 같은 탐구력의 배양","문화유산의 본질적 가치 전달"],"a":0,"exp":"듀이의 교육 목적은 '교육적인 경험'을 제공하는 것이며, 이는 상호작용의 원리와 계속성의 원리에 충실한 경험이다.","id":"gwajeong-m39"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)가 말한 '바람직하지 않은 교육'의 특징으로 옳지 않은 것은?","opts":["사고작용이 개입하여 하나의 경험이 완결하도록 하는 경험","주위 사물에 대해 관심이나 흥미를 불러일으키지 못하게 하는 경험","판에 박히고 기계적인 습관에 고착시키는 경험","다른 경험과 아무런 관련이 없는 고립된 경험"],"a":0,"exp":"①은 바람직한 교육의 특징이다. 바람직하지 않은 교육에는 '직접적인 즐거움을 주기는 하지만 차분하지 못하고 덤벙대는 태도를 기를 수도 있는 경험'도 포함된다.","id":"gwajeong-m40"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 주장에 따를 때 '교육자의 교과'의 특징으로 옳은 것은?","opts":["형식적인 사고의 반영, 교과내용의 논리적 조직, 사고의 결과 중시, 정당화의 맥락 존중","학습자의 경험 안에서 발달되어 가는 교과","실제적인 사고의 반영, 교과내용의 심리적 조직","사고의 과정 중시, 발견의 맥락 존중"],"a":0,"exp":"교육자의 교과는 교육자에게 이해되는 상태로서의 교과, 형식적 사고의 반영, 논리적 조직, 사고의 결과 중시, 정당화의 맥락 존중, 결과를 설명하는 데 유용하다. ②③④는 학습자의 교과이다.","id":"gwajeong-m41"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 개념과 목표로 옳은 것은?","opts":["각 학문에 내재되어 있는 '지식의 구조'와 지식의 탐구과정을 익히도록 하는 교육과정이며, 학자와 같은 탐구력 배양과 학습자의 지적 수월성 도모를 목표로 함","아동의 흥미를 바탕으로 경험의 성장을 도모하며 생활인 육성을 목표로 함","교육과 학교환경의 인간화를 중시하며 자아실현을 목표로 함","사회적 삶에서 필요한 역량 강화를 목표로 함"],"a":0,"exp":"학문중심 교육과정은 지식의 구조와 탐구과정을 익히도록 하며, ①학자와 같은 탐구력 배양 ②학습자의 지적 수월성 도모를 목표로 한다.","id":"gwajeong-m42"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 교육내용인 '지식의 구조'의 개념으로 옳은 것은?","opts":["사실이나 현상을 엮어주는 핵심적 개념과 원리로, 사실이나 정보를 서로 관련짓고 체계화하는 각 학문의 주요 개념이나 원리들의 체계","각 학문의 핵심 아이디어를 학년이 올라감에 따라 반복·심화하는 조직 방식","최소의 필수적인 사실을 먼저 제시하는 수업방식","학습자의 경험 안에서 발달되어 가는 교과"],"a":0,"exp":"지식의 구조는 사실이나 현상을 엮어주는 핵심적 개념과 원리이다. ②는 나선형 교육과정(조직원리), ③은 발견학습(교육방법)이다.","id":"gwajeong-m43"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 조직원리인 '나선형 교육과정'의 개념으로 옳은 것은?","opts":["각 학문의 구조에 해당하는 핵심적인 아이디어를 반복하여 가르치되 학년이나 학교급이 올라감에 따라 그 폭과 깊이를 점점 넓고 깊이 있게 조직하는 방식","서로 유사한 교과들을 묶어서 하나의 교과로 재조직하는 방식","여러 교과의 공통부분을 추출하여 조직하는 방식","교과나 과목 내에서 관련 있는 내용을 비슷한 시간대에 배우도록 순서를 조정하는 방식"],"a":0,"exp":"나선형 교육과정은 핵심 아이디어를 반복하되 학년이 올라감에 따라 폭과 깊이를 넓고 깊게 조직하는 방식이다.","id":"gwajeong-m44"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 교육방법인 '발견학습'의 개념으로 옳은 것은?","opts":["최소의 필수적인 사실을 먼저 제시하고 학습자로 하여금 그 사실로부터 가장 풍부한 시사점을 이끌어내도록 하는 수업방식","교사가 시범을 보이고 학생이 모방하도록 하는 수업방식","실생활 문제를 중심으로 프로젝트를 수행하는 수업방식","교사와 학생이 함께 만들어가는 수업방식"],"a":0,"exp":"발견학습은 최소의 필수적인 사실을 먼저 제시하고 학습자가 그로부터 가장 풍부한 시사점을 이끌어내도록 하는 수업방식이다.","id":"gwajeong-m45"},{"ch":"CH02 교육과정의 관점","t":"지식의 구조","q":"'지식의 구조'의 특징 중 '경제성'에 해당하는 설명은?","opts":["지식의 구조는 개념, 원리, 법칙을 통해 학습하기 때문에 기억할 정보의 양이 적고 경제성이 큼","어떠한 영역의 지식도 작동적·영상적·상징적 표현방식을 통해 나타낼 수 있음","지식의 구조를 획득하면 정보의 인출이 용이하고 그 지식을 활용하는 데에도 효과적임","기본 개념을 중심으로 내용이 선정·조직되면 개념에 대한 이해가 쉬워짐"],"a":0,"exp":"경제성은 개념·원리·법칙을 통해 학습하여 기억할 정보량이 적다는 것이다. ②는 표현방식의 다양성, ③은 생성력, ④는 이해의 용이성이다.","id":"gwajeong-m46"},{"ch":"CH02 교육과정의 관점","t":"지식의 구조","q":"'지식의 구조'의 특징 중 '학습의 일반적 전이'에 해당하는 설명은?","opts":["해당 학문의 기본 개념을 중심으로 익힐 때 새로운 문제에 적용할 수 있는 전이 가능성이 최대화됨","내용이 구조를 중심으로 조직되면 기억을 용이하게 할 수 있음","정보의 인출이 용이하고 지식 활용에 효과적임","기억할 정보의 양이 적어 경제성이 큼"],"a":0,"exp":"학습의 일반적 전이는 기본 개념 중심으로 익힐 때 새로운 문제에 적용할 수 있는 전이 가능성이 최대화된다는 것이다. ②는 기억의 보존, ③은 생성력, ④는 경제성이다.","id":"gwajeong-m47"},{"ch":"CH02 교육과정의 관점","t":"브루너","q":"브루너(Bruner)의 '중간언어(middle language)'에 대한 설명으로 옳은 것은?","opts":["지식을 탐구하는 과정과 분리되어 가르쳐지는 지식탐구의 결과물로, 비판 및 지양의 대상","학생이 학자들의 탐구활동과 동일한 일을 하도록 가르치는 것으로, 지향의 대상","학생들에게 지식의 구조를 스스로 발견하도록 요구하는 언어","교과의 내용을 심리적으로 조직한 언어"],"a":0,"exp":"중간언어는 탐구과정과 분리되어 가르쳐지는 탐구결과물로, 학생에게 단순한 사실만 암기하도록 하여 지식이 학생의 바깥에 머물게 하므로 비판 및 지양의 대상이다. ②③은 교과언어이다.","id":"gwajeong-m48"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 단점으로 옳지 않은 것은?","opts":["학습의 전이가 거의 일어나지 않음","학습자의 정의적인 발달을 소홀히 여길 우려가 있음","학업역량이 낮은 학생에게는 적용하기 어려울 수 있기 때문에 소수의 우수한 학생에게만 유리할 수 있음","각 학문별로 고유한 지식의 구조가 존재하는 것으로 전제되기 때문에 교과 간의 단절을 심화시킬 수 있음"],"a":0,"exp":"'기본원리, 개념법칙을 학습하기 때문에 학습의 전이가 활발하게 일어남'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m49"},{"ch":"CH02 교육과정의 관점","t":"인간중심 교육과정","q":"인간중심 교육과정의 개념으로 옳은 것은?","opts":["교육과 학교환경의 인간화를 중시하며 학생의 잠재적인 능력 계발과 자아실현을 지향하는 교육과정","지식의 구조와 탐구과정을 익히도록 하는 교육과정","전통적 문화유산을 다음 세대에 전달하는 교육과정","사회적 삶에 필요한 역량을 강화하는 교육과정"],"a":0,"exp":"인간중심 교육과정은 교육과 학교환경의 인간화를 중시하며 잠재능력 계발과 자아실현을 지향한다.","id":"gwajeong-m50"},{"ch":"CH02 교육과정의 관점","t":"인간중심 교육과정","q":"인간중심 교육과정에서 중시하는 교육과정 측면의 특징으로 옳지 않은 것은?","opts":["공식적 교육과정만을 중시하고 잠재적 교육과정은 배제함","교육의 인간화 — 교과를 가르치는 것이 아닌 인간을 가르치는 것을 교육으로 본다는 점에서 전인교육을 강조함","통합교육과정 중시 — 교과중심·경험중심·학문중심 교육과정을 모두 포괄하는 통합교육과정을 중시함","학교환경의 인간화 — 학교 구성원들이 인간적인 경험을 할 수 있도록 학교환경이 인간중심적으로 조성되는 것을 강조함"],"a":0,"exp":"인간중심
