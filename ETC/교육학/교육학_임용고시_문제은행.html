<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육학 임용고시 문제은행</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1e222d; --line:#2a2f3d;
  --txt:#e7e9ee; --muted:#9aa3b2; --accent:#6366f1;
  --ok:#22c55e; --no:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
  line-height:1.65; font-size:15px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}

/* ── header ── */
header{position:sticky;top:0;z-index:50;background:rgba(15,17,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:980px;margin:0 auto;padding:12px 16px 0}
.ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ttl h1{font-size:18px;margin:0;letter-spacing:-.3px}
.ttl span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);border-bottom:none;
  border-radius:9px 9px 0 0;background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.15s;
}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--panel2);color:#fff;border-color:var(--acc);border-bottom:2px solid var(--acc);box-shadow:inset 0 2px 0 var(--acc)}

/* ── controls ── */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.seg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:700;font-family:inherit}
.seg button.on{background:var(--acc);color:#fff}
select,.btn{
  background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:8px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;
}
select{max-width:100%}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.spacer{flex:1}
.cnt{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* ── progress ── */
.prog{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}

/* ── card ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:0 6px 8px 0}
.chip.acc{background:color-mix(in srgb, var(--acc) 18%, transparent);border-color:var(--acc);color:#fff}
.q{font-size:16px;font-weight:600;margin:6px 0 16px;white-space:pre-wrap;word-break:keep-all;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel2);cursor:pointer;transition:.12s;
  font-size:14.3px;word-break:keep-all;line-height:1.6;
}
.opt:hover{border-color:var(--acc)}
.opt .no{flex:0 0 22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:1px}
.opt.picked{border-color:var(--acc)}
.opt.correct{border-color:var(--ok);background:rgba(34,197,94,.10)}
.opt.correct .no{background:var(--ok);color:#062b13;border-color:var(--ok)}
.opt.wrong{border-color:var(--no);background:rgba(239,68,68,.10)}
.opt.wrong .no{background:var(--no);color:#3b0a0a;border-color:var(--no)}
.opt.dis{cursor:default}
.opt .body{flex:1}
.opt .key{flex:0 0 auto;font-size:12px;color:var(--muted);opacity:.75;margin-top:2px;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:10px;padding-left:2px}
.exp{margin-top:15px;padding:14px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);font-size:14px;white-space:pre-wrap;word-break:keep-all;line-height:1.75}
.exp b{color:var(--acc);display:block;margin-bottom:6px;font-size:12.5px;letter-spacing:.4px}
.verdict{font-weight:800;font-size:14px;margin-top:14px}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--no)}

/* ── essay ── */
textarea{
  width:100%;min-height:190px;resize:vertical;background:var(--panel2);color:var(--txt);
  border:1px solid var(--line);border-radius:11px;padding:14px;font-family:inherit;
  font-size:14.5px;line-height:1.75;
}
textarea:focus{outline:none;border-color:var(--acc)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kw span{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.kw span.hit{background:rgba(34,197,94,.14);border-color:var(--ok);color:#86efac}
.ans{margin-top:14px;padding:16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);white-space:pre-wrap;word-break:keep-all;font-size:14.4px;line-height:1.85}
.ans b{color:var(--ok);display:block;margin-bottom:8px;font-size:12.5px;letter-spacing:.4px}
.small{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ── nav ── */
.nav{display:flex;gap:9px;align-items:center;margin-top:18px;flex-wrap:wrap}
.nav .spacer{flex:1}
.jump{width:78px;text-align:center}
.stat{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stat b{color:var(--txt)}

/* ── misc ── */
.hide{display:none!important}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
input[type=text],input[type=number]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13.5px}
@media(max-width:640px){
  .wrap{padding:0 12px 70px} .hd{padding:10px 12px 0}
  .card{padding:15px} .q{font-size:15px} .opt{font-size:13.8px;padding:11px 12px}
  .bar{padding:10px;gap:8px} .ttl h1{font-size:16px}
}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="ttl">
      <h1>교육학 임용고시 문제은행</h1>
      <span>객관식 1047문항 · 서술형 511문항 (총 1558문항)</span>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <div class="seg" id="mode">
      <button data-m="mc" class="on">객관식</button>
      <button data-m="essay">서술형</button>
    </div>
    <select id="chap"></select>
    <button class="btn" id="shuffle">🔀 섞기</button>
    <button class="btn" id="reset">↺ 기록 초기화</button>
    <div class="spacer"></div>
    <div class="cnt" id="cnt"></div>
  </div>

  <div class="prog"><i id="bar"></i></div>
  <div id="stage"></div>
</div>

<script>
const DATA = {"교육심리":{"mc":[{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)가 주장한 인지발달의 핵심 경향성 중 '조직화(organization)'의 개념으로 옳은 것은?","opts":["아동이 환경과 직접 접촉하지 않고 내적인 과정을 통해 기존의 도식을 새롭고 더욱 복잡한 지적 구조로 통합하는 과정","평형화 유지를 위해 도식과 새로운 경험을 조정하는 과정","새로운 정보를 기존의 도식에 맞추는 것","기존 도식이 새로운 정보를 받아들이는 데 적합하지 않을 때 기존의 도식을 바꾸거나 새로운 도식을 만들어내는 것"],"a":0,"exp":"조직화는 '아동이 환경과 직접 접촉하지 않고 내적인 과정을 통해 기존의 도식을 새롭고 더욱 복잡한 지적 구조로 통합하는 과정'이며, 행동과 사고를 결합·배열·재결합·재배열하여 논리적인 체계로 통합하는 것이다. ②는 적응, ③은 동화, ④는 조절의 개념이다.","id":"simri-m0"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)가 주장한 인지발달의 핵심 경향성 중 '적응(adaptation)'의 개념으로 옳은 것은?","opts":["평형화 유지를 위해 도식과 새로운 경험을 조정하는 과정","기존의 도식을 새롭고 복잡한 지적 구조로 통합하는 과정","자신의 현재 도식으로는 문제를 해결할 수 없음을 인식하는 상태","기존의 이해를 통해 새로운 경험을 이해·설명할 수 있는 인지적 상태"],"a":0,"exp":"적응은 '평형화 유지를 위해 도식과 새로운 경험을 조정하는 과정'으로, 도식을 유지(동화)하거나 바꾸면서(조절) 이루어진다. ②는 조직화, ③은 인지적 불평형, ④는 평형화이다.","id":"simri-m1"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)의 이론에서 적응하기 위한 2가지 기본 과정에 해당하는 것은?","opts":["동화와 조절","조직화와 평형화","동화와 평형화","조절과 인지적 불평형"],"a":0,"exp":"적응은 도식을 유지(동화)하거나 바꾸면서(조절) 이루어지므로, 적응을 위한 2가지 기본 과정은 동화와 조절이다.","id":"simri-m2"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)의 이론에서 '동화(assimilation)'에 해당하는 설명은?","opts":["새로운 정보를 기존의 도식에 맞추는 것","기존 도식을 바꾸거나 새로운 도식을 만들어내는 것","기존의 도식을 더 복잡한 지적 구조로 통합하는 것","도식과 새로운 경험을 조정하는 과정 전체"],"a":0,"exp":"동화는 '새로운 정보를 기존의 도식에 맞추는 것'이다. ②는 조절, ③은 조직화, ④는 적응이다.","id":"simri-m3"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)의 이론에서 '조절(accommodation)'의 개념으로 옳은 것은?","opts":["기존 도식이 새로운 정보를 받아들이는 데 적합하지 않을 때 기존의 도식을 바꾸거나 새로운 도식을 만들어내는 것","새로운 정보를 기존의 도식에 맞추는 것","자신의 지식구조로 세상을 이해할 수 있는 평안한 상태","시간의 경과에 따라 기억 흔적이 약해지는 것"],"a":0,"exp":"조절은 '기존 도식이 새로운 정보를 받아들이는 데 적합하지 않을 때 기존의 도식을 바꾸거나 새로운 도식을 만들어내는 것'이다. ②는 동화, ③은 평형화이다.","id":"simri-m4"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)가 말한 '평형화'의 개념으로 옳은 것은?","opts":["기존의 이해를 통해 새로운 경험을 이해·설명할 수 있는 인지적 상태","자신의 현재 도식으로는 문제를 해결하거나 상황을 이해할 수 없음을 인식할 때 발생하는 균형이 깨진 상태","기존 도식을 바꾸어 새로운 도식을 만들어내는 과정","환경과 직접 접촉하지 않고 내적으로 도식을 통합하는 과정"],"a":0,"exp":"평형화는 '기존의 이해를 통해 새로운 경험을 이해·설명할 수 있는 인지적 상태'로, 자신의 지식구조로 세상을 이해할 수 있는 평안한 상태를 말한다. ②는 인지적 불평형이다.","id":"simri-m5"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"'인지적 불평형'의 개념으로 옳은 것은?","opts":["자신의 현재 도식으로는 문제를 해결하거나 상황을 이해할 수 없음을 인식할 때 발생하는 균형이 깨진 상태","기존의 이해를 통해 새로운 경험을 설명할 수 있는 평안한 상태","새로운 정보를 기존 도식에 맞추어 넣는 과정","도식을 논리적 체계로 통합하는 과정"],"a":0,"exp":"인지적 불평형은 '자신의 현재 도식으로는 문제를 해결하거나 상황을 이해할 수 없음을 인식할 때 발생하는 균형이 깨진 상태'이다.","id":"simri-m6"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)에 따를 때 11세 이상의 청소년기 아동이 속하는 발달단계는?","opts":["형식적 조작기","구체적 조작기","전조작기","감각운동기"],"a":0,"exp":"11세 이상의 청소년기 아동은 형식적 조작기에 속하며, 논리적·추상적 문제해결, 가설연역적 추론, 명제적 사고가 특징이다.","id":"simri-m7"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"형식적 조작기 아동의 특징으로 옳지 않은 것은?","opts":["현실 세계의 구체적 사물이 있어야만 논리적 조작이 가능하다","논리적으로 추상적인 문제해결이 가능하며 추상적·과학적 사고능력이 발달한다","가설연역적 추론, 즉 가설을 가지고 추상적으로 사고할 수 있는 능력을 가진다","명제적 사고, 즉 현실 세계의 상황을 고려하지 않고도 명제의 논리를 평가할 수 있다"],"a":0,"exp":"형식적 조작기의 명제적 사고는 '현실 세계의 상황을 고려하지 않고도 명제의 논리(언어적 진술)를 평가할 수 있음'을 뜻하므로, 구체적 사물이 있어야 조작이 가능하다는 ①은 틀린 설명이다.","id":"simri-m8"},{"ch":"CH01 학습자의 발달","t":"엘킨드 청소년기 자아중심성","q":"엘킨드(Elkind)가 설명한 청소년기 자아중심성 중 '상상적 관중'에 해당하는 설명은?","opts":["자신이 모든 사람의 주의와 관심을 받는다고 믿으며 자기의식이 심해지고 외모의 섬세한 부분까지 신경 쓰거나 대중의 비판에 매우 민감해함","자신이 특별하고 독특하다고 느끼며 다른 사람이 이해할 수 없는 경험을 자신이 겪는다고 생각함","타인의 관점·입장·사고·감정 등을 추론하여 이해하는 능력","타인이 자신과 다른 관점을 가지고 있다는 것을 이해하지 못함"],"a":0,"exp":"상상적 관중은 '자신이 모든 사람의 주의와 관심을 받는다고 믿으며, 자기의식이 심해지고 외모의 섬세한 부분까지 신경을 쓰거나 대중의 비판에 매우 민감해함'이다. ②는 개인적 신화이다.","id":"simri-m9"},{"ch":"CH01 학습자의 발달","t":"엘킨드 청소년기 자아중심성","q":"엘킨드(Elkind)의 '개인적 신화'에 대한 설명으로 옳은 것은?","opts":["자신이 특별하고 독특하다고 느끼며, 다른 사람이 이해할 수 없는 경험을 자신이 겪거나 자신이 가장 영예로운 수준 또는 절망의 깊은 곳에 있다고 생각함","자신이 모든 사람의 주의와 관심을 받는다고 믿음","자신의 인지과정에 대한 자각과 통제","자신과 타인의 조망을 동시에 고려하지 못함"],"a":0,"exp":"개인적 신화는 '자신이 특별하고 독특하다고 느끼며, 다른 사람이 이해할 수 없는 경험을 자신이 겪거나 자신이 가장 영예로운 수준 또는 절망의 깊은 곳에 있다고 생각함'이다.","id":"simri-m10"},{"ch":"CH01 학습자의 발달","t":"피아제 교육적 방안","q":"피아제(Piaget)의 관점에서 학습자의 인지발달을 촉진하는 방안으로 제시되지 않은 것은?","opts":["발달단계를 훌쩍 뛰어넘는 선행학습을 적극 권장함","특정 사실이나 개념 전수보다 각 발달단계에 적합한 사고능력 신장에 중점을 둠","아동이 스스로 지식을 구성해야 하므로 학습자의 자발성을 중시함","학습자에게 새로운 내용을 제시하여 동화와 조절의 인지활동을 활발하게 할 수 있도록 유도함(대립전략)"],"a":0,"exp":"피아제 관점의 방안은 '발달단계를 훌쩍 뛰어넘는 선행학습은 지양하고, 현실적으로 해결이 가능한 도전적인 과제를 제시함'이다. 따라서 ①은 옳지 않다.","id":"simri-m11"},{"ch":"CH01 학습자의 발달","t":"피아제 교육적 방안","q":"피아제의 인지발달 촉진 방안 중 '눈높이 교육의 실시'에 대한 설명으로 옳은 것은?","opts":["교사는 아동의 인지발달 단계를 이해하는 지적 공감을 갖추고 인지발달 단계에 적절한 교육을 실시해야 함","교사가 학습자에게 다양한 비계설정을 제공해야 함","학생이 서로 사회적 상호작용을 할 수 있도록 협동학습을 활용함","실제 발달수준보다 발달 가능한 잠재력을 고려하여 수업을 계획함"],"a":0,"exp":"눈높이 교육의 실시는 '교사는 아동의 인지발달 단계를 이해하는 지적 공감을 갖추고 인지발달 단계에 적절한 교육을 실시해야 함'이다. ②③④는 비고츠키 이론의 교육적 시사점이다.","id":"simri-m12"},{"ch":"CH01 학습자의 발달","t":"비고츠키","q":"비고츠키(Vygotsky)의 관점에서 인지발달 촉진 요인으로 제시된 것을 모두 고르면?","opts":["사회적 상호작용, 언어, 문화, 학습","동화, 조절, 평형화, 조직화","주의집중, 파지, 재생산, 동기화","계획, 점검, 조절, 평가"],"a":0,"exp":"비고츠키의 인지발달 촉진 요인은 ①사회적 상호작용 ②언어 ③문화 ④학습이다. ②는 피아제, ③은 반두라의 모델링 과정, ④는 메타인지 전략이다.","id":"simri-m13"},{"ch":"CH01 학습자의 발달","t":"비고츠키 ZPD","q":"근접발달영역(ZPD)의 개념으로 옳은 것은?","opts":["아동이 타인의 도움 없이 스스로 문제를 해결할 수 있는 실제적 발달수준과 성인이나 유능한 또래들의 도움으로 문제를 해결할 수 있는 잠재적 발달수준 사이의 영역","능숙한 참여자의 도움으로 미숙한 학습자가 문제를 잘 이해할 수 있도록 도움을 조정·제공하는 것","아동이 직접 접하는 직접적인 관계 및 활동의 환경","자신의 인지과정에 대한 자각과 통제"],"a":0,"exp":"ZPD는 '아동이 타인의 도움 없이 스스로 문제를 해결할 수 있는 실제적 발달수준과 성인이나 유능한 또래들의 도움으로 문제를 해결할 수 있는 잠재적 발달수준 사이의 영역'이다. ②는 비계설정이다.","id":"simri-m14"},{"ch":"CH01 학습자의 발달","t":"비고츠키 ZPD","q":"근접발달영역에 영향을 주는 요인 2가지로 옳은 것은?","opts":["학습자 개인차, 교수의 질","언어, 문화","동화, 조절","실제적 발달수준, 잠재적 발달수준"],"a":0,"exp":"ZPD에 영향을 주는 요인은 ①학습자 개인차(현재의 발달수준이 같더라도 ZPD는 개인에 따라 다를 수 있음) ②교수의 질(동일한 발달수준을 가진 아동의 ZPD는 교수·학습활동의 질에 따라 달라질 수 있음)이다.","id":"simri-m15"},{"ch":"CH01 학습자의 발달","t":"비고츠키 ZPD","q":"근접발달영역의 의의 중 '학습이 이루어져야 할 수준'에 대한 설명으로 옳은 것은?","opts":["자신의 인지발달 수준을 조금 넘어서는 수준의 학습내용이 제시되어야 하고 교사 또는 또래의 도움이 제공되어야 함","혼자서는 해결할 수 없지만 성인의 지도나 더 유능한 또래들과의 협력에 의해 성취할 수 있는 과제의 범위","현재의 발달수준이 같더라도 근접발달영역은 개인에 따라 다를 수 있음","교수·학습활동의 질에 따라 근접발달영역이 달라질 수 있음"],"a":0,"exp":"'학습이 이루어져야 할 수준'은 자신의 인지발달 수준을 조금 넘어서는 수준의 학습내용이 제시되어야 하고 교사 또는 또래의 도움이 제공되어야 함을 의미한다. ②는 '타인의 도움으로 성공할 수 있는 영역'이다.","id":"simri-m16"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"비계(Scaffolding)의 개념으로 옳은 것은?","opts":["능숙한 참여자의 도움으로 미숙한 학습자가 문제를 잘 이해할 수 있도록 학습자의 현재 상황에 대한 적절한 도움을 조정·제공하는 것","실제적 발달수준과 잠재적 발달수준 사이의 영역","어떤 과제에 대해 서로 다르게 알고 있던 참여자들이 공유된 이해에 도달하는 것","다른 사람들과 함께 과제를 해결할 때 가장 잘 배울 수 있다는 원리"],"a":0,"exp":"비계는 '능숙한 참여자의 도움으로 미숙한 학습자가 문제를 잘 이해할 수 있도록 학습자의 현재 상황에 대한 적절한 도움을 조정·제공하는 것'으로, 근접발달영역에서 제공되는 더 뛰어난 친구나 성인의 도움이다. ③은 상호주관성, ④는 공동의 문제해결이다.","id":"simri-m17"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"비계설정의 유의점으로 옳지 않은 것은?","opts":["초기 단계에는 도움을 최소화하다가 점차 도움을 늘려 교사 의존도를 높여간다","학습자 스스로 학습할 수 있도록 지원해 주는 것으로 국한해야 한다","초기 단계에는 많은 도움을 제공하다가 점차적으로 줄이면서 스스로 해결할 수 있는 단계로 나아간다","근접발달영역 내에서 아동에게 적합하고 도전적인 과제를 제시하고 아동의 요구와 능력에 맞추어 도움을 조정해야 한다"],"a":0,"exp":"비계설정은 '초기 단계에는 많은 도움을 제공하다가 점차적으로 줄이면서 스스로 해결할 수 있는 단계로 나아감'이 원칙이므로 ①은 반대로 서술되어 틀렸다.","id":"simri-m18"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"효과적인 비계설정의 구성요소 4가지에 포함되지 않는 것은?","opts":["외적 보상 제공","공동의 문제해결","상호주관성","자기조절 증진하기"],"a":0,"exp":"효과적인 비계설정의 구성요소는 ①공동의 문제해결 ②상호주관성 ③따뜻한 반응 ④자기조절 증진하기이다. '외적 보상 제공'은 포함되지 않는다.","id":"simri-m19"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"비계설정의 구성요소 중 '상호주관성'의 개념으로 옳은 것은?","opts":["어떤 과제에 대해 서로 다르게 알고 있던 과제 참여자들이 공유된 이해에 도달하는 것","다른 사람들과 함께 과제를 해결할 때 가장 잘 배울 수 있음","교사나 부모의 따뜻한 반응, 언어적 칭찬, 적절한 자신감 유발","다양한 사회적 상호작용 과정에서 스스로의 사고와 행동을 조절하는 능력을 증진시키는 것"],"a":0,"exp":"상호주관성은 '어떤 과제에 대해서 서로 다르게 알고 있던 과제 참여자들이 공유된 이해에 도달하는 것'이다.","id":"simri-m20"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"다음 사례에 해당하는 비계설정의 유형은? '물리교사가 칠판에 운동량 문제를 풀면서 자신의 생각을 소리 내어 말하기'","opts":["소리 내어 생각하기","모델링","자료조정","조언과 단서"],"a":0,"exp":"제시된 사례는 '소리 내어 생각하기' 유형이다. 모델링은 '미술교사가 새로운 화법으로 그림을 그리도록 말하기 전에 먼저 시범 보이기'이다.","id":"simri-m21"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"'체육교사가 농구 슛하는 기술을 가르치는 동안 농구대의 높이를 낮췄다가, 학생들이 능숙해짐에 따라 농구대의 높이를 조절하기'에 해당하는 비계설정 유형은?","opts":["자료조정","모델링","질문","소리 내어 생각하기"],"a":0,"exp":"제시된 사례는 '자료조정' 유형이다. '조언과 단서'는 미취학 아동이 신발끈 묶는 것을 배울 때 교사가 옆에서 힌트를 주는 것이다.","id":"simri-m22"},{"ch":"CH01 학습자의 발달","t":"비고츠키 시사점","q":"비고츠키(Vygotsky) 이론의 교육적 시사점으로 옳지 않은 것은?","opts":["교사는 잠재력보다 실제 발달수준에 맞추어 수업을 계획해야 한다","학생이 서로 사회적 상호작용을 할 수 있도록 하고 자신이 이해한 것을 언어로 설명하는 기회를 제공하는 협동학습을 적극 활용한다","교사는 실제 발달수준보다는 발달 가능한 잠재력을 고려하여 근접발달영역 내에서 수업을 계획하고 학습활동을 만들어야 한다","교사가 학습자에게 다양한 비계설정을 제공하면 학습자가 해결할 수 있는 문제의 범위가 넓어진다"],"a":0,"exp":"비고츠키 이론은 '실제 발달수준보다는 발달 가능한 잠재력을 고려하여 근접발달영역 내에서 수업을 계획'할 것을 시사하므로 ①은 틀렸다.","id":"simri-m23"},{"ch":"CH01 학습자의 발달","t":"프로이트","q":"프로이트(Freud)의 정신의 구조 중 '전의식'에 해당하는 설명은?","opts":["평소에 지각하지 못하지만 약간의 노력을 기울이면 쉽게 의식으로 떠올릴 수 있는 기억과 경험","특별한 노력 없이도 항상 지각하고 있는 사고, 지각, 정서경험 등","지각하려 노력해도 쉽게 의식되지 않는 다양한 심리적 경험","현실 여건을 고려하지 않고 욕구를 즉각적으로 충족시키려는 부분"],"a":0,"exp":"전의식은 '평소에 지각하지 못하지만 약간의 노력을 기울이면 쉽게 의식으로 떠올릴 수 있는 기억과 경험'이다. ②는 의식, ③은 무의식, ④는 원초아이다.","id":"simri-m24"},{"ch":"CH01 학습자의 발달","t":"프로이트","q":"프로이트(Freud)의 성격 구조 중 '자아(ego)'에 대한 설명으로 옳은 것은?","opts":["욕구를 통제하는 힘으로, 환경에 대한 현실적인 적응을 담당하는 기능","생물체로서의 본능으로, 현실 여건을 고려하지 않고 욕구를 즉각적으로 충족시키는 '쾌락원리'에 따라 작동함","도덕과 양심으로, 아동의 마음에 내면화된 부모의 가치관과 사회적 규범","지각하려 노력해도 쉽게 의식되지 않는 심리적 경험"],"a":0,"exp":"자아는 '욕구를 통제하는 힘: 환경에 대한 현실적인 적응을 담당하는 기능'이다. ②는 원초아, ③은 초자아, ④는 무의식이다.","id":"simri-m25"},{"ch":"CH01 학습자의 발달","t":"프로이트","q":"프로이트(Freud)의 성격 구조 중 '초자아'에 해당하는 것은?","opts":["아동의 마음에 내면화된 부모의 가치관과 사회적 규범","쾌락원리에 따라 작동하는 생물체로서의 본능","환경에 대한 현실적인 적응을 담당하는 기능","약간의 노력으로 의식화되는 기억과 경험"],"a":0,"exp":"초자아는 '도덕과 양심: 아동의 마음에 내면화된 부모의 가치관과 사회적 규범'이다.","id":"simri-m26"},{"ch":"CH01 학습자의 발달","t":"에릭슨","q":"에릭슨(Erikson)의 심리사회적 성격발달이론에서 4단계의 발달과업은?","opts":["근면성 대 열등감","자아정체성 대 역할혼란","주도성 대 죄책감","친밀감 대 고립감"],"a":0,"exp":"4단계는 '근면성 대 열등감'으로, 성공을 경험하면 근면성과 유능감을 키우게 되지만 자신이 숙제나 과제를 제대로 할 능력이 없음을 인지하거나 실패할 경우 열등감을 느낀다.","id":"simri-m27"},{"ch":"CH01 학습자의 발달","t":"에릭슨","q":"에릭슨(Erikson)의 5단계 '자아정체성 대 역할혼란'에 대한 설명으로 옳지 않은 것은?","opts":["이 시기에 실패하면 근면성을 잃고 유능감이 저하된다","이 시기의 주요 발달과제는 자아정체성을 형성하는 것이다","자아정체성이란 자신이 누구이며 자신의 삶에서 중요한 것은 무엇인지에 대하여 스스로 규정한 신념체계이다","긍정적인 자아정체성을 형성하기도 하지만 혼란과 시행착오로 절망감을 느끼는 심리적 유예를 겪기도 한다"],"a":0,"exp":"근면성·유능감은 4단계(근면성 대 열등감)의 내용이므로 ①은 5단계 설명으로 옳지 않다.","id":"simri-m28"},{"ch":"CH01 학습자의 발달","t":"에릭슨","q":"에릭슨(Erikson) 이론의 청소년 교육에 대한 시사점으로 제시되지 않은 것은?","opts":["또래와의 비교를 통해 경쟁심을 자극하여 정체성을 확립하게 한다","급격한 신체적·정서적 변화로 혼란을 느끼고 감수성이 예민해지므로 교사는 공평하고 중립적인 입장에서 학생을 지도해야 한다","다양한 경험과 상황을 통해서 자신의 가치와 신념을 시험·탐색할 수 있도록 격려해야 한다","학생이 개인적인 문제를 해결함에 있어 필요한 자원을 찾을 수 있도록 지원한다"],"a":0,"exp":"제시된 시사점은 ②③④와 '학생들에게 실제적인 피드백을 제공하며 발전할 때마다 격려해 주기'이다. ①은 언급되지 않는다.","id":"simri-m29"},{"ch":"CH01 학습자의 발달","t":"자아정체성 형성 전략","q":"에릭슨의 관점에서 자아정체성 형성을 촉진하기 위한 전략으로 옳지 않은 것은?","opts":["학생이 자신의 부족한 모습을 감추고 이상적 자아상만을 추구하게 한다","직업선택과 성인의 역할에 대한 다양한 모델을 제공한다","학생이 개인적 문제를 해결하는 데 필요한 자원을 찾을 수 있도록 도와준다","자신의 모습을 있는 그대로 수용하게 한다"],"a":0,"exp":"제시된 전략은 ②③④이다. ①은 '자신의 모습을 있는 그대로 수용하게 함'과 배치되므로 옳지 않다.","id":"simri-m30"},{"ch":"CH01 학습자의 발달","t":"마샤 정체성 지위","q":"마샤(Marcia)의 정체성 지위이론에서 정체성을 분류하는 기준 2가지는?","opts":["전념, 탐색(위기)","안정성, 통제가능성","자율성, 유능성","접근, 회피"],"a":0,"exp":"마샤의 분류기준은 ①전념(무엇인가에 헌신하고 있는가) ②탐색/위기(자신에게 무엇이 중요한지 알기 위하여 다양한 신념·가치·행동을 탐색하고 있는가)이다.","id":"simri-m31"},{"ch":"CH01 학습자의 발달","t":"마샤 정체성 지위","q":"마샤(Marcia)의 정체성 지위 중 '정체성 상실(유실)'에 해당하는 설명은?","opts":["정체성 형성에 있어 탐색과정 없이 헌신하는 상태로, 다양한 신념·가치 등을 시험해 보지 않은 채 특정한 목표·가치·생활방식에 전념함","어떤 가능성도 탐색하지 않고 어떤 활동에도 전념하지 않은 상태","직업이나 가치 선택에 있어 판단을 미뤄두고 다양한 탐색을 해 보는 상태","현실적 선택사항을 충분히 탐색한 후 결정을 내리고 자신이 선택한 것에 전념하는 상태"],"a":0,"exp":"정체성 상실(유실)은 '탐색과정 없이 헌신하는 상태'이다. ②는 정체성 혼미, ③은 정체성 유예, ④는 정체성 성취(확립)이다.","id":"simri-m32"},{"ch":"CH01 학습자의 발달","t":"마샤 정체성 지위","q":"마샤(Marcia)의 '정체성 혼미'에 대한 설명으로 옳은 것은?","opts":["어떤 가능성도 탐색하지 않고 어떤 활동에도 전념하지 않은 상태이며, 타인이 어떤 일을 하는지·내가 어떤 일을 해야 하는지에 대한 관심이 없음","현재 정체성 위기나 변화를 경험하고 있으며 정체성을 확립하기 위해 탐색함","탐색 없이 부모가 정해준 목표에 전념함","충분한 탐색 후 결정을 내리고 전념함"],"a":0,"exp":"정체성 혼미는 탐색도 전념도 없는 상태이다. ②는 정체성 유예, ③은 정체성 상실(유실), ④는 정체성 성취이다.","id":"simri-m33"},{"ch":"CH01 학습자의 발달","t":"마샤 정체성 지위","q":"'정체성 유예'의 특징으로 옳은 것은?","opts":["직업이나 가치 선택에 있어 판단을 미뤄두고 다양한 탐색을 해 보며, 현재 정체성 위기나 변화를 경험하고 있음","전념도 탐색도 하지 않음","탐색 없이 전념함","탐색 후 전념을 완료함"],"a":0,"exp":"정체성 유예는 판단을 미뤄두고 다양한 탐색을 하는 상태로, 현재 정체성 위기나 변화를 경험하며 정체성 확립을 위해 탐색한다.","id":"simri-m34"},{"ch":"CH01 학습자의 발달","t":"브론펜브레너","q":"브론펜브레너(Bronfenbrenner)의 생태학적 환경 중 '미시체계'에 대한 설명으로 옳은 것은?","opts":["아동의 발달에 가장 강력한 영향을 주는 환경으로, 아동이 직접 접하는 직접적인 관계 및 활동(예: 부모, 형제자매, 교사, 학교, 친구, 놀이활동)","미시체계 모든 요소들 간의 상호작용과 관계의 집합","아동이 직접 접촉하지는 않지만 아동에게 간접적인 영향을 미치는 모든 사회적 구조","아동이 속하여 자란 문화이며 개인에게 영향을 미치는 관습, 법, 규범 등"],"a":0,"exp":"미시체계는 아동이 직접 접하는 직접적 관계 및 활동으로 발달에 가장 강력한 영향을 준다. ②는 중간체계, ③은 외체계, ④는 거시체계이다.","id":"simri-m35"},{"ch":"CH01 학습자의 발달","t":"브론펜브레너","q":"브론펜브레너(Bronfenbrenner)의 '외체계'의 예로 옳은 것은?","opts":["부모의 일터, 부모의 건강이나 고용상태, 가족의 종교, 대중매체","부모, 형제자매, 교사, 학교, 친구","사회·경제적 지위, 부, 빈곤, 인종, 이데올로기","아동의 입학, 이사, 부모의 이혼"],"a":0,"exp":"외체계는 아동이 직접 접촉하지 않지만 간접적 영향을 미치는 사회적 구조로 예는 부모의 일터, 부모의 건강이나 고용상태, 가족의 종교, 가족의 친구들, 대중매체, 여가활동에 대한 지역사회 자원 등이다. ②는 미시체계, ③은 거시체계, ④는 시간체계이다.","id":"simri-m36"},{"ch":"CH01 학습자의 발달","t":"브론펜브레너","q":"브론펜브레너(Bronfenbrenner)의 '시간체계'에 해당하는 것은?","opts":["시간의 차원으로 일생 동안 일어나는 인간의 변화, 사회·역사적 환경의 변화(예: 아동의 입학, 이사, 부모의 이혼)","교사-부모, 아동의 친구-아동의 형제 등의 상호작용","관습, 법, 규범, 관념, 사회의 가치, 전통","부모의 일터, 대중매체"],"a":0,"exp":"시간체계는 시간의 차원으로 일생 동안 일어나는 인간의 변화, 사회·역사적 환경의 변화 등이며 예로는 아동의 입학, 이사, 부모의 이혼 등이 있다. ②는 중간체계, ③은 거시체계, ④는 외체계이다.","id":"simri-m37"},{"ch":"CH01 학습자의 발달","t":"브론펜브레너","q":"브론펜브레너(Bronfenbrenner)의 '중간체계'에 대한 설명으로 옳은 것은?","opts":["미시체계 모든 요소들 간의 상호작용과 관계의 집합(예: 교사-부모, 아동의 친구-아동의 형제 등의 상호작용)","아동이 직접 접하는 직접적인 관계 및 활동","아동이 속하여 자란 문화와 관습, 법, 규범","일생에서 경험하는 변화"],"a":0,"exp":"중간체계는 미시체계 모든 요소들 간의 상호작용과 관계의 집합이다.","id":"simri-m38"},{"ch":"CH01 학습자의 발달","t":"사회적 조망수용","q":"사회적 조망수용능력(social perspective taking ability)의 개념으로 옳은 것은?","opts":["타인의 관점, 입장, 사고, 감정 등을 추론하여 이해하는 능력","자신의 인지과정에 대한 자각과 통제 능력","자신이나 타인의 감정을 인지하고 조절하는 개인의 능력","새롭고 적절한 산출물을 생산해내는 능력"],"a":0,"exp":"사회적 조망수용능력은 '타인의 관점, 입장, 사고, 감정 등을 추론하여 이해하는 능력'이다. ②는 메타인지, ③은 정서지능, ④는 창의성이다.","id":"simri-m39"},{"ch":"CH01 학습자의 발달","t":"사회적 조망수용","q":"사회적 조망수용능력이 발달한 아동의 특징으로 옳지 않은 것은?","opts":["타인의 정서와 자신의 정서를 분리하지 못하고 동일시한다","타인의 정서를 간접적으로 경험하는 감정이입 능력과 동정심을 가지고 있다","어려운 사회적 문제를 효과적으로 잘 처리하는 사회적 문제해결 능력을 지닌다","자신과 타인을 객체로 이해하고 타인의 관점에서 자신의 행동을 인지함으로써 타인의 의도·태도·감정을 추론할 수 있다"],"a":0,"exp":"제시된 특징은 ②③④이며, ①과 같은 내용은 제시되지 않는다.","id":"simri-m40"},{"ch":"CH01 학습자의 발달","t":"셀만 조망수용","q":"셀만(Selman)의 조망수용 0단계(자기중심적·미분화된 조망수용, 3~6세)의 특징은?","opts":["타인이 자신과 다른 관점을 가지고 있다는 것을 이해하지 못하고, 타인이 자신의 견해와 동일한 생각을 가진다고 여김","타인과 자신이 동일한 상황에 대해 조망이 다를 수 있다는 것은 이해하지만 여전히 자신의 입장에서 이해하려 함","타인의 조망을 고려할 수 있고 타인도 자신의 조망을 고려할 수 있다는 것을 이해함","동시상호적으로 자신과 타인의 조망을 각각 이해할 수 있음"],"a":0,"exp":"0단계는 타인을 자기중심적으로 보아 다른 관점을 가질 수 있음을 깨닫지 못한다. ②는 1단계, ③은 2단계, ④는 3단계이다.","id":"simri-m41"},{"ch":"CH01 학습자의 발달","t":"셀만 조망수용","q":"셀만(Selman)의 1단계(주관적·사회정보적 조망수용, 6~8세)의 특징으로 옳은 것은?","opts":["사람들이 다른 정보를 가지고 있으면 다른 조망을 가지게 된다고 생각하며, 자신의 행동을 타인의 조망에서 평가하기 어려움","같은 정보를 가지고 있어도 사람들이 다른 조망을 가질 수 있음을 이해함","제3자의 입장에서 객관적으로 생각할 수 있음","사회 구성원이 갖는 일반화된 관점을 이해함"],"a":0,"exp":"1단계는 '사람들이 다른 정보를 가지고 있으면 다른 조망을 가지게 된다고 생각'하며 자신의 행동을 타인의 조망에서 평가하기 어렵다. ②는 2단계, ③은 3단계, ④는 4단계이다.","id":"simri-m42"},{"ch":"CH01 학습자의 발달","t":"셀만 조망수용","q":"셀만(Selman)의 2단계(자기반성적 조망수용, 8~10세)의 특징으로 옳지 않은 것은?","opts":["타인과 자신의 조망을 동시에 고려할 수 있다","타인의 조망을 고려할 수 있고 타인도 자신의 조망을 고려할 수 있다는 것을 이해한다","다른 사람의 입장이 되어서 그 사람의 의도와 목적, 행동을 이해할 수 있다","같은 정보를 가지고 있어도 사람들이 다른 조망을 가질 수 있음을 이해한다"],"a":0,"exp":"2단계는 '타인과 자신의 조망을 동시에 고려하지는 못함'이 특징이므로 ①이 틀렸다. 동시상호적 이해는 3단계이다.","id":"simri-m43"},{"ch":"CH01 학습자의 발달","t":"셀만 조망수용","q":"셀만(Selman)의 3단계(상호적·제3자적 조망수용, 10~12세)의 특징으로 옳은 것은?","opts":["자신과 상대방의 입장에서 벗어나 이해관계가 없는 제3자의 입장에서 자신과 상대방이 어떻게 보일지를 생각할 수 있음","자신이 타인의 조망을 완전하게 이해하지 못한다는 것을 이해함","타인이 자신과 동일한 생각을 가진다고 여김","사람들이 다른 정보를 가지면 다른 조망을 가진다고 생각함"],"a":0,"exp":"3단계는 동시상호적으로 자신과 타인의 조망을 각각 이해하며, 제3자의 입장에서 객관적으로 생각할 수 있다. ②는 4단계, ③은 0단계, ④는 1단계이다.","id":"simri-m44"},{"ch":"CH01 학습자의 발달","t":"셀만 조망수용","q":"셀만(Selman)의 4단계(사회관습적 조망수용, 12~15세(성인))의 특징으로 옳은 것은?","opts":["동일한 상황에 대해 다른 조망을 가진다고 해서 그 조망이 틀렸다고 생각하지 않으며, 제3자의 입장을 넘어 사회 구성원이 갖는 일반화된 관점을 이해함","자신과 타인의 조망을 동시에 고려하지 못함","타인의 조망에서 자신의 행동을 평가하기 어려움","타인이 다른 관점을 가질 수 있음을 깨닫지 못함"],"a":0,"exp":"4단계는 다른 조망을 틀렸다고 보지 않고, 자신이 타인의 조망을 완전하게 이해하지 못한다는 것도 이해하며, 사회 구성원의 일반화된 관점을 이해한다.","id":"simri-m45"},{"ch":"CH01 학습자의 발달","t":"피아제 도덕성","q":"피아제(Piaget)의 도덕성 발달에서 전조작기 아동에게 해당하는 단계와 특징으로 옳은 것은?","opts":["타율적 도덕성(4~8세) - 규칙과 질서는 권위 있는 사람에 의해 만들어져 절대적이고 수정 불가능한 것으로 인식하는 도덕적 사실주의를 따름","자율적 도덕성(8~12세) - 규칙이나 질서가 타인과의 협의를 통해 만들어지고 수정될 수 있다고 생각함","타율적 도덕성 - 행동의 결과보다는 의도를 기준으로 선악을 판단함","자율적 도덕성 - 외부의 규율과 법칙의 권위에 의존하여 행동함"],"a":0,"exp":"전조작기는 타율적 도덕성(4~8세)으로 도덕적 사실주의를 따르며, 외부의 규율과 법칙의 권위에 의존하여 행동의 결과에 따라 선악을 판단하는 구속의 도덕성을 발달시킨다.","id":"simri-m46"},{"ch":"CH01 학습자의 발달","t":"피아제 도덕성","q":"피아제(Piaget)의 '자율적 도덕성'(구체적 조작기 이후, 8~12세)의 특징으로 옳은 것은?","opts":["규칙이나 질서가 타인과의 협의를 통해 만들어지고 수정될 수 있다고 생각하며, 행동의 결과보다는 의도를 기준으로 선악을 판단함","규칙은 절대적이고 수정 불가능하다고 인식함","행동의 결과에 따라 선악을 판단함","권위 있는 사람의 지시에 의존하여 행동함"],"a":0,"exp":"자율적 도덕성은 규칙이 협의를 통해 수정 가능하다고 보며, 결과보다 의도를 기준으로 선악을 판단한다.","id":"simri-m47"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 전인습수준에 대한 설명으로 옳은 것은?","opts":["사회적 인습을 무시하는 것이 아니라 전혀 고려하지 못하는 시기로, 인습에 대한 인식 자체가 없기 때문에 권위적 인물의 지시나 명령, 자신과 타인의 손익을 기준으로 도덕판단을 함","도덕적 추론이 자신의 결과에 의존하지 않고 옳고 그름에 대한 사회적 관습을 받아들임","법, 사회질서를 뛰어넘어 보편적 원리와 윤리에 기초해 도덕판단을 함","타인의 기대와 사회의 질서를 절대적으로 존중하고 따름"],"a":0,"exp":"전인습수준은 인습에 대한 인식 자체가 없어 권위적 인물의 지시·명령, 손익을 기준으로 판단한다. ②④는 인습수준, ③은 후인습수준이다.","id":"simri-m48"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 1단계(복종과 처벌 지향)의 특징으로 옳은 것은?","opts":["행위의 옳고 그름은 결과에 달려 있음","도덕판단의 기준은 자신과 타인과의 욕구충족임","타인을 기쁘게 하고 인정받는 행동이 옳은 행동임","법과 질서를 준수하는 것이 옳은 행위임"],"a":0,"exp":"1단계는 '행위의 옳고 그름은 결과에 달려 있음'이다. ②는 2단계, ③은 3단계, ④는 4단계이다.","id":"simri-m49"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 2단계 '개인적 쾌락주의(도구적 상대주의 지향)'의 특징은?","opts":["도덕판단의 기준은 자신과 타인과의 욕구충족임","행위의 옳고 그름은 결과에 달려 있음","권위와 성문화된 규칙, 사회질서의 유지를 지향함","법은 사회적 계약에 따라 만들어졌으므로 수정될 수 있음을 이해함"],"a":0,"exp":"2단계는 '도덕판단의 기준은 자신과 타인과의 욕구충족'이다.","id":"simri-m50"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 인습수준에 대한 설명으로 옳은 것은?","opts":["도덕적 추론이 자신의 결과에 의존하지 않고 옳고 그름에 대한 사회적인 관습을 받아들이며, 타인의 기대와 사회의 질서를 절대적으로 존중하고 따르고자 함","인습에 대한 인식 자체가 없어 손익을 기준으로 판단함","보편적 원리와 윤리에 기초해 도덕판단을 함","정의, 평등, 존엄성과 같은 도덕적 원리에 기준한 판단에 따름"],"a":0,"exp":"인습수준은 사회적 관습을 받아들이며 타인의 기대와 사회질서를 절대적으로 존중·정당화한다. ②는 전인습수준, ③④는 후인습수준이다.","id":"simri-m51"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 3단계 '착한 소년/소녀 지향(대인 간 조화)'의 특징은?","opts":["타인을 기쁘게 하고 타인에게 인정받는 행동이 도덕적으로 옳은 행동임","법과 질서를 준수하는 것이 도덕적으로 옳은 행위임","도덕판단의 기준은 욕구충족임","법은 약속을 다시 하면 수정될 수 있음"],"a":0,"exp":"3단계는 타인을 기쁘게 하고 인정받는 행동을 옳다고 본다. ②는 4단계, ③은 2단계, ④는 5단계이다.","id":"simri-m52"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 4단계 '사회질서와 권위 지향'의 특징으로 옳은 것은?","opts":["법과 질서를 준수하는 것이 도덕적으로 옳은 행위이므로 권위와 성문화된 규칙, 사회질서의 유지를 지향하며 사회 속에서 개인의 의무를 다하고자 함","타인에게 인정받는 행동이 옳은 행동임","법은 사회적 계약이므로 수정 가능함","정의·평등·존엄성 같은 보편적 원리에 따름"],"a":0,"exp":"4단계는 법과 질서 준수를 옳다고 보며 권위·성문화된 규칙·사회질서 유지를 지향한다.","id":"simri-m53"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 5단계 '사회계약 지향'의 특징으로 옳은 것은?","opts":["법은 사회적 계약(약속)에 따라 만들어진 것이므로 고정불변한 것이 아니라 약속을 다시 하면 얼마든지 수정될 수 있음을 이해함","정의, 평등, 존엄성과 같은 도덕적 원리에 기준한 도덕적 판단에 따름","권위와 성문화된 규칙, 사회질서의 유지를 지향함","도덕판단의 기준은 욕구충족임"],"a":0,"exp":"5단계는 법을 사회적 계약으로 보아 수정 가능하다고 이해한다. ②는 6단계이다.","id":"simri-m54"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 6단계 '보편적 원리 지향'에 대한 설명으로 옳은 것은?","opts":["가장 높은 발달단계로 정의, 평등, 존엄성과 같은 도덕적 원리에 기준한 도덕적 판단에 따름","법은 약속을 다시 하면 수정될 수 있음을 이해함","사회 속에서 개인의 의무를 다하고자 함","타인의 인정을 도덕 판단의 기준으로 삼음"],"a":0,"exp":"6단계는 가장 높은 발달단계로, 정의·평등·존엄성과 같은 도덕적 원리에 기준한 판단에 따른다.","id":"simri-m55"},{"ch":"CH01 학습자의 발달","t":"콜버그 교육방안","q":"콜버그(Kohlberg)의 관점에서 도덕성을 발달시키는 방안 중 '+1단계 전략'에 대한 설명으로 옳은 것은?","opts":["도덕적 딜레마 상황 제시를 통해 도덕적 인지갈등을 유발하고, 한 단계 높은 단계에 있는 학생들과의 토론을 통해 상위 수준의 도덕적 사고에 노출시켜 발달수준을 높임","학생의 도덕적 발달수준을 고려한 교육내용을 제공함","'왜 그렇게 행동해야 하는지'에 대해 생각해 보도록 함","도덕적 문제에 관한 토론을 통해 도덕적 사고력과 판단력을 증진시킴"],"a":0,"exp":"+1단계 전략은 도덕적 딜레마로 인지갈등을 유발한 후, 한 단계 높은 학생들과의 토론으로 상위 수준 사고에 노출시키는 전략이다. ②는 도덕적 발달수준에 기초한 교육, ③은 도덕적 판단능력을 기르는 교육, ④는 도덕적 토론(딜레마) 수업이다.","id":"simri-m56"},{"ch":"CH01 학습자의 발달","t":"레스트","q":"레스트(Rest)가 주장한 도덕성 이론의 특징으로 옳은 것은?","opts":["도덕성을 도덕적 행동의 표출에 주목하며, 인지적 측면에 국한하지 않고 행동적 측면도 포함하여 종합적으로 파악함","도덕성을 인지적 추론 능력으로만 한정하여 파악함","여성의 배려와 책임감을 중심으로 도덕적 판단을 설명함","도덕성을 규칙에 대한 복종 여부로 판단함"],"a":0,"exp":"레스트 이론의 특징은 ①도덕성을 도덕적 행동의 표출에 주목함 ②도덕성을 인지적 측면에 국한하지 않고 행동적 측면도 포함하여 종합적으로 파악함이다.","id":"simri-m57"},{"ch":"CH01 학습자의 발달","t":"레스트","q":"레스트(Rest)의 4가지 심리과정 중 '제1요소-도덕감수성'에 해당하는 설명은?","opts":["상황 속에 내재된 도덕적 이슈를 인지하고 상황을 해석하며 자신의 행동이 타인에게 미칠 수 있는 영향이나 결과에 대해 미리 예측할 수 있는 능력","자신의 행동이 도덕적으로 옳고 정의로운지 판단하는 능력","도덕적 가치를 다른 가치들보다 더 우위에 두고자 하는 동기부여","자아강도, 인내심, 용기 등의 특성"],"a":0,"exp":"제1요소 도덕감수성은 도덕적 이슈를 인지·해석하고 자신의 행동이 타인에게 미칠 영향을 예측하는 능력이다. ②는 도덕판단력, ③은 도덕동기화, ④는 도덕적 품성이다.","id":"simri-m58"},{"ch":"CH01 학습자의 발달","t":"레스트","q":"레스트(Rest)의 '제4요소-도덕적 품성'에 대한 설명으로 옳은 것은?","opts":["자아강도, 인내심, 용기 등의 특성을 포함하며, 제1~3요소가 갖추어졌더라도 실제로 도덕적 행동을 실천하는 의지가 약하거나 외부 압력에 견디는 인내심·용기가 부족할 경우 도덕적 행동이 어려움","상황 속 도덕적 이슈를 인지하고 결과를 예측하는 능력","행동이 도덕적으로 옳고 정의로운지 판단하는 능력","도덕적 가치를 다른 가치보다 우위에 두는 동기부여"],"a":0,"exp":"제4요소 도덕적 품성은 자아강도·인내심·용기 등을 포함하며, 앞의 세 요소가 갖추어져도 실천 의지·인내심·용기가 부족하면 도덕적 행동이 어렵다.","id":"simri-m59"},{"ch":"CH01 학습자의 발달","t":"레스트","q":"레스트(Rest)의 '제3요소-도덕동기화'에 대한 설명으로 옳은 것은?","opts":["자신의 행동이 옳다고 판단하였더라도 도덕적 가치를 다른 가치들보다 더 우위에 두고자 하는 동기부여가 충분히 이루어졌을 때 도덕적 행동이 표출됨","도덕적 이슈를 인지하고 해석하는 능력","자아강도와 인내심을 포함하는 특성","행동이 정의로운지 판단하는 능력"],"a":0,"exp":"제3요소 도덕동기화는 제2요소에서 옳다고 판단했더라도 도덕적 가치를 다른 가치보다 우위에 두려는 동기부여가 충분해야 도덕적 행동이 표출된다는 것이다.","id":"simri-m60"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 도덕성 발달이론의 특징으로 옳지 않은 것은?","opts":["여성은 인간에 대한 책임보다 추상적인 도덕적 원리를 강조한다","여성은 인간관계와 타인을 돌보는 것을 바탕으로 한 배려와 책임감을 중심으로 도덕적 판단을 한다","여성은 타인의 요구에 민감히 반응하고 타인과의 관계를 고려하는 대인지향적인 도덕적 사고를 한다","여성의 도덕성은 이기적 단계에서 시작해 타인의 입장을 중요시하는 단계를 거쳐 자신과 관련된 모든 사람에게 최선의 방법을 모색하는 도덕성으로 나아간다"],"a":0,"exp":"길리건은 '여성은 추상적인 도덕적 원리보다는 인간에 대한 책임을 강조한다'고 보았으므로 ①은 반대로 서술되어 틀렸다.","id":"simri-m61"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 도덕성 발달 단계 중 '수준1-자기지향'의 특징으로 옳은 것은?","opts":["자신의 이익과 생존에 자기중심적으로 몰두하는 단계로, 자기 자신의 필요에만 관심을 가짐","애착과 다른 사람과의 관계 형성이 중요해지는 단계","타인에 대한 배려, 책임감, 자기희생을 지향하는 단계","개인의 권리주장과 타인에 대한 책임이 조화를 이룬 상태"],"a":0,"exp":"수준1-자기지향은 자신의 이익과 생존에 자기중심적으로 몰두하는 단계이다. ②는 전환기1, ③은 수준2, ④는 수준3이다.","id":"simri-m62"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 '전환기1-이기심에서 책임감으로'의 특징으로 옳은 것은?","opts":["애착과 다른 사람과의 관계 형성이 중요해지는 단계로, 도덕적 판단기준이 독립적이고 이기적인 것에서 관계와 책임감으로 옮겨가기 시작함","왜 다른 사람을 위해서 자신을 희생해야 하는가에 대한 의문을 가짐","전체 인류에 대한 공감을 갖춤","자기 자신의 필요에만 관심을 가짐"],"a":0,"exp":"전환기1은 애착과 관계 형성이 중요해지며 도덕적 판단기준이 이기적인 것에서 관계와 책임감으로 옮겨가는 단계이다. ②는 전환기2이다.","id":"simri-m63"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 '수준2-자기희생으로서의 선'의 특징으로 옳은 것은?","opts":["타인에 대한 배려, 책임감, 자기희생을 지향하며, 사회적 조망이 발달하면서 자신의 욕구를 억제하고 타인의 요구에 응하려 노력하게 됨","도덕적 판단기준이 자기 주변의 타인에서 보다 넓은 범위의 타인의 욕구와 통합되는 것으로 발전함","개인의 권리주장과 타인에 대한 책임이 조화를 이룬 상태","자신의 이익과 생존에 몰두함"],"a":0,"exp":"수준2는 배려·책임감·자기희생을 지향하며 자신의 욕구를 억제하고 타인의 요구에 응하려 노력한다. ②는 전환기2, ③은 수준3이다.","id":"simri-m64"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 '수준3-비폭력 도덕성'에 대한 설명으로 옳은 것은?","opts":["대인 간 도덕적 추론의 마지막 단계로, 개인의 권리주장과 타인에 대한 책임이 조화를 이룬 상태이며 전체 인류에 대한 공감을 갖춤","자신의 욕구를 억제하고 타인의 요구에 응하려 노력함","도덕적 판단기준이 관계와 책임감으로 옮겨가기 시작함","자기 자신의 필요에만 관심을 가짐"],"a":0,"exp":"수준3-비폭력 도덕성은 대인 간 도덕적 추론의 마지막 단계로, 개인의 권리주장과 타인에 대한 책임이 조화를 이루고 전체 인류에 대한 공감을 갖춘 상태이다.","id":"simri-m65"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 관점에서 도덕성을 발달시키는 방안으로 옳은 것은?","opts":["돌봄의 주제(자신을 돌보기, 가족과 친구 돌보기, 낯선 사람과 세계를 돌보기)로 교육과정을 준비(조직)하기","도덕적 딜레마를 제시하여 +1단계 전략을 사용하기","학생의 도덕적 발달수준에 기초한 교육내용을 제공하기","도덕적 원리의 위계를 논리적으로 가르치기"],"a":0,"exp":"길리건의 방안은 ①보살핌과 관련한 도덕적 주제에 대해 생각하고 토론할 기회를 교육과정을 통해 제공 ②돌봄의 주제로 교육과정 준비(조직)하기이다. ②③은 콜버그의 방안이다.","id":"simri-m66"},{"ch":"CH02 학습자의 인지적 특성","t":"카텔·혼 지능","q":"카텔(Cattell)과 혼(Horn)의 지능이론에서 '유동적 지능'에 대한 설명으로 옳지 않은 것은?","opts":["환경, 경험, 문화, 교육의 영향을 받아 발달되며 연령의 영향을 받지 않는다","생물학적으로 결정되는 생리적·신경적 요인이다","생리적 발달이 지속되는 청년기까지는 계속적으로 증가하나 청년기에 절정을 이루고 성인기 이후 감퇴한다","개인의 독특한 사고력, 기억력, 정보처리 속도 등의 능력에서 나타난다"],"a":0,"exp":"①은 결정적 지능에 대한 설명이다. 유동적 지능은 생물학적으로 결정되는 생리적·신경적 요인으로 청년기에 절정을 이루고 성인기 이후 감퇴한다.","id":"simri-m67"},{"ch":"CH02 학습자의 인지적 특성","t":"카텔·혼 지능","q":"카텔(Cattell)과 혼(Horn)의 '결정적 지능'의 특징으로 옳은 것은?","opts":["환경, 경험, 문화, 교육의 영향을 받아 발달되며 연령의 영향을 받지 않고 환경적 자극이 있다면 성인기 이후에도 꾸준히 발달함","생물학적으로 결정되는 생리적·신경적 요인","청년기에 절정을 이루고 성인기 이후 감퇴함","개인의 독특한 사고력, 기억력, 정보처리 속도에서 나타남"],"a":0,"exp":"결정적 지능은 환경·경험·문화·교육의 영향을 받아 발달하며 연령의 영향을 받지 않아 성인기 이후에도 발달한다. 환경적응능력으로서 언어능력, 상식, 문제해결력 등에서 잘 나타난다.","id":"simri-m68"},{"ch":"CH02 학습자의 인지적 특성","t":"카텔·혼 지능","q":"결정적 지능이 잘 나타나는 능력으로 옳은 것은?","opts":["환경적응능력으로서 언어능력, 상식, 문제해결력","정보처리 속도, 기억력","반응속도와 반응오류","감각기억의 용량"],"a":0,"exp":"결정적 지능은 '환경적응능력으로서 언어능력, 상식, 문제해결력 등의 능력에서 잘 나타난다.' 정보처리 속도·기억력은 유동적 지능에서 나타난다.","id":"simri-m69"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner) 다중지능이론의 주요 주장으로 옳은 것은?","opts":["9개의 지능은 각자의 능력이 구분되고 뇌의 특정 영역과 관련되어 있으며 각기 다른 발달적 경로를 따른다","지능은 하나의 일반요인(g요인)으로 수렴된다","지능은 유동적 지능과 결정적 지능 두 가지로 구성된다","지능은 분석적·창의적·실제적 지능의 삼원구조를 가진다"],"a":0,"exp":"가드너의 주요 주장은 ①9개 지능의 상호독립성 ②인간의 잠재능력 확장(기존 IQ 검사 점수에서 벗어나 개인 고유의 잠재능력 범위를 확장)이다. ④는 스턴버그이다.","id":"simri-m70"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner)의 다중지능 핵심성분 중 '개인 내 지능'에 해당하는 설명은?","opts":["자신의 감정에 충실하고 정서를 구분하는 능력","타인의 기분, 기질, 동기, 욕망을 구분하고 대응하는 능력","삶의 의미, 죽음, 인간적 조건 등에 대한 민감성","다양한 종을 구분하고 인지할 수 있는 능력"],"a":0,"exp":"개인 내 지능은 '자신의 감정에 충실하고 정서를 구분하는 능력'이다. ②는 대인관계지능, ③은 영적/존재론적 지능, ④는 자연지능이다.","id":"simri-m71"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner)의 다중지능 중 '논리-수학지능'의 개념으로 옳은 것은?","opts":["논리적·수리적 유형에 대한 민감성과 구분능력","시·공간체계에 대한 예민한 지각","단어 의미, 소리, 언어의 구조, 언어 사용방법에 대한 민감성","음정, 리듬, 음색 등을 만들고 평가하는 능력"],"a":0,"exp":"논리-수학지능은 '논리적·수리적 유형에 대한 민감성과 구분능력'이다. ②는 공간지능, ③은 언어지능, ④는 음악지능이다.","id":"simri-m72"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner)의 다중지능 9가지에 포함되지 않는 것은?","opts":["정서지능","신체운동지능","자연지능","영적/존재론적 지능"],"a":0,"exp":"다중지능 9가지는 언어, 논리-수학, 공간, 신체운동, 음악, 대인관계, 개인 내, 자연, 영적/존재론적 지능이다. 정서지능은 포함되지 않는다.","id":"simri-m73"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner) 이론의 교육적 시사점 중 '교수방법' 측면에 해당하는 것은?","opts":["학생의 강점지능을 활용하여 여러 과목을 가르치는 교수방법인 2차적 통로를 사용함","9가지 다중지능이 골고루 반영되도록 교육과정을 다양화함","다양한 형태의 수행평가를 통해 학생의 강점을 파악함","학생 간의 차이보다는 한 개인의 지능의 강점과 약점에 관심을 가짐"],"a":0,"exp":"교수방법 측면의 시사점은 '학생 간 지능의 구성 차이를 인정하고 개인차를 고려한 맞춤형 교육 실시', '학생의 강점지능을 활용하는 2차적 통로 사용'이다. ②는 교육과정, ③④는 평가 측면이다.","id":"simri-m74"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너 다중지능","q":"가드너(Gardner) 이론의 교육과정 측면 시사점으로 옳지 않은 것은?","opts":["학생의 지능 차이보다 표준화된 단일 교육내용을 강조해야 한다","9가지 다중지능이 골고루 반영되도록 교육과정을 다양화한다","9가지 다중지능을 통합할 수 있는 교육내용이 포함되어야 하며 여러 지능의 통합적 발달을 통해 전인교육이 가능하다","학생들의 지능과 관심의 차이를 인정하고 스스로 배울 것을 선택할 수 있도록 장려한다"],"a":0,"exp":"가드너 이론은 지능과 관심의 차이를 인정하고 교육과정을 다양화할 것을 시사하므로 ①은 옳지 않다.","id":"simri-m75"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg) 삼원지능이론의 주요 주장으로 옳은 것은?","opts":["정보처리적 접근 — 사람들이 세상에 대해 어떻게 학습하고, 알고 있는 것을 어떻게 조작하며, 알게 된 것을 어떻게 활용하는지에 관심이 있음","9개 지능이 각각 뇌의 특정 영역과 관련되어 상호독립적임","지능은 유동적 지능과 결정적 지능으로 구성됨","지능은 문화적·경제적 배경에 따라 달라지지 않는 단일 능력임"],"a":0,"exp":"스턴버그의 주요 주장은 ①정보처리적 접근 ②지능의 삼원론(모든 사람에게 공통적으로 나타나는 인지과정을 강조)이다. ②는 가드너, ③은 카텔·혼이다.","id":"simri-m76"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 '분석적 지능(구성요소적 지능)'에 대한 설명으로 옳은 것은?","opts":["개인의 지적 행동과 관련된 정신과정에 대한 지능으로, 문제를 분석·판단·평가·비교·대조하는 능력이며 '어떻게' 지적 행동이 발생되는가에 초점을 둠","새로운 환경을 효과적으로 다루고 익숙한 문제를 능숙하게 해결하는 능력","외부 세계와 관련된 지능으로 환경에 적응·변경·선택하는 능력","자신과 타인의 감정을 인지하고 조절하는 능력"],"a":0,"exp":"분석적 지능은 지적 행동과 관련된 정신과정에 대한 지능으로 '어떻게' 지적 행동이 발생되는가에 초점을 둔다. ②는 창의적(경험적) 지능, ③은 실제적 지능, ④는 정서지능이다.","id":"simri-m77"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 분석적 지능 구성요소 중 '메타요소(상위요소)'의 기능으로 옳은 것은?","opts":["해결해야 될 과제의 본질을 파악하고, 그것을 해결하기 위해 계획을 세우고, 해결과정을 점검·평가하는 기능","메타요소에 의해 설계된 계획이나 전략을 실제 실행에 옮김","새로운 것을 학습할 때 적절한 정보와 무관한 정보를 구분하고 새로운 정보를 기존 정보에 관련시킴","환경에 적응할 수 없을 때 환경을 조성하거나 변화시킴"],"a":0,"exp":"메타요소는 인간의 고등정신과정으로 수행요소와 지식획득요소를 실질적으로 통제하며, 과제의 본질 파악·계획 수립·점검·평가 기능을 수행한다. ②는 수행요소, ③은 지식획득요소이다.","id":"simri-m78"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 '수행요소'에 대한 설명으로 옳은 것은?","opts":["메타요소인 고등정신과정을 실행하기 위한 하위수준의 과정으로, 과제를 입력시키고 관계를 추리하며 가능한 해결전략을 비교하여 최선의 해결책을 탐색함","과제의 본질을 파악하고 계획을 세우며 점검·평가함","새로운 정보를 학습하는 데 사용하는 요소","환경을 자신에게 맞도록 변경하는 능력"],"a":0,"exp":"수행요소는 메타요소에 의해 설계된 계획이나 전략을 실제 실행에 옮기는 하위수준 과정이다.","id":"simri-m79"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 '지식획득요소'의 기능으로 옳은 것은?","opts":["새로운 것을 학습할 때 적절한 정보와 무관한 정보를 구분하고, 새로운 정보를 기존의 정보에 관련시키는 정신과정의 기능","해결전략을 비교하여 최선의 해결책을 탐색함","과제 해결 계획을 세우고 점검·평가함","일상생활에 적절한 환경을 선택함"],"a":0,"exp":"지식획득요소는 새로운 정보를 학습하는 데 사용하는 요소로, 적절한 정보와 무관한 정보를 구분하고 새로운 정보를 기존 정보에 관련시킨다.","id":"simri-m80"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 경험적 지능을 구성하는 두 가지 능력으로 옳은 것은?","opts":["신기성을 다루는 능력, 정보처리를 자동화하는 능력","적응, 변경","선택적 부호화, 선택적 결합","메타요소, 수행요소"],"a":0,"exp":"경험적 지능의 두 능력은 ①신기성을 다루는 능력(통찰력과 새로운 상황을 효과적으로 다루는 능력) ②정보처리를 자동화하는 능력(새로운 해결책을 신속하게 일상적 과정으로 바꾸어 인지적 노력 없이 적용 가능한 능력)이다.","id":"simri-m81"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 세 가지 통찰력 중 '선택적 결합'에 해당하는 것은?","opts":["처음에는 서로 관련 없는 요소들을 연관시켜 새로운 것을 창출해내는 능력","사고나 문제해결 과정에서 중요하고 적절한 정보에 주의를 기울이는 능력","이미 갖고 있는 정보와 새로운 정보 사이의 관계를 비교하고 새로운 것을 유추해낼 수 있는 능력","새로운 해결책을 신속하게 일상적인 과정으로 바꾸는 능력"],"a":0,"exp":"선택적 결합은 '처음에는 서로 관련 없는 요소들을 연관시켜 새로운 것을 창출해내는 능력'이다. ②는 선택적 부호화, ③은 선택적 비교이다.","id":"simri-m82"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 '선택적 부호화'의 개념으로 옳은 것은?","opts":["사고나 문제해결 과정에서 중요하고 적절한 정보에 주의를 기울이는 능력","관련 없는 요소들을 연관시켜 새로운 것을 창출하는 능력","이미 갖고 있는 정보와 새로운 정보의 관계를 비교하는 능력","환경을 자신에게 맞도록 변경하는 능력"],"a":0,"exp":"선택적 부호화는 사고나 문제해결 과정에서 중요하고 적절한 정보에 주의를 기울이는 능력이다.","id":"simri-m83"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 실제적 지능을 구성하는 능력 3가지로 옳은 것은?","opts":["적응, 변경, 선택","부호화, 결합, 비교","메타요소, 수행요소, 지식획득요소","유창성, 융통성, 독창성"],"a":0,"exp":"실제적 지능은 ①적응(환경에 적응하는 능력) ②변경(환경을 자신에게 맞도록 변경하는 능력) ③선택(개인의 목표와 일상생활 및 세계의 요구에 적절한 환경을 선택하는 능력)으로 구성된다.","id":"simri-m84"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그 삼원지능","q":"스턴버그(Sternberg)의 실제적 지능의 특징으로 옳은 것은?","opts":["문화 또는 하위문화, 시대, 생애주기에서 어떤 시기에 있는지에 따라 다르며, 개인의 경험을 통해 획득되고 발전함","생물학적으로 결정되며 성인기 이후 감퇴함","뇌의 특정 영역과 관련되어 상호독립적임","반응속도와 반응오류로 측정됨"],"a":0,"exp":"실제적 지능의 특징은 ①문화 또는 하위문화, 시대, 생애주기에 따라 다름 ②개인의 경험을 통해 획득되고 발전함이다.","id":"simri-m85"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"정서지능(emotional intelligence)의 개념으로 옳은 것은?","opts":["자신이나 타인의 감정을 인지하고 조절하는 개인의 능력","타인의 관점과 입장을 추론하여 이해하는 능력","새롭고 적절한 산출물을 생산해내는 능력","자신의 인지과정에 대한 자각과 통제"],"a":0,"exp":"정서지능은 '자신이나 타인의 감정을 인지하고 조절하는 개인의 능력'이다.","id":"simri-m86"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"골만(Goleman)의 관점에서 정서지능을 구성하는 4가지 요인의 구조로 옳은 것은?","opts":["개인적 능력(자기감정 인식, 자기감정 조절+자기동기부여)과 사회적 능력(타인감정 인식, 타인감정 조절(관계조절))","정서의 인식·평가·표현, 정서를 통한 사고의 촉진, 정서의 이해와 분석, 정서의 반성적 조절","유창성, 융통성, 독창성, 정교성","적응, 변경, 선택, 통찰"],"a":0,"exp":"골만은 인식/조절 × 개인적 능력/사회적 능력의 구조로, 자기감정 인식·자기감정 조절(+자기동기부여)·타인감정 인식·타인감정 조절(관계조절) 4가지 요인을 제시하였다. ②는 샐로비와 메이어이다.","id":"simri-m87"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"정서지능을 높이는 교수-학습방법으로 제시된 것은?","opts":["토의 및 토론, 협동학습 기반 프로젝트 학습, 협동학습, 목표기반 시나리오 등 사회적 상호작용을 통한 방법","반복적인 암기와 시연 중심 학습","경쟁적 평가를 통한 동기유발","개별화된 프로그램 학습"],"a":0,"exp":"정서지능을 높이는 교수-학습방법은 ①토의 및 토론, 협동학습 기반 프로젝트 학습, 협동학습, 목표기반 시나리오 등 사회적 상호작용 ②감정을 주제로 한 수업(감정인식 수업, 감정조절 수업, 감정조사하기)이다.","id":"simri-m88"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"샐로비(Salovey)와 메이어(Mayer)의 정서지능 영역 중 '영역Ⅱ-정서를 통한 사고의 촉진'에 해당하는 설명은?","opts":["중요한 사건에 주의를 기울이게 하여 사고를 형성하고 촉진할 수 있는 능력","자신과 타인의 감정과 기분을 정확하게 이해하고 표현하는 능력","정서를 이해하고 정서정보가 담고 있는 지식을 활용하는 능력","정서적-지적 성장의 향상을 위하여 정서를 의식적으로 조절하는 능력"],"a":0,"exp":"영역Ⅱ는 '중요한 사건에 주의를 기울이게 하여 사고를 형성하고 촉진할 수 있는 능력'이다. ②는 영역Ⅰ, ③은 영역Ⅲ, ④는 영역Ⅳ이다.","id":"simri-m89"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"샐로비와 메이어의 '영역Ⅳ-정서의 반성적 조절'에 대한 설명으로 옳은 것은?","opts":["정서적-지적 성장의 향상을 위하여 정서를 의식적으로 조절하는 능력","자신과 타인의 감정과 기분을 정확하게 이해하고 표현하는 능력","정서정보가 담고 있는 지식을 활용하는 능력", ri-m96"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성","q":"창의성의 인지적 특성 중 '민감성'에 대한 설명으로 옳은 것은?","opts":["주변 환경과 사물에 대해 호기심을 느끼고 변화에 예민하게 반응하며 끊임없이 궁금증을 느끼고 탐색하고자 하는 태도","가능한 많은 양의 아이디어를 산출할 수 있는 능력","기존의 것과 다른 새롭고 독특한 아이디어를 생산하는 능력","관점을 변화시켜 다양한 해결책을 찾아내는 능력"],"a":0,"exp":"민감성은 주변 환경과 사물에 대해 호기심을 느끼고 변화에 예민하게 반응하며 끊임없이 탐색하고자 하는 태도이다.","id":"simri-m97"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"브레인스토밍의 개념으로 옳은 것은?","opts":["문제해결을 위해서 제한 시간 동안 최대한 많은 생각을 해보는 기법","서로 다른 성질이나 전혀 관련이 없는 요소를 비교하여 문제해결책을 찾도록 하는 기법","긍정적·부정적·중립적 측면을 차례로 생각하여 아이디어를 생성·평가하는 기법","대상의 속성을 목록으로 작성하여 새로운 아이디어를 얻는 기법"],"a":0,"exp":"브레인스토밍은 '문제해결을 위해서 제한 시간 동안 최대한 많은 생각을 해보는 기법'이다. ②는 시네틱스, ③은 PMI, ④는 속성열거법이다.","id":"simri-m98"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"브레인스토밍의 기본원리에 포함되지 않는 것은?","opts":["아이디어를 즉시 평가하여 우수한 것만 남긴다","비판금지 — 자신이나 타인의 의견을 성급하게 판단하거나 비판하지 않음","자유분방 — 어떤 생각이라도 자유롭게 하고 그 발표의 자유도 허용함","결합 및 개선 — 두 개 이상의 아이디어를 결합시켜 새로운 아이디어를 만듦"],"a":0,"exp":"브레인스토밍의 기본원리는 비판금지, 자유분방, 양산, 결합 및 개선이다. 즉시 평가하는 것은 비판금지 원리에 어긋난다.","id":"simri-m99"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"시네틱스의 개념으로 옳은 것은?","opts":["서로 다른 성질이나 전혀 관련이 없는 요소를 비교하여 문제해결책을 찾도록 하는 기법","제한 시간 동안 최대한 많은 생각을 해보는 기법","긍정적·부정적·중립적 측면을 차례로 생각하는 기법","6가지 색의 모자를 써서 역할을 나누어 사고하는 기법"],"a":0,"exp":"시네틱스는 '서로 다른 성질이나 전혀 관련이 없는 요소를 비교하여 문제해결책을 찾도록 하는 기법'이다.","id":"simri-m100"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"시네틱스의 특징으로 옳은 것은?","opts":["유추와 비유를 통하여 개인이 당연하다고 받아들였던 요소를 이상한 것으로 파악하거나 이상한 것으로 받아들이던 것을 친밀한 것으로 받아들임으로써 사고에서의 민감성을 증진시킴","생성된 아이디어에 대해 좀 더 깊게 분석해보고자 할 때 사용하는 수렴적 사고기법","한정된 역할을 제시하여 자아의 손상 없이 자유롭게 사고할 수 있음","많은 양의 아이디어를 양산하는 데 초점을 둠"],"a":0,"exp":"시네틱스는 유추와 비유를 통해 친숙한 것을 낯설게, 낯선 것을 친숙하게 받아들여 사고의 민감성을 증진시킨다. ②는 PMI, ③은 6색 사고모자기법이다.","id":"simri-m101"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"PMI 기법의 개념으로 옳은 것은?","opts":["어떤 상황에 대해 긍정적인 면(plus), 부정적인 면(minus)을 살펴본 뒤 마지막으로 주목할 만한 가치가 있지만 중립적인 측면(interesting)을 생각하도록 함으로써 아이디어를 생성·평가하는 기법","서로 관련 없는 요소를 비교하여 해결책을 찾는 기법","대상의 속성을 목록화하는 기법","질문 목록을 활용해 아이디어를 변형하는 기법"],"a":0,"exp":"PMI는 plus-minus-interesting의 순서로 살펴보아 아이디어를 생성·평가하는 기법이다.","id":"simri-m102"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"PMI 기법의 특징으로 옳은 것은?","opts":["일반적으로 생성된 아이디어에 대해 좀 더 깊게 분석해보고자 할 때 사용하는 수렴적 사고기법","가능한 많은 아이디어를 산출하는 확산적 사고기법","유추와 비유를 통해 민감성을 증진시키는 기법","자아 손상 없이 자유롭게 사고하게 하는 기법"],"a":0,"exp":"PMI는 생성된 아이디어를 좀 더 깊게 분석할 때 사용하는 수렴적 사고기법이다.","id":"simri-m103"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"SCAMPER 기법의 장점으로 제시된 것은?","opts":["실생활에 많은 도움을 주는 기법으로 창의성 함양에 사용되며 많은 양의 아이디어를 얻을 수 있음","한정된 역할을 제시하여 자아의 손상 없이 자유롭게 사고할 수 있음","생성된 아이디어를 깊게 분석할 수 있음","관련 없는 요소를 결합하여 민감성을 높일 수 있음"],"a":0,"exp":"SCAMPER의 장점은 '실생활에 많은 도움을 주는 기법으로 창의성 함양에 사용되며 많은 양의 아이디어를 얻을 수 있음'이다.","id":"simri-m104"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"SCAMPER 기법의 질문 중 '반전'에 해당하는 것은?","opts":["앞, 뒤, 좌, 우, 안, 밖, 위, 아래, 원인, 결과 등을 거꾸로 한다면?","사람, 성분, 장소, 과정 등을 대체하면 어떨까?","부품 수를 줄이거나 구성요소 중 어느 것을 뺀다면?","원래 기능과는 다른 용도에 응용·활용할 수 없을까?"],"a":0,"exp":"'반전'은 앞뒤·좌우·안팎·위아래·원인결과 등을 거꾸로 하는 질문이다. ②는 대체, ③은 제거, ④는 적용이다.","id":"simri-m105"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"SCAMPER 기법의 질문 중 '결합'에 해당하는 것은?","opts":["별개의 사물, 사람, 목적, 재료들을 어떻게 결합시킬까?","향기, 색, 맛을 바꾸거나 모양을 크게·작게 하면 어떨까?","다른 용도로 활용할 수 있는 방법은?","사람, 성분, 장소, 과정 등을 대체하면 어떨까?"],"a":0,"exp":"'결합'은 별개의 사물·사람·목적·재료들을 어떻게 결합시킬지 묻는 질문이다. ②는 수정(크게·작게), ③은 활용, ④는 대체이다.","id":"simri-m106"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"'문제가 되는 대상이나 아이디어의 다양한 속성을 목록으로 작성하여 세분화된 속성에 주의를 기울이고 새로운 아이디어를 얻는 데 용이하게 해주는 아이디어 창출 기법'의 명칭은?","opts":["속성열거법","시네틱스","PMI 기법","6색 사고모자기법"],"a":0,"exp":"제시된 설명은 '속성열거법'에 해당한다.","id":"simri-m107"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"6색 사고모자기법의 장점으로 옳지 않은 것은?","opts":["아이디어를 즉각적으로 평가하여 우수한 안만 선별할 수 있다","한정된 역할을 제시하여 자아의 손상 없이 자유롭게 사고하고 말할 수 있다","문제해결에 필요한 다른 유형의 사고를 해보면서 새로운 관점을 획득할 수 있다","습관적인 사고의 틀을 벗어날 수 있다"],"a":0,"exp":"6색 사고모자기법의 장점은 ②③④이다. ①은 제시되지 않았다.","id":"simri-m108"},{"ch":"CH02 학습자의 인지적 특성","t":"영재성","q":"렌줄리(Renzulli)가 주장한 영재성의 세 가지 요소(세 고리 모형)로 옳은 것은?","opts":["평균 이상의 능력, 과제집착력, 창의성","유창성, 융통성, 독창성","분석적 지능, 창의적 지능, 실제적 지능","지적 욕구, 심미적 욕구, 자아실현 욕구"],"a":0,"exp":"렌줄리의 영재성 세 요소는 ①평균 이상의 능력(특정 영역에서의 평균 이상 능력) ②과제집착력(과제를 해결하려는 의지와 노력) ③창의성(사고의 유창성, 독창성, 융통성, 개방성 등)이다.","id":"simri-m109"},{"ch":"CH02 학습자의 인지적 특성","t":"영재교육","q":"교육과정 압축 방법 중 '속진'에 대한 설명으로 옳은 것은?","opts":["영재학생이 동일한 교육과정을 좀 더 빨리 학습하도록 하며, 학년을 속진하기도 하고 일부 과목만 속진하기도 함","또래학생들과 함께 학습하되 좀 더 복잡하고 생각을 자극하는 과제를 다양하게 학습하도록 함","학습자의 흥미와 관심에 따라 연구과제를 설정하게 함","실생활과 관련된 문제를 중심으로 학습하게 함"],"a":0,"exp":"속진은 동일한 교육과정을 더 빨리 학습하도록 하는 방법이다. ②③④는 심화에 대한 설명이다.","id":"simri-m110"},{"ch":"CH02 학습자의 인지적 특성","t":"영재교육","q":"'속진'의 단점으로 제시된 것은?","opts":["교육과정의 수직적 운영으로 인하여 폭넓은 학습경험을 하지 못할 수 있음","재정적인 부담이 크며 프로그램 개발이 쉽지 않음","또래와의 상호작용이 지나치게 많아짐","학습자의 동기유발이 어려움"],"a":0,"exp":"속진의 단점은 '교육과정의 수직적 운영으로 인하여 폭넓은 학습경험을 하지 못할 수 있음'이다. ②는 심화의 단점이다.","id":"simri-m111"},{"ch":"CH02 학습자의 인지적 특성","t":"영재교육","q":"'심화'의 장점으로 옳은 것은?","opts":["학습자의 흥미·관심에 따라 연구과제를 설정할 수 있고, 실생활과 관련된 문제를 중심으로 학습하기 때문에 학습자의 동기를 유발하여 자발적인 학습과 창의적인 결과물을 낼 수 있음","경제적인 면에서 효과적이며 영재학생에게 지적 호기심을 제공할 수 있음","교육과정의 수직적 운영이 가능함","프로그램 개발이 용이함"],"a":0,"exp":"심화의 장점은 흥미·관심에 따른 연구과제 설정, 실생활 관련 문제 중심 학습으로 동기 유발 및 창의적 결과물 산출이다. ②는 속진의 장점이다.","id":"simri-m112"},{"ch":"CH02 학습자의 인지적 특성","t":"학습양식","q":"학습양식의 개념으로 옳은 것은?","opts":["학습과 학업에 접근하는 방식으로, 학습환경에 대한 선호 또는 정보를 선택·처리·저장하는 방식","자신의 인지과정에 대한 자각과 통제","학습자의 지능 구성 요소의 차이","학습에 대한 내재적 동기의 수준"],"a":0,"exp":"학습양식은 '학습과 학업에 접근하는 방식. 학습환경에 대한 선호 또는 정보를 선택·처리·저장하는 방식'이다.","id":"simri-m113"},{"ch":"CH02 학습자의 인지적 특성","t":"학습양식","q":"학습양식의 의의로 제시되지 않은 것은?","opts":["학습양식은 고정불변하므로 학생의 유형에 맞는 단일 교수법만 사용해야 한다","자신의 학습양식을 이해하고 있는 학생은 신중하게 자신의 학습을 관리하고 효과적으로 학습하며 자의식을 개발할 수 있다","교사는 학생의 학습양식을 파악하고 때로는 학생에게 새롭고 더 효과적인 학습양식을 제공할 필요가 있다","교사는 개별 학생들이 어떻게 학습에 접근하는지 파악함으로써 학생의 차이를 인정·수용·조절할 수 있다"],"a":0,"exp":"교사는 '때로는 학생에게 새롭고 더 효과적인 학습양식을 제공할 필요가 있다'고 하였으므로 고정불변하다는 ①은 옳지 않다.","id":"simri-m114"},{"ch":"CH02 학습자의 인지적 특성","t":"위트킨 장독립/장의존","q":"위트킨(Witkin)이 학습양식을 구분한 기준으로 옳은 것은?","opts":["전체적인 장(환경, 맥락, 배경) 속에 포함된 자극을 지각하는 데 장이 얼마나 영향을 주는지","개념적 속도 — 반응속도와 반응오류","정보지각방식과 정보처리방식","학습에 대한 내재적/외재적 동기"],"a":0,"exp":"위트킨의 구분 기준은 '전체적인 장(환경, 맥락, 배경) 속에 포함된 자극을 지각하는 데 장이 얼마나 영향을 주는지에 따라 나눔'이다. ②는 케이건, ③은 콜브이다.","id":"simri-m115"},{"ch":"CH02 학습자의 인지적 특성","t":"위트킨 장독립/장의존","q":"장독립형 학습자의 특징으로 옳지 않은 것은?","opts":["명료하게 구조화된 학습자료를 선호한다","분석적·논리적으로 지각한다","구조화 능력이 우수하며 상황을 분석하고 재조직·구조화하는 능력이 우수하다","비구조화된 학습자료를 선호한다"],"a":0,"exp":"명료하게 구조화된 학습자료를 선호하는 것은 장의존형의 특징이다. 장독립형은 비구조화된 학습자료를 선호한다.","id":"simri-m116"},{"ch":"CH02 학습자의 인지적 특성","t":"위트킨 장독립/장의존","q":"장의존형 학습자에게 효과적인 수업전략으로 옳은 것은?","opts":["직접교수법과 교사의 시범, 설명, 개별지도를 제공하고 언어적 칭찬 등 사회적 보상을 사용","탐구-발견식 수업, 프로젝트법을 사용하고 점수 등 비사회적 보상을 사용","독자적으로 문제를 해결할 기회를 제공","비구조화된 학습자료를 제시"],"a":0,"exp":"장의존형에게는 언어적 칭찬 등 사회적 보상, 직접교수법, 교사의 시범·설명·개별지도가 효과적이다. ②③④는 장독립형에 대한 전략이다.","id":"simri-m117"},{"ch":"CH02 학습자의 인지적 특성","t":"위트킨 장독립/장의존","q":"장독립형 학습자의 동기유발 방식으로 옳은 것은?","opts":["내적 동기 — 활동의 선택, 목표추구를 통해 동기화되는 경향이 있고 외부 비판에 민감하지 않아 스스로 선택함","외적 동기 — 언어적 칭찬, 외적 보상이 효과적이며 외부 비판에 민감함","보상과 처벌을 반복적으로 제공하여 동기화함","또래와의 경쟁을 통해 동기화함"],"a":0,"exp":"장독립형은 내적 동기로 활동의 선택과 목표추구를 통해 동기화되며 외부 비판에 민감하지 않다. ②는 장의존형이다.","id":"simri-m118"},{"ch":"CH02 학습자의 인지적 특성","t":"케이건 숙고형/충동형","q":"케이건(Kagan)이 인지양식을 분류한 기준으로 옳은 것은?","opts":["개념적 속도 — 반응속도와 반응오류","장의 영향 정도","정보지각방식과 정보처리방식","내재적/외재적 동기"],"a":0,"exp":"케이건의 분류기준은 '개념적 속도 - 반응속도와 반응오류'이다.","id":"simri-m119"},{"ch":"CH02 학습자의 인지적 특성","t":"케이건 숙고형/충동형","q":"숙고형 학습자의 특징으로 옳지 않은 것은?","opts":["단순한 문제에서 높은 수행수준을 보인다","행동하기 전에 정보를 수집하고 분석하는 것을 선호한다","문제해결 시 가능한 대안을 차분하게 심사숙고하여 실수가 적으나 느리다","다차원적인 복잡한 과제에서 높은 수행수준을 보인다"],"a":0,"exp":"단순한 문제에서 높은 수행수준을 보이는 것은 충동형의 특징이다. 숙고형은 다차원적인 복잡한 과제에서 높은 수행수준을 보인다.","id":"simri-m120"},{"ch":"CH02 학습자의 인지적 특성","t":"케이건 숙고형/충동형","q":"숙고형 학습자에 대한 지도방안으로 제시된 것은?","opts":["어렵고 까다로운 문제에 부딪혔을 때 건너뛰는 전략을 가르침","인지적 자기교수 — 문제해결 과정을 말로 표현하도록 함","사지선다의 경우 오답이라고 생각하는 것에 먼저 표시하도록 함","보다 빠르게 응답하도록 시간 제한을 강화함"],"a":0,"exp":"숙고형의 지도방안은 '어렵고 까다로운 문제에 부딪혔을 때 건너뛰는 전략을 가르침'이다. ②③은 충동형의 지도방안이다.","id":"simri-m121"},{"ch":"CH02 학습자의 인지적 특성","t":"케이건 숙고형/충동형","q":"충동형 학습자에 대한 지도방안으로 옳은 것은?","opts":["인지적 자기교수를 통해 문제해결 과정을 말로 표현하도록 하여 충동성을 줄이고, 사지선다의 경우 오답이라고 생각하는 것에 먼저 표시하여 충동성을 줄임","어렵고 까다로운 문제에 부딪혔을 때 건너뛰는 전략을 가르침","다차원적이고 복잡한 과제를 우선 제시함","비구조화된 학습자료를 제시함"],"a":0,"exp":"충동형의 지도방안은 인지적 자기교수(문제해결 과정을 말로 표현)와 사지선다에서 오답에 먼저 표시하기이다.","id":"simri-m122"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)가 학습유형을 구분하는 2가지 기준은?","opts":["정보지각방식, 정보처리방식","반응속도, 반응오류","장독립성, 장의존성","전념, 탐색"],"a":0,"exp":"콜브는 정보지각방식(구체적 경험/추상적 개념화)과 정보처리방식(활동적 실험/반성적 관찰)의 두 기준으로 학습유형을 구분한다.","id":"simri-m123"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)의 정보지각방식 중 '추상적으로 개념화하는 유형(Learning by thinking)'의 특징은?","opts":["논리와 아이디어를 사용해 학습하고 문제를 해결하며 체계적 계획과 정확·논리적 사고를 함","직접 경험하고 깨달은 일을 통해 학습하는 것을 선호하고 대인관계를 중시함","실제로 문제를 해결하고자 실험을 시도함","판단을 유보하고 주의 깊게 관찰함"],"a":0,"exp":"추상적 개념화 유형은 논리와 아이디어로 학습·문제해결하며 체계적 계획과 정확·논리적 사고를 한다. ②는 구체적 경험, ③은 활동적 실험, ④는 반성적 관찰이다.","id":"simri-m124"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)의 '발산형 학습자(확산자)'에 대한 설명으로 옳은 것은?","opts":["구체적 경험을 통해 지각하고 반성적으로 관찰하는 유형으로, 상상력이 뛰어나고 한 상황을 여러 관점에서 파악 가능하며 아이디어가 많음","추상적으로 개념화하여 지각하고 반성적으로 관찰하는 유형","추상적으로 개념화하여 지각하고 활동적으로 실험하는 유형","구체적 경험을 통해 지각하고 활동적으로 실험하는 유형"],"a":0,"exp":"발산형(확산자)은 구체적 경험+반성적 관찰 유형이다. ②는 동화형(융합자), ③은 수렴형(수렴자), ④는 조절형(적응자)이다.","id":"simri-m125"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)의 '동화형 학습자(융합자)'의 특징으로 옳은 것은?","opts":["논리적 사고, 귀납적 추리에 능숙하고 넓은 범위의 아이디어를 종합하며 다각적으로 이해할 수 있어 이론적으로 모형을 만드는 것을 잘함","아이디어와 이론을 응용하는 능력과 의사결정, 문제해결 능력이 우수함","계획을 잘 실행하고 새로운 경험을 추구하며 새로운 상황에 잘 적응함","상상력이 뛰어나고 한 상황을 여러 관점에서 파악 가능함"],"a":0,"exp":"동화형(융합자)은 추상적 개념화+반성적 관찰 유형으로 논리적 사고와 귀납적 추리에 능숙하다. ②는 수렴형, ③은 조절형, ④는 발산형이다.","id":"simri-m126"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)의 '수렴형 학습자(수렴자)'의 특징으로 옳은 것은?","opts":["아이디어와 이론을 응용하는 능력과 의사결정, 문제해결 능력이 우수하며 기술적·과학적 과제에 강함","문제해결 시 다른 사람에게 의존함","넓은 범위의 아이디어를 종합하여 이론적 모형을 만드는 것을 잘함","상상력이 뛰어나며 아이디어가 많음"],"a":0,"exp":"수렴형은 추상적 개념화+활동적 실험 유형으로 아이디어·이론 응용, 의사결정, 문제해결 능력이 우수하고 기술적·과학적 과제에 강하다.","id":"simri-m127"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브 학습유형","q":"콜브(Kolb)의 '조절형 학습자(적응자)'의 특징으로 옳은 것은?","opts":["계획을 잘 실행하고 새로운 경험을 추구하며 새로운 상황에 잘 적응하고, 문제해결 시 다른 사람에게 의존함","이론적으로 모형을 만드는 것을 잘함","기술적·과학적 과제에 강함","한 상황을 여러 관점에서 파악 가능함"],"a":0,"exp":"조절형(적응자)은 구체적 경험+활동적 실험 유형으로 계획 실행에 능하고 새로운 경험을 추구하며 문제해결 시 타인에게 의존한다.","id":"simri-m128"},{"ch":"CH02 학습자의 인지적 특성","t":"정보처리방식","q":"'심층적 정보처리방식'의 학습에 대한 관점으로 옳은 것은?","opts":["학습활동을 기저에 깔린 개념이나 의미를 이해하는 방법으로 바라봄","학습을 단순히 기억하는 것으로 접근하며 깊은 이해를 시도하지 않음","학습을 외부의 보상을 얻기 위한 수단으로 봄","학습을 반응과 자극의 연합으로 봄"],"a":0,"exp":"심층적 정보처리방식은 학습활동을 기저에 깔린 개념이나 의미를 이해하는 방법으로 바라본다. ②는 피상적 정보처리방식이다.","id":"simri-m129"},{"ch":"CH02 학습자의 인지적 특성","t":"정보처리방식","q":"'피상적 정보처리방식' 학습자의 특성으로 옳은 것은?","opts":["학습 그 자체보다는 성적이나 외부 요소에 동기화되어 있음","학습 그 자체를 위해 학습하며 어떻게 평가될지에 대한 걱정을 덜 하는 편임","기저 개념과 의미를 이해하려 함","메타인지 전략을 적극 활용함"],"a":0,"exp":"피상적 정보처리방식 학습자는 학습 그 자체보다는 성적이나 외부 요소에 동기화되어 있다. ②는 심층적 정보처리방식 학습자이다.","id":"simri-m130"},{"ch":"CH03 학습자의 정의적 특성","t":"내재적/외재적 동기","q":"내재적 동기의 개념으로 옳은 것은?","opts":["외부의 보상과 상관없이 주어진 과제를 하거나 활동하는 그 자체가 보상이 되는 것","외부로부터 보상을 얻으려는 것과 관련된 동기","사회적 압력, 보상, 처벌과 같은 환경적 요인에 의한 동기화","과제와 상관없이 외부의 보상을 추구하는 것"],"a":0,"exp":"내재적 동기는 외부 보상과 상관없이 과제나 활동 그 자체가 보상이 되는 동기이다. ②③④는 외재적 동기의 개념·특징이다.","id":"simri-m131"},{"ch":"CH03 학습자의 정의적 특성","t":"내재적/외재적 동기","q":"내재적 동기의 특징으로 옳은 것은?","opts":["개인의 욕구, 흥미, 호기심, 즐거움과 같은 심리적 요인에 의한 동기화","사회적 압력, 보상, 처벌과 같은 환경적 요인에 의한 동기화","과제와 상관없이 외부의 보상을 추구","타인과의 비교에서 유능하다고 평가받으려 함"],"a":0,"exp":"내재적 동기의 특징은 ①개인의 욕구·흥미·호기심·즐거움과 같은 심리적 요인에 의한 동기화 ②과제를 하거나 활동하는 그 자체가 보상이다.","id":"simri-m132"},{"ch":"CH03 학습자의 정의적 특성","t":"내재적 동기 증진","q":"내재적 동기의 증진방안으로 옳지 않은 것은?","opts":["보상이나 감독과 같은 외적 제약을 지속적으로 강화하여 사용함","수행할 과제의 종류나 수준을 선택할 수 있도록 복수의 유형이나 수준을 제시하거나 과제 수행 절차나 순서에 자유를 줌","실패에 대한 노력귀인을 권장함","다른 사람과의 비교보다 수행의 질적 측면에 초점을 두고 구체적·즉각적인 피드백을 줌"],"a":0,"exp":"내재적 동기 증진방안은 '외적 제약 사용의 최소화 — 보상이나 감독과 같은 외적 제약을 최소한으로 사용하고 사용이 필요한 경우에는 점진적으로 사용을 줄임'이므로 ①은 반대이다.","id":"simri-m133"},{"ch":"CH03 학습자의 정의적 특성","t":"내재적 동기 증진","q":"내재적 동기 증진방안 중 '실패에 대한 노력귀인 권장'의 근거로 옳은 것은?","opts":["실패에 대한 노력귀인은 좀 더 노력하면 좋은 결과를 얻을 수 있다는 기대를 상승시키고 수행에 대한 내재적 동기를 높일 수 있음","실패에 대한 능력귀인이 자기효능감을 높이기 때문","외적 보상이 내재적 동기를 강화하기 때문","비교평가가 경쟁심을 유발하기 때문"],"a":0,"exp":"노력귀인은 좀 더 노력하면 좋은 결과를 얻을 수 있다는 기대를 상승시키고 내재적 동기를 높인다.","id":"simri-m134"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우 욕구위계이론의 특징으로 옳지 않은 것은?","opts":["행동주의적 접근으로 외적 강화의 역할을 강조한다","인본주의적 접근으로 개인의 욕구나 내적 상태를 강조한다","자기실현은 개인의 잠재적 능력을 실현하려는 심리적 욕구이자 삶의 궁극적인 목표이다","욕구의 위계성 — 자기실현의 궁극적인 목표를 달성하려는 욕구는 그것에 선행하는 기본적인 욕구로부터 위계적으로 발달한다"],"a":0,"exp":"매슬로우 이론의 특징은 인본주의적 접근, 자기실현, 욕구의 위계성이다. ①의 행동주의적 접근은 옳지 않다.","id":"simri-m135"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우의 결핍욕구 4가지에 해당하지 않는 것은?","opts":["심미적 욕구","생리적 욕구","안전의 욕구","자존(자아존중감)의 욕구"],"a":0,"exp":"결핍욕구는 생리적 욕구, 안전의 욕구, 소속의 욕구, 자존(자아존중감)의 욕구 4가지이다. 심미적 욕구는 성장욕구에 속한다.","id":"simri-m136"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우의 '자존(자아존중감)의 욕구'의 개념으로 옳은 것은?","opts":["타인에게 가치 있는 존재가 되고 존중받고자 하는 욕구로 타인의 인정을 추구하는 욕구","사회적 존재로서 친밀한 대인관계를 맺고 애정과 소속감을 느끼고자 하는 욕구","신체의 위협이나 위험, 불안, 공포, 박탈로부터 벗어나고자 하는 욕구","자신이 타고난 능력 또는 성장 잠재력을 실행하려는 욕구"],"a":0,"exp":"자존의 욕구는 타인에게 가치 있는 존재가 되고 존중받고자 하는 욕구이다. ②는 소속의 욕구, ③은 안전의 욕구, ④는 자아실현의 욕구이다.","id":"simri-m137"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우의 성장욕구 3가지로 옳은 것은?","opts":["지적 욕구, 심미적 욕구, 자아실현의 욕구","생리적 욕구, 안전의 욕구, 소속의 욕구","유능성 욕구, 자율성 욕구, 관계성 욕구","달성가치, 내적가치, 효용가치"],"a":0,"exp":"성장욕구는 지적 욕구(새로운 것을 알고 이해하고자 하는 욕구), 심미적 욕구(아름다움·질서·조화·완성 등을 추구하는 욕구), 자아실현의 욕구(타고난 능력 또는 성장 잠재력을 실행하려는 욕구)이다.","id":"simri-m138"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우 이론의 교육적 시사점으로 제시된 것은?","opts":["학생의 결핍욕구에 대한 교사의 관심과 안전하고 따뜻한 교실 분위기 조성","외적 보상을 적극적으로 활용한 동기유발","경쟁적 평가를 통한 자존감 향상","성장욕구부터 우선적으로 충족시키기"],"a":0,"exp":"매슬로우 이론의 교육적 시사점은 ①학생의 결핍욕구에 대한 교사의 관심 ②안전하고 따뜻한 교실 분위기 조성이다.","id":"simri-m139"},{"ch":"CH03 학습자의 정의적 특성","t":"로저스","q":"로저스(Rogers) 이론의 가정으로 옳은 것은?","opts":["자아실현 욕구란 타고난 잠재력을 계발하기 위한 지속적인 노력의 욕구로, 이는 선천적인 것이라고 간주함","자아실현 욕구는 환경적 강화를 통해 후천적으로 형성된다","인간의 행동은 무의식적 충동에 의해 결정된다","학습은 관찰 가능한 행동의 변화이다"],"a":0,"exp":"로저스 이론의 가정은 '자아실현 욕구란 타고난 잠재력을 계발하기 위한 지속적인 노력의 욕구로, 이는 선천적인 것이라고 간주함'이다.","id":"simri-m140"},{"ch":"CH03 학습자의 정의적 특성","t":"로저스","q":"로저스(Rogers)의 '실현경향성'의 개념으로 옳은 것은?","opts":["성장을 위해서는 '투쟁과 고통'이 수반되며 이러한 고통을 이겨나가는 것","환경에 대하여 어떤 행동을 취할 것인지 스스로 결정하는 것","타고난 능력을 실행하려는 욕구","자신의 인지과정에 대한 자각과 통제"],"a":0,"exp":"실현경향성은 '성장을 위해서는 투쟁과 고통이 수반되며 이러한 고통을 이겨나가는 것'이다.","id":"simri-m141"},{"ch":"CH03 학습자의 정의적 특성","t":"로저스","q":"로저스(Rogers)의 관점에서 개인의 실현경향 과정에 있어 주요한 요소는?","opts":["타인과의 상호작용 — 타인의 무조건적이고 긍정적인 관심은 개인이 충분히 기능하는 인간으로 성장할 수 있게 함","외적 보상과 처벌의 체계적 제공","결핍욕구의 위계적 충족","도덕적 딜레마를 통한 인지갈등"],"a":0,"exp":"실현경향 과정의 주요 요소는 타인과의 상호작용이며, 타인의 무조건적이고 긍정적인 관심이 '충분히 기능하는 인간(fully functioning individual)'으로 성장하게 한다.","id":"simri-m142"},{"ch":"CH03 학습자의 정의적 특성","t":"자기장애전략","q":"코빙톤(Covington)이 주장한 자기장애전략의 개념으로 옳은 것은?","opts":["실패가 예견되는 상황에서 자기가치를 보호하기 위해 수행에 방해가 될 만한 방해물이나 핑계거리를 만들어 두는 행동","통제가 어려웠던 이전 경험에 근거하여 자신의 어떤 노력도 실패할 것이라 생각하는 것","자신의 능력을 증명하려는 목표를 추구하는 것","타인과의 비교에서 유능하다고 평가받으려는 목표"],"a":0,"exp":"자기장애전략은 '실패가 예견되는 상황에서 자기가치를 보호하기 위해 수행에 방해가 될 만한 방해물이나 핑계거리를 만들어 두는 행동'이다. ②는 학습된 무기력이다.","id":"simri-m143"},{"ch":"CH03 학습자의 정의적 특성","t":"자기장애전략","q":"'언어적 자기장애전략'에 대한 설명으로 옳은 것은?","opts":["실제 수행에 영향을 미칠 수 있는 부적응적인 행동을 하지 않으나 변명거리를 찾으며, 실제로 노력했더라도 노력하지 않았음을 강조하여 실패 상황에서 타인이 자신을 무능하다고 평가하는 것을 피하고 자기가치를 보호함","실제 수행에 방해가 될 만한 부적응적 행동을 함으로써 저조한 수행결과를 방해행동으로 귀인함","실패의 원인을 학습방법이나 학습전략으로 귀인함","자신의 기대 자체를 수정하고 새로운 길로 안내함"],"a":0,"exp":"언어적 자기장애전략은 실제 부적응적 행동은 하지 않으나 변명거리를 찾는 것이다. ②는 행동적 자기장애전략이다.","id":"simri-m144"},{"ch":"CH03 학습자의 정의적 특성","t":"자기장애전략","q":"'행동적 자기장애전략'이 언어적 자기장애전략보다 더 문제가 되는 이유로 옳은 것은?","opts":["실제로 방해가 될 만한 행동을 하는 것이므로 언어적 자기장애전략에 비해 학업수행과 동기에 부정적인 영향을 미치기 때문","변명거리를 더 많이 만들어내기 때문","타인의 평가를 더 많이 의식하기 때문","자기가치를 보호하지 못하기 때문"],"a":0,"exp":"행동적 자기장애전략은 실제로 방해가 될 만한 행동을 하므로 언어적 자기장애전략에 비해 학업수행과 동기에 부정적인 영향을 미친다.","id":"simri-m145"},{"ch":"CH03 학습자의 정의적 특성","t":"자기장애전략","q":"자기장애전략 이론의 교육적 시사점으로 옳지 않은 것은?","opts":["능력은 타고난 고정된 특성임을 인식시켜 무리한 기대를 낮춘다","능력은 고정된 것이 아니라 노력에 의해 향상될 수 있는 것임을 강조한다","능력은 유동적이며 능력을 신장시키는 데 있어 노력의 역할이 크다는 믿음을 갖게 한다","도움을 요청하고 도움을 줄 것을 권장한다"],"a":0,"exp":"시사점은 ②③④이며, 능력이 고정되어 있다는 ①은 정반대의 서술이다.","id":"simri-m146"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"데시(Deci)와 라이언(Ryan)이 주장한 자기결정성의 개념으로 옳은 것은?","opts":["환경에 대하여 어떤 행동을 취할 것인지 스스로 결정하는 것으로, 개인의 의지를 사용하는 과정","성공이나 실패의 지각된 원인을 설명하는 과정","특정한 목표를 달성해낼 수 있다는 능력에 대한 신념","자신의 인지과정에 대한 자각과 통제"],"a":0,"exp":"자기결정성은 '환경에 대하여 어떤 행동을 취할 것인지 스스로 결정하는 것. 개인의 의지를 사용하는 과정'이다.","id":"simri-m147"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"자기결정성 이론을 구성하는 3가지 심리욕구로 옳은 것은?","opts":["유능성 욕구, 자율성 욕구, 관계성 욕구","생리적 욕구, 안전의 욕구, 소속의 욕구","지적 욕구, 심미적 욕구, 자아실현의 욕구","달성가치, 내적가치, 효용가치"],"a":0,"exp":"자기결정성 이론의 3가지 심리욕구는 유능성 욕구, 자율성 욕구, 관계성 욕구이다.","id":"simri-m148"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"자기결정성 이론의 '자율성 욕구'에 대한 설명으로 옳은 것은?","opts":["자기결정성 이론의 핵심으로, 스스로 결정하고 행동하려 하며 외적 보상이나 압력보다 자신이 원하는 것에 따라 행동하려는 욕구","자신이 능력 있는 사람이라는 믿음을 갖고 싶은 욕구","다른 사람들과 좋은 관계를 맺고자 하는 욕구","타고난 잠재력을 계발하려는 욕구"],"a":0,"exp":"자율성 욕구는 자기결정성 이론의 핵심으로 스스로 결정하고 행동하려는 욕구이다. ②는 유능성 욕구, ③은 관계성 욕구이다.","id":"simri-m149"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"학교 상황에서 '자율성 욕구'를 높일 수 있는 전략으로 옳은 것은?","opts":["학생들이 스스로 교실의 규칙과 절차 만들기, 스스로 학습목표 설정, 학생의 참여 수준이 높은 수업","도전적 과제 제공, 노력귀인, 구체적·즉각적 피드백","인정과 믿음, 학생의 흥미와 복지에 대한 관심, 협동학습","외적 보상의 체계적 제공"],"a":0,"exp":"자율성 욕구 전략은 학생 스스로 교실 규칙·절차 만들기, 스스로 학습목표 설정, 학생 참여 수준이 높은 수업이다. ②는 유능성, ③은 관계성 욕구 전략이다.","id":"simri-m150"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"'유능성 욕구'를 높일 수 있는 전략으로 옳은 것은?","opts":["도전적 과제 제공, 노력귀인, 칭찬과 비판, 구체적·즉각적 피드백, 도움 제공","학생들이 스스로 교실의 규칙과 절차 만들기","협동학습과 긍정적 상호작용","외적 보상 최소화"],"a":0,"exp":"유능성 욕구 전략은 도전적 과제 제공, 노력귀인, 칭찬과 비판, 구체적·즉각적 피드백, 도움 제공이다.","id":"simri-m151"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성 이론","q":"'관계성 욕구'를 높일 수 있는 전략으로 옳은 것은?","opts":["인정과 믿음, 학생의 흥미와 복지에 대한 관심, 협동학습과 긍정적 상호작용","도전적 과제 제공과 노력귀인","스스로 학습목표 설정하기","외적 보상의 점진적 감소"],"a":0,"exp":"관계성 욕구 전략은 인정과 믿음, 학생의 흥미와 복지에 대한 관심, 협동학습과 긍정적 상호작용이다.","id":"simri-m152"},{"ch":"CH03 학습자의 정의적 특성","t":"유기적 통합이론","q":"유기적 통합이론에서 동기유형을 구분하는 기준으로 옳은 것은?","opts":["개인이 수행해야 하는 행동의 가치가 내재화된 정도","반응속도와 반응오류","전념과 탐색의 유무","기대와 가치의 조합"],"a":0,"exp":"유기적 통합이론의 동기유형 구분 기준은 '개인이 수행해야 하는 행동의 가치가 내재화된 정도'이다.","id":"simri-m153"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치 이론","q":"에클스(Eccles)와 위그필드(Wigfield)의 기대×가치이론에서 '기대에 영향을 미치는 요소'가 아닌 것은?","opts":["효용가치","과제특수적 신념","지각된 과제난이도","자기도식"],"a":0,"exp":"기대에 영향을 미치는 요소는 과제특수적 신념, 지각된 과제난이도, 개인의 목표, 자기도식, 정서적 기억이다. 효용가치는 '가치'에 영향을 미치는 요소이다.","id":"simri-m154"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치 이론","q":"기대×가치이론에서 '과제특수적 신념'의 개념으로 옳은 것은?","opts":["개인이 특정 과제 수행을 위해 필요한 능력을 얼마나 가지고 있다고 믿는가","해당 과제의 난이도에 대한 주관적 판단","스스로의 능력에 대한 자기개념으로 개인적 정체성과 사회적 정체성을 모두 포함하는 개념","이전 경험에 대한 해석을 통해 얻게 되는 정서적인 반응 및 기억"],"a":0,"exp":"과제특수적 신념은 '개인이 특정 과제 수행을 위해 필요한 능력을 얼마나 가지고 있다고 믿는가'이다. ②는 지각된 과제난이도, ③은 자기도식, ④는 정서적 기억이다.","id":"simri-m155"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치 이론","q":"기대×가치이론의 '가치에 영향을 미치는 요소' 중 '효용가치'의 개념으로 옳은 것은?","opts":["과제가 실용적이며 미래의 목표를 달성하는 데 얼마나 도움이 되는지에 관한 가치","과제를 잘 수행하는 것이 나의 삶에서 가지는 가치","과제를 수행하는 것이 나에게 즐거움을 주는지에 대한 가치","과제에 참여함으로써 지불해야 하는 시간, 노력, 감정 등"],"a":0,"exp":"효용가치는 과제가 실용적이며 미래의 목표 달성에 얼마나 도움이 되는지에 관한 가치이다. ②는 달성가치, ③은 내적가치(흥미), ④는 비용이다.","id":"simri-m156"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치 이론","q":"기대×가치이론의 '달성가치'에 대한 설명으로 옳은 것은?","opts":["과제를 잘 수행하는 것이 나의 삶에서 가지는 가치","과제를 수행하는 것이 나에게 즐거움을 주는지에 대한 가치","미래의 목표를 달성하는 데 얼마나 도움이 되는지에 관한 가치","과제에 참여함으로써 지불해야 하는 시간, 노력, 감정"],"a":0,"exp":"달성가치는 '과제를 잘 수행하는 것이 나의 삶에서 가지는 가치'이다.","id":"simri-m157"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치 이론","q":"기대×가치이론의 관점에서 동기를 높이는 방법으로 제시되지 않은 것은?","opts":["학생 간 성취 결과를 비교 공개하여 경쟁을 유도하기","피드백 제공 — 능력에 대한 합리적 인식 도움, 발전에 대한 긍정적 인식","교사의 가치부여 — 교사가 학습 또는 과제에 어떤 가치를 부여하고 있는지 안내","비용 줄이기 — 노력비용을 줄일 수 있는 학습활동 제시(쓸모없는 활동에 참여시키지 않기)"],"a":0,"exp":"제시된 방법은 ①피드백 제공 ②도전적, 적합한 수준의 난이도 과제 제시 ③교사의 가치부여 ④비용 줄이기이다. 경쟁 유도는 제시되지 않았다.","id":"simri-m158"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인이론","q":"와이너(Weiner)가 주장한 '귀인'의 개념으로 옳은 것은?","opts":["결과와 관련된 '지각된' 원인으로, 성공이나 실패의 실제 원인이 아니라 학습자가 설명하는 원인","성공이나 실패의 객관적이고 실제적인 원인","목표를 달성해낼 수 있다는 능력에 대한 신념","자신의 인지과정에 대한 자각과 통제"],"a":0,"exp":"귀인은 '결과와 관련된 지각된 원인으로, 성공이나 실패의 실제 원인이 아니라 학습자가 설명하는 원인'이며, 학습자의 정서와 기대에 영향을 미치고 결과적으로 실제 수행에도 영향을 준다.","id":"simri-m159"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인이론","q":"와이너(Weiner)의 지각된 원인의 인과차원 3가지로 옳은 것은?","opts":["원인소재, 안정성, 통제가능성","능력, 노력, 운","내적 요인, 외적 요인, 중립 요인","기대, 가치, 비용"],"a":0,"exp":"인과차원 3가지는 ①원인소재(성공과 실패의 원인을 자신의 내부 혹은 외부에 두는가) ②안정성(시간의 경과나 과제에 따라서 변하는가 변하지 않는가) ③통제가능성(자신의 의지에 따라서 통제될 수 있는가 없는가)이다.","id":"simri-m160"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인이론","q":"와이너의 인과차원 중 '안정성'에 대한 설명으로 옳은 것은?","opts":["성공과 실패의 원인이 시간의 경과나 과제에 따라서 변하는가 변하지 않는가","성공과 실패의 원인을 자신의 내부 혹은 외부에 두는가","성공과 실패의 원인이 자신의 의지에 따라서 통제될 수 있는가 없는가","성공과 실패의 원인이 타인에게 알려지는가 아닌가"],"a":0,"exp":"안정성은 '성공과 실패의 원인이 시간의 경과나 과제에 따라서 변하는가 변하지 않는가'의 차원이다.","id":"simri-m161"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인이론","q":"귀인경향성의 영향으로 옳은 것은?","opts":["학습자는 자신의 성공이나 실패의 원인을 귀인할 때 늘 비슷한 방식으로 반응하는 경향이 있으며, 이는 앞으로 선택하는 과제의 종류, 과제의 수행 정도, 과제 지속력에 영향을 미침","귀인은 일회적이므로 이후 과제 선택에는 영향을 주지 않음","귀인경향성은 학습자의 정서에만 영향을 미침","귀인경향성은 교사의 효능감에만 영향을 미침"],"a":0,"exp":"귀인경향성은 늘 비슷한 방식으로 반응하는 경향이며, 앞으로 선택하는 과제의 종류·수행 정도·과제 지속력에 영향을 미친다.","id":"simri-m162"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인이론","q":"실패를 누적적으로 경험한 학습자의 귀인경향성의 특징으로 옳은 것은?","opts":["학업의 실패를 내적 요인, 즉 자신의 무능력이나 노력의 부족으로 귀인하는 경향이 높음","학업의 실패를 외적 요인인 과제 난이도로만 귀인함","실패의 원인을 통제 가능한 전략 부족으로 귀인하여 곧 회복함","실패를 운으로 귀인하여 정서적 영향을 받지 않음"],"a":0,"exp":"실패를 누적적으로 경험한 학습자는 학업의 실패를 내적 요인(자신의 무능력이나 노력의 부족)으로 귀인하는 경향이 높다.","id":"simri-m163"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인훈련","q":"귀인훈련의 필요성으로 제시된 것은?","opts":["바람직한 귀인유형은 학습자의 동기를 향상시키며 결과 또한 향상시키므로 바람직하지 않은 귀인을 바람직한 귀인유형으로 바꾸어야 함","귀인은 실제 원인이므로 정확히 규명해야 함","귀인은 학습자의 능력을 객관적으로 측정하는 수단이므로 필요함","귀인은 교사의 효능감을 높이는 수단이므로 필요함"],"a":0,"exp":"귀인훈련의 필요성은 '바람직한 귀인유형은 학습자의 동기를 향상시키며 결과 또한 향상시키므로 바람직하지 않은 귀인을 바람직한 귀인유형으로 바꾸어야 함'이다.","id":"simri-m164"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인훈련","q":"귀인훈련 3단계의 순서로 옳은 것은?","opts":["노력귀인 → 전략귀인 → 포기귀인","전략귀인 → 노력귀인 → 능력귀인","능력귀인 → 노력귀인 → 전략귀인","포기귀인 → 전략귀인 → 노력귀인"],"a":0,"exp":"귀인훈련 3단계는 1단계 노력귀인 → 2단계 전략귀인 활용 → 3단계 포기귀인 유도 순이다.","id":"simri-m165"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인훈련","q":"귀인훈련 2단계 '전략귀인'에 대한 설명으로 옳은 것은?","opts":["실패의 원인을 학습방법이나 학습전략으로 귀인하도록 하고, 학생의 학습방법이나 습관을 점검하고 바꾸어 보도록 조언함","실패의 원인을 노력 부족으로 귀인하도록 함","학습자의 기대 자체를 수정하고 새로운 관심이나 길로 안내함","실패의 원인을 능력 부족으로 귀인하도록 함"],"a":0,"exp":"2단계 전략귀인은 실패의 원인을 학습방법이나 학습전략으로 귀인하도록 하고 학습방법·습관을 점검·수정하도록 조언하는 단계이다. ③은 3단계 포기귀인이다.","id":"simri-m166"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인훈련","q":"귀인훈련 3단계 '포기귀인 유도'가 적용되는 상황으로 옳은 것은?","opts":["충분히 노력하였고 다양한 학습방법과 전략을 썼음에도 실패했을 경우 학습자의 기대 자체를 수정하고 새로운 관심이나 길로 안내함","학습 초기에 학습자가 노력을 하지 않을 경우","학습자가 능력귀인을 할 경우","학습자가 성공을 경험한 직후"],"a":0,"exp":"3단계 포기귀인은 충분한 노력과 다양한 학습방법·전략에도 실패했을 경우, 학습자의 기대 자체를 수정하고 새로운 관심이나 길로 안내하는 단계이다.","id":"simri-m167"},{"ch":"CH03 학습자의 정의적 특성","t":"자기효능감","q":"자기효능감의 개념으로 옳은 것은?","opts":["특정한 목표를 달성해낼 수 있다는 능력에 대한 신념","자신이나 타인의 감정을 인지하고 조절하는 능력","환경에 대하여 어떤 행동을 취할 것인지 스스로 결정하는 것","성공이나 실패의 지각된 원인"],"a":0,"exp":"자기효능감은 '특정한 목표를 달성해낼 수 있다는 능력에 대한 신념'이다.","id":"simri-m168"},{"ch":"CH03 학습자의 정의적 특성","t":"자기효능감","q":"자기효능감의 정보원 4가지로 옳은 것은?","opts":["과거 경험, 대리 경험, 언어적 설득, 심리적 상태","유능성, 자율성, 관계성, 자기결정성","원인소재, 안정성, 통제가능성, 예측가능성","달성가치, 내적가치, 효용가치, 비용"],"a":0,"exp":"자기효능감의 정보원은 ①과거 경험 ②대리 경험 ③언어적 설득 ④심리적 상태이다.","id":"simri-m169"},{"ch":"CH03 학습자의 정의적 특성","t":"자기효능감","q":"자기효능감을 증진시키는 방법 중 '성공경험 제공'에 대한 설명으로 옳은 것은?","opts":["학생의 능력 수준보다 약간 낮은 과제를 제시하여 성공경험을 갖게 함","자신과 비슷한 타인의 성취를 관찰하는 모델학습의 기회를 제공함","교사나 부모의 긍정적인 평가 피드백을 제공함","실패의 원인을 능력보다 노력으로 귀인하도록 함"],"a":0,"exp":"성공경험 제공은 학생의 능력 수준보다 약간 낮은 과제를 제시하여 성공경험을 갖게 하는 것이다. ②는 타인의 성공 관찰, ③은 권위자의 설득, ④는 실패의 노력귀인이다.","id":"simri-m170"},{"ch":"CH03 학습자의 정의적 특성","t":"교사효능감","q":"교사효능감의 개념으로 옳은 것은?","opts":["교사들이 자신의 교수활동 관련 능력에 대해 지니고 있는 신념으로, 주어진 교육목표를 이루기 위해 요구되는 활동들을 계획·조직·실행하는 데 있어 필요한 자신의 능력에 대한 교사 개인의 신념","학생이 목표를 달성할 수 있다는 능력에 대한 신념","교사가 학생의 능력을 평가하는 기준","학교 조직 전체의 성과에 대한 기대"],"a":0,"exp":"교사효능감은 교사들이 자신의 교수활동 관련 능력에 대해 지니고 있는 신념으로, 교육목표 달성에 필요한 활동을 계획·조직·실행하는 능력에 대한 교사 개인의 신념이다.","id":"simri-m171"},{"ch":"CH03 학습자의 정의적 특성","t":"교사효능감","q":"교사효능감의 영향으로 옳은 것은?","opts":["교육성과에 영향을 미치는 중요 요인으로, 수업 전·중·후의 교사활동에 영향을 미쳐 학생의 학업성취도에까지 영향을 미침","교사의 직무만족도에만 영향을 미침","학생의 정서에만 영향을 미치고 성취도와는 무관함","학교 행정 조직 구조에만 영향을 미침"],"a":0,"exp":"교사효능감은 교육성과에 영향을 미치는 중요 요인으로, 수업 전·중·후의 교사활동에 영향을 미쳐 학생의 학업성취도에까지 영향을 미친다.","id":"simri-m172"},{"ch":"CH03 학습자의 정의적 특성","t":"교사효능감","q":"교사효능감을 높이는 방법으로 제시되지 않은 것은?","opts":["교사 개인별 성과급 확대","성공적 수행 — 변화를 위한 일을 교사들이 함께 성공적으로 수행했을 때","대리경험 — 다른 성공적인 학교로부터 학습할 때","사회적 설득 — 교육지원청으로부터 변화에 대한 격려를 받았을 때"],"a":0,"exp":"교사효능감을 높이는 방법은 ①성공적 수행 ②대리경험 ③사회적 설득이다. 성과급 확대는 제시되지 않았다.","id":"simri-m173"},{"ch":"CH03 학습자의 정의적 특성","t":"드웩 능력신념","q":"드웩(Dweck)의 '고정적(실체적)·총체적 신념'을 가진 학생의 특징으로 옳지 않은 것은?","opts":["부족함을 학습의 기회로 인식하고 자신의 부족함을 인정하며 직면한다","지능은 고정되어 있으며 능력은 안정적이고 통제 불가능한 특성이라고 본다","학습을 희생하더라도 똑똑해 보이고자 하는 수행목표를 지향한다","피상적·기계적인 학습전략을 사용한다"],"a":0,"exp":"①은 증가적(향상적·성장) 신념을 가진 학생의 특징이다. 고정적 신념을 가진 학생은 부족함에 회피적·방어적으로 대응하며 자기손상화 전략을 사용한다.","id":"simri-m174"},{"ch":"CH03 학습자의 정의적 특성","t":"드웩 능력신념","q":"드웩(Dweck)의 '증가적(향상적·성장) 신념'을 가진 학생의 특징으로 옳은 것은?","opts":["지능은 성장하며 능력은 비안정적이고 통제 가능하다고 보고, 숙달목표를 지향하며 심층적 인지전략과 메타인지전략을 사용함","능력은 안정적이고 통제 불가능하다고 봄","수행목표를 지향하며 피상적·기계적인 학습전략을 사용함","부족함에 대해 회피적·방어적으로 대응함"],"a":0,"exp":"증가적 신념은 지능이 성장하며 능력은 비안정적·통제 가능하다고 보고, 힘들거나 위험 소지가 있어도 새로운 것을 배우고자 하는 숙달목표를 지향하며 심층적 인지전략·메타인지전략을 사용한다.","id":"simri-m175"},{"ch":"CH03 학습자의 정의적 특성","t":"학습된 무기력","q":"학습된 무기력(learned helplessness)의 개념으로 옳은 것은?","opts":["통제가 어려웠던 이전 경험에 근거하여 자신의 어떤 노력도 실패할 것이라 생각하는 것으로, 개인이 과제를 달성할 능력이 없고 환경을 거의 통제할 수 없다고 생각하는 개인을 무력화시키는 신념","실패가 예견되는 상황에서 핑계거리를 만들어 두는 행동","자신의 능력을 증명하려는 목표","타인과 비교하여 유능하다고 평가받으려는 목표"],"a":0,"exp":"학습된 무기력은 통제가 어려웠던 이전 경험에 근거하여 자신의 어떤 노력도 실패할 것이라 생각하는, 개인을 무력화시키는 신념이다. ②는 자기장애전략이다.","id":"simri-m176"},{"ch":"CH03 학습자의 정의적 특성","t":"학습된 무기력","q":"학습된 무기력의 영향 중 '인지적 결손'에 해당하는 것은?","opts":["자신의 반응이 실제로 효과가 있다는 것을 인지하지 못함","자발적으로 반응(학습, 노력)하려는 동기를 저하시킴","우울증이나 불안, 자존감의 저하와 같은 정서적 동요를 경험함","피상적인 학습전략을 사용함"],"a":0,"exp":"학습된 무기력의 인지적 결손은 '자신의 반응이 실제로 효과가 있다는 것을 인지하지 못함'이다. ②는 동기적 결손, ③은 정서적 결손이다.","id":"simri-m177"},{"ch":"CH03 학습자의 정의적 특성","t":"학습된 무기력","q":"학습자가 학습된 무기력에서 벗어나도록 돕는 방안으로 제시되지 않은 것은?","opts":["반복적으로 어려운 과제를 부과하여 인내심을 기르기","실패로부터 과잉보호 금지","통제감을 경험할 수 있는 환경 제공","구체적인 피드백과 귀인 변경"],"a":0,"exp":"제시된 방안은 ①실패로부터 과잉보호 금지 ②통제감을 경험할 수 있는 환경 제공 ③반복적으로 어려운 과제를 부과하지 않기 ④구체적인 피드백 ⑤귀인 변경이다. 따라서 ①은 반대로 서술되어 틀렸다.","id":"simri-m178"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"'숙달목표'의 개념으로 옳은 것은?","opts":["자신의 기준과 자기발전을 위하여 학습하고 숙달하고자 하는 목표로, 역량 향상과 개발에 초점을 둠","자신의 역량과 능력을 증명하려는 목표로, 다른 사람과 비교하여 자신이 어떻게 평가될 것인지에 초점을 둠","과제를 완벽하게 이해하지 못하는 상황을 피하려는 목표","자신이 무능해 보이거나 지는 것을 피하려는 목표"],"a":0,"exp":"숙달목표는 자신의 기준과 자기발전을 위해 학습·숙달하고자 하는 목표로 역량 향상과 개발에 초점을 둔다. ②는 수행목표이다.","id":"simri-m179"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"숙달목표를 가진 학습자의 귀인 특징으로 옳은 것은?","opts":["긍정적·적응적 귀인을 하며 노력, 적절한 전략, 충분한 지식으로 귀인하고 학습결과는 개인의 노력에 결부된다고 봄","부정적·부적응적 귀인을 하며 능력 부족으로 실패를 귀인함","학습결과는 개인의 능력에 따른 것이라고 봄","실패의 원인을 운으로 귀인함"],"a":0,"exp":"숙달목표 학습자는 긍정적·적응적 귀인을 하며 노력·적절한 전략·충분한 지식으로 귀인하고, 학습결과가 개인의 노력에 결부된다고 본다. ②③은 수행목표이다.","id":"simri-m180"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"숙달목표를 가진 학습자의 정서적 특징으로 옳은 것은?","opts":["노력으로 인한 성공은 자부심으로, 노력 부족으로 인한 실패는 죄책감으로 이어지며 학습에 대한 긍정적 태도와 내재적 흥미를 가짐","실패 후의 부정적 정서와 학습에 대한 무관심한 태도를 보임","학습에 대한 외재적 동기가 강함","실패에 대해 정서적 반응을 보이지 않음"],"a":0,"exp":"숙달목표 학습자의 정서는 노력으로 인한 성공→자부심, 노력 부족으로 인한 실패→죄책감, 학습에 대한 긍정적 태도와 내재적 흥미이다. ②③은 수행목표이다.","id":"simri-m181"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"수행목표를 가진 학습자의 행동적 특징으로 옳은 것은?","opts":["쉬운 과제를 선택하고, 새로운 것을 시도하는 것을 주저하며, 낮은 수준의 성취도를 보이고 적응적인 도움행동이 부족함","도전적인 과제를 선택하고 새로운 과제에 개방적·모험적 태도를 보임","높은 수준의 성취도를 보임","적응적인 도움행동을 추구함"],"a":0,"exp":"수행목표 학습자는 쉬운 과제 선택, 새로운 시도 주저, 낮은 성취도, 적응적 도움행동 부족이 특징이다. ②③④는 숙달목표 학습자의 특징이다.","id":"simri-m182"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"숙달목표 학습자의 인지적 특징으로 옳은 것은?","opts":["심층적인 인지처리 전략을 사용하고, 계획·인식·자기점검과 같은 자기조절 전략을 사용함","표면적·기계적인 학습전략을 사용함","외재적 동기에 의해 인지활동을 함","학습을 단순 암기로 접근함"],"a":0,"exp":"숙달목표 학습자는 심층적인 인지처리 전략과 계획·인식·자기점검 같은 자기조절 전략을 사용한다. ②는 수행목표 학습자이다.","id":"simri-m183"},{"ch":"CH03 학습자의 정의적 특성","t":"2×2 목표구조","q":"2×2 목표구조에서 '숙달접근목표'의 특징으로 옳은 것은?","opts":["과제를 이해하고 학습하기 위해 필요한 적절한 도움을 요청하며, 심층적인 인지전략을 사용하고 학습과제에 자신감을 가지고 접근함","오류를 범하는 것을 기피하고 정답을 정확히 맞히는 것에 초점을 둔 완벽주의자적 경향을 보임","피상적인 전략을 사용하고 목표에 이르는 정도까지만 노력을 기울임","방어적이고 실패회피전략을 채택하며 자기효능감이 낮음"],"a":0,"exp":"숙달접근목표는 과제 이해·숙달을 지향하며 적절한 도움을 요청하고 심층적 인지전략을 사용한다. ②는 숙달회피목표, ③은 수행접근목표, ④는 수행회피목표이다.","id":"simri-m184"},{"ch":"CH03 학습자의 정의적 특성","t":"2×2 목표구조","q":"'숙달회피목표'의 개념으로 옳은 것은?","opts":["과제를 완벽하게 이해하지 못하거나 학습하지 못하는 상황을 피하려는 목표","타인과의 비교에서 상대적으로 유능하다고 평가받으려는 목표","자신이 무능해 보이거나 지는 것을 피하려는 목표","과제를 이해하고 숙달하고자 하는 목표"],"a":0,"exp":"숙달회피목표는 과제를 완벽하게 이해하지 못하거나 학습하지 못하는 상황을 피하려는 목표이며, 오류를 기피하고 완벽주의자적 경향을 보인다.","id":"simri-m185"},{"ch":"CH03 학습자의 정의적 특성","t":"2×2 목표구조","q":"'수행접근목표'의 특징으로 옳은 것은?","opts":["피상적인 전략을 사용하고 목표에 이르는 정도까지만 노력을 기울이며, 목표를 이룰 수 없다고 생각될 때 노력을 하지 않거나 부정행위를 하는 역기능도 존재함","오류를 범하는 것을 기피하는 완벽주의자적 경향","심층적인 인지전략을 사용하고 자신감을 가지고 접근함","시험과 과제에 대한 불안이 높고 자신감이 부족함"],"a":0,"exp":"수행접근목표는 타인과 비교하여 유능하다고 평가받으려는 목표로, 피상적 전략을 사용하고 목표에 이르는 정도까지만 노력하며 부정행위 등의 역기능도 존재한다.","id":"simri-m186"},{"ch":"CH03 학습자의 정의적 특성","t":"2×2 목표구조","q":"'수행회피목표'에 대한 설명으로 옳지 않은 것은?","opts":["심층적 인지전략을 사용하며 학습과제에 자신감을 가지고 접근한다","자신이 무능해 보이거나 지는 것을 피하려는 목표이다","수행접근목표를 가진 학생이 반복적인 실패 경험을 하면 수행회피목표를 가지게 된다","방어적이고 실패회피전략을 채택하며 자기효능감이 낮고 자신감이 부족하며 시험과 과제에 대한 불안이 높다"],"a":0,"exp":"①은 숙달접근목표의 특징이다. 수행회피목표는 실패를 반복할 경우 학습된 무기력 상태의 학습자가 되기도 한다.","id":"simri-m187"},{"ch":"CH03 학습자의 정의적 특성","t":"흥미발달","q":"레닌거(Renninger)의 흥미발달 4단계 모형의 순서로 옳은 것은?","opts":["상황적 흥미 발동 → 상황적 흥미 유지 → 개인적 흥미 발생 → 개인적 흥미 발달","개인적 흥미 발생 → 개인적 흥미 발달 → 상황적 흥미 발동 → 상황적 흥미 유지","상황적 흥미 유지 → 상황적 흥미 발동 → 개인적 흥미 발달 → 개인적 흥미 발생","개인적 흥미 발달 → 상황적 흥미 발동 → 개인적 흥미 발생 → 상황적 흥미 유지"],"a":0,"exp":"흥미발달 4단계는 상황적 흥미 발동 → 상황적 흥미 유지 → 개인적 흥미 발생 → 개인적 흥미 발달 순으로, 우연히 발생된 상황적 흥미가 유지되며 개인적 흥미가 생겨나고 발달한다.","id":"simri-m188"},{"ch":"CH03 학습자의 정의적 특성","t":"흥미발달","q":"흥미에 대한 교육적 적용으로 제시되지 않은 것은?","opts":["흥미의 발동만 중요하고 유지는 학생 개인의 몫이므로 교사가 개입하지 않는다","학습내용을 학생의 개인적 흥미와 연결 짓는 것이 도움이 됨","가르칠 내용이 정해져 있을 경우, 상황적 흥미를 일으키는 것이 중요함","흥미의 유지를 위해 실생활 문제와의 연결, 공상을 통한 문제해결, 과제의 유용성 강조하기와 같은 방법을 활용할 수 있음"],"a":0,"exp":"'흥미의 발동뿐만 아니라 유지도 매우 중요함'이라고 하였으므로 ①은 틀렸다.","id":"simri-m189"},{"ch":"CH03 학습자의 정의적 특성","t":"정서","q":"정적 정서의 기능으로 옳은 것은?","opts":["총체적·직관적인 문제해결과 관련됨","분석적·세부적인 절차의 정보처리와 연관됨","기피나 회피를 유발함","세부사항에 초점을 두어 실수를 하지 않으려는 순응적 기능"],"a":0,"exp":"정적 정서(행복한, 만족스러운, 흥미 등)의 기능은 '총체적·직관적인 문제해결과 관련됨'이다. ②③④는 부적 정서의 기능이다.","id":"simri-m190"},{"ch":"CH03 학습자의 정의적 특성","t":"정서","q":"부적 정서에 대한 설명으로 옳은 것은?","opts":["'슬픈, 지루한, 불안함' 등이 예이며 분석적·세부적인 절차의 정보처리와 연관되고, 기피나 회피를 유발하지만 세부사항에 초점을 두고 실수를 하지 않으려는 순응적인 기능도 있음","'행복한, 만족스러운, 흥미' 등이 예이며 총체적·직관적 문제해결과 관련됨","학생들의 학습에 항상 긍정적인 영향을 미침","정보처리와는 무관하며 정서적 반응에만 영향을 줌"],"a":0,"exp":"부적 정서는 슬픈·지루한·불안함 등이 예이며, 일반적으로 학습에 부정적 영향을 미치지만 세부사항에 초점을 두고 실수하지 않으려는 순응적 기능도 있다.","id":"simri-m191"},{"ch":"CH03 학습자의 정의적 특성","t":"몰입","q":"칙센트미하이(Csikszentmihalyi)의 '몰입(flow)'의 개념으로 옳은 것은?","opts":["개인이 흥미를 느끼는 과제 수행에 몰입하여 '최적경험'을 하는 심리상태로, 활동이 주는 즐거움 때문에 반복적으로 그 활동을 하려고 하는 행위에 완전히 몰입한 집중상태","외부 보상을 얻기 위해 과제에 집중하는 상태","자신의 인지과정을 점검하고 조절하는 상태","자기 능력에 대한 신념이 높은 상태"],"a":0,"exp":"몰입은 개인이 흥미를 느끼는 과제 수행에 몰입하여 '최적경험'을 하는 심리상태이며, 활동이 주는 즐거움 때문에 반복적으로 그 활동을 하려는 완전 몰입 집중상태이다.","id":"simri-m192"},{"ch":"CH03 학습자의 정의적 특성","t":"몰입","q":"몰입을 위한 조건 2가지로 옳은 것은?","opts":["자신이 가진 능력(기술) 수준과 도전하는 과제 수준의 적절한 조화, 명확하고 근접한 목표와 과제의 진행 상태에 대한 즉각적인 피드백","외적 보상과 처벌의 균형, 경쟁적 분위기 조성","교사의 통제와 학생의 순응","과제 난이도의 최소화와 반복 연습"],"a":0,"exp":"몰입의 조건은 ①자신이 가진 능력(기술) 수준과 도전하는 과제 수준의 적절한 조화 ②명확하고 근접한 목표와 과제의 진행 상태에 대한 즉각적인 피드백이다.","id":"simri-m193"},{"ch":"CH03 학습자의 정의적 특성","t":"몰입","q":"몰입경험의 특징으로 제시되지 않은 것은?","opts":["타인의 평가에 대한 민감한 주의","도전과 기술의 균형","자의식의 상실","시간의 변형된 느낌"],"a":0,"exp":"몰입경험의 특징은 도전과 기술의 균형, 행동과 지각의 일치, 제한된 자극에 대한 주의집중, 자의식의 상실, 행위와 환경에 대한 통제감, 자기목적적 경험, 시간의 변형된 느낌이다. ①은 포함되지 않는다.","id":"simri-m194"},{"ch":"CH04 학습의 이해","t":"행동주의","q":"행동주의 관점에 따를 때 학습의 개념으로 옳은 것은?","opts":["경험의 결과로 나타나는 관찰 가능한 행동의 변화","한 명 또는 여러 명의 모델을 관찰한 결과로 발생한 행동·인지·정서의 변화","기존 도식을 새롭고 복잡한 지적 구조로 통합하는 과정","목표를 세우고 계획·점검·평가하는 일련의 과정"],"a":0,"exp":"행동주의 관점에서의 학습은 '경험의 결과로 나타나는 관찰 가능한 행동의 변화'이다. ②는 모델링, ④는 자기조절학습이다.","id":"simri-m195"},{"ch":"CH04 학습의 이해","t":"고전적 조건형성","q":"고전적 조건형성의 과정에서 가장 중요한 연합은?","opts":["무조건자극과 중성자극의 연합","조건자극과 조건반응의 연합","무조건반응과 조건반응의 연합","강화와 처벌의 연합"],"a":0,"exp":"고전적 조건형성에서 가장 중요한 연합은 '무조건자극(본능적인 생리반응 또는 정서반응을 일으키는 사물이나 사건)과 중성자극(무조건자극과 연합되기 이전의 사물이나 사건)의 연합'이다.","id":"simri-m196"},{"ch":"CH04 학습의 이해","t":"강화와 처벌","q":"'강화'의 개념으로 옳은 것은?","opts":["행동이 다시 나타날 가능성을 증가시키는 사건","행동이 다시 나타날 가능성을 감소시키는 사건","잘못된 행동을 한 아동을 다른 장소에 격리시키는 것","불안 위계표를 작성하여 역조건화하는 것"],"a":0,"exp":"강화는 '행동이 다시 나타날 가능성을 증가시키는 사건'이다. ②는 처벌, ③은 타임아웃, ④는 체계적 둔감화이다.","id":"simri-m197"},{"ch":"CH04 학습의 이해","t":"강화와 처벌","q":"'부적 강화'에 대한 설명으로 옳은 것은?","opts":["싫어하는 상황을 없애줌으로써 특정 자극을 제거하기 위한 행동이 증가하는 것","좋아하는 것을 수여함으로써 특정 자극을 얻기 위한 행동이 증가하는 것","특정 행동에 자극을 수여함으로써 행동을 감소시키는 것","특정 행동에 자극을 제거함으로써 행동을 감소시키는 것"],"a":0,"exp":"부적 강화는 '싫어하는 상황을 없애줌으로써 특정 자극을 제거하기 위한 행동이 증가하는 것'이다. ②는 정적 강화, ③은 수여성 처벌, ④는 제거형 처벌이다.","id":"simri-m198"},{"ch":"CH04 학습의 이해","t":"강화와 처벌","q":"처벌의 종류 중 '제거형 처벌'에 해당하는 것은?","opts":["특정 행동에 자극을 제거함으로써 행동을 감소시키는 것","특정 행동에 자극을 수여함으로써 행동을 감소시키는 것","싫어하는 상황을 없애줌으로써 행동이 증가하는 것","좋아하는 것을 수여함으로써 행동이 증가하는 것"],"a":0,"exp":"제거형 처벌은 '특정 행동에 자극을 제거함으로써 행동을 감소시키는 것'이다. ②는 수여성 처벌, ③은 부적 강화, ④는 정적 강화이다.","id":"simri-m199"},{"ch":"CH04 학습의 이해","t":"강화계획","q":"간헐적 강화 중 '간격강화'에 대한 설명으로 옳은 것은?","opts":["강화 간 시간을 중심으로 세워진 강화계획으로, 행동의 빈도와 관계없이 일정 시간 간격이 지나면 강화가 주어지는 것","강화할 행동의 빈도를 중심으로 세워진 강화계획으로, 시간이 아닌 행동이 일어나는 횟수에 따라 강화가 주어지는 것","바람직한 행동 수행 시 교환 가능한 상징물을 제공하는 것","덜 좋아하는 행동을 마친 이후에 더 좋아하는 행동을 할 수 있게 하는 것"],"a":0,"exp":"간격강화는 강화 간 시간을 중심으로 세워진 강화계획으로, 행동의 빈도와 관계없이 일정 시간 간격이 지나면 강화가 주어진다. ②는 비율강화이다.","id":"simri-m200"},{"ch":"CH04 학습의 이해","t":"강화계획","q":"일반적으로 가장 높은 행동빈도를 장기간 이끌어낸다고 알려져 있는 강화는?","opts":["변동비율강화","고정간격강화","고정비율강화","변동간격강화"],"a":0,"exp":"가장 높은 행동빈도를 장기간 이끌어낼 수 있는 강화는 '변동비율강화'이다.","id":"simri-m201"},{"ch":"CH04 학습의 이해","t":"토큰강화","q":"토큰강화(token reinforcement)의 개념으로 옳은 것은?","opts":["바람직한 목표행동 수행 시 다른 물건으로 교환 가능한 토큰(상징물)을 제공하는 방법","덜 좋아하는 행동을 마친 후 더 좋아하는 행동을 하게 하는 방법","잘못된 행동을 한 아동을 다른 장소에 격리시키는 방법","불안 위계표를 작성하고 역조건화하는 방법"],"a":0,"exp":"토큰강화는 '바람직한 목표행동 수행 시 다른 물건으로 교환 가능한 토큰(상징물)을 제공하는 방법'이다.","id":"simri-m202"},{"ch":"CH04 학습의 이해","t":"토큰강화","q":"토큰강화의 장점으로 제시된 것은?","opts":["강화물이 포화되는 현상을 어느 정도 막을 수 있음","학습자의 내재적 동기를 직접적으로 높일 수 있음","불안을 감소시킬 수 있음","격리를 통해 문제행동을 즉시 중단시킬 수 있음"],"a":0,"exp":"토큰강화의 장점은 '강화물이 포화되는 현상을 어느 정도 막을 수 있음'이다.","id":"simri-m203"},{"ch":"CH04 학습의 이해","t":"체계적 둔감화","q":"체계적 둔감화의 목적으로 옳은 것은?","opts":["불안을 일으키는 자극에 대해 불안을 가장 적게 일으키는 자극부터 가장 많이 일으키는 자극의 순서로 불안 위계표를 작성하고 역조건화를 통해 불안을 형성한 조건형성을 깨뜨리는 것","바람직한 행동에 교환 가능한 토큰을 제공하는 것","덜 좋아하는 행동 후에 더 좋아하는 행동을 하게 하는 것","잘못된 행동을 한 아동을 격리시키는 것"],"a":0,"exp":"체계적 둔감화는 불안 위계표를 작성하고 역조건화를 통해 불안을 형성한 조건형성을 깨뜨리는 방법이다.","id":"simri-m204"},{"ch":"CH04 학습의 이해","t":"프리맥 원리","q":"프리맥(Premack)의 원리에 대한 설명으로 옳은 것은?","opts":["행동에 대한 상대적인 선호 차이를 이용하는 것으로, 상대적으로 덜 좋아하는 행동(향상시키고자 하는 행동)을 마친 이후에 더 좋아하는 행동을 할 수 있게 하는 방법","교환 가능한 상징물을 제공하는 방법","불안 위계표를 작성하여 역조건화하는 방법","잘못된 행동을 한 아동을 격리시키는 방법"],"a":0,"exp":"프리맥의 원리는 행동에 대한 상대적 선호 차이를 이용해, 덜 좋아하는 행동을 마친 후 더 좋아하는 행동을 할 수 있게 하는 방법이다. 예) 숙제하기보다 축구하기를 좋아하는 학생에게 숙제를 하면 축구를 할 수 있게 해주기.","id":"simri-m205"},{"ch":"CH04 학습의 이해","t":"타임아웃","q":"타임아웃의 개념으로 옳은 것은?","opts":["잘못된 행동을 한 아동을 다른 장소에 잠시 격리시키는 방법","바람직한 행동에 토큰을 제공하는 방법","불안 위계표에 따라 역조건화하는 방법","덜 좋아하는 행동 후 더 좋아하는 행동을 하게 하는 방법"],"a":0,"exp":"타임아웃은 '잘못된 행동을 한 아동을 다른 장소에 잠시 격리시키는 방법'이다.","id":"simri-m206"},{"ch":"CH04 학습의 이해","t":"반두라 상호결정주의","q":"반두라(Bandura)의 상호결정주의 관점의 특징으로 옳은 것은?","opts":["환경, 개인, 행동 간의 관계가 쌍방향적이며, 이들이 분리된 것처럼 보이지만 상호의존적으로 개인의 기능에 영향을 미침","환경이 일방적으로 행동을 결정함","개인의 내적 특성만이 행동을 결정함","행동은 관찰
