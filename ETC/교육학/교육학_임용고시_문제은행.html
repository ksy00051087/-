과적으로 학습한 결과를 평가하는 데 어려움이 많음","kw":["공통된 문제","중핵과정","주변과정","동심원적","블록타임","교과중심","개인중심","사회중심","문제해결능력","비판적 사고력","교육자료","체계적으로 학습"],"id":"gwajeong-e53"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"통합교육과정의 개념과 목적 3가지를 제시하시오.","ans":"개념: 교육의 성과를 높이기 위하여 교육과정의 구성요소들을 결합하는 것\n목적\n① 분절된 지식과 경험을 의미 있는 방식으로 서로 관련지어 가르침으로써 학생들의 전인적 발달을 도모하고자 함\n② 학생들을 협력시키고 깊은 이해에 도달하게 하며 학업성취를 증진시켜 창조적이고 실천적인 인간으로 성장시키는 데 기여함\n③ 학교교육을 통해 사회를 보다 민주주의적으로 개혁하고자 하는 이상을 반영함","kw":["구성요소들을 결합","분절된 지식","전인적 발달","협력","깊은 이해","민주주의적으로 개혁"],"id":"gwajeong-e54"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"국가수준과 학교수준에서 교육과정을 통합하는 구체적인 방안 각각 1가지를 제시하시오.","ans":"국가수준 방안: 학생의 발달수준에 부응하거나 사회의 요구를 반영하기 위해, 교육의 효율성을 높이기 위하여 기존의 교과(과목)나 프로그램을 통합하여 새로운 교과를 개발함\n학교수준 방안: 학교 단위에서 교과 내, 교과 간, 과목 내, 과목 간, 교과와 창의적 체험활동 등을 통합하는 교육과정 재구성","kw":["새로운 교과를 개발","교과 내","교과 간","창의적 체험활동","교육과정 재구성"],"id":"gwajeong-e55"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"교과의 통합적 운영의 교육적 가치 3가지를 제시하시오.","ans":"① 지식의 폭발적인 증가로 인해 교육내용을 선정하는 일이 더욱 어려운 문제가 되고 있으므로, 교과별로 상호 관련되는 내용을 묶어 제시함으로써 필수적인 교육내용을 선정하는 데 도움을 줌\n② 교과들 속에 포함된 중복된 내용들과 중복된 기능들을 줄임으로써 학생들이 배워야 할 필수적 교육내용을 배울 시간을 확보해줌\n③ 교과들 간의 관련성을 파악하는 데 도움을 주고, 교과 학습과 생활과의 연관성을 높여 교과 학습의 의미를 삶과 관련지어 인식할 수 있게 해줌\n④ 현대사회의 쟁점을 파악하는 데 도움을 주고, 현대사회에서 발생하는 복잡한 문제들을 해결하는 능력을 길러줌\n⑤ 학생들의 흥미와 관심을 반영하기 쉬우며, 주제나 문제를 중심으로 조직될 때 학생들의 학습 선택권이 확대됨","kw":["지식의 폭발적인 증가","중복된 내용","시간을 확보","관련성","현대사회의 쟁점","학습 선택권"],"id":"gwajeong-e56"},{"ch":"CH03 교육과정 설계의 원리","t":"통합의 원리","q":"교육과정 통합의 원리 3가지의 명칭과 각각의 개념을 제시하시오.","ans":"① 중요성의 원리: 교과통합이 학습자의 흥미와 관심뿐 아니라 지적 능력의 개발을 목표로 하므로 각 교과의 중요한 내용이 반영되어야 함\n② 일관성의 원리: 통합단원의 내용과 활동이 단원의 목표 달성을 위해 고안된 수업전략 및 방법에 부합해야 함\n③ 적합성의 원리: 통합단원이 학습자의 개성과 수준에 맞아야 하고, 학습자의 전인격적 성장을 목표로 해야 함","kw":["중요성의 원리","일관성의 원리","적합성의 원리","지적 능력","수업전략","전인격적 성장"],"id":"gwajeong-e57"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정 지원","q":"통합교육과정의 효과적인 개발과 운영을 위한 단위학교 차원의 구체적인 지원방안 2가지를 제시하시오.","ans":"통합교육과정의 시간 운영(융통성 있는 시간표 구성), 시간 외 업무수당 지급, 운영자료 구비 지급, 기타 운영 공간과 시설 제공, 자원의 구비 등","kw":["융통성 있는 시간표","업무수당","운영자료","공간과 시설","자원"],"id":"gwajeong-e58"},{"ch":"CH03 교육과정 설계의 원리","t":"통합 설계유형","q":"교육과정 통합의 설계유형 5가지와 유형별 개념을 제시하시오.","ans":"① 교과 내 병렬: 교과나 과목 내에서 관련 있는 내용을 비슷한 시간대에 집중적으로 배울 수 있도록 순서를 조정하는 것을 의미함\n② 교과 간 병렬: 교과나 과목 간에 관련 있는 내용을 비슷한 시간대에 집중적으로 배울 수 있도록 순서를 조정하는 것을 의미함\n③ 다학문적 통합: 학문의 독립성을 유지하며 하나의 주제에 대해 여러 학문의 관점을 다룸\n④ 간학문적 통합: 학문 간 경계를 허물고 여러 교과의 공통부분(주제, 개념, 기능, 탐구방법 등)을 추출하고, 이를 중심으로(빅아이디어 등) 교육과정을 조직함\n⑤ 탈학문적 통합: 교과 구분을 초월하여 실제 생활의 주제나 쟁점들을 중심으로 새로운 형태의 통합교과를 형성함","kw":["교과 내 병렬","교과 간 병렬","다학문적","간학문적","탈학문적","독립성","경계를 허물고","빅아이디어","교과 구분을 초월"],"id":"gwajeong-e59"},{"ch":"CH03 교육과정 설계의 원리","t":"드레이크","q":"드레이크(Drake)가 제안한 통합교육과정의 유형 3가지와 유형별 조직의 구심점, 내용조직의 특징, 학문의 주된 목적 각 1가지를 제시하시오.","ans":"[다학문적] 조직의 구심점: 특정 교과로부터 추출된 주제 / 내용조직의 특징: 개별 교과의 정체성 유지 / 학문의 주된 목적: 개별 교과의 내용과 기능 습득\n[간학문적] 조직의 구심점: 여러 교과에 걸쳐 강조될 필요가 있는 중요한 주제나 개념, 혹은 기능 / 내용조직의 특징: 교과 간 엄격한 경계가 무너짐 / 학문의 주된 목적: 간학문적인 주제, 개념, 기능 습득\n[탈학문적] 조직의 구심점: 문제나 쟁점 중심 / 내용조직의 특징: 교과 간의 경계가 사라짐 / 학문의 주된 목적: 문제나 쟁점 중심의 주제 탐구","kw":["특정 교과로부터 추출된 주제","정체성 유지","여러 교과에 걸쳐","경계가 무너짐","문제나 쟁점 중심","경계가 사라짐"],"id":"gwajeong-e60"},{"ch":"CH03 교육과정 설계의 원리","t":"KDB 모형","q":"KDB 모형의 핵심요소 3가지의 명칭과 각각의 개념, KDB 모형의 의의 3가지를 제시하시오.","ans":"핵심요소\n① 지식(know): 학생들이 알아야 할 가장 중요한 것. 사실이나 개념 혹은 지속적인 이해를 포함함\n② 기능(do): 학생들이 할 수 있어야 할 가장 중요한 것. 의사소통이나 정보관리 등 여러 교과를 아우르는 폭넓은 기능뿐 아니라 Bloom의 교육목표분류학에서 제시한 다양한 인지적 기능을 포함함\n③ 인성(be): 학생들이 갖추어야 할 가치나 태도. 상대방을 배려하고 협력하고 공존할 수 있는 태도나 가치관 형성에 초점을 둠\n의의\n① 교사 혹은 단위학교의 '자율성'을 구현할 수 있게 해줌\n② 학생들에게 적합하고 필요에 맞는 맥락에서 운영하되, 기존의 교육과정을 근간으로 성취기준을 강조하므로 '책무성'을 지님\n③ 왜 필요한지 모르고 활동 위주로만 수업을 구성하는 피상성의 함정에서 벗어나 '엄밀성'을 보장할 수 있음","kw":["지식","know","기능","do","인성","be","Bloom","자율성","책무성","엄밀성","피상성의 함정"],"id":"gwajeong-e61"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"교육과정 통합의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 교육내용을 통합함으로써 교육과정을 효율적으로 운영할 수 있음\n② 사회의 실질적인 쟁점 및 이슈를 강조함으로써 지식의 유용성 및 실생활과의 연계성을 높일 수 있음\n③ 활동중심 교육과정을 강조함으로써 학생의 흥미에 맞는 교육과정을 제공할 수 있음\n단점\n① 교과의 내용을 논리적이고 의미 있는 방식으로 연결지어 통합교육과정을 구성하는 것이 어려움\n② 특정 주제나 쟁점을 중심으로 교육과정을 구성하기 때문에 학습자로 하여금 혼란을 야기할 수 있음\n③ 통합교육과정을 구성하는 일은 많은 시간과 노력을 요구하기 때문에 교사의 업무적 부담이 가중될 수 있음","kw":["효율적","쟁점","유용성","실생활과의 연계성","활동중심","논리적","혼란","업무적 부담"],"id":"gwajeong-e62"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 교육과정 개발모형에서 잠정적 교육목표를 설정할 때 자료원으로 삼는 3가지와 최종적 교육목표를 설정하는 과정에서 체(screen)로 삼는 2가지, 최종목표 진술방안 1가지를 설명하시오.","ans":"잠정적 교육목표 설정\n① 학습자에 관한 연구: 교육과정의 최종 수혜대상이 되는 학습자에 대한 연구임\n② 사회의 요구에 관한 조사: 건강, 가족, 여가, 직업, 종교, 소비, 시민활동 등 현대사회 생활에서 중요한 측면들을 확인함\n③ 교과 전문가의 견해: 시민들에게 가장 중요한 지식은 무엇인가에 대한 교과 전문가의 목표에 대한 제안과 권고\n최종적 교육목표 설정\n① 교육철학: 좋은 삶과 좋은 사회의 성격에 대한 교육자의 가치관 ⇒ 잠정적 교육목표의 바람직성과 우선순위를 정함\n② 학습심리학: 학습자의 발달상황과 학습환경에 대한 이해 ⇒ 학습가능성과 교수가능성을 따짐\n최종목표 진술방안: '행동목표'로 진술할 것을 제안함","kw":["학습자에 관한 연구","사회의 요구","교과 전문가","교육철학","학습심리학","바람직성","우선순위","학습가능성","교수가능성","행동목표"],"id":"gwajeong-e63"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 학습경험 선정의 원리 5가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 기회의 원리: 특정 교육목표를 달성하기 위해서는 그 목표가 의도하는 행동을 학습자가 스스로 경험해 볼 수 있는 기회가 학습경험에 내포되어야 함\n② 만족의 원리: 학생이 교육목표가 권고하는 행동을 수행하는 과정에서 만족감을 느껴야 함\n③ 가능성의 원리: 학습경험에서 요구되는 학생의 반응이 현재 그 학생의 능력범위(현재 학습능력, 발달수준 등) 안에 있어야 함\n④ (일목표) 다경험의 원리: 하나의 교육목표 달성에 사용할 수 있는 학습경험은 여러 가지가 있을 수 있음\n⑤ (일경험) 다성과의 원리: 하나의 학습경험이 대개 여러 가지 학습성과를 가져오므로 동일한 조건이라면 학습경험을 선정할 때 여러 교육목표 달성에 도움이 되고 전이효과가 높은 학습경험을 선택함","kw":["기회의 원리","만족의 원리","가능성의 원리","다경험","다성과","능력범위","전이효과"],"id":"gwajeong-e64"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 학습경험 조직의 원리 3가지와 학습경험의 조직구조 3가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"조직의 원리\n① 계속성(continuity): 같은 내용의 반복으로, 중요한 경험요소가 반복되도록 조직해야 함\n② 계열성(sequence): 다른 내용들의 순서적 배열로, 점차 경험의 수준을 높여 더욱 깊이 있고 폭넓은 학습이 가능하도록 조직해야 함\n③ 통합성(integration): 교육과정 요소를 수평적으로 연관시키는 것으로, 각 학습경험이 단편적이지 않고 조화롭게 연결되도록 조직해야 함\n조직구조\n① 상층구조: 커리큘럼의 전체적인 테두리를 결정하는 문제로 교과목 중심, 교과영역 중심, 공통문제 중심, 학생활동 중심의 구조가 존재함\n② 중층구조: 상층구조의 각 하위영역의 조직을 결정하는 문제로 계열성을 고려하여 학습경험을 조직하는 '계열구조'와 비연속적으로 학습경험을 조직하는 '비계열구조'가 존재함\n③ 하층구조: 학습내용을 가장 작은 단위로 조직하는 문제로 차시수업(lesson), 주제(topic), 단원(unit) 등을 의미함","kw":["계속성","계열성","통합성","상층구조","중층구조","하층구조","계열구조","비계열구조","차시수업","단원"],"id":"gwajeong-e65"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 평가의 의의 1가지와 학습경험 평가의 원칙 2가지를 제시하시오.","ans":"평가의 의의: 교육목표 달성의 정도를 판단하는 것 ⇒ 학습경험이 기대된 결과를 실제적으로 얼마나 만들어냈는지를 확인함\n평가의 원칙\n① 교육목표가 행동목표로 진술되었듯이 학습경험의 평가도 학생의 행동을 평가대상으로 함\n② 학생의 행동변화를 평가하기 위해 일정 기간 내에 적어도 두 번 이상의 평가가 필요함\n③ 평가의 방법은 지필평가 외에도 관찰, 인터뷰, 설문지, 포트폴리오 등 다양한 방법이 동원될 수 있으며 평가의 타당성과 신뢰도가 확보되어야 함","kw":["교육목표 달성의 정도","행동을 평가대상","두 번 이상","관찰","인터뷰","설문지","포트폴리오","타당성","신뢰도"],"id":"gwajeong-e66"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 교육과정 개발모형의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 실용성: 어떤 교과나 수업의 수준에서도 활용·적용될 수 있음\n② 명료한 평가지침: 교육목표를 명료한 행동목표로 진술함으로써 교사가 뚜렷한 기준에 근거하여 학습경험을 평가할 수 있음\n③ 용이성: 논리적이고 합리적인 절차를 제시하고 있으므로 교육과정 개발자나 교사가 쉽게 따라할 수 있음\n④ 종합성: 교육과정 개발과 설계의 모든 면에서 활용될 수 있음\n단점\n① 교육과정의 내용 도외시: 교육목표를 내용보다 우위에 두기 때문에 교육내용을 단순 목표달성을 위한 수단으로 전락시킴\n② 수업의 역동성 무시: 교육목표(평가준거)를 미리 설정하기 때문에 수업 진행 중 새롭게 생겨날 수 있는 표현적 결과를 평가에 반영할 수 없음\n③ 실제 교육과정 개발과의 괴리: 실제 다양한 참여자들의 역동 속에서 이루어지는 복잡하고 양방향적인 교육과정 개발절차를 제대로 설명하지 못함\n④ 교육목표의 효율적인 달성에만 초점을 둠으로써 개발과정에 개입될 수 있는 보이지 않는 정치적 측면이나 결과적으로 나타날 잠재적 측면에 관심이 없음\n⑤ 교육과정 개발의 기준, 절차 혹은 방법에만 관심을 둠으로써 교육목표나 교육내용이 무엇이어야 하는가에 대해서는 직접적인 답을 제공하지 못함","kw":["실용성","명료한 평가지침","용이성","종합성","내용 도외시","수업의 역동성","표현적 결과","괴리","정치적 측면","잠재적 측면"],"id":"gwajeong-e67"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 교육과정 개발모형의 다양한 명칭 4가지와 명칭별 특징 1가지를 제시하시오.","ans":"귀납적 개발모형: 교사가 중심이 되어 교육과정의 구체적인 내용들을 개발하고, 내용들을 귀납하여 교육과정 일반을 설계함\n단원개발모형: 단원 수준의 교육과정 개발을 강조함\n교사중심 개발모형: 교사가 교육과정을 개발함\n풀뿌리 개발모형: 학생들의 요구에서 출발하고 교사와 지역사회, 학부모 등이 협력하여 학생들의 필요와 관심사에 맞춘 교육과정을 만듦","kw":["귀납적 개발모형","단원개발모형","교사중심 개발모형","풀뿌리 개발모형","귀납","단원 수준","학생들의 요구"],"id":"gwajeong-e68"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 교육과정 개발모형이 타일러의 교육과정 개발모형과 구별되는 특징 3가지를 제시하시오.","ans":"① 교육내용과 학습경험을 구분함 ⇒ 교육내용은 학생들이 배울 것으로 기대되는 교과나 지식을 가리키는 반면 학습경험은 학생들이 그 내용을 이해할 수 있도록 사용되는 교육활동과 관련됨\n② 교사중심의 교육과정 개발모형이기 때문에 현장지향적이며 교사의 역할을 강조함. 교사가 학습자의 흥미와 요구를 지속적으로 진단하여 반영함\n③ 귀납적임 ⇒ 단원을 개발하고 나서 교과와 교육과정 일반을 설계함","kw":["교육내용과 학습경험을 구분","현장지향적","교사의 역할","귀납적","단원을 개발"],"id":"gwajeong-e69"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 교육과정 개발모형에서 시험단원을 개발하기 위한 풀뿌리 논리(grassroots rationale) 8단계의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 요구진단: 교육과정 계획의 대상이 되는 학생들의 요구를 확인함\n② 목표설정: 주의가 필요한 요구를 확인 후, 성취되어야 할 목표를 구체화함\n③ 내용선정: 선정 또는 생성된 목표에 맞는 교과 또는 내용을 선정함. 목표와 내용은 서로 연결되어야 하며, 선정된 내용의 타당성과 중요성이 이 단계에서 판정되어야 함\n④ 내용조직: 선정된 내용을 학습자의 발달수준, 학업성취, 흥미 등을 고려하여 계열성에 따라 조직함\n⑤ 학습경험 선정: 학생을 학습에 참여하도록 하는 수업방법을 선정함\n⑥ 학습활동 조직: 내용의 조직방식에 따라 학습경험을 조직하되, 학생의 특성에 따라 조직방식을 달리할 수 있음\n⑦ 평가내용·방법·수단 결정: 평가내용과 방법, 도구 등을 결정함\n⑧ 균형과 계열성 검증: 개발된 단원 내용이 균형 있고 계열성에 따르는지 검토함","kw":["요구진단","목표설정","내용선정","내용조직","학습경험 선정","학습활동 조직","평가내용","균형과 계열성 검증"],"id":"gwajeong-e70"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 교육과정 개발모형에서 개발된 단원 활용의 5단계를 설명하시오.","ans":"① 1단계-시험적 교수·학습단원 구성: 풀뿌리 논리에 따라 시험단원의 구성이 이루어짐\n② 2단계-시험단원 검증: 잠정적으로 구성된 단원의 검증임\n③ 3단계-개정 및 통합: 개발된 단원을 개정 및 통합하여 모든 유형의 학급에도 잘 맞는 보편화된 교육과정을 개발함\n④ 4단계-구조 개발: 여러 개의 단원들을 구조화하여 전체적인 범위와 계열성을 검증함\n⑤ 5단계-새 단원 정착 및 확산: 새 단원을 실제 교실수업에 본격적으로 투입·정착시키고, 교사들의 현직연수 등을 통해 확산시킴","kw":["시험적 교수·학습단원","시험단원 검증","개정 및 통합","보편화","구조 개발","정착 및 확산","현직연수"],"id":"gwajeong-e71"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)가 제안한 교육과정 개발모형의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 타일러의 합리성 단계를 세분화하였으며, 수업 수준에서 교수·학습활동을 어떻게 전개할 것인지의 문제에 대해 답을 제공함\n② 교육의 성공적인 변화를 이루기 위하여 교육과정 개발과정에 교사의 참여를 독려하는 최근의 추세에 부합함\n단점\n① 단원 개발에서 교육과정 일반으로 나아가는 모형의 특성상, 교사가 개별 교과 또는 매 차시 수업에 천착하면 전체 교육과정에 대한 이해로 나아가지 못할 수 있음\n② 국가 및 지역단위 교육과정 개발을 교사에게 맡기는 것은 부적절할 수 있음\n③ 교사가 자신이 가르치는 교과의 이해관계에서 벗어나기 어려움","kw":["세분화","교수·학습활동","교사의 참여","천착","전체 교육과정","이해관계"],"id":"gwajeong-e72"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"워커","q":"워커(Walker)가 제안한 교육과정 개발모형의 특징 2가지를 제시하시오.","ans":"① 다양한 관점을 가진 교육과정 개발자들이 타협하며 교육과정 설계에 대한 의사결정을 하는 과정에 주목함\n② 교육과정 개발 참여자들 간의 의견이 타협되고 조정되는 과정인 '숙의'를 강조함\n③ 교육과정 개발자들이 실제로 따르고 있는 절차를 서술하는 것에 중점을 둠\n④ 개발의 각 단계는 비선형적이고 역동적인 특징을 지님\n⑤ 비교적 대규모로 이루어지는 교육과정 개발에 적합함\n⑥ 자연주의적 교육과정 개발모형은 '강령(토대 다지기)'(platform), '숙의'(deliberation), '설계'(design)의 세 단계로 이루어짐","kw":["타협","숙의","실제로 따르고 있는 절차","비선형적","역동적","대규모","자연주의적"],"id":"gwajeong-e73"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"워커","q":"워커(Walker)가 제안한 교육과정 개발의 절차 3단계를 설명하시오.","ans":"① 강령(platform): 교육과정 개발에 참여하는 모든 사람들이 그들이 개발해야 할 교육과정이 어떤 것이 되어야 하는지에 대해 각자 갖고 있는 개인적인 신념과 가치를 공유하는 단계. 서로의 입장을 확인하고 공감대를 형성함\n② 숙의(deliberation): 교육과정에 대한 다양한 생각을 가진 사람들이 대화와 회의를 통해 최선의 대안을 선택하는 실제적인 과정\n③ 설계(design): 선택한 추상적인 아이디어를 최종 산출물로 만들어내기 위해 구체화하는 단계(교과 및 수업자료, 수업활동 창출, 이를 위한 행정, 재정적인 지원절차 계획)","kw":["강령","platform","신념과 가치","공감대","숙의","deliberation","최선의 대안","설계","design","구체화"],"id":"gwajeong-e74"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 교육과정 개발모형의 명칭과 특징 3가지를 제시하시오.","ans":"명칭: 학교중심 교육과정 개발모형(SBCD; School Based Curriculum Development)\n특징\n① 상황분석 중시: 사회의 특징과 학교의 교육상황을 비판적으로 분석하는 '상황분석'을 교육과정 개발의 출발점으로 봄\n② 학교 특성에 따른 교육과정 구성: 교육과정이 학교, 교사, 학생의 특성에 따라 다르게 구성되어야 함을 강조\n③ 개방적·비선형적 모형: 교육과정 개발자가 인식하고 있는 요구에 적합하다고 생각하는 단계에서 모형 시작을 권고하기 때문에 순서와 무관하게 시작이 가능하며 단계의 결합 또한 가능하다는 점에서 비선형적임\n④ 역동적·상호작용적 모형: 교사, 학생, 학부모, 지역사회의 요구에 따라 수정 가능하기 때문에 역동적이고 상호작용적인 모형임\n⑤ 학생의 요구 반영: 학생의 요구를 즉각 반영할 수 있어 유연하고 효과적인 수업 가능함","kw":["학교중심 교육과정 개발모형","SBCD","상황분석","출발점","개방적","비선형적","역동적","상호작용적","학생의 요구"],"id":"gwajeong-e75"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 교육과정 개발의 절차 5가지를 설명하시오.","ans":"① 상황분석: 학교의 외적 요인과 내적 요인을 분석함\n② 목표설정: 예견되는 학습결과를 진술함으로써 교사와 학생의 행동을 강화할 수 있는 목표를 설정함\n③ 프로그램 구성: 교수·학습활동의 설계, 적절한 보조자료와 매체 선정, 인사 배치와 역할 분담, 교육환경 및 시간표 설계 등\n④ 판단(해석)과 실행: 저항이나 혼란을 일으킬 수 있는 문제들을 미리 예측하고 경험, 관련 이론, 통찰력을 통해 문제를 해결함\n⑤ 평가(모니터링, 피드백, 평가, 재구성): 연속적으로 평가되어야 할 문항들을 점검하고, 평가를 통해 교육과정을 끊임없이 재구성함","kw":["상황분석","목표설정","프로그램 구성","판단","해석","실행","평가","모니터링","재구성"],"id":"gwajeong-e76"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 상황분석의 대상 2가지를 각각의 예시 2가지와 함께 설명하시오.","ans":"① 외적 요인: 사회·문화적 변화와 기대, 교육체제 권고, 변화하는 교과의 성격, 교사 지원체제, 학교 자원 흐름 등\n② 내적 요인: 학생의 적성·능력·교육적 요구, 교사의 가치관·태도·기능·지식·경험·강점과 약점, 현재 교육과정에서 파악된 문제와 단점, 학교의 환경과 정치적 구조, 학교의 시설 등","kw":["외적 요인","사회·문화적 변화","교육체제 권고","교사 지원체제","내적 요인","적성","능력","가치관","정치적 구조","시설"],"id":"gwajeong-e77"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)의 교육과정 개발의 절차 중 '프로그램 구성'과 '판단과 실행'의 단계에서 교사가 수행해야 하는 구체적인 활동 각각 1가지를 제시하시오.","ans":"프로그램 구성\n① 교수·학습활동의 설계: 내용, 교수·학습활동의 계열, 폭과 깊이, 계열성\n② 적절한 보조자료와 매체 선정\n③ 인사 배치와 역할 분담\n판단과 실행(해석과 실행): 교육과정에 변화를 일으키는 저항, 혼란을 일으킬 수 있는 문제들을 미리 예측하고 경험, 관련 이론, 통찰력을 통해 문제를 해결함","kw":["교수·학습활동의 설계","계열","폭과 깊이","보조자료","매체 선정","인사 배치","역할 분담","저항","혼란","통찰력"],"id":"gwajeong-e78"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 교육과정 개발모형의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 각 학교의 특성을 고려한 교육과정 개발이 용이함\n② 교육과정에 교사를 참여시킴으로써 교사의 전문성과 자율성을 증진시킴\n③ 실제 커리큘럼의 효과성을 제고함\n④ 학습자 중심 교육과 유연한 교육이 가능함\n⑤ 창의적인 교육과정 개발이 가능함\n단점\n① 교육과정 개발자로 교사가 참여할 시, 교사는 업무의 부담을 느낄 수 있음\n② 교육과정 개발에 필요한 적절한 훈련이 부재할 경우, 교육과정 개발이 효율적으로 진행되지 못할 수 있음\n③ 객관적인 평가가 어려움\n④ 명확한 목표를 설정하지 않기 때문에 혼란을 야기할 수 있음\n⑤ 학교의 여건이나 교사의 전문성에 따라 각 학교 교육과정의 폭이나 깊이가 차이 날 수 있음","kw":["학교의 특성","전문성","자율성","효과성","학습자 중심","업무의 부담","훈련이 부재","객관적인 평가","명확한 목표"],"id":"gwajeong-e79"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 행동목표에 대한 대안으로서 제시한 교육목표 2가지의 명칭과 각각의 개념을 제시하시오.","ans":"① 문제해결목표: 어떤 문제와 그 문제를 해결할 때 지켜야 할 조건이 주어지면, 문제와 조건은 명확하지만 해결책이 여러 가지일 수 있는 목표유형\n② 표현적 결과: 미리 정하거나 예측하지 않았지만 어떤 활동을 하는 도중이나 끝난 후 획득한 교육적으로 바람직한 결과","kw":["문제해결목표","조건","해결책이 여러 가지","표현적 결과","미리 정하거나 예측하지 않았지만"],"id":"gwajeong-e80"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 교육과정 내용 선정에 있어서 반드시 고려해야 한다고 주장한 교육과정의 명칭을 이것의 개념과 함께 제시하고, 이 교육과정의 원천 3가지를 제시하시오.","ans":"교육과정 내용 선정 - 영교육과정: 배울 만한 가치가 있지만 공식적 교육과정에는 포함되지 않은 교육내용 또는 교육과정에는 포함되어 있지만 학교나 교사가 의도적 또는 무의식적으로 가르치지 않은 학습내용\n원천 3가지: 학습자, 사회, 교과목","kw":["영교육과정","배울 만한 가치","의도적","무의식적","학습자","사회","교과목"],"id":"gwajeong-e81"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)의 관점에서 학습기회 유형을 개발하기 위해 요구되는 교사 능력의 명칭을 개념과 함께 제시하고, 교사가 이러한 능력을 발휘할 때의 교육적 효과 1가지를 제시하시오.","ans":"학습기회 유형 - 교육적 상상력: 학습자의 폭넓은 학습경험을 위해 교사가 교육목표와 내용을 학생들에게 의미 있게 변형하는 능력\n교육적 효과: 교사가 교육목표와 교육내용을 학생에게 적합한 형태로 변형시켜 실제 학생에게 의미 있고 만족스러운 다양한 학습기회를 제공할 수 있음","kw":["교육적 상상력","폭넓은 학습경험","의미 있게 변형","적합한 형태","다양한 학습기회"],"id":"gwajeong-e82"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 강조한 학습기회 조직방안의 명칭과 이의 특징 1가지, 내용영역 조직방안의 명칭과 이의 특징 1가지를 제시하시오.","ans":"학습기회 조직 - 거미줄 조직 ⇒ 특징: 학생이 여러 과제에 동시에 접근하여 다양한 학습결과를 얻을 수 있도록 비선형적 접근방식을 택함\n내용영역 조직 - 범교과적 조직 ⇒ 특징: 다양한 교과를 넘나들며 아우르는 조직방안","kw":["거미줄 조직","동시에 접근","비선형적","범교과적 조직","넘나들며"],"id":"gwajeong-e83"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"교사의 교육과정 제시방식의 중요성 1가지와 아이즈너(Eisner)가 제안한 교사의 교육과정 제시방식의 특징 2가지를 설명하시오.","ans":"제시방식의 중요성: 학생의 발달에 영향을 줌 ⇒ 교사가 한정된 의사소통 방식을 취하는 것은 학생의 발달 기회를 빼앗는 것임\n특징\n① 교사는 문자에 의한 소통뿐 아니라, 시각, 청각 등을 활용한 다양한 제시방식을 수업에서 활용해야 함\n② 시적 표현이나 은유적인 표현양식을 통한 의사소통은 언어의 양식을 통한 의사소통보다 더 강력한 의미를 지님","kw":["학생의 발달","한정된 의사소통 방식","시각","청각","시적 표현","은유적인 표현양식"],"id":"gwajeong-e84"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 제안한 교육목표 평가를 위한 관점 2가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"교육적 감식안: 학생의 성취형태 간 미묘한 차이를 감지할 수 있는 능력\n교육비평: 교사가 전문가적인 감식안을 통하여 발견해낸 미묘한 교육적 성과의 차이를 공적인 언어의 형태로 표현한 것","kw":["교육적 감식안","성취형태","미묘한 차이","교육비평","공적인 언어"],"id":"gwajeong-e85"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 제안한 참평가(Authentic assessment)의 개념과 참평가를 구현하기 위한 구체적인 방안 3가지를 제시하시오.","ans":"참평가: 단편적인 지식의 암기를 유도하지 않고, 실생활에서 학생들의 문제해결력을 평가하기 위한 방안을 의미함\n방안\n① 과제는 학교 내에서만 국한된 것이 아닌, 학교 밖의 세계에서 부딪힐 수 있는 것이어야 함\n② 평가과제는 결과뿐만 아니라 문제해결 과정도 보여줄 수 있어야 함\n③ 평가과제는 그 과제를 만든 지적 공동체의 가치를 반영해야 함\n④ 평가과제는 개인별 평가와 함께, 집단의 노력을 필요로 하는 집단별 평가도 사용되어야 함\n⑤ 평가과제는 문제 또는 질문에 대한 해결책 또는 답이 한 가지 이상이도록 구성되어야만 함\n⑥ 평가과제는 수업시간에 배운 것을 새로운 상황에 적용하도록 요구하는 것이어야 함\n⑦ 평가과제는 학생이 단편적인 사실과 함께 보다 전체적인 맥락에 신경을 쓰도록 하는 것이어야 함\n⑧ 평가과제는 학생이 배운 것을 표현하기 위하여 사용하는 제시형태를 다양하게 선택할 수 있도록 허용하는 것이어야 함","kw":["단편적인 지식의 암기","문제해결력","학교 밖의 세계","문제해결 과정","지적 공동체","집단별 평가","한 가지 이상","새로운 상황","전체적인 맥락","제시형태"],"id":"gwajeong-e86"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)가 교육과정 재개념화 주장을 통해 목적으로 삼은 바 1가지와 파이너가 주장한 쿠레레(Currere) 재개념화의 의미를 제시하시오.","ans":"목적: 인간의 실존적 해방을 궁극적인 목적으로 삼고 교육과정이 사회적 맥락 속에서의 개개인의 고유한 경험이어야 한다고 주장함\n재개념화: 정해진 경주로를 따라 달리는 개인적 경험에 초점을 둠","kw":["실존적 해방","사회적 맥락","고유한 경험","경주로","개인적 경험"],"id":"gwajeong-e87"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 이론에 영향을 미친 교육철학의 명칭과 이 교육철학의 주요 주장 2가지를 제시하시오.","ans":"명칭: 실존주의\n주요 주장\n① 개인이 미리 정해진 목적을 실현하는 도구가 아니며 개인들의 실존적 선택과 행동을 통해 삶의 가치와 의미를 창조해 나감\n② 인간의 주관적 경험, 자유와 해방, 삶의 책임과 의미를 찾는 것을 중시함\n③ 개인을 지배하는 소외와 교육의 비인간화 문제를 성찰하며, 교육과 인간의 본질을 탐구하고자 함","kw":["실존주의","실존적 선택","가치와 의미를 창조","주관적 경험","자유와 해방","소외","비인간화"],"id":"gwajeong-e88"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)가 주장한 쿠레레 방법론의 개념과 쿠레레 방법론의 특징 2가지를 제시하시오.","ans":"개념: 교사나 학생이 살아오면서 갖게 된 교육적 체험들을 자신의 존재 의미와 연관지어서 해석하여 교육적 상황을 이해하고, 자아를 성찰하는 자기반성적인 삶을 살아가도록 하는 탐구방법\n특징\n① 개인의 내적 경험을 탐구하고, 학습자가 자기와 자신의 교육경험을 비판적으로 성찰하도록 유도함\n② 개인의 전기적 탐구를 통해 인간의 생각과 행동에 내재된 무의식적 가정을 밝혀 교육적 경험의 본질과 의미를 이해하고자 함\n③ 개인의 교육경험이 형성되는 사회·정치적 맥락을 고려한다는 점에서 정치적 특성을 지님\n④ 교사, 학생의 과거 교육경험을 반추하도록 한다는 점에서 과거지향적이지만, 동시에 미래의 비전과 현재를 연결짓는다는 점에서 미래지향적이기도 함\n⑤ 자신의 과거나 현재의 경험을 곰곰이 따진다는 점에서 분석적이지만, 동시에 분석의 결과를 다양한 맥락과 연결지어 자기이해에 활용한다는 점에서 종합적임","kw":["교육적 체험","존재 의미","자기반성적","내적 경험","전기적 탐구","무의식적 가정","사회·정치적 맥락","과거지향적","미래지향적","분석적","종합적"],"id":"gwajeong-e89"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)가 주장한 쿠레레 방법 4단계의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 회귀: 과거로 돌아가는 단계 ⇒ 과거로 돌아가 자유연상법에 기반하여 그동안의 교육적 경험을 되돌아봄\n② 진보: 미래를 상상하는 단계 ⇒ 자유연상기법을 통해 현실화되지 않은 자신의 모습을 앞서 조망해보는 단계\n③ 분석: 회귀, 진보 단계에서 각자의 과거 경험들과 미래의 비전을 통제함으로써 진실된 자신의 '전기적 현재'를 기록하는 것\n④ 종합: 현재의 의미를 종합적으로 파악하는 단계 ⇒ 자기가 누구인지에 대해 진정한 내적 의식의 세계를 이해하는 단계","kw":["회귀","진보","분석","종합","자유연상법","전기적 현재","내적 의식"],"id":"gwajeong-e90"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 자서전적 방법의 개념과 자서전적 방법의 3단계를 설명하시오.","ans":"개념: 타인의 참여를 허용하여 교육이 지니는 기본구조를 파악해 볼 수 있는 방안으로, 교육자와 학생이 교육과정과 관련된 경험과 기억을 바탕으로 개인적 이야기와 그것에 영향을 준 사회·문화·정치적 맥락을 함께 성찰하는 방법\n3단계\n① 1단계: 자신의 교육경험을 표현하기 ⇒ 지금의 자신이 누구이며 어떻게, 왜 발달되어 왔는지, 어떤 환경 속에서 어떻게 살아왔는지를 알기 위해 자서전적으로 글을 작성하는 단계\n② 2단계: 교육경험을 비판적으로 성찰하기 ⇒ 한 사람이 쓴 글에 대하여 교사와 다른 학생들이 대화를 나누며 자신과 타인 및 세계에 대한 새로운 인식과 전망을 만들어가는 단계\n③ 3단계: 타인의 교육경험을 분석하기 ⇒ 다른 학생이 쓴 자서전을 함께 읽고 분석하는 단계","kw":["타인의 참여","기본구조","사회·문화·정치적 맥락","표현하기","비판적으로 성찰","새로운 인식과 전망","타인의 교육경험을 분석"],"id":"gwajeong-e91"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"애플","q":"애플(Apple)의 학교교육과 교육과정에 대한 비판 2가지를 제시하시오.","ans":"학교교육에 대한 비판\n① 학교는 기성세대의 권력관계를 다음 세대에 전달하는 문화적 재생산 기능을 수행함\n② 학교는 지배집단의 이데올로기를 마치 중립적·객관적인 것처럼 제공함으로써 교사와 학생을 통제함\n③ 학교교육과정 속에 내재된 지배적 이데올로기가 학교교육을 통하여 재생산된다고 봄\n교육과정에 대한 비판\n① 학교는 공식적 교육과정을 통해 지배집단의 문화자본을 적법화시킴\n② 문화자본은 특수한 지위를 부여받아 공식적 교육과정을 통해 전달되며, 자연스럽게 유지 및 계승됨\n③ 교육이 계급을 재생산하는 방식은 교실과 경제의 직접적 대응보다는 공식적 및 잠재적 교육과정에 의해 기존 사회의 권력관계를 유지시키는 방향으로 문화적으로 이루어짐","kw":["문화적 재생산","지배집단의 이데올로기","중립적","객관적","통제","문화자본","적법화","계급을 재생산"],"id":"gwajeong-e92"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"애플","q":"애플(Apple)이 주장한 교사의 탈숙련화(deskilling)와 재숙련화(reskilling) 각각의 개념을 제시하시오.","ans":"탈숙련화: 교사 개인의 고유한 지식과 관점을 보유하는 것이 불필요하게 되어, 결국 교사로서의 전문성이 떨어지는 현상\n재숙련화: 교사가 주어진 교육용 소프트웨어를 단순히 실행하는 수업관리자로 전락하는 현상","kw":["탈숙련화","고유한 지식","전문성이 떨어지는","재숙련화","교육용 소프트웨어","수업관리자"],"id":"gwajeong-e93"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"이해중심 교육과정","q":"이해중심 교육과정(understanding by design)의 개념과 백워드 설계(Backward design)에서 백워드라는 말의 의미를 구체적으로 설명하시오.","ans":"이해중심 교육과정: 학생들의 이해를 개발·심화시키는 데 목적을 두는 학교 또는 학급 수준의 교육과정 설계방식. 이때의 이해는 장기적으로 기억에 남고 새로운 상황으로 전이 가능한 '영속적 이해(enduring understanding)'를 말함\n백워드의 의미: '역방향'이라는 뜻으로 '목표설정 → 평가 → 수업계획'의 순서를 따르며, 기존 교육과정 설계절차와 달리 평가계획을 수업계획보다 먼저 설계함을 의미함","kw":["이해를 개발","심화","영속적 이해","enduring understanding","역방향","목표설정","평가","수업계획"],"id":"gwajeong-e94"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계에서 학습자에게 개발하고자 하는 '이해'의 개념과 '전이'의 개념, 위긴스와 맥타이가 제시한 이해의 여섯 가지 측면을 각각 설명하시오.","ans":"이해: '영속적 이해'로, 학습자가 사실을 모두 잊어버려도 남아 있는 가장 포괄적인 수준의 일반화와 원리를 의미함\n전이: 학습한 아이디어나 사실, 기능 등을 새로운 상황이나 맥락 속에서 효율적으로 활용하는 능력을 말함\n이해의 여섯 가지 측면\n① 설명: 자신의 주장을 뒷받침하는 증거를 사용하여 개념과 현상에 대한 설명을 제공하는 능력\n② 해석: 하나의 텍스트를 다양한 맥락에서 해석하고, 사회적 의미를 파악하는 능력\n③ 적용: 새롭고 복잡한 상황에서 지식과 기술을 효과적으로 사용하는 능력\n④ 관점: 하나의 현상을 다양한 관점, 즉 비판적이고 통찰력 있는 안목을 통해 볼 수 있는 능력\n⑤ 공감: 다른 사람의 감정과 상황을 이해하고, 상대방의 처지에서 상황을 이해하는 능력\n⑥ 자기지식: 자신의 무지를 알고, 지혜를 사랑하며, 자신의 사고와 행위를 성찰하는 능력","kw":["영속적 이해","포괄적","일반화와 원리","전이","설명","해석","적용","관점","공감","자기지식"],"id":"gwajeong-e95"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계 모형과 타일러의 교육과정 모형의 공통점 1가지, 백워드 설계가 타일러 모형과 구별되는 차이점 1가지, 백워드 설계 모형과 브루너 모형의 공통점 1가지를 제시하시오.","ans":"공통점(타일러): 교육과정 설계의 형식 측면에서는 타일러의 모형처럼 목표와 평가의 연계성을 강조함\n차이점: 평가계획 선행 및 강조 - 학습내용 선정에 앞서 평가계획을 매우 구체적으로 수립함\n공통점(브루너) - 학문에 내재된 원리를 교육내용으로 삼음: 브루너 모형이 '지식의 구조'라는 학문에 내재된 원리를 교육내용으로 삼은 것과 같이, 백워드 설계 모형 또한 학문에 내재된 가장 중요한 개념이자 원리인 '영속적 이해'를 교육내용으로 삼음","kw":["목표와 평가의 연계성","평가계획 선행","구체적으로 수립","지식의 구조","영속적 이해","학문에 내재된 원리"],"id":"gwajeong-e96"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계(Backward design)의 절차 3단계를 설명하시오.","ans":"① 1단계-바라는 결과 확인하기: 단원이 끝났을 때 학생들이 무엇을 알게 되고, 할 수 있어야 되는지(목표)에 대해 확인하는 것\n② 2단계-수용 가능한 증거 결정하기: 학생들이 바라는 이해를 획득했다면 어떻게 그것을 확인할 수 있을지(평가)를 결정함\n③ 3단계-학습경험과 수업 계획하기: 1, 2단계에서 설계한 내용에 근거하여 학습경험과 수업(수업방법)을 계획함","kw":["바라는 결과 확인하기","수용 가능한 증거 결정하기","학습경험과 수업 계획하기"],"id":"gwajeong-e97"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"위긴스와 맥타이가 제안한 교육과정 개발의 첫 단계에서 '교육과정 풀기'의 개념과 백워드 설계 모형의 2단계에서 교사가 해야 하는 일 2가지를 제시하시오.","ans":"교육과정 풀기: 성취기준과 교육내용을 분석하여 바람직한 학습결과를 찾아내는 작업으로, 국가교육과정 문서의 성취기준과 내용체계, 국가교육과정 해설서 등을 활용함\n2단계에서 교사가 해야 하는 일\n① 수행과제와 루브릭 만들기: 실생활에 가까운 맥락에서 열린 문제를 활용하여 평가하는 수행과제 및 프로젝트 평가, 그것을 채점할 루브릭을 만듦 ⇒ 영속적 이해를 가능하게 하는 빅아이디어와 핵심과제, 알고 할 수 있는 것과 관련된 개념과 기능들에 대한 평가계획\n② 다른 증거 결정하기: 선택형, 단답형, 서술식 문항과 같은 전통적인 시험이나 퀴즈 등을 개발하고, 자기평가 기회를 부여하도록 계획함 ⇒ 친숙할 필요가 있는 정보와 사실들, 알고 할 수 있어야 하는 것과 관련된 정보, 사실, 개념, 기능을 평가하기 위한 계획","kw":["성취기준","내용체계","해설서","수행과제","루브릭","열린 문제","빅아이디어","다른 증거","자기평가"],"id":"gwajeong-e98"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"GRASPS","q":"위긴스와 맥타이의 관점에서 수행과제를 개발할 때 고려해야 하는 요소 3가지를 제시하시오. (GRASPS)","ans":"GRASPS\n목표(Goal) - 수행과제를 통해 달성해야 할 목표\n역할(Role) - 학습자가 수행과제에서 맡게 되는 사회적/직업적 역할(ex. 자문가, 기자, 박물관 큐레이터, 역사해설가, CEO 등)\n청중(Audience) - 수행 결과물을 전달받는 실제적 대상/청중(ex. 학부모회, 지역주민, 외국관광객, 저학년 학생들 등)\n상황(Situation) - 학습자가 수행과제에서 맡게 되는 사회적 또는 직업적 역할\n수행(Performance/Product) - 학습자가 보여주어야 할 수행 결과 또는 산출물(ex. 보고서, 포스터, 프레젠테이션 등)\n기준(Standards) - 수행의 질을 판단하기 위한 평가기준 또는 준거(루브릭)","kw":["Goal","Role","Audience","Situation","Performance","Product","Standards","루브릭"],"id":"gwajeong-e99"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"이해중심 교육과정 설계의 3단계에서 교사가 해야 하는 일을 설명하시오.","ans":"① 1, 2단계에서 설계한 내용에 근거하여 학습경험과 수업을 계획함\n② 교사는 수업설계자로서 학생들의 흥미를 이끌어내고 유지하며 교육목표에 도달할 수 있는 수업방법을 구안해야 함","kw":["학습경험과 수업을 계획","수업설계자","흥미","교육목표","수업방법을 구안"],"id":"gwajeong-e100"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"WHERETO","q":"위긴스(Wiggins)와 맥타이(McTighe)가 제안한 학습경험과 수업계획 시 고려할 사항 3가지를 제시하시오.","ans":"① W(Where and What): 단원이 어디로(where) 향하고 있는지, 무엇을(what) 기대하는지 학생이 알 수 있도록 도와줌\n② H(Hook and Hold): 학생의 주의를 환기시키고(hook), 그들의 흥미를 유지(hold)함\n③ E(Equip, Experience, and Explore): 학생을 준비(equip)시키고, 주요 아이디어를 경험(experience)할 수 있도록 하며, 이슈를 탐험(explore)하도록 도움\n④ R(Rethink, Reflect and Revise): 학생의 이해와 활동을 재고(rethink)하고 성찰(reflect)하고 개정(revise)할 수 있는 기회를 제공함\n⑤ E(Evaluate): 작품과 향상도를 평가(evaluate)함\n⑥ T(Tailor): 서로 다른 요구와 흥미, 학습자의 능력에 맞춰(tailor) 개별화함\n⑦ O(Organize): 효과적인 학습뿐만 아니라 주도적·지속적인 참여를 최대화할 수 있도록 조직(organize)함","kw":["Where and What","Hook and Hold","Equip","Experience","Explore","Rethink","Reflect","Revise","Evaluate","Tailor","Organize"],"id":"gwajeong-e101"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"위긴스와 맥타이가 제안한 교육과정 개발모형의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 목표와 평가에 따른 내용설계를 하므로 목표, 내용, 평가가 일체화됨\n② 목표설정과 함께 평가계획을 고려하여 통합적으로 설계하므로 교육에 대한 교사의 책무성이 높아짐\n③ 국가교육과정 성취기준을 목표, 평가, 수업활동에 반영하므로 국가교육과정 기준과 현장수업이 일치하게 됨\n단점\n① 목표를 우위에 두고 교육과정을 설계하게 되므로 교육내용이 목표달성을 위한 수단으로 전락됨\n② 학문적 지식을 강조하여, 학습자의 관심과 흥미가 배제될 가능성이 있음\n③ 평가계획을 수업계획에 앞서 수립하기 때문에 평가 의존적인 수업이 이루어질 가능성이 있음","kw":["일체화","책무성","성취기준","현장수업","수단으로 전락","관심과 흥미","평가 의존적"],"id":"gwajeong-e102"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 교육과정","q":"개념기반 학습의 개념과 개념기반 교육과정의 목적, 개념기반 교육과정에서 '개념'의 특징 2가지를 제시하시오.","ans":"개념: 단편적 사실을 넘어 핵심 개념 간의 관계를 파악하는 사고의 통합을 통해 다양한 상황에 전이 가능한 지식과 역량을 형성하도록 조직된 교육과정\n목적: 학습자가 탐구과정을 통해 학습한 지식을 다른 상황에 일반화할 수 있도록 하는 전이 가능한 지식과 역량을 갖추는 것\n'개념'의 특징\n① 한두 단어(명사) 또는 짧은 구문으로 설명이 가능함\n② 추상적이며, 시간을 초월하며, 보편적임\n③ 새로운 상황 및 맥락으로 전이가 가능함","kw":["단편적 사실","핵심 개념 간의 관계","사고의 통합","전이 가능","일반화","한두 단어","추상적","시간을 초월","보편적"],"id":"gwajeong-e103"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 설계","q":"개념기반 설계의 특징 3가지를 제시하시오.","ans":"① 깊이 있는 이해 추구: 개념적 이해(영속적 이해, 핵심적 이해, 빅아이디어 등으로 표현됨)를 통해 본질적이고 심층적인 이해에 도달하도록 하며, 고차원적 사고력 함양을 중시함\n② 전이 중시: 탐구의 과정을 통해 다양한 상황에 전이 가능한 지식과 역량을 기르는 것을 목적으로 함(≒ 브루너의 학문중심 교육과정)\n③ 시너지적 사고(synergistic thinking) 강조: 시너지적 사고란 저차원적(사실적/기능적) 사고 부분과 고차원적(개념적) 사고 부분이 상호작용할 때에 나타나는 지적 에너지를 의미함. 학습자들이 통합적 사고를 통해 일반화된 개념적 지식을 도출하도록 함\n④ 귀납적 교수와 탐구 강조: 학습자들이 귀납적 접근(사실적 사례를 탐색하여 공통점과 패턴을 찾고, 일반화를 형성하는 것)을 통해 스스로 개념적 이해에 도달하며 의미 있는 학습을 하도록 함","kw":["깊이 있는 이해","개념적 이해","빅아이디어","고차원적 사고력","전이","시너지적 사고","synergistic thinking","귀납적 교수","일반화"],"id":"gwajeong-e104"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 교육과정","q":"개념기반 교육과정에서 '지식의 구조'와 '과정의 구조' 각각의 개념을 제시하시오.","ans":"지식의 구조: '무엇을 아는가'를 넘어 '그 지식이 세상의 작동원리와 어떻게 연결되는가'를 이해하는 틀. 사실적 내용이 상위 개념과 일반화로 조직되며, 이를 통해 의미가 위계적으로 구성되는 내용-의미 기반의 지식체계 ⇒ 내용(content)과 의미(meaning)의 위계\n과정의 구조: '무엇을 할 수 있는가'를 넘어 '그 수행이 어떠한 원리에 의해 효과적으로 발휘되는가'를 이해하는 틀. 기능이 고차적 사고과정으로 조직 및 통합되는 기능-사고 기반의 절차·사고 체계임 ⇒ 기능(skill)과 사고(thinking)의 위계","kw":["작동원리","상위 개념","일반화","내용","의미","위계","고차적 사고과정","기능","사고"],"id":"gwajeong-e105"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 평가","q":"개념기반 수업에서 평가설계의 기본원리 3가지를 제시하시오.","ans":"① 전이가 궁극적인 목적이 됨\n② 실수를 통해 배우는 것을 중시함\n③ 평가를 '옳고 그름'이 아니라 '과정'과 '증거'에 대한 것으로 봄\n④ 지속적인 피드백을 제공해야 함","kw":["전이","실수를 통해 배우는 것","과정","증거","지속적인 피드백"],"id":"gwajeong-e106"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 실행","q":"교육과정 실행의 개념과 중요성 1가지를 제시하시오.","ans":"개념: 가르치는 행위의 실제\n중요성: 좋은 의도를 가지고 계획한 교육과정이라 하더라도 그것이 교사들에 의해 실제 운영되는 교육과정으로 나타나지 않는다면 그것은 교육현장에 아무런 의미를 줄 수 없음","kw":["가르치는 행위의 실제","실제 운영되는 교육과정","교육현장"],"id":"gwajeong-e107"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 실행 관점","q":"스나이더 외(Snyder et al.)가 제안한 교육과정 실행의 관점 3가지를 각 관점에 따른 교사의 역할과 함께 설명하시오.","ans":"① 충실도 관점: 학교에서 실제로 실행되고 있는 교육과정이 원래 계획된 것과 일치해야 한다고 봄 ⇒ 교사의 역할 - 수용자: 교사 연수 또는 교육과정 지침에 따라 개발자의 의도대로 교육과정을 충실하게 실행해야 할 수동적인 역할\n② 상호적응적 관점: 교육과정이 개발자와 실행자 간의 상호작용을 통해 조정 및 변화되는 과정에 중점을 둠 ⇒ 교사의 역할 - 조정자: 학교가 처한 환경적 맥락, 시대적·정치적 상황, 개인적 특성에 따라 계획된 교육과정을 조정하는 역할\n③ 생성적 관점: 교육과정 실행을 실천장면에 있는 당사자인 교사와 학생이 공동으로 교육과정을 창안해내는 과정으로 봄 ⇒ 교사의 역할 - 개발자: 학생들의 주관적인 지각이나 느낌에 근거하여, 교수·학습활동 장면에서 교육과정을 학생과 함께 구성하는 개발자의 역할","kw":["충실도 관점","수용자","상호적응적 관점","조정자","생성적 관점","개발자","창안"],"id":"gwajeong-e108"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"CBAM","q":"홀 외(Hall et al.)의 교사의 관심에 기초한 채택모형(CBAM)의 시사점 2가지를 제시하시오.","ans":"① 교육과정 실행과 교사의 관계 명료화: 관심 정도의 측면에서 새 교육과정에 대한 관심을 이끌어내기 위해서는 교사의 관심 정도를 정확하게 파악하고 구미에 당기는 정보를 제공해 주어야 함\n② 교사 연수의 필요성 제기: 실행수준의 측면에서 교사의 실행수준에 맞는 맞춤형 연수를 제공해 주어야 함\n③ 교육과정 개발-실행 간 시차 고려: 실행수준의 측면에서 새 교육과정의 성공적인 실행을 위해서는 교사의 실행수준이 올라가기까지의 시간을 기다려주어야 함","kw":["관심 정도","구미에 당기는 정보","맞춤형 연수","시차","기다려주어야"],"id":"gwajeong-e109"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"던킨과 비들","q":"던킨과 비들의 교실 내 수업과정 연구모형의 네 가지 변인의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 전조변인: 교수자와 관련된 변인으로 교수자의 경험이나 능력, 특성 등\n② 상황변인(맥락변인): 학습자의 경험 및 특성, 학교와 지역사회의 특성, 교실 특성 등\n③ 과정변인: 교실 내에서 이루어지는 교수자와 학습자의 행동을 모두 포함\n④ 결과변인: 교수·학습 결과로 얻어지는 성과로 교과내용 학습 및 태도 등의 즉각적인 학생 성장과 성인기의 성격 및 직업적 능력 등과 같은 장기적 효과를 포함함","kw":["전조변인","상황변인","맥락변인","과정변인","결과변인","즉각적인 학생 성장","장기적 효과"],"id":"gwajeong-e110"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성의 개념과 교육과정 재구성의 목적 3가지를 제시하시오.","ans":"개념\n① 학교 또는 교사가 국가·지역·학교 수준 교육과정 문서에 제시된 교육목표, 교육내용, 교수·학습방법 및 평가방법 등을 조정하여 자기만의 교육과정을 수립함\n② 이미 만들어진 교육과정을 조정하여 교사(또는 학교)만의 교육과정으로 재구성함\n목적\n① 교육과정이 학습자에게 보다 적합해짐\n② 교육과정 구성과 개발에 대한 교사의 자율성이 높아짐\n③ 교실수업의 효과와 효율성이 높아짐","kw":["조정","자기만의 교육과정","학습자에게 보다 적합","자율성","교실수업의 효과"],"id":"gwajeong-e111"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성의 절차를 설명하시오.","ans":"① 재구성을 위한 분석: 교육과정 분석, 학생의 특성과 수준 분석, 학교 여건 분석\n② 재구성 유형 결정: 교육과정의 학습자 적절성을 고려하여 재구성 유형(교과 내 재구성, 교과 간 재구성, 교과와 창의적 체험활동 연계를 통한 재구성)을 결정함\n③ 목표 재구성: 학습자의 수준에 따라서 목표를 재구성하거나 핵심역량 등 특정한 능력의 신장을 위해서 목표를 재구성함\n④ 내용 재구성: 재구성할 학습요소를 선정함(1차 재구성-교과 수준, 2차 재구성-학생 수준)\n⑤ 교수방법 계획: 교수전략을 구안하고, 교수설계, 학생참여 수업방법 계획 등을 수립함\n⑥ 평가 계획: 형성평가, 수행평가, 자기평가 및 모둠평가 계획을 수립함","kw":["재구성을 위한 분석","재구성 유형 결정","목표 재구성","내용 재구성","교수방법 계획","평가 계획","1차 재구성","2차 재구성"],"id":"gwajeong-e112"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성을 위한 분석의 대상 3가지를 설명하시오.","ans":"① 교육과정 분석: 교육과정 성취기준, 교육과정 해설서, 교과서, 교사용 지도서, 시·도 교육청 편성·운영 지침서, 학교교육과정 등을 분석함\n② 학생의 특성과 수준: 학생의 인지적·정의적 특성 및 관심을 분석함\n③ 학교 여건: 지역사회의 특성과 학습자원, 학부모의 특성과 요구, 학교 시설 및 풍토를 분석함","kw":["성취기준","해설서","교과서","교사용 지도서","인지적","정의적 특성","지역사회","학습자원","학교 시설","풍토"],"id":"gwajeong-e113"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성의 유형 3가지를 각각을 수행하는 구체적인 방안 2가지와 함께 제시하시오.","ans":"① 교과 내 재구성: 교육과정이 제시한 핵심 성취기준을 중심으로 교과서의 순서 변경하기, 새로운 내용 추가하기, 내용 생략 및 압축하기, 내용 수준 변경하기 등의 방식\n② 교과 간 재구성: 특정한 교과를 중심으로 다른 교과의 내용을 연계하거나 통합하는 방식과 각 교과에 공통되는 주제(환경, 배려, 지구온난화, 다문화 등과 같은 주제)를 중심으로 각 교과에 해당되는 내용을 융합하여 프로젝트 수업의 형태로 진행하는 방식\n③ 교과와 창의적 체험활동의 연계를 통한 재구성: 교과와 창의적 체험활동을 연계하여 수업을 진행하는 방식","kw":["교과 내 재구성","순서 변경","내용 추가","생략 및 압축","수준 변경","교과 간 재구성","연계","통합","공통되는 주제","프로젝트 수업","창의적 체험활동"],"id":"gwajeong-e114"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"학교교육과정","q":"학교교육과정 개발·운영을 위해 교사가 해야 하는 일 3가지를 제시하시오.","ans":"① 국가교육과정 기준 및 시·도 교육청 지침 분석: 각 학교에서 교육 실천계획을 수립하고 중점 교육내용과 방법을 선택하고자 할 때, 그 근거가 되는 국가교육과정 기준과 시·도 교육청 지침을 자세히 분석해야 함\n② 학교의 교육여건 파악: 학교의 특성에 맞는 교육과정을 편성·운영하기 위해 학생·교원 실태, 교육시설·설비·자료, 학부모 및 지역사회의 특성 등의 교육여건을 파악해야 함\n③ 학교교육과정 운영계획 및 세부 실천계획 수립: 학교의 여건과 실태에 대한 구체적인 인식에 기초하여 학생에게 실천 가능한 교육설계도를 마련하고, 설계도에 담긴 특색을 구현할 수 있는 운영계획 및 세부 실천계획을 수립해야 함\n④ 전문성 신장을 위한 지속적인 노력: 학교수준 교육과정을 도모하는 과정에서 교사는 교육과정 실행자뿐만 아니라 개발자로서의 역할까지 수행해야 하므로, 이에 필요한 전문성 신장의 노력을 필요로 함","kw":["국가교육과정 기준","시·도 교육청 지침","교육여건 파악","운영계획","세부 실천계획","교육설계도","전문성 신장","실행자","개발자"],"id":"gwajeong-e115"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"뱅크스(Banks)의 관점에서 다문화교육의 목적 3가지를 제시하시오.","ans":"① 모든 학생들이 긍정적 자아개념을 갖도록 함\n② 다양한 인종집단으로부터 온 사람들과 협력할 수 있는 능력을 기름\n③ 정의로운 태도로 다원주의 사회에서 상호작용하고, 타협하고, 효과적으로 의사소통할 수 있는 능력을 키움\n④ 다문화사회의 정치적, 경제적, 사회적 제도에 유능하게 참여할 수 있는 능력을 기름\n⑤ 다문화사회에서 보다 윤리적으로 의사결정할 수 있는 능력을 기름","kw":["긍정적 자아개념","협력","다원주의 사회","타협","의사소통","제도에 유능하게 참여","윤리적으로 의사결정"],"id":"gwajeong-e116"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"게이(Gay)의 관점에서 다문화교육이 이루어져야 하는 이유를 학문, 문화, 사회정의의 관점에서 각각 서술하시오.","ans":"① 학문적 목적: 교육과정과 수업을 다양화함으로써 다문화집단 간 학업성취 격차를 해소하고자 함\n② 문화적 목적: 자신이 속한 집단의 문화가 보편타당한 것이라는 관점 ⇒ 타 문화를 그들의 맥락에서 이해하는 것으로 변화해야 함\n③ 사회정의적 목적: 사회적 차별을 인식하고, 이를 발생시키는 불평등 문제를 해결하기 위해 실천하는 사람을 양성해야 함 ⇒ 불평등 문제에 대한 지식, 이를 해결할 수 있는 능력, 그리고 실천에의 의지가 모두 중요함","kw":["학문적 목적","학업성취 격차","문화적 목적","보편타당","그들의 맥락","사회정의적 목적","사회적 차별","불평등","실천에의 의지"],"id":"gwajeong-e117"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"다문화교육의 영역 중 '편견 감소'와 '평등한 수업'의 목적을 제시하시오.","ans":"편견 감소의 목적: 교사들은 학생들을 다양한 문화에 대한 이해, 공감, 존중을 촉진하는 활동과 토론에 참여시키면서 타 문화에 대한 부정적인 태도와 오해를 줄이도록 해야 함\n평등한 수업의 목적\n① 각자의 다양한 학습스타일이나 배경을 고려해서 배울 수 있음\n② 다양한 문화적 배경을 가진 학생들의 성공을 지원하는 포용적인 수업환경을 조성함","kw":["이해","공감","존중","부정적인 태도","오해","학습스타일","포용적인 수업환경"],"id":"gwajeong-e118"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"뱅크스 다문화교육과정","q":"뱅크스(Banks)의 관점에서 다문화 교육과정의 유형 5가지의 명칭과 유형별 특징 각 1가지를 제시하시오.","ans":"① 기여모형 - 교육과정 유지: 기존 교육과정의 구조, 목적, 특성들을 있는 그대로 유지한 상태에서 이벤트성 학교교육활동으로 다문화 관련 개념, 주제, 활동, 관점 등을 다루는 모형\n② 부가모형 - 교육과정 유지: 기존 교육과정의 구조 등이 큰 변화 없이 유지된 상태에서 다문화적 내용, 개념, 주제, 활동, 관점 등을 교육과정에 추가하는 모형\n③ 전환적(변혁적) 모형 - 교육과정 변화: 교육과정의 목표, 구조, 관점을 근본적으로 변혁시켜서 학생들이 다양한 문화, 민족, 인종집단의 관점에서 개념, 이슈, 사건, 주제를 바라볼 수 있도록 함\n④ 사회행동모형 - 교육과정 변화: 다문화 관련 내용을 반영할 수 있도록 학교교육과정을 근본적으로 개정하는 것(변혁모형)을 넘어서 학생들이 다문화 관련 문제들을 해결하기 위해 행동할 것을 강조함\n⑤ 혼합모형: 앞에서 다룬 네 가지 기여모형, 부가모형, 전환(변혁)적 모형, 사회행동모형을 실제 교육과정 운영상황에 맞게 적절히 혼합하여 활용함","kw":["기여모형","부가모형","전환적","변혁적","사회행동모형","혼합모형","교육과정 유지","교육과정 변화","이벤트성","근본적으로 변혁"],"id":"gwajeong-e119"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"모두를 위한 교육과정","q":"'모두를 위한 교육과정'의 개념과 브래이(Bray)와 맥클라스키(McClaskey)의 이론에 따를 때 모두를 위한 교육과정에 대한 관점 3가지와 관점별 개념 및 실행의 주체를 설명하시오.","ans":"'모두를 위한 교육과정': 포기하는 학생 없이 모든 학생이 자신의 가능성을 온전히 실현할 수 있도록 돕는 책임교육\n① 개별화(individualization) ⇒ 실행의 주체: 교사\n: 교사가 다양한 학생들의 개별 학습 필요에 맞추어 교수하는 것. 학습목표는 모든 학생들에게 동일하되, 학생들이 자신의 학습 필요에 따라 상이한 속도로 성장해 나갈 수 있도록 함\n② 차별화(맞춤형)(differentiation) ⇒ 실행의 주체: 교사\n: 교사가 다양한 학생 그룹의 학습 선호에 맞추어 교수하는 것. 모든 학생들은 공통내용을 배우고 공통 학습목표에 도달할 수 있어야 하되, 학생들의 흥미, 선호도, 장점, 약점 등에 따라 교수방법이나 접근을 다양하게 하여 맞춤형으로 수업이 제공됨\n③ 개인화(personalization) ⇒ 실행의 주체: 학습자\n: 학생들의 다양한 학습 필요나 선호, 관심이 반영된 개인화된 학습환경에서 학생들이 학습목표, 내용, 방법, 속도 등을 달리할 수 있는 것","kw":["책임교육","개별화","individualization","차별화","differentiation","개인화","personalization","상이한 속도","공통 학습목표","학습환경"],"id":"gwajeong-e120"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"UDL","q":"보편적 학습설계(Universal Design for Learning, UDL)의 목적과 보편적 학습설계를 위한 세 가지 방안을 설명하시오.","ans":"목적: 장애, 언어 등 학생들의 다양성을 적극 포용하여 모든 학습자의 성장을 위함\n방안\n① 다양한 내용 제시방법: 같은 교육내용이라도 다양한 방식의 표상(언어, 수식, 기호 등)으로 제공함\n② 다양한 표현수단: 신체적 표현방식, 의사소통을 위한 매체 선택 등을 고려해 학습자의 요구와 선호하는 표현방법을 존중하고, 연습이나 수행의 기회를 제공해 유창성을 높임\n③ 다양한 참여방식: 학습자 특성과 학습동기를 파악하여 학습자와의 관련성을 높이고 참여방식의 선택권을 제공함. 더불어 친구들과의 협력적 분위기나 자기학습 조절 및 평가와 성찰의 기회를 제공함","kw":["다양성을 적극 포용","다양한 내용 제시방법","표상","다양한 표현수단","유창성","다양한 참여방식","선택권","협력적 분위기"],"id":"gwajeong-e121"},{"ch":"CH06 우리나라 교육과정","t":"국가수준 교육과정","q":"국가수준 교육과정의 성격과 장점, 단점 각각 2가지를 제시하시오.","ans":"성격\n① 국가수준의 공통성과 지역·학교·개인 수준의 다양성을 동시에 추구하는 교육과정임\n② 학습자의 자율성과 창의성을 신장하기 위한 학생중심의 교육과정임\n③ 학교교육의 체제를 교육과정 중심으로 구현하기 위한 교육과정임\n④ 학교교육의 질적 수준을 관리·개선하기 위한 교육과정임\n장점\n① 전국의 모든 학교에 공통적인 교육과정을 개발함으로써 전국적인 학교교육의 수준과 질을 조절할 수 있음\n② 장기적인 노력에 의해 개발된 것이므로 어느 정도의 지속성이 보장되며, 학생이 학교를 옮기더라도 교육의 계속성이 보장됨\n③ 전문인력 및 물적 자원 투입을 통해 전문성 높은 교육과정이 개발됨\n④ 지역이나 학교 단위에서의 교육과정 개발을 위한 노력, 재정, 시간 등을 줄일 수 있음\n⑤ 교육의 목적 달성에 필요한 교육적 기준이 됨\n단점\n① 교사 배제 교육과정으로, 교사가 교육과정 개발에서 적극적인 역할을 수행하지 못할 경우, 교육과정을 중요하게 생각하지 않는 '교육과정 사소화 현상'이 나타날 수 있음\n② 교육과정 운영의 획일화·경직화가 우려됨\n③ 지역, 학교 등의 특수성을 고려한 교육과정 운영이 어려움","kw":["공통성","다양성","자율성","창의성","질적 수준","수준과 질을 조절","지속성","계속성","교사 배제","교육과정 사소화","획일화","경직화"],"id":"gwajeong-e122"},{"ch":"CH06 우리나라 교육과정","t":"지역수준 교육과정","q":"지역수준 교육과정의 특징과 장점, 단점 각각 2가지를 제시하시오.","ans":"특징: 지역수준의 교육과정 편성·운영지침은 국가수준과 학교교육과정을 자연스럽게 이어주는 교육과정\n장점\n① 지역의 특수성을 반영한 다양한 교육과정 운영이 가능함\n② 시·도 교육청 단위에서 교사들의 참여를 유도할 수 있음\n③ 변화에 따른 교육과정의 유연한 수정 및 운영이 가능함\n단점\n① 인적·물적 자원의 한계로 인해 국가수준 교육과정에 비해 질이 낮은 교육과정이 개발될 수 있음\n② 지역 간 격차가 심화될 수 있음","kw":["이어주는 교육과정","지역의 특수성","교사들의 참여","유연한 수정","인적","물적 자원의 한계","지역 간 격차"],"id":"gwajeong-e123"},{"ch":"CH06 우리나라 교육과정","t":"학교수준 교육과정","q":"학교수준 교육과정의 성격 2가지와 학교교육과정 편성·운영의 이점 2가지를 제시하시오.","ans":"성격\n① 구체적 실행을 위한 교육과정: 학교교육과정은 국가수준 교육과정 기준과 시·도 교육청 교육과정 편성·운영지침을 근거로 지역의 특수성과 학교의 실정, 학생의 실태에 알맞게 학교별로 마련한 '당해 학교에서 구체적 실행을 위한 교육과정'임\n② 학교의 교육설계도: 학교교육과정은 학교가 수용하고 있는 학생들에게 책임지고 실현해야 할 교육목표, 내용, 방법, 평가 등에 대한 구체적인 실행 교육프로그램이자 특색 있는 교육설계도임\n③ 학교의 특성 반영: 학교교육과정은 해당 학교의 교육목표와 경영철학, 전통, 특성 등이 치밀하게 반영되어 있고 그 학교의 창의적이고 독특한 교육내용, 방법과 특색 있는 운영방안이 나타남\n이점\n① 교육과정 중심·학습자 중심 교육 실현\n② 지역 및 학교 특성에 맞는 교육 실현","kw":["구체적 실행","교육설계도","경영철학","전통","특성","교육과정 중심","학습자 중심"],"id":"gwajeong-e124"},{"ch":"CH06 우리나라 교육과정","t":"편성·운영 조직","q":"학교 교육과정 편성·운영 조직 3가지, 각 조직의 역할과 구성원을 제시하시오.","ans":"① 학교교육과정위원회: 학교교육과정 계획 수립부터 시안을 만드는 작업에 이르기까지 전문적인 역할을 수행함 ⇒ 구성원: 학교 규모에 따라 구성원이 달라지지만, 교원, 교육전문가, 학부모 등이 참여하는 형태\n② 학교운영위원회: 교육과정에 대한 심의를 실시하고, 개정 교육과정을 확정·공포함 ⇒ 구성원: 교육과정 심의에서 민주성과 대표성을 확보할 수 있는 학교 교원 대표, 학부모 대표 및 지역사회 인사로 구성됨\n③ 교사와 교과협의회: 학교교육과정을 전개(수업)하고 활용하며, 교과내용이나 수업방법 등을 자율적으로 결정하여 수업을 진행함 ⇒ 구성원: 개별 교사 또는 교과·학년협의회로 구성됨","kw":["학교교육과정위원회","시안","학교운영위원회","심의","확정·공포","민주성","대표성","교과협의회","자율적으로 결정"],"id":"gwajeong-e125"},{"ch":"CH06 우리나라 교육과정","t":"탄력적 운영","q":"단위학교 수준 교육과정의 탄력적 운영방안 2가지를 제시하시오.","ans":"① 교육과정 재구성: 교육과정상에 있는 내용요소를 중심으로 교사가 순서와 내용을 재조정함\n② 교과목의 탄력적 편성: 국가교육과정에 편성된 모든 교과목을 모든 학기에 걸쳐 편성하지 않고 특정 학년 또는 학기에 집중 편성함\n③ 수업시간의 탄력적 운영: 학교 특성이나 학교·교사·학부모의 요구 및 필요에 따라 교과(군)별 및 창의적 체험활동 시수의 20% 범위 내에서 시수를 증감하여 편성·운영할 수 있음\n④ 새로운 교과목 신설: 필요에 따라서 국가교육과정에 없는 과목을 신설할 수 있음","kw":["교육과정 재구성","교과목의 탄력적 편성","집중 편성","수업시간의 탄력적 운영","20% 범위","시수를 증감","새로운 교과목 신설"],"id":"gwajeong-e126"},{"ch":"CH06 우리나라 교육과정","t":"자유학기제","q":"자유학기제의 특징 3가지를 제시하시오.","ans":"① 일제식 지필평가를 실시하지 않고 과정중심평가를 실시함\n② 체계적인 진로탐색 기회를 확대함\n③ 학생의 개인별 특성과 역량에 맞는 진로설계를 지원하기 위한 진로상담·검사체제를 구축하고 자신의 소질과 적성을 직접적인 체험을 통해 확인하는 기회를 활성화하는 등 개인별 진로를 관리하도록 함\n④ 학생의 관심과 흥미를 불러일으키는 체험형·참여형 프로그램 강화\n⑤ 유연한 교육과정을 편성·운영할 수 있도록 함","kw":["일제식 지필평가","과정중심평가","진로탐색","진로상담","검사체제","체험형","참여형","유연한 교육과정"],"id":"gwajeong-e127"},{"ch":"CH06 우리나라 교육과정","t":"집중이수제","q":"집중이수제의 개념과 이러한 제도의 장점과 단점 각각 2가지를 제시하시오.","ans":"개념: 수업의 집중도를 높이기 위해 특정한 과목의 수업을 일정 기간(초·중·고 학기 중 특정 학기나 학년)에 집중적으로 학습하는 제도\n장점\n① 특정 학기 또는 학년에 몰아서 집중적으로 학습할 수 있음\n② 수업 효율성이 높음\n단점\n① 한꺼번에 많은 분량을 배우게 되어 내용을 이해하기 어려움\n② 학생의 성장·발달단계와 학습단계가 맞지 않는 경우가 발생할 수 있음","kw":["집중도","일정 기간","집중적으로 학습","수업 효율성","많은 분량","성장·발달단계"],"id":"gwajeong-e128"},{"ch":"CH06 우리나라 교육과정","t":"블록타임제","q":"블록타임제의 개념과 장점 2가지를 제시하시오.","ans":"개념\n① 기존 45~50분으로 이루어지던 단위수업을 2~3시간 연속으로 운영하는 방식\n② 교과내용, 수업방법에 따라서 70~100분 등 여러 형태로 수업시간을 탄력적으로 운영할 수 있음\n장점\n① 수업의 흐름을 끊지 않고 연속적으로 진행할 수 있음\n② 심층적인 수업으로 교육의 질을 높일 수 있음","kw":["45~50분","2~3시간 연속","70~100분","탄력적","수업의 흐름","심층적인 수업"],"id":"gwajeong-e129"},{"ch":"CH06 우리나라 교육과정","t":"고교학점제","q":"고교학점제의 교육과정, 평가, 교사역할, 학교공간 측면에서의 특징 각각 1가지를 제시하시오.","ans":"교육과정 측면에서의 특징 - 학생중심 교육과정 편성·운영: 개개인의 진로를 고려하여 다양한 선택과목을 개설하고 학생은 자신이 희망하는 선택과목을 직접 수강신청하여 개인 수업시간표를 편성함\n평가 측면에서의 특징 - 학생평가 내실화: 수업과 연계한 과정중심평가를 강화하고 성취평가를 내실화하며 최소 학업성취수준을 보장함\n교사역할 측면에서의 특징: 학생의 진로·학업설계 및 과목 선택 지도, 교수·학습 및 평가의 실행, 교육과정의 편성·운영 및 협력적인 학교문화 형성 등을 위한 교사의 역할 변화가 필요함\n학교공간 측면에서의 특징: 선택과목이 증가하고 학생 이동이 증가함에 따라 휴식, 자율, 모둠학습 등의 복합적 기능의 홈베이스 조성","kw":["학생중심 교육과정","선택과목","수강신청","개인 수업시간표","과정중심평가","성취평가","최소 학업성취수준","진로·학업설계","협력적인 학교문화","홈베이스"],"id":"gwajeong-e130"}]},"교육방법및공학":{"mc":[{"ch":"CH01 교육공학","t":"학습자중심교육","q":"학습자중심교육을 구현하기 위한 방안으로 제시되지 않은 것은?","opts":["교사 주도의 일제식 지식 전달 수업","탐구·발견 중심의 수업","개인차를 고려한 개별지도","사고력·문제해결력 증진을 위한 수업"],"a":0,"exp":"학습자중심교육 구현 방안은 ①탐구·발견 중심의 수업 ②개인차를 고려한 개별지도 ③사고력·문제해결력 증진을 위한 수업 ④능동적인 수업 참여 ⑤다양한 학습자료에 의존이다.","id":"bangbeop-m0"},{"ch":"CH01 교육공학","t":"학습자중심교육","q":"학습자중심교육에서 교사의 역할로 제시된 것은?","opts":["수업의 안내자, 동료학습자, 학습촉진자","지식의 전달자, 평가자, 관리자","교육과정 개발자, 심의자, 공포자","시범자, 통제자, 감독자"],"a":0,"exp":"학습자중심교육에서 교사의 역할은 ①수업의 안내자 ②동료학습자 ③학습촉진자이다.","id":"bangbeop-m1"},{"ch":"CH01 교육공학","t":"학습자중심교육","q":"학습자중심교육의 장점으로 제시되지 않은 것은?","opts":["교육의 효율성과 경제성이 극대화됨","흥미 있는 수업","창의력 향상","학습자의 성취욕구 충족, 개인차를 인정하는 교육"],"a":0,"exp":"학습자중심교육의 장점은 ①흥미 있는 수업 ②창의력 향상 ③학습자의 성취욕구 충족 ④개인차를 인정하는 교육이다.","id":"bangbeop-m2"},{"ch":"CH01 교육공학","t":"객관주의와 구성주의","q":"교수목표 측면에서 객관주의와 구별되는 구성주의의 특징으로 옳은 것은?","opts":["학습자가 아이디어를 스스로 이해하고 구성할 수 있는 학습경험을 제공함","가장 효과적·효율적인 방식으로 학습자에게 지식이나 기술을 전달하는 것","주어진 지식이나 기능을 잘 습득했는지를 확인함","지식전달식 교수를 통해 목표를 달성함"],"a":0,"exp":"교수목표에서 객관주의는 가장 효과적·효율적인 방식으로 지식이나 기술을 전달하는 것인 반면, 구성주의는 학습자가 아이디어를 스스로 이해하고 구성할 수 있는 학습경험을 제공한다.","id":"bangbeop-m3"},{"ch":"CH01 교육공학","t":"객관주의와 구성주의","q":"평가 측면에서 구성주의의 특징으로 옳은 것은?","opts":["실제적 과제를 수행하고 문제를 해결할 수 있는 능력을 갖추었는가를 확인","주어진 지식이나 기능을 잘 습득했는지를 확인","지식전달식 교수의 효율성을 확인","학습자의 상대적 서열을 확인"],"a":0,"exp":"평가에서 객관주의는 주어진 지식이나 기능을 잘 습득했는지를 확인하는 반면, 구성주의는 실제적 과제를 수행하고 문제를 해결할 수 있는 능력을 갖추었는가를 확인한다.","id":"bangbeop-m4"},{"ch":"CH01 교육공학","t":"비고츠키 지식론","q":"비고츠키(Vygotsky) 지식론의 명칭과 이 지식론에서 학습의 성격으로 옳은 것은?","opts":["사회적 구성주의 / 학습은 사회적으로 맥락화된 지식을 학습자가 내면화하는 과정임","인지적 구성주의 / 학습은 개인의 인지갈등 해소 과정임","객관주의 / 학습은 지식의 전달을 통해 이루어짐","행동주의 / 학습은 관찰 가능한 행동의 변화임"],"a":0,"exp":"비고츠키의 지식론은 사회적 구성주의이며, 학습은 사회적으로 맥락화된 지식을 학습자가 내면화하는 과정이다.","id":"bangbeop-m5"},{"ch":"CH01 교육공학","t":"비고츠키 지식론","q":"사회적 구성주의에서 교사의 역할로 옳은 것은?","opts":["학생이 새로운 지식과 기술을 습득함에 있어 활발한 사회적 상호작용의 기회를 제공하고, 효과적 학습이 이루어질 수 있도록 알맞은 비계(scaffolding)를 제공함","지식을 효율적으로 전달하고 평가함","학습자를 통제하고 관리함","교육과정을 개발하고 심의함"],"a":0,"exp":"교사는 활발한 사회적 상호작용의 기회를 제공하고 알맞은 비계(scaffolding)를 제공한다. 학습은 동료학습자나 주변인물과의 상호작용을 통하여 촉진된다.","id":"bangbeop-m6"},{"ch":"CH01 교육공학","t":"구성주의 교수설계","q":"구성주의 교수설계에서 학습자와 교사의 역할로 옳은 것은?","opts":["학습자 — 학습의 주체로서 학습경험을 통해 능동적으로 의미를 구성함 / 교사 — 학습자의 학습을 돕는 조언자이자 안내자, 함께 배워나가는 동료학습자","학습자 — 지식을 수용하는 수동적 존재 / 교사 — 지식의 전달자","학습자 — 평가의 대상 / 교사 — 평가자","학습자 — 프로그램 실행자 / 교사 — 수업관리자"],"a":0,"exp":"구성주의 교수설계에서 학습자는 학습의 주체로 능동적으로 의미를 구성하고, 교사는 조언자·안내자·동료학습자이다.","id":"bangbeop-m7"},{"ch":"CH01 교육공학","t":"구성주의 교수설계","q":"구성주의 교수설계에서 과제의 성격으로 옳지 않은 것은?","opts":["학습자의 삶과 분리된 추상적이고 일반적인 과제여야 함","구체성·관련성: 학습자에게 의미 있고 적절한 과제, 구체적이고 학습자의 삶과 관련성이 있는 과제","실제 상황과 맥락 강조: 지식이 실제 적용되는 상황이나 현장과 관련해서 학습이 이루어질 때 학습이 실제적이며 학교학습이 사회적 과제해결 상황에서의 유용성과 적용 가능성을 가질 수 있게 됨","활발한 의미협상의 과정: 과제해결을 위해서는 학습자 간 활발한 의미협상이 일어날 수 있는 협동학습이 필요함"],"a":0,"exp":"구성주의 교수설계의 과제는 구체적이고 학습자의 삶과 관련성이 있어야 하므로 ①은 정반대이다.","id":"bangbeop-m8"},{"ch":"CH01 교육공학","t":"구성주의 교수설계","q":"구성주의 교수설계에서 과제해결을 지원하는 방안으로 옳은 것은?","opts":["협동학습 강조와 학습자원의 제공","반복 암기와 문제풀이 훈련","일제식 강의와 지필평가","교사 주도의 시범과 모방"],"a":0,"exp":"과제 해결지원 방안은 ①협동학습 강조(학습자가 사회적 상호작용을 통해 능동적으로 학습에 참여할 수 있도록 함) ②학습자원의 제공(학습과제를 스스로 해결하기 위해 사용할 수 있는 다양한 자원 제공)이다.","id":"bangbeop-m9"},{"ch":"CH01 교육공학","t":"벌로 SMCR","q":"벌로(Berlo)의 SMCR 모형에서 송신자와 수신자를 구성하는 요소 5가지로 옳은 것은?","opts":["통신기술, 태도, 지식수준, 사회체계, 문화양식","내용, 요소, 구조, 코드, 처리","시각, 청각, 촉각, 미각, 후각","경험, 흥미, 태도, 능력, 동기"],"a":0,"exp":"송신자와 수신자를 구성하는 요소는 통신기술, 태도, 지식수준, 사회체계, 문화양식이다. ②는 전달내용(Message)의 구성요소이다.","id":"bangbeop-m10"},{"ch":"CH01 교육공학","t":"벌로 SMCR","q":"벌로(Berlo)의 SMCR 모형에서 전달내용(Message)의 구성요소 중 '구조'에 해당하는 설명은?","opts":["선택된 내용을 조직하는 방식(ex. 순서)","전달하고자 하는 것","많은 내용 중에서 어떤 내용을 선택하는가에 대한 것","내용을 전달하는 방식"],"a":0,"exp":"전달내용의 구성요소는 내용, 요소, 구조, 코드, 처리이며, 구조는 선택된 내용을 조직하는 방식이다. ②는 내용, ③은 요소, ④는 처리이다.","id":"bangbeop-m11"},{"ch":"CH01 교육공학","t":"벌로 SMCR","q":"벌로(Berlo) SMCR 모형의 시사점으로 옳은 것은?","opts":["송신자와 수신자의 통신기술, 태도, 지식수준, 사회체계, 문화양식이 유사할수록 커뮤니케이션이 원만해짐","송신자의 통신기술만 뛰어나면 완전한 의사소통이 이루어짐","메시지의 코드는 언어적 코드만으로 구성됨","의사소통에서 잡음은 문제가 되지 않음"],"a":0,"exp":"시사점은 송신자와 수신자의 다섯 요소의 유사성 정도에 따라 메시지가 일치할 수도 있지만 대부분 완전히 일치하지 않으며, 유사할수록 커뮤니케이션이 원만해진다는 것이다.","id":"bangbeop-m12"},{"ch":"CH01 교육공학","t":"섀넌-슈람","q":"섀넌(Shannon)-슈람(Schramm)의 커뮤니케이션 모형의 관점에서 의사소통의 효과성을 높이는 방안으로 옳은 것은?","opts":["송신자와 수신자의 경험의 장이 일치할수록 메시지가 의도한 대로 해석될 가능성이 커지므로 활발한 피드백을 주고받음으로써 경험의 장의 일치도를 높여감","송신자의 지식수준을 최대한 높임","수신자의 반응을 배제하고 일방적으로 전달함","잡음을 그대로 두고 메시지를 반복함"],"a":0,"exp":"의사소통의 효과성을 높이는 방안은 ①활발한 피드백을 통해 경험의 장의 일치도를 높임 ②물리적 잡음(소음, 통신 불안정성 등), 심리적 잡음(편견, 선입견, 거부감 등), 의미적 잡음(모호한 표현 등)을 제거하는 것이다.","id":"bangbeop-m13"},{"ch":"CH01 교육공학","t":"섀넌-슈람","q":"섀넌-슈람 모형에서 '심리적 잡음'의 예로 옳은 것은?","opts":["송신자와 수신자 사이의 편견, 선입견, 거부감","소음, 통신 불안정성","모호한 표현","문화양식의 차이"],"a":0,"exp":"물리적 잡음은 소음·통신 불안정성, 심리적 잡음은 편견·선입견·거부감, 의미적 잡음은 모호한 표현 등이다.","id":"bangbeop-m14"},{"ch":"CH02 교수설계모형과 이론","t":"수업요구분석","q":"수업요구분석의 개념으로 옳은 것은?","opts":["학습자의 현재 상태에서 바람직한 상태의 차이를 확인하고 원인을 규명하며 이루어짐. 이때 '차이'는 바람직한 상태에서 현재 상태를 뺀 것","학습자의 특성을 성별, 연령, 학습능력 등으로 분석하는 것","수업매체, 학생 수, 교실의 크기 등을 분석하는 것","학습과제를 하위 기능으로 분석하는 것"],"a":0,"exp":"수업요구분석은 학습자의 현재 상태에서 바람직한 상태의 차이를 확인하고 원인을 규명하는 것으로, '차이'는 바람직한 상태에서 현재 상태를 뺀 것이다.","id":"bangbeop-m15"},{"ch":"CH02 교수설계모형과 이론","t":"수업요구분석","q":"수업요구분석의 필요성으로 옳은 것은?","opts":["수업에서 교수학습의 문제가 발생했을 때 그 원인을 분석하고 최적의 해결방안을 도출하기 위해 필요하며, 적절한 수업목표 수립과 효과적인 수업내용·수업방법·평가전략 선정 및 개발의 근거가 됨","학습자의 서열을 산출하기 위해 필요함","교수매체를 선정하기 위해서만 필요함","교사의 수업 부담을 줄이기 위해 필요함"],"a":0,"exp":"수업요구분석은 문제의 원인 분석과 최적의 해결방안 도출, 적절한 수업목표 수립과 수업내용·방법·평가전략 선정 및 개발의 근거가 된다.","id":"bangbeop-m16"},{"ch":"CH02 교수설계모형과 이론","t":"수업요구분석","q":"수업요구분석의 기법 중 '초점집단 인터뷰'에 해당하는 설명은?","opts":["관심을 두는 대상집단 중에서 해당 사안을 가장 적절하게 대변할 수 있는 사람들을 선발하여 그룹을 편성한 후 집단면담을 실시하는 기법","관심집단의 작은 표본을 대상으로 다양한 정보를 수집하기 위함","직접 관련된 사람을 찾아가 대화를 통해 필요한 정보를 얻는 방법","실제 현장을 방문하여 당사자의 실제 수행 정도 및 그를 둘러싼 환경의 제약조건이나 실태를 파악하는 것"],"a":0,"exp":"초점집단 인터뷰는 사안을 가장 적절히 대변할 수 있는 사람들을 선발해 그룹을 편성한 후 집단면담을 실시하는 기법이다. ②는 설문조사, ③은 면담, ④는 관찰이다.","id":"bangbeop-m17"},{"ch":"CH02 교수설계모형과 이론","t":"학습자·맥락 분석","q":"수업맥락분석 시 살펴보아야 하는 것의 예로 옳은 것은?","opts":["수업매체, 학생 수, 교실의 크기, 교실의 형태, 책상 배치 형태, 칠판과 스크린의 크기 및 위치, 마이크 시설 등","성별, 연령, 학습능력, 학습동기, 관심사 등","선행학습 정도, 학습동기, 자아개념, 주의력","강화, 접근, 연습"],"a":0,"exp":"수업맥락분석의 예는 수업매체, 학생 수, 교실의 크기·형태, 책상 배치 형태, 칠판과 스크린의 크기 및 위치, 마이크 시설 등이다. ②는 학습자특성분석이다.","id":"bangbeop-m18"},{"ch":"CH02 교수설계모형과 이론","t":"수업목표","q":"수업목표의 역할로 제시되지 않은 것은?","opts":["학습자 간 서열을 결정하는 준거가 됨","수업에 대한 방향을 제시","수업내용 선정과 조직의 지침이 됨","학습을 촉진시킴, 평가의 준거로 활용됨"],"a":0,"exp":"수업목표의 역할은 ①수업에 대한 방향을 제시 ②수업내용 선정과 조직의 지침 ③학습을 촉진 ④평가의 준거로 활용이다.","id":"bangbeop-m19"},{"ch":"CH02 교수설계모형과 이론","t":"신교육목표분류학","q":"앤더슨(Anderson)과 크래스월(Krathwohl)의 신교육목표분류학이 블룸(Bloom)의 인지영역 교육목표분류학과 구별되는 특징으로 옳지 않은 것은?","opts":["인지수준을 명사형으로 제시하고 '지식'을 하나의 통합된 영역으로 유지함","동사형 제시: Bloom의 인지수준 6단계는 명사형으로 제시되었으나 신교육목표분류학에서는 동사형으로 제시되었고, '지식' 영역은 별도로 독립되고 지식 대신 '기억하다'는 동사로 대체됨","종합과 평가의 위계 변화: Bloom의 6단계에서 가장 상위 능력이었던 종합과 평가의 위계가 바뀌었으며 '종합'은 '창안하다'로 변경됨","지식의 독립과 세부 유형화: Bloom이 단지 '지식'이라고 보았던 것을 4가지 세부유형(사실적, 개념적, 절차적, 메타인지적 지식)으로 나눔"],"a":0,"exp":"신교육목표분류학은 동사형으로 제시하고 지식을 4가지 세부유형으로 나누었으므로 ①은 정반대이다.","id":"bangbeop-m20"},{"ch":"CH02 교수설계모형과 이론","t":"신교육목표분류학","q":"신교육목표분류학의 지식차원 중 '개념적 지식'에 해당하는 것은?","opts":["범주, 원리, 이론 등의 상호관계에 대한 지식","기본적인 정보와 용어, 세부사항에 대한 지식","방법, 기술, 알고리즘, 과정에 대한 지식","자신의 사고과정이나 학습방법에 대한 지식"],"a":0,"exp":"개념적 지식은 범주·원리·이론 등의 상호관계에 대한 지식이다. ②는 사실적 지식, ③은 절차적 지식, ④는 메타인지적 지식이다.","id":"bangbeop-m21"},{"ch":"CH02 교수설계모형과 이론","t":"수업목표 진술","q":"수업목표 진술 시 유의사항으로 옳지 않은 것은?","opts":["하나의 목표에 여러 개의 학습유형을 함께 포함해야 함","수업 이전에는 할 수 없었지만 수업 이후에 수업의 결과로 획득하여 할 수 있게 된 행동인 '도착점행동'을 기술해야 함","내용과 행동이 포함된 행동적 용어를 사용해서 구체적으로 진술해야 함","하나의 목표는 한 개의 학습유형만을 포함해야 함"],"a":0,"exp":"'하나의 목표는 한 개의 학습유형만을 포함해야 함'이 유의사항이므로 ①은 정반대이다.","id":"bangbeop-m22"},{"ch":"CH02 교수설계모형과 이론","t":"메이거","q":"메이거(Mager)의 수업목표 진술의 구성요소 중 '준거'에 해당하는 설명은?","opts":["목표 달성 여부를 판별할 수 있는 준거로 양과 질 두 가지 측면 모두 포함","관찰 및 측정 가능한 용어로 진술되는 구체적 행동","학습상황이 아닌 수행상황에서 직면하는 제약조건","도착점행동을 기술한 것"],"a":0,"exp":"메이거의 구성요소는 행동, 상황·조건, 준거이며 준거는 목표 달성 여부를 판별할 수 있는 기준으로 양과 질 두 측면을 포함한다.","id":"bangbeop-m23"},{"ch":"CH02 교수설계모형과 이론","t":"과제분석","q":"과제분석의 종류 중 '군집분석'의 적용대상과 방법으로 옳은 것은?","opts":["언어정보의 학습과제 분석을 위해 주로 사용 ⇒ 위계적 관계가 없는 언어정보의 경우, 서로 관련이 있는 정보들을 묶는 분석방법","지적기능이나 운동기능의 학습과제 분석을 위해 주로 사용","운동기능의 학습과제 분석을 위해 주로 사용","태도의 학습과제 분석을 위해 주로 사용"],"a":0,"exp":"군집분석은 언어정보의 학습과제 분석에 사용된다. ②는 위계분석, ③은 절차분석, ④는 통합분석이다.","id":"bangbeop-m24"},{"ch":"CH02 교수설계모형과 이론","t":"과제분석","q":"과제분석의 종류 중 '통합분석'에 대한 설명으로 옳은 것은?","opts":["태도의 학습과제 분석을 위해 주로 사용 ⇒ 위계분석과 군집분석을 통합적으로 활용","언어정보의 학습과제 분석을 위해 관련 정보를 묶는 분석방법","기능들을 상위기능에서 하위기능으로 계열화함","학습과제 실행을 위해 필요한 절차적 단계를 분석함"],"a":0,"exp":"통합분석은 태도의 학습과제 분석을 위해 주로 사용되며 위계분석과 군집분석을 통합적으로 활용한다.","id":"bangbeop-m25"},{"ch":"CH02 교수설계모형과 이론","t":"ADDIE","q":"ADDIE 모형에서 '설계(Design)' 단계의 개념과 수행활동으로 옳은 것은?","opts":["분석과정에서 나온 산출물을 토대로 효과적이고 효율적인 수업 프로그램을 개발하기 위하여 수업의 세부요소들을 기획하는 활동 / 학습목표 진술, 평가도구 설계, 구조화와 계열화, 교수전략 및 매체 선정","수업설계의 초기에 설계를 위한 조직적인 계획을 정의하는 활동 / 요구분석, 학습자분석, 환경분석","수업의 청사진에 따라 다양한 유형의 자료들을 실제로 개발하고 제작하는 활동 / 교수·학습자료 개발","개발된 수업 프로그램을 실제 수업현장에서 사용하는 활동 / 교수프로그램 설치·사용"],"a":0,"exp":"설계(Design)는 분석 산출물을 토대로 수업의 세부요소를 기획하는 활동이며, 수행활동은 학습목표 진술, 평가도구 설계, 구조화와 계열화, 교수전략 및 매체 선정이다.","id":"bangbeop-m26"},{"ch":"CH02 교수설계모형과 이론","t":"ADDIE","q":"ADDIE 모형의 '개발(Development)' 단계의 수행활동으로 옳은 것은?","opts":["교수·학습자료 개발, 형성평가 및 수정","요구분석, 학습자분석, 환경분석, 직무 및 과제분석","학습목표 진술, 평가도구 설계, 교수전략 및 매체 선정","교수프로그램의 성과 및 효과성 평가"],"a":0,"exp":"개발 단계의 수행활동은 교수·학습자료 개발, 형성평가 및 수정이다. ②는 분석, ③은 설계, ④는 평가 단계이다.","id":"bangbeop-m27"},{"ch":"CH02 교수설계모형과 이론","t":"딕과 캐리","q":"딕(Dick)과 캐리(Carey)의 체제적 교수설계모형에서 '수업분석(교수분석)' 단계의 과업으로 옳은 것은?","opts":["교수목표를 성공적으로 달성하기 위해서 학습자가 학습해야 하는 하위기능들을 분석하고 그 기능들이 어떤 절차로 학습되어야 하는가를 규명함","학생의 현재 수준과 이상적인 수준 사이의 괴리인 '요구'를 분석하여 교수목적을 확인함","학습자의 출발점행동 및 나이, 학년, 흥미 등의 일반적 행동과 학습맥락을 분석함","목표에 근거한 평가도구와 문항을 개발함"],"a":0,"exp":"수업분석(교수분석)은 하위기능들을 분석하고 학습 절차를 규명하며, 수업 전 요구되는 출발점행동(지식, 기능, 태도)을 결정하고 이들 간의 관계를 정리·제시하는 단계이다.","id":"bangbeop-m28"},{"ch":"CH02 교수설계모형과 이론","t":"딕과 캐리","q":"딕과 캐리 모형에서 '형성평가 설계 및 실행' 단계의 내용으로 옳은 것은?","opts":["프로그램의 질을 개선하기 위해 필요한 자료를 수집하고 단계별로 수정할 부분을 수정하며, 일대일 평가, 소집단 평가, 현장평가 등을 실시함","프로그램의 가치를 측정하고 프로그램의 지속적인 활용이나 수정 필요성 등을 판단함","교수목표의 달성을 위한 교수활동전략, 정보제시전략, 학습자참여전략 등을 개발함","수업과 관련된 모든 형태의 자료를 만드는 단계"],"a":0,"exp":"형성평가 설계 및 실행은 프로그램 질 개선을 위한 자료 수집과 수정으로, 일대일 평가·소집단 평가·현장평가를 실시한다. ②는 총괄평가, ③은 수업전략 수립, ④는 수업자료 개발이다.","id":"bangbeop-m29"},{"ch":"CH02 교수설계모형과 이론","t":"딕과 캐리","q":"딕과 캐리 모형에서 '성취목표(수행목표) 진술' 단계의 과업으로 옳은 것은?","opts":["학습자가 교수를 통해 성취해야 하는 목표를 구체적으로 행동, 조건, 준거를 포함하여 진술함","목표에 근거한 준거지향평가 문항을 개발함","교수목표를 계열화·조직화함","프로그램의 가치를 측정함"],"a":0,"exp":"성취목표(수행목표) 진술은 행동, 조건, 준거를 포함하여 구체적으로 진술하는 단계이다.","id":"bangbeop-m30"},{"ch":"CH02 교수설계모형과 이론","t":"래피드 프로토타입","q":"래피드 프로토타입(Rapid Prototype) 모형에서 '원형'의 개념과 이 모형의 특징으로 옳은 것은?","opts":["원형은 설계 초기에 최종 결과물의 기능과 형태를 가진 형태이며, 사용자와 설계자가 서로 협동하며 원형을 개발한 후 문제점을 발견하고 수정·보완하는 비선형적 교수설계 방식","원형은 최종 산출물이며, 선형적으로 단계를 따라 개발함","원형은 평가도구이며, 총괄평가에 사용됨","원형은 학습자 모형이며, 학습자 분석에 사용됨"],"a":0,"exp":"원형은 설계 초기에 최종 결과물의 기능과 형태를 가진 형태이며, 이 모형은 교수설계의 현장을 반영하여 상황특성과 맥락적 특성을 고려하는 비선형적 교수설계 방식이다.","id":"bangbeop-m31"},{"ch":"CH02 교수설계모형과 이론","t":"래피드 프로토타입","q":"래피드 프로토타입 모형의 장점으로 옳은 것은?","opts":["분석단계에서 원형을 개발함으로써 교육과정 설계를 더욱 빠르고 효율적으로 할 수 있고, 개발 원형에 설계자뿐 아니라 사용자도 참여하여 학습자와 교수자의 다양한 요구가 효과적으로 반영될 수 있음","선형적 절차를 따르므로 관리가 용이함","평가의 중요성을 강조함","분명한 시작과 끝이 있어 진행 관리가 쉬움"],"a":0,"exp":"래피드 프로토타입의 장점은 요구 반영에서 오는 개발의 어려움 최소화(빠르고 효율적인 설계)와 사용자 참여를 통한 다양한 요구 반영이다.","id":"bangbeop-m32"},{"ch":"CH02 교수설계모형과 이론","t":"켐프","q":"켐프(Kemp)의 교수체제설계모형의 특징으로 옳은 것은?","opts":["순환적인 형태를 지니며 교수설계자는 모형의 어느 단계, 어느 과정에서든지 시작할 수 있고 여러 단계를 동시에 진행하는 것도 가능하며, 확인평가·형성평가·총괄평가를 구분하여 평가의 중요성을 강조함","분명한 시작과 끝이 없고 정의, 설계와 개발, 확산의 세 초점 간 상호작용으로 설계가 이루어짐","사용자와 설계자가 협동하여 원형을 개발함","교수조건, 교수방법, 교수결과의 세 변인으로 구성됨"],"a":0,"exp":"켐프 모형은 순환적 형태로 어느 단계에서든 시작 가능하며, 요구분석을 시작으로 시계방향으로 움직이고 필요한 요소만 뽑아 진행할 수도 있으며 평가의 중요성을 강조한다. ②는 윌리스의 R2D2 모형이다.","id":"bangbeop-m33"},{"ch":"CH02 교수설계모형과 이론","t":"윌리스 R2D2","q":"윌리스(Willis)의 R2D2 모형의 특징으로 옳은 것은?","opts":["분명한 시작과 끝이 없고 '정의, 설계와 개발, 확산'이라는 세 가지 주요 초점 간의 계속적인 상호작용을 통해 설계가 이루어지며, 초반에 명시적인 목표를 설정하지 않고 설계·개발 과정에서 자연스럽게 나타나는 목표에 주목함","요구분석을 시작으로 시계방향으로 움직이는 순환적 모형","교수조건과 교수방법, 교수결과의 관계를 다루는 모형","학습과제, 지원적 정보, 절차적 정보, 부분과제 연습으로 구성된 모형"],"a":0,"exp":"R2D2 모형은 정의, 설계와 개발, 확산의 세 초점 간 계속적 상호작용으로 설계되며, 프로토타입에 대한 형성평가를 통해 지속적·순환적 설계·개발 과정을 거쳐 최종 수업산출물을 만든다.","id":"bangbeop-m34"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 관점에서 교수조건의 특징과 구성요소로 옳은 것은?","opts":["교수설계자 또는 교사가 통제할 수 없는 제약조건으로 교수방법에 영향을 미치며, 구성요소는 교과내용의 특성, 교수목적, 제약점, 학습자 특성","교사의 개인적 노력과 발상에 따라 다양하게 실현될 수 있으며, 구성요소는 조직전략, 전달전략, 관리전략","교수·학습과정의 성과를 나타내며, 구성요소는 효과성, 효율성, 매력성","학습의 유형을 나타내며, 구성요소는 언어정보, 지적기능, 인지전략, 운동기능, 태도"],"a":0,"exp":"교수조건은 교수설계자나 교사가 통제할 수 없는 제약조건으로 교수방법에 영향을 미치며, 구성요소는 교과내용의 특성, 교수목적, 제약점, 학습자 특성이다.","id":"bangbeop-m35"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 교수방법 구성요소 중 '조직전략'에 해당하는 설명은?","opts":["교수조건과 학습내용의 종류와 크기에 따라 내용을 어떻게 최적의 상태로 조직할 것인지에 대한 전략","조직된 학습내용을 언제, 어떻게 제시할 것인가에 대한 전략","교수·학습의 설계, 개발, 실행, 평가 등의 모든 과정을 체계적으로 관리하는 전략","학습자의 학습동기를 유발하는 전략"],"a":0,"exp":"조직전략은 내용을 최적의 상태로 조직하는 전략으로, 미시적 조직전략(하나의 아이디어를 가르치는 조직)과 거시적 조직전략(여러 복합적인 아이디어에 대한 수업전략)으로 나뉜다. ②는 전달전략, ③은 관리전략이다.","id":"bangbeop-m36"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 교수결과를 구성하는 3가지 요소 중 '매력성'에 해당하는 설명은?","opts":["학습자의 학습동기와 관련되며, 학습자가 교수·학습과정에서 얼마나 학습에 매력과 열의를 느끼고 배운 내용을 활용하고자 하는 성향을 의미","교수·학습과정을 통해 학습자가 지식 및 기능을 얼마나 효과적으로 습득하였는가","교육목표 달성에 있어 얼마나 많은 노력, 비용, 시간이 소요되었는가","교수조건에 따라 사용되는 다양한 교수전략의 총체"],"a":0,"exp":"교수결과의 3요소는 효과성, 효율성, 매력성이며 매력성은 학습동기와 관련된다.","id":"bangbeop-m37"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)의 5가지 학습유형 중 '지적기능'에 해당하는 설명은?","opts":["언어, 숫자 등의 상징을 사용해서 환경을 설명하고 반응하게 하는 기능","진술 가능한 지식. 선언적 지식에 해당","학습자가 자신의 사고, 행동, 감정 등을 통제하고 안내하기 위하여 활용하는 전략","사물, 사람, 사건에 대해 습득된 특정한 경향성"],"a":0,"exp":"지적기능은 언어·숫자 등의 상징을 사용해 환경을 설명하고 반응하게 하는 기능이다. ②는 언어정보, ③은 인지전략, ④는 태도이다.","id":"bangbeop-m38"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)의 관점에서 선수학습요소의 개념과 지적기능을 가르칠 때의 유의점으로 옳은 것은?","opts":["선수학습요소는 수업을 계열화할 때 학습이 일어나기 위해 필요한 요소이며, 교사는 상위기능 학습 전 학생의 하위기능 습득 여부를 확인하고 필요 시 보충해야 함","선수학습요소는 학습 후 평가하는 요소이며, 교사는 총괄평가로 확인해야 함","선수학습요소는 학습동기이며, 교사는 강화를 제공해야 함","선수학습요소는 학습환경이며, 교사는 매체를 준비해야 함"],"a":0,"exp":"지적기능은 그 하위범주(변별, 구체적 개념학습, 추상적 개념학습, 원리학습, 고차적 규칙) 간에 위계성이 있어 하위기능이 상위기능의 선수학습요소가 되므로 교사는 하위기능 습득 여부를 확인하고 보충해야 한다.","id":"bangbeop-m39"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)가 주장한 학습의 내적조건의 구성요소로 옳은 것은?","opts":["선행학습, 학습동기, 자아개념, 주의력","강화의 원리, 접근의 원리, 연습의 원리","효과성, 효율성, 매력성","언어정보, 지적기능, 인지전략"],"a":0,"exp":"내적조건은 학습이 발생하기 위한 학습자의 내적 인지과정으로 선행학습, 학습동기, 자아개념, 주의력이다. ②는 외적조건이다.","id":"bangbeop-m40"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)의 학습의 외적조건 중 '접근의 원리'에 해당하는 설명은?","opts":["자극과 반응이 시간적으로 근접할 때 학습이 잘 이루어짐","새로운 행동에 강화가 제공되면 학습이 잘 이루어짐","새로운 학습내용에 대한 충분한 연습이 필요함","학습과제에 집중하는 정도"],"a":0,"exp":"접근의 원리는 자극과 반응이 시간적으로 근접할 때 학습이 잘 이루어진다는 것이다. ②는 강화의 원리, ③은 연습의 원리, ④는 주의력(내적조건)이다.","id":"bangbeop-m41"},{"ch":"CH02 교수설계모형과 이론","t":"가네 9교수사태","q":"가네(Gagné)의 9가지 교수사태 중 3단계 '선수학습의 회상 자극'에 대응하는 학습자의 학습과정은?","opts":["작동기억으로 인출","주의집중","기대감 형성","학습자료에 대한 선택적 지각"],"a":0,"exp":"9교수사태와 학습과정: 1단계 주의획득-주의집중, 2단계 학습목표 제시-기대감 형성, 3단계 선수학습의 회상 자극-작동기억으로 인출, 4단계 자극자료 제시-학습자료에 대한 선택적 지각 순이다.","id":"bangbeop-m42"},{"ch":"CH02 교수설계모형과 이론","t":"가네 9교수사태","q":"가네(Gagné)의 9가지 교수사태 중 5단계 '학습안내 제공'에 대응하는 학습자의 학습과정은?","opts":["의미적 부호화를 통한 장기기억으로 저장","학습결과를 보여주는 반응(수행)","학습결과에 대한 강화","인출 및 일반화"],"a":0,"exp":"5단계 학습안내 제공-의미적 부호화를 통한 장기기억으로 저장, 6단계 수행유도-학습결과를 보여주는 반응(수행), 7단계 피드백 제공-학습결과에 대한 강화, 8단계 수행평가-인출 및 강화, 9단계 파지와 전이 증진-인출 및 일반화이다.","id":"bangbeop-m43"},{"ch":"CH02 교수설계모형과 이론","t":"메릴","q":"메릴(Merrill)이 내용요소제시이론을 통해 제안한 4가지 내용수준과 3가지 수행수준으로 옳은 것은?","opts":["내용수준: 사실, 개념, 절차, 원리 / 수행수준: 기억하기, 활용하기, 발견하기","내용수준: 언어정보, 지적기능, 인지전략, 태도 / 수행수준: 이해, 적용, 분석","내용수준: 사실적, 개념적, 절차적, 메타인지적 / 수행수준: 기억, 이해, 창안","내용수준: 지식, 기능, 인성, 태도 / 수행수준: 알기, 하기, 되기"],"a":0,"exp":"메릴의 4가지 내용수준은 사실, 개념, 절차, 원리이며 3가지 수행수준은 기억하기, 활용하기, 발견하기이다.","id":"bangbeop-m44"},{"ch":"CH02 교수설계모형과 이론","t":"메릴","q":"메릴(Merrill)의 1차적 자료제시형태 중 '사례·질문식'에 해당하는 설명은?","opts":["교사가 개념이나 원리 등이 적용된 구체적인 사례에 대한 질문을 던지는 것","교사가 학생에게 개념이나 원리 등의 인지적 학습내용을 설명해주는 것","교사가 개념이나 원리 등이 직접 적용되는 구체적인 사례를 제시하는 것","교사가 학생에게 이미 배운 내용의 정의나 일반원리를 회상시키는 것"],"a":0,"exp":"사례·질문식은 개념이나 원리가 적용된 구체적 사례에 대한 질문을 던지는 것이다. ②는 일반·설명식, ③은 사례·설명식, ④는 일반·질문식이다.","id":"bangbeop-m45"},{"ch":"CH02 교수설계모형과 이론","t":"메릴","q":"메릴(Merrill)의 2차 제시형의 세부전략 중 '기억촉진'에 해당하는 것은?","opts":["특정 내용을 잘 기억할 수 있도록 암기방법 제공","학습내용과 관련된 상황이나 배경지식, 맥락정보를 함께 제시","특정 내용 학습을 위해 사전에 알고 있어야 할 정보 제시","같은 내용이나 정보를 나타낼 수 있는 다양한 표현방법을 사용하여 내용 제시"],"a":0,"exp":"2차 제시형의 세부전략은 맥락, 선수학습, 기억촉진, 도움, 표현, 피드백이며 기억촉진은 암기방법 제공이다.","id":"bangbeop-m46"},{"ch":"CH02 교수설계모형과 이론","t":"정교화이론","q":"롸이겔루스(Reigeluth)가 주장한 정교화이론의 특징으로 옳은 것은?","opts":["메릴의 내용요소제시이론을 거시적인 수준으로 확장시키기 위하여 개발된 이론이며, 교수내용의 선정, 계열화, 종합, 요약에 있어 적절한 방법을 처방함","가네의 학습위계이론을 미시적으로 축소한 이론","학습자의 동기를 4가지 요소로 설명한 이론","학습과제를 4가지 구성요소로 나눈 이론"],"a":0,"exp":"정교화이론은 메릴의 내용요소제시이론을 거시적 수준으로 확장한 이론으로, 카메라 렌즈는 대상의 전체적 내용을, 줌렌즈는 각 부분을 확대해 보여주는 것에 비유된다.","id":"bangbeop-m47"},{"ch":"CH02 교수설계모형과 이론","t":"정교화이론","q":"정교화이론의 교수전략 중 '종합자'에 해당하는 설명은?","opts":["단일 유형 아이디어들의 관계를 정의하고 이들을 통합하는 요소(일반성, 사례, 연습문항 등으로 제시)","수업에서 학습한 내용을 잊어버리지 않고 체계적으로 복습하기 위해 제시함","단순한 내용으로부터 시작하여 점점 더 복잡한 내용으로 교수·학습과제를 조직함","새로운 아이디어를 학습자에게 친숙한 아이디어와 연관지어 설명함"],"a":0,"exp":"종합자는 단일 유형 아이디어들의 관계를 정의하고 통합하는 요소이다. ②는 요약자, ③은 정교화 계열, ④는 비유이다.","id":"bangbeop-m48"},{"ch":"CH02 교수설계모형과 이론","t":"정교화이론","q":"정교화이론의 교수전략 중 '학습자 통제'에 해당하는 설명은?","opts":["학습자가 자신의 학습에 있어 선택권과 통제력을 갖도록 함(내용, 속도, 교수전략 제시, 인지전략을 선택·계열화하는 자유 부여)","학습자에게 명시적으로 인지전략을 활용할 것을 제시함","쉬운 것에서 어려운 것으로 계열화함","친숙한 아이디어와 연관지어 설명함"],"a":0,"exp":"학습자 통제는 학습자가 자신의 학습에 선택권과 통제력을 갖도록 하는 전략이다. ②는 인지전략 활성자, ③은 선행학습의 계열, ④는 비유이다.","id":"bangbeop-m49"},{"ch":"CH02 교수설계모형과 이론","t":"개념학습","q":"롸이겔루스(Reigeluth)의 개념학습 절차 중 '제시' 단계에 해당하는 설명은?","opts":["일반성(정의), 상위개념, 결정적 속성으로 제시하며 결정적 속성을 지닌 사례를 제시함","이전에 접하지 못한 사태에 개념을 적용하도록 발산적 사례들을 다양하게 제시함","학습자가 개념을 적용하는 과정에서 피드백을 제공하고 칭찬이나 격려를 통해 학습동기를 유발함","학습자가 스스로 개념을 발견하도록 유도함"],"a":0,"exp":"개념학습 절차는 제시 → 연습 → 피드백이며, 제시는 일반성(정의), 상위개념, 결정적 속성과 결정적 속성을 지닌 사례 제시이다.","id":"bangbeop-m50"},{"ch":"CH02 교수설계모형과 이론","t":"ARCS","q":"켈러(Keller)의 ARCS 전략 중 '주의(Attention)'를 높이는 방안으로 옳은 것은?","opts":["지각적 주의환기, 탐구적 주의환기, 다양성","친밀성, 목적지향성, 필요나 동기와의 부합성","학습의 필요조건 제시, 성공의 기회 제시, 개인적인 통제감 제시","자연적 결과 강조, 긍정적 결과 강조, 공정성 강조"],"a":0,"exp":"주의(Attention)의 방안은 지각적 주의환기, 탐구적 주의환기, 다양성이다. ②는 관련성, ③은 자신감, ④는 만족감이다.","id":"bangbeop-m51"},{"ch":"CH02 교수설계모형과 이론","t":"ARCS","q":"켈러(Keller)의 ARCS 전략 중 '탐구적 주의환기'에 해당하는 설명은?","opts":["학습자에게 스스로 문제나 질문 등을 만들게 함으로써 정보탐색 행동을 자극하는 것","새롭고, 놀라우면서, 기존의 것과 모순되거나 불확실한 사실 또는 정보를 교수상황에 사용함으로써 학습자의 주의를 유발·유지시키는 전략","교수요소에 다양한 변화를 주어 학습자의 흥미를 유지시키는 것","학습자의 경험과 가치에 연관되는 예문이나 구체적인 용어, 개념 등을 사용하는 것"],"a":0,"exp":"탐구적 주의환기는 스스로 문제나 질문을 만들게 하여 정보탐색 행동을 자극하는 것이다. ②는 지각적 주의환기, ③은 다양성, ④는 친밀성이다.","id":"bangbeop-m52"},{"ch":"CH02 교수설계모형과 이론","t":"ARCS","q":"켈러(Keller)의 ARCS 전략 중 '자신감(Confidence)'을 높이는 방안 중 '개인적인 통제감 제시'에 해당하는 것은?","opts":["학업에서의 성공이 개인의 노력이나 능력에 기인한다는 피드백과 그 조절의 기회를 제공함으로써 얻어질 수 있는 것","수업목표를 구체적으로 진술하거나 평가기준을 공개하고, 새로운 학습에 요구되는 선행학습 정도를 제시하는 것","학습과정과 수행의 조건에서 적절한 수준의 도전감을 제공하는가와 관련 있음","학습자의 학업성취에 대한 기준과 결과가 일관성 있게 유지되어야 한다는 것"],"a":0,"exp":"개인적인 통제감 제시는 성공이 개인의 노력이나 능력에 기인한다는 피드백과 조절의 기회 제공이다. ②는 학습의 필요조건 제시, ③은 성공의 기회 제시, ④는 공정성 강조(만족감)이다.","id":"bangbeop-m53"},{"ch":"CH02 교수설계모형과 이론","t":"ARCS","q":"켈러(Keller)의 ARCS 전략 중 '만족감(Satisfaction)'의 '자연적 결과 강조(내재적 강화)'에 해당하는 설명은?","opts":["학습자의 내적 동기를 유지시키려는 것으로, 학습자가 새로 습득한 지식이나 기술을 실제 또는 모의 상황에 적용해 보는 기회를 제공하는 것","바람직한 행동을 유지하기 위해 성공적인 학습결과에 대한 긍정적 피드백이나 보상을 제공하는 것","학습자의 학업성취에 대한 기준과 결과가 일관성 있게 유지되어야 한다는 것","적절한 수준의 도전감을 제공하는 것"],"a":0,"exp":"자연적 결과 강조(내재적 강화)는 새로 습득한 지식·기술을 실제 또는 모의 상황에 적용해 보는 기회를 제공하는 것이다. ②는 긍정적 결과 강조(외재적 강화), ③은 공정성 강조이다.","id":"bangbeop-m54"},{"ch":"CH02 교수설계모형과 이론","t":"프로그램 교수법","q":"스키너(Skinner)의 프로그램 교수법의 장점으로 옳지 않은 것은?","opts":["협동학습과 고등정신기능의 함양에 효과적임","개별화 학습이 가능하고, 학습자의 능동적인 참여가 이루어짐","단순한 지식 및 기능 학습에 효과적임","학습자의 수행에 대한 즉각적인 피드백이 가능함"],"a":0,"exp":"'협동학습과 고등정신기능의 함양이 어려움'은 단점이므로 ①은 정반대이다.","id":"bangbeop-m55"},{"ch":"CH02 교수설계모형과 이론","t":"프로그램 교수법","q":"스키너(Skinner)의 프로그램 교수법의 학습원리 중 '적극적 반응의 원리'에 해당하는 설명은?","opts":["학습자가 제시된 내용에 대하여 능동적이고 적극적으로 반응할 때 효과적인 학습이 가능함","학습과제를 활용한 학습은 쉬운 것 → 어려운 것, 단순한 것 → 복잡한 것의 순서로 이루어져야 함","모든 학습내용이 동일한 순서로 계열화되어 있음","학습자의 반응 정도 및 종류에 따라 다양한 순차가 가능함"],"a":0,"exp":"적극적 반응의 원리는 학습자가 능동적·적극적으로 반응할 때 효과적 학습이 가능하다는 것이다. ②는 점진적 접근의 원리, ③은 직선형 프로그램, ④는 분지형 프로그램이다.","id":"bangbeop-m56"},{"ch":"CH02 교수설계모형과 이론","t":"프로그램 교수법","q":"프로그램 학습의 형태 중 '분지형 프로그램'에 해당하는 설명은?","opts":["학습과제에 대한 학습자의 반응 정도 및 종류에 따라 다양한 순차가 가능","모든 학습내용이 동일한 순서로 계열화되어 있으며 모든 학습자들은 같은 순서로 같은 내용을 학습함","쉬운 것에서 어려운 것으로 이루어짐","능동적으로 반응할 때 효과적임"],"a":0,"exp":"분지형 프로그램은 학습자의 반응 정도 및 종류에 따라 다양한 순차가 가능하다. ②는 직선형 프로그램이다.","id":"bangbeop-m57"},{"ch":"CH02 교수설계모형과 이론","t":"캐롤","q":"캐롤(Carroll)의 학교학습이론에서 학습효과를 극대화하는 방안으로 옳은 것은?","opts":["학습에 필요한 시간을 최소화하고, 학습에 사용된 시간을 최대화하면 학습의 정도를 극대화할 수 있음","학습에 필요한 시간을 최대화하고 학습에 사용된 시간을 최소화함","학습자의 적성을 고정된 것으로 보고 수업의 질을 낮춤","학습기회를 제한하여 집중도를 높임"],"a":0,"exp":"①학습에 필요한 시간을 최소화(수업의 질을 높이면 이해력이 높아져 필요 시간이 줄어듦) ②학습지속력과 학습기회를 높임(동기화 전략으로 학습지속력을 유지하고 학습기회를 충분히 제공하면 사용된 시간이 늘어남)이 방안이다.","id":"bangbeop-m58"},{"ch":"CH02 교수설계모형과 이론","t":"캐롤","q":"캐롤(Carroll)의 학교학습이론에서 학습자 변인 중 '적성'의 개념으로 옳은 것은?","opts":["학습자가 주어진 학습과제를 일정한 수준까지 학습하는 데 필요한 시간","수업내용을 이해하는 학습자의 능력(일반지능, 언어적 지능 포함)","학습자가 인내심을 가지고 학습과제에 적극적으로 참여하는 시간","학습자에게 학습과제의 해결을 위해 허용된 시간"],"a":0,"exp":"적성은 학습과제를 일정 수준까지 학습하는 데 필요한 시간이다. ②는 수업이해력, ③은 학습지구력(학습지속력), ④는 학습기회(교사변인)이다.","id":"bangbeop-m59"},{"ch":"CH02 교수설계모형과 이론","t":"캐롤","q":"캐롤(Carroll)의 학교학습이론에서 교사 변인 2가지로 옳은 것은?","opts":["수업의 질, 학습기회","적성, 수업이해력","학습지구력, 학습기회","수업의 질, 학습지구력"],"a":0,"exp":"학습자 변인은 적성, 수업이해력, 학습지구력이며 교사 변인은 수업의 질(교수방법, 수업목표의 구체성, 교사가 사용하는 언어의 명확성, 학습활동의 계열화 등)과 학습기회(학습과제 해결을 위해 허용된 시간)이다.","id":"bangbeop-m60"},{"ch":"CH02 교수설계모형과 이론","t":"블룸 완전학습","q":"블룸(Bloom)의 완전학습모형에서 수업의 질을 높이는 데 기여하는 요인으로 제시되지 않은 것은?","opts":["평가결과의 서열화","단서: 학습과제를 제시할 때 교사가 제공하는 모든 정보","참여: 학습과제를 학습하고자 하는 학습자의 노력행동","강화: 학습과정에서 교사가 제공하는 칭찬이나 지지 등과 같은 학습자 행동에 대한 교사의 정의적 반응"],"a":0,"exp":"수업의 질을 높이는 요인은 단서, 참여, 강화, 피드백과 학습교정(학습자의 수행에 대해 교사가 제공하는 강화)이다.","id":"bangbeop-m61"},{"ch":"CH02 교수설계모형과 이론","t":"블룸 완전학습","q":"블룸(Bloom)의 완전학습모형에서 '수업 전 단계'에서 교사가 하는 활동으로 옳은 것은?","opts":["기초학력 진단(학습결손 발견)과 기초학습 보충과정(학습결손 처치)","형성평가와 보충과정, 심화과정","총합적 평가","학습자의 성취도 평가와 수업활동에 대한 효과성 판단"],"a":0,"exp":"수업 전 단계는 ①기초학력 진단(개별 학습자의 선행학습 정도 진단) ②기초학습 보충과정(학습결손 학습자에게 연습문제나 교재 등을 제공하여 가정학습으로 보충)이다. ②는 수업 중 단계, ③④는 수업 후 단계이다.","id":"bangbeop-m62"},{"ch":"CH02 교수설계모형과 이론","t":"블룸 완전학습","q":"블룸(Bloom)의 완전학습모형의 '수업 중 단계'에 해당하지 않는 것은?","opts":["총합적 평가","형성평가: 교사는 수업의 개선을 위한 정보를 획득하고 학습자는 스스로의 학습 정도를 확인함","보충과정: 형성평가에서 부진한 학습자에게 재학습의 기회를 제공함","심화과정: 형성평가에서 일정한 수준에 도달한 학습자에게 학습경험을 심화시킬 수 있는 기회를 제공함"],"a":0,"exp":"총합적 평가는 수업 후 단계에 해당한다.","id":"bangbeop-m63"},{"ch":"CH02 교수설계모형과 이론","t":"듀이 탐구학습","q":"듀이(Dewey)의 관점에서 탐구학습과 반성적 사고 각각의 개념으로 옳은 것은?","opts":["탐구학습은 학습자가 스스로 탐구주제를 설정하고 탐구과정을 통해서 학습내용을 능동적으로 습득하는 학습이며, 반성적 사고는 문제의 원인과 결과의 관계를 파악하고 탐색해 나가는 정신활동으로 실제적인 문제에 대한 인식에서부터 시작함","탐구학습은 교사가 지식을 전달하는 학습이며, 반성적 사고는 지식을 암기하는 활동이다","탐구학습은 지식의 구조를 발견하는 학습이며, 반성적 사고는 결과를 평가하는 활동이다","탐구학습은 협동을 통한 학습이며, 반성적 사고는 동료를 평가하는 활동이다"],"a":0,"exp":"탐구학습은 학습자가 스스로 탐구주제를 설정하고 능동적으로 학습내용을 습득하는 학습이며, 반성적 사고는 문제의 원인과 결과의 관계를 파악·탐색하는 정신활동으로 실제적 문제 인식에서 시작한다.","id":"bangbeop-m64"},{"ch":"CH02 교수설계모형과 이론","t":"탐구학습","q":"탐구학습모형의 단점으로 옳은 것은?","opts":["기초학력 향상에 비효율적이고 학습의 방향성을 잃기 쉬우며, 노력에 비해 지적 성장이 비능률적일 수 있음","학생의 자율성과 능동적 태도를 기르기 어려움","내적 보상을 얻을 수 없음","고차적 사고력을 기를 수 없음"],"a":0,"exp":"탐구학습모형의 단점은 ①기초학력 향상에 비효율적 ②학습의 방향성을 잃기 쉬움 ③노력에 비해 지적 성장이 비능률적일 수 있음이다. ②③④는 장점과 반대된다.","id":"bangbeop-m65"},{"ch":"CH02 교수설계모형과 이론","t":"브루너 발견학습","q":"브루너(Bruner)가 발견학습모형을 통해 제안한 효율적 수업을 위한 4가지 요소로 옳은 것은?","opts":["학습경향성의 자극, 지식의 구조, 학습의 계열화, 강화","주의, 관련성, 자신감, 만족감","효과성, 효율성, 매력성, 경제성","탐색, 명료화, 반추, 종합"],"a":0,"exp":"브루너의 4가지 요소는 ①학습경향성의 자극(학습하고자 하는 성향 또는 욕구를 자극) ②지식의 구조(학문을 구성하는 가장 기본적인 아이디어·개념·원리와 법칙 등을 체계화한 것) ③학습의 계열화(학습과제를 제시해주는 순서) ④강화(학습정도를 수시로 확인하고 결과에 보상)이다.","id":"bangbeop-m66"},{"ch":"CH02 교수설계모형과 이론","t":"발견학습","q":"발견학습의 장점으로 옳지 않은 것은?","opts":["단시간에 많은 양의 단순개념을 습득하는 학습에 효율적임","학습자의 정보조직능력, 문제해결능력, 자신감, 지적 잠재력을 증대시킬 수 있음","발견학습을 성공적으로 마쳤을 때 지적 만족감, 희열 등과 같은 내재적인 보상을 경험할 수 있음","학습자는 스스로 지식의 구조를 발견하는 과정 속에서 내용적인 지식뿐만 아니라 이를 획득하는 탐구방법과 전략까지 습득할 수 있음"],"a":0,"exp":"'단시간에 많은 양의 단순개념을 습득하는 학습에 비효율적임'은 단점이므로 ①은 정반대이다. 다른 단점으로는 학습 소요시간이 크고 교사의 수업준비 부담이 크다는 점이 있다.","id":"bangbeop-m67"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 주장한 유의미학습이 일어나기 위한 학습과제의 조건 중 '실사성'에 해당하는 설명은?","opts":["불변적·절대적인 특성. 한 명제를 어떻게 표현하더라도 그 의미와 본성이 변하지 않는 것","임의로 맺어진 관계가 시간이 흐른 이후에도 변경될 수 없는 것","학습자의 기존 인지구조 속에 존재하는 새로운 과제와 관련된 지식","과제를 학습하고자 하는 학습자의 동기"],"a":0,"exp":"실사성은 명제를 어떻게 표현해도 의미와 본성이 변하지 않는 불변적·절대적 특성이다. ②는 구속성, ③은 관련정착의미(학습자 조건), ④는 학습자의 학습태세이다.","id":"bangbeop-m68"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 주장한 유의미학습의 학습자 조건 2가지로 옳은 것은?","opts":["관련정착의미(지식), 학습자의 학습태세","실사성, 구속성","선행조직자, 포섭","점진적 분화, 학습준비도"],"a":0,"exp":"학습자의 조건은 ①관련정착의미(지식): 학습자의 기존 인지구조 속에 존재하는 새로운 과제와 관련된 지식 ②학습자의 학습태세: 과제를 학습하고자 하는 학습자의 동기이다.","id":"bangbeop-m69"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)의 선행조직자의 개념과 목적으로 옳은 것은?","opts":["유의미학습을 촉진하기 위해 학습 전에 제공되는 자료로, 인지구조를 강화하고 새로운 정보의 파지를 촉진하기 위해 우선적으로 도입되는 정보 및 자료이며, 목적은 새로운 학습을 위해 개념망 부여, 학습자가 가지고 있는 정보 연결, 장기적인 부호화를 촉진함","학습 후에 제공되는 요약자료로, 복습을 촉진하기 위한 것","학습과제의 난이도를 조절하는 자료","학습자의 동기를 유발하는 보상"],"a":0,"exp":"선행조직자는 유의미학습 촉진을 위해 학습 전에 제공되는 자료이며, 목적은 개념망 부여, 정보 연결, 장기적 부호화 촉진이다.","id":"bangbeop-m70"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)의 선행조직자 중 '비교조직자'에 해당하는 설명은?","opts":["학습자의 선행지식과 새로운 학습과제 간에 상당한 유사성이 존재할 때 제시하며, 선행지식에 있는 개념과 새로운 학습과제의 개념 간의 유사성과 차이점을 분명히 제시함으로써 상호간의 변별력을 증대시킴","학습자의 선행지식과 새로운 학습과제 간에 유사성이 없을 때 제시하며, 개념의 정착 근거 마련을 위한 포괄적이고 일반적인 자료","새로운 학습과제를 인지구조 속으로 병합시키는 과정","포괄적인 것부터 세부적인 것으로 분화시켜 제시하는 원리"],"a":0,"exp":"비교조직자는 선행지식과 새로운 학습과제 간 상당한 유사성이 있을 때 제시하여 변별력을 증대시킨다. ②는 설명조직자이다.","id":"bangbeop-m71"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 제안한 포섭(Subsumption)의 개념과 종류로 옳은 것은?","opts":["포섭은 새로운 학습과제를 학습자의 인지구조 속으로 병합시키는 과정이며, 종류는 하위적 포섭, 상위적 포섭, 병위적(병렬적) 포섭이다","포섭은 학습자가 새로운 정보를 암기하는 과정이며, 종류는 시연, 정교화, 조직화이다","포섭은 선행조직자를 제공하는 과정이며, 종류는 설명조직자와 비교조직자이다","포섭은 학습과제를 계열화하는 과정이며, 종류는 군집분석, 위계분석, 절차분석이다"],"a":0,"exp":"포섭은 새로운 학습과제를 인지구조 속으로 병합시키는 과정(≒학습)이며, 하위적·상위적·병위적(병렬적) 포섭으로 나뉜다.","id":"bangbeop-m72"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 제안한 하위적 포섭의 종류 중 '상관적 포섭'에 해당하는 설명은?","opts":["새로운 학습과제가 기존에 갖고 있는 개념을 확장·수정·정교화할 때 발생","새로운 학습과제가 기존 개념의 구체적인 사례일 때 발생","기존에 갖고 있던 개념보다 상위의 학습과제를 포섭하는 것","기존에 갖고 있던 개념과 대등한 수준의 학습과제를 포섭하는 것"],"a":0,"exp":"상관적 포섭은 새로운 학습과제가 기존 개념을 확장·수정·정교화할 때 발생하고, 파생적 포섭은 새 과제가 기존 개념의 구체적 사례일 때 발생한다.","id":"bangbeop-m73"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)의 수업원리 중 '점진적 분화의 원리'에 해당하는 설명은?","opts":["학문의 내용 중 가장 포괄적인 것부터 세부적인 것, 특수한 것으로 점차 내용을 분화시켜서 제시함","새로운 학습과제를 제시하기 전에 관련된 선행조직자로서 일반성·포괄성을 지닌 자료를 먼저 제시함","학습자의 기존 인지구조 이외에도 학습자의 발달수준을 확인하고 관련된 학습경험을 제공함","새로운 정보를 기존 지식과 연결하여 유의미성을 증가시킴"],"a":0,"exp":"점진적 분화의 원리는 포괄적인 것에서 세부적·특수한 것으로 분화시켜 제시하는 것이다. ②는 선행조직자의 원리, ③은 학습준비도의 원리이다.","id":"bangbeop-m74"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"조나센(Jonassen)의 구성주의 학습환경설계모형(CLEs)의 구성요소 중 '인지적 도구'에 해당하는 설명은?","opts":["학습자들이 생각을 시각화하거나 조직하는 것을 도와주기 위해 개발된 컴퓨터 소프트웨어 등(ex. 시각화도구, 모델링도구, 수행지원도구, 검색도구 등)","문제해결을 위해 참조할 수 있는 관련 경험","학습자가 문제를 확인하고 가설을 설정하는 데 필요한 정보","학생이 동료학습자와 협력할 수 있는 도구"],"a":0,"exp":"CLEs의 구성요소는 문제·프로젝트, 관련사례, 정보자원, 인지적 도구, 대화·협력도구, 사회적·맥락적 지원이다. ②는 관련사례, ③은 정보자원, ④는 대화·협력도구이다.","id":"bangbeop-m75"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"조나센(Jonassen)의 CLEs에서 '사회적·맥락적 지원'에 해당하는 설명은?","opts":["성공적인 학습과 실행이 가능하도록 하는 물리적·조직적·문화적 측면 등의 맥락적 요인을 지원함(ex. 오리엔테이션)","학생들이 해결해야 할 문제나 완성해야 할 프로젝트","문제해결을 위해 참조할 수 있는 관련 경험","토론 게시판, 채팅 도구, 공동작업 문서 등"],"a":0,"exp":"사회적·맥락적 지원은 물리적·조직적·문화적 측면 등 맥락적 요인을 지원하는 것으로 예는 오리엔테이션이다. ④는 대화·협력도구이다.","id":"bangbeop-m76"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"구성주의 학습환경에서 사용되는 문제에 포함되는 세 가지 요소로 옳은 것은?","opts":["맥락, 표상, 조작공간","탐색, 명료화, 반추","모델링, 코칭, 스캐폴딩","학습과제, 지원적 정보, 절차적 정보"],"a":0,"exp":"문제의 세 요소는 ①맥락(문제는 구체적인 맥락이 함께 제시되어야 함) ②표상(학습자의 관심을 이끌어낼 수 있도록 실제적으로 제시) ③조작공간(학습자들이 문제를 조작할 수 있도록 함)이다.","id":"bangbeop-m77"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"조나센(Jonassen)에 따를 때 구성주의 학습환경에서의 학습활동 중 '반추'에 해당하는 설명은?","opts":["탐색하고 명료화한 정보를 다시 돌아보며 이해도를 확인하고 학습과정과 결과를 평가함","다양한 탐색활동을 통해 가설설정, 자료수집, 잠정적 결론의 도출 등을 수행하며 학습대상을 탐색함","이미 알고 있는 것이나 알게 된 것을 분명히 함","교수자가 시연을 보이면서 생각을 소리 내어 말함"],"a":0,"exp":"학습활동은 탐색, 명료화, 반추이며 반추는 탐색·명료화한 정보를 돌아보며 이해도를 확인하고 학습과정과 결과를 평가하는 것이다. ④는 교수활동의 모델링이다.","id":"bangbeop-m78"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"조나센(Jonassen)의 구성주의 학습환경에서 교수활동 중 '스캐폴딩'에 해당하는 설명은?","opts":["학습자에 맞는 과제난이도 조절, 부족한 사전지식을 보완할 수 있도록 과제 재구성, 기존과는 다른 평가기회 제공 등의 형태로 주어질 수 있으며 학습자의 성장에 따라 점차 소거되어야 함","교수자가 시연을 보이면서 생각을 소리 내어 말하거나 중요한 행동이나 과정에 대한 단서를 설명함","개인이 학습을 하거나 과제를 수행하는 동안 그들을 관찰하고 도움","학습대상을 탐색하며 가설을 설정함"],"a":0,"exp":"교수활동은 모델링, 코칭, 스캐폴딩이며 스캐폴딩은 과제난이도 조절·과제 재구성·다른 평가기회 제공 등이며 학습자의 성장에 따라 점차 소거되어야 한다.","id":"bangbeop-m79"},{"ch":"CH03 구성주의 교수·학습","t":"4C/ID","q":"4C/ID 모형의 목적으로 옳은 것은?","opts":["복잡하고 비구조화된 실제적 과제를 통한 문제해결력 향상을 위한 교수설계모형으로, 실제적 문제해결을 위한 복잡한 인지기능을 개발하기 위함","단순한 지식과 기능의 반복 학습을 위한 모형","학습자의 동기를 4가지 요소로 유발하기 위한 모형","교수매체를 체계적으로 선정하기 위한 모형"],"a":0,"exp":"4C/ID 모형은 복잡하고 비구조화된 실제적 과제를 통한 문제해결력 향상을 위한 교수설계모형으로, 복잡한 인지기능 개발을 목적으로 한다.","id":"bangbeop-m80"},{"ch":"CH03 구성주의 교수·학습","t":"4C/ID","q":"4C/ID 모형의 4가지 요소 중 '지원적 정보'에 해당하는 설명은?","opts":["문제해결에 필요한 일반적, 추상적 지식에 대한 정보(선언적 지식 형태의 학습지원)","단순한 수준에서 현실적 문제를 해결하는 복잡한 수준에 이르기까지 다양하게 구성(학습과제를 계열화함)","문제해결에 필요한 순환적·절차적 지식에 대한 정보","학습과제와 관련된 특정 기능을 자동화하기 위한 목적에서 제시"],"a":0,"exp":"4C/ID의 4요소는 학습과제, 지원적 정보, 절차적 정보, 부분과제 연습이다. 지원적 정보는 일반적·추상적 지식에 대한 정보(선언적 지식 형태)이다.","id":"bangbeop-m81"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습(situated learning)에서 학습자와 교사의 역할로 옳은 것은?","opts":["학습자 — 협동학습을 통해 의미를 공유하고 자신의 아이디어를 반성하고 명료화하는 주도적인 역할 / 교사 — 인지적 코치, 전문가로서 과제를 수행하면서 인지적 전략 시연, 학습자의 문제해결과정을 코칭, 스캐폴딩을 제공하는 학습촉진자","학습자 — 지식을 수용하는 역할 / 교사 — 지식 전달자","학습자 — 평가 대상 / 교사 — 평가자","학습자 — 프로그램 실행자 / 교사 — 관리자"],"a":0,"exp":"상황학습에서 학습자는 협동학습을 통해 의미를 공유하고 반성·명료화하는 주도적 역할, 교사는 인지적 코치이자 학습촉진자이다.","id":"bangbeop-m82"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습에서 학습과제를 제시하는 방법으로 옳은 것은?","opts":["미시적 수준(주제에 관한 다양한 작은 사례나 맥락을 제공함)과 거시적 수준(여러 관점에서 해석될 수 있는 충분히 복잡한 맥락을 제공함)","선행조직자 수준과 점진적 분화 수준","일반·설명식 수준과 사례·질문식 수준","내재적 수준과 외생적 수준"],"a":0,"exp":"학습과제 제시방법은 미시적 수준(다양한 작은 사례나 맥락 제공)과 거시적 수준(여러 관점에서 해석될 수 있는 충분히 복잡한 맥락 제공)이다.","id":"bangbeop-m83"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습에서 '실천공동체'의 개념과 학습이 이루어지는 과정으로 옳은 것은?","opts":["실천공동체는 자신의 일에 대한 열정을 공유하고 정기적으로 상호작용하여 그것을 더 잘하는 방법을 배우려는 사람들의 모임이며, 학습은 실천공동체의 '합법적(정당한) 주변적 참여'로부터 핵심적인 구성원이 되어가는 과정에서 발생함","실천공동체는 교사들의 협의회이며, 학습은 교사의 지도를 통해 이루어짐","실천공동체는 학급 집단이며, 학습은 경쟁을 통해 이루어짐","실천공동체는 온라인 커뮤니티이며, 학습은 정보 검색을 통해 이루어짐"],"a":0,"exp":"실천공동체는 일에 대한 열정을 공유하고 정기적으로 상호작용하는 사람들의 모임이며, 초보자는 주변적 참여자로서 전체 과정을 관찰하고 피드백을 받는 과정을 통해 점차 공동체의 중심 구성원으로 활동하게 된다.","id":"bangbeop-m84"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습 설계의 주안점으로 제시되지 않은 것은?","opts":["교사 중심의 체계적 강의를 통한 지식 전달","학습자 중심의 협동학습: 학생들끼리 협동하여 현실 상황에서 접할 수 있는 협동체제를 경험하도록 함","맥락화된 실제적 과제: 실제적 활동은 상황화된 인지의 핵심적인 부분으로 실제 삶과 연관되고 목적이 있는 실제적 활동이 제시되어야 함","피드백 과정: 교사와 동료학습자들이 학습자의 수행을 관찰하고 관찰결과를 제공해야 함"],"a":0,"exp":"상황학습 설계의 주안점은 ②③④이다.","id":"bangbeop-m85"},{"ch":"CH03 구성주의 교수·학습","t":"정착식 교수","q":"정착식 교수(anchored instruction)의 개념으로 옳은 것은?","opts":["장편적이고 복선적으로 배열된 맥락적 상황(실제적 장면, 거시적 맥락)을 제공하여 이를 통해 장편적 맥락의 학습에 닻을 내리고 복잡한 문제상황 속에서 존재하는 다양한 맥락을 장기간 동안 경험하도록 함","전문가의 문제해결과정을 단계적으로 모방하도록 하는 교수","학습자가 짝을 이루어 역할을 교체하며 글을 학습하는 교수","게임의 요소를 교육에 적용하는 교수"],"a":0,"exp":"정착식 교수는 장편적·복선적으로 배열된 맥락적 상황을 제공하여 장편적 맥락의 학습에 닻을 내리고 다양한 맥락을 장기간 경험하도록 하는 것이다.","id":"bangbeop-m86"},{"ch":"CH03 구성주의 교수·학습","t":"정착식 교수","q":"정착식 교수가 일반적인 상황학습에 비해 강조하고 있는 점으로 옳은 것은?","opts":["학생들이 문제해결을 위해 필요한 자료와 정보를 능동적으로 찾을 기회를 제공하기 위해 여러 멀티미디어를 활용해 현장감 있는 상황을 제공하는 것을 강조","학습자의 개별화된 반복 연습을 강조","교사의 직접적인 설명과 시범을 강조","평가의 객관성과 신뢰도를 강조"],"a":0,"exp":"정착식 교수의 강조점은 ①상황학습처럼 학생의 상황과 학습상황을 맥락적으로 연결시키는 것 ②여러 멀티미디어를 활용해 현장감 있는 상황을 제공하는 것이다.","id":"bangbeop-m87"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 도제학습","q":"인지적 도제학습의 특징으로 옳지 않은 것은?","opts":["학습자는 단순한 지식습득에 국한되며 전문가의 사고과정은 학습 대상이 아님","학습의 실제적 맥락의 중요성을 강조함","학습자는 한 분야의 전문가들이 공유하는 문화에 점진적으로 동참해 나가며 학습함","학습자는 전문가들의 사고과정, 즉 메타인지적 기술을 학습함"],"a":0,"exp":"인지적 도제학습에서 학습자는 단순한 지식습득뿐만 아니라 전문가들의 사고과정, 즉 메타인지적 기술을 학습하므로 ①은 정반대이다.","id":"bangbeop-m88"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 도제학습","q":"인지적 도제학습의 6단계 교수절차 순서로 옳은 것은?","opts":["모델링 → 코칭 → 스캐폴딩 → 명료화 → 반성적 사고 → 탐색","코칭 → 모델링 → 명료화 → 스캐폴딩 → 탐색 → 반성적 사고","모델링 → 스캐폴딩 → 코칭 → 탐색 → 명료화 → 반성적 사고","탐색 → 모델링 → 코칭 → 스캐폴딩 → 명료화 → 반성적 사고"],"a":0,"exp":"인지적 도제학습의 교수절차는 모델링 → 코칭 → 스캐폴딩 → 명료화 → 반성적 사고 → 탐색 순이다.","id":"bangbeop-m89"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 도제학습","q":"인지적 도제학습의 '반성적 사고' 단계에서 이루어지는 활동으로 옳은 것은?","opts":["학습자는 자신의 과제수행을 전문가나 동료학습자의 문제해결과정과 비교하고 반성적으로 되돌아봄","학습자는 자신이 학습한 지식, 기능, 문제해결과정 등을 말 또는 글로 명료하게 표현해 봄","학습자는 교사의 지원 없이 자신만의 방법으로 문제를 직접 해결하기 위해 가설을 설정하고 검증함","전문가는 학습자가 스스로 과제를 수행해 보도록 하고 그 과정을 관찰하며 피드백을 제공함"],"a":0,"exp":"반성적 사고는 자신의 과제수행을 전문가나 동료학습자의 문제해결과정과 비교하고 반성적으로 되돌아보는 단계이다. ②는 명료화, ③은 탐색, ④는 코칭이다.","id":"bangbeop-m90"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 유연성","q":"인지적 유연성(cognitive flexibility theory)의 개념과 이를 높이기 위한 교수전략으로 옳은 것은?","opts":["여러 지식의 범주를 넘나들며 지식을 상황적 요구에 맞게 종합·구성해내는 능력이며, 교수전략은 주제 중심으로 학습하기, 다양한 소규모의 예들을 제시하기, 학습자들이 충분히 다룰 수 있는 정도의 복잡성을 지닌 과제로 작게 세분화하기","한 가지 지식을 깊이 있게 암기하는 능력이며, 교수전략은 반복 연습이다","전문가의 사고를 모방하는 능력이며, 교수전략은 시범과 모방이다","학습자의 동기를 유지하는 능력이며, 교수전략은 보상 제공이다"],"a":0,"exp":"인지적 유연성은 여러 지식의 범주를 넘나들며 지식을 상황적 요구에 맞게 종합·구성해내는 능력이며, 교수전략은 주제 중심 학습, 다양한 소규모 예 제시, 다룰 수 있는 복잡성의 과제로 세분화이다.","id":"bangbeop-m91"},{"ch":"CH03 구성주의 교수·학습","t":"목표기반 시나리오","q":"목표기반 시나리오의 특징으로 옳은 것은?","opts":["가상의 시나리오 속에 학습에 필요한 정보들을 배치시키고, 학습자로 하여금 시나리오 속에서 역할을 맡아 모종의 임무를 수행하게 함으로써 그 과정 속에서 목표로 하는 지식과 기술을 습득하게 함","교사가 지식을 체계적으로 전달하고 학습자가 이를 암기함","학습자가 짝을 이루어 역할을 교체하며 글을 읽음","실제 현장의 문제를 소수 인원이 해결하며 학습함"],"a":0,"exp":"목표기반 시나리오는 가상의 시나리오 속 역할을 맡아 임무를 수행하며 지식과 기술을 습득하게 하는 것으로, 학습자중심·사례중심·기술훈련중심이며 역할을 통해 학습한다.","id":"bangbeop-m92"},{"ch":"CH03 구성주의 교수·학습","t":"목표기반 시나리오","q":"목표기반 시나리오의 7단계 중 '커버스토리(표지 이야기) 개발'에 해당하는 설명은?","opts":["학습자가 미션을 달성하고자 하는 것을 전제로 하여 목표 달성을 위해 수행할 미션을 이야기 형식으로 설명함","학습자가 설정된 목표를 성취하기 위하여 수행해야 하는 미션 및 과제를 개발함","학습자가 커버스토리 내에서 맡게 되는 인물로, 역할에 따라 미션을 수행하게 됨","학습자들이 미션을 수행하는 모든 구체적인 활동을 설계함"],"a":0,"exp":"7단계는 핵심기술 도출 및 목표설정 → 미션설정 → 커버스토리 개발 → 역할개발 → 시나리오 운영설계 → 학습자원 개발 → 피드백 제공이다.","id":"bangbeop-m93"},{"ch":"CH03 구성주의 교수·학습","t":"상보적 교수","q":"상보적 교수(reciprocal teaching)의 목적과 특징으로 옳은 것은?","opts":["교사와 학습자 간, 학습자와 학습자 간의 역할교체를 통해 주어진 글의 내용을 학습하는 교수방법이며, 근접발달영역 내에서 성인 또는 우수한 동료와의 학습을 통해 잠재발달수준으로 나아갈 수 있다는 비고츠키의 이론에 영향을 받음","전문가의 문제해결과정을 모방하는 교수방법이며 인지적 도제학습에 영향을 받음","실제 현장의 문제를 해결하는 교수방법이며 액션러닝에 영향을 받음","게임의 요소를 적용하는 교수방법이며 행동주의에 영향을 받음"],"a":0,"exp":"상보적 교수는 역할교체를 통해 글의 내용을 학습하는 교수방법이며 비고츠키 이론의 영향을 받았고, 초반에는 교사중심 수업에서 점진적으로 학생들이 학습의 주도권을 가지게 된다.","id":"bangbeop-m94"},{"ch":"CH03 구성주의 교수·학습","t":"상보적 교수","q":"상보적 교수의 4가지 교수전략 중 '명료화하기'에 해당하는 설명은?","opts":["본문에 있는 어려운 단어의 뜻을 알아보기 위해 글을 다시 읽어보고 이해가 어려운 문맥의 뜻을 파악하며 본문내용을 점검함","글의 제목, 사진, 삽화, 글의 서두 등을 보고 내용을 예측함","중요한 내용을 파악하면서 글을 읽어나가고 글을 읽는 과정에서 중요한 내용을 질문으로 만들어 봄","주요 내용에 대해 서로 문답하고 답변을 모아서 요약함"],"a":0,"exp":"4가지 교수전략은 예측하기, 질문하기, 명료화하기, 요약하기이다. 명료화하기는 어려운 단어의 뜻을 알아보고 문맥의 뜻을 파악하며 본문내용을 점검하는 것이다.","id":"bangbeop-m95"},{"ch":"CH03 구성주의 교수·학습","t":"PBL","q":"배로우즈(Barrows)의 문제중심학습(PBL)의 특징으로 옳지 않은 것은?","opts":["교사가 문제해결의 주체가 되는 교사중심의 학습환경을 제공함","학생은 그룹활동을 중심으로 문제를 해결하면서 협력기술을 기르고 문제에 대한 다양한 시각과 접근방법을 익힘","학생이 문제해결의 주체가 되는 학습자중심의 학습환경을 제공함","소그룹을 통한 협동학습과 자기주도적 학습을 병행함"],"a":0,"exp":"PBL은 학생이 문제해결의 주체가 되는 학습자중심의 학습환경을 제공하므로 ①은 정반대이다.","id":"bangbeop-m96"},{"ch":"CH03 구성주의 교수·학습","t":"PBL","q":"PBL 과제의 성격 중 '복잡성'에 해당하는 설명은?","opts":["문제가 충분히 복잡하여 문제의 개념, 아이디어 등에 대하여 구성원 간의 활발한 토의가 이루어져 공통의 합의가 도출되어야 함","문제상황이나 요소가 분명하게 정의되어 있지 않으므로 학습자가 문제를 스스로 이해하고 정의해야 함","실세계에 존재하는 진짜 문제","학습자가 자신의 삶에 있어 관련성을 가지기 때문에 중요한 문제로 인식할 수 있는 문제"],"a":0,"exp":"PBL 과제의 성격은 비구조화, 실제성, 관련성, 복잡성이며 복잡성은 활발한 토의를 통해 공통의 합의가 도출될 만큼 충분히 복잡한 것이다.","id":"bangbeop-m97"},{"ch":"CH03 구성주의 교수·학습","t":"PBL","q":"PBL의 단점으로 옳은 것은?","opts":["체계적인 기초학력을 기르기 어렵고, 수업설계 및 진행에 많은 시간과 에너지가 소모되며, 학습의 노력에 비하여 습득지식의 효율성이 낮을 수 있음","가설연역적 추론기능이 저하됨","자기주도적 학습능력을 기를 수 없음","협동기술을 배울 수 없음"],"a":0,"exp":"PBL의 단점은 ①체계적인 기초학력을 기르기 어려움 ②수업설계 및 진행에 많은 시간과 에너지 소모 ③습득지식의 효율성이 낮을 수 있음이다. ②③④는 장점과 반대된다.","id":"bangbeop-m98"},{"ch":"CH03 구성주의 교수·학습","t":"프로젝트학습","q":"프로젝트학습(project-based learning)의 개념과 특징으로 옳은 것은?","opts":["한 명 또는 그 이상의 학습자가 자신의 프로젝트에 책임을 지고 특정한 주제를 심층적으로 연구하는 학습으로, 학습자가 실제적인 문제해결에 참여하여 결과물을 창조하는 과정을 통하여 새로운 지식과 기술을 습득하는 것을 강조함","교사가 제시한 문제를 소집단이 해결하는 학습","전문가의 사고과정을 모방하는 학습","글의 내용을 예측·질문·명료화·요약하며 읽는 학습"],"a":0,"exp":"프로젝트학습은 학습자가 프로젝트에 책임을 지고 특정 주제를 심층 연구하는 학습으로, 실제적 문제해결 참여와 결과물 창조를 강조하며 학생이 자신의 학습에 큰 통제력과 자율성을 가진다.","id":"bangbeop-m99"},{"ch":"CH03 구성주의 교수·학습","t":"프로젝트학습","q":"프로젝트학습의 절차로 옳은 것은?","opts":["목표와 주제 설정 → 계획 → 실행 → 평가","요구진단 → 목표설정 → 내용선정 → 내용조직","모델링 → 코칭 → 스캐폴딩 → 탐색","분석 → 설계 → 개발 → 실행 → 평가"],"a":0,"exp":"프로젝트학습의 절차는 ①목표와 주제 설정(교사는 학생의 흥미와 능력에 맞는 학습목표를 설정하고 주제, 주제망 및 자원목록을 잠정적으로 결정) ②계획 ③실행 ④평가이다.","id":"bangbeop-m100"},{"ch":"CH03 구성주의 교수·학습","t":"프로젝트학습","q":"프로젝트학습의 단점으로 옳지 않은 것은?","opts":["학습자의 내적 동기부여가 어려움","학습량에 비해 시간과 노력이 많이 소요됨","학습교재의 논리적인 체계가 무시될 수 있음","학습과정이 혼란스러울 수 있으며, 프로젝트학습을 위한 재료·도구·자원 등이 제대로 준비되지 않을 수 있음"],"a":0,"exp":"'구체적인 결과물을 만들어가는 과정이므로 내적 동기부여에 효과적임'은 장점이므로 ①은 정반대이다.","id":"bangbeop-m101"},{"ch":"CH03 구성주의 교수·학습","t":"웹기반 프로젝트","q":"웹기반 프로젝트의 장점으로 제시되지 않은 것은?","opts":["교사의 수업준비 부담이 크게 줄어듦","다양한 멀티미디어 학습정보를 활용하기 때문에 풍부한 학습환경을 제공할 수 있음","온라인 환경의 특성상 학급 내, 학교 내, 학교 간의 상호작용이 가능하여 상호작용의 양과 질이 확대됨","소극적·내성적 학습자의 능동적인 학습참여를 유도할 수 있음"],"a":0,"exp":"웹기반 프로젝트의 장점은 ②③④와 '매체의 다양성 때문에 다양한 산출물의 생산이 가능함', '자기주도적 학습능력, 문제해결능력, 정보활용능력 등을 키울 수 있음'이다.","id":"bangbeop-m102"},{"ch":"CH03 구성주의 교수·학습","t":"웹퀘스트","q":"닷지(Dodge)가 제안한 웹퀘스트(Web-quest)에서 교사의 역할로 옳은 것은?","opts":["학생이 적합한 자료를 탐색할 수 있도록 과제와 관련된 인터넷 자료나 인쇄자료에의 접근법, 학습자가 단계별로 수행할 과정, 발표 및 보고서 작성 안내 등을 설계하여 웹에 제시","학생이 스스로 모든 자료를 찾도록 개입하지 않음","학생의 결과물을 평가하는 역할만 수행","웹 프로그램을 직접 개발하는 역할"],"a":0,"exp":"웹퀘스트에서 교사는 인터넷·인쇄자료 접근법, 단계별 수행 과정, 발표 및 보고서 작성 안내 등을 설계하여 웹에 제시한다.","id":"bangbeop-m103"},{"ch":"CH03 구성주의 교수·학습","t":"자원기반학습","q":"자원기반학습(resource-based learning)의 개념과 교육적 효과로 옳은 것은?","opts":["학습자가 사용 가능한 자원들을 직접 활용 및 적용하도록 하면서 이루어지는 학습자중심 학습이며, 다양한 정보자원을 활용하여 문제를 해결함으로써 문제해결능력과 정보활용능력을 동시에 함양할 수 있음","교사가 선정한 교재만을 사용하는 학습이며, 기초학력을 신장시킴","전문가의 시범을 모방하는 학습이며, 절차적 기능을 습득함","게임 요소를 활용하는 학습이며, 동기를 유발함"],"a":0,"exp":"자원기반학습은 학습자가 사용 가능한 자원들을 직접 활용·적용하며 이루어지는 학습자중심 학습으로, 문제해결능력과 정보활용능력을 동시에 함양할 수 있다.","id":"bangbeop-m104"},{"ch":"CH03 구성주의 교수·학습","t":"자원기반학습","q":"자원기반학습의 특징으로 옳지 않은 것은?","opts":["모든 학습자에게 동일한 속도와 동일한 자원으로 학습하도록 함","학습자 스스로 목표를 설정하고 이에 적합한 학습방법이나 매체, 도구를 선택하는 학습자 주도적인 환경을 제공함","학습자의 학습을 보조하는 스캐폴딩이 주어짐","학습자의 학습속도에 맞춰 개별화 학습이 가능하고, 학습양식에 따른 다양한 자원 활용형태가 가능함"],"a":0,"exp":"자원기반학습은 학습속도에 맞춘 개별화 학습과 다양한 자원 활용형태가 가능하므로 ①은 정반대이다.","id":"bangbeop-m105"},{"ch":"CH03 구성주의 교수·학습","t":"Big 6 Skills","q":"Big 6 Skills의 6단계 중 '정보탐색전략'에 해당하는 설명은?","opts":["정보원을 파악하고 최적의 정보원을 선택하여 적절한 정보원의 범위를 정함","과제의 요점 파악 및 과제해결의 정보유형을 파악하여 성취해야 할 과제의 범위와 본질을 결정함","정보원의 소재를 파악하여 정보원에서 정보를 찾아 필요한 자료를 수집함","정보를 체계적으로 정리하여 최종 결과물을 만듦"],"a":0,"exp":"Big 6 Skills는 과제정의 → 정보탐색전략 → 소재파악과 접근 → 정보활용 → 통합정리 → 평가이다. ②는 과제정의, ③은 소재파악과 접근, ④는 통합정리이다.","id":"bangbeop-m106"},{"ch":"CH03 구성주의 교수·학습","t":"Big 6 Skills","q":"Big 6 Skills의 목적으로 옳은 것은?","opts":["교사와 도서관 미디어 전문사서가 협동하여 실제 학습상황에서 학생에게 정보활용능력을 가르치고, 정보 리터러시 함양을 위해 체계적인 정보기반 활동이 이루어지도록 훈련시킴","학습자의 동기를 4가지 요소로 유발하기 위함","전문가의 사고과정을 모방하도록 하기 위함","학습과제를 4가지 요소로 분해하기 위함"],"a":0,"exp":"Big 6 Skills의 목적은 ①교사와 도서관 미디어 전문사서의 협동을 통한 정보활용능력 교육 ②정보 리터러시 함양을 위한 체계적 정보기반 활동 훈련이다.","id":"bangbeop-m107"},{"ch":"CH03 구성주의 교수·학습","t":"자원기반학습","q":"자원기반학습의 제한점으로 옳은 것은?","opts":["개인학습을 하는 경우 학습자의 고립 문제가 생길 수 있고, 출처나 질적인 측면을 신뢰할 수 있는 자원을 확보하기가 어려우며, 학습자 인지양식의 다양성에 따라 풍부한 경험을 제대로 제공하는 것이 어려움","정보활용능력을 함양할 수 없음","개별화 학습이 불가능함","학습자 주도적 환경을 제공할 수 없음"],"a":0,"exp":"자원기반학습의 제한점은 ①학습자의 고립 문제 ②신뢰할 수 있는 자원 확보의 어려움 ③인지양식의 다양성에 따른 풍부한 경험 제공의 어려움이다.","id":"bangbeop-m108"},{"ch":"CH03 구성주의 교수·학습","t":"스캐폴딩","q":"스캐폴딩의 개념과 방안 중 '메타인지적 스캐폴딩'에 해당하는 것은?","opts":["학생들이 학습과정에 대해 성찰하도록 하며 가능한 문제해결책을 고려하도록 격려하는 스캐폴딩","내용에 대한 힌트와 프롬프트를 제공함","문제해결과정에 초점을 맞추고 문제해결전략에 대한 지침을 제공함","학습에서 나오는 어려움에 당당히 맞서면서 지속할 수 있는 학생들의 능력을 직접적으로 향상시키기 위한 스캐폴딩"],"a":0,"exp":"스캐폴딩은 학생들이 자신들의 기존 능력을 넘어서 과제에 참여하고 기술을 얻도록 전문가나 더 많은 지식을 가진 또래들이 제공하는 지원이다. 방안은 개념적(②), 메타인지적(①), 전략적(③), 동기적(④) 스캐폴딩이다.","id":"bangbeop-m109"},{"ch":"CH04 교수방법과 교수매체","t":"강의법","q":"강의법의 장점으로 옳지 않은 것은?","opts":["고등정신능력 계발이나 정의적인 학습에 매우 효과적임","기초적 내용의 학습, 추상적 개념의 학습, 논리적 설명에 효과적임","전체 내용을 개괄하거나 요약할 때 학습자의 이해를 향상시킬 수 있음","다수의 학습자에게 방대한 양의 지식을 효과적으로 전달하기에 용이함"],"a":0,"exp":"'고등정신능력 계발이나 정의적인 학습에 제한이 있음'은 단점이므로 ①은 정반대이다. 장점에는 '활동 및 경험 위주의 학습방법을 싫어하는 순응형 학습자에게 심리적으로 편안한 교수방법임'도 포함된다.","id":"bangbeop-m110"},{"ch":"CH04 교수방법과 교수매체","t":"강의법","q":"강의법의 단점으로 옳지 않은 것은?","opts":["개별화 학습이 용이하고 학습자의 능동적 참여를 유도함","수동적 학습이 되기 쉽고, 학습의 동기유발이 어려움","주의력이 부족한 저학년 학생에게 효과적이지 못함","개별화 학습이 어렵고 획일적인 학습이 이루어짐"],"a":0,"exp":"강의법은 개별화 학습이 어렵고 획일적 학습이 이루어지며 수동적 학습이 되기 쉬우므로 ①은 정반대이다.","id":"bangbeop-m111"},{"ch":"CH04 교수방법과 교수매체","t":"헤르바르트","q":"헤르바르트(Herbart)가 제안한 교수의 4단계 중 '계통'에 해당하는 설명은?","opts":["배운 내용을 하나의 체계로 일반화하는 단계","새로운 개념을 제시하는 단계로, 학생이 새로 배울 개념이 다른 개념과 어떤 차이가 있는지 잘 이해하고 더 잘 인식할 수 있도록 하는 제시방법 사용","학생의 의식 속에서 이미 존재하던 관념과 새로운 관념의 연합이 이루어지고 이들 간의 공통된 요소를 이해하는 단계","일반화된 원리를 실제 문제에 적용하고 해결하는 단계"],"a":0,"exp":"헤르바르트의 4단계는 명료 → 연합 → 계통 → 방법이며, 계통은 배운 내용을 하나의 체계로 일반화하는 단계이다. ②는 명료, ③은 연합, ④는 방법이다.","id":"bangbeop-m112"},{"ch":"CH04 교수방법과 교수매체","t":"팀티칭","q":"팀티칭을 운영하는 방안으로 옳은 것은?","opts":["2인 또는 그 이상의 교사가 협력해서 동일 학생집단의 수업 전반이나 중요한 부분에 대해 책임을 지는 교수방법","교사 1인이 여러 학급을 순회하며 지도하는 방법","학생들이 짝을 이루어 서로 가르치는 방법","학습자가 스스로 학습속도를 결정하는 방법"],"a":0,"exp":"팀티칭은 2인 이상의 교사가 협력해 동일 학생집단의 수업 전반이나 중요 부분에 책임을 지는 교수방법이며, 대집단 일제수업 → 20~30명 중집단 분담지도 → 5~6명 소집단 개별지도로 운영할 수 있다.","id":"bangbeop-m113"},{"ch
