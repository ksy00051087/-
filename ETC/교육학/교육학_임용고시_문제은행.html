 여겨져 온 지식체계를 소홀히 하는 것처럼 오인될 수 있고, 구체적인 교육내용의 조직 및 교수방법에 대한 논의가 부족함","교육과정을 적극적으로 재구성할 수 없음","교사에게 자율성을 부여하지 못함","학습자의 주체적 행동 능력을 개발할 수 없음"],"a":0,"exp":"역량중심 교육과정의 단점은 ①전통적 지식체계를 소홀히 하는 것처럼 오인될 수 있음 ②구체적 교육내용 조직 및 교수방법 논의가 부족함이다. ②③④는 장점과 반대된다.","id":"gwajeong-m57"},{"ch":"CH02 교육과정의 관점","t":"역량","q":"'역량'의 개념으로 옳은 것은?","opts":["실제적인 삶 속에서 무엇인가를 할 줄 아는 실질적인 능력으로 지식, 기능, 태도의 총체","각 학문의 핵심 개념과 원리의 체계","학습자가 획득한 경험과 성취","교육을 통해 기대하는 성과"],"a":0,"exp":"역량은 실제적인 삶 속에서 무엇인가를 할 줄 아는 실질적인 능력으로 지식, 기능, 태도의 총체이다.","id":"gwajeong-m58"},{"ch":"CH02 교육과정의 관점","t":"역량","q":"역량의 속성 중 '총체성'에 해당하는 설명은?","opts":["학습자는 개인의 능력을 이끌어내고 복합적인 방식으로 그것들을 통합하여 구체적인 사회적 맥락에서 활용할 수 있어야 함","학습자는 고등사고능력, 인지적·정의적·행동적 영역 전반의 능력을 발휘하여 실제 상황에서 그것을 드러낼 수 있어야 함","역량에는 초보수준, 숙련수준, 전문가수준 등과 같이 다양한 수준이 존재함","역량은 지식과 구분되는 개념이지만 지식을 통해 개발됨"],"a":0,"exp":"총체성은 개인의 능력을 복합적으로 통합하여 구체적 사회적 맥락에서 활용할 수 있어야 한다는 것이다. ②는 수행능력, ③은 발달적 성격이다.","id":"gwajeong-m59"},{"ch":"CH02 교육과정의 관점","t":"역량중심 설계","q":"역량중심 교육과정 설계의 특징으로 옳지 않은 것은?","opts":["역량은 지식과 완전히 무관하므로 지식이나 내용은 배제되어야 한다","역량은 지식과는 구분되는 개념이지만 지식을 통해 개발됨 ⇒ 지식이나 내용은 역량을 개발시키는 수단임","과제 수행과정을 총체적으로 평가하는 과정중심평가를 중시하며, 학생이 스스로의 학습을 성찰함으로써 평가에 참여하는 것을 독려함","학생이 주도적으로 참여하는 배움중심의 수업이 강조됨"],"a":0,"exp":"역량은 지식을 통해 개발되며 지식이나 내용은 역량을 개발시키는 수단이므로 ①은 옳지 않다.","id":"gwajeong-m60"},{"ch":"CH02 교육과정의 관점","t":"OECD 2030","q":"OECD Education 2030의 '내용 설계원리'에 해당하지 않는 것은?","opts":["교사 주체성: 교사의 전문성 활용 권한 강화","학생 주체성: 학생중심 교육과정 설계","엄격성: 도전적인 사유와 성찰을 유도하는 주제","전이가능성: 지식, 기능, 태도와 가치의 맥락 간 학습의 전이"],"a":0,"exp":"내용 설계원리는 학생 주체성, 엄격성, 초점, 일관성, 정합성, 전이가능성이다. 교사 주체성은 '과정 설계원리'에 속한다.","id":"gwajeong-m61"},{"ch":"CH02 교육과정의 관점","t":"OECD 2030","q":"OECD Education 2030의 '과정 설계원리'에 해당하는 것은?","opts":["실제성: 학습경험과 실제 세계와의 연결, 간학문적 협력적 학습","일관성: 학문적 논리가 반영된 주제의 계열성 형성","정합성: 교육과정-수업-평가의 일체화","초점: 학습의 깊이와 질을 위한 초점화된 주제"],"a":0,"exp":"과정 설계원리는 선택, 교사 주체성, 실제성, 상호연관성, 유연성, 참여이다. ②③④는 내용 설계원리이다.","id":"gwajeong-m62"},{"ch":"CH02 교육과정의 관점","t":"역량중심 설계","q":"역량중심 교육과정 설계의 대표적인 방안으로 제시된 것은?","opts":["백워드 설계(backward design), 개념기반 설계, IB 프로그램","나선형 교육과정, 발견학습","분과형 설계, 상관형 설계","자유학기제, 집중이수제"],"a":0,"exp":"역량중심 교육과정 설계의 대표적 방안은 ①백워드 설계 ②개념기반 설계 ③IB 프로그램이다.","id":"gwajeong-m63"},{"ch":"CH02 교육과정의 관점","t":"IB 프로그램","q":"IB 프로그램의 특징으로 옳지 않은 것은?","opts":["개별 교과의 경계를 엄격히 유지하여 교과별 전문성을 강화함","개념적 학습(conceptual learning)을 권장함","학문 간의 관계성을 탐구하며 개별 교과 범위를 초월하여 다양한 과목을 통해 세상을 이해하도록 함","실제학습(authentic learning)의 기회를 제공하여 학습내용과 그들의 삶을 연결시킬 것을 강조함"],"a":0,"exp":"IB 프로그램은 학문 간 관계성을 탐구하며 개별 교과 범위를 초월하도록 하므로 ①은 정반대이다.","id":"gwajeong-m64"},{"ch":"CH02 교육과정의 관점","t":"IB 프로그램","q":"IB 프로그램에서 평가의 특징으로 옳은 것은?","opts":["절대평가를 통해 성적을 산출하며, 타당성 확보를 위해 '외부평가'와 '내부평가'를 포함한 다면평가를 실시함","상대평가를 통해 학생 간 서열을 산출함","일제식 지필평가만으로 성적을 산출함","평가 없이 학습과정만 기록함"],"a":0,"exp":"IB 평가의 특징은 ①절대평가를 통한 성적 산출 ②정성평가의 체계화(외부평가와 내부평가를 포함한 다면평가) ③과정중심평가 설계(평가 기반의 교육과정 설계, 누적기록의 지향과 피드백 내재화)이다.","id":"gwajeong-m65"},{"ch":"CH03 교육과정 설계의 원리","t":"설계 요소","q":"교육과정 설계의 요소 4가지에 해당하지 않는 것은?","opts":["재정(finance): 어떠한 예산이 배정되어야 하는가?","교육목표(objectives): 교육을 통해 이루어져야 하는 것은 무엇인가?","교과내용(subject matter): 어떠한 내용이 포함되어야 하는가?","평가(evaluation): 교육과정의 결과를 평가하기 위해 어떠한 방법 및 도구가 활용될 것인가?"],"a":0,"exp":"교육과정 설계의 요소는 교육목표, 교과내용, 방법 및 조직, 평가 4가지이다.","id":"gwajeong-m66"},{"ch":"CH03 교육과정 설계의 원리","t":"교육목표","q":"교육목표의 개념과 교육목표 설정의 자원으로 옳은 것은?","opts":["교육목표는 교육을 통해서 기대하는 성과이자 교육활동의 기준과 방향이며, 설정의 자원은 교과·학습자·사회이다","교육목표는 교육활동의 결과이며, 설정의 자원은 교과·평가·방법이다","교육목표는 성취기준이며, 설정의 자원은 국가·지역·학교이다","교육목표는 학습경험이며, 설정의 자원은 교사·학생·학부모이다"],"a":0,"exp":"교육목표는 교육을 통해 기대하는 성과이자 교육활동의 기준과 방향이며, 설정의 자원은 ①교과 ②학습자 ③사회이다.","id":"gwajeong-m67"},{"ch":"CH03 교육과정 설계의 원리","t":"행동적 수업목표","q":"행동적 수업목표의 장점으로 옳은 것은?","opts":["무엇을 어떻게 가르쳐야 하는지에 대한 분명한 방향 제시로 교사들뿐 아니라 학부모와 학생과의 분명한 의사소통을 가능하게 함","의도하지 않은 결과까지 사전에 목표로 설정할 수 있음","모든 교과에서 동일하게 유용함","기대되는 모든 결과를 수업목표로 구체화할 수 있음"],"a":0,"exp":"행동적 수업목표의 장점은 분명한 방향 제시로 교사·학부모·학생과의 의사소통을 가능하게 하는 것이다. ②③④는 문제점과 반대된다.","id":"gwajeong-m68"},{"ch":"CH03 교육과정 설계의 원리","t":"행동적 수업목표","q":"행동적 수업목표의 문제점으로 옳지 않은 것은?","opts":["모든 교과에서 행동적 수업목표를 설정하기가 지나치게 쉬워 변별력이 떨어진다","수업을 통해 기대되는 결과를 모두 수업목표로 구체화할 수 없음 ⇒ 목표로 설정되지 않은 다른 영역을 배제할 수 있음","의도하지 않은 결과에 대해서는 사전에 목표로 설정할 수 없음","특정 교과에서는 행동적 수업목표가 유용한 반면, 행동적 수업목표를 설정하기 어려운 교과도 존재함"],"a":0,"exp":"행동적 수업목표를 설정하기 어려운 교과도 존재한다는 것이 문제점이므로 ①은 정반대이다.","id":"gwajeong-m69"},{"ch":"CH03 교육과정 설계의 원리","t":"내용선정 원리","q":"교육내용 선정의 원리 중 '타당성'에 해당하는 설명은?","opts":["교육내용의 정확성과 목표달성을 위한 효과성이라는 두 가지 의미로 사용됨","교육내용이 학문 또는 교과에 얼마나 필수적인지 판단하는 것","건강한 공동체를 만들기 위해 도덕적 가치, 민주주의적 이상, 사회문제 해결을 위한 내용들을 포함해야 함","학생이 성인이 된 이후의 생활을 준비하는 데 있어서 얼마나 유용한 것들을 많이 포함하는가"],"a":0,"exp":"타당성은 교육내용의 정확성과 목표달성을 위한 효과성을 의미한다. ②는 중요성, ③은 사회적 적절성, ④는 유용성이다.","id":"gwajeong-m70"},{"ch":"CH03 교육과정 설계의 원리","t":"내용선정 원리","q":"교육내용 선정의 원리 중 '학습가능성'에 해당하는 설명은?","opts":["학습자의 특성(발달단계, 능력수준 등)에 적합한 내용을 선정해야 학습의 가능성이 높아진다는 것","학습자의 흥미를 불러일으키고 학습자의 흥미에 부합해야 함","교육내용이 학문 또는 교과에 얼마나 필수적인지 판단하는 것","성인이 된 이후의 생활 준비에 유용한 내용을 포함하는 것"],"a":0,"exp":"학습가능성은 학습자의 특성(발달단계, 능력수준 등)에 적합한 내용을 선정해야 학습의 가능성이 높아진다는 것이다. ②는 흥미, ③은 중요성, ④는 유용성이다.","id":"gwajeong-m71"},{"ch":"CH03 교육과정 설계의 원리","t":"학습경험 선정 원리","q":"학습경험 선정의 원리 중 '(일목표) 다경험의 원리'에 해당하는 설명은?","opts":["한 가지 교육목표를 달성하기 위해 교사나 교육과정 개발자들이 열정과 창의성을 발휘하여 여러 가지 효과적인 학습경험(활동)을 제공함","어떤 활동을 선정할 때 여러 가지 교육목표를 동시에 달성할 수 있도록 하는 활동을 선택해야 함","특정한 교육목표를 달성하기 위해서는 그 목표를 도달하기 위한 행동을 해볼 수 있는 기회를 제공해야 함","학생들에게 함께 활동에 참여할 수 있는 기회를 주는 것이 좋음"],"a":0,"exp":"(일목표) 다경험의 원리는 한 가지 교육목표 달성을 위해 여러 가지 효과적인 학습경험을 제공하는 것이다. ②는 (일경험) 다성과의 원리, ③은 기회의 원리, ④는 협동의 원리이다.","id":"gwajeong-m72"},{"ch":"CH03 교육과정 설계의 원리","t":"학습경험 선정 원리","q":"학습경험 선정의 원리 중 '가능성의 원리'에 해당하는 설명은?","opts":["학생들에게 요구하는 행동이 그들의 현재 능력이나 성취 정도, 발달수준을 고려해야 함","교육목표를 달성하기 위한 행동에서 학생들이 만족감을 느낄 수 있어야 함","목표를 도달하기 위한 행동을 해볼 수 있는 기회를 제공해야 함","여러 가지 교육목표를 동시에 달성할 수 있는 활동을 선택해야 함"],"a":0,"exp":"가능성의 원리는 요구되는 행동이 학생의 현재 능력·성취 정도·발달수준을 고려해야 한다는 것이다. ②는 만족의 원리, ③은 기회의 원리이다.","id":"gwajeong-m73"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"교육내용 조직에서 '수평적 조직'과 '수직적 조직'의 개념으로 옳은 것은?","opts":["수평적 조직은 같거나 비슷한 시간대에 연관성 있는 교육내용을 나란히 배치하여 학습의 효율성을 도모하는 것이고, 수직적 조직은 시간적 순서에 따라 교육내용을 순차로 배치하여 수업의 효율성을 높이고자 하는 것","수평적 조직은 시간적 순서에 따른 배치이고, 수직적 조직은 나란히 배치하는 것","수평적 조직은 계속성과 계열성을, 수직적 조직은 범위와 통합성을 고려한다","수평적 조직은 연계성을, 수직적 조직은 균형을 고려한다"],"a":0,"exp":"수평적 조직은 비슷한 시간대에 연관성 있는 내용을 나란히 배치하는 것이고, 수직적 조직은 시간적 순서에 따라 순차 배치하는 것이다.","id":"gwajeong-m74"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"수평적 조직에서 고려해야 하는 것 중 '범위(scope)'에 해당하는 설명은?","opts":["교육과정에서 다룰 내용의 폭과 깊이로, 교육과정에 어떤 내용을 포함시키고 그 내용을 어느 정도까지 상세히 다룰 것인가를 결정하는 것","교육과정 내용으로 포함될 수 있는 모든 유형의 지식과 경험을 서로 연결 짓는 것","중요한 개념이나 기능을 여러 시기에 걸쳐 계속해서 반복적으로 다루는 것","학습내용이나 경험의 순서를 효과적으로 조직하는 것"],"a":0,"exp":"범위(scope)는 교육과정에서 다룰 내용의 폭과 깊이이다. ②는 통합성, ③은 계속성, ④는 계열성(수직적 조직)이다.","id":"gwajeong-m75"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"수직적 조직에서 고려해야 하는 것 중 '계열성(sequence)'에 해당하는 설명은?","opts":["학생들의 누적적이고 지속적인 학습을 촉진하기 위해 학습내용이나 경험의 순서를 효과적으로 조직하는 것으로, 일반적으로 이전의 것에 너비와 깊이를 더해가는 것과 관련","중요한 개념이나 기능을 여러 시기에 걸쳐 계속해서 반복적으로 다루는 것","교육과정에서 다룰 내용의 폭과 깊이를 결정하는 것","모든 유형의 지식과 경험을 서로 연결 짓는 것"],"a":0,"exp":"계열성은 누적적·지속적 학습 촉진을 위해 내용이나 경험의 순서를 효과적으로 조직하는 것이다. ②는 계속성, ③은 범위, ④는 통합성이다.","id":"gwajeong-m76"},{"ch":"CH03 교육과정 설계의 원리","t":"계열성 확보","q":"계열성을 확보하는 구체적인 방안으로 제시되지 않은 것은?","opts":["복잡한 것에서 단순한 것으로 나아감","전체로부터 부분으로 발전함","사건의 연대기적 순서로 제시함","구체적 경험에서 추상적인 개념의 순서로 나아감"],"a":0,"exp":"계열성 확보 방안은 '단순한 것에서 복잡한 것으로 나아감', 전체로부터 부분으로, 연대기적 순서, 구체적 경험에서 추상적 개념으로, 특정 개념이나 아이디어가 계속 등장하되 나선형으로 심화·확대되어 나타남이다. ①은 반대로 서술되었다.","id":"gwajeong-m77"},{"ch":"CH03 교육과정 설계의 원리","t":"총체적 조직","q":"총체적 조직에서 고려해야 하는 것 중 '연계성(articulation)'에 해당하는 설명은?","opts":["교육과정의 여러 측면이 상호관련성을 맺도록 설계하는 것","교육과정 여러 측면의 내용을 적절한 비중으로 조화롭게 담아내야 하는 것","교육과정에서 다룰 내용의 폭과 깊이를 결정하는 것","중요한 개념을 여러 시기에 걸쳐 반복적으로 다루는 것"],"a":0,"exp":"연계성은 교육과정의 여러 측면이 상호관련성을 맺도록 설계하는 것이다. ②는 균형이다.","id":"gwajeong-m78"},{"ch":"CH03 교육과정 설계의 원리","t":"연계성","q":"'수직적 연계성'에 대한 설명으로 옳은 것은?","opts":["나중에 배울 내용이 그 이전에 배운 내용과 관련될 수 있도록 이전 학습의 종결점과 나중 학습의 출발점을 잘 맞물리게 내용을 조직해야 함","동일 학년 내 교과 간에 유사한 개념이나 주제, 기능 등이 있을 때 이들 내용요소들이 동일한 수준으로 다루어질 수 있도록 조직해야 함","교육내용을 시간적 순서에 따라 배치하는 것","교육과정 여러 측면의 내용을 적절한 비중으로 담는 것"],"a":0,"exp":"수직적 연계성은 이전 학습의 종결점과 나중 학습의 출발점을 잘 맞물리게 조직하는 것이다. ②는 수평적 연계성이다.","id":"gwajeong-m79"},{"ch":"CH03 교육과정 설계의 원리","t":"균형","q":"교육과정 설계 시 균형을 위해 고려해야 할 측면으로 제시되지 않은 것은?","opts":["국가·지역·학교 수준의 위계","인간 발달의 인지적·정의적·심동적 영역","개인적·사회적·지적 목표","교과와 학습자, 공통내용과 선택내용, 교육내용의 폭과 깊이"],"a":0,"exp":"균형을 위해 고려할 측면은 ①인간 발달의 인지적·정의적·심동적 영역 ②개인적·사회적·지적 목표 ③교과와 학습자 ④공통내용과 선택내용 ⑤교육내용의 폭과 깊이이다.","id":"gwajeong-m80"},{"ch":"CH03 교육과정 설계의 원리","t":"켈리 설계모형","q":"켈리(Kelly)의 교육과정 설계모형 중 '과정모형'의 목적으로 옳은 것은?","opts":["개인의 역량 발달","지식의 획득","목표 성취","문화의 전달"],"a":0,"exp":"켈리 모형에서 내용모형의 목적은 지식의 획득, 목표모형은 목표 성취, 과정모형은 개인의 역량 발달이다.","id":"gwajeong-m81"},{"ch":"CH03 교육과정 설계의 원리","t":"켈리 설계모형","q":"켈리(Kelly)의 '목표모형'의 한계점으로 옳지 않은 것은?","opts":["교육과정의 효과가 교사의 전문적 판단에 크게 의존하게 된다","교육에 대한 도구주의적 관점을 취한다","목표를 고정되거나 주어진 것으로 보게 하여 교사와 학생의 자유를 제한한다","교사나 학생들이 교육과정에서 적극적 역할을 하기 어렵다"],"a":0,"exp":"'교육과정의 효과가 교사의 전문적 판단에 크게 의존하게 됨'은 과정모형의 한계점이다.","id":"gwajeong-m82"},{"ch":"CH03 교육과정 설계의 원리","t":"켈리 설계모형","q":"켈리(Kelly)의 '내용모형'의 한계점으로 옳은 것은?","opts":["교육내용을 사회의 문화에 기반하여 결정한다고 하나 문화의 실체가 분명하지 않고, 다원화된 사회에서는 단일한 문화나 핵심·고급 문화를 결정하기 어려움","목표를 고정된 것으로 보아 교사와 학생의 자유를 제한함","중앙에서 세밀하게 설계하기 어려움","절차적 원리가 교수방법으로 오해될 여지가 있음"],"a":0,"exp":"내용모형의 한계점은 문화의 실체가 분명하지 않음, 단일 문화 결정의 어려움, 영향력 있는 압력집단들의 문화에 대한 입장 반영 가능성, 교육의 목표와 학생에 대한 관심이 거의 없음, 인간에 대한 수동적 관점, 논쟁적 쟁점을 다루는 교과에 부적합함이다.","id":"gwajeong-m83"},{"ch":"CH03 교육과정 설계의 원리","t":"교과중심 설계","q":"교과중심 설계의 유형 중 '상관형 설계'의 개념으로 옳은 것은?","opts":["두 개 이상의 교과들을 각 교과의 정체성은 유지하되 서로 관련지어서 설계하는 것","한 교과를 다른 교과와 독립된 별개의 교과로 각각 조직하는 설계방식","서로 유사한 교과들을 묶어서 하나의 교과로 재조직하는 통합유형","두 개 이상의 교과목에서 공통요인을 추출하여 새로운 교과를 융합적으로 구성하는 설계방식"],"a":0,"exp":"상관형 설계는 두 개 이상 교과를 각 교과의 정체성은 유지하되 서로 관련지어 설계하는 것이다. ②는 분과형, ③은 광역형, ④는 융합형 설계이다.","id":"gwajeong-m84"},{"ch":"CH03 교육과정 설계의 원리","t":"분과형 설계","q":"분과형 설계의 특징으로 옳은 것은?","opts":["교과의 논리적 구조와 지적 체계에 따라 조직하므로 교과 간 관련성은 없고 독립적인 교과로서의 성격을 유지함","여러 교과의 공통부분을 추출하여 통합적으로 조직함","교과의 경계를 없애고 실제 생활의 주제를 중심으로 조직함","학습자의 흥미와 필요를 중심으로 조직함"],"a":0,"exp":"분과형 설계는 교과의 논리적 구조와 지적 체계에 따라 조직하여 교과 간 관련성 없이 독립적 성격을 유지한다.","id":"gwajeong-m85"},{"ch":"CH03 교육과정 설계의 원리","t":"분과형 설계","q":"분과형 설계의 장점과 단점으로 옳은 것은?","opts":["장점: 초보적인 지식과 전문지식 사이의 간극을 좁힐 수 있고 학습내용의 기억과 일반적 전이가 비교적 용이함 / 단점: 대학 입학을 앞둔 학생의 흥미만을 주로 반영하며, 학문적 지식으로 분류될 수 없는 다양한 지식을 교육과정에 포함하지 않음","장점: 각 교과의 중복 및 누락을 방지할 수 있음 / 단점: 포괄적인 통합성이 부족함","장점: 학습의 통합성을 높임 / 단점: 각 학문의 개별적 성격이 약화됨","장점: 학습내용의 깊이가 깊음 / 단점: 시간이 많이 소요됨"],"a":0,"exp":"분과형 설계의 장점은 초보지식과 전문지식 간극 축소, 기억과 일반적 전이의 용이함이고, 단점은 대입 앞둔 학생의 흥미만 반영, 학문적 지식 외 다양한 지식의 배제이다. ②는 상관형, ③은 융합형이다.","id":"gwajeong-m86"},{"ch":"CH03 교육과정 설계의 원리","t":"상관형 설계","q":"상관형 설계의 단점으로 옳은 것은?","opts":["여전히 분과 교육과정의 결점을 근본적으로 해결하지 못하며, 한정된 상관성으로 인해 개별성과 관련성만 있으며 포괄적인 통합성은 부족함","학습내용의 깊이가 부족하고 추상적으로 제시되어 이해하기 어려울 수 있음","각 학문의 개별적인 성격이 약화됨","대학 입학을 앞둔 학생의 흥미만을 주로 반영함"],"a":0,"exp":"상관형 설계의 단점은 분과 교육과정의 결점을 근본적으로 해결하지 못함, 포괄적 통합성 부족이다. ②는 광역형, ③은 융합형, ④는 분과형의 단점이다.","id":"gwajeong-m87"},{"ch":"CH03 교육과정 설계의 원리","t":"광역형 설계","q":"광역형 설계의 대표적인 조직방법인 '주제법'에 대한 설명으로 옳은 것은?","opts":["넓게 볼 때 같은 교과영역의 부류에 속하는 여러 세부적인 과목의 내용을 분석하여 이들을 포괄할 수 있는 주제를 설정하고, 주제와 관련된 지식과 개념 및 원리들을 조직하는 방식","두 개 이상의 교과목에서 공통요인을 추출하여 새로운 교과를 구성하는 방식","일상생활의 공통된 문제를 중심으로 구성하는 방식","교과 순서를 조정하여 비슷한 시간대에 배우도록 하는 방식"],"a":0,"exp":"주제법은 같은 교과영역에 속하는 세부 과목 내용을 분석해 포괄할 수 있는 주제를 설정하고 관련 지식·개념·원리를 조직하는 방식이다.","id":"gwajeong-m88"},{"ch":"CH03 교육과정 설계의 원리","t":"광역형 설계","q":"광역형 설계의 단점으로 옳은 것은?","opts":["지나치게 개략적인 내용만을 다룸으로써 학습내용의 깊이가 부족할 수 있으며, 추상적인 내용으로 제시되어 이해하기 어려울 수 있음","각 교과의 중복 및 누락이 발생함","교과 간 관련성이 전혀 없음","시간표 운영이 경직됨"],"a":0,"exp":"광역형 설계의 단점은 개략적 내용으로 깊이가 부족하고 추상적이어서 이해하기 어려울 수 있으며, 여러 과목을 통합함으로 인해 각 교과목 고유의 논리성과 개념체계를 이해하지 못할 수 있다는 것이다.","id":"gwajeong-m89"},{"ch":"CH03 교육과정 설계의 원리","t":"융합형 설계","q":"융합형 설계의 실행조건으로 옳지 않은 것은?","opts":["형식적인 융합을 통해 교과 간 시수를 균등하게 배분해야 한다","개별 학문의 단편성에서 벗어나 여러 학문의 공통요소를 유기적으로 연결할 수 있어야 하므로 융통성 있는 시간표 운영이 필요함","다양한 학문을 융합시키고자 하는 교육과정 설계자의 노력과 이를 실천할 수 있는 의식의 변화, 경제적 지원 등이 요구됨","융합형 설계는 형식적인 융합이 아니라 내용적인 융합을 중시함"],"a":0,"exp":"융합형 설계는 형식적인 융합이 아니라 내용적인 융합을 중시하므로 ①은 옳지 않다.","id":"gwajeong-m90"},{"ch":"CH03 교육과정 설계의 원리","t":"융합형 설계","q":"융합형 설계의 단점으로 옳은 것은?","opts":["각 학문의 공통적인 주제를 선정하기 때문에 각 학문의 개별적인 성격이 약화되며, 교과별 지식을 체계적으로 학습하기 어렵기 때문에 기초교육의 저하가 우려됨","학습의 통합성이 떨어짐","창의·융합적 사고력을 기를 수 없음","학습동기 유발이 어려움"],"a":0,"exp":"융합형 설계의 단점은 각 학문의 개별적 성격 약화와 교과별 지식의 체계적 학습 곤란으로 인한 기초교육 저하 우려이다. ②③④는 장점과 반대된다.","id":"gwajeong-m91"},{"ch":"CH03 교육과정 설계의 원리","t":"학습자중심 설계","q":"학습자중심 설계의 유형 중 '경험중심 설계'의 개념으로 옳은 것은?","opts":["아동의 경험을 분석하여 학습의 시작점으로 두고, 형식화된 지식과 아동의 경험이 연결될 수 있도록 하는 설계방식","학습이 아동의 삶과 흥미, 필요를 중심으로 이루어지도록 하는 설계방식","교육이 아동의 정서적, 신체적, 도덕적 발달을 포함하여 인간의 행복에 초점을 맞추어야 한다는 믿음에 기초하는 설계방식","지식은 개인의 자아성찰적, 인지적 작용과 사회적 참여를 통해 지속적으로 변화·수정·보완·구성되어 가는 것이라는 관점의 설계방식"],"a":0,"exp":"경험중심 설계는 아동의 경험을 분석해 학습의 시작점으로 두고 형식화된 지식과 아동의 경험을 연결하는 설계방식이다. ②는 아동중심(활동중심), ③은 인간중심, ④는 구성주의 설계이다.","id":"gwajeong-m92"},{"ch":"CH03 교육과정 설계의 원리","t":"생성형 설계","q":"생성형 설계의 개념과 특징으로 옳은 것은?","opts":["사전에 계획하지 않고 학습의 현장에서 교사와 학생이 함께 만들어가는 교육과정 설계방식으로, 교사와 학생에게 상당한 자율성과 융통성을 부여하며 생활현장에 밀접하게 관련되어 있음","사전에 치밀하게 계획된 교육과정을 충실히 실행하는 설계방식","각 학문의 구조를 나선형으로 조직하는 설계방식","공통된 문제를 중심으로 동심원적으로 결합하는 설계방식"],"a":0,"exp":"생성형 설계는 사전 계획 없이 현장에서 교사와 학생이 함께 만들어가는 설계방식으로, 상대적으로 저학년 학생들에게 많이 적용되며 운영방법으로 현장학습, 답사 등이 있다.","id":"gwajeong-m93"},{"ch":"CH03 교육과정 설계의 원리","t":"생성형 설계","q":"생성형 설계의 단점으로 옳지 않은 것은?","opts":["교육과정 내용의 자유도가 지나치게 낮다","초보교사가 운영하기 어렵기 때문에 교사의 유능성이 중요함","즉흥적인 흥미나 주제에 지나치게 초점이 맞춰질 경우 교육내용이 깊이 있게 다루어지기보다는 피상적으로 다루어질 우려가 있음","어느 형태보다 현실성이 강하나, 내용상의 계열성과 관련성을 지니기는 어려움"],"a":0,"exp":"'교육과정 내용의 자유도가 높음'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m94"},{"ch":"CH03 교육과정 설계의 원리","t":"중핵형 설계","q":"중핵형 설계(core design)의 개념으로 옳은 것은?","opts":["사람들이 일상생활에서 겪는 공통된 문제나 과제를 중심으로 그 문제를 해결하는 과정에 맞춰 수업내용을 구성하는 설계방식으로, 중심부인 중핵과정과 주변과정이 동심원적으로 결합된 설계방식","교과의 논리적 구조에 따라 독립적으로 조직하는 설계방식","사전에 계획하지 않고 현장에서 함께 만들어가는 설계방식","유사한 교과들을 묶어 하나의 교과로 재조직하는 설계방식"],"a":0,"exp":"중핵형 설계는 일상생활의 공통된 문제나 과제를 중심으로 수업내용을 구성하며, 중핵과정(core course)과 주변과정(fringe course)이 동심원적으로 결합된 설계방식이다.","id":"gwajeong-m95"},{"ch":"CH03 교육과정 설계의 원리","t":"중핵형 설계","q":"중핵형 설계의 특징으로 옳지 않은 것은?","opts":["교과의 선을 유지하며 교과별로 분리하여 운영함","중핵교육과정의 수업은 주로 블록타임 형식으로 운영됨","모든 학습자에게 공통적으로 필요하다고 여겨지는 핵심적인 학습활동으로 구성됨","학습해야 할 주요 대상이나 주제는 사회문제가 되지만, 학습의 과정은 학습자의 흥미에 기초해 이루어지도록 함"],"a":0,"exp":"중핵형 설계는 '교과의 선을 없애고 학습자의 공통된 요구, 문제, 관심 등을 중심으로 교육내용을 조직'하므로 ①은 정반대이다.","id":"gwajeong-m96"},{"ch":"CH03 교육과정 설계의 원리","t":"중핵형 설계","q":"중핵형 설계의 유형 중 '사회중심 중핵교육과정'에 해당하는 설명은?","opts":["사회적인 문제나 기능을 중핵의 요소로 삼는 교육과정","여러 교과를 통합하여 이를 중핵의 요소로 삼는 교육과정","학습자 개인의 필요와 흥미를 중핵의 요소로 삼는 교육과정","교사와 학생이 함께 만들어가는 교육과정"],"a":0,"exp":"사회중심 중핵교육과정은 사회적인 문제나 기능을 중핵의 요소로 삼는다. ②는 교과중심, ③은 개인중심 중핵교육과정이다.","id":"gwajeong-m97"},{"ch":"CH03 교육과정 설계의 원리","t":"중핵형 설계","q":"중핵형 설계의 단점으로 옳지 않은 것은?","opts":["교육자료 수집이 용이하고 수업준비 시간이 적게 소요된다","중심주제를 이해하고 문제를 해결하는 데 중점을 두기 때문에 교과의 지식을 체계적으로 학습하기 어려움","범위가 제한되지 않은 방만한 운영이 이루어질 경우 시간과 경비가 많이 듦","통합에 미숙한 교사는 교과도 경험도 모두 실패할 위험이 높으며, 결과적으로 학습한 결과를 평가하는 데 어려움이 많음"],"a":0,"exp":"'수업을 위한 교육자료를 수집하는 데 어려움이 따르며 수업준비에도 많은 시간이 소요됨'이 단점이므로 ①은 정반대이다.","id":"gwajeong-m98"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"통합교육과정의 개념과 목적으로 옳지 않은 것은?","opts":["교과 간 경계를 강화하여 각 교과의 전문성을 높이는 것이 목적이다","교육의 성과를 높이기 위하여 교육과정의 구성요소들을 결합하는 것이다","분절된 지식과 경험을 의미 있는 방식으로 서로 관련지어 가르침으로써 학생들의 전인적 발달을 도모하고자 한다","학교교육을 통해 사회를 보다 민주주의적으로 개혁하고자 하는 이상을 반영한다"],"a":0,"exp":"통합교육과정은 교과 간 경계 강화가 아니라 구성요소들을 결합하는 것이 목적이므로 ①은 옳지 않다.","id":"gwajeong-m99"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"교육과정을 통합하는 '학교수준 방안'으로 옳은 것은?","opts":["학교 단위에서 교과 내, 교과 간, 과목 내, 과목 간, 교과와 창의적 체험활동 등을 통합하는 교육과정 재구성","학생의 발달수준에 부응하거나 사회의 요구를 반영하기 위해 기존의 교과나 프로그램을 통합하여 새로운 교과를 개발함","시·도 교육청이 편성·운영지침을 마련함","국가교육과정 문서를 고시함"],"a":0,"exp":"학교수준 방안은 학교 단위에서 교과 내·간, 과목 내·간, 교과와 창의적 체험활동 등을 통합하는 교육과정 재구성이다. ②는 국가수준 방안이다.","id":"gwajeong-m100"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"교과의 통합적 운영의 교육적 가치로 제시되지 않은 것은?","opts":["교과별 지식의 위계와 계열성을 더욱 엄격하게 유지할 수 있음","교과들 속에 포함된 중복된 내용들과 중복된 기능들을 줄임으로써 학생들이 배워야 할 필수적 교육내용을 배울 시간을 확보해줌","교과 학습과 생활과의 연관성을 높여 교과 학습의 의미를 삶과 관련지어 인식할 수 있게 해줌","현대사회의 쟁점을 파악하는 데 도움을 주고, 현대사회에서 발생하는 복잡한 문제들을 해결하는 능력을 길러줌"],"a":0,"exp":"제시된 교육적 가치는 ②③④와 '지식의 폭발적 증가로 교육내용 선정이 어려운 문제이므로 상호관련되는 내용을 묶어 필수적 교육내용 선정에 도움을 줌', '학생들의 흥미와 관심을 반영하기 쉬우며 학습선택권이 확대됨'이다.","id":"gwajeong-m101"},{"ch":"CH03 교육과정 설계의 원리","t":"통합의 원리","q":"교육과정 통합의 원리 중 '적합성의 원리'에 해당하는 설명은?","opts":["통합단원이 학습자의 개성과 수준에 맞아야 하고, 학습자의 전인격적 성장을 목표로 해야 함","교과통합이 학습자의 흥미와 관심뿐 아니라 지적 능력의 개발을 목표로 하므로 각 교과의 중요한 내용이 반영되어야 함","통합단원의 내용과 활동이 단원의 목표 달성을 위해 고안된 수업전략 및 방법에 부합해야 함","교육과정의 여러 측면이 상호관련성을 맺도록 설계하는 것"],"a":0,"exp":"적합성의 원리는 통합단원이 학습자의 개성과 수준에 맞고 전인격적 성장을 목표로 해야 한다는 것이다. ②는 중요성의 원리, ③은 일관성의 원리이다.","id":"gwajeong-m102"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정 지원","q":"통합교육과정의 효과적인 개발과 운영을 위한 단위학교 차원의 지원방안으로 옳은 것은?","opts":["통합교육과정의 시간 운영(융통성 있는 시간표 구성), 시간 외 업무수당 지급, 운영자료 구비 지급, 기타 운영 공간과 시설 제공, 자원의 구비 등","국가교육과정 문서의 개정","시·도 교육청 지침의 표준화","교사 자격증 제도의 개편"],"a":0,"exp":"단위학교 차원의 지원방안은 융통성 있는 시간표 구성, 시간 외 업무수당 지급, 운영자료 구비 지급, 운영 공간과 시설 제공, 자원의 구비 등이다.","id":"gwajeong-m103"},{"ch":"CH03 교육과정 설계의 원리","t":"통합 설계유형","q":"교육과정 통합의 설계유형 중 '간학문적 통합'의 개념으로 옳은 것은?","opts":["학문 간 경계를 허물고 여러 교과의 공통부분(주제, 개념, 기능, 탐구방법 등)을 추출하고, 이를 중심으로(빅아이디어 등) 교육과정을 조직함","학문의 독립성을 유지하며 하나의 주제에 대해 여러 학문의 관점을 다룸","교과 구분을 초월하여 실제 생활의 주제나 쟁점들을 중심으로 새로운 형태의 통합교과를 형성함","교과나 과목 간에 관련 있는 내용을 비슷한 시간대에 집중적으로 배울 수 있도록 순서를 조정함"],"a":0,"exp":"간학문적 통합은 학문 간 경계를 허물고 공통부분을 추출해 조직하는 것이다. ②는 다학문적 통합, ③은 탈학문적 통합, ④는 교과 간 병렬이다.","id":"gwajeong-m104"},{"ch":"CH03 교육과정 설계의 원리","t":"통합 설계유형","q":"'교과 내 병렬'의 개념으로 옳은 것은?","opts":["교과나 과목 내에서 관련 있는 내용을 비슷한 시간대에 집중적으로 배울 수 있도록 순서를 조정하는 것","교과나 과목 간에 관련 있는 내용을 비슷한 시간대에 집중적으로 배울 수 있도록 순서를 조정하는 것","학문의 독립성을 유지하며 하나의 주제를 여러 학문의 관점에서 다루는 것","교과 구분을 초월하여 새로운 통합교과를 형성하는 것"],"a":0,"exp":"교과 내 병렬은 교과나 과목 '내에서' 관련 있는 내용의 순서를 조정하는 것이다. ②는 교과 간 병렬이다.","id":"gwajeong-m105"},{"ch":"CH03 교육과정 설계의 원리","t":"드레이크","q":"드레이크(Drake)의 통합교육과정 유형 중 '다학문적 통합'의 조직 구심점과 내용조직의 특징으로 옳은 것은?","opts":["특정 교과로부터 추출된 주제 / 개별 교과의 정체성 유지","여러 교과에 걸쳐 강조될 필요가 있는 중요한 주제나 개념, 혹은 기능 / 교과 간 엄격한 경계가 무너짐","문제나 쟁점 중심 / 교과 간의 경계가 사라짐","개별 교과의 내용과 기능 습득 / 교과 간 경계 유지"],"a":0,"exp":"다학문적 통합은 특정 교과로부터 추출된 주제를 구심점으로 하고 개별 교과의 정체성을 유지하며, 학문의 주된 목적은 개별 교과의 내용과 기능 습득이다. ②는 간학문적, ③은 탈학문적 통합이다.","id":"gwajeong-m106"},{"ch":"CH03 교육과정 설계의 원리","t":"드레이크","q":"드레이크(Drake)의 '탈학문적 통합'의 학문의 주된 목적으로 옳은 것은?","opts":["문제나 쟁점 중심의 주제 탐구","개별 교과의 내용과 기능 습득","간학문적인 주제, 개념, 기능 습득","교과 간 위계의 확립"],"a":0,"exp":"탈학문적 통합은 문제나 쟁점 중심으로 조직되고 교과 간 경계가 사라지며, 학문의 주된 목적은 문제나 쟁점 중심의 주제 탐구이다.","id":"gwajeong-m107"},{"ch":"CH03 교육과정 설계의 원리","t":"KDB 모형","q":"KDB 모형의 핵심요소 중 '기능(do)'에 해당하는 설명은?","opts":["학생들이 할 수 있어야 할 가장 중요한 것으로, 의사소통이나 정보관리 등 여러 교과를 아우르는 폭넓은 기능뿐 아니라 Bloom의 교육목표분류학에서 제시한 다양한 인지적 기능을 포함함","학생들이 알아야 할 가장 중요한 것으로, 사실이나 개념 혹은 지속적인 이해를 포함함","학생들이 갖추어야 할 가치나 태도로, 상대방을 배려하고 협력하고 공존할 수 있는 태도나 가치관 형성에 초점을 둠","학생들이 도달해야 할 성취기준"],"a":0,"exp":"기능(do)은 학생들이 할 수 있어야 할 가장 중요한 것이다. ②는 지식(know), ③은 인성(be)이다.","id":"gwajeong-m108"},{"ch":"CH03 교육과정 설계의 원리","t":"KDB 모형","q":"KDB 모형의 의의로 옳지 않은 것은?","opts":["국가교육과정의 성취기준을 배제하고 활동 위주로 수업을 구성할 수 있게 해줌","교사 혹은 단위학교의 '자율성'을 구현할 수 있게 해줌","학생들에게 적합하고 필요에 맞는 맥락에서 운영하되, 기존의 교육과정을 근간으로 성취기준을 강조하므로 '책무성'을 지님","왜 필요한지 모르고 활동 위주로만 수업을 구성하는 피상성의 함정에서 벗어나 '엄밀성'을 보장할 수 있음"],"a":0,"exp":"KDB 모형은 성취기준을 강조하여 책무성을 지니고 활동 위주 구성의 피상성 함정에서 벗어나게 하므로 ①은 정반대이다.","id":"gwajeong-m109"},{"ch":"CH03 교육과정 설계의 원리","t":"통합교육과정","q":"교육과정 통합의 단점으로 옳지 않은 것은?","opts":["교육과정 운영의 효율성이 크게 저하됨","교과의 내용을 논리적이고 의미 있는 방식으로 연결지어 통합교육과정을 구성하는 것이 어려움","특정 주제나 쟁점을 중심으로 교육과정을 구성하기 때문에 학습자로 하여금 혼란을 야기할 수 있음","통합교육과정을 구성하는 일은 많은 시간과 노력을 요구하기 때문에 교사의 업무적 부담이 가중될 수 있음"],"a":0,"exp":"'교육내용을 통합함으로써 교육과정을 효율적으로 운영할 수 있음'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m110"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 잠정적 교육목표를 설정할 때 자료원으로 삼는 3가지로 옳은 것은?","opts":["학습자에 관한 연구, 사회의 요구에 관한 조사, 교과 전문가의 견해","교육철학, 학습심리학, 사회학","교과, 학습자, 평가","국가, 지역, 학교"],"a":0,"exp":"잠정적 교육목표 설정의 자료원은 ①학습자에 관한 연구 ②사회의 요구에 관한 조사 ③교과 전문가의 견해이다.","id":"gwajeong-m111"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 최종적 교육목표를 설정하는 과정에서 체(screen)로 삼는 2가지와 최종목표 진술방안으로 옳은 것은?","opts":["교육철학과 학습심리학 / '행동목표'로 진술","학습자 연구와 사회 요구 조사 / '내용목표'로 진술","교과 전문가 견해와 사회 요구 / '표현적 결과'로 진술","교육철학과 사회학 / '문제해결목표'로 진술"],"a":0,"exp":"체(screen)는 ①교육철학(좋은 삶과 좋은 사회의 성격에 대한 교육자의 가치관 ⇒ 잠정적 목표의 바람직성과 우선순위 결정) ②학습심리학(학습자의 발달상황과 학습환경에 대한 이해 ⇒ 학습가능성과 교수가능성)이며, 최종목표는 '행동목표'로 진술할 것을 제안한다.","id":"gwajeong-m112"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 학습경험 선정의 원리 중 '(일경험) 다성과의 원리'에 해당하는 설명은?","opts":["하나의 학습경험이 대개 여러 가지 학습성과를 가져오므로 동일한 조건이라면 학습경험을 선정할 때 여러 교육목표 달성에 도움이 되고 전이효과가 높은 학습경험을 선택함","하나의 교육목표 달성에 사용할 수 있는 학습경험은 여러 가지가 있을 수 있음","학습경험에서 요구되는 학생의 반응이 현재 그 학생의 능력범위 안에 있어야 함","학생이 교육목표가 권고하는 행동을 수행하는 과정에서 만족감을 느껴야 함"],"a":0,"exp":"(일경험) 다성과의 원리는 하나의 학습경험이 여러 학습성과를 가져오므로 여러 목표 달성에 도움이 되고 전이효과가 높은 경험을 선택하는 것이다. ②는 (일목표) 다경험의 원리, ③은 가능성의 원리, ④는 만족의 원리이다.","id":"gwajeong-m113"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)의 학습경험 조직의 원리 중 '통합성'에 해당하는 설명은?","opts":["교육과정 요소를 수평적으로 연관시키는 것으로, 각 학습경험이 단편적이지 않고 조화롭게 연결되도록 조직해야 함","같은 내용의 반복으로, 중요한 경험요소가 반복되도록 조직해야 함","다른 내용들의 순서적 배열로, 점차 경험의 수준을 높여 더욱 깊이 있고 폭넓은 학습이 가능하도록 조직해야 함","시간적 순서에 따라 교육내용을 순차로 배치해야 함"],"a":0,"exp":"통합성은 교육과정 요소를 수평적으로 연관시켜 각 학습경험이 조화롭게 연결되도록 조직하는 것이다. ②는 계속성, ③은 계열성이다.","id":"gwajeong-m114"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 학습경험의 조직구조 중 '중층구조'에 해당하는 설명은?","opts":["상층구조의 각 하위영역의 조직을 결정하는 문제로, 계열성을 고려하여 학습경험을 조직하는 '계열구조'와 비연속적으로 학습경험을 조직하는 '비계열구조'가 존재함","커리큘럼의 전체적인 테두리를 결정하는 문제로 교과목중심, 교과영역중심, 공통문제중심, 학생활동중심의 구조가 존재함","학습내용을 가장 작은 단위로 조직하는 문제로 차시수업(lesson), 주제(topic), 단원(unit) 등을 의미함","학습경험을 수평적으로 연관시키는 문제"],"a":0,"exp":"중층구조는 상층구조의 각 하위영역 조직을 결정하는 문제로 계열구조와 비계열구조가 존재한다. ②는 상층구조, ③은 하층구조이다.","id":"gwajeong-m115"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler)가 제안한 학습경험 평가의 원칙으로 옳지 않은 것은?","opts":["평가는 지필평가만을 사용하여 객관성을 확보해야 한다","교육목표가 행동목표로 진술되었듯이 학습경험의 평가도 학생의 행동을 평가대상으로 함","학생의 행동변화를 평가하기 위해 일정 기간 내에 적어도 두 번 이상의 평가가 필요함","평가의 방법은 지필평가 외에도 관찰, 인터뷰, 설문지, 포트폴리오 등 다양한 방법이 동원될 수 있으며 평가의 타당성과 신뢰도가 확보되어야 함"],"a":0,"exp":"타일러는 지필평가 외 다양한 방법이 동원될 수 있다고 하였으므로 ①은 옳지 않다.","id":"gwajeong-m116"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler) 교육과정 개발모형의 장점으로 옳지 않은 것은?","opts":["교육목표나 교육내용이 무엇이어야 하는가에 대해 직접적인 답을 제공함","실용성: 어떤 교과나 수업의 수준에서도 활용·적용될 수 있음","명료한 평가지침: 교육목표를 명료한 행동목표로 진술함으로써 교사가 뚜렷한 기준에 근거하여 학습경험을 평가할 수 있음","용이성: 논리적이고 합리적인 절차를 제시하고 있으므로 교육과정 개발자나 교사가 쉽게 따라할 수 있음"],"a":0,"exp":"'교육과정 개발의 기준, 절차 혹은 방법에만 관심을 둠으로써 교육목표나 교육내용이 무엇이어야 하는가에 대해서는 직접적인 답을 제공하지 못함'이 단점이므로 ①은 정반대이다.","id":"gwajeong-m117"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타일러","q":"타일러(Tyler) 모형의 단점 중 '수업의 역동성 무시'에 해당하는 설명은?","opts":["교육목표(평가준거)를 미리 설정하기 때문에 수업 진행 중 새롭게 생겨날 수 있는 표현적 결과를 평가에 반영할 수 없음","교육목표를 내용보다 우위에 두기 때문에 교육내용을 단순 목표달성을 위한 수단으로 전락시킴","실제 다양한 참여자들의 역동 속에서 이루어지는 복잡하고 양방향적인 교육과정 개발절차를 제대로 설명하지 못함","개발과정에 개입될 수 있는 보이지 않는 정치적 측면에 관심이 없음"],"a":0,"exp":"수업의 역동성 무시는 목표를 미리 설정하여 수업 중 새롭게 생기는 표현적 결과를 평가에 반영할 수 없다는 것이다. ②는 교육과정의 내용 도외시, ③은 실제 교육과정 개발과의 괴리이다.","id":"gwajeong-m118"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 교육과정 개발모형의 명칭 중 '풀뿌리 개발모형'에 해당하는 설명은?","opts":["학생들의 요구에서 출발하고 교사와 지역사회, 학부모 등이 협력하여 학생들의 필요와 관심사에 맞춘 교육과정을 만듦","교사가 중심이 되어 교육과정의 구체적인 내용들을 개발하고, 내용들을 귀납하여 교육과정 일반을 설계함","단원 수준의 교육과정 개발을 강조함","교사가 교육과정을 개발함"],"a":0,"exp":"풀뿌리 개발모형은 학생들의 요구에서 출발하고 교사·지역사회·학부모가 협력하여 학생의 필요와 관심사에 맞춘 교육과정을 만드는 것이다. ②는 귀납적 개발모형, ③은 단원개발모형, ④는 교사중심 개발모형이다.","id":"gwajeong-m119"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba) 모형이 타일러 모형과 구별되는 특징으로 옳지 않은 것은?","opts":["연역적으로 교육과정 일반을 먼저 설계한 후 단원을 개발함","교육내용과 학습경험을 구분함 — 교육내용은 학생들이 배울 것으로 기대되는 교과나 지식을 가리키는 반면 학습경험은 학생들이 그 내용을 이해할 수 있도록 사용되는 교육활동과 관련됨","교사중심의 교육과정 개발모형이기 때문에 현장지향적이며 교사의 역할을 강조함","귀납적임 ⇒ 단원을 개발하고 나서 교과와 교육과정 일반을 설계함"],"a":0,"exp":"타바 모형은 귀납적으로 단원을 먼저 개발하고 교육과정 일반을 설계하므로 ①은 정반대이다.","id":"gwajeong-m120"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 풀뿌리 논리(grassroots rationale) 8단계 중 1단계에 해당하는 것은?","opts":["요구진단 — 교육과정 계획의 대상이 되는 학생들의 요구를 확인함","목표설정 — 성취되어야 할 목표를 구체화함","내용선정 — 선정 또는 생성된 목표에 맞는 교과 또는 내용을 선정함","균형과 계열성 검증 — 개발된 단원 내용이 균형 있고 계열성에 따르는지 검토함"],"a":0,"exp":"풀뿌리 논리 8단계는 요구진단 → 목표설정 → 내용선정 → 내용조직 → 학습경험 선정 → 학습활동 조직 → 평가내용·방법·수단 결정 → 균형과 계열성 검증 순이다.","id":"gwajeong-m121"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba)의 풀뿌리 논리 중 '내용조직' 단계에 해당하는 설명은?","opts":["선정된 내용을 학습자의 발달수준, 학업성취, 흥미 등을 고려하여 계열성에 따라 조직함","학생을 학습에 참여하도록 하는 수업방법을 선정함","내용의 조직방식에 따라 학습경험을 조직하되 학생의 특성에 따라 조직방식을 달리할 수 있음","평가내용과 방법, 도구 등을 결정함"],"a":0,"exp":"내용조직은 선정된 내용을 학습자의 발달수준·학업성취·흥미를 고려하여 계열성에 따라 조직하는 단계이다. ②는 학습경험 선정, ③은 학습활동 조직, ④는 평가내용·방법·수단 결정이다.","id":"gwajeong-m122"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba) 모형에서 개발된 단원 활용의 5단계 중 3단계에 해당하는 것은?","opts":["개정 및 통합 — 개발된 단원을 개정 및 통합하여 모든 유형의 학급에도 잘 맞는 보편화된 교육과정을 개발함","시험적 교수·학습단원 구성 — 풀뿌리 논리에 따라 시험단원의 구성이 이루어짐","구조 개발 — 여러 개의 단원들을 구조화하여 전체적인 범위와 계열성을 검증함","새 단원 정착 및 확산 — 새 단원을 실제 교실수업에 본격적으로 투입·정착시키고 교사들의 현직연수 등을 통해 확산시킴"],"a":0,"exp":"5단계는 1단계 시험적 교수·학습단원 구성 → 2단계 시험단원 검증 → 3단계 개정 및 통합 → 4단계 구조 개발 → 5단계 새 단원 정착 및 확산 순이다.","id":"gwajeong-m123"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"타바","q":"타바(Taba) 모형의 단점으로 옳지 않은 것은?","opts":["교육과정 개발과정에 교사의 참여를 배제하여 최근의 추세에 부합하지 않음","단원 개발에서 교육과정 일반으로 나아가는 모형의 특성상, 교사가 개별 교과 또는 매 차시 수업에 천착하면 전체 교육과정에 대한 이해로 나아가지 못할 수 있음","국가 및 지역단위 교육과정 개발을 교사에게 맡기는 것은 부적절할 수 있음","교사가 자신이 가르치는 교과의 이해관계에서 벗어나기 어려움"],"a":0,"exp":"타바 모형은 교사의 참여를 독려하는 최근 추세에 부합하는 것이 장점이므로 ①은 정반대이다.","id":"gwajeong-m124"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"워커","q":"워커(Walker)가 제안한 교육과정 개발모형의 특징으로 옳지 않은 것은?","opts":["개발의 각 단계는 선형적이고 고정적인 특징을 지님","다양한 관점을 가진 교육과정 개발자들이 타협하며 교육과정 설계에 대한 의사결정을 하는 과정에 주목함","교육과정 개발 참여자들 간의 의견이 타협되고 조정되는 과정인 '숙의'를 강조함","교육과정 개발자들이 실제로 따르고 있는 절차를 서술하는 것에 중점을 둠"],"a":0,"exp":"워커 모형은 '개발의 각 단계는 비선형적이고 역동적인 특징을 지님'이므로 ①은 정반대이다.","id":"gwajeong-m125"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"워커","q":"워커(Walker)의 자연주의적 교육과정 개발모형에서 '강령(platform)' 단계에 해당하는 설명은?","opts":["교육과정 개발에 참여하는 모든 사람들이 그들이 개발해야 할 교육과정이 어떤 것이 되어야 하는지에 대해 각자 갖고 있는 개인적인 신념과 가치를 공유하는 단계로, 서로의 입장을 확인하고 공감대를 형성함","교육과정에 대한 다양한 생각을 가진 사람들이 대화와 회의를 통해 최선의 대안을 선택하는 실제적인 과정","선택한 추상적인 아이디어를 최종 산출물로 만들어내기 위해 구체화하는 단계","학교의 외적 요인과 내적 요인을 분석하는 단계"],"a":0,"exp":"강령(platform)은 개인적 신념과 가치를 공유하고 서로의 입장을 확인해 공감대를 형성하는 단계이다. ②는 숙의(deliberation), ③은 설계(design)이다.","id":"gwajeong-m126"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"워커","q":"워커(Walker) 모형의 '설계(design)' 단계에 해당하는 설명은?","opts":["선택한 추상적인 아이디어를 최종 산출물로 만들어내기 위해 구체화하는 단계(교과 및 수업자료, 수업활동 창출, 이를 위한 행정·재정적인 지원절차 계획)","개인적인 신념과 가치를 공유하는 단계","대화와 회의를 통해 최선의 대안을 선택하는 실제적인 과정","교육과정 실행 후 효과를 평가하는 단계"],"a":0,"exp":"설계 단계는 선택한 아이디어를 최종 산출물로 구체화하는 단계이다.","id":"gwajeong-m127"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 교육과정 개발모형의 명칭은?","opts":["학교중심 교육과정 개발모형(SBCD; School Based Curriculum Development)","자연주의적 교육과정 개발모형","합리적-선형적 개발모형","풀뿌리 개발모형"],"a":0,"exp":"스킬벡의 모형은 학교중심 교육과정 개발모형(SBCD)이다.","id":"gwajeong-m128"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck) 모형의 특징으로 옳지 않은 것은?","opts":["반드시 정해진 순서에 따라 첫 단계부터 시작해야 하는 선형적 모형이다","사회의 특징과 학교의 교육상황을 비판적으로 분석하는 '상황분석'을 교육과정 개발의 출발점으로 봄","교육과정이 학교, 교사, 학생의 특성에 따라 다르게 구성되어야 함을 강조","교사, 학생, 학부모, 지역사회의 요구에 따라 수정 가능하기 때문에 역동적이고 상호작용적인 모형임"],"a":0,"exp":"스킬벡 모형은 개발자가 적합하다고 생각하는 단계에서 시작을 권고하므로 순서와 무관하게 시작 가능하고 단계의 결합도 가능한 개방적·비선형적 모형이다.","id":"gwajeong-m129"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)의 교육과정 개발 절차 중 '판단(해석)과 실행' 단계에 해당하는 설명은?","opts":["저항이나 혼란을 일으킬 수 있는 문제들을 미리 예측하고 경험, 관련 이론, 통찰력을 통해 문제를 해결함","학교의 외적 요인과 내적 요인을 분석함","교수·학습활동의 설계, 적절한 보조자료와 매체 선정, 인사 배치와 역할 분담, 교육환경 및 시간표 설계 등","연속적으로 평가되어야 할 문항들을 점검하고 평가를 통해 교육과정을 끊임없이 재구성함"],"a":0,"exp":"판단(해석)과 실행 단계는 저항·혼란을 일으킬 수 있는 문제들을 미리 예측하고 경험·이론·통찰력으로 해결하는 단계이다. ②는 상황분석, ③은 프로그램 구성, ④는 평가이다.","id":"gwajeong-m130"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck)이 제안한 상황분석의 대상 중 '내적 요인'에 해당하는 예로 옳은 것은?","opts":["학생의 적성·능력·교육적 요구, 교사의 가치관·태도·기능·지식·경험·강점과 약점, 학교의 환경과 정치적 구조, 학교의 시설 등","사회·문화적 변화와 기대, 교육체제 권고, 변화하는 교과의 성격, 교사 지원체제, 학교 자원 흐름 등","교수·학습활동의 설계와 매체 선정","평가 문항의 점검과 재구성"],"a":0,"exp":"내적 요인은 학생의 적성·능력·교육적 요구, 교사의 가치관·태도·기능·지식·경험, 현재 교육과정의 문제와 단점, 학교의 환경과 정치적 구조, 학교 시설 등이다. ②는 외적 요인이다.","id":"gwajeong-m131"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"스킬벡","q":"스킬벡(Skilbeck) 모형의 단점으로 옳지 않은 것은?","opts":["각 학교의 특성을 고려한 교육과정 개발이 어려움","교육과정 개발자로 교사가 참여할 시, 교사는 업무의 부담을 느낄 수 있음","명확한 목표를 설정하지 않기 때문에 혼란을 야기할 수 있음","학교의 여건이나 교사의 전문성에 따라 각 학교 교육과정의 폭이나 깊이가 차이 날 수 있음"],"a":0,"exp":"'각 학교의 특성을 고려한 교육과정 개발이 용이함'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m132"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 행동목표에 대한 대안으로 제시한 교육목표 중 '문제해결목표'에 해당하는 설명은?","opts":["어떤 문제와 그 문제를 해결할 때 지켜야 할 조건이 주어지면, 문제와 조건은 명확하지만 해결책이 여러 가지일 수 있는 목표유형","미리 정하거나 예측하지 않았지만 어떤 활동을 하는 도중이나 끝난 후 획득한 교육적으로 바람직한 결과","학습자의 폭넓은 학습경험을 위해 교육목표와 내용을 의미 있게 변형하는 능력","학생의 성취형태 간 미묘한 차이를 감지할 수 있는 능력"],"a":0,"exp":"문제해결목표는 문제와 조건은 명확하지만 해결책이 여러 가지일 수 있는 목표유형이다. ②는 표현적 결과이다.","id":"gwajeong-m133"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 교육과정 내용 선정에서 반드시 고려해야 한다고 주장한 교육과정과 그 원천으로 옳은 것은?","opts":["영교육과정 / 학습자, 사회, 교과목","잠재적 교육과정 / 군집성, 상찬, 권력","공식적 교육과정 / 국가, 지역, 학교","경험된 교육과정 / 교사, 학생, 환경"],"a":0,"exp":"아이즈너는 교육과정 내용 선정에서 영교육과정을 고려해야 한다고 주장했으며, 그 원천은 학습자, 사회, 교과목이다.","id":"gwajeong-m134"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)의 '교육적 상상력'의 개념으로 옳은 것은?","opts":["학습자의 폭넓은 학습경험을 위해 교사가 교육목표와 내용을 학생들에게 의미 있게 변형하는 능력","학생의 성취형태 간 미묘한 차이를 감지할 수 있는 능력","교사가 발견해낸 미묘한 교육적 성과의 차이를 공적인 언어의 형태로 표현한 것","실생활에서 학생들의 문제해결력을 평가하기 위한 방안"],"a":0,"exp":"교육적 상상력은 교사가 교육목표와 내용을 학생들에게 의미 있게 변형하는 능력이며, 그 효과는 학생에게 의미 있고 만족스러운 다양한 학습기회를 제공할 수 있다는 것이다. ②는 교육적 감식안, ③은 교육비평, ④는 참평가이다.","id":"gwajeong-m135"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 강조한 학습기회 조직방안과 내용영역 조직방안으로 옳은 것은?","opts":["거미줄 조직(학생이 여러 과제에 동시에 접근하여 다양한 학습결과를 얻을 수 있도록 비선형적 접근방식) / 범교과적 조직(다양한 교과를 넘나들며 아우르는 조직방안)","나선형 조직 / 분과형 조직","계열적 조직 / 상관형 조직","동심원적 조직 / 광역형 조직"],"a":0,"exp":"아이즈너는 학습기회 조직으로 거미줄 조직을, 내용영역 조직으로 범교과적 조직을 강조하였다.","id":"gwajeong-m136"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)가 제안한 교사의 교육과정 제시방식의 특징으로 옳은 것은?","opts":["교사는 문자에 의한 소통뿐 아니라 시각, 청각 등을 활용한 다양한 제시방식을 수업에서 활용해야 하며, 시적 표현이나 은유적인 표현양식을 통한 의사소통은 언어의 양식을 통한 의사소통보다 더 강력한 의미를 지님","교사는 문자 중심의 일관된 제시방식을 사용해야 함","교사는 학문의 논리적 체계에 따라 제시해야 함","교사는 성취기준에 따라 표준화된 방식으로 제시해야 함"],"a":0,"exp":"아이즈너는 다양한 제시방식 활용과 시적·은유적 표현양식의 강력함을 강조하였다. 제시방식의 중요성은 학생의 발달에 영향을 주며, 한정된 의사소통 방식은 학생의 발달 기회를 빼앗는 것이다.","id":"gwajeong-m137"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)의 '참평가(Authentic assessment)'의 개념으로 옳은 것은?","opts":["단편적인 지식의 암기를 유도하지 않고, 실생활에서 학생들의 문제해결력을 평가하기 위한 방안","교육현상의 질적 속성을 정확하게 기술하고 묘사하는 것","학생의 성취형태 간 미묘한 차이를 감지하는 것","교육과정의 결과를 수량화하여 평가하는 것"],"a":0,"exp":"참평가는 단편적 지식 암기를 유도하지 않고 실생활에서 학생들의 문제해결력을 평가하기 위한 방안이다.","id":"gwajeong-m138"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"아이즈너","q":"아이즈너(Eisner)의 참평가를 구현하기 위한 방안으로 옳지 않은 것은?","opts":["평가과제는 문제 또는 질문에 대한 해결책 또는 답이 반드시 하나여야 함","과제는 학교 내에서만 국한된 것이 아닌, 학교 밖의 세계에서 부딪힐 수 있는 것이어야 함","평가과제는 결과뿐만 아니라 문제해결 과정도 보여줄 수 있어야 함","평가과제는 학생이 배운 것을 표현하기 위하여 사용하는 제시형태를 다양하게 선택할 수 있도록 허용하는 것이어야 함"],"a":0,"exp":"'평가과제는 문제 또는 질문에 대한 해결책 또는 답이 한 가지 이상이도록 구성되어야만 함'이므로 ①은 정반대이다.","id":"gwajeong-m139"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)가 교육과정 재개념화 주장을 통해 목적으로 삼은 바로 옳은 것은?","opts":["인간의 실존적 해방을 궁극적인 목적으로 삼고 교육과정이 사회적 맥락 속에서의 개개인의 고유한 경험이어야 한다고 주장함","교육목표의 효율적 달성을 목적으로 삼음","학문의 구조를 발견하는 것을 목적으로 삼음","역량 개발을 목적으로 삼음"],"a":0,"exp":"파이너는 인간의 실존적 해방을 궁극적 목적으로 삼고 교육과정이 사회적 맥락 속 개개인의 고유한 경험이어야 한다고 주장하였다.","id":"gwajeong-m140"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 이론에 영향을 미친 교육철학과 그 주요 주장으로 옳은 것은?","opts":["실존주의 — 개인이 미리 정해진 목적을 실현하는 도구가 아니며 개인들의 실존적 선택과 행동을 통해 삶의 가치와 의미를 창조해나감","본질주의 — 문화유산의 본질적 가치를 유지하고 전달함","항존주의 — 시공을 초월한 진리를 모두가 배워야 함","행동주의 — 관찰 가능한 행동의 변화를 중시함"],"a":0,"exp":"파이너에게 영향을 미친 교육철학은 실존주의이며, 인간의 주관적 경험·자유와 해방·삶의 책임과 의미를 중시하고, 소외와 교육의 비인간화 문제를 성찰한다.","id":"gwajeong-m141"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 쿠레레(Currere) 방법론의 개념으로 옳은 것은?","opts":["교사나 학생이 살아오면서 갖게 된 교육적 체험들을 자신의 존재 의미와 연관지어서 해석하여 교육적 상황을 이해하고, 자아를 성찰하는 자기반성적인 삶을 살아가도록 하는 탐구방법","학문의 구조를 발견하도록 하는 탐구방법","성취기준에 근거하여 평가를 설계하는 방법","교육과정 개발자들이 숙의를 통해 합의하는 방법"],"a":0,"exp":"쿠레레 방법론은 교육적 체험을 자신의 존재 의미와 연관지어 해석하여 자아를 성찰하는 자기반성적 삶을 살아가도록 하는 탐구방법이다.","id":"gwajeong-m142"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 쿠레레 방법론의 특징으로 옳지 않은 것은?","opts":["개인의 교육경험이 형성되는 사회·정치적 맥락은 배제하고 순수하게 개인 내적 경험만을 탐구함","개인의 내적 경험을 탐구하고, 학습자가 자기와 자신의 교육경험을 비판적으로 성찰하도록 유도함","개인의 전기적 탐구를 통해 인간의 생각과 행동에 내재된 무의식적 가정을 밝혀 교육적 경험의 본질과 의미를 이해하고자 함","과거지향적이면서 동시에 미래의 비전과 현재를 연결짓는다는 점에서 미래지향적이기도 함"],"a":0,"exp":"쿠레레 방법론은 '개인의 교육경험이 형성되는 사회·정치적 맥락을 고려한다는 점에서 정치적 특성을 지님'이므로 ①은 정반대이다.","id":"gwajeong-m143"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 쿠레레 방법 4단계 중 '분석'에 해당하는 설명은?","opts":["회귀, 진보 단계에서 각자의 과거 경험들과 미래의 비전을 통제함으로써 진실된 자신의 '전기적 현재'를 기록하는 것","과거로 돌아가 자유연상법에 기반하여 그동안의 교육적 경험을 되돌아봄","자유연상기법을 통해 현실화되지 않은 자신의 모습을 앞서 조망해보는 단계","현재의 의미를 종합적으로 파악하는 단계로 자기가 누구인지에 대해 진정한 내적 의식의 세계를 이해하는 단계"],"a":0,"exp":"쿠레레 방법 4단계는 회귀 → 진보 → 분석 → 종합이며, 분석은 과거 경험과 미래 비전을 통제하여 '전기적 현재'를 기록하는 단계이다. ②는 회귀, ③은 진보, ④는 종합이다.","id":"gwajeong-m144"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"파이너","q":"파이너(Pinar)의 자서전적 방법 3단계 중 2단계에 해당하는 것은?","opts":["교육경험을 비판적으로 성찰하기 — 한 사람이 쓴 글에 대하여 교사와 다른 학생들이 대화를 나누며 자신과 타인 및 세계에 대한 새로운 인식과 전망을 만들어가는 단계","자신의 교육경험을 표현하기 — 자서전적으로 글을 작성하는 단계","타인의 교육경험을 분석하기 — 다른 학생이 쓴 자서전을 함께 읽고 분석하는 단계","현재의 의미를 종합적으로 파악하는 단계"],"a":0,"exp":"자서전적 방법 3단계는 1단계 자신의 교육경험을 표현하기 → 2단계 교육경험을 비판적으로 성찰하기 → 3단계 타인의 교육경험을 분석하기 순이다.","id":"gwajeong-m145"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"애플","q":"애플(Apple)의 학교교육에 대한 비판으로 옳은 것은?","opts":["학교는 기성세대의 권력관계를 다음 세대에 전달하는 문화적 재생산 기능을 수행하며, 지배집단의 이데올로기를 마치 중립적·객관적인 것처럼 제공함으로써 교사와 학생을 통제함","학교는 학생의 흥미와 필요를 지나치게 반영하여 기초학력을 저하시킴","학교는 학문의 구조를 충실히 전달하지 못함","학교는 역량 중심의 교육과정을 운영하지 못함"],"a":0,"exp":"애플은 학교가 문화적 재생산 기능을 수행하고 지배집단 이데올로기를 중립적인 것처럼 제공하여 교사와 학생을 통제하며, 학교교육과정 속 지배적 이데올로기가 재생산된다고 비판하였다.","id":"gwajeong-m146"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"애플","q":"애플(Apple)의 교육과정에 대한 비판으로 옳은 것은?","opts":["학교는 공식적 교육과정을 통해 지배집단의 문화자본을 적법화시키며, 문화자본은 특수한 지위를 부여받아 공식적 교육과정을 통해 전달되고 자연스럽게 유지 및 계승됨","학교는 학습자의 흥미를 무시함","학교는 지식의 구조를 지나치게 강조함","학교는 통합교육과정을 운영하지 않음"],"a":0,"exp":"애플은 학교가 공식적 교육과정을 통해 지배집단의 문화자본을 적법화시키며, 계급 재생산은 교실과 경제의 직접적 대응보다는 공식적·잠재적 교육과정에 의해 문화적으로 이루어진다고 보았다.","id":"gwajeong-m147"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"애플","q":"애플(Apple)이 주장한 교사의 '탈숙련화(deskilling)'와 '재숙련화(reskilling)'의 개념으로 옳은 것은?","opts":["탈숙련화는 교사 개인의 고유한 지식과 관점을 보유하는 것이 불필요하게 되어 결국 교사로서의 전문성이 떨어지는 현상이고, 재숙련화는 교사가 주어진 교육용 소프트웨어를 단순히 실행하는 수업관리자로 전락하는 현상","탈숙련화는 교사가 수업관리자로 전락하는 현상이고, 재숙련화는 교사의 전문성이 향상되는 현상","탈숙련화는 교사가 새로운 기술을 습득하는 것이고, 재숙련화는 기존 기술을 잃는 것","탈숙련화는 교육과정 재구성 능력의 향상이고, 재숙련화는 교육과정 개발 능력의 향상"],"a":0,"exp":"탈숙련화는 교사 고유의 지식과 관점 보유가 불필요해져 전문성이 떨어지는 현상이고, 재숙련화는 주어진 교육용 소프트웨어를 단순 실행하는 수업관리자로 전락하는 현상이다.","id":"gwajeong-m148"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"이해중심 교육과정","q":"이해중심 교육과정(understanding by design)의 개념으로 옳은 것은?","opts":["학생들의 이해를 개발·심화시키는 데 목적을 두는 학교 또는 학급 수준의 교육과정 설계방식으로, 이때의 이해는 장기적으로 기억에 남고 새로운 상황으로 전이 가능한 '영속적 이해'를 말함","각 학문의 지식의 구조를 발견하도록 하는 교육과정","교사와 학생이 함께 만들어가는 교육과정","사회적 삶에 필요한 역량을 강화하는 교육과정"],"a":0,"exp":"이해중심 교육과정은 학생들의 이해(영속적 이해)를 개발·심화시키는 데 목적을 두는 학교 또는 학급 수준의 교육과정 설계방식이다.","id":"gwajeong-m149"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계(Backward design)에서 '백워드(Backward)'라는 말의 의미로 옳은 것은?","opts":["'역방향'이라는 뜻으로 '목표설정 → 평가 → 수업계획'의 순서를 따르며, 기존 교육과정 설계절차와 달리 평가계획을 수업계획보다 먼저 설계함을 의미함","'목표설정 → 수업계획 → 평가'의 순서를 따름을 의미함","과거의 교육경험으로 되돌아감을 의미함","교육과정을 학문의 구조로 되돌림을 의미함"],"a":0,"exp":"백워드는 '역방향'이라는 뜻으로 목표설정 → 평가 → 수업계획의 순서를 따르며 평가계획을 수업계획보다 먼저 설계함을 의미한다.","id":"gwajeong-m150"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계에서 '이해'와 '전이'의 개념으로 옳은 것은?","opts":["이해는 '영속적 이해'로 학습자가 사실을 모두 잊어버려도 남아 있는 가장 포괄적인 수준의 일반화와 원리를 의미하고, 전이는 학습한 아이디어나 사실, 기능 등을 새로운 상황이나 맥락 속에서 효율적으로 활용하는 능력","이해는 단편적 사실의 암기이고, 전이는 그 사실을 반복하는 능력","이해는 지식의 구조이고, 전이는 학문 간 경계를 허무는 것","이해는 성취기준 도달이고, 전이는 평가결과의 활용이다"],"a":0,"exp":"이해는 '영속적 이해'로 사실을 잊어버려도 남는 가장 포괄적인 수준의 일반화와 원리이며, 전이는 학습한 것을 새로운 상황이나 맥락에서 효율적으로 활용하는 능력이다.","id":"gwajeong-m151"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"이해의 여섯 측면","q":"위긴스와 맥타이가 제시한 이해의 여섯 가지 측면 중 '관점'에 해당하는 설명은?","opts":["하나의 현상을 다양한 관점, 즉 비판적이고 통찰력 있는 안목을 통해 볼 수 있는 능력","하나의 텍스트를 다양한 맥락에서 해석하고 사회적 의미를 파악하는 능력","다른 사람의 감정과 상황을 이해하고 상대방의 처지에서 상황을 이해하는 능력","자신의 무지를 알고, 지혜를 사랑하며, 자신의 사고와 행위를 성찰하는 능력"],"a":0,"exp":"관점은 하나의 현상을 다양한 관점(비판적·통찰력 있는 안목)으로 볼 수 있는 능력이다. ②는 해석, ③은 공감, ④는 자기지식이다.","id":"gwajeong-m152"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"이해의 여섯 측면","q":"이해의 여섯 가지 측면 중 '설명'과 '적용'에 해당하는 설명으로 옳은 것은?","opts":["설명 — 자신의 주장을 뒷받침하는 증거를 사용하여 개념과 현상에 대한 설명을 제공하는 능력 / 적용 — 새롭고 복잡한 상황에서 지식과 기술을 효과적으로 사용하는 능력","설명 — 텍스트를 다양한 맥락에서 해석하는 능력 / 적용 — 상대방의 처지에서 이해하는 능력","설명 — 자신의 사고를 성찰하는 능력 / 적용 — 비판적 안목으로 보는 능력","설명 — 다양한 관점에서 보는 능력 / 적용 — 사회적 의미를 파악하는 능력"],"a":0,"exp":"설명은 증거를 사용하여 개념과 현상에 대한 설명을 제공하는 능력이고, 적용은 새롭고 복잡한 상황에서 지식과 기술을 효과적으로 사용하는 능력이다.","id":"gwajeong-m153"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계 모형이 타일러 모형과 구별되는 차이점으로 옳은 것은?","opts":["평가계획 선행 및 강조 — 학습내용 선정에 앞서 평가계획을 매우 구체적으로 수립함","교육목표와 평가의 연계성을 강조함","교육내용을 목표달성의 수단으로 봄","논리적이고 합리적인 절차를 제시함"],"a":0,"exp":"백워드 설계는 타일러 모형처럼 목표와 평가의 연계성을 강조하는 공통점이 있으나, 학습내용 선정에 앞서 평가계획을 매우 구체적으로 수립한다는 점이 차이점이다.","id":"gwajeong-m154"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계 모형과 브루너 모형의 공통점으로 옳은 것은?","opts":["학문에 내재된 원리를 교육내용으로 삼음 — 브루너 모형이 '지식의 구조'를 교육내용으로 삼은 것과 같이, 백워드 설계 모형 또한 학문에 내재된 가장 중요한 개념이자 원리인 '영속적 이해'를 교육내용으로 삼음","둘 다 평가계획을 수업계획보다 먼저 수립함","둘 다 교사와 학생이 함께 교육과정을 만들어감","둘 다 행동목표 진술을 강조함"],"a":0,"exp":"공통점은 학문에 내재된 원리를 교육내용으로 삼는다는 것이다(지식의 구조 ↔ 영속적 이해).","id":"gwajeong-m155"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계의 절차 3단계 중 2단계에 해당하는 것은?","opts":["수용 가능한 증거 결정하기 — 학생들이 바라는 이해를 획득했다면 어떻게 그것을 확인할 수 있을지(평가)를 결정함","바라는 결과 확인하기 — 단원이 끝났을 때 학생들이 무엇을 알게 되고, 할 수 있어야 되는지(목표)에 대해 확인하는 것","학습경험과 수업 계획하기 — 1, 2단계에서 설계한 내용에 근거하여 학습경험과 수업을 계획함","교육과정 풀기 — 성취기준과 교육내용을 분석함"],"a":0,"exp":"백워드 설계 3단계는 1단계 바라는 결과 확인하기 → 2단계 수용 가능한 증거 결정하기 → 3단계 학습경험과 수업 계획하기이다.","id":"gwajeong-m156"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"위긴스와 맥타이가 제안한 교육과정 개발의 첫 단계에서 '교육과정 풀기'의 개념으로 옳은 것은?","opts":["성취기준과 교육내용을 분석하여 바람직한 학습결과를 찾아내는 작업으로, 국가교육과정 문서의 성취기준과 내용체계, 국가교육과정 해설서 등을 활용함","수행과제와 루브릭을 만드는 작업","학습경험과 수업을 계획하는 작업","평가결과를 해석하는 작업"],"a":0,"exp":"교육과정 풀기는 성취기준과 교육내용을 분석하여 바람직한 학습결과를 찾아내는 작업이다.","id":"gwajeong-m157"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"백워드 설계 모형의 2단계에서 교사가 해야 하는 일로 옳은 것은?","opts":["수행과제와 루브릭 만들기, 다른 증거 결정하기","바라는 결과 확인하기, 교육과정 풀기","학습경험과 수업 계획하기, 수업방법 구안하기","상황분석과 목표설정"],"a":0,"exp":"2단계에서 교사는 ①수행과제와 루브릭 만들기(실생활에 가까운 맥락에서 열린 문제를 활용한 수행과제 및 프로젝트 평가와 채점 루브릭) ②다른 증거 결정하기(선택형, 단답형, 서술식 문항과 같은 전통적인 시험이나 퀴즈 등 개발, 자기평가 기회 부여 계획)를 해야 한다.","id":"gwajeong-m158"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"GRASPS","q":"위긴스와 맥타이의 수행과제 개발 요소 GRASPS 중 'S(Standards)'에 해당하는 것은?","opts":["수행의 질을 판단하기 위한 평가기준 또는 준거(루브릭)","학습자가 수행과제에서 맡게 되는 사회적/직업적 역할","수행 결과물을 전달받는 실제적 대상/청중","학습자가 보여주어야 할 수행 결과 또는 산출물"],"a":0,"exp":"GRASPS는 목표(Goal), 역할(Role), 청중(Audience), 상황(Situation), 수행(Performance/Product), 기준(Standards)이며, 기준은 수행의 질을 판단하기 위한 평가기준 또는 준거(루브릭)이다.","id":"gwajeong-m159"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"WHERETO","q":"위긴스와 맥타이가 제안한 학습경험과 수업계획 시 고려할 사항(WHERETO) 중 'R'에 해당하는 것은?","opts":["Rethink, Reflect and Revise — 학생의 이해와 활동을 재고하고 성찰하고 개정할 수 있는 기회를 제공함","Where and What — 단원이 어디로 향하고 있는지, 무엇을 기대하는지 학생이 알 수 있도록 도와줌","Hook and Hold — 학생의 주의를 환기시키고 그들의 흥미를 유지함","Tailor — 서로 다른 요구와 흥미, 학습자의 능력에 맞춰 개별화함"],"a":0,"exp":"R은 Rethink, Reflect and Revise(재고·성찰·개정할 기회 제공)이다. ②는 W, ③은 H, ④는 T이다.","id":"gwajeong-m160"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"WHERETO","q":"WHERETO 요소 중 'E(Equip, Experience, and Explore)'에 해당하는 설명은?","opts":["학생을 준비시키고, 주요 아이디어를 경험할 수 있도록 하며, 이슈를 탐험하도록 도움","작품과 향상도를 평가함","효과적인 학습뿐만 아니라 주도적·지속적인 참여를 최대화할 수 있도록 조직함","학생의 주의를 환기시키고 흥미를 유지함"],"a":0,"exp":"첫 번째 E는 Equip, Experience, and Explore이다. ②는 두 번째 E(Evaluate), ③은 O(Organize), ④는 H(Hook and Hold)이다.","id":"gwajeong-m161"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"위긴스와 맥타이 모형의 단점으로 옳지 않은 것은?","opts":["목표, 내용, 평가가 분절되어 일체화되지 못함","목표를 우위에 두고 교육과정을 설계하게 되므로 교육내용이 목표달성을 위한 수단으로 전락됨","학문적 지식을 강조하여 학습자의 관심과 흥미가 배제될 가능성이 있음","평가계획을 수업계획에 앞서 수립하기 때문에 평가 의존적인 수업이 이루어질 가능성이 있음"],"a":0,"exp":"'목표와 평가에 따른 내용설계를 하므로 목표, 내용, 평가가 일체화됨'은 장점이므로 ①은 정반대이다.","id":"gwajeong-m162"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"백워드 설계","q":"위긴스와 맥타이 모형의 장점으로 옳은 것은?","opts":["국가교육과정 성취기준을 목표, 평가, 수업활동에 반영하므로 국가교육과정 기준과 현장수업이 일치하게 됨","교육내용이 목표달성을 위한 수단으로 전락됨","학습자의 관심과 흥미가 최우선으로 반영됨","평가계획을 수업 후에 수립함"],"a":0,"exp":"장점은 ①목표·내용·평가의 일체화 ②목표설정과 평가계획을 통합적으로 설계하여 교사의 책무성이 높아짐 ③국가교육과정 성취기준 반영으로 기준과 현장수업의 일치이다.","id":"gwajeong-m163"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 교육과정","q":"개념기반 학습의 개념과 개념기반 교육과정의 목적으로 옳은 것은?","opts":["단편적 사실을 넘어 핵심 개념 간의 관계를 파악하는 사고의 통합을 통해 다양한 상황에 전이 가능한 지식과 역량을 형성하도록 조직된 교육과정이며, 학습자가 탐구과정을 통해 학습한 지식을 다른 상황에 일반화할 수 있도록 하는 전이 가능한 지식과 역량을 갖추는 것이 목적","단편적 사실의 정확한 암기를 목적으로 하는 교육과정","교사와 학생이 현장에서 함께 만들어가는 교육과정","평가계획을 수업계획에 앞서 수립하는 교육과정"],"a":0,"exp":"개념기반 학습은 핵심 개념 간 관계 파악을 통해 전이 가능한 지식과 역량을 형성하도록 조직된 교육과정이며, 목적은 전이 가능한 지식과 역량을 갖추는 것이다.","id":"gwajeong-m164"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 교육과정","q":"개념기반 교육과정에서 '개념'의 특징으로 옳지 않은 것은?","opts":["구체적이며 특정 시대와 맥락에 한정됨","한두 단어(명사) 또는 짧은 구문으로 설명이 가능함","추상적이며, 시간을 초월하며, 보편적임","새로운 상황 및 맥락으로 전이가 가능함"],"a":0,"exp":"개념은 추상적이며 시간을 초월하고 보편적이므로 ①은 정반대이다.","id":"gwajeong-m165"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 설계","q":"개념기반 설계의 특징 중 '시너지적 사고(synergistic thinking)'에 대한 설명으로 옳은 것은?","opts":["저차원적(사실적/기능적) 사고 부분과 고차원적(개념적) 사고 부분이 상호작용할 때에 나타나는 지적 에너지를 의미하며, 학습자들이 통합적 사고를 통해 일반화된 개념적 지식을 도출하도록 함","개념적 이해를 통해 본질적이고 심층적인 이해에 도달하도록 함","탐구의 과정을 통해 다양한 상황에 전이 가능한 지식과 역량을 기르는 것","사실적 사례를 탐색하여 공통점과 패턴을 찾고 일반화를 형성하는 것"],"a":0,"exp":"시너지적 사고는 저차원적 사고와 고차원적 사고가 상호작용할 때 나타나는 지적 에너지이다. ②는 깊이 있는 이해 추구, ③은 전이 중시, ④는 귀납적 접근이다.","id":"gwajeong-m166"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 설계","q":"개념기반 설계의 특징 중 '귀납적 교수와 탐구 강조'에 해당하는 설명은?","opts":["학습자들이 귀납적 접근(사실적 사례를 탐색하여 공통점과 패턴을 찾고, 일반화를 형성하는 것)을 통해 스스로 개념적 이해에 도달하며 의미 있는 학습을 하도록 함","개념적 이해를 통해 고차원적 사고력 함양을 중시함","저차원적 사고와 고차원적 사고의 상호작용을 강조함","탐구과정을 통해 전이 가능한 지식과 역량을 기름"],"a":0,"exp":"귀납적 교수와 탐구 강조는 학습자가 귀납적 접근을 통해 스스로 개념적 이해에 도달하도록 하는 것이다.","id":"gwajeong-m167"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 교육과정","q":"개념기반 교육과정에서 '과정의 구조'의 개념으로 옳은 것은?","opts":["'무엇을 할 수 있는가'를 넘어 '그 수행이 어떠한 원리에 의해 효과적으로 발휘되는가'를 이해하는 틀로, 기능이 고차적 사고과정으로 조직 및 통합되는 기능-사고 기반의 절차·사고 체계임","'무엇을 아는가'를 넘어 '그 지식이 세상의 작동원리와 어떻게 연결되는가'를 이해하는 틀","사실이나 현상을 엮어주는 핵심적 개념과 원리","학습경험을 조직하는 원리"],"a":0,"exp":"과정의 구조는 기능(skill)과 사고(thinking)의 위계로 이루어진 기능-사고 기반 체계이다. ②는 지식의 구조(내용과 의미의 위계)이다.","id":"gwajeong-m168"},{"ch":"CH04 교육과정 개발 및 설계모형","t":"개념기반 평가","q":"개념기반 수업에서 평가설계의 기본원리로 옳지 않은 것은?","opts":["평가를 '옳고 그름'에 대한 판정으로 보아 정답률을 중시함","전이가 궁극적인 목적이 됨","실수를 통해 배우는 것을 중시함","지속적인 피드백을 제공해야 함"],"a":0,"exp":"개념기반 수업의 평가설계는 평가를 '옳고 그름'이 아니라 '과정'과 '증거'에 대한 것으로 보므로 ①은 정반대이다.","id":"gwajeong-m169"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 실행","q":"교육과정 실행의 개념과 중요성으로 옳은 것은?","opts":["교육과정 실행은 '가르치는 행위의 실제'이며, 좋은 의도를 가지고 계획한 교육과정이라 하더라도 그것이 교사들에 의해 실제 운영되는 교육과정으로 나타나지 않는다면 교육현장에 아무런 의미를 줄 수 없음","교육과정 실행은 문서 작성이며, 문서의 완결성이 무엇보다 중요함","교육과정 실행은 평가결과의 활용이며, 서열 산출이 중요함","교육과정 실행은 국가교육과정 고시이며, 법적 구속력이 중요함"],"a":0,"exp":"교육과정 실행은 가르치는 행위의 실제이며, 계획된 교육과정이 교사에 의해 실제 운영되지 않으면 교육현장에 의미를 줄 수 없다는 점에서 중요하다.","id":"gwajeong-m170"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 실행 관점","q":"스나이더 외(Snyder et al.)의 교육과정 실행 관점 중 '충실도 관점'에서 교사의 역할로 옳은 것은?","opts":["수용자 — 교사 연수 또는 교육과정 지침에 따라 개발자의 의도대로 교육과정을 충실하게 실행해야 할 수동적인 역할","조정자 — 학교가 처한 환경적 맥락, 시대적·정치적 상황, 개인적 특성에 따라 계획된 교육과정을 조정하는 역할","개발자 — 학생들의 주관적인 지각이나 느낌에 근거하여 교수·학습활동 장면에서 교육과정을 학생과 함께 구성하는 역할","평가자 — 학생의 성취를 판정하는 역할"],"a":0,"exp":"충실도 관점에서 교사는 수용자 역할이다. ②는 상호적응적 관점(조정자), ③은 생성적 관점(개발자)이다.","id":"gwajeong-m171"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 실행 관점","q":"'생성적 관점'에 대한 설명으로 옳은 것은?","opts":["교육과정 실행을 실천장면에 있는 당사자인 교사와 학생이 공동으로 교육과정을 창안해내는 과정으로 봄","학교에서 실제로 실행되고 있는 교육과정이 원래 계획된 것과 일치해야 한다고 봄","교육과정이 개발자와 실행자 간의 상호작용을 통해 조정 및 변화되는 과정에 중점을 둠","교육과정 실행을 평가결과에 따른 재조정 과정으로 봄"],"a":0,"exp":"생성적 관점은 교사와 학생이 공동으로 교육과정을 창안해내는 과정으로 본다. ②는 충실도 관점, ③은 상호적응적 관점이다.","id":"gwajeong-m172"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"CBAM","q":"홀 외(Hall et al.)의 교사의 관심에 기초한 채택모형(CBAM)의 시사점으로 옳지 않은 것은?","opts":["교육과정 개발 직후 즉시 완전한 실행이 이루어져야 하므로 시차를 두어서는 안 됨","교육과정 실행과 교사의 관계 명료화 — 새 교육과정에 대한 관심을 이끌어내기 위해서는 교사의 관심 정도를 정확하게 파악하고 구미에 당기는 정보를 제공해주어야 함","교사 연수의 필요성 제기 — 실행수준의 측면에서 교사의 실행수준에 맞는 맞춤형 연수를 제공해주어야 함","교육과정 개발-실행 간 시차 고려 — 새 교육과정의 성공적인 실행을 위해서는 교사의 실행수준이 올라가기까지의 시간을 기다려주어야 함"],"a":0,"exp":"CBAM은 교사의 실행수준이 올라가기까지의 시간을 기다려주어야 한다고 보므로 ①은 정반대이다.","id":"gwajeong-m173"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"던킨과 비들","q":"던킨과 비들의 교실 내 수업과정 연구모형의 네 가지 변인 중 '전조변인'에 해당하는 설명은?","opts":["교수자와 관련된 변인으로 교수자의 경험이나 능력, 특성 등","학습자의 경험 및 특성, 학교와 지역사회의 특성, 교실 특성 등","교실 내에서 이루어지는 교수자와 학습자의 행동을 모두 포함","교수·학습 결과로 얻어지는 성과"],"a":0,"exp":"전조변인은 교수자와 관련된 변인이다. ②는 상황변인(맥락변인), ③은 과정변인, ④는 결과변인이다.","id":"gwajeong-m174"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"던킨과 비들","q":"던킨과 비들 모형의 '결과변인'에 대한 설명으로 옳은 것은?","opts":["교수·학습 결과로 얻어지는 성과로 교과내용 학습 및 태도 등의 즉각적인 학생 성장과 성인기의 성격 및 직업적 능력 등과 같은 장기적 효과를 포함함","교수자의 경험이나 능력, 특성","학습자의 경험 및 특성, 교실 특성","교실 내 교수자와 학습자의 행동"],"a":0,"exp":"결과변인은 교수·학습 결과로 얻어지는 성과로 즉각적인 학생 성장과 장기적 효과를 모두 포함한다.","id":"gwajeong-m175"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성의 목적으로 제시되지 않은 것은?","opts":["국가교육과정의 획일적 적용을 강화함","교육과정이 학습자에게 보다 적합해짐","교육과정 구성과 개발에 대한 교사의 자율성이 높아짐","교실수업의 효과와 효율성이 높아짐"],"a":0,"exp":"교육과정 재구성의 목적은 ②③④이다.","id":"gwajeong-m176"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성을 위한 분석의 대상 중 '학교 여건'에 해당하는 것은?","opts":["지역사회의 특성과 학습자원, 학부모의 특성과 요구, 학교 시설 및 풍토를 분석함","교육과정 성취기준, 교육과정 해설서, 교과서, 교사용 지도서, 시·도 교육청 편성·운영지침서, 학교교육과정 등을 분석함","학생의 인지적·정의적 특성 및 관심을 분석함","교사의 전문성과 경험을 분석함"],"a":0,"exp":"재구성을 위한 분석의 대상은 ①교육과정 분석 ②학생의 특성과 수준 분석 ③학교 여건 분석이며, 학교 여건은 지역사회의 특성과 학습자원, 학부모의 특성과 요구, 학교 시설 및 풍토이다.","id":"gwajeong-m177"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성의 유형 중 '교과 내 재구성'을 수행하는 방안으로 옳은 것은?","opts":["교육과정이 제시한 핵심 성취기준을 중심으로 교과서의 순서 변경하기, 새로운 내용 추가하기, 내용 생략 및 압축하기, 내용 수준 변경하기 등","특정한 교과를 중심으로 다른 교과의 내용을 연계하거나 통합하는 방식","각 교과에 공통되는 주제를 중심으로 프로젝트 수업의 형태로 진행하는 방식","교과와 창의적 체험활동을 연계하여 수업을 진행하는 방식"],"a":0,"exp":"교과 내 재구성은 핵심 성취기준을 중심으로 교과서 순서 변경, 내용 추가, 생략 및 압축, 수준 변경 등의 방식이다. ②③은 교과 간 재구성, ④는 교과와 창의적 체험활동의 연계를 통한 재구성이다.","id":"gwajeong-m178"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"교육과정 재구성","q":"교육과정 재구성 시 내용을 재구성할 때 고려할 사항으로 옳은 것은?","opts":["재구성할 학습요소를 선정하고 지도계획을 수립하며, 교과 수준의 1차 재구성 이후 학생 중심의 2차 재구성이 이루어짐","평가계획을 먼저 수립한 후 내용을 선정함","국가교육과정의 순서를 그대로 유지함","교사의 흥미를 우선적으로 반영함"],"a":0,"exp":"내용 재구성 시 고려사항은 ①재구성할 학습요소 선정과 지도계획 수립 ②교과 수준의 1차 재구성 이후 학생 중심의 2차 재구성 ③내용 재구성 결과 점검 ④타 교과 학습내용과 통합 ⑤교수·학습방안 구안이다.","id":"gwajeong-m179"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"학교교육과정","q":"학교교육과정 개발·운영을 위해 교사가 해야 하는 일로 제시되지 않은 것은?","opts":["국가교육과정 기준을 그대로 적용하고 지역 특성은 배제해야 함","국가교육과정 기준 및 시·도 교육청 지침 분석","학교의 교육여건 파악 — 학생·교원 실태, 교육시설·설비·자료, 학부모 및 지역사회의 특성 등","전문성 신장을 위한 지속적인 노력 — 교사는 교육과정 실행자뿐만 아니라 개발자로서의 역할까지 수행해야 함"],"a":0,"exp":"제시된 일은 ②③④와 '학교교육과정 운영계획 및 세부 실천계획 수립'이다.","id":"gwajeong-m180"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"뱅크스(Banks)의 관점에서 다문화교육의 목적으로 제시되지 않은 것은?","opts":["주류 문화의 우수성을 학생들에게 인식시킴","모든 학생들이 긍정적 자아개념을 갖도록 함","다양한 인종집단으로부터 온 사람들과 협력할 수 있는 능력을 기름","다문화사회의 정치적, 경제적, 사회적 제도에 유능하게 참여할 수 있는 능력을 기름"],"a":0,"exp":"뱅크스의 다문화교육 목적은 ②③④와 '정의로운 태도로 다원주의 사회에서 상호작용·타협·의사소통할 수 있는 능력', '다문화사회에서 보다 윤리적으로 의사결정할 수 있는 능력'이다.","id":"gwajeong-m181"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"게이(Gay)의 관점에서 다문화교육의 '문화적 목적'에 해당하는 설명은?","opts":["자신이 속한 집단의 문화가 보편타당한 것이라는 관점에서 타 문화를 그들의 맥락에서 이해하는 것으로 변화해야 함","교육과정과 수업을 다양화함으로써 다문화집단 간 학업성취 격차를 해소하고자 함","사회적 차별을 인식하고, 이를 발생시키는 불평등 문제를 해결하기 위해 실천하는 사람을 양성해야 함","다양한 문화적 배경을 가진 학생들의 성공을 지원하는 포용적 수업환경을 조성함"],"a":0,"exp":"문화적 목적은 자기 집단 문화가 보편타당하다는 관점에서 타 문화를 그들의 맥락에서 이해하는 것으로 변화해야 한다는 것이다. ②는 학문적 목적, ③은 사회정의적 목적이다.","id":"gwajeong-m182"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"다문화교육","q":"다문화교육의 영역 중 '편견 감소'의 목적으로 옳은 것은?","opts":["교사들은 학생들을 다양한 문화에 대한 이해, 공감, 존중을 촉진하는 활동과 토론에 참여시키면서 타 문화에 대한 부정적인 태도와 오해를 줄이도록 해야 함","각자의 다양한 학습스타일이나 배경을 고려해서 배울 수 있음","다양한 문화적 배경을 가진 학생들의 성공을 지원하는 포용적인 수업환경을 조성함","교육과정과 수업을 다양화하여 학업성취 격차를 해소함"],"a":0,"exp":"편견 감소의 목적은 이해·공감·존중을 촉진하는 활동과 토론을 통해 타 문화에 대한 부정적 태도와 오해를 줄이는 것이다. ②③은 평등한 수업의 목적이다.","id":"gwajeong-m183"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"뱅크스 다문화교육과정","q":"뱅크스(Banks)의 다문화 교육과정 유형 중 '전환적(변혁적) 모형'에 해당하는 설명은?","opts":["교육과정의 목표, 구조, 관점을 근본적으로 변혁시켜서 학생들이 다양한 문화, 민족, 인종집단의 관점에서 개념, 이슈, 사건, 주제를 바라볼 수 있도록 함","기존 교육과정의 구조, 목적, 특성들을 있는 그대로 유지한 상태에서 이벤트성 학교교육활동으로 다문화 관련 개념, 주제, 활동, 관점 등을 다루는 모형","기존 교육과정의 구조 등이 큰 변화 없이 유지된 상태에서 다문화적 내용, 개념, 주제, 활동, 관점 등을 교육과정에 추가하는 모형","학생들이 다문화 관련 문제들을 해결하기 위해 행동할 것을 강조함"],"a":0,"exp":"전환적(변혁적) 모형은 교육과정의 목표·구조·관점을 근본적으로 변혁시키는 교육과정 변화 모형이다. ②는 기여모형, ③은 부가모형, ④는 사회행동모형이다.","id":"gwajeong-m184"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"뱅크스 다문화교육과정","q":"뱅크스(Banks)의 '사회행동모형'에 대한 설명으로 옳은 것은?","opts":["다문화 관련 내용을 반영할 수 있도록 학교교육과정을 근본적으로 개정하는 것(변혁모형)을 넘어서 학생들이 다문화 관련 문제들을 해결하기 위해 행동할 것을 강조함","이벤트성 학교교육활동으로 다문화 관련 개념을 다룸","기존 교육과정에 다문화적 내용을 추가함","네 가지 모형을 적절히 혼합하여 활용함"],"a":0,"exp":"사회행동모형은 변혁모형을 넘어 학생들이 다문화 관련 문제 해결을 위해 행동할 것을 강조한다. ④는 혼합모형이다.","id":"gwajeong-m185"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"문화감응교수","q":"문화감응교수(culturally responsive teaching)의 실행방안으로 옳은 것은?","opts":["교사들이 학생들 각각의 문화적 배경에 대해 예민하게 살펴본 후, 그에 알맞은 수업방법과 전략을 사용함","주류 문화 중심의 표준화된 수업방법을 일관되게 적용함","다문화 관련 내용을 이벤트성 활동으로 다룸","학생들이 사회 문제 해결을 위해 행동하도록 함"],"a":0,"exp":"문화감응교수의 실행방안은 교사들이 학생 각각의 문화적 배경을 예민하게 살펴본 후 알맞은 수업방법과 전략을 사용하는 것이다.","id":"gwajeong-m186"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"모두를 위한 교육과정","q":"'모두를 위한 교육과정'의 개념으로 옳은 것은?","opts":["포기하는 학생 없이 모든 학생이 자신의 가능성을 온전히 실현할 수 있도록 돕는 책임교육","모든 학생에게 동일한 내용을 동일한 방식으로 가르치는 교육","우수한 학생을 선발하여 집중 지원하는 교육","학생의 문화적 배경에 따라 분리하여 가르치는 교육"],"a":0,"exp":"'모두를 위한 교육과정'은 포기하는 학생 없이 모든 학생이 자신의 가능성을 온전히 실현할 수 있도록 돕는 책임교육이다.","id":"gwajeong-m187"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"모두를 위한 교육과정","q":"브래이(Bray)와 맥클라스키(McClaskey)의 관점에서 '개인화(personalization)'의 개념과 실행의 주체로 옳은 것은?","opts":["학생들의 다양한 학습 필요나 선호, 관심이 반영된 개인화된 학습환경에서 학생들이 학습목표, 내용, 방법, 속도 등을 달리할 수 있는 것 / 실행의 주체: 학습자","교사가 다양한 학생들의 개별 학습 필요에 맞추어 교수하는 것 / 실행의 주체: 교사","교사가 다양한 학생 그룹의 학습 선호에 맞추어 교수하는 것 / 실행의 주체: 교사","모든 학생이 공통 학습목표에 도달하도록 하는 것 / 실행의 주체: 학교"],"a":0,"exp":"개인화는 학생들이 학습목표·내용·방법·속도 등을 달리할 수 있는 것으로 실행의 주체는 학습자이다. ②는 개별화, ③은 차별화(맞춤형)이며 둘 다 실행의 주체는 교사이다.","id":"gwajeong-m188"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"모두를 위한 교육과정","q":"'개별화(individualization)'와 '차별화(differentiation)'의 차이로 옳은 것은?","opts":["개별화는 학습목표가 모든 학생에게 동일하되 학생들이 자신의 학습 필요에 따라 상이한 속도로 성장해나갈 수 있도록 하는 것이고, 차별화는 모든 학생이 공통내용을 배우고 공통 학습목표에 도달할 수 있어야 하되 학생들의 흥미·선호도·장점·약점 등에 따라 교수방법이나 접근을 다양하게 하여 맞춤형으로 수업이 제공되는 것","개별화는 학생이 주체이고, 차별화는 교사가 주체이다","개별화는 학습목표를 달리하고, 차별화는 학습목표를 동일하게 한다","개별화는 집단별 접근이고, 차별화는 개인별 접근이다"],"a":0,"exp":"개별화는 개별 학습 필요에 맞춘 상이한 속도의 성장을, 차별화는 학습 선호에 맞춘 교수방법·접근의 다양화를 의미하며 둘 다 실행의 주체는 교사이다.","id":"gwajeong-m189"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"UDL","q":"보편적 학습설계(UDL)의 목적으로 옳은 것은?","opts":["장애, 언어 등 학생들의 다양성을 적극 포용하여 모든 학습자의 성장을 위함","우수 학생의 선발과 집중 지원을 위함","교사의 업무 부담을 줄이기 위함","평가의 객관성을 확보하기 위함"],"a":0,"exp":"보편적 학습설계(UDL)의 목적은 장애, 언어 등 학생들의 다양성을 적극 포용하여 모든 학습자의 성장을 위한 것이다.","id":"gwajeong-m190"},{"ch":"CH05 교육과정의 실행과 최근 동향","t":"UDL","q":"보편적 학습설계(UDL)의 세 가지 방안 중 '다양한 표현수단'에 해당하는 설명은?","opts":["신체적 표현방식, 의사소통을 위한 매체 선택 등을 고려해 학습자의 요구와 선호하는 표현방법을 존중하고, 연습이나 수행의 기회를 제공해 유창성을 높임","같은 교육내용이라도 다양한 방식의 표상(언어, 수식, 기호 등)으로 제공함","학습자 특성과 학습동기를 파악하여 학습자와의 관련성을 높이고 참여방식의 선택권을 제공함","친구들과의 협력적 분위기나 자기학습 조절 및 평가와 성찰의 기회를 제공함"],"a":0,"exp":"다양한 표현수단은 신체적 표현방식·매체 선택 등을 고려해 표현방법을 존중하고 연습·수행 기회로 유창성을 높이는 것이다. ②는 다양한 내용 제시방법, ③④는 다양한 참여방식이다.","id":"gwajeong-m191"},{"ch":"CH06 우리나라 교육과정","t":"국가수준 교육과정","q":"국가수준 교육과정의 성격으로 옳지 않은 것은?","opts":["국가수준의 획일성만을 추구하여 지역·학교·개인 수준의 다양성은 배제하는 교육과정임","학습자의 자율성과 창의성을 신장하기 위한 학생중심의 교육과정임","학교교육의 체제를 교육과정 중심으로 구현하기 위한 교육과정임","학교교육의 질적 수준을 관리·개선하기 위한 교육과정임"],"a":0,"exp":"국가수준 교육과정은 '국가수준의 공통성과 지역·학교·개인 수준의 다양성을 동시에 추구하는 교육과정'이므로 ①은 정반대이다.","id":"gwajeong-m192"},{"ch":"CH06 우리나라 교육과정","t":"국가수준 교육과정","q":"국가수준 교육과정의 장점으로 옳지 않은 것은?","opts":["지역, 학교 등의 특수성을 고려한 교육과정 운영이 용이함","전국의  집중 편성하는 방식으로, 수업 효율성이 높음","학생이 개인 수업시간표를 편성하는 방식으로, 진로 맞춤형 교육이 가능함","지필평가를 실시하지 않는 방식으로, 학습 부담이 적음"],"a":0,"exp":"블록타임제는 단위수업을 2~3시간 연속으로 운영하는 방식이며(교과내용·수업방법에 따라 70~100분 등 탄력적 운영 가능), 장점은 수업 흐름의 연속성과 심층적 수업을 통한 교육의 질 제고이다.","id":"gwajeong-m204"},{"ch":"CH06 우리나라 교육과정","t":"고교학점제","q":"고교학점제의 '교육과정' 측면 특징으로 옳은 것은?","opts":["학생중심 교육과정 편성·운영 — 개개인의 진로를 고려하여 다양한 선택과목을 개설하고 학생은 자신이 희망하는 선택과목을 직접 수강신청하여 개인 수업시간표를 편성함","학생평가 내실화 — 수업과 연계한 과정중심평가를 강화하고 성취평가를 내실화함","학생의 진로·학업설계 및 과목 선택 지도 등을 위한 교사의 역할 변화가 필요함","선택과목 증가와 학생 이동 증가에 따라 복합적 기능의 홈베이스를 조성함"],"a":0,"exp":"①은 교육과정 측면, ②는 평가 측면, ③은 교사역할 측면, ④는 학교공간 측면의 특징이다.","id":"gwajeong-m205"},{"ch":"CH06 우리나라 교육과정","t":"고교학점제","q":"고교학점제의 '평가' 측면 특징으로 옳은 것은?","opts":["수업과 연계한 과정중심평가를 강화하고 성취평가를 내실화하며 최소 학업성취수준을 보장함","일제식 지필평가를 강화하여 변별력을 확보함","상대평가를 통해 학생 간 서열을 산출함","평가를 실시하지 않고 이수 여부만 기록함"],"a":0,"exp":"고교학점제의 평가 측면 특징은 학생평가 내실화로, 과정중심평가 강화·성취평가 내실화·최소 학업성취수준 보장이다.","id":"gwajeong-m206"},{"ch":"CH06 우리나라 교육과정","t":"고교학점제","q":"고교학점제의 '학교공간' 측면 특징으로 옳은 것은?","opts":["선택과목이 증가하고 학생 이동이 증가함에 따라 휴식, 자율, 모둠학습 등의 복합적 기능의 홈베이스 조성","교과교실을 폐지하고 학급교실 중심으로 운영","교실 수를 줄여 공간 효율성을 높임","실험실과 강당을 중심으로 공간을 재편"],"a":0,"exp":"고교학점제의 학교공간 측면 특징은 학생 이동 증가에 따른 복합적 기능의 홈베이스 조성이다.","id":"gwajeong-m207"}],"essay":[{"ch":"CH01 교육과정의 개념과 유형","t":"교육과정의 수준","q":"교육과정의 진행과정에 따른 교육과정의 수준 3가지와 수준별 개념, 특징 각 1가지를 제시하시오.","ans":"계획된 교육과정: 공식적인 문서로서의 교육과정, 교육과정을 실행하기 위한 지침의 역할\n·특징 ① 진행될 교육활동에서 기대하는 바를 담고 있으며 교육목표와 내용, 교수-학습방법, 평가 등에 관한 사항을 포함함 ② 국가, 지역, 학교 수준에서 계획된 문서, 개별 교사가 자신의 수업을 위해 계획한 문서 등을 포함함\n실행된 교육과정: 교사들이 학교에서 실제로 전개한 교육과정으로, 교사의 실천적인 수업행위를 지칭함\n·특징 ① 계획된 문서와 실행된 교육과정은 달라질 수 있음 ⇒ 교사들이 자신의 가치관이나 신념에 기반하여 계획된 문서를 읽고 해석하며 실천하고, 자신들이 처해 있는 교실 맥락이나 학생들의 다양한 배경과 능력을 고려하며 실천하기 때문 ② 실행된 교육과정은 학생들에게 직접적인 영향을 미침\n경험된 교육과정: 교육의 결과로 학생들에게 구현된 교육과정\n·특징 ① 교수-학습의 과정을 통해 학생들이 결과적으로 획득한 경험이나 성취, 태도 등을 포함함 ② 계획되고 전개된 교육과정은 본래 의도한 바대로 학생들에게 경험되지 않는 경우가 많음 ③ 계획되고 실행된 교육과정이 학생들에게 어떻게 받아들여지는가에 초점 ⇒ 의도한 교육과정의 실질적인 성과를 판단하도록 해줌","kw":["계획된 교육과정","실행된 교육과정","경험된 교육과정","지침","실천적인 수업행위","직접적인 영향","실질적인 성과"],"id":"gwajeong-e0"},{"ch":"CH01 교육과정의 개념과 유형","t":"공식적 교육과정","q":"공식적 교육과정의 개념과 교육과정의 결정 주체에 따른 공식적 교육과정의 종류 3가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"개념: 무엇을, 어떻게, 왜 가르칠 것인가에 대한 계획을 담고 있는 가시적·표면적인 교육과정. 사전에 의도되고 계획된 문서로서의 교육과정을 의미하며, '계획된 교육과정'에 해당함\n종류\n① 국가교육과정: 교육부장관의 이름으로 고시되는 초·중등학교 교육과정 문서 ⇒ 총론과 각론으로 구분됨\n② 지역교육과정: 국가교육과정을 기초로 하여 17개 시·도 교육청이 관내 학교를 위해 마련한 교육과정 편성·운영지침을 의미함\n③ 학교교육과정: 국가교육과정과 지역교육과정을 근거로 하여 편성된 학교운영계획을 의미함. 학교 내에서의 수업, 평가, 각종 행사가 이에 근거하여 실행됨","kw":["가시적","표면적","국가교육과정","총론","각론","지역교육과정","편성·운영지침","학교교육과정","학교운영계획"],"id":"gwajeong-e1"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정","q":"잠재적 교육과정의 개념과 특징 3가지를 제시하시오.","ans":"개념: 학교에서 계획하거나 의도하지 않았음에도 불구하고 학생이 학교생활을 통해 경험한 교육과정\n특징\n① 학급문화, 수업 분위기 등 학생의 지식, 태도, 행동에 영향을 미치는 것\n② 학생이 은연중에 학습하게 되는 것\n③ 공개적으로 드러나지 않은 상태에서 일어나는 학습이라는 점에서 비공식적 교육과정","kw":["계획하거나 의도하지 않았음","학급문화","수업 분위기","은연중에","비공식적 교육과정"],"id":"gwajeong-e2"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정","q":"잠재적 교육과정의 관점 2가지를 각 관점에 따른 잠재적 교육과정의 의미와 함께 제시하시오.","ans":"의도성이 없다는 관점: 계획되거나 의도되지 않았다고 보는 관점 ⇒ 잠재적 교육과정을 공식적 교육과정의 부산물로 바라봄. 직접적으로 의도되지 않았음에도 불구하고 공식적 교육과정을 가르칠 때 필연적으로 따르는 것\n의도성이 있다는 관점: 교육과정을 결정하는 권력자나 집단에 의해 계획되었다고 보는 관점 ⇒ 잠재적 교육과정을 '숨겨진 교육과정'이라고 함. 공식적 교육과정에 특정 의도나 가치가 숨겨져 있다고 봄","kw":["의도성이 없다","부산물","필연적","의도성이 있다","권력자","숨겨진 교육과정"],"id":"gwajeong-e3"},{"ch":"CH01 교육과정의 개념과 유형","t":"잭슨","q":"잭슨(Jackson)이 주장한 잠재적 교육과정의 원천 3가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 군집성(crowd): 학교라는 제한된 물리적 공간 속에서 다양한 계층의 학생들이 함께 생활하면서 상호간의 어울림을 통하여 집단생활에서 규칙을 준수하는 태도를 배우는 것\n② 상찬/평가(praise): 학생들이 상호간 또는 교사에 의하여 얻게 되는 평가와 그에 따른 보상 및 처벌 행위를 경험하며, 그 안에서 살아가는 방법을 배우는 것\n③ 권력(power): 학교조직을 통하여 권력관계를 배우고 교사와 학교의 권위에 적응·순종하는 방법을 배우는 것","kw":["군집성","crowd","상찬","평가","praise","권력","power","규칙 준수","권위","순종"],"id":"gwajeong-e4"},{"ch":"CH01 교육과정의 개념과 유형","t":"잠재적 교육과정 극복","q":"교육목표, 교육내용, 교육평가, 교사의 역할 측면에서 잠재적 교육과정을 극복하기 위한 구체적인 방안 각각 1가지를 제시하시오.","ans":"교육목표: 설계된 교육목표가 의도하지 않은 결과를 낳을 수도 있다는 점을 인지하고 다양한 관점에서 교육목표를 검토하여 수립할 필요가 있음. 인지적 교육목표뿐만 아니라 정의적이고 인성적인 측면을 고려한 교육목표를 설정함\n교육내용: 학습경험을 선정하고 조직할 때 학습내용이 학습자에게 미칠 영향을 다각도로 고려할 필요가 있음. 특히, 문화다원론적 관점에서 신중하게 교육내용을 선정하고 조직하는 태도가 요구됨\n교육평가: 의도한 목표를 얼마나 달성했는지에 중점을 두는 목표중심평가에서 벗어나, 의도하지 않은 결과까지 중시하는 탈목표(goal-free) 평가 또한 중시되어야 함. 이를 통하여 교육의 결과를 종합적으로 평가하려는 태도가 요구됨\n교사역할: 교사는 자신의 의식적·무의식적 태도와 반응이 학생에게 미칠 수 있는 잠재적 영향력을 고려하여 교육과정을 구성 및 운영하는 모든 장면에서 모범을 보여야 함","kw":["정의적","인성적","문화다원론적","탈목표","goal-free","잠재적 영향력","모범"],"id":"gwajeong-e5"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 개념과 조건 3가지를 제시하시오.","ans":"개념: 가르칠 만한 가치가 있지만 배제된 교육과정으로 실제로 존재하지 않는(null, 0이라는 뜻) 교육과정. 배울 만한 가치가 있지만 공식적 교육과정에는 포함되지 않은 교육내용. 교육과정에는 포함되어 있지만 학교나 교사가 의도적 또는 무의식적으로 가르치지 않은 학습내용\n조건\n① 학교가 설정한 교육목표에 부합\n② 학습자에게 가르칠 만한 가치가 있는 내용\n③ 학교가 가르치지 않아 학습자가 배울 기회를 갖지 못함","kw":["null","배제","가르칠 만한 가치","교육목표에 부합","배울 기회"],"id":"gwajeong-e6"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"영교육과정의 발생원인 3가지와 특징 2가지, 영교육과정이 교육내용 선정에 주는 시사점 1가지를 제시하시오.","ans":"발생원인\n① 정치적·사회적 요인에 의해 발생\n② 교육과정 개발자가 지니는 편견이나 경직된 신념에 의해 발생\n③ 교육과정 개발자나 교사가 타성에 젖거나 의욕이 부족하여 발생\n특징\n① 영교육과정은 선택의 결과로 포함과 배제의 산물이라는 점에서 공식적 교육과정의 필연적 산물\n② 공식적 교육과정에 특정 교과가 없거나 교육내용에 특정 주제 등이 배제되어 영교육과정이 발생하면 학생들이 학습할 수 없음\n시사점: 공식적으로 가르치지 않거나 소홀히 되는 영역은 시대와 사회가 변화함에 따라 더 중요해지기도 함. 특정 정치(이념), 경제, 문화(종교) 세력들에 의해 금기시된 영교육과정을 새롭게 조명함으로써 공식적 교육과정이 풍성해질 수 있음","kw":["정치적","사회적 요인","편견","경직된 신념","타성","포함과 배제","필연적 산물","금기시","풍성"],"id":"gwajeong-e7"},{"ch":"CH01 교육과정의 개념과 유형","t":"영교육과정","q":"소극적 의미에서의 영교육과정과 적극적 의미에서의 영교육과정을 설명하시오.","ans":"소극적 의미: 학생들이 공식적 교육과정을 배우는 동안 놓치게 되는 '기회학습' 내용\n적극적 의미: 의도적으로 특정 지식, 가치, 행동양식을 배제시켜 아예 접할 수 없도록 지워버린 것으로 잠재적 교육과정보다 고의성, 의도성이 더 짙은 교육과정","kw":["기회학습","의도적으로","배제","고의성","의도성"],"id":"gwajeong-e8"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 개념과 철학적 기초 2가지의 명칭과 개념을 제시하시오.","ans":"개념: 지식을 주된 내용으로 하는 교육과정. 전통적 문화유산과 학문적 성취 중 가장 본질적·항존적인 것을 선정하여 다음 세대에게 전달하는 교육과정\n철학적 기초\n① 본질주의: 문화유산의 본질적 가치를 유지하고 전달하는 것이 교육의 목표라고 보며, 인류가 오랫동안 쌓아온 경험의 축적인 교과지식을 강조함\n② 항존주의: 시간과 공간을 초월하여 변하지 않는 진리를 모든 학생이 똑같이 배워야 한다고 주장함. 교육과정은 보편적이고 변하지 않는 인간의 삶의 주제를 다뤄야 한다고 봄","kw":["본질적","항존적","본질주의","문화유산","항존주의","변하지 않는 진리","보편적"],"id":"gwajeong-e9"},{"ch":"CH02 교육과정의 관점","t":"능력심리학","q":"교과중심 교육과정의 심리학적 기초인 능력심리학의 주요 주장과 인간의 정신을 발달시키는 방법 1가지를 제시하시오.","ans":"능력심리학: 인간 정신기능의 본체인 마음에 있는 몇 가지의 능력이 사물의 인식, 기억, 상상, 추리하는 기능을 한다고 봄\n인간의 정신을 발달시키는 방법: 인간의 정신은 단련에 의해 발달시킬 수 있음","kw":["정신기능","마음","인식","기억","상상","추리","단련"],"id":"gwajeong-e10"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 교육목표, 교육내용, 교육방법, 교육평가 측면의 특징 각 2가지를 제시하시오.","ans":"교육목표: 인류의 중요한 문화유산을 담은 교과를 다음 세대에게 전달하는 것. 교과공부를 통해 학습자의 합리적 이성을 개발함\n교육내용: 인류의 문화유산 중에서 중요하고 핵심적이라고 여겨지는 사실, 개념, 법칙, 가치 등의 내용으로 교육내용 선정. 수학, 과학, 언어, 역사, 음악 등 전통적으로 가르쳐온 교과내용을 중시함. 교과의 내용은 학년과 영역에 따라 위계적·체계적\n교육방법: 교사중심의 일방적·직접적 교수법인 설명식·강의식 수업으로 진행. 교과지식의 정확한 이해를 중시하므로 반복 암기와 문제풀이 훈련 강조\n교육평가: 지식 및 가치를 이해하고 내면화하였는지를 평가의 주요 과제로 삼기 때문에 지필시험을 주로 사용","kw":["문화유산","합리적 이성","위계적","체계적","설명식","강의식","반복 암기","지필시험"],"id":"gwajeong-e11"},{"ch":"CH02 교육과정의 관점","t":"교과중심 교육과정","q":"교과중심 교육과정의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 체계적인 지식 및 문화유산의 효율적인 전달이 용이함\n② 사전계획이 뚜렷하여 교사와 학생에게 안정감 제공\n③ 교과 조직이 단순하고 명료함\n④ 객관적인 평가기준에 의해서 학습결과가 쉽게 평가됨\n단점\n① 학습자의 요구와 흥미를 무시하는 경향성을 지님\n② 실제 생활과 유리되어 실용적이지 못하거나 단편적인 지식을 학습함\n③ 학습자의 학습태도를 수동적으로 만듦\n④ 창의성과 문제해결력 및 비판적 사고력 등의 고등능력 함양이 어려움","kw":["효율적인 전달","안정감","단순하고 명료","객관적인 평가기준","요구와 흥미","실제 생활과 유리","수동적","고등능력"],"id":"gwajeong-e12"},{"ch":"CH02 교육과정의 관점","t":"형식도야론","q":"형식도야론의 주요 주장과 이에 대한 비판 1가지를 제시하시오.","ans":"형식도야론의 주장\n① 운동을 통해 신체의 근육이 단련되는 것처럼 마음의 근육을 단련하여 정신능력을 도야시킬 수 있다고 봄\n② 교과의 반복적인 암기나 연습을 통해 가장 효과적으로 정신능력을 도야시킬 수 있으며, 이렇게 길러진 정신능력은 해당 능력을 요구하는 다른 사태에 일반적으로 전이가 가능함\n형식도야론에 대한 비판\n① 교육내용의 적합성에 대한 비판: 전통적인 교육내용은 학생에게 미래의 삶을 준비시키기에 적절하지 않음\n② 능력심리학에 대한 비판: 전통적인 교과(역사, 라틴어)에 대한 학습이 다른 교과(타자, 속기)에 비해 일반적인 정신능력을 계발하기에 적합하지 않음","kw":["마음의 근육","도야","반복적인 암기","일반적으로 전이","교육내용의 적합성","능력심리학"],"id":"gwajeong-e13"},{"ch":"CH02 교육과정의 관점","t":"허스트","q":"허스트(Hirst)의 '지식의 형식론'이 주장하는 교육의 목적, '지식의 형식'의 개념과 지식의 형식론의 정당화 논리, 지식의 형식론의 한계 2가지를 제시하시오.","ans":"교육의 목적: '합리적 마음의 계발'이라고 하는 교육목적의 달성을 위해 개인을 공적인 삶의 형식 또는 사고의 형식에 입문시켜야 함\n지식의 형식: 인간 경험 전체를 이해하는 방식 ⇒ 다양한 지식형식으로 구조화되며 각각의 형식은 서로 다른 유형의 인간 경험을 반영함\n선험적 정당화: 개인이 그것을 수용하는가(받아들이는가)와 무관하게 어떤 명제가 논리적으로 성립함을 정당화하는 것\n한계\n① 지식의 형식론은 주지교과에 특권적 지위를 부여했다고 볼 수 있는데, 주지교과만이 내재적 가치를 지닌다고 할 수 없음\n② 합리성의 계발은 교육목적의 하나로 간주될 수 있으나 전부가 될 수는 없음","kw":["합리적 마음의 계발","공적인 삶의 형식","사고의 형식","인간 경험 전체","선험적 정당화","주지교과","내재적 가치"],"id":"gwajeong-e14"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 개념과 교육목표, 교육내용, 교육방법, 교육평가 측면의 특징 각각 2가지를 제시하시오.","ans":"개념: 아동의 흥미와 관심을 바탕으로 경험의 계속적인 성장을 도모할 수 있는 환경을 제공하는 교육과정\n교육목표: 아동의 요구와 흥미를 바탕으로 한 전인교육을 지향함. 실생활 문제해결능력과 사회적응능력을 함양하고 생활인을 육성하는 것이 목표임\n교육내용: 경험을 중심요소로 삼고, 이와 관련된 여러 교과지식과 활동을 통합적으로 조직함. 아동이 사물에 대한 직접적 경험으로부터 점차 논리적으로 조직된 체계적인 지식을 획득하도록 내용을 조직함\n교육방법: 학습자의 자발적인 활동을 강조하여 경험을 통한 배움(learning by doing)의 방법을 활용함. 교사가 학습자와 환경 간의 상호작용을 촉진할 수 있는 활동중심·의사소통중심의 수업을 진행함\n교육평가: 실제 학생의 과제처리능력을 확인하는 평가방법을 사용함. 결과뿐 아니라 과정에 중심을 두는 평가. 종합적이고 다면적인 평가(전인적인 평가)","kw":["흥미와 관심","계속적인 성장","전인교육","생활인","learning by doing","활동중심","과제처리능력","전인적인 평가"],"id":"gwajeong-e15"},{"ch":"CH02 교육과정의 관점","t":"경험중심 교육과정","q":"경험중심 교육과정의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 학습자의 흥미와 필요를 중시하므로 학습자의 자발성이 높음\n② 실제적인 생활문제 해결력이 향상됨\n③ 민주시민으로서의 자질을 함양할 수 있음\n④ 학교와 지역사회의 유대가 강화\n단점\n① 기초학력의 저하를 초래할 수 있음 - 위계성이 높은 교과를 체계적으로 학습하기 어려움\n② 교육의 효율성과 경제성이 낮을 수 있음\n③ 경험이 적은 교사가 운영하기 어려울 수 있음\n④ 교육과정 조직의 논리성과 체계성이 부족할 수 있음","kw":["자발성","생활문제 해결력","민주시민","지역사회","기초학력","위계성","효율성","논리성","체계성"],"id":"gwajeong-e16"},{"ch":"CH02 교육과정의 관점","t":"킬패트릭","q":"킬패트릭(Kilpatrick)이 제안한 교육방법으로 대표적인 아동중심 교육방법의 명칭과 이 교육방법의 특징 2가지를 제시하시오.","ans":"명칭: 프로젝트 학습법\n특징\n① 성인이 문제해결을 위해 사용하는 사고기능을 아동의 발달수준에 부합하도록 변형함 ⇒ 전통적 교육과정을 대체하면서도 아동의 맥락에 충실함\n② 프로젝트 개념: 사회적 장면에서 온 힘을 쏟을 만한 목적을 가지고 행하는 일련의 활동들을 의미함 ⇒ 아동은 자신의 관심과 필요에서 출발하여 스스로 목적을 설정하고 이를 성취해 나감. 프로젝트 학습과정: 목적설정 ⇒ 계획 ⇒ 실험 ⇒ 판단\n③ 전통적 교육과정에서는 교과를 최소한의 핵심요소와 당위적으로 배워야 하는 내용으로서 규정한 반면, 프로젝트 학습법에서는 교과를 경험의 풍부한 재구성과 사고기능 향상이라는 목적을 달성하기 위한 수단이자 도구로 간주함","kw":["프로젝트 학습법","사고기능","발달수준","목적설정","계획","실험","판단","수단이자 도구"],"id":"gwajeong-e17"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 관점에서 '경험의 원리' 2가지의 명칭과 각각의 개념을 제시하시오.","ans":"① 상호작용의 원리: 환경 속에서 문제 사태를 지각하고, 사태와 상호작용하면서 자기 자신과 환경 모두를 변화시키는 것\n② 계속성의 원리: 습득된 경험이 차후에 다른 문제 사태를 접할 때 새로운 경험이 획득될 수 있는 토대가 되며 경험이 확장되는 것","kw":["상호작용의 원리","계속성의 원리","문제 사태","토대","확장"],"id":"gwajeong-e18"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 관점에서 교육의 목적, 바람직한 교육과 바람직하지 않은 교육의 특징 각각 2가지를 제시하시오.","ans":"교육의 목적: '교육적인 경험'을 제공하는 것으로 이는 '상호작용의 원리'와 '계속성의 원리'에 충실한 경험\n바람직한 교육: 학습자와 환경 사이의 상호작용이 활발히 일어날 수 있는 조건을 조성해주는 교육이자 사고작용이 개입하여 하나의 경험이 완결하도록 하며 이를 통해 새로운 경험을 생성해 나갈 수 있도록 돕는 교육\n바람직하지 않은 교육\n∙주위 사물에 대해 관심이나 흥미를 불러일으키지 못하게 하는 경험\n∙판에 박히고 기계적인 습관에 고착시키는 경험\n∙직접적인 즐거움을 주기는 하지만 차분하지 못하고 덤벙대는 태도를 기를 수도 있는 경험\n∙다른 경험과 아무런 관련이 없는 고립된 경험","kw":["교육적인 경험","상호작용","계속성","조건을 조성","사고작용","기계적인 습관","고립된 경험"],"id":"gwajeong-e19"},{"ch":"CH02 교육과정의 관점","t":"듀이","q":"듀이(Dewey)의 주장에 따를 때 교육자의 교과와 학습자의 교과의 특징 각각 2가지를 제시하시오.","ans":"교육자의 교과\n∙교육자에게 이해되는 상태로서의 교과 ∙형식적인 사고의 반영 ∙교과내용의 논리적 조직 ∙사고의 결과 중시 ∙정당화의 맥락 존중 ∙결과를 설명하는 데 유용\n학습자의 교과\n∙학습자의 경험 안에서 발달되어 가는 교과 ∙실제적인 사고의 반영 ∙교과내용의 심리적 조직 ∙사고의 과정 중시 ∙발견의 맥락 존중 ∙결론에 도달하는 데 유용","kw":["형식적인 사고","논리적 조직","사고의 결과","정당화의 맥락","실제적인 사고","심리적 조직","사고의 과정","발견의 맥락"],"id":"gwajeong-e20"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 개념과 학문중심 교육과정의 목표 2가지를 제시하시오.","ans":"개념: 각 학문에 내재되어 있는 '지식의 구조'와 지식의 탐구과정을 익히도록 하는 교육과정\n목표\n① 학문을 공부하는 학자와 같은 탐구력을 배양하는 것을 목표로 함\n② 학습자의 지적 수월성을 도모함","kw":["지식의 구조","탐구과정","탐구력","지적 수월성"],"id":"gwajeong-e21"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 교육내용, 조직원리, 교육방법 각각의 명칭을 개념과 함께 제시하시오.","ans":"교육내용 - 지식의 구조: 사실이나 현상을 엮어주는 핵심적 개념과 원리. 사실이나 정보를 서로 관련짓고 체계화하는 각 학문의 주요 개념이나 원리들의 체계\n조직원리 - 나선형 교육과정: 각 학문의 구조에 해당하는 핵심적인 아이디어를 반복하여 가르치되 학년이나 학교급이 올라감에 따라 그 폭과 깊이를 점점 넓고 깊이 있게 조직하는 방식\n교육방법 - 발견학습: 최소의 필수적인 사실을 먼저 제시하고 학습자로 하여금 그 사실로부터 가장 풍부한 시사점을 이끌어내도록 하는 수업방식","kw":["지식의 구조","핵심적 개념","원리","나선형 교육과정","반복","폭과 깊이","발견학습","시사점"],"id":"gwajeong-e22"},{"ch":"CH02 교육과정의 관점","t":"지식의 구조","q":"'지식의 구조'의 특징 3가지를 제시하시오.","ans":"① 표현방식의 다양성: 어떠한 영역의 지식도 작동적·영상적·상징적 표현방식을 통해 나타낼 수 있음\n② 경제성: 지식의 구조는 개념, 원리, 법칙을 통해 학습하기 때문에 기억할 정보의 양이 적고 경제성이 큼\n③ 생성력: 지식의 구조를 획득하면 정보의 인출이 용이하고, 그 지식을 활용하는 데에도 효과적임\n④ 기억의 보존: 내용이 단편적으로 서로 떨어져 존재하는 것이 아니라 구조를 중심으로 조직되면 기억을 용이하게 할 수 있음\n⑤ 이해의 용이성: 기본 개념을 중심으로 내용이 선정되고 조직되면 개념에 대한 이해가 쉬워짐\n⑥ 학습의 일반적 전이: 해당 학문의 기본 개념을 중심으로 익힐 때 새로운 문제에 적용할 수 있는 전이 가능성이 최대화됨\n⑦ 고등지식과 초등지식 간의 간극 축소: 학문의 성격을 충실히 반영하는 사고방식을 바탕으로 학문을 탐구함으로써, 단편적인 사실의 이해를 넘어 핵심 원리를 파악하고 초등수준에서 고등수준으로의 학습으로 나아갈 수 있음","kw":["표현방식의 다양성","작동적","영상적","상징적","경제성","생성력","기억의 보존","이해의 용이성","일반적 전이","간극 축소"],"id":"gwajeong-e23"},{"ch":"CH02 교육과정의 관점","t":"브루너","q":"브루너(Bruner)의 관점에서 중간언어(middle language)와 교과언어(subject language) 각각의 개념을 제시하시오.","ans":"중간언어 ⇒ 비판 및 지양의 대상\n① 지식을 탐구하는 과정과 분리되어 가르쳐지는 지식탐구의 결과물\n② 학자들의 탐구결과(개념, 원리, 법칙)를 학문의 탐구과정과 분리된 채로 전달하는 언어\n③ 학생에게 단순한 사실만 암기하도록 하게 하며, 결과적으로 지식이 학생의 내면에 들어가지 못하고 바깥에 머물게 됨\n교과언어 ⇒ 지향의 대상\n① 학생이 학자들의 탐구활동과 동일한 일을 하도록 가르치는 것\n② 학생들에게 지식의 구조를 스스로 발견하도록 요구함","kw":["중간언어","탐구과정과 분리","결과물","암기","교과언어","탐구활동","스스로 발견"],"id":"gwajeong-e24"},{"ch":"CH02 교육과정의 관점","t":"학문중심 교육과정","q":"학문중심 교육과정의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 교육내용을 체계적으로 선정·조직하므로 지식전달의 경제성·효율성이 높음\n② 기본원리, 개념법칙을 학습하기 때문에 학습의 전이가 활발하게 일어남\n③ 학문의 기본적인 내용과 구조를 학습하기 때문에 적용력, 분석력, 종합력 등 고등정신능력의 함양에 용이함\n단점\n① 학습자의 정의적인 발달을 소홀히 여길 우려가 있음\n② 학업역량이 낮은 학생에게는 적용하기 어려울 수 있기 때문에 소수의 우수한 학생에게만 유리할 수 있음\n③ 각 학문별로 고유한 지식의 구조가 존재하는 것으로 전제되기 때문에 교과 간의 단절을 심화시킬 수 있고, 교과통합을 통한 교육과정 구성이 어려워짐\n④ 지식의 구조를 지나치게 강조하게 되어 교육이 실생활이나 사회문제 해결과 유리될 수 있음\n⑤ 교사가 지식의 구조를 충분히 이해하거나 도출하기 어려울 수 있음","kw":["경제성","효율성","전이","고등정신능력","정의적인 발달","소수의 우수한 학생","교과 간의 단절","실생활"],"id":"gwajeong-e25"},{"ch":"CH02 교육과정의 관점","t":"인간중심 교육과정","q":"인간중심 교육과정의 개념과 인간중심 교육과정에서 중시하는 교육과정 측면에서의 특징 2가지를 제시하시오.","ans":"개념: 교육과 학교환경의 인간화를 중시하며 학생의 잠재적인 능력 계발과 자아실현을 지향하는 교육과정\n특징\n① 교육의 인간화: 교과를 가르치는 것이 아닌 인간을 가르치는 것을 교육으로 본다는 점에서 전인교육을 강조함\n② 잠재적 교육과정 강조: 공식적 교육과정뿐 아니라 잠재적 교육과정도 중시함\n③ 통합교육과정 중시: 교과중심·경험중심·학문중심 교육과정을 모두 포괄하는 통합교육과정을 중시함\n④ 학교환경의 인간화: 학교 구성원들이 인간적인 경험을 할 수 있도록 학교환경이 인간중심적으로 조성되는 것을 강조함\n⑤ 인간주의적 교사: 교사와 학습자 간의 존중, 수용, 공감적 이해 중시","kw":["인간화","잠재적인 능력 계발","자아실현","전인교육","잠재적 교육과정","통합교육과정","인간주의적 교사","공감적 이해"],"id":"gwajeong-e26"},{"ch":"CH02 교육과정의 관점","t":"인간중심 교육과정","q":"인간중심 교육과정의 구현을 위해 사용할 수 있는 교육방법 3가지와 교사의 역할을 설명하시오.","ans":"교육방법\n① 자기주도적 학습, 협동학습, 비지시적 수업의 방법 활용\n② 교사와 학생이 서로 존중하고 인정하는 관계를 기반으로 하는 교육방법 사용\n③ 지식정보를 습득하는 것보다 생각하고 느끼는 것에 더욱 중점을 둠\n교사의 역할\n① 학생에 대한 존중과 수용, 공감적 이해를 갖춘 인간주의적 교사상\n② 교육이 인간적인 관계에 기반하여 이루어지므로 교사의 인간적인 성향 또한 중요하게 요구됨","kw":["자기주도적 학습","협동학습","비지시적 수업","존중","인정","생각하고 느끼는 것","인간주의적 교사상"],"id":"gwajeong-e27"},{"ch":"CH02 교육과정의 관점","t":"인간중심 교육과정","q":"인간중심 교육과정의 장점과 단점 각각 3가지를 제시하시오.","ans":"장점\n① 교육의 인간화를 통해 학습자의 자아실현 및 전인적 인간 형성을 가능하게 함\n② 전인교육을 통해 학습자가 긍정적 자아개념을 형성하는 데 기여함\n③ 학습자의 개별적인 자기성장을 도움\n④ 개방적이고 자율적인 교수-학습과정을 통해 학습자가 학습한 내용을 내면화할 수 있도록 도움\n단점\n① 교육과정을 구현하는 데 있어서 구체성이 부족하기 때문에 현실적인 실현이 어려움\n② 구체적이고 명시적인 모형 및 운영방안이 제공되지 않기 때문에 교육과정의 실제적인 효과를 측정하기가 어려움\n③ 개인의 성장에 지나치게 많은 초점을 두는 경향성 때문에 상대적으로 교육의 사회와의 관계와 영향을 경시할 수 있음\n④ 적절한 교육환경이 제공되지 않을 경우 교육성과의 보장이 어려움","kw":["자아실현","전인적 인간","긍정적 자아개념","자기성장","내면화","구체성이 부족","효과를 측정","사회와의 관계","교육환경"],"id":"gwajeong-e28"},{"ch":"CH02 교육과정의 관점","t":"역량중심 교육과정","q":"역량중심 교육과정의 개념과 특징 3가지를 제시하시오.","ans":"개념\n① 사회적 삶에서 필요한 역량을 강화시키는 방향으로 교육내용을 제공하려는 교육과정\n② 미래사회를 살아가기 위하여 필요한 지식, 기능, 태도와 가치를 제공하려는 교육과정\n특징\n① 역량을 우선적으로 고려하여 역량 발달이 촉진되도록 지식과 내용을 조직함\n② 교사의 자율성을 중시하여 교사가 자신의 교수맥락에서 역량을 발달시킬 수 있는 방법을 고려하여 적절하게 지식과 내용을 조직함\n③ 수행능력(방법적 지식)을 강조하기 때문에 '무엇을 아는지(명제적 지식)'에 초점을 두기보다는 특정 맥락의 수행과 관련하여 '무엇을 할 수 있는지'를 강조함\n④ 단순한 지식전달보다 지식을 어떻게 적절하게 활용할 수 있는지에 초점을 두며 그 능력을 강조함","kw":["역량","지식","기능","태도와 가치","교사의 자율성","수행능력","방법적 지식","명제적 지식"],"id":"gwajeong-e29"},{"ch":"CH02 교육과정의 관점","t":"역량중심 교육과정","q":"역량중심 교육과정에서 교사의 역할 2가지와 장점, 단점 각각 2가지를 제시하시오.","ans":"교사의 역할\n① 필요한 역량을 발달시키기 위하여 교육내용을 선정 및 조직하는 일에 상당한 자율성을 지니는 교육과정 재구성 전문가의 역할\n② 학생이 학습과정 및 평가에 대하여 스스로 성찰하고 배울 수 있도록 돕는 조력자의 역할\n장점\n① 불확실하고 변화하는 사회 속에서 학습자가 주체적으로 행동할 수 있는 능력을 개발할 수 있음\n② 교육과정을 적극적으로 재구성할 수 있는 설계방식임\n③ 교육과정 설계에 있어서 교사에게 많은 자율성을 부여함\n단점\n① 전통적으로 가치 있게 여겨져 온 지식체계를 소홀히 하는 것처럼 오인될 수 있음\n② 구체적인 교육내용의 조직 및 교수방법에 대한 논의가 부족함","kw":["교육과정 재구성 전문가","조력자","주체적","재구성","자율성","지식체계","교수방법"],"id":"gwajeong-e30"},{"ch":"CH02 교육과정의 관점","t":"역량","q":"역량의 개념과 역량의 속성 3가지를 제시하시오.","ans":"개념: 실제적인 삶 속에서 무엇인가를 할 줄 아는 실질적인 능력으로 지식, 기능, 태도의 총체\n속성\n① 총체성: 학습자는 개인의 능력을 이끌어내고 복합적인 방식으로 그것들을 통합하여 구체적인 사회적 맥락에서 활용할 수 있어야 함\n② 수행능력: 학습자는 고등사고능력, 인지적·정의적·행동적 영역 전반의 능력을 발휘하여 실제 상황에서 그것을 드러낼 수 있어야 함\n③ 발달적 성격: 역량에는 초보수준, 숙련수준, 전문가수준 등과 같이 다양한 수준이 존재함","kw":["실질적인 능력","지식","기능","태도의 총체","총체성","수행능력","발달적 성격"],"id":"gwajeong-e31"},{"ch":"CH02 교육과정의 관점","t":"역량중심 설계","q":"역량중심 교육과정 설계의 특징 2가지를 제시하시오.","ans":"① 역량은 지식과는 구분되는 개념이지만, 지식을 통해 개발됨 ⇒ 지식이나 내용은 역량을 개발시키는 수단임\n② 교사의 자율성을 중시하여, 지식이나 내용의 구체적인 조직에 대한 결정은 상당 부분 교사들에게 맡겨짐\n③ 역량은 분과적으로 조직된 지식 혹은 간학문적이나 통합적으로 조직된 지식을 통해 다루어질 수 있음\n④ 학생이 주도적으로 참여하는 배움중심의 수업이 강조됨\n⑤ 과제 수행과정을 총체적으로 평가하는 과정중심평가를 중시하며, 학생이 스스로의 학습을 성찰함으로써 평가에 참여하는 것을 독려함\n⑥ 교사는 교육내용을 선정 및 조직하는 교육과정 재구성의 전문가이자 학생이 스스로 성찰하고 배우도록 돕는 조력자의 역할을 수행함","kw":["지식을 통해 개발","수단","교사의 자율성","배움중심","과정중심평가","성찰","재구성의 전문가"],"id":"gwajeong-e32"},{"ch":"CH02 교육과정의 관점","t":"OECD 2030","q":"내용과 과정 측면에서의 역량교육 설계의 원리 각 2가지를 제시하시오. (OECD Education 2030)","ans":"내용 설계원리\n∙학생 주체성: 학생중심 교육과정 설계\n∙엄격성: 도전적인 사유와 성찰을 유도하는 주제\n∙초점: 학습의 깊이와 질을 위한 초점화된 주제\n∙일관성: 학문적 논리가 반영된 주제의 계열성 형성\n∙정합성: 교육과정-수업-평가의 일체화\n∙전이가능성: 지식, 기능, 태도와 가치의 맥락 간 학습의 전이\n과정 설계원리\n∙선택: 프로젝트의 주제 선택 및 제안의 기회 확대\n∙교사 주체성: 교사의 전문성 활용 권한 강화\n∙실제성: 학습경험과 실제 세계와의 연결, 간학문적 협력적 학습\n∙상호연관성: 학문 간 주제와 개념들의 연계, 학교 밖 실제 삶과 연계된 학습기회 제공\n∙유연성: 융통성 있고 역동적인 교육과정, 사회적 요구를 반영하는 진화하는 교육과정\n∙참여: 교육과정 개발에 대한 이해당사자들의 참여와 관여","kw":["학생 주체성","엄격성","초점","일관성","정합성","전이가능성","선택","교사 주체성","실제성","상호연관성","유연성","참여"],"id":"gwajeong-e33"},{"ch":"CH02 교육과정의 관점","t":"IB 프로그램","q":"IB 프로그램의 특징 2가지와 IB 프로그램에서 평가의 특징 2가지를 제시하시오.","ans":"특징\n① 학생들이 폭넓은 균형 잡힌 학문 및 학습의 경험을 접할 수 있는 다양한 기회를 제공함\n② 개념적 학습(conceptual learning)을 권장함\n③ 학생들은 새로운 지식을 이해하고, 전 교과군에 적용할 수 있는 효과적인 학습에 초점을 둠\n④ 학문 간의 관계성을 탐구하며 개별 교과 범위를 초월하여 다양한 과목을 통해 세상을 이해하도록 함\n⑤ 실제학습(authentic learning)의 기회를 제공하여 학습내용과 그들의 삶을 연결시킬 것을 강조함\n평가의 특징\n① 절대평가를 통해 성적을 산출함\n② 정성평가의 체계화: 타당성 확보를 위해 '외부평가'와 '내부평가'를 포함한 다면평가를 실시함\n③ 과정중심평가 설계: 평가 기반의 교육과정 설계, 누적기록의 지향과 피드백을 내재화함","kw":["개념적 학습","전 교과군","학문 간의 관계성","실제학습","절대평가","외부평가","내부평가","다면평가","과정중심평가"],"id":"gwajeong-e34"},{"ch":"CH03 교육과정 설계의 원리","t":"설계 요소","q":"교육과정 설계의 요소 4가지를 설명하시오.","ans":"① 교육목표(objectives): 교육을 통해 이루어져야 하는 것은 무엇인가?\n② 교과내용(subject matter): 어떠한 내용이 포함되어야 하는가?\n③ 방법 및 조직(method and organization): 어떠한 수업전략, 자원, 활동을 채택할 것인가?\n④ 평가(evaluation): 교육과정의 결과를 평가하기 위해 어떠한 방법 및 도구가 활용될 것인가?","kw":["교육목표","교과내용","방법 및 조직","평가","수업전략"],"id":"gwajeong-e35"},{"ch":"CH03 교육과정 설계의 원리","t":"교육목표","q":"교육목표의 개념과 교육목표 설정의 자원 3가지를 설명하시오.","ans":"개념: 교육을 통해서 기대하는 성과. 교육활동의 기준과 방향\n설정의 자원\n① 교과: 교과의 성격이나 교과 전문가들의 견해를 반영해야 함\n② 학습자: 학습자의 일반적인 발달단계에 대한 특성 혹은 학습자들 간의 관심사나 흥미와 같은 개인적 차이를 반영해야 함\n③ 사회: 사회 전체의 이념이나 변화하는 사회의 직접적인 필요를 분석함으로써 설정되어야 함","kw":["기대하는 성과","기준과 방향","교과","학습자","사회","발달단계","이념"],"id":"gwajeong-e36"},{"ch":"CH03 교육과정 설계의 원리","t":"행동적 수업목표","q":"행동적 수업목표의 장점 1가지와 문제점 2가지를 제시하시오.","ans":"장점: 무엇을 어떻게 가르쳐야 하는지에 대한 분명한 방향 제시로 교사들뿐 아니라 학부모와 학생과의 분명한 의사소통을 가능하게 함\n문제점\n① 수업을 통해 기대되는 결과를 모두 수업목표로 구체화할 수 없음 ⇒ 목표로 설정되지 않은 다른 영역을 배제할 수 있음\n② 의도하지 않은 결과에 대해서는 사전에 목표로 설정할 수 없음\n③ 특정 교과에서는 행동적 수업목표가 유용한 반면, 행동적 수업목표를 설정하기 어려운 교과도 존재함","kw":["분명한 방향 제시","의사소통","구체화할 수 없음","의도하지 않은 결과","설정하기 어려운 교과"],"id":"gwajeong-e37"},{"ch":"CH03 교육과정 설계의 원리","t":"내용선정 원리","q":"교육내용 선정의 원리 3가지를 설명하시오.","ans":"① 중요성: 교육내용이 학문 또는 교과에 얼마나 필수적인지 판단하는 것\n② 타당성: 교육내용의 정확성과 목표달성을 위한 효과성이라는 두 가지 의미로 사용됨\n③ 사회적 적절성: 건강한 공동체를 만들기 위해 도덕적 가치, 민주주의적 이상, 사회문제 해결을 위한 내용들을 포함해야 함\n④ 유용성: 학생이 성인이 된 이후의 생활을 준비하는 데 있어서 얼마나 유용한 것들을 많이 포함하는가를 의미함\n⑤ 학습가능성: 학습자의 특성(발달단계, 능력수준 등)에 적합한 내용을 선정해야 학습의 가능성이 높아진다는 것을 의미함\n⑥ 흥미: 학습자의 흥미를 불러일으키고 학습자의 흥미에 부합해야 함","kw":["중요성","타당성","사회적 적절성","유용성","학습가능성","흥미"],"id":"gwajeong-e38"},{"ch":"CH03 교육과정 설계의 원리","t":"학습경험 선정 원리","q":"학습경험 선정의 원리 3가지를 설명하시오.","ans":"① 기회의 원리: 특정한 교육목표를 달성하기 위해서는 그 목표를 도달하기 위한 행동을 해볼 수 있는 기회를 제공해야 함\n② 만족의 원리: 교육목표를 달성하기 위한 행동에서 학생들이 만족감을 느낄 수 있어야 함\n③ 가능성의 원리: 학생들에게 요구하는 행동이 그들의 현재 능력이나 성취 정도, 발달수준을 고려해야 함\n④ (일목표) 다경험의 원리: 한 가지 교육목표를 달성하기 위해 교사나 교육과정 개발자들이 열정과 창의성을 발휘하여 여러 가지 효과적인 학습경험(활동)을 제공함\n⑤ (일경험) 다성과의 원리: 어떤 활동을 선정할 때 여러 가지 교육목표를 동시에 달성할 수 있도록 하는 활동을 선택해야 함\n⑥ 협동의 원리: 학생들에게 함께 활동에 참여할 수 있는 기회를 주는 것이 좋음","kw":["기회의 원리","만족의 원리","가능성의 원리","다경험","다성과","협동의 원리"],"id":"gwajeong-e39"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"교육내용 조직에 있어서 수평적 조직, 수직적 조직 각각의 개념을 제시하시오.","ans":"수평적 조직: 같거나 비슷한 시간대에 연관성 있는 교육내용을 나란히 배치하여 학습의 효율성을 도모하는 것\n수직적 조직: 시간적 순서에 따라 교육내용을 순차로 배치하여 수업의 효율성을 높이고자 하는 것","kw":["수평적 조직","비슷한 시간대","나란히 배치","수직적 조직","시간적 순서","순차"],"id":"gwajeong-e40"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"교육과정을 조직할 때 수평적 조직에 있어 고려해야 하는 것 2가지의 명칭과 개념을 제시하시오.","ans":"① 범위(scope): 교육과정에서 다룰 내용의 폭과 깊이. 교육과정에 어떤 내용을 포함시키고 그 내용을 어느 정도까지 상세히 다룰 것인가를 결정하는 것\n② 통합성(integration): 교육과정 내용으로 포함될 수 있는 모든 유형의 지식과 경험을 서로 연결 짓는 것","kw":["범위","scope","폭과 깊이","통합성","integration","연결"],"id":"gwajeong-e41"},{"ch":"CH03 교육과정 설계의 원리","t":"내용조직","q":"교육과정을 설계할 때 수직적 조직에 있어 고려해야 하는 것 2가지의 명칭과 개념, 계열성을 확보하는 구체적인 방안 3가지를 제시하시오.","ans":"① 계속성(continuity): 중요한 개념이나 기능을 여러 시기에 걸쳐 계속해서 반복적으로 다루는 것\n② 계열성(sequence): 학생들의 누적적이고 지속적인 학습을 촉진하기 위해 학습내용이나 경험의 순서를 효과적으로 조직하는 것. 일반적으로 이전의 것에 너비와 깊이를 더해가는 것과 관련\n계열성 확보 방안\n① 단순한 것에서 복잡한 것으로 나아감\n② 전체로부터 부분으로 발전함\n③ 사건의 연대기적 순서로 제시함\n④ 구체적 경험에서 추상적인 개념의 순서로 나아감\n⑤ 특정 개념이나 아이디어가 계속 등장하되, 내용이 나선형으로 심화 및 확대되어 나타남","kw":["계속성","continuity","반복","계열성","sequence","단순한 것에서 복잡한 것","전체로부터 부분","연대기적","구체적 경험","나선형"],"id":"gwajeong-e42"},{"ch":"CH03 교육과정 설계의 원리","t":"총체적 조직","q":"교육과정을 설계할 때 총체적 조직에 있어 고려해야 하는 것 2가지의 명칭과 개념, 수직적 연계성과 수평적 연계성 각각의 개념을 제시하시오.","ans":"① 연계성(articulation): 교육과정의 여러 측면이 상호관련성을 맺도록 설계하는 것\n② 균형(balance): 교육과정 여러 측면의 내용을 적절한 비중으로 조화롭게 담아내야 하는 것\n수직적 연계성: 나중에 배울 내용이 그 이전에 배운 내용과 관련될 수 있도록 이전 학습의 종결점과 나중 학습의 출발점을 잘 맞물리게 내용을 조직해야 함\n수평적 연계성: 동일 학년 내 교과 간에 유사한 개념이나 주제, 기능 등이 있을 때, 이들 내용요소들이 동일한 수준으로 다루어질 수 있도록 조직해야 함","kw":["연계성","articulation","균형","balance","종결점","출발점","동일 학년","동일한 수준"],"id":"gwajeong-e43"},{"ch":"CH03 교육과정 설계의 원리","t":"균형","q":"교육과정 설계 시 균형을 위해 고려해야 할 측면 3가지를 제시하시오.","ans":"① 인간 발달의 인지적·정의적·심동적 영역\n② 개인적·사회적·지적 목표\n③ 교과와 학습자\n④ 공통내용과 선택내용\n⑤ 교육내용의 폭과 깊이","kw":["인지적","정의적","심동적","개인적","사회적","지적 목표","교과와 학습자","공통내용","선택내용","폭과 깊이"],"id":"gwajeong-e44"},{"ch":"CH03 교육과정 설계의 원리","t":"켈리","q":"켈리(Kelly)의 교육과정 설계모형에 따를 때, 내용모형·목표모형·과정모형 각각의 목적과 한계점 각각 1가지를 제시하시오.","ans":"[내용모형] 목적: 지식의 획득\n한계점: ∙교육내용을 사회의 문화에 기반하여 결정한다고 하나 문화의 실체가 분명하지 않음 ∙다원화된 사회에서는 사회의 문화로 불릴 수 있는 단일한 문화나 핵심, 고급문화를 결정하기 어려움 ∙사회의 문화라는 개념에 영향력 있는 압력집단들의 문화에 대한 입장이 반영될 수 있음 ∙교육의 목표, 학생들에 대한 관심이 거의 없음 ∙인간에 대한 수동적 관점 ∙논쟁의 여지가 있는 쟁점을 다루는 교과나 교육내용에는 적합하지 않음\n[목표모형] 목적: 목표 성취\n한계점: ∙교육에 대한 도구주의적 관점 ∙교사와 학생의 자유를 제한함(∵목표를 고정되거나 주어진 것으로 보게 하여 교사나 학생들이 교육과정에서 적극적 역할을 하기 어려움)\n[과정모형] 목적: 개인의 역량 발달\n한계점: ∙교육과정의 효과가 교사의 전문적 판단에 크게 의존하게 됨 ∙중앙에서 세밀하게 설계하기 어려움 ∙과정모형에서 중시하는 절차적 원리가 교수방법으로 오해될 여지가 있으며, 교육목표와 내용을 경시할 여지가 있음","kw":["지식의 획득","목표 성취","개인의 역량 발달","문화의 실체","도구주의적 관점","자유를 제한","전문적 판단","절차적 원리"],"id":"gwajeong-e45"},{"ch":"CH03 교육과정 설계의 원리","t":"교과중심 설계","q":"교과중심 설계의 대표적인 유형 4가지의 명칭과 각각의 개념을 제시하시오.","ans":"① 분과형 설계: 한 교과를 다른 교과와 독립된 별개의 교과로 각각 조직하는 설계방식\n② 상관형 설계: 두 개 이상의 교과들을 각 교과의 정체성은 유지하되 서로 관련지어서 설계하는 것\n③ 광역형 설계: 서로 유사한 교과들을 묶어서 하나의 교과로 재조직하는 통합유형\n④ 융합형 설계: 두 개 이상의 교과목에서 내용, 개념, 원리, 탐구방법 등의 공통요인을 추출하여 교과를 재조직하고 새로운 교과를 융합적으로 구성하는 설계방식","kw":["분과형","상관형","광역형","융합형","독립된 별개","정체성 유지","유사한 교과","공통요인"],"id":"gwajeong-e46"},{"ch":"CH03 교육과정 설계의 원리","t":"분과형 설계","q":"분과형 설계의 특징, 장점과 단점 각각 2가지를 제시하시오.","ans":"특징\n① 교과의 논리적 구조와 지적 체계에 따라 조직하므로, 교과 간 관련성은 없고 독립적인 교과로서의 성격을 유지함\n② 학습자는 각 학문의 전문가가 채택하는 탐구방식을 학습하여 정보를 처리하는 방법을 익히게 됨\n③ 학문의 구조나 개념 간의 관련성에 따라 학습하면 교육내용을 깊이 이해하고, 지식이 적용되는 방식을 깨달을 수 있다고 전제함\n장점\n① 초보적인 지식과 전문지식 사이의 간극을 좁힐 수 있음\n② 학습내용의 기억과 일반적 전이가 비교적 용이함\n단점\n① 대학 입학을 앞둔 학생의 흥미만을 주로 반영함\n② 학문적 지식으로 분류될 수 없는 다양한 지식을 교육과정에 포함하지 않음","kw":["논리적 구조","지적 체계","독립적","탐구방식","간극","일반적 전이","대학 입학","다양한 지식"],"id":"gwajeong-e47"},{"ch":"CH03 교육과정 설계의 원리","t":"상관형 설계","q":"상관형 설계의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 각 교과의 중복 및 누락을 방지할 수 있음\n② 학습자에게 통합적인 학습기회를 제공함\n단점\n① 여전히 분과 교육과정의 결점을 근본적으로 해결하지 못함\n② 한정된 상관성으로 인해 개별성과 관련성만 있으며, 포괄적인 통합성은 부족함","kw":["중복","누락","통합적인 학습기회","분과 교육과정의 결점","한정된 상관성","포괄적인 통합성"],"id":"gwajeong-e48"},{"ch":"CH03 교육과정 설계의 원리","t":"광역형 설계","q":"광역형 설계의 대표적인 조직방법 1가지와 장점, 단점 각각 2가지를 제시하시오.","ans":"조직방법 - 주제법: 넓게 볼 때 같은 교과영역의 부류에 속하는 여러 세부적인 과목의 내용을 분석하여 이들을 포괄할 수 있는 주제를 설정하고, 주제와 관련된 지식과 개념 및 원리들을 조직하는 방식\n장점\n① 관련된 지식을 주제 중심으로 넓게 묶어서 제시하기 때문에 상호관련성이 쉽게 이해됨. 사회문제나 개인의 욕구와 관련시킬 수 있음\n② 학습자가 실제로 당면하는 사회문제나 개인의 관심과 관련짓는 지식의 기능적 조직이 가능함\n③ 사실보다는 기본 개념과 원리에 보다 충실한 교육과정 조직을 가능하게 함\n단점\n① 지나치게 개략적인 내용만을 다룸으로써 학습내용의 깊이가 부족할 수 있으며, 추상적인 내용으로 제시되어 이해하기 어려울 수 있음\n② 여러 과목을 통합함으로 인하여 각 교과목이 지니는 고유의 논리성과 개념체계를 이해하지 못하게 될 수 있음","kw":["주제법","포괄","상호관련성","기능적 조직","기본 개념과 원리","개략적","깊이가 부족","논리성","개념체계"],"id":"gwajeong-e49"},{"ch":"CH03 교육과정 설계의 원리","t":"융합형 설계","q":"융합형 설계의 실행조건 2가지와 장점, 단점 각각 2가지를 제시하시오.","ans":"실행조건\n① 개별 학문의 단편성에서 벗어나 여러 학문의 공통요소를 유기적으로 연결할 수 있어야 하므로 융통성 있는 시간표 운영이 필요함\n② 다양한 학문을 융합시키고자 하는 교육과정 설계자의 노력과 이를 실천할 수 있는 의식의 변화, 경제적 지원 등이 요구됨\n③ 융합형 설계는 형식적인 융합이 아니라 내용적인 융합을 중시함\n장점\n① 학습에 있어서 분과형 교육과정이 지니는 단편적인 지식의 학습에서 벗어날 수 있음\n② 학습의 통합성을 높이고 통합적인 경험을 조성할 수 있음\n③ 창의·융합적 사고력, 종합적 문제해결력을 높일 수 있음\n④ 학습동기 유발 및 흥미와 이해의 촉진에 효과적임\n단점\n① 각 학문의 공통적인 주제를 선정하기 때문에 각 학문의 개별적인 성격이 약화됨\n② 교과별 지식을 체계적으로 학습하기 어렵기 때문에 기초교육의 저하가 우려됨","kw":["유기적으로 연결","융통성 있는 시간표","내용적인 융합","단편적인 지식","통합성","창의·융합적 사고력","개별적인 성격","기초교육의 저하"],"id":"gwajeong-e50"},{"ch":"CH03 교육과정 설계의 원리","t":"학습자중심 설계","q":"학습자중심 설계의 대표적인 유형 3가지의 명칭과 각각의 개념을 제시하시오.","ans":"① 아동중심(활동중심) 설계: 학습이 아동의 삶과 흥미, 필요를 중심으로 이루어지도록 하는 설계방식\n② 경험중심 설계: 아동의 경험을 분석하여 학습의 시작점으로 두고, 형식화된 지식과 아동의 경험이 연결될 수 있도록 하는 설계방식\n③ 인간중심 설계: 교육이 아동의 정서적, 신체적, 도덕적 발달을 포함하여 인간의 행복에 초점을 맞추어야 한다는 믿음에 기초하는 설계방식\n④ 구성주의 설계: 지식은 개인의 자아성찰적, 인지적 작용과 사회적 참여를 통해 지속적으로 변화, 수정, 보완, 구성되어 가는 것이라는 관점의 설계방식\n⑤ 생성형 설계: 사전에 계획하지 않고 학습의 현장에서 교사와 학생이 함께 만들어가는 교육과정 설계방식","kw":["아동중심","활동중심","경험중심","인간중심","구성주의","생성형","시작점","인간의 행복","자아성찰적"],"id":"gwajeong-e51"},{"ch":"CH03 교육과정 설계의 원리","t":"생성형 설계","q":"생성형 설계의 특징 2가지와 구체적인 운영방법 1가지, 장점과 단점 각각 2가지를 제시하시오.","ans":"특징\n① 사전에 계획된 내용이 없기 때문에 교육과정을 구성하는 데 있어서 교사와 학생에게 상당한 자율성과 융통성을 부여함\n② 생활현장에 밀접하게 관련되어 있음\n③ 상대적으로 저학년의 학생들에게 많이 적용되는 설계방식임\n운영방법: 현장학습, 답사 등\n장점\n① 교사와 학생의 흥미와 관심사를 반영할 수 있고, 교육과정 내용의 자유도가 높음\n② 학습자의 심리적·환경적 측면을 강조하여 이루어짐\n③ 경험중심 조직유형의 기본적 견해에 비추어 볼 때 학습자의 심리적·환경적 측면을 가장 강조하며 이루어지는 교육과정임\n단점\n① 초보교사가 운영하기 어렵기 때문에 교사의 유능성이 중요함\n② 즉흥적인 흥미나 주제에 지나치게 초점이 맞춰질 경우 교육내용이 깊이 있게 다루어지기보다는 피상적으로 다루어질 우려가 있음\n③ 어느 형태보다 현실성이 강하나, 내용상의 계열성과 관련성을 지니기는 어려움","kw":["자율성","융통성","생활현장","저학년","현장학습","답사","자유도","심리적","환경적","초보교사","피상적","계열성"],"id":"gwajeong-e52"},{"ch":"CH03 교육과정 설계의 원리","t":"중핵형 설계","q":"중핵형 설계(core design)의 개념과 특징 2가지, 유형 3가지와 유형별 개념, 장점과 단점 각각 2가지를 제시하시오.","ans":"개념\n① 사람들이 일상생활에서 겪는 공통된 문제나 과제를 중심으로, 그 문제를 해결하는 과정에 맞춰 수업내용을 구성하는 설계방식\n② 중심부인 중핵과정(core course)과 주변과정(fringe course)이 동심원적으로 결합된 설계방식\n특징\n① 교과의 선을 없애고 학습자의 공통된 요구, 문제, 관심 등을 중심으로 교육내용을 조직함\n② 중핵교육과정의 수업은 주로 블록타임 형식으로 운영됨\n③ 모든 학습자에게 공통적으로 필요하다고 여겨지는 핵심적인 학습활동으로 구성됨\n④ 학습활동은 학생들의 광범위한 흥미와 요구를 반영하여 교사와 학생의 협력하에 계획함\n⑤ 학습해야 할 주요 대상이나 주제는 사회문제가 되지만, 학습의 과정은 학습자의 흥미에 기초해 이루어지도록 함\n유형\n① 교과중심 중핵교육과정: 여러 교과를 통합하여 이를 중핵의 요소로 삼는 교육과정이다.\n② 개인중심 중핵교육과정: 학습자 개인의 필요와 흥미를 중핵의 요소로 삼는 교육과정이다.\n③ 사회중심 중핵교육과정: 사회적인 문제나 기능을 중핵의 요소로 삼는 교육과정이다.\n장점\n① 학습자의 삶과 관련된 실제적인 과제를 교육의 주제로 다루기 때문에 학습자의 문제해결능력과 비판적 사고력을 함양할 수 있음\n② 교과내용의 통합을 통해 학습자의 통합적인 성장을 촉진할 수 있음\n③ 학습자의 자발적·능동적 참여로 의미 있는 학습경험이 가능함\n④ 지역사회 문제해결에 기여하는 생활인을 기르고 민주적 태도를 함양하는 데 도움을 줌\n단점\n① 수업을 위한 교육자료를 수집하는 데 어려움이 따르며, 수업준비에도 많은 시간이 소요됨\n② 중심주제를 이해하고 문제를 해결하는 데 중점을 두기 때문에 교과의 지식을 체계적으로 학습하기 어려움\n③ 범위가 제한되지 않은 방만한 운영이 이루어질 경우 시간과 경비가 많이 듦\n④ 통합에 미숙한 교사는 교과도 경험도 모두 실패할 위험이 높으며, 결
