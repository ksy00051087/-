권설","q":"교육행정에 대한 '국가공권설'의 개념과 한계로 옳은 것은?","opts":["교육행정을 국가권력작용으로 파악하여 '교육부가 수행하는 법적 기능 또는 행정작용'으로 보며, 교육행정의 특수성과 전문성을 무시하고 행정의 관료성과 획일성을 강조하며 교육의 정치적 중립성과 자주성을 간과함","교육목표를 효율적으로 달성하기 위해 필요한 인적·물적 조건을 정비 및 확립하는 수단적·봉사적 활동으로 보며, 권력적 측면을 소홀히 취급함","협동행위를 통하여 과업을 효과적으로 성취하는 것으로 보며, 의사결정과정에 초점을 둠","학습자의 학습활동에 궁극적 지향점을 두고 제반 조건과 환경을 정비하는 활동으로 봄"],"a":0,"exp":"국가공권설은 교육행정을 국가권력작용으로 파악하며, 특징은 교육활동의 특수성과 전문성보다 행정의 통합성이 강조된다는 점이다. ②는 조건정비설, ③은 협동행위론, ④는 성장지원론이다.","id":"haengjeong-m6"},{"ch":"CH01 교육행정의 이해","t":"조건정비설","q":"'조건정비설'의 개념과 특징으로 옳은 것은?","opts":["교육목표를 효율적으로 달성하기 위해 필요한 인적·물적 조건을 정비 및 확립하는 수단적·봉사적 활동으로 보며, 교육활동의 특수성·전문성을 강조함","교육행정을 국가권력작용으로 파악하며 행정의 통합성을 강조함","의사결정과정에 초점을 두며 합리성을 추구함","학습의 주체와 학습활동 자체를 중시함"],"a":0,"exp":"조건정비설은 교육행정을 수단적·봉사적 활동으로 보며 교육활동의 특수성·전문성을 강조한다. 한계는 봉사활동·기술적 측면·정치적 중립이 강조되지만 행정에 작용하는 권력적 측면은 소홀히 취급된다는 점이다.","id":"haengjeong-m7"},{"ch":"CH01 교육행정의 이해","t":"협동행위론","q":"'협동행위론'의 특징으로 옳은 것은?","opts":["주로 행정행위, 특히 '의사결정과정'에 초점을 두며, 협동행위를 통하여 과업을 효과적으로 성취하는 합리성을 추구하고, 단위학교 책임경영제가 대두되며 협동행위로서 교육행정을 바라보는 관점이 강조됨","교육행정을 국가의 법적 기능 또는 행정작용으로 봄","인적·물적 조건을 정비하는 수단적 활동으로 봄","학습동기를 유발하고 활발한 학습활동을 유지·조장하는 활동으로 봄"],"a":0,"exp":"협동행위론은 의사결정과정에 초점을 두고 합리성을 추구하며, 단위학교 책임경영제 대두와 함께 강조된다.","id":"haengjeong-m8"},{"ch":"CH01 교육행정의 이해","t":"성장지원론","q":"'성장지원론'의 특징으로 옳은 것은?","opts":["궁극적 지향점을 학습자의 학습활동에 두고 학습동기를 유발하고 활발한 학습활동을 유지·조장함으로써 교육적 성장을 달성할 수 있도록 제반 조건과 환경을 정비하는 활동이며, 학습의 주체와 학습활동 자체를 중시함","교육행정을 국가권력작용으로 파악함","의사결정과정에 초점을 두고 합리성을 추구함","인적·물적 조건을 정비하는 수단적·봉사적 활동으로 봄"],"a":0,"exp":"성장지원론은 학습자의 학습활동에 궁극적 지향점을 두고 제반 조건과 환경을 정비하는 활동이며 학습의 주체와 학습활동 자체를 중시한다.","id":"haengjeong-m9"},{"ch":"CH01 교육행정의 이해","t":"교육행정의 원리","q":"교육행정의 원리 중 '민주성의 원리'의 개념과 예시로 옳은 것은?","opts":["국민의 의사를 행정에 반영하고 국민을 위한 행정을 해야 함 / 예시: 교직원회의, 협의회, 연구회 등을 통해 의사소통의 길을 개방하고 협조나 이해를 토대로 사무를 집행함","모든 국민이 능력에 따라 균등하게 교육을 받을 권리 / 예시: 의무교육, 장학금제도","가장 능률적인 방법으로 최대의 목표를 달성하는 것 / 예시: 예산 절감","중앙집권과 지방분권 사이에서 적도의 균형점을 확보 / 예시: 지방교육자치"],"a":0,"exp":"민주성의 원리는 국민의 의사를 행정에 반영하고 국민을 위한 행정을 하는 것이며, 예시는 교직원회의, 협의회, 연구회 등이다. ②는 기회균등의 원리, ③은 효율성의 원리, ④는 적도집권의 원리이다.","id":"haengjeong-m10"},{"ch":"CH01 교육행정의 이해","t":"교육행정의 원리","q":"교육행정의 원리 중 '기회균등의 원리'의 예시로 옳은 것은?","opts":["의무교육, 장학금제도, 사회보장제도, 야간제·계절제·시간제 학교 운영 등","교직원회의, 협의회, 연구회 등","예산 편성의 효율화","중앙집권과 지방분권의 균형"],"a":0,"exp":"기회균등의 원리는 모든 국민이 능력에 따라 균등하게 교육을 받을 권리로 법적으로 보장되며, 예시는 의무교육, 장학금제도, 사회보장제도, 야간제·계절제·시간제 학교 운영 등이다.","id":"haengjeong-m11"},{"ch":"CH01 교육행정의 이해","t":"교육행정의 원리","q":"교육행정의 원리 중 '적도집권의 원리'에 해당하는 설명은?","opts":["중앙집권과 지방분권 사이에서 적도의 균형점을 확보해야 하며, 집권주의가 행정의 능률 향상에 기여하는 한편 분권주의는 민주주의적 권한의 위양과 참여의 기회를 보장하므로 적절한 균형을 도모해야 함","효과성 + 능률성. 가장 능률적인 방법으로 최대의 목표를 달성하는 것","국민의 의사를 행정에 반영하는 것","모든 국민이 능력에 따라 균등하게 교육을 받을 권리"],"a":0,"exp":"적도집권의 원리는 중앙집권과 지방분권 사이의 적도의 균형점 확보이다. ②는 효율성의 원리, ③은 민주성의 원리, ④는 기회균등의 원리이다.","id":"haengjeong-m12"},{"ch":"CH01 교육행정의 이해","t":"관료제","q":"관료제의 개념과 특징 중 '몰인정성'에 해당하는 설명은?","opts":["관료제는 합법적 권위를 기초로 하여 성립하는 이상적인 조직형태이며, 몰인정성은 직원이 개인적 감정을 드러내지 않고 형식주의적인 비인격성에 입각해 직무를 수행하는 것","직원의 보수는 직위에 따라 책정·지급되며 승진은 경력이나 실적에 의해 결정됨","조직 내 권한의 위계가 존재함","규정과 규칙에 따라 업무를 수행함"],"a":0,"exp":"관료제는 합법적 권위를 기초로 성립하는 이상적 조직형태이며, 몰인정성은 개인적 감정을 드러내지 않고 형식주의적 비인격성에 입각해 직무를 수행하는 것이다. ②는 경력지향성이다.","id":"haengjeong-m13"},{"ch":"CH01 교육행정의 이해","t":"관료제","q":"관료제의 특징과 순기능·역기능의 연결로 옳은 것은?","opts":["몰인정성 — 순기능: 합리성 증진 / 역기능: 사기 저하","분업과 전문화 — 순기능: 순응과 원활한 조정 / 역기능: 의사소통 장애","권위의 위계 — 순기능: 전문성 향상 / 역기능: 권태감의 누적","경력지향성 — 순기능: 계속성과 통일성 확보 / 역기능: 경직과 목표전도"],"a":0,"exp":"관료제의 특징별 순기능/역기능은 분업과 전문화(전문성 향상/권태감의 누적), 권위의 위계(순응과 원활한 조정/의사소통 장애), 규정과 규칙(계속성과 통일성 확보/경직과 목표전도), 몰인정성(합리성 증진/사기 저하), 경력지향성(동기의 유발/실적과 연공의 갈등)이다.","id":"haengjeong-m14"},{"ch":"CH01 교육행정의 이해","t":"학교 관료제","q":"학교의 관료제적 특징 중 '직책의 위계구조'에 해당하는 설명은?","opts":["학교조직은 직제표에 따라 명확하고 엄격한 위계구조를 지님","학교의 업무는 크게 교수·학습활동을 중심으로 한 수업과 이를 지원하기 위한 각종 행정업무로 나누어짐","공식적 행위의 목적과 형태를 상술하여 교사의 재량에 제한을 두는 절차가 존재함","교사는 전문적인 능력에 따라서 채용되고 연공서열과 업적에 따라 승진이 결정됨"],"a":0,"exp":"학교의 관료제적 특징은 기능적 분업(②), 공식적 직무로서 교직원 역할의 정의, 절차 규정에 따른 운영(③), 직책의 위계구조(①), 승진구조(④)이다.","id":"haengjeong-m15"},{"ch":"CH01 교육행정의 이해","t":"브루코버","q":"브루코버(Brookover)의 사회체제 접근에서 과정변인에 해당하지 않는 것은?","opts":["학교의 재정 규모와 시설 수준","학교의 사회심리적 규범: 학교 구성원의 학교교육에 대한 일반적인 신념, 기대, 규범, 평가, 감정, 분위기 등","학교의 조직구조 및 운영방식: 학교의 행정적 조직부터 학급 내 학습집단 구성형태까지 포함","학급 내 수업 실천행위: 학급 내에서 개인 또는 집단적으로 표출되는 의사소통의 방식, 행동강화, 보상방식, 규제나 평가, 수업자료 제공과 수업에 투입하는 시간 등"],"a":0,"exp":"과정변인은 ②학교의 사회심리적 규범(학교의 역사적 전통에서 파생된 것) ③학교의 조직구조 및 운영방식 ④학급 내 수업 실천행위이다.","id":"haengjeong-m16"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 구바","q":"겟젤스(Getzels)와 구바(Guba)의 사회과정모형에서 인간의 행동이 사회적 행위로 나타나는 데 영향을 미치는 두 가지 차원으로 옳은 것은?","opts":["규범적 차원(조직적 차원)과 개인적 차원(심리적 차원)","인류학적 차원과 조직풍토 차원","도구적 차원과 표현적 차원","구조체제와 문화체제"],"a":0,"exp":"규범적 차원(조직적 차원)은 체제의 목적을 달성하기 위한 과업분담체제로 지위·역할·역할에 따른 기대 등을 규정한 제도이며, 개인적 차원(심리적 차원)은 독특한 특성을 가지고 있는 개인을 포함하는 사회체제로 개인·인성·욕구성향을 의미한다.","id":"haengjeong-m17"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 텔렌","q":"겟젤스(Getzels)와 텔렌(Thelen)의 수정모형에서 조직과 개인 차원 외에 인간의 행위에 영향을 미치는 세 가지 차원 중 '인류학적 차원'에 해당하는 설명은?","opts":["한 제도에 소속된 개인의 행동은 보다 큰 차원의 사회의식에 의해 영향을 받고 사회적 행동에 영향을 미치며, 사회의식은 한 개인이 소속한 집단과 관련 맺고 있는 보다 큰 사회체제의 문화를 의미함","어떠한 조직이든 특수한 조직풍토 또는 집단의식이 있으며 이들에 의해 개인의 사회적 행위는 아주 다르게 나타남","인간의 신체구조와 내적 잠재력 등 물리적·정서적 조건이 개인의 인성과 욕구에 영향을 주고 사회적 행동에도 영향을 미침","제도적 목표와 자신의 욕구성향을 일치시켜야 함"],"a":0,"exp":"세 차원은 인류학적 차원(①), 조직풍토 차원(②), 생물학적 차원(③)이다. ④는 일체감(개인 행동이 목표로 나타나기 위한 조건)이다.","id":"haengjeong-m18"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 텔렌","q":"겟젤스와 텔렌의 수정모형에서 개인의 행동이 목표로 나타나기 위한 조건 3가지로 옳은 것은?","opts":["합리성, 소속감, 일체감","인류학적 차원, 조직풍토 차원, 생물학적 차원","규범적 차원, 개인적 차원, 문화적 차원","구조체제, 개인체제, 정치체제"],"a":0,"exp":"조건은 ①합리성(목표행위에 대한 역할기대가 논리적으로 부합해야 함) ②소속감(집단의 제도적 목표 달성에 의식적으로 참여함으로써 공동체의식을 가져야 함) ③일체감(제도적 목표와 자신의 욕구성향을 일치시켜야 함)이다.","id":"haengjeong-m19"},{"ch":"CH01 교육행정의 이해","t":"호이와 미스켈","q":"호이(Hoy)와 미스켈(Miskel)의 관점에서 학교조직을 구성하는 4가지 체제 중 '문화체제'에 해당하는 설명은?","opts":["학교 관리자와 교사를 비롯한 교직원이 일에 대해 공유하고 있는 지향점","학교조직의 목적달성을 위해 설계 및 조직된 공식적·관료적 기대","학교 구성원의 욕구, 목적, 신념, 역할에 대한 인지적 이해의 관점","학교구조에서 '교장-교감-교사', '교사-교사' 간의 권력관계"],"a":0,"exp":"4가지 체제는 구조체제(②), 개인체제(③), 문화체제(①), 정치체제(④)이다.","id":"haengjeong-m20"},{"ch":"CH01 교육행정의 이해","t":"개방체제","q":"개방체제로서 학교조직의 특징으로 옳은 것은?","opts":["학교운영위원회와 같은 공식적 의사소통 구조, 정치적 성격을 지닌 비공식적인 활동을 통해 학교 내외에서 피드백을 제공하며, 학교체제에서의 환경은 학교체제를 구성하는 내적 요소에 영향을 줌","학교는 외부 환경과 완전히 단절되어 독립적으로 운영됨","학교의 모든 의사결정은 교장 1인에 의해 이루어짐","학교는 관료제적 특성만을 지님"],"a":0,"exp":"개방체제로서 학교조직은 공식적·비공식적 활동을 통해 학교 내외에서 피드백을 제공하며, 환경(교육청의 정책, 교육행정가, 다른 학교, 지역사회 등)이 내적 요소에 영향을 준다.","id":"haengjeong-m21"},{"ch":"CH01 교육행정의 이해","t":"전문적 학습공동체","q":"전문적 학습공동체의 목표와 활성화 조건으로 옳은 것은?","opts":["교사들이 함께 일하는 것에 가치를 두고 협조를 통하여 교사의 교수·학습활동을 개선하는 데 지속적인 노력을 기울이는 것이며, 분산적 리더십을 통해 학교발전을 위한 참여 및 책임을 서로 공유할 수 있는 문화 생성이 필요함","교사의 개인적 성과를 극대화하는 것이며, 경쟁적 평가체제가 필요함","교장의 통제력을 강화하는 것이며, 위계적 조직구조가 필요함","학생의 성적을 향상시키는 것이며, 표준화된 교육과정이 필요함"],"a":0,"exp":"전문적 학습공동체의 활성화 조건은 ①분산적 리더십을 통한 참여·책임 공유 문화 생성 ②인적·재정적·물적 자원의 확보 ③교사전문가로 구성된 연결망 ④다양한 교육책무성 지표 설정이다.","id":"haengjeong-m22"},{"ch":"CH02 조직론","t":"비공식조직","q":"비공식조직의 개념과 공식조직과 구별되는 특징으로 옳은 것은?","opts":["공식조직 내에 자연발생적으로 생기는 조직(=자생조직)이며, 공식조직은 권한의 위계, 분명한 책임, 표준화된 업무수행, 비인정적 인간관계인 반면 비공식조직은 지역·학연 등을 바탕으로 형성된 비공식 규범과 권위의 위계 속에서 활동함","법령에 의해 설치된 조직이며, 권한의 위계가 명확함","계선조직의 기능을 원활하게 추진하도록 지원하는 조직임","고객과 조직이 모두 선택권을 갖는 조직임"],"a":0,"exp":"비공식조직은 공식조직 내에 자연발생적으로 생기는 조직(자생조직)이며, 공식조직의 규모는 계속 확대되는 반면 비공식조직은 친숙한 인간관계를 요건으로 하므로 항상 소집단을 유지한다.","id":"haengjeong-m23"},{"ch":"CH02 조직론","t":"비공식조직","q":"비공식조직의 역기능으로 옳은 것은?","opts":["파벌을 조성하고 공식조직의 목표달성을 저해할 수 있으며, 공식조직의 의사소통을 차단 또는 왜곡하여 비합리적 의사결정이나 편파적 행정행위 등을 초래하고 조직의 혼란을 가중시킬 수 있음","구성원의 태도, 이해, 관습, 습관, 제도를 형성함","공식조직에서 필요로 하는 조건을 형성하여 조직의 기능을 활성화함","공식조직 내 자유로운 의사소통을 원활하게 함"],"a":0,"exp":"②③④는 비공식조직의 순기능이다.","id":"haengjeong-m24"},{"ch":"CH02 조직론","t":"계선·참모조직","q":"계선조직의 개념과 예시로 옳은 것은?","opts":["행정의 수직적 지휘명령 계통이 명확히 정립되어 업무를 직접 수행하는 1차적인 조직 / 예) '장관-실·국장-과장-계장-계원'으로 이어지는 행정관료조직","계선조직의 기능을 원활하게 추진하도록 기획, 자문, 협의 등의 기능을 수행하는 조직 / 예) 각종 위원회","공식조직 내에 자연발생적으로 생기는 조직 / 예) 친목회","조직과 고객이 독자적 선택권을 갖는 조직 / 예) 사립학교"],"a":0,"exp":"계선조직은 수직적 지휘명령 계통이 명확히 정립되어 업무를 직접 수행하는 1차적 조직이다. ②는 참모조직(막료조직)이다.","id":"haengjeong-m25"},{"ch":"CH02 조직론","t":"계선·참모조직","q":"참모조직의 장점으로 옳은 것은?","opts":["기관장의 통솔범위를 확대시키고, 전문적 지식과 경험을 활용하여 합리적인 결정을 할 수 있으며, 수평적 업무조정을 가능하게 하고 조직의 신축성을 기할 수 있음","권한과 책임의 한계가 명확해 업무수행의 효율성을 제고할 수 있음","단일 기관으로 구성되어 신속하게 정책을 결정할 수 있음","업무처리가 간편하여 조직운영비가 적게 듦"],"a":0,"exp":"②③④는 계선조직의 장점이다. 참모조직의 단점은 조직의 복잡성으로 인한 갈등·불화, 조직운영 경비 지출 증가, 계선과 참모 간 책임전가, 의사전달의 혼란이다.","id":"haengjeong-m26"},{"ch":"CH02 조직론","t":"계선·참모조직","q":"계선조직의 단점으로 옳은 것은?","opts":["복잡하고 과다한 업무처리가 어렵고, 지도자의 주관적·독단적인 결정을 방지할 수 없으며, 전문가의 지식과 경험을 충분하게 활용할 수 없고 조직의 경직성을 초래할 수 있음","조직의 복잡성으로 조직 구성원이나 부서 간 갈등, 불화가 생길 수 있음","조직운영을 위한 경비지출이 많이 듦","의사전달의 혼란을 일으킬 수 있음"],"a":0,"exp":"②③④는 참모조직의 단점이다.","id":"haengjeong-m27"},{"ch":"CH02 조직론","t":"칼슨","q":"칼슨(Carlson)의 관점에서 봉사조직을 분류하는 기준 2가지와 야생조직의 특징으로 옳은 것은?","opts":["기준: 고객의 참여결정권, 조직의 고객선택권 여부 / 야생조직: 조직과 고객이 독자적 선택권을 갖는 조직이며 살아남기 위해 경쟁이 필수적임(예: 사립학교, 개인병원, 공공복지기관 등)","기준: 권력의 유형과 참여의 유형 / 야생조직: 규범적 권력을 사용하는 조직","기준: 관료성과 전문성 / 야생조직: 관료성이 높은 조직","기준: 인간에 대한 관심과 성과에 대한 관심 / 야생조직: 성과에 대한 관심이 높은 조직"],"a":0,"exp":"칼슨의 분류기준은 고객의 참여결정권과 조직의 고객선택권 여부이며, 야생조직은 조직과 고객이 독자적 선택권을 갖고 경쟁이 필수적이다.","id":"haengjeong-m28"},{"ch":"CH02 조직론","t":"칼슨","q":"칼슨(Carlson)의 '사육조직(온상조직, 보호조직)'의 특징과 예시로 옳은 것은?","opts":["조직이나 고객 모두 선택권을 갖지 못하는 조직이며 법적으로 존립을 보장받고 있음 / 예) 공립학교, 정신병원, 형무소 등","조직과 고객이 독자적 선택권을 갖는 조직이며 경쟁이 필수적임 / 예) 사립학교, 개인병원","규범적 권력을 사용하는 조직 / 예) 학교, 종교단체","기술의 표준화를 조정기제로 하는 조직 / 예) 병원, 대학"],"a":0,"exp":"사육조직은 조직이나 고객 모두 선택권을 갖지 못하며 법적으로 존립을 보장받는 조직으로, 예는 공립학교·정신병원·형무소 등이다. ②는 야생조직이다.","id":"haengjeong-m29"},{"ch":"CH02 조직론","t":"에치오니","q":"에치오니(Etzioni)의 조직유형 중 학교가 속하는 조직유형과 그 목적, 특성으로 옳은 것은?","opts":["규범조직 / 목적: 새로운 문화의 창출·계승·활용 / 특성: 규범적 권력(상징적 보상을 사용하는 것)을 사용하여 구성원의 높은 헌신적 참여를 유도","강제조직 / 목적: 질서 유지 / 특성: 강제적 권력 사용","공리조직 / 목적: 이윤 창출 / 특성: 보수적 권력 사용","봉사조직 / 목적: 고객 서비스 / 특성: 계약적 권력 사용"],"a":0,"exp":"학교는 규범조직에 속하며, 목적은 새로운 문화의 창출·계승·활용이고, 규범적 권력(상징적 보상)을 사용하여 헌신적 참여(매우 긍정적 태도를 가지고 적극적으로 참여하는 것)를 유도한다.","id":"haengjeong-m30"},{"ch":"CH02 조직론","t":"관료제 유형","q":"'전문적 관료제'의 특성으로 옳은 것은?","opts":["기술의 표준화를 조정기제로 하는 조직이며, 현업 핵심계층이 조직의 핵심이 되어 실무 전문가들의 기술과 지식에 의존하고, 전문가 스스로가 자신을 통제하고 작업기준을 개발하기 때문에 분권화 및 이완된 형태를 보임","표준화된 작업과정을 통해 조정되는 조직이며, 표준화를 주도하는 기술구조층이 핵심부문이 됨","규칙과 규정의 적용, 공식적 의사소통, 위계적 의사결정이 특징임","권위는 직위와 위계에 토대를 두고 있으며 상급자가 최종 결정을 함"],"a":0,"exp":"전문적 관료제는 기술의 표준화를 조정기제로 하며 분권화·이완된 형태를 보인다. ②③은 기계식 관료제(≒베버형 관료제 조직)이다.","id":"haengjeong-m31"},{"ch":"CH02 조직론","t":"홀","q":"홀(Hall)의 분류에 따를 때 관료적 패턴의 특징과 전문적 패턴의 특징으로 옳은 것은?","opts":["관료적 패턴: 권위의 위계, 규정과 규칙, 몰인정성, 절차 상세화 / 전문적 패턴: 기술적 능력, 전문화","관료적 패턴: 기술적 능력, 전문화 / 전문적 패턴: 권위의 위계, 규정과 규칙","관료적 패턴: 분권화, 자율성 / 전문적 패턴: 집권화, 통제","관료적 패턴: 상징적 보상 / 전문적 패턴: 물질적 보상"],"a":0,"exp":"관료적 패턴의 특징은 권위의 위계, 규정과 규칙, 몰인정성, 절차 상세화이고, 전문적 패턴의 특징은 기술적 능력, 전문화이다.","id":"haengjeong-m32"},{"ch":"CH02 조직론","t":"홀","q":"홀(Hall)의 분류에 따른 학교조직 유형 중 '전문형 구조(관료성↓, 전문성↑)'의 특징으로 옳은 것은?","opts":["실질적 의사결정이 구성원들에게 위임되어 있는 구조이며, 구성원들은 조직의 중요한 의사결정을 할 수 있는 전문지식과 능력을 갖춘 전문가로 간주되고, 규정은 행동과 결정의 지침으로 작용하며 교사들이 조직의 의사결정 과정에 상당한 영향력을 행사함","전문성과 관료성이 상호보완적 관계에 있으며 베버가 기술한 이상적 관료제 구조","권위는 직위와 위계에 토대를 두고 있으며 상급자가 최종 결정을 하고 권력은 집중되어 있음","혼란과 갈등이 일상의 조직운영에서 나타나며 모순, 반목 및 비효과성이 조직 전반에 퍼져 있음"],"a":0,"exp":"학교조직 유형은 베버형 구조(②), 권위주의형 구조(③), 전문형 구조(①), 혼돈형 구조(④)이다.","id":"haengjeong-m33"},{"ch":"CH02 조직론","t":"홀","q":"홀(Hall)의 학교조직 유형 중 '권위주의형 구조(관료성↑, 전문성↓)'의 특징으로 옳지 않은 것은?","opts":["실질적 의사결정이 구성원들에게 위임되어 있음","권위는 직위와 위계에 토대를 두고 있음","상급자가 최종 결정을 하며 권력은 집중되어 있음","규칙과 절차가 객관적으로 적용되며 처벌 중심적 관료제와 유사함"],"a":0,"exp":"실질적 의사결정이 구성원에게 위임되어 있는 것은 전문형 구조의 특징이다.","id":"haengjeong-m34"},{"ch":"CH02 조직론","t":"학교조직 유형 종합","q":"(공립)학교조직의 유형을 종합할 때 올바르게 짝지어진 것은?","opts":["유형유지조직 / 사육조직 / 규범조직 / 전문적 관료제","야생조직 / 강제조직 / 기계식 관료제 / 혼돈형","공리조직 / 사육조직 / 기계식 관료제 / 권위주의형","유형유지조직 / 야생조직 / 공리조직 / 전문적 관료제"],"a":0,"exp":"(공립)학교조직의 유형 종합은 유형유지조직, 사육조직, 규범조직, 전문적 관료제이다.","id":"haengjeong-m35"},{"ch":"CH02 조직론","t":"학교조직","q":"학교조직의 관료제가 일반적인 관료제와 구별되는 점으로 옳은 것은?","opts":["구성원인 교사가 고도의 교육을 받은 전문가라는 점에서 일반적 관료제와 구별되며, 교사는 독립적이고 한정된 교실에서 다양한 배경의 학생을 가르치면서 상당한 자유재량권을 행사함","학교조직에는 위계구조가 존재하지 않음","학교조직은 규칙과 규정을 따르지 않음","학교조직은 분업과 전문화가 이루어지지 않음"],"a":0,"exp":"학교조직의 관료제는 구성원인 교사가 고도의 교육을 받은 전문가라는 점에서 구별되며, 교사는 상당한 자유재량권을 행사한다는 점에서 전문조직으로서의 특징을 가진다.","id":"haengjeong-m36"},{"ch":"CH02 조직론","t":"학교조직","q":"학교의 전문조직적 특징으로 옳지 않은 것은?","opts":["경력이 많은 교원이 보수와 승진 등에서 유리함(경력지향성)","교사는 교육에 관한 전문성을 근거로 독립적인 교실에서 상당한 자유재량권을 가지고 학생을 가르침","교사는 학교의 전문적 교육활동에 관한 의사결정에 깊이 참여하기 때문에 어느 정도 분권화된 조직의 특성을 지님","학교에는 교육목표가 있지만 대개 추상적 표현으로 모호하게 되어 있어 직무수행의 통일된 표준을 설정하고 이에 근거해 교사들을 감독하는 것이 어려움"],"a":0,"exp":"경력지향성은 학교의 관료제적 특징이다. 전문조직적 특징에는 '교장의 지시나 통제가 교사의 개별적인 교육활동에 영향을 미치는 데는 한계가 있음'도 포함된다.","id":"haengjeong-m37"},{"ch":"CH02 조직론","t":"조직화된 무질서","q":"조직화된 무질서조직의 특징 중 '불확실한 기술'에 해당하는 설명은?","opts":["교육조직에서는 아주 많은 기술이 활용되지만 그것이 학습자에게 어떠한 영향을 미칠지 불분명하며, 특히 어떤 방법과 자료를 활용해야 학습자로 하여금 요구된 목표에 도달하게 할 수 있는지에 대해 교사와 행정가 등의 합의된 견해가 없음","교육조직의 목표는 구체적이지 않고 불분명하며 수시로 변하고 대립적 목표가 상존함","학생은 입학 후 일정한 기간이 지나면 졸업하고, 교사와 행정가도 정기적으로 이동함","한 부분에서의 성패가 다른 부분과 연결되지 않음"],"a":0,"exp":"조직화된 무질서조직의 특징은 불분명한 목표(②), 불확실한 기술(①), 유동적 참여(③)이다. ④는 이완조직의 특징이다.","id":"haengjeong-m38"},{"ch":"CH02 조직론","t":"쓰레기통 모형","q":"조직화된 무질서조직에서 의사결정이 일어나는 형태로 옳은 것은?","opts":["쓰레기통 모형 — 조직화된 무정부조직 상태에서 '문제, 해결책, 선택기회 및 참여자'라는 4요소가 독자적으로 움직이다가 어떤 우연한 사건을 계기로 교차하여 결합하게 될 때 결정이 이루어진다고 봄","합리모형 — 모든 대안을 포괄적으로 탐색·평가하여 가장 합리적인 대안을 선택","점증모형 — 이전의 상태보다 다소 향상된 대안을 추구","만족모형 — 만족할 만한 대안을 선택"],"a":0,"exp":"조직화된 무질서조직의 의사결정모형은 쓰레기통 모형이다.","id":"haengjeong-m39"},{"ch":"CH02 조직론","t":"이완조직","q":"이완조직의 개념과 학교의 이완조직으로서의 특징으로 옳은 것은?","opts":["느슨하게 결합된 조직으로 서로 연결되어 있으나 각자 분리·독립되어 정체성을 보존하는 하부단위들의 연결체이며, 각 하부단위들이 독립되어 있기 때문에 한 부분에서의 성패가 다른 부분과 연결되지 않음","엄격한 관료제적 특성만을 지닌 조직이며 위계가 명확함","공식조직 내에 자연발생적으로 생기는 조직이며 소집단을 유지함","조직과 고객이 독자적 선택권을 갖는 조직이며 경쟁이 필수적임"],"a":0,"exp":"이완조직은 느슨하게 결합된 조직으로, 한 과목의 성패가 다른 과목과 연결되지 않으며, 교육목표와 평가방법이 모호하여 교사에 대한 감독과 평가가 제한적이고, 교사는 전문직으로서 상당한 자율권을 가진다.","id":"haengjeong-m40"},{"ch":"CH02 조직론","t":"이중조직","q":"이중조직의 개념과 이중조직으로서의 학교의 특징으로 옳은 것은?","opts":["느슨하게 결합된 측면도 있지만 엄격한 관료제적 특성 또한 지니고 있으며, 학교장과 교사는 매우 느슨한 결합구조를 가지고 있어 수업과 관련해 교사는 상당한 자율권을 행사하는 반면(이완조직), 수업행동에 미치는 많은 관료제적 장치와 수업을 제외한 많은 학교경영활동은 엄격한 결합구조를 가짐(관료제적 특성)","완전히 느슨하게 결합된 조직이며 관료제적 특성이 전혀 없음","완전히 엄격한 관료제 조직이며 자율성이 전혀 없음","조직과 고객이 모두 선택권을 갖지 못하는 조직"],"a":0,"exp":"이중조직은 이완조직과 관료제적 특성을 함께 지닌다. 시사점은 지나친 독립성 보장은 생산성과 효율성을 떨어뜨리고 엄격한 경직성도 교사 사기를 떨어뜨리므로, 교육행정가는 양자의 순기능을 확보할 수 있는 능력을 갖추어야 한다는 것이다.","id":"haengjeong-m41"},{"ch":"CH02 조직론","t":"전문적 학습공동체","q":"전문적 학습공동체의 특징 중 '협력적 학습 및 적용'과 그 순기능으로 옳은 것은?","opts":["공동연구를 통해 실천하며 집단성장을 도모함 ⇒ 공동체의식을 높이고 교사공동체를 통해 교사 지도성을 함양시킬 수 있음","동료교사들과 교육활동에 관한 일상적인 대화를 통해 자신의 교수·학습 실제에 대해 성찰하는 기회를 가짐 ⇒ 교사의 전문성을 신장시킴","구성원 모두가 조직의 방향과 목적에 대한 비전과 가치의 공감대를 형성함 ⇒ 협력적인 문화로 개선될 수 있음","개인이 추구하는 지식, 기술, 태도를 형성하기 위하여 개인적 역량을 지속적으로 넓혀감"],"a":0,"exp":"전문적 학습공동체의 특징은 개인적 경험의 공유 및 반성적 대화(②), 협력적 학습 및 적용(①), 비전과 가치의 공유(③)이다. ④는 학습조직의 '개인적 숙련'이다.","id":"haengjeong-m42"},{"ch":"CH02 조직론","t":"학습조직","q":"학습조직의 기본원리 중 '시스템적 사고'에 해당하는 설명은?","opts":["조직에서 일어나는 여러 가지 사건들을 전체적으로 인지하고 이에 포함된 요소들 간의 관계를 순환적 인과관계 또는 역동적 관계로 이해하고 사고하는 접근방식","개인이 추구하는 지식, 기술, 태도를 형성하기 위하여 개인적 역량을 지속적으로 넓혀가고 심화시키는 행위","주변에서 발생하는 현상들을 이해하는 인식체계로, 개인이 무엇을 어떻게 보는지를 결정하고 어떻게 행동할지를 이끄는 인식의 틀","조직이 추구하는 방향이 무엇이며 그것이 왜 중요한지에 대해 모든 구성원들이 공감대를 형성하는 것"],"a":0,"exp":"학습조직의 기본원리는 개인적 숙련(②), 정신모델(③), 팀학습, 시스템적 사고(①), 공유된 비전(④)이다.","id":"haengjeong-m43"},{"ch":"CH02 조직론","t":"학습조직","q":"학습조직의 기본원리 중 '팀학습'에 해당하는 설명은?","opts":["구성원이 팀을 이루어 학습하는 것으로, 개인수준 학습을 증진시키고 조직학습을 유도하는 것","개인적 역량을 지속적으로 넓혀가고 심화시키는 행위","현상들을 이해하는 인식체계","조직이 추구하는 방향에 대해 공감대를 형성하는 것"],"a":0,"exp":"팀학습은 구성원이 팀을 이루어 학습하는 것으로 개인수준 학습을 증진시키고 조직학습을 유도한다.","id":"haengjeong-m44"},{"ch":"CH02 조직론","t":"리커트 관리체제","q":"리커트(Likert)의 관리체제 유형에서 조직풍토를 구분하는 기준과 이 이론의 시사점으로 옳은 것은?","opts":["기준: 지도자와 구성원 간의 관계 / 시사점: 조직풍토와 조직의 성과는 밀접한 관계를 가지기 때문에 조직의 변화를 위해서는 조직풍토를 조절하는 경영과정이 중요함을 시사함","기준: 학교에서의 학생 통제방식 / 시사점: 학생을 엄격히 통제해야 성과가 오름을 시사함","기준: 도구적 차원과 표현적 차원 / 시사점: 표현적 차원을 강화해야 함을 시사함","기준: 인간에 대한 관심과 성과에 대한 관심 / 시사점: 성과에 대한 관심을 높여야 함을 시사함"],"a":0,"exp":"리커트의 조직풍토 구분 기준은 지도자와 구성원 간의 관계이다. 시사점은 조직풍토와 조직의 성과는 밀접한 관계를 가지기 때문에 조직의 변화를 위해서는 조직풍토를 조절하는 경영과정이 중요함을 시사한다는 것이다.","id":"haengjeong-m45"},{"ch":"CH02 조직론","t":"리커트 체제1","q":"리커트(Likert)의 관리체제 유형 중 체제1 유형의 명칭과 특징으로 옳은 것은?","opts":["이기적(착취적)-권위주의적 풍토 / 관리자는 구성원에 대해 맥그리거의 X이론을 가정함. 지도자와 구성원 간의 상호신뢰가 적어 서로 지지하지 않는 체제임. 과업지향적, 고도로 구조화된 권위적 관리유형임. 구성원들은 공포, 처벌이나 제약에 의해 동기화됨. 통제구조는 최고관리층에 집중됨. 의사결정은 일방적ㆍ하향적으로 이루어짐","참여적 풍토 / 관리자는 맥그리거의 Y이론을 가정함. 팀워크, 상호신뢰, 상호작용에 기반을 둔 가장 이상적인 학교풍토임","자비적 권위주의 풍토 / 관리자가 구성원을 온전히 신뢰하며 의사결정을 광범위하게 분담함","협의적 풍토 / 지지적 지도성과 원활한 의사소통, 높은 성취목표를 특징으로 함"],"a":0,"exp":"체제1 유형은 이기적(착취적)-권위주의적 풍토로, 관리자는 구성원에 대해 맥그리거의 X이론을 가정하고 지도자와 구성원 간 상호신뢰가 적어 서로 지지하지 않는다. 과업지향적ㆍ고도로 구조화된 권위적 관리유형이며, 구성원들은 공포, 처벌이나 제약에 의해 동기화되고 통제구조는 최고관리층에 집중되며 의사결정은 일방적ㆍ하향적으로 이루어진다.","id":"haengjeong-m46"},{"ch":"CH02 조직론","t":"리커트 체제4","q":"리커트(Likert)의 관리체제 유형 중 체제4 유형의 명칭과 특징으로 옳은 것은?","opts":["참여적 풍토 / 관리자는 맥그리거의 Y이론을 가정함. 팀워크, 상호신뢰, 상호작용에 기반을 둔 가장 이상적인 학교풍토임. 관리자가 구성원을 온전히 신뢰하며 관계는 광범위하고 우호적임. 의사결정의 주체는 광범위하게 분담되어 있고 의사소통은 상하좌우로 원활하게 이루어짐. 지지적 지도성, 고도로 동기화된 구성원, 의사결정의 분담, 원활한 의사소통, 원만한 인간관계, 높은 성취목표 등을 특징으로 함","이기적(착취적)-권위주의적 풍토 / 구성원들은 공포, 처벌이나 제약에 의해 동기화됨","통제적 풍토 / 과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 함","폐쇄풍토 / 학교장은 일상적이거나 불필요한 잡무만을 강조하는 비효과적인 리더십을 나타냄"],"a":0,"exp":"체제4 유형은 참여적 풍토로, 관리자는 맥그리거의 Y이론을 가정하며 팀워크ㆍ상호신뢰ㆍ상호작용에 기반을 둔 가장 이상적인 학교풍토이다. 관리자가 구성원을 온전히 신뢰하고 관계는 광범위하고 우호적이며, 의사결정의 주체가 광범위하게 분담되고 의사소통은 상하좌우로 원활하다. 교사들은 높은 성취목표, 많은 협동심, 공동협력과 배분, 높은 합리성, 호의적인 태도, 높은 성취동기를 보인다.","id":"haengjeong-m47"},{"ch":"CH02 조직론","t":"할핀·크로프트 개방적 풍토","q":"할핀(Halpin)과 크로프트(Croft)의 관점에서 개방적 풍토의 개념으로 옳은 것은?","opts":["목표를 향해 움직이고 학교구성원의 사회적 욕구를 충족시키는 활력 있는 풍토","과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 하는 풍토","교장과 교사들 간 우호적인 태도가 형성되고 사회적 욕구는 잘 충족되지만 조직의 목적달성을 위한 집단활동이 부족한 풍토","교사가 학교장을 무시하거나 최악의 경우 태업하거나 무력화하려 하는 풍토"],"a":0,"exp":"개방적 풍토는 목표를 향해 움직이고 학교구성원의 사회적 욕구를 충족시키는 활력 있는 풍토이다.","id":"haengjeong-m48"},{"ch":"CH02 조직론","t":"할핀·크로프트 통제적 풍토","q":"할핀(Halpin)과 크로프트(Croft)의 관점에서 통제적 풍토의 개념으로 옳은 것은?","opts":["과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 하는 풍토","목표를 향해 움직이고 학교구성원의 사회적 욕구를 충족시키는 활력 있는 풍토","교장과 교사들 간 우호적인 태도가 형성되고 사회적 욕구는 잘 충족되지만 조직의 목적달성을 위한 집단활동이 부족한 풍토","학교장은 개방적이고 관심이 많으며 지원적인 반면 교사는 헌신적이지 않은 풍토"],"a":0,"exp":"통제적 풍토는 과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 하는 풍토이다.","id":"haengjeong-m49"},{"ch":"CH02 조직론","t":"할핀·크로프트 친교적 풍토","q":"할핀(Halpin)과 크로프트(Croft)의 관점에서 친교적 풍토의 개념으로 옳은 것은?","opts":["교장과 교사들 간 우호적인 태도가 형성되고 사회적 욕구는 잘 충족되지만 조직의 목적달성을 위한 집단활동이 부족한 풍토","과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 하는 풍토","목표를 향해 움직이고 학교구성원의 사회적 욕구를 충족시키는 활력 있는 풍토","교사 간에도 불화하고 편협하며 헌신적이지 않은 풍토"],"a":0,"exp":"친교적 풍토는 교장과 교사들 간 우호적인 태도가 형성되고 사회적 욕구는 잘 충족되지만, 조직의 목적달성을 위한 집단활동이 부족한 풍토이다.","id":"haengjeong-m50"},{"ch":"CH02 조직론","t":"호이·미스켈 교사행동특성","q":"호이(Hoy)와 미스켈(Miskel)이 측정한 교사행동특성 3가지로 옳은 것은?","opts":["단체적(동료적): 교사 간에 이루어지는 지시적이고 전문적인 상호작용의 정도 / 친밀한: 학교 안팎에서 교사 간에 형성된 긴밀한 개인적 관계 정도 / 일탈적: 교사 간에 조성된 소외와 격리 정도","지원적: 교사에게 진실한 관심을 보이고 지원하는 정도 / 지시적: 엄격한 과업지향 / 제한적: 교사업무 수행 시 장애를 주는 정도","개방풍토 / 몰입풍토 / 일탈풍토","인간에 대한 관심 / 성과에 대한 관심 / 조직에 대한 관심"],"a":0,"exp":"교사행동특성은 단체적(동료적)-교사 간에 이루어지는 지시적이고 전문적인 상호작용의 정도, 친밀한-학교 안팎에서 교사 간에 형성된 긴밀한 개인적 관계 정도, 일탈적-교사 간에 조성된 소외와 격리 정도이다.","id":"haengjeong-m51"},{"ch":"CH02 조직론","t":"호이·미스켈 교장행동특성","q":"호이(Hoy)와 미스켈(Miskel)이 측정한 교장행동특성 3가지로 옳은 것은?","opts":["지원적: 교사에게 진실한 관심을 보이고 지원하는 정도 / 지시적: 교사의 개인적 욕구에 전혀 관심을 두지 않는 엄격한 과업지향 / 제한적: 교사업무를 수행할 때 장애를 주는 정도","단체적(동료적) / 친밀한 / 일탈적","개방적 / 통제적 / 친교적","도구적 / 표현적 / 통합적"],"a":0,"exp":"교장행동특성은 지원적-교사에게 진실한 관심을 보이고 지원하는 정도, 지시적-교사의 개인적 욕구에 전혀 관심을 두지 않는 엄격한 과업지향, 제한적-교사업무를 수행할 때 장애를 주는 정도이다.","id":"haengjeong-m52"},{"ch":"CH02 조직론","t":"학교풍토 개방풍토","q":"호이(Hoy)와 미스켈(Miskel)의 학교풍토 유형 중 개방풍토의 특징으로 옳은 것은?","opts":["교직원 간, 교직원과 학교장 간의 협동, 존경, 신뢰를 바탕으로 학교장은 교사의 제안을 경청하고 전문성을 존중하며, 교사는 일에 대하여 헌신적인 풍토","한쪽에서는 학교장의 통제가 비효과적으로 시도되고, 다른 한쪽에서는 교사의 높은 전문적 업무수행이 이루어지는 풍토","학교장은 개방적이고 관심이 많으며 지원적인 반면, 교사는 학교장을 무시하거나 최악의 경우 태업하거나 무력화하려 하는 풍토","학교장은 일상적이거나 불필요한 잡무만을 강조하는 비효과적인 리더십을 엄격하고 통제적으로 나타내는 풍토"],"a":0,"exp":"개방풍토는 교직원 간, 교직원과 학교장 간의 협동,  교사를 이용하는 일종의 기계 ⇒ 기계적 통제","학교는 밀폐된 상자 또는 형무소 ⇒ 고립적 통제"],"a":0,"exp":"인간주의적 학교에서 학교는 학생이 협동적 상호작용과 경험을 통해 배우는 교육공동체이며, 학생지도방식은 엄격한 교사의 통제보다는 스스로의 자제가 중요한 민주적 통제방식이다.","id":"haengjeong-m58"},{"ch":"CH02 조직론","t":"윌로어 보호지향적 학교","q":"윌로어(Willower)의 보호지향적 학교에서 규정하는 학교의 개념과 학생지도방식으로 옳은 것은?","opts":["학교는 학생과 교사의 지위체계가 잘 정비된 권위적인 조직 ⇒ 학생은 무책임하고 훈련되지 않은 존재이므로 엄격한 규율과 체벌로 통제함","학교는 학생이 협동적 상호작용과 경험을 통해 배우는 교육공동체 ⇒ 민주적 통제방식","학교는 애정 어리고 우정적ㆍ협동적ㆍ보호적인 가족 ⇒ 가족적 통제","학교는 청중의 반응이 중요한 공연장 ⇒ 지도자 중심 통제"],"a":0,"exp":"보호지향적 학교에서 학교는 학생과 교사의 지위체계가 잘 정비된 권위적인 조직이며, 학생은 무책임하고 훈련되지 않은 존재이므로 엄격한 규율과 체벌로 통제한다.","id":"haengjeong-m59"},{"ch":"CH02 조직론","t":"맥그리거 X이론","q":"맥그리거(McGregor)의 X이론에 따른 인간에 대한 가정과 경영의 초점으로 옳은 것은?","opts":["인간은 일하기 싫어하고 지시받기 좋아하며, 책임을 회피하려 하고, 야망이 없고 안전을 원함. 적극적 개입이 없으면 조직의 필요에 대하여 저항하거나 수동적이 됨 / 경영의 초점: 외적 통제","인간은 본질적으로 수동적이거나 게으르지 않고 무책임하지 않음 / 경영의 초점: 자율적 통제와 자기지향","인간은 결핍욕구가 충족되어야 성장욕구가 발현됨 / 경영의 초점: 욕구 단계별 충족","인간은 소모품으로 간주됨 / 경영의 초점: 성과 중심 보상"],"a":0,"exp":"X이론은 인간은 일하기 싫어하고 지시받기 좋아하며 책임을 회피하려 하고 야망이 없고 안전을 원하며, 적극적 개입이 없으면 조직의 필요에 대하여 저항하거나 수동적이 된다고 가정한다. 경영의 초점은 외적 통제이다.","id":"haengjeong-m60"},{"ch":"CH02 조직론","t":"맥그리거 Y이론","q":"맥그리거(McGregor)의 Y이론에 따른 인간에 대한 가정과 경영의 초점으로 옳은 것은?","opts":["인간은 본질적으로 수동적이거나 게으르지 않고, 무책임하지 않으며, 조직의 필요에 저항하지도 않음. 인간은 일에 대한 동기와 잠재력, 책임감, 목표성취 의지 등을 가짐 / 경영의 초점: 자율적 통제와 자기지향","인간은 일하기 싫어하고 지시받기 좋아하며 책임을 회피하려 함 / 경영의 초점: 외적 통제","인간은 미성숙한 존재이므로 관료적 가치체계로 관리해야 함 / 경영의 초점: 규율","인간은 보상의 유인가에 따라 움직임 / 경영의 초점: 기대 관리"],"a":0,"exp":"Y이론은 인간은 본질적으로 수동적이거나 게으르지 않고 무책임하지 않으며 조직의 필요에 저항하지도 않고, 일에 대한 동기와 잠재력, 책임감, 목표성취 의지 등을 가진다고 가정한다. 경영의 초점은 자율적 통제와 자기지향이다.","id":"haengjeong-m61"},{"ch":"CH02 조직론","t":"아지리스 미성숙조직","q":"아지리스(Argyris)의 이론에서 미성숙한 조직의 특성으로 옳은 것은?","opts":["X이론에 근거하면서 관료적 가치체계를 따르는 조직 / 인간을 부정적이고 미성숙한 존재로 여겨 의심 많은 인간관계가 형성되어 대인관계 능력을 저하시키고 집단 간 갈등을 야기함 / 조직의 문제해결력이 저하됨","Y이론에 근거하면서 인간적 가치체제를 따르는 조직 / 신뢰하는 인간관계를 형성함 / 조직의 효과성이 증대됨","고객의 참여결정권과 조직의 고객선택권이 모두 없는 조직","목표가 모호하고 기술이 불명확하며 유동적 참여가 나타나는 조직"],"a":0,"exp":"미성숙조직은 X이론에 근거하면서 관료적 가치체계를 따르는 조직으로, 인간을 부정적이고 미성숙한 존재로 여겨 의심 많은 인간관계가 형성되어 대인관계 능력을 저하시키고 집단 간 갈등을 야기하며, 조직의 문제해결력이 저하된다.","id":"haengjeong-m62"},{"ch":"CH02 조직론","t":"아지리스 성숙조직","q":"아지리스(Argyris)의 이론에서 성숙한 조직의 특성과 이 이론의 시사점으로 옳은 것은?","opts":["Y이론에 근거하면서 인간적 가치체제를 따르는 조직으로 인간을 긍정적이고 성숙한 존재로 여겨 신뢰하는 인간관계를 형성하고 집단 간 협동 및 융통성을 향상시키며 조직의 효과성이 증대됨 / 시사점: 조직관리자는 구성원을 성숙한 인간으로 대하고 성숙한 문화풍토를 조성하도록 해야 함","X이론에 근거한 관료적 가치체계를 따르는 조직 / 시사점: 통제를 강화해야 함","성과에 대한 관심이 높은 조직 / 시사점: 경쟁을 강화해야 함","도구적 차원과 표현적 차원이 모두 높은 조직 / 시사점: 감시를 강화해야 함"],"a":0,"exp":"성숙조직은 Y이론에 근거하면서 인간적 가치체제를 따르는 조직으로, 인간을 긍정적이고 성숙한 존재로 여겨 신뢰하는 인간관계를 형성하고 집단 간 협동 및 융통성을 향상시키며 조직의 효과성이 증대된다. 시사점은 조직관리자가 구성원을 성숙한 인간으로 대하고 성숙한 문화풍토를 조성해야 한다는 것으로, 구성원에게 자율성을 부여하고 신뢰하며 직장 내에서 전문성을 기르고 성숙하는 기회를 제공할 때 구성원의 자아실현욕구가 충족되고 조직의 목표도 달성할 수 있다.","id":"haengjeong-m63"},{"ch":"CH02 조직론","t":"세시아·글리노우 기준","q":"세시아(Sethia)와 글리노우(Glinow)가 조직문화를 구분하는 기준 2가지로 옳은 것은?","opts":["인간에 대한 관심(조직이 구성원의 만족과 복지를 위해 노력하는 것), 성과에 대한 관심(구성원이 최선을 다해 직무를 수행하도록 하려는 조직의 기대)","도구적 차원(사회적 통제), 표현적 차원(사회적 응집)","협조성(협동성), 독단성(적극성)","고객의 참여결정권, 조직의 고객선택권"],"a":0,"exp":"세시아와 글리노우의 조직문화 구분기준은 ① 인간에 대한 관심(조직이 구성원의 만족과 복지를 위해 노력하는 것), ② 성과에 대한 관심(구성원이 최선을 다해 직무를 수행하도록 하려는 조직의 기대)이다.","id":"haengjeong-m64"},{"ch":"CH02 조직론","t":"세시아·글리노우 보호문화","q":"세시아(Sethia)와 글리노우(Glinow)의 조직문화 유형 중 보호문화의 특징과 주요가치로 옳은 것은?","opts":["구성원이 조직관리자에게 순응할 준비가 되어 있음. 구성원의 충성심과 애정으로 생존ㆍ번창함 ⇒ 주요가치: 팀워크, 협동, 동조, 상사에 대한 복종 등","특별한 상황과 환경에 의해 보호를 받지 못하면 생존할 수 없음 ⇒ 주요가치: 음모, 파당, 분열 등","인간은 소모품으로 간주됨 ⇒ 주요가치: 성공, 경쟁, 모험 등","인간의 존엄성을 바탕으로 한 진지한 관심 ⇒ 주요가치: 협동, 창의성, 모험, 자율 등"],"a":0,"exp":"보호문화는 구성원이 조직관리자에게 순응할 준비가 되어 있고 구성원의 충성심과 애정으로 생존ㆍ번창하는 문화이며, 주요가치는 팀워크, 협동, 동조, 상사에 대한 복종 등이다.","id":"haengjeong-m65"},{"ch":"CH02 조직론","t":"세시아·글리노우 냉담문화","q":"세시아(Sethia)와 글리노우(Glinow)의 조직문화 유형 중 냉담문화의 특징과 주요가치로 옳은 것은?","opts":["특별한 상황과 환경에 의해 보호를 받지 못하면 생존할 수 없음. 효과성과 능률성에 대한 관심보다 기득권과 이해관계에 의해 운영됨 ⇒ 주요가치: 음모, 파당, 분열, 불신, 불확실 혼란 등","구성원의 충성심과 애정으로 생존ㆍ번창함 ⇒ 주요가치: 팀워크, 협동, 동조 등","개인의 성과가 높을 때만 보상을 제공함 ⇒ 주요가치: 성공, 경쟁, 모험 "haengjeong-m70"},{"ch":"CH02 조직론","t":"스타인호프·오웬스 공연문화","q":"스타인호프(Steinhoff)와 오웬스(Owens)의 학교문화유형 중 공연문화의 특징으로 옳은 것은?","opts":["공연뿐만 아니라 청중의 반응이 중요함. 교장의 훌륭한 지도 아래 탁월하고 멋진 가르침을 추구하는 문화","학교의 원동력은 조직 자체의 구조에서 나옴","구성원은 가족의 일부로서 제 몫을 다할 것을 요구받음","교사는 고립된 생활을 하고 사회적 활동이 거의 없음"],"a":0,"exp":"공연문화는 공연뿐만 아니라 청중의 반응이 중요하며, 교장의 훌륭한 지도 아래 탁월하고 멋진 가르침을 추구하는 문화이다.","id":"haengjeong-m71"},{"ch":"CH02 조직론","t":"스타인호프·오웬스 공포문화","q":"스타인호프(Steinhoff)와 오웬스(Owens)의 학교문화유형 중 공포문화의 특징으로 옳은 것은?","opts":["학교를 밀폐된 상자 또는 형무소라고 표현함. 교사는 고립된 생활을 하고 사회적 활동이 거의 없으며, 구성원끼리 서로 비난하고 적의를 가짐","학교는 애정 어리고 우정적ㆍ협동적ㆍ보호적임","청중의 반응이 중요하며 탁월한 가르침을 추구함","학교는 목표달성을 위해 교사를 이용하는 일종의 기계임"],"a":0,"exp":"공포문화는 학교를 밀폐된 상자 또는 형무소라고 표현하며, 교사는 고립된 생활을 하고 사회적 활동이 거의 없으며 구성원끼리 서로 비난하고 적의를 가진다.","id":"haengjeong-m72"},{"ch":"CH02 조직론","t":"하그리브스 차원","q":"하그리브스(Hargreaves)의 학교문화유형론에서 학교문화를 구분하는 차원 2가지로 옳은 것은?","opts":["도구적 차원(사회적 통제), 표현적 차원(사회적 응집)","인간에 대한 관심, 성과에 대한 관심","협조성, 독단성","과업지향성, 관계지향성"],"a":0,"exp":"하그리브스가 학교문화를 구분하는 차원은 도구적 차원(사회적 통제)과 표현적 차원(사회적 응집)이다.","id":"haengjeong-m73"},{"ch":"CH02 조직론","t":"하그리브스 형식적 학교문화","q":"하그리브스(Hargreaves)의 형식적 학교문화(도구적 차원↑, 표현적 차원↓)의 특징으로 옳은 것은?","opts":["학생이 학습목표를 달성하도록 과도한 압력을 가하지만, 교사와 학생 간 응집력이 약함. 학교생활은 교수ㆍ학습과 관련하여 질서화ㆍ계획화되어 있는 모습","관대, 태평, 편안한 분위기로 비형식적이고 친구 같은 교사-학생 관계 강조","학교구성원의 적극적 참여를 요구하며, 일과 자기계발에 대한 압력이 강함","불안, 낙망, 사기저하 등이 나타나며 교사-학생 간 관계가 친밀하지 않음"],"a":0,"exp":"형식적 학교문화(도구적 차원↑, 표현적 차원↓)는 학생이 학습목표를 달성하도록 과도한 압력을 가하지만 교사와 학생 간 응집력이 약하며, 학교생활은 교수ㆍ학습과 관련하여 질서화ㆍ계획화되어 있는 모습이다.","id":"haengjeong-m74"},{"ch":"CH02 조직론","t":"하그리브스 복지주의자 학교문화","q":"하그리브스(Hargreaves)의 복지주의자 학교문화(도구적 차원↓, 표현적 차원↑)의 특징으로 옳은 것은?","opts":["관대, 태평, 편안한 분위기로 비형식적이고 친구 같은 교사-학생 관계 강조. 강한 보살핌이 중시되는 학교가 이런 유형에 해당함","학생이 학습목표를 달성하도록 과도한 압력을 가하지만 응집력이 약함","일과 자기계발에 대한 압력이 강하며 구성원은 감시와 통제하에 있음","불안, 낙망, 사기저하 등이 나타나 학교가 붕괴의 처지에 놓임"],"a":0,"exp":"복지주의자 학교문화(도구적 차원↓, 표현적 차원↑)는 관대, 태평, 편안한 분위기로 비형식적이고 친구 같은 교사-학생 관계를 강조하며, 강한 보살핌이 중시되는 학교가 이런 유형에 해당한다.","id":"haengjeong-m75"},{"ch":"CH02 조직론","t":"하그리브스 온실 학교문화","q":"하그리브스(Hargreaves)의 온실 학교문화(도구적 차원↑, 표현적 차원↑)의 특징으로 옳은 것은?","opts":["학교구성원의 적극적 참여를 요구하며, 일과 자기계발에 대한 압력이 강함. 교사들은 교육의 실험자 또는 개혁자로서 정열적이고 헌신적임. 학교 내 친밀함의 확산 속에서 구성원은 감시와 통제하에 있음","관대, 태평, 편안한 분위기로 친구 같은 교사-학생 관계를 강조함","교사와 학생 간 응집력이 약하고 질서화ㆍ계획화되어 있음","구성원의 일과 행동에 대한 기대가 높으며 학교는 지원적임"],"a":0,"exp":"온실 학교문화(도구적 차원↑, 표현적 차원↑)는 학교구성원의 적극적 참여를 요구하며 일과 자기계발에 대한 압력이 강하다. 교사들은 교육의 실험자 또는 개혁자로서 정열적이고 헌신적이며, 학교 내 친밀함의 확산 속에서 구성원은 감시와 통제하에 있다.","id":"haengjeong-m76"},{"ch":"CH02 조직론","t":"하그리브스 생존주의자 학교문화","q":"하그리브스(Hargreaves)의 생존주의자 학교문화(도구적 차원↓, 표현적 차원↓)의 특징으로 옳은 것은?","opts":["불안, 낙망, 사기저하 등이 나타나며, 교사-학생 간의 관계가 친밀하지 않고 제대로 된 교육이 이루어지지 않음. 이러한 유형의 학교는 붕괴의 처지에 놓이게 됨","일과 자기계발에 대한 압력이 강하고 교사들이 정열적임","강한 보살핌이 중시되고 친구 같은 관계가 강조됨","가장 이상적인 모습으로 묘사되는 학교유형"],"a":0,"exp":"생존주의자 학교문화(도구적 차원↓, 표현적 차원↓)는 불안, 낙망, 사기저하 등이 나타나며 교사-학생 간의 관계가 친밀하지 않고 제대로 된 교육이 이루어지지 않아 학교가 붕괴의 처지에 놓이게 된다.","id":"haengjeong-m77"},{"ch":"CH02 조직론","t":"하그리브스 효과적 학교문화","q":"하그리브스(Hargreaves)의 효과적 학교문화(도구적ㆍ표현적 차원 적절함)의 특징으로 옳은 것은?","opts":["구성원의 일과 행동에 대한 기대가 높으며, 이들의 노력에 대하여 학교는 지원적임. 가장 이상적인 모습으로 묘사되는 학교유형","불안, 낙망, 사기저하 등이 나타나 붕괴의 처지에 놓임","구성원이 감시와 통제하에 있으며 자기계발 압력이 강함","교사와 학생 간 응집력이 약하고 과도한 학습압력이 있음"],"a":0,"exp":"효과적 학교문화(도구적ㆍ표현적 차원 적절함)는 구성원의 일과 행동에 대한 기대가 높으며 이들의 노력에 대하여 학교는 지원적인, 가장 이상적인 모습으로 묘사되는 학교유형이다.","id":"haengjeong-m78"},{"ch":"CH02 조직론","t":"순기능적 갈등","q":"순기능적 갈등이 조직에 미치는 영향으로 옳지 않은 것은?","opts":["조직구성원의 협력적 노력을 좌절시키고 사기를 떨어뜨리며 낭비를 초래함","조직의 생존과 성공에 필요한 쇄신적 변동을 유발하는 원동력이 됨","적정수준 자극 제공으로 조직이 자원배분 등을 자율적으로 조정함","행동주체의 정체성 인식을 돕고 자기반성의 기회를 제공함"],"a":0,"exp":"조직구성원의 협력적 노력을 좌절시키고 사기를 떨어뜨리며 낭비를 초래하는 것은 역기능적 갈등의 영향이다. 순기능적 갈등은 조직의 생존과 성공에 필요한 쇄신적 변동을 유발하는 원동력이 되고, 적정수준 자극 제공으로 조직이 자원배분 등을 자율적으로 조정하게 하며, 행동주체의 정체성 인식을 돕고 자기반성의 기회를 제공하고, 행동주체가 정체된 사고방식에서 벗어나 능동적으로 행동하고 성장할 수 있는 기회를 제공하며, 창조와 성장, 민주주의의 다양성, 자기실현 등을 반영한다.","id":"haengjeong-m79"},{"ch":"CH02 조직론","t":"역기능적 갈등","q":"역기능적 갈등이 조직에 미치는 영향 2가지로 옳은 것은?","opts":["조직구성원의 협력적 노력을 좌절시킴 / 조직구성원의 사기를 떨어뜨리고 낭비를 초래하며, 갈등이 심해지는 경우 조직이 와해될 수도 있음","쇄신적 변동을 유발하는 원동력이 됨 / 자기반성의 기회를 제공함","자원배분 등을 자율적으로 조정하게 함 / 정체성 인식을 도움","창조와 성장을 반영함 / 능동적 행동의 기회를 제공함"],"a":0,"exp":"역기능적 갈등은 ① 조직구성원의 협력적 노력을 좌절시키고, ② 조직구성원의 사기를 떨어뜨리고 낭비를 초래하며, ③ 이러한 갈등이 심해지는 경우 조직이 와해될 수도 있다.","id":"haengjeong-m80"},{"ch":"CH02 조직론","t":"토마스·제미슨 분류기준","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 분류기준 2가지의 명칭과 개념으로 옳은 것은?","opts":["협조성(협동성): 한쪽 당사자가 타인의 욕구(이익)를 충족시키려는 정도 / 독단성(적극성): 자신의 욕구(이익)를 충족시키려는 정도","과업지향성: 과업 달성을 중시하는 정도 / 관계지향성: 인간관계를 중시하는 정도","도구적 차원: 사회적 통제 / 표현적 차원: 사회적 응집","인간에 대한 관심: 구성원 복지 / 성과에 대한 관심: 직무수행 기대"],"a":0,"exp":"토마스와 제미슨의 갈등관리전략 분류기준은 ① 협조성(협동성)-한쪽 당사자가 타인의 욕구(이익)를 충족시키려는 정도, ② 독단성(적극성)-자신의 욕구(이익)를 충족시키려는 정도이다.","id":"haengjeong-m81"},{"ch":"CH02 조직론","t":"갈등관리전략 협력","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 중 '협력'이 효과적인 상황 2가지로 옳은 것은?","opts":["목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우","신속한 결정이 필요한 긴급상황 / 조직의 성장에 매우 중요한 문제인 경우","자기가 잘못한 것을 알아차린 경우 / 좋은 관계를 유지해야 하는 경우","복잡한 문제에 대하여 일시적인 해결책을 얻고자 하는 경우 / 시간이 부족한 경우"],"a":0,"exp":"협력 전략은 목표가 학습하는 것일 경우, 합의와 헌신이 중요한 경우에 효과적이다.","id":"haengjeong-m82"},{"ch":"CH02 조직론","t":"갈등관리전략 경쟁","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 중 '경쟁'이 효과적인 상황 2가지로 옳은 것은?","opts":["신속한 결정이 필요한 긴급상황 / 조직의 성장에 매우 중요한 문제인 경우","목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우","다른 사람의 관심을 이해할 시간적 여유가 없는 경우 / 다른 문제가 해결되면 자연스럽게 해결될 수 있는 경우","자기가 잘못한 것을 알아차린 경우 / 보다 중요한 문제를 위하여 좋은 관계를 유지해야 하는 경우"],"a":0,"exp":"경쟁 전략은 신속한 결정이 필요한 긴급상황, 조직의 성장에 매우 중요한 문제인 경우에 효과적이다.","id":"haengjeong-m83"},{"ch":"CH02 조직론","t":"갈등관리전략 회피","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 중 '회피'가 효과적인 상황 2가지로 옳은 것은?","opts":["다른 사람의 관심을 이해할 시간적 여유가 없는 경우 / 다른 문제가 해결되면 해당 문제가 자연스럽게 해결될 수 있는 경우","신속한 결정이 필요한 긴급상황 / 조직의 성장에 매우 중요한 문제인 경우","목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우","복잡한 문제에 대하여 일시적인 해결책을 얻고자 하는 경우 / 시간이 부족하여 신속한 행동이 요구되는 경우"],"a":0,"exp":"회피 전략은 다른 사람의 관심을 이해할 시간적 여유가 없는 경우, 다른 문제가 해결되면 해당 문제가 자연스럽게 해결될 수 있는 경우에 효과적이다.","id":"haengjeong-m84"},{"ch":"CH02 조직론","t":"갈등관리전략 수용","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 중 '수용(동조)'이 효과적인 상황 2가지로 옳은 것은?","opts":["자기가 잘못한 것을 알아차린 경우 / 보다 중요한 문제를 위하여 좋은 관계를 유지해야 하는 경우","신속한 결정이 필요한 긴급상황 / 조직의 성장에 매우 중요한 문제인 경우","목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우","다른 사람의 관심을 이해할 시간적 여유가 없는 경우 / 다른 문제가 해결되면 자연스럽게 해결될 수 있는 경우"],"a":0,"exp":"수용(동조) 전략은 자기가 잘못한 것을 알아차린 경우, 보다 중요한 문제를 위하여 좋은 관계를 유지해야 하는 경우에 효과적이다.","id":"haengjeong-m85"},{"ch":"CH02 조직론","t":"갈등관리전략 타협","q":"토마스(Thomas)와 제미슨(Jamieson)의 갈등관리전략 중 '타협'이 효과적인 상황 2가지로 옳은 것은?","opts":["복잡한 문제에 대하여 일시적인 해결책을 얻고자 하는 경우 / 시간이 부족하여 신속한 행동이 요구되는 경우","자기가 잘못한 것을 알아차린 경우 / 좋은 관계를 유지해야 하는 경우","목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우","다른 사람의 관심을 이해할 시간적 여유가 없는 경우 / 다른 문제 해결로 자연 해결되는 경우"],"a":0,"exp":"타협 전략은 복잡한 문제에 대하여 일시적인 해결책을 얻고자 하는 경우, 시간이 부족하여 신속한 행동이 요구되는 경우에 효과적이다.","id":"haengjeong-m86"},{"ch":"CH02 조직론","t":"갈등조성전략","q":"갈등조성을 위한 전략에 해당하지 않는 것은?","opts":["상위목표 제시: 갈등을 일으키고 있는 당사자들이 공동으로 추구해야 할 상위목표를 제시함","의사전달 통로의 변경: 특정한 의사전달 통로에 통상적으로 포함되던 사람을 일부러 제외하거나 본래 포함되지 않았던 사람을 새로 포함시키는 방법","정보전달 억제 또는 정보과다 조성: 정보전달을 억제하거나 정보과다 현상이 나타나도록 하여 조직구성원이 모든 의사전달을 무비판적으로 받아들이는 무관심 상태를 타파함","구조적 분화: 조직 내의 계층 수, 기능적 조직단위의 수를 늘려 서로 견제의 역할을 수행하게 함으로써 갈등을 조성함"],"a":0,"exp":"상위목표 제시는 갈등해소전략이다. 갈등조성전략에는 ① 의사전달 통로의 변경, ② 정보전달 억제 또는 정보과다 조성, ③ 구조적 분화, ④ 구성원의 태도 변화(조직구성원의 태도 변화를 통해 간접적으로 갈등을 조성함)가 있다.","id":"haengjeong-m87"},{"ch":"CH02 조직론","t":"갈등해소전략","q":"갈등해소를 위한 전략에 대한 설명으로 옳은 것은?","opts":["문제해결: 갈등을 일으키고 있는 당사자들이 직접 접촉하여 갈등의 원인이 되는 문제를 공동으로 해결하게 하는 방법 / 상위목표 제시: 공동으로 추구해야 할 상위목표를 제시함으로써 갈등관계에 있는 행동의 주체가 모두 목표를 위해 협력하도록 독려함","구조적 분화: 조직 내의 계층 수를 늘려 서로 견제하게 함 / 정보과다 조성: 무관심 상태를 타파함","의사전달 통로의 변경: 포함되던 사람을 제외함 / 구성원의 태도 변화: 간접적으로 갈등을 조성함","감수성 훈련: 소집단을 구성해 갈등을 경험함 / 팀빌딩: 커뮤니케이션 능력을 향상시킴"],"a":0,"exp":"갈등해소전략에는 ① 문제해결-당사자들이 직접 접촉하여 갈등의 원인이 되는 문제를 공동으로 해결하게 하는 방법, ② 상위목표 제시-공동으로 추구해야 할 상위목표를 제시하여 모두 목표를 위해 협력하도록 독려함, ③ 회피-단기적으로 갈등을 회피하는 방법으로 갈등을 야기할 수 있는 의사결정을 보류 또는 회피하거나 당사자들이 접촉을 피하도록 하는 것 또는 갈등행동을 억압하는 것, ④ 완화 또는 수용-갈등 당사자들의 차이점을 호도하고 유사점이나 공동의 이익을 강조함으로써 갈등을 해소하는 방법이 있다.","id":"haengjeong-m88"},{"ch":"CH02 조직론","t":"과업평가검토기법(PERT)","q":"과업평가검토기법(PERT)의 개념 방지 및 교직 전문성 신장이 있다.","id":"haengjeong-m91"},{"ch":"CH02 조직론","t":"목표관리기법(MBO) 한계","q":"목표관리기법(MBO)의 한계점으로 옳은 것은?","opts":["목표에 대한 지나친 중시와 단기적ㆍ구체적 목표에 대한 강조 때문에 과정을 중시하고 장기적ㆍ전인적 목표를 내세우는 학교교육활동에는 부적합한 측면이 있음","교직원의 참여의식을 지나치게 높여 관료화를 초래함","목표설정에 구성원이 참여하지 못해 내면화가 어려움","환류과정이 없어 활동의 과정과 결과를 평가할 수 없음"],"a":0,"exp":"MBO의 한계점은 ① 목표에 대한 지나친 중시와 단기적ㆍ구체적 목표에 대한 강조 때문에 과정을 중시하고 장기적ㆍ전인적 목표를 내세우는 학교교육활동에는 부적합한 측면이 있음, ② 목표설정과 성과보고 등은 많은 노력과 시간을 필요로 한다는 점에서 교직원의 잡무부담 가중과 불만의 원인이 되기 쉬움, ③ 측정 가능하고 계량적인 교육목표의 설정과 평가 때문에 학교교육을 오도할 가능성이 있음이다.","id":"haengjeong-m92"},{"ch":"CH02 조직론","t":"정보관리체제(MIS)","q":"정보관리체제(MIS)의 개념으로 옳은 것은?","opts":["의사결정자가 합리적인 결정을 내릴 수 있도록 필요한 정보를 적시에 신속하고 정확하게 제공하는 체제로, 단순한 사무관리 차원을 넘어서 정보의 수집, 저장, 처리, 전달 등과 관련된 인간, 도구, 방법의 통합적인 관리망","과업의 수행과정을 도표화하여 과업을 합리적ㆍ체계적으로 수행하는 방법","활동목표를 명료화ㆍ체계화함으로써 관리의 효율화를 기하려는 관리기법","고객만족과 관리개선을 위해 고객지향적인 서비스 품질에 초점을 두는 통합관리체계"],"a":0,"exp":"정보관리체제는 의사결정자가 합리적인 결정을 내릴 수 있도록 필요한 정보를 적시에 신속하고 정확하게 제공하는 체제이며, 단순한 사무관리 차원을 넘어서 정보의 수집, 저장, 처리, 전달 등과 관련된 인간, 도구, 방법의 통합적인 관리망이다.","id":"haengjeong-m93"},{"ch":"CH02 조직론","t":"총체적 질관리(TQM)","q":"총체적 질관리(TQM)의 개념으로 옳은 것은?","opts":["고객만족과 관리개선을 위해 고객지향적인 서비스 품질에 초점을 두고 전 직원의 참여를 통하여 지속적으로 서비스를 개선해 나가는 통합관리체계로, 제품이나 서비스의 품질뿐 아니라 경영과 업무, 직장환경, 조직구성원의 자질까지도 품질 개념에 넣어 관리해야 한다고 주장","필요한 정보를 적시에 제공하는 통합적인 관리망","활동목표를 명료화ㆍ체계화하여 관리의 효율화를 기하려는 기법","조직구성원의 잠재력을 최대한 개발하고 행태를 개선하려는 조직혁신의 접근방법"],"a":0,"exp":"총체적 질관리는 고객만족과 관리개선을 위해 고객지향적인 서비스 품질에 초점을 두고 전 직원의 참여를 통하여 지속적으로 서비스를 개선해 나가는 통합관리체계이다. 제품이나 서비스의 품질뿐 아니라 경영과 업무, 직장환경, 조직구성원의 자질까지도 품질 개념에 넣어 관리해야 한다고 주장한다.","id":"haengjeong-m94"},{"ch":"CH02 조직론","t":"조직개발기법 개념","q":"조직개발(발전)기법의 개념으로 옳은 것은?","opts":["사람 또는 조직문화 중심의 변화전략으로 조직구성원의 잠재력을 최대한 개발하고 행태를 개선함으로써 조직 전체의 개혁을 이루려는 조직혁신의 접근방법","과업의 수행과정을 도표화하여 합리적ㆍ체계적으로 수행하는 방법","활동목표를 명료화ㆍ체계화하여 관리의 효율화를 기하려는 기법","필요한 정보를 적시에 제공하는 통합적인 관리망"],"a":0,"exp":"조직개발(발전)기법은 사람 또는 조직문화 중심의 변화전략으로, 조직구성원의 잠재력을 최대한 개발하고 행태를 개선함으로써 조직 전체의 개혁을 이루려는 조직혁신의 접근방법을 의미한다.","id":"haengjeong-m95"},{"ch":"CH02 조직론","t":"조직개발기법 특징","q":"조직개발(발전)기법의 특징으로 옳지 않은 것은?","opts":["조직의 최고관리층은 개입하지 않고 하위 구성원 중심으로 자연발생적으로 이루어짐","조직이 새로운 기술, 도전에 보다 잘 적응할 수 있도록 구성원의 신념, 태도, 가치관 및 조직구조를 변화시키고자 하는 노력","조직의 체계적 진단, 개선을 위한 전략적 계획 수립, 이를 위한 자원의 동원 등을 포함하는 계획된 노력","조직문화 또는 분위기, 구성원의 가치관 등의 변화, 보수체제의 변화 등 조직 전체에 걸쳐 행해짐"],"a":0,"exp":"조직개발기법은 최고관리층으로부터 시작된다. 조직의 최고관리층은 조직발전의 과정과 그 결과에 대해 최종 책임을 지고 있기 때문에 조직발전 사업에 적극적으로 참여하고 헌신한다. 그 밖의 특징으로는 환경변화 대응을 위한 노력, 변화를 위한 계획된 노력, 전체 조직의 변화를 위한 노력, 효율성과 건전성 증진, 행태과학적 지식 활용이 있다.","id":"haengjeong-m96"},{"ch":"CH02 조직론","t":"조직개발 대표기법","q":"조직개발(발전)의 대표적 기법 2가지에 대한 설명으로 옳은 것은?","opts":["감수성 훈련: 참가자들이 소집단을 구성해 집단 내에서 다양한 갈등, 조화, 지도성, 상호작용을 경험하는 훈련 ⇒ 인간관계 능력 개선 / 팀빌딩: 팀원들의 작업 및 커뮤니케이션 능력, 문제해결 능력을 향상시켜 조직효율을 높이려는 조직개발기법","마이크로티칭: 소규모 수업을 녹화하여 분석함 / 컨설팅장학: 전문성을 갖춘 교원이 도움을 제공함","목표관리기법: 활동목표를 명료화함 / 과업평가검토기법: 과업 수행과정을 도표화함","직무풍요화: 자율성과 책임을 부여함 / 경력단계프로그램: 교사의 자격과 단계를 세분화함"],"a":0,"exp":"조직개발의 대표적 기법은 ① 감수성 훈련-참가자들이 소집단을 구성해 집단 내에서 다양한 갈등, 조화, 지도성, 상호작용을 경험하는 훈련으로 인간관계 능력을 개선함, ② 팀빌딩-팀원들의 작업 및 커뮤니케이션 능력, 문제해결 능력을 향상시켜 조직효율을 높이려는 조직개발기법이다.","id":"haengjeong-m97"},{"ch":"CH03 동기이론","t":"매슬로우 결핍욕구","q":"매슬로우(Maslow)의 욕구체계이론에서 결핍욕구의 특징과 하위 욕구로 옳은 것은?","opts":["충족되면 더 이상 욕구로 작동하지 않으며 완전한 충족이 가능함. 만족의 대상으로 외부로부터 오는 타율적 충족을 추구함 / 하위 4개 욕구: 생리적 욕구, 안전의 욕구, 소속의 욕구(애정과 공감의 욕구), 자존(존경)의 욕구","완전한 충족이 불가능하고 계속적으로 추구함. 자율적 충족을 요구함 / 하위 3개 욕구: 지적 욕구, 심미적 욕구, 자아실현의 욕구","직무 그 자체에서 도출된 내용적ㆍ내적ㆍ심리적인 것에 직접적으로 관련됨 / 성취감, 책임감","작업환경에서 도출된 상황적ㆍ외적ㆍ물리적인 것 / 임금, 감독, 작업조건"],"a":0,"exp":"결핍욕구는 ① 충족되면 더 이상 욕구로 작동하지 않으며 완전한 충족이 가능하고, ② 만족의 대상으로 외부로부터 오는 타율적 충족을 추구하며, ③ 하위 4개 욕구는 생리적 욕구, 안전의 욕구, 소속의 욕구(애정과 공감의 욕구), 자존(존경)의 욕구이다.","id":"haengjeong-m98"},{"ch":"CH03 동기이론","t":"매슬로우 성장욕구","q":"매슬로우(Maslow)의 욕구체계이론에서 성장욕구의 특징과 하위 욕구로 옳은 것은?","opts":["결핍욕구가 충족되어야만 발현되는 욕구로 완전한 충족이 불가능하고 계속적으로 추구함. 만족의 대상이 자기 자신인 자율적 충족을 요구함 / 하위 3개 욕구: 지적 욕구, 심미적 욕구, 자아실현의 욕구","충족되면 더 이상 욕구로 작동하지 않으며 완전한 충족이 가능함 / 하위 4개 욕구: 생리적, 안전, 소속, 자존 욕구","타인과의 접촉, 모임, 사랑을 추구하는 욕구 / 소속ㆍ애정의 욕구","신분보장, 직업안정성, 연금제도와 관련된 욕구 / 안전의 욕구"],"a":0,"exp":"성장욕구는 ① 결핍욕구가 충족되어야만 발현되는 욕구로 완전한 충족이 불가능하고 계속적으로 추구하며, ② 만족의 대상이 자기 자신인 자율적 충족을 요구하고, ③ 하위 3개 욕구는 지적 욕구, 심미적 욕구, 자아실현의 욕구이다.","id":"haengjeong-m99"},{"ch":"CH03 동기이론","t":"매슬로우 욕구별 예시","q":"매슬로우(Maslow)의 욕구체계와 그 예시의 연결로 옳지 않은 것은?","opts":["자존의 욕구 - 배고픔, 갈증, 배설, 수면","안전의 욕구 - 신분보장, 직업안정성, 연금제도","소속ㆍ애정의 욕구 - 타인과의 접촉, 모임, 사랑","심미적 욕구 - 아름다움, 질서, 조화, 완성"],"a":0,"exp":"배고픔, 갈증, 배설, 수면은 생리적 욕구의 예시이다. 자존의 욕구는 인정, 명예, 지위, 자아존중감, 자기효능감이며, 지적 욕구는 새로운 것을 알고 이해하고자 하는 것이다.","id":"haengjeong-m100"},{"ch":"CH03 동기이론","t":"허즈버그 동기·위생 관계","q":"허즈버그(Herzberg)의 동기-위생이론에서 동기요인과 위생요인의 관계로 옳은 것은?","opts":["동기(만족)요인이 존재할 경우 만족하겠지만 부재상태라고 해서 불만족하지 않으며, 위생(불만족)요인이 충족되지 않을 경우 불만을 갖게 되지만 충족된다고 해도 만족에는 크게 기여하지 못함","동기요인과 위생요인은 하나의 연속선상에 있어 동기요인이 충족되면 자동적으로 위생요인도 충족됨","위생요인이 충족되면 동기요인이 자동적으로 나타남","동기요인이 부재하면 반드시 불만족이 발생함"],"a":0,"exp":"동기(만족)요인이 존재할 경우 만족하겠지만 부재상태라고 해서 불만족하지 않으며, 위생(불만족)요인이 충족되지 않을 경우 불만을 갖게 되지만 충족된다고 해도 만족에는 크게 기여하지 못한다.","id":"haengjeong-m101"},{"ch":"CH03 동기이론","t":"허즈버그 동기요인","q":"허즈버그(Herzberg)의 동기요인(만족요인)의 특징으로 옳은 것은?","opts":["직무 그 자체에서 도출된 내용적ㆍ내적ㆍ심리적인 것에 직접적으로 관련됨. 사람들은 일을 하는 과정에서 성취감이나 책임감, 발전하고 있다는 느낌을 갖도록 설계하고, 일의 목표나 수행방식 등을 스스로 결정하도록 자유재량권을 주면 만족을 느낌. 매슬로우가 말한 욕구계층 중 상위욕구와 일치","작업환경에서 도출된 상황적ㆍ외적ㆍ물리적인 것에 직접적으로 관련됨. 회사의 정책과 행정, 감독, 임금, 대인관계, 작업조건 등","충족이 단지 직무에 대한 불만족의 감소만을 가져올 뿐 직무만족으로 이어지지는 않음","매슬로우가 말한 욕구계층 중 하위욕구와 일치"],"a":0,"exp":"동기요인(만족요인)은 직무 그 자체에서 도출된 내용적ㆍ내적ㆍ심리적인 것에 직접적으로 관련되며, 사람들은 일을 하는 과정에서 성취감이나 책임감, 발전하고 있다는 느낌을 갖도록 설계하고 일의 목표나 수행방식 등을 스스로 결정하도록 자유재량권을 주면 만족을 느낀다. 충족되지 않아도 불만은 없지만 일단 충족하게 되면 직무태도와 직무만족에 긍정적 영향을 줄 수 있으며, 매슬로우가 말한 욕구계층 중 상위욕구와 일치한다.","id":"haengjeong-m102"},{"ch":"CH03 동기이론","t":"허즈버그 위생요인","q":"허즈버그(Herzberg)의 위생요인(불만족요인)의 특징으로 옳은 것은?","opts":["작업환경에서 도출된 상황적ㆍ외적ㆍ물리적인 것에 직접적으로 관련되며 회사의 정책과 행정, 감독, 임금, 대인관계, 작업조건 등이 해당함. 그것의 충족이 단지 직무에 대한 불만족의 감소만을 가져올 뿐 직무만족으로 이어지지는 않음. 매슬로우가 말한 욕구계층 중 하위욕구와 일치","직무 그 자체에서 도출된 내용적ㆍ내적ㆍ심리적인 것에 직접적으로 관련됨","성취감이나 책임감, 발전하고 있다는 느낌과 관련됨","매슬로우가 말한 욕구계층 중 상위욕구와 일치"],"a":0,"exp":"위생요인(불만족요인)은 작업환경에서 도출된 상황적ㆍ외적ㆍ물리적인 것에 직접적으로 관련되며 직무를 수행하는 환경과 관련된 요인으로 회사의 정책과 행정, 감독, 임금, 대인관계, 작업조건 등이다. 위생요인은 그것의 충족이 단지 직무에 대한 불만족의 감소만을 가져올 뿐 직무만족으로 이어지지는 않으며, 매슬로우가 말한 욕구계층 중 하위욕구와 일치한다. 매슬로우는 생리적 욕구가 충족되면 안전의 욕구가 자동적으로 나타난다고 한 반면, 허즈버그는 위생요인이 충족되면 불만족요인이 줄어들 뿐이지 만족요인은 나타나지 않는다고 하였다.","id":"haengjeong-m103"},{"ch":"CH03 동기이론","t":"허즈버그 시사점·직무풍요화","q":"허즈버그(Herzberg) 이론의 시사점에 따라 교사의 직무동기를 높이는 방안 중 '직무풍요화'에 대한 설명으로 옳은 것은?","opts":["직무수행에 다양한 작업내용이 포함되고 보다 높은 수준의 지식과 기술을 필요로 함. 작업자에게 자신의 성과를 계획ㆍ지휘ㆍ통제할 수 있는 자율성과 책임을 많이 부여하며, 개인적 성장과 의미 있는 작업경험에 대한 기회가 제공될 수 있게끔 직무의 내용을 재편성함","직무에 내재된 특성이 구성원의 심리상태를 변화시키고 이러한 심리상태가 개인의 직무동기와 만족, 직무효과까지 높여줌","교사의 자격과 단계를 보다 세분화하여 지속적으로 새로운 지식과 기술, 전문성을 계발할 수 있는 기회와 보상을 제공함","위생요인을 충족시켜 불만족을 감소시킴"],"a":0,"exp":"직무풍요화는 직무수행에 다양한 작업내용이 포함되고 보다 높은 수준의 지식과 기술을 필요로 하며, 작업자에게 자신의 성과를 계획ㆍ지휘ㆍ통제할 수 있는 자율성과 책임을 많이 부여하고, 개인적 성장과 의미 있는 작업경험에 대한 기회가 제공될 수 있게끔 직무의 내용을 재편성하는 것이다. 이 이론의 시사점은 학교조직 내에서 교사의 동기요인을 충족할 수 있도록 노력해야 함을 시사한다는 것이다.","id":"haengjeong-m104"},{"ch":"CH03 동기이론","t":"직무특성이론","q":"교사의 직무동기를 높이는 방안 중 '직무특성이론'에 대한 설명으로 옳은 것은?","opts":["직무에 내재된 특성(기술다양성, 과업정체성, 과업중요성, 자율성, 피드백)이 구성원의 심리상태를 변화시키고 이러한 심리상태가 개인의 직무동기와 만족, 직무효과까지 높여줌","작업자에게 자율성과 책임을 많이 부여하고 직무의 내용을 재편성함","교사의 자격과 단계를 보다 세분화하여 새로운 지식과 기술, 전문성을 계발할 기회와 보상을 제공함","조직구성원의 잠재력을 최대한 개발하고 행태를 개선함"],"a":0,"exp":"직무특성이론은 직무에 내재된 특성(기술다양성, 과업정체성, 과업중요성, 자율성, 피드백)이 구성원의 심리상태를 변화시키고, 이러한 심리상태가 개인의 직무동기와 만족, 직무효과까지 높여준다는 것이다.","id":"haengjeong-m105"},{"ch":"CH03 동기이론","t":"경력단계프로그램","q":"교사의 직무동기를 높이는 방안 중 '경력단계프로그램'에 대한 설명으로 옳은 것은?","opts":["교사의 자격과 단계를 보다 세분화하여 지속적으로 새로운 지식과 기술, 전문성을 계발할 수 있는 기회와 보상을 제공하고 직무의 다양성과 책임을 증가시켜 궁극적으로 교직의 보람과 만족을 경험하게 하려는 것(예: 수석교사제)","직무에 내재된 특성이 구성원의 심리상태를 변화시켜 직무동기를 높임","작업자에게 자율성과 책임을 부여하여 직무의 내용을 재편성함","위생요인을 충족시켜 직무 불만족을 감소시킴"],"a":0,"exp":"경력단계프로그램은 교사의 자격과 단계를 보다 세분화하여 지속적으로 새로운 지식과 기술, 전문성을 계발할 수 있는 기회와 보상을 제공하고 직무의 다양성과 책임을 증가시켜 궁극적으로 교직의 보람과 만족을 경험하게 하려는 것이다(예: 수석교사제).","id":"haengjeong-m106"},{"ch":"CH03 동기이론","t":"앨더퍼 생존욕구","q":"앨더퍼(Alderfer)의 ERG이론에서 생존욕구의 개념과 충족방법으로 옳은 것은?","opts":["인간이 생존을 위해 필요로 하는 욕구 ⇒ 보수, 작업환경, 직업안정, 근무조건, 연금제도, 복리후생, 근무환경 개선","인간이 사회적 존재로서 타인과 인간관계를 맺고자 하는 욕구 ⇒ 교사 간 비공식조직 모임 활성화","인간이 성장ㆍ발전하고 잠재력을 최대한으로 발휘하고자 하는 내적 욕구 ⇒ 교사 전문성 함양을 위한 연수","자아실현을 추구하는 욕구 ⇒ 직무풍요화"],"a":0,"exp":"생존욕구는 인간이 생존을 위해 필요로 하는 욕구이며, 충족방법은 보수, 작업환경, 직업안정, 근무조건, 연금제도, 복리후생, 근무환경 개선이다.","id":"haengjeong-m107"},{"ch":"CH03 동기이론","t":"앨더퍼 관계욕구","q":"앨더퍼(Alderfer)의 ERG이론에서 관계욕구의 개념과 충족방법으로 옳은 것은?","opts":["인간이 사회적 존재로서 타인과 인간관계를 맺고자 하는 욕구 ⇒ 교사 간 비공식조직 모임 활성화, 전문적 학습공동체 지원, 동료교사 및 교장ㆍ교감과의 소통기회 마련","인간이 생존을 위해 필요로 하는 욕구 ⇒ 보수, 작업환경, 직업안정","인간이 성장ㆍ발전하고 잠재력을 최대한으로 발휘하고자 하는 내적 욕구 ⇒ 교사 전문성 함양을 위한 연수","인정과 명예를 추구하는 욕구 ⇒ 표창제도"],"a":0,"exp":"관계욕구는 인간이 사회적 존재로서 타인과 인간관계를 맺고자 하는 욕구이며, 충족방법은 교사 간 비공식조직 모임 활성화, 전문적 학습공동체 지원, 동료교사 및 교장ㆍ교감과의 소통기회 마련이다.","id":"haengjeong-m108"},{"ch":"CH03 동기이론","t":"앨더퍼 성장욕구","q":"앨더퍼(Alderfer)의 ERG이론에서 성장욕구의 개념과 충족방법으로 옳은 것은?","opts":["인간이 성장ㆍ발전하고 잠재력을 최대한으로 발휘하고자 하는 내적 욕구 ⇒ 교사 전문성 함양을 위한 연수, 교사 훈련프로그램 지원, 다양한 자율장학, 직업에 대한 자긍심 함양 기회, 직무풍요화","인간이 타인과 인간관계를 맺고자 하는 욕구 ⇒ 비공식조직 모임 활성화","인간이 생존을 위해 필요로 하는 욕구 ⇒ 보수, 연금제도, 복리후생","안전과 신분보장을 추구하는 욕구 ⇒ 직업안정"],"a":0,"exp":"성장욕구는 인간이 성장ㆍ발전하고 잠재력을 최대한으로 발휘하고자 하는 내적 욕구이며, 충족방법은 교사 전문성 함양을 위한 연수, 교사 훈련프로그램 지원, 다양한 자율장학, 직업에 대한 자긍심 함양 기회, 직무풍요화이다.","id":"haengjeong-m109"},{"ch":"CH03 동기이론","t":"앨더퍼 vs 매슬로우","q":"앨더퍼(Alderfer)의 ERG이론이 매슬로우(Maslow)의 이론과 구별되는 차이점 2가지로 옳은 것은?","opts":["하위단계의 욕구가 만족되어야 다음 단계의 욕구가 발생한다고 보는 매슬로우의 이론과 달리 여러 가지 욕구를 동시에 경험할 수 있음 / 매슬로우의 이론과는 달리 하위단계의 욕구가 충족되지 않더라도 상위단계의 욕구가 발생할 수 있음","욕구를 5단계로 세분화함 / 결핍욕구와 성장욕구를 구분함","욕구를 동기요인과 위생요인으로 구분함 / 만족과 불만족을 별개의 차원으로 봄","욕구의 충족이 아니라 기대와 유인가에 의해 동기가 결정된다고 봄 / 성과와 보상의 연계를 강조함"],"a":0,"exp":"앨더퍼 이론이 매슬로우 이론과 다른 점은 ① 하위단계의 욕구가 만족되어야 다음 단계의 욕구가 발생한다고 보는 매슬로우의 이론과 달리 여러 가지 욕구를 동시에 경험할 수 있다는 점, ② 매슬로우의 이론과는 달리 하위단계의 욕구가 충족되지 않더라도 상위단계의 욕구가 발생할 수 있다는 점이다.","id":"haengjeong-m110"},{"ch":"CH03 동기이론","t":"브룸 유인가","q":"브룸(Vroom)의 기대이론에서 유인가(목표매력성)의 개념으로 옳은 것은?","opts":["보상에 대해 가지는 매력 또는 인지적 가치","행위를 하고 나서 얻을 수 있는 결과","과업에 관련된 노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도","좋은 과업수행은 주목을 받고 또 보상을 받을 것이라고 지각된 확률"],"a":0,"exp":"유인가(목표매력성)는 보상에 대해 가지는 매력 또는 인지적 가치이다.","id":"haengjeong-m111"},{"ch":"CH03 동기이론","t":"브룸 성과","q":"브룸(Vroom)의 기대이론에서 '성과'의 개념과 수준에 대한 설명으로 옳은 것은?","opts":["행위를 하고 나서 얻을 수 있는 결과. 1차 수준의 성과는 사람이 어떤 일을 해서 직접적으로 또는 즉시 얻어진 결과(직무성, 생산성, 노동이동 등)이고, 2차 수준의 성과는 1차 수준의 성과가 가져올 보상(금전, 승진, 휴가, 인정 등)임","보상에 대해 가지는 매력 또는 인지적 가치","노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도","좋은 과업수행이 보상을 받을 것이라고 지각된 확률"],"a":0,"exp":"성과는 행위를 하고 나서 얻을 수 있는 결과이다. 1차 수준의 성과는 사람이 어떤 일을 해서 직접적으로 또는 즉시 얻어진 결과(직무성, 생산성, 노동이동 등)이고, 2차 수준의 성과는 1차 수준의 성과가 가져올 보상(금전, 승진, 휴가, 인정 등)이다.","id":"haengjeong-m112"},{"ch":"CH03 동기이론","t":"브룸 성과기대·보상기대","q":"브룸(Vroom)의 기대이론에서 성과기대와 보상기대의 개념으로 옳은 것은?","opts":["성과기대(기대감, 노력과 성과의 연계): 과업에 관련된 노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도 / 보상기대(수단성, 성과와 보상의 연계): 좋은 과업수행은 주목을 받고 또 보상을 받을 것이라고 지각된 확률","성과기대: 보상에 대해 가지는 매력 / 보상기대: 행위 후 얻을 수 있는 결과","성과기대: 성과와 보상의 연계 / 보상기대: 노력과 성과의 연계","성과기대: 1차 수준의 성과 / 보상기대: 2차 수준의 성과"],"a":0,"exp":"성과기대(기대감, 노력과 성과의 연계)는 과업에 관련된 노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도이며, 보상기대(수단성, 성과와 보상의 연계)는 좋은 과업수행은 주목을 받고 또 보상을 받을 것이라고 지각된 확률이다.","id":"haengjeong-m113"},{"ch":"CH03 동기이론","t":"브룸 동기부여방안","q":"브룸(Vroom)의 기대이론의 관점에서 동기를 부여하는 방안으로 옳지 않은 것은?","opts":["위생요인을 충족시켜 구성원의 불만족을 감소시켜야 함","높은 성과기대: 노력하면 성과를 얻을 수 있다는 믿음을 주어야 함","높은 보상기대: 높은 성과가 보상으로 이어질 수 있다는 보상기대를 갖게 하며 보상에 대해 구체적으로 제안해야 함","높은 유인가: 보상의 매력도를 높이고자 구성원들이 원하는 보상내용을 파악하고 이를 활용해야 함"],"a":0,"exp":"위생요인 충족은 허즈버그 이론의 내용이다. 브룸의 기대이론에서의 동기부여방안은 ① 높은 성과기대-노력하면 성과를 얻을 수 있다는 믿음을 주어야 함, ② 높은 보상기대-높은 성과가 보상으로 이어질 수 있다는 보상기대를 갖게 하며 보상에 대해 구체적으로 제안해야 함, ③ 높은 유인가-보상의 매력도를 높이고자 구성원들이 원하는 보상내용을 파악하고 이를 활용해야 함이다.","id":"haengjeong-m114"},{"ch":"CH03 동기이론","t":"포터·로울러 성취-만족이론","q":"포터(Porter)와 로울러(Lawler)의 성취-만족이론의 특징으로 옳지 않은 것은?","opts":["내적ㆍ외적 보상이 있다면 그것이 불공정하다고 지각되더라도 개인에게 만족을 준다","피고용자의 능력 및 특성과 역할지각이 성과에 영향을 미친다","성과(성취)의 수준은 내적 보상이나 외적 보상을 가져온다","개인은 실제로 받은 보상이 얼마나 공정(정당)한가(지각된 공정한 보상)를 측정하고, 그 결과는 피고용자가 경험하는 만족의 수준으로 나타난다"],"a":0,"exp":"내적ㆍ외적 보상이 있더라도 그것이 불공정하다고 지각되면 개인에게 만족을 줄 수 없다. 그 밖의 특징으로는 피고용자의 능력 및 특성과 역할지각이 성과에 영향을 미침, 성과의 수준은 내적 보상이나 외적 보상을 가져옴, 개인은 지각된 공정한 보상을 측정하고 그 결과가 만족의 수준으로 나타남, 직무수행에 대한 노력은 보상에 부여하는 가치와 어떤 노력이 보상을 가져다줄 것인가에 대한 기대에 의해 좌우됨, 노력에 의한 직무성취는 개인에게 만족을 주는데 이때 만족은 그에 결부된 내재적 및 외재적 보상에 의하여 강화됨이 있다.","id":"haengjeong-m115"},{"ch":"CH03 동기이론","t":"아담스 공정성","q":"아담스(Adams)의 관점에서 공정성의 개념으로 옳은 것은?","opts":["자신이 수행한 일로 받은 성과와 이를 얻기 위해 자신이 투자한 투입에 대한 특정한 신념. 자신의 투입-성과의 비율을 타인의 투입-성과의 비율과 비교하여 동등할 때 공정한 대우를 받고 있다고 느끼고 직무에 대해 만족함","보상에 대해 가지는 매력 또는 인지적 가치","과업에 관련된 노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도","구성원이 상급자의 의사결정을 기꺼이 받아들일 수 있는 정도"],"a":0,"exp":"공정성은 자신이 수행한 일로 받은 성과와 이를 얻기 위해 자신이 투자한 투입에 대한 특정한 신념이다. 자신의 투입-성과의 비율을 타인의 투입-성과의 비율과 비교하여 동등할 때 공정한 대우를 받고 있다고 느끼고 직무에 대해 만족한다.","id":"haengjeong-m116"},{"ch":"CH03 동기이론","t":"아담스 공정성 회복 행동","q":"아담스(Adams)의 이론에서 사람들이 불공정하다고 느낄 때 긴장을 감소시키고 공정성을 회복하기 위해 선택하는 행동 6가지에 해당하지 않는 것은?","opts":["상위목표의 제시(공동으로 추구해야 할 상위목표를 제시함)","투입 조정(투입의 변경) / 성과 조정(결과의 변경)","투입과 성과에 대한 인지적 왜곡 / 비교대상의 투입과 성과의 변경(비교대상의 투입과 성과에 대한 영향력 행사)","비교대상의 변경 / 조직이탈(퇴직)"],"a":0,"exp":"공정성 회복을 위한 행동 6가지는 ① 투입 조정(투입의 변경), ② 성과 조정(결과의 변경), ③ 투입과 성과에 대한 인지적 왜곡, ④ 비교대상의 투입과 성과의 변경(비교대상의 투입과 성과에 대한 영향력 행사), ⑤ 비교대상의 변경, ⑥ 조직이탈(퇴직)이다.","id":"haengjeong-m117"},{"ch":"CH03 동기이론","t":"아담스 시사점","q":"아담스(Adams)의 공정성이론이 공정성을 회복하기 위해 주는 시사점으로 옳은 것은?","opts":["학교경영자는 조직에서의 사회적 비교과정에 주의를 기울여 교사를 공정하게 대우하도록 노력해야 하며, 교사의 동기유발 시 지각의 중요성을 인식하고 공정한 조직문화풍토를 구축해야 함","교사의 위생요인을 우선적으로 충족시켜 불만족을 줄여야 함","교사에게 도전적인 목표를 설정해 주고 자신감을 심어주어야 함","교사의 성숙도에 따라 지도자의 행동유형을 달리해야 함"],"a":0,"exp":"시사점은 ① 학교경영자는 조직에서의 사회적 비교과정에 주의를 기울여 교사를 공정하게 대우하도록 노력해야 함, ② 학교경영자는 교사의 동기유발 시 지각의 중요성을 인식하고 공정한 조직문화풍토를 구축해야 함, ③ 공정성 또는 불공정성에 관한 판단은 개인적인 차원에서만 이루어지는 것은 아니며 조직 내ㆍ외의 다른 작업자와의 비교가 포함된다는 점을 유의해야 함이다.","id":"haengjeong-m118"},{"ch":"CH03 동기이론","t":"로크 목표설정이론","q":"로크(Locke)의 관점에서 인간의 행동을 결정하는 인지적 요인 2가지로 옳은 것은?","opts":["가치관, 목표","기대, 유인가","투입, 성과","능력, 동기"],"a":0,"exp":"로크의 관점에서 인간의 행동을 결정하는 인지적 요인은 가치관과 목표이다.","id":"haengjeong-m119"},{"ch":"CH03 동기이론","t":"로크 목표의 기능","q":"로크(Locke)의 목표설정이론에서 목표의 기능으로 옳지 않은 것은?","opts":["목표는 구성원 간의 경쟁을 억제하여 조직의 응집력을 높이는 기능을 한다","개인의 동기와 과업에 대한 주의력을 증진시켜 과업수행을 높이는 결정적인 동인이 된다","개인이 행동에 투입하는 노력과 지속성을 증대시킨다","과업을 수행하는 방법을 효율화함으로써 동기와 과업수행력을 증진시키는 기제가 된다"],"a":0,"exp":"목표의 기능은 ① 개인의 동기와 과업에 대한 주의력을 증진시켜 과업수행을 높이는 결정적인 동인, ② 개인이 행동에 투입하는 노력과 지속성을 증대시킴, ③ 과업을 수행하는 방법을 효율화함으로써 동기와 과업수행력을 증진시키는 기제가 됨이다.","id":"haengjeong-m120"},{"ch":"CH03 동기이론","t":"스티어스 좋은 목표","q":"스티어스(Steers)가 제시한 좋은 목표의 특징에 해당하지 않는 것은?","opts":["목표의 추상성","목표의 구체성 / 목표의 곤란성","목표설정에의 참여 / 노력에 대한 피드백","목표달성에 대한 동료들 간의 경쟁 / 목표의 수용성"],"a":0,"exp":"스티어스가 제시한 좋은 목표의 특징은 ① 목표의 구체성, ② 목표의 곤란성, ③ 목표설정에의 참여, ④ 노력에 대한 피드백, ⑤ 목표달성에 대한 동료들 간의 경쟁, ⑥ 목표의 수용성이다.","id":"haengjeong-m121"},{"ch":"CH04 지도성이론","t":"피들러 상황결정요인","q":"피들러(Fiedler)의 이론에서 상황을 결정하는 3가지 요인의 명칭과 개념으로 옳은 것은?","opts":["지도자-구성원 관계(지도자와 구성원 간 관계의 질, 즉 구성원에 대한 지도자의 신뢰나 지도자에 대한 구성원의 존경도 등), 과업구조(과업의 특성으로 명확하게 규정되고 수행방법이 체계화되어 있으면 구조화, 그렇지 않으면 비구조화되었다고 함), 지도자의 지위권력(지도자가 합법적ㆍ보상적ㆍ강압적인 권력을 가지고 구성원의 행위에 영향을 줄 수 있는 능력을 소유한 정도)","구성원의 개인적 특성, 직무환경의 특성, 지도자의 행위","직무성숙도, 심리적 성숙도, 지도자의 행동유형","구성원, 과업, 조직"],"a":0,"exp":"피들러의 상황결정요인은 ① 지도자-구성원 관계: 지도자와 구성원 간 관계의 질(구성원에 대한 지도자의 신뢰나 지도자에 대한 구성원의 존경도 등), ② 과업구조: 과업의 특성(명확하게 규정되고 수행방법이 체계화되어 있으면 구조화, 그렇지 않으면 비구조화), ③ 지도자의 지위권력: 지도자가 합법적ㆍ보상적ㆍ강압적인 권력을 가지고 구성원의 행위에 영향을 줄 수 있는 능력을 소유한 정도이다.","id":"haengjeong-m122"},{"ch":"CH04 지도성이론","t":"피들러 효과적 상황","q":"피들러(Fiedler)의 이론에서 과업지향형 지도자와 관계지향형 지도자가 효과적인 상황을 상황의 호의성 관점에서 설명한 것으로 옳은 것은?","opts":["과업지향형 지도자는 지도자의 영향력이 대단히 크거나 작은 극단적인 상황에서 가장 효과적이며, 관계지향형 지도자는 지도자의 영향력이 중간 정도인 상황에서 가장 효과적임","과업지향형 지도자는 영향력이 중간 정도인 상황에서, 관계지향형 지도자는 극단적인 상황에서 효과적임","과업지향형 지도자는 항상 효과적이며, 관계지향형 지도자는 비구조화된 과업에서만 효과적임","두 유형 모두 지도자의 지위권력이 강한 상황에서만 효과적임"],"a":0,"exp":"과업지향형 지도자는 지도자의 영향력이 대단히 크거나 작은 극단적인 상황에서 가장 효과적이며, 관계지향형 지도자는 지도자의 영향력이 중간 정도인 상황에서 가장 효과적이다.","id":"haengjeong-m123"},{"ch":"CH04 지도성이론","t":"하우스 명료화행동","q":"하우스(House)의 행로-목표이론에서 '명료화 행동'에 대한 설명으로 옳은 것은?","opts":["과업의 수행목적 행사함 / 교사에게 셀프지도성을 가르치고 조직 내에서 셀프지도성을 실천할 수 있는 기회를 제공하며, 교사가 자기주도적으로 통제할 수 있도록 내적 동기를 부여하고 스스로 지도자로서의 능력을 개발할 수 있도록 함","교사의 업무를 세분화하여 관리자의 통제를 강화함","교사에게 도전적인 목표를 부여하고 성과에 따라 보상을 차등 지급함","학교장이 모든 의사결정에 대한 최종 책임을 지고 교사의 재량권을 제한함"],"a":0,"exp":"초우량지도성의 신장방안은 ① 교사는 일상적 업무에 대한 통제에 있어 높은 수준의 자율성을 경험하고 기대하며 전문직업인으로서 일상의 과업에서 상당한 재량권을 행사함, ② 교사에게 셀프지도성을 가르치고 조직 내에서 셀프지도성을 실천할 수 있는 기회를 제공함. 교사가 자기주도적으로 통제할 수 있도록 내적 동기를 부여하고, 교사가 스스로 지도자로서의 능력을 개발할 수 있도록 함이다.","id":"haengjeong-m149"},{"ch":"CH04 지도성이론","t":"셀프지도성","q":"셀프지도성(자율적 지도성)의 개념으로 옳은 것은?","opts":["구성원 각자 자율적으로 자신의 지도력을 발휘할 수 있게 되는 것으로, 조직구성원 각자가 스스로를 통제하고 삶의 진정한 주인이 될 수 있도록 셀프지도성을 개발하는 데 중점을 두는 리더십","지도성이 다수의 조직구성원에게 분산되어 있다고 여기고 전체적 관점에서 파악하는 지도성","인간의 가치와 의미추구 욕구를 만족시키는 지도성","구성원의 도덕적 가치에 호소하여 기대 이상의 성과를 달성하게 하는 지도성"],"a":0,"exp":"셀프지도성(셀프리더십/자율적 지도성)은 구성원 각자 자율적으로 자신의 지도력을 발휘할 수 있게 되는 것으로, 조직구성원 각자가 스스로를 통제하고 삶의 진정한 주인이 될 수 있도록 셀프지도성을 개발하는 데 중점을 두는 리더십이다.","id":"haengjeong-m150"},{"ch":"CH04 지도성이론","t":"도덕적 지도성 개념","q":"도덕적 지도성의 개념과 궁극적으로 만들고자 하는 조직의 특징으로 옳은 것은?","opts":["지도자가 자신의 도덕적 품성과 능력을 바탕으로 추종자의 존경과 신뢰를 획득하고 나아가 추종자의 능력을 계발하고 추종자의 자율적 직무수행을 조장해 추종자들을 '셀프리더'가 되도록 자극하고 지도자 자신은 '리더들의 리더'가 되도록 함 / 궁극적으로 효과적이고 도덕적인 조직이 될 수 있도록 하는 지도성","지도성이 조직구성원 전부에게 분산되어 있다고 여기는 지도성 / 비위계적 조직","인간의 가치와 의미추구 욕구를 만족시키는 지도성 / 제도적으로 통합된 조직","교육자가 구성원의 배움을 자극하는 활동 / 학습공동체"],"a":0,"exp":"도덕적 지도성은 지도자가 자신의 도덕적 품성과 능력을 바탕으로 추종자의 존경과 신뢰를 획득하고, 나아가 추종자의 능력을 계발하고 추종자의 자율적 직무수행을 조장해 추종자들을 '셀프리더'가 되도록 자극하고 지도자 자신은 '리더들의 리더'가 되도록 하는 것이다. 궁극적으로 효과적이고 도덕적인 조직이 될 수 있도록 하는 지도성이다.","id":"haengjeong-m151"},{"ch":"CH04 지도성이론","t":"도덕적 지도성 의의","q":"도덕적 지도성의 의의로 옳은 것은?","opts":["전문직업적 사회화, 목적설정과 공유가치, 동료의식과 상호의존성은 추종자들이 일에 헌신하도록 하는 데 필요한 규범적 권력을 제공하여 이완구조를 가진 학교에서 통제문제를 해결할 수 있도록 하고 궁극적으로 교사들을 추종자에서 자기관리자로 변혁시킬 수 있음 / 행정가들은 지시적인 대인적 지도성을 발휘하는 대신 교사들로 하여금 지도자가 되도록 자극하고 조건을 확립하는 데 노력을 투자할 수 있게 됨","지도자의 영향력이 극단적인 상황에서 가장 효과적임을 밝힘 / 상황의 호의성 개념을 도입함","구성원의 성숙도에 따라 지도성 유형을 달리해야 함을 밝힘 / 위임형 지도성의 근거를 제공함","의사결정에서 초합리성의 역할을 인정함 / 창의적 의사결정을 정당화함"],"a":0,"exp":"도덕적 지도성의 의의는 ① 전문직업적 사회화, 목적설정과 공유가치, 동료의식과 상호의존성은 추종자들이 일에 헌신하도록 하는 데 필요한 규범적 권력을 제공하여 이완구조를 가진 학교에서 통제문제를 해결할 수 있도록 하고 궁극적으로 교사들을 추종자에서 자기관리자로 변혁시킬 수 있음, ② 행정가들은 지시적인 대인적 지도성을 발휘하는 대신 교사들로 하여금 지도자가 되도록 자극하고 조건을 확립하는 데 노력을 투자할 수 있게 됨이다.","id":"haengjeong-m152"},{"ch":"CH04 지도성이론","t":"교육지도성","q":"교육지도성의 개념과 교육지도자의 권위가 인정받기 위한 조건으로 옳은 것은?","opts":["개념: '교육을 위한 지도성'으로 교육자가 교육자로서의 권위와 기술을 발휘하여 구성원의 배움을 자극하고 학교 또는 특정 조직을 학습공동체로 만드는 활동 / 조건: 자기학습에 철저하고 타인의 배움에 도움을 줄 때 인정받을 수 있음","개념: 지도성이 구성원 전부에게 분산되어 있다고 여기는 지도성 / 조건: 비위계적 조직구조","개념: 인간의 가치와 의미추구 욕구를 만족시키는 지도성 / 조건: 전통과 문화의 창조","개념: 구성원을 셀프리더로 성장시키는 리더십 / 조건: 높은 수준의 자율성 부여"],"a":0,"exp":"교육지도성은 '교육을 위한 지도성'으로, 교육자가 교육자로서의 권위와 기술을 발휘하여 구성원의 배움을 자극하고 학교 또는 특정 조직을 학습공동체로 만드는 활동이다. 교육지도자의 권위가 인정받기 위한 조건은 자기학습에 철저하고 타인의 배움에 도움을 줄 때 인정받을 수 있다는 것이다.","id":"haengjeong-m153"},{"ch":"CH04 지도성이론","t":"교육지도성 구성요소","q":"교육지도성의 구성요소에 해당하지 않는 것은?","opts":["상황의 호의성 판단능력","자기학습 / 목적의식","교육프로그램 개발능력 / 인간관계능력","기술적(관리적) 능력 / 문화형성능력"],"a":0,"exp":"교육지도성의 구성요소는 ① 자기학습, ② 목적의식, ③ 교육프로그램 개발능력, ④ 인간관계능력, ⑤ 기술적(관리적) 능력, ⑥ 문화형성능력이다.","id":"haengjeong-m154"},{"ch":"CH05 정책론","t":"의사소통의 기능","q":"의사소통의 기능에 해당하지 않는 것은?","opts":["갈등조성의 수단: 구성원 간 견제를 유발하여 조직의 긴장수준을 높임","조정 및 통제의 수단: 구성원의 행동을 일사분란하게 하고 질서를 확보하며, 직무와 관련하여 책임과 권한의 소재를 명확하게 규정함","합리적 의사결정의 수단: 의사소통을 통해 의사결정 과정에 참여하고 그 내용이 정확ㆍ신속ㆍ적절하며 정보의 질이 우수할 경우 의사결정의 수준을 높임","사기 증진 및 동기유발: 구성원을 자극하고 격려함으로써 구성원의 동기유발, 사기증진, 조직목표 달성을 위한 구성원 간의 협동이나 몰입을 불러일으킬 수 있음"],"a":0,"exp":"의사소통의 기능은 ① 조정 및 통제의 수단, ② 합리적 의사결정의 수단, ③ 조직 통솔과 리더십의 발휘(구성원을 통솔하고 조직목표에의 공헌과 추종을 유도함), ④ 사기 증진 및 동기유발이다.","id":"haengjeong-m155"},{"ch":"CH05 정책론","t":"의사소통의 원칙","q":"의사소통의 원칙 중 '분포성의 원칙'과 '적응성(융통성)의 원칙'에 대한 설명으로 옳은 것은?","opts":["분포성의 원칙: 의사소통이 시작되는 지점에서 목적지까지 모든 정보가 의사소통의 대상에게 골고루 도달되어야 함 / 적응성(융통성)의 원칙: 구체적인 상황에 적응할 수 있는 현실 적합성","분포성의 원칙: 구체적인 상황에 적응할 수 있는 현실 적합성 / 적응성의 원칙: 정보가 골고루 도달되어야 함","분포성의 원칙: 정보의 양을 최소화해야 함 / 적응성의 원칙: 의사소통 경로를 단일화해야 함","분포성의 원칙: 상하 간 위계를 지켜야 함 / 적응성의 원칙: 의사소통을 문서로 해야 함"],"a":0,"exp":"분포성의 원칙은 의사소통이 시작되는 지점에서 목적지까지 모든 정보가 의사소통의 대상에게 골고루 도달되어야 한다는 것이고, 적응성(융통성)의 원칙은 구체적인 상황에 적응할 수 있는 현실 적합성을 의미한다.","id":"haengjeong-m156"},{"ch":"CH05 정책론","t":"수평적 의사소통","q":"수평적 의사소통의 장애요인과 해결방안, 장점과 단점으로 옳은 것은?","opts":["장애요인: 조직의 목표 대신 부서의 목표달성에만 초점을 두는 문화, 전문가의 편견, 수평적 관계의 낮은 영향력으로 인한 수평적 관계 경시현상 등 / 해결방안: 목표관리방법 등을 도입함 / 장점: 구성원 간 또는 부서 간에 나타날 수 있는 대립이나 이해관계를 효과적으로 조정하는 역할을 함 / 단점: 수평적 의사소통의 지나친 강조는 비공식집단이나 압력단체를 형성해 다른 부서와 원활한 협조체계를 저해하거나 조직의 위계질서를 파괴할 수 있음","장애요인: 상관의 권위 손상 / 해결방안: 위계질서 강화 / 장점: 신속한 전달 / 단점: 책임소재 불분명","장애요인: 책임소재가 불분명함 / 해결방안: 공식적 통로 강화 / 장점: 융통성이 높음 / 단점: 조정ㆍ통제가 곤란함","장애요인: 정보과다 / 해결방안: 정보전달 억제 / 장점: 긴장 극복 / 단점: 공식적 의사소통 기능의 마비"],"a":0,"exp":"수평적 의사소통의 장애요인은 조직의 목표 대신 부서의 목표달성에만 초점을 두는 문화, 전문가의 편견, 수평적 관계의 낮은 영향력으로 인한 수평적 관계 경시현상 등이며, 해결방안은 목표관리방법 등을 도입하는 것이다. 장점은 구성원 간 또는 부서 간에 나타날 수 있는 대립이나 이해관계를 효과적으로 조정하는 역할을 하는 것이고, 단점은 수평적 의사소통의 지나친 강조가 비공식집단이나 압력단체를 형성해 다른 부서와 원활한 협조체계를 저해하거나 조직의 위계질서를 파괴할 수 있다는 것이다.","id":"haengjeong-m157"},{"ch":"CH05 정책론","t":"비공식적 의사소통 수단","q":"비공식적 의사소통의 수단으로 옳은 것은?","opts":["개별적인 인간적 만남, 각종 친목회에서의 의견 교환, 조직 내 소문","공문서 시행, 학교운영위원회 회의록","교직원 회의, 부서별 업무보고","교육청 공지사항, 학교 홈페이지 공고"],"a":0,"exp":"비공식적 의사소통의 수단은 개별적인 인간적 만남, 각종 친목회에서의 의견 교환, 조직 내 소문이다.","id":"haengjeong-m158"},{"ch":"CH05 정책론","t":"비공식적 의사소통 장점","q":"비공식적 의사소통의 장점으로 옳지 않은 것은?","opts":["책임소재가 분명하여 조정ㆍ통제가 용이함","신속하게 전달이 이루어지며 외적으로 나타나지 않는 배후사정을 소상히 전달함","긴장과 소외감을 극복하고 개인적인 욕구를 충족할 수 있으며 행동의 통일성을 확보할 수 있음","관리자에 대한 조언의 역할이 가능하고 의견교환의 융통성이 높으며 공식적 전달을 보완할 수 있음"],"a":0,"exp":"비공식적 의사소통의 단점은 책임소재가 불분명함, 개인적 목적에 역이용될 수 있음, 공식적 의사소통 기능의 마비, 수직적 계층에서 상관의 권위 손상, 조정ㆍ통제가 곤란함이다. 장점은 신속한 전달, 배후사정의 소상한 전달, 긴장과 소외감 극복 및 개인적 욕구 충족, 행동의 통일성 확보, 관리자에 대한 조언 역할 가능, 의견교환의 융통성, 공식적 전달의 보완이다.","id":"haengjeong-m159"},{"ch":"CH05 정책론","t":"비공식적 의사소통 단점","q":"비공식적 의사소통의 단점으로 옳은 것은?","opts":["책임소재가 불분명함 / 개인적 목적에 역이용될 수 있음 / 공식적 의사소통 기능의 마비 / 수직적 계층에서 상관의 권위 손상 / 조정ㆍ통제가 곤란함","신속하게 전달이 이루어짐 / 의견교환의 융통성이 높음","공식적 전달을 보완할 수 있음 / 행동의 통일성을 확보할 수 있음","긴장과 소외감을 극복함 / 관리자에 대한 조언의 역할 가능"],"a":0,"exp":"비공식적 의사소통의 단점은 책임소재가 불분명함, 개인적 목적에 역이용될 수 있음, 공식적 의사소통 기능의 마비, 수직적 계층에서 상관의 권위 손상, 조정ㆍ통제가 곤란함이다.","id":"haengjeong-m160"},{"ch":"CH05 정책론","t":"조하리의 창 자기공개·피드백","q":"조하리(Johari)의 창에서 자기공개와 피드백의 개념으로 옳은 것은?","opts":["자기공개: 자신의 입장을 분명하게 보여주고 남에게 자신을 보여줌으로써 타인으로 하여금 나를 알 수 있도록 하는 행위 / 피드백: 나에 대한 정보를 타인을 통해 얻게 되는 행위","자기공개: 나에 대한 정보를 타인을 통해 얻게 되는 행위 / 피드백: 자신의 입장을 분명하게 보여주는 행위","자기공개: 타인의 의견을 수용하는 행위 / 피드백: 타인을 평가하는 행위","자기공개: 자신에 대한 견해를 표명하지 않는 행위 / 피드백: 타인에게 방어적 태도를 취하는 행위"],"a":0,"exp":"자기공개는 자신의 입장을 분명하게 보여주고 남에게 자신을 보여줌으로써 타인으로 하여금 나를 알 수 있도록 하는 행위이며, 피드백은 나에 대한 정보를 타인을 통해 얻게 되는 행위이다.","id":"haengjeong-m161"},{"ch":"CH05 정책론","t":"조하리의 창 개방적 영역","q":"조하리(Johari)의 창에서 '개방적 영역(민주형)'에 대한 설명으로 옳은 것은?","opts":["자신의 정보가 자신이나 타인에게 잘 알려짐 ⇒ 개방적인 상호작용으로 효과적인 의사소통이 가능한 영역","자신은 타인에게 잘 알려져 있지만 자기 스스로는 잘 모름","자신은 스스로를 잘 알고 있지만 타인에게는 알려져 있지 않음","자기 스스로와 타인에게 모두 알려지지 않음"],"a":0,"exp":"개방적 영역(민주형)은 자신의 정보가 자신이나 타인에게 잘 알려져 개방적인 상호작용으로 효과적인 의사소통이 가능한 영역이다.","id":"haengjeong-m162"},{"ch":"CH05 정책론","t":"조하리의 창 맹목적 영역","q":"조하리(Johari)의 창에서 '맹목적 영역(독단형)'에 대한 설명으로 옳은 것은?","opts":["자신은 타인에게 잘 알려져 있지만 자기 스스로는 잘 모름 ⇒ 타인으로부터 자신에 대한 의견을 알지 못할 때 의사소통에서 자신의 주장을 앞세우고 타인의 의견은 불신ㆍ비판하여 수용하지 않는 영역","자신의 정보가 자신이나 타인에게 잘 알려짐","자신은 스스로를 잘 알고 있지만 타인에게는 알려져 있지 않음","자기 스스로와 타인에게 모두 알려지지 않음"],"a":0,"exp":"맹목적 영역(독단형)은 자신은 타인에게 잘 알려져 있지만 자기 스스로는 잘 모르는 영역으로, 타인으로부터 자신에 대한 의견을 알지 못할 때 의사소통에서 자신의 주장을 앞세우고 타인의 의견은 불신ㆍ비판하여 수용하지 않는 영역이다.","id":"haengjeong-m163"},{"ch":"CH05 정책론","t":"조하리의 창 잠재적 영역","q":"조하리(Johari)의 창에서 '잠재적 영역(과묵형)'에 대한 설명으로 옳은 것은?","opts":["자신은 스스로를 잘 알고 있지만 타인에게는 알려져 있지 않음 ⇒ 타인이 취하는 자신에 대한 반응을 예측할 수 없어 타인에게 방어적인 태도를 취함","자신은 타인에게 잘 알려져 있지만 자기 스스로는 잘 모름","자신의 정보가 자신이나 타인에게 잘 알려짐","자기 스스로와 타인에게 모두 알려지지 않음"],"a":0,"exp":"잠재적 영역(과묵형)은 자신은 스스로를 잘 알고 있지만 타인에게는 알려져 있지 않은 영역으로, 타인이 취하는 자신에 대한 반응을 예측할 수 없어 타인에게 방어적인 태도를 취한다.","id":"haengjeong-m164"},{"ch":"CH05 정책론","t":"조하리의 창 미지의 영역","q":"조하리(Johari)의 창에서 '미지의 영역(폐쇄형)'에 대한 설명과 이 이론의 시사점으로 옳은 것은?","opts":["자기 스스로와 타인에게 모두 알려지지 않음 ⇒ 자신에 대한 견해를 표명하지도 수 있는 가장 합리적인 대안을 선택하는 것이다. 특징은 계량적 방법 강조, 객관적ㆍ합리적인 선택을 강조하는 것이며, 한계는 인간의 합리성을 전제하고 있다는 점에서 이상적ㆍ비현실적인 모형이라는 것이다.","id":"haengjeong-m168"},{"ch":"CH05 정책론","t":"만족모형","q":"만족모형의 개념, 특징, 한계로 옳은 것은?","opts":["개념: 인간의 제한된 합리성을 인식하고 사회ㆍ심리적 측면을 고려해서 의사결정 시 최적의 대안을 선택하기보다는 만족할 만한 대안을 선택한다는 것을 강조 / 특징: 최선은 최고가 아니라 '만족스러운 상태'를 의미하며, 일정 수준의 만족할 만한 기준을 정해놓고 고려 가능한 대안들만을 모색한 후 주관적ㆍ현실적 수준에서 의사결정을 내림 / 한계: 만족화 기준을 형성하는 척도가 의사결정자의 주관에 의존하며, 혁신적ㆍ창의적 문제해결방안을 기대하기 어려움","개념: 모든 대안을 포괄적으로 탐색ㆍ평가함 / 특징: 계량적 방법 강조 / 한계: 이상적ㆍ비현실적","개념: 이전의 상태보다 다소 향상된 대안을 추구 / 특징: 변화에 따른 충격 최소화 / 한계: 보수적","개념: 문제, 해결책, 선택기회, 참여자가 우연히 결합할 때 결정이 이루어짐 / 특징: 우연성에 기초 / 한계: 예측 곤란"],"a":0,"exp":"만족모형의 개념은 인간의 제한된 합리성을 인식하고 사회ㆍ심리적 측면을 고려해서 의사결정 시 (최적의 대안을 선택하기보다는) 만족할 만한 대안을 선택한다는 것을 강조하는 것이다. 특징은 최선이 최고가 아니라 '만족스러운 상태'를 의미하며 일정 수준의 만족할 만한 기준을 정해놓고 고려 가능한 대안들만을 모색한 후 주관적ㆍ현실적 수준에서 의사결정을 내리는 것이고, 한계는 만족화 기준을 형성하는 척도가 의사결정자의 주관에 의존하고 혁신적ㆍ창의적 문제해결방안을 기대하기 어렵다는 것이다.","id":"haengjeong-m169"},{"ch":"CH05 정책론","t":"점증모형","q":"점증모형의 개념, 장점, 단점으로 옳은 것은?","opts":["개념: 의사결정 시 현실을 긍정하고 이전의 상태보다 다소 향상된 대안을 추구 / 장점: 실제 교육조직이 처한 상황이나 여건을 충분히 고려해 기존 정책과 일관성을 찾고 변화에 따른 충격을 최소화할 수 있으며, 현재 수준보다 더 나은 개선책을 모색할 수 있음 / 단점: (과거 관례나 기존 정책을 바탕으로 구체적ㆍ실제적 소수의 대안들을 비교해 나가는 방식으로) 보수적ㆍ소극적임","개념: 모든 대안을 포괄적으로 탐색ㆍ평가함 / 장점: 객관적ㆍ합리적 / 단점: 비현실적","개념: 만족할 만한 대안을 선택 / 장점: 현실적 / 단점: 주관에 의존","개념: 기본 방향은 포괄적으로, 특별한 부분만 면밀히 검토 / 장점: 합리성과 보수성의 혼합 / 단점: 과정이 불분명"],"a":0,"exp":"점증모형의 개념은 의사결정 시 현실을 긍정하고 이전의 상태보다 다소 향상된 대안을 추구하는 것이다. 장점은 실제 교육조직이 처한 상황이나 여건을 충분히 고려해 기존 정책과 일관성을 찾고 변화에 따른 충격을 최소화할 수 있으며 현재 수준보다 더 나은 개선책을 모색할 수 있다는 것이고, 단점은 과거 관례나 기존 정책을 바탕으로 구체적ㆍ실제적 소수의 대안들을 비교해 나가는 방식으로 보수적ㆍ소극적이라는 것이다.","id":"haengjeong-m170"},{"ch":"CH05 정책론","t":"혼합모형","q":"혼합모형의 개념, 장점, 단점으로 옳은 것은?","opts":["개념: 기본적인 방향설정과 전체의 윤곽은 광범위하게 포괄적으로 검토하고(합리모형), 특별한 관심을 기울여야 할 부분만 면밀하게 검토(점증모형)하여 결정하는 방식으로 합리모형과 점증모형의 장점을 혼합한 방식 / 장점: 합리모형의 이성적 요소와 점증모형의 보수적 특성을 적절히 혼합함 / 단점: 의사결정 과정이 다소 불분명하고, 의사결정자의 기본방향에 대한 통제를 제외하면 점증모형과 크게 다르지 않음","개념: 합리성과 초합리성을 동시에 고려하는 최적치를 추구 / 장점: 창의적 의사결정 정당화 / 단점: 초합리성에 의존","개념: 만족할 만한 대안을 선택 / 장점: 현실적 / 단점: 창의성 부족","개념: 우연한 사건을 계기로 요소들이 결합 / 장점: 현실 설명력 / 단점: 예측 곤란"],"a":0,"exp":"혼합모형의 개념은 기본적인 방향설정과 전체의 윤곽은 광범위하게 포괄적으로 검토하고(합리모형), 특별한 관심을 기울여야 할 부분만 면밀하게 검토(점증모형)하여 결정하는 방식으로 합리모형과 점증모형의 장점을 혼합한 방식이다. 장점은 합리모형의 이성적 요소와 점증모형의 보수적 특성을 적절히 혼합한다는 것이고, 단점은 의사결정 과정이 다소 불분명하고 의사결정자의 기본방향에 대한 통제를 제외하면 점증모형과 크게 다르지 않다는 것이다.","id":"haengjeong-m171"},{"ch":"CH05 정책론","t":"최적모형 개념·특징","q":"최적모형의 개념과 특징으로 옳은 것은?","opts":["개념: 합리모형과 점증모형의 절충을 시도하고 있다는 점에서 혼합모형과 유사하나 양자의 단순 혼합이 아니라 합리성과 초합리성을 동시에 고려하는 최적치를 추구하는 규범적 모형 / 특징: 의사결정은 때때로 초합리적인 직관, 판단, 창의 등과 같은 잠재적 의식이 개입되어 이루어진다는 점에서 초합리적 과정을 의사결정에서 필수불가결한 역할로 파악함","개념: 기본 방향은 포괄적으로 검토하고 특별한 부분만 면밀히 검토함 / 특징: 합리모형과 점증모형의 단순 혼합","개념: 만족할 만한 대안을 선택 / 특징: 제한된 합리성","개념: 조직화된 무정부상태에서 우연한 결합으로 결정이 이루어짐 / 특징: 우연성에 기초"],"a":0,"exp":"최적모형은 합리모형과 점증모형의 절충을 시도하고 있다는 점에서 혼합모형과 유사하나 양자의 단순 혼합이 아니라 합리성과 초합리성을 동시에 고려하는 최적치를 추구하는 규범적 모형이다. 특징은 ① 의사결정은 때때로 초합리적인 직관, 판단, 창의 등과 같은 잠재적 의식이 개입되어 이루어진다는 점에서 초합리적 과정을 의사결정에서 필수불가결한 역할로 파악함, ② 의사결정 시 비현실적인 것이라 해도 항상 가능성을 찾아 합리적 측면을 발견하고 그것이 최적인 것인지 확인함이다.","id":"haengjeong-m172"},{"ch":"CH05 정책론","t":"최적모형 장단점","q":"최적모형의 장점과 단점으로 옳은 것은?","opts":["장점: 그동안 비합리성으로 배제해 온 요인들도 최적의 의사결정을 위한 핵심 요소가 될 수 있음을 확인함으로써 창의적ㆍ혁신적 의사결정을 정당화할 수 있는 이론적 근거 마련 / 단점: 달성방법이 명확하지 않고 개념도 불명료한 초합리성에 의존하고 있어서 비현실적이고 이상적임","장점: 변화에 따른 충격을 최소화함 / 단점: 보수적ㆍ소극적임","장점: 객관적ㆍ합리적 선택 강조 / 단점: 인간의 합리성을 전제함","장점: 현실적 수준에서 의사결정을 내림 / 단점: 의사결정자의 주관에 의존함"],"a":0,"exp":"최적모형의 장점은 그동안 비합리성으로 배제해 온 요인들도 최적의 의사결정을 위한 핵심 요소가 될 수 있음을 확인함으로써 창의적ㆍ혁신적 의사결정을 정당화할 수 있는 이론적 근거를 마련한 것이고, 단점은 달성방법이 명확하지 않고 개념도 불명료한 초합리성에 의존하고 있어서 비현실적이고 이상적이라는 것이다.","id":"haengjeong-m173"},{"ch":"CH05 정책론","t":"쓰레기통모형 개념","q":"쓰레기통모형의 개념으로 옳은 것은?","opts":["조직화된 무정부상태에서 '문제, 해결책, 선택기회, 참여자'라는 네 가지 요소가 독자적으로 움직이다가 어떤 우연한 사건을 계기로 교차하여 결합할 때 결정이 이루어지는 상황","합리성과 초합리성을 동시에 고려하는 최적치를 추구하는 규범적 모형","현실을 긍정하고 이전의 상태보다 다소 향상된 대안을 추구하는 모형","모든 대안을 포괄적으로 탐색ㆍ평가하여 가장 합리적인 대안을 선택하는 모형"],"a":0,"exp":"쓰레기통모형은 조직화된 무정부상태에서 '문제, 해결책, 선택기회, 참여자'라는 네  예측하고 이를 충족시킬 수 있도록 교육적 측면의 공급을 조절하는 것이다. 장점은 ① 교육과 취업, 나아가 교육과 경제성장을 보다 긴밀하게 연결하여 교육계획을 수립할 수 있음, ② 교육운영에서 낭비를 줄여 효율성을 높일 수 있음이며, 단점은 ① 교육과 취업이 반드시 1:1의 대응관계를 갖지 않고 급변하는 사회에서는 교육수요나 인력수요의 구조도 급변하기 때문에 추정 자체가 어려움, ② 교육과 취업 간의 시차 때문에 수급 측면에서 차질을 빚기 쉽고 예측의 어려움 등으로 기술상 많은 어려움이 있음이다.","id":"haengjeong-m187"},{"ch":"CH05 정책론","t":"수익률 접근방법","q":"수익률에 의한 접근방법의 개념, 장점, 단점으로 옳은 것은?","opts":["개념: 교육을 투자로 보고 그 투자에 대한 경제적 효과를 분석하는 방법 / 장점: 교육운영의 경제적 효율성을 제고시킬 수 있고, 비용-수익 분석을 통해 교육투자의 합리성을 제고할 수 있음 / 단점: 교육투입과 교육산출을 계산하는 방식이 너무 다양해 측정이 용이하지 않고, 수익률 계산에 따르는 어려움과 과거의 소득을 가지고 미래의 소득을 추정하는 기법 자체에 문제가 있음","개념: 인력수요를 예측하여 교육공급을 조절함 / 장점: 교육과 취업의 연결 / 단점: 추정의 어려움","개념: 모든 사람에게 교육기회를 부여함 / 장점: 사회적 안정 기여 / 단점: 교육의 질 하락","개념: 국제비교를 통해 기획함 / 장점: 참고 용이 / 단점: 맥락 차이"],"a":0,"exp":"수익률에 의한 접근방법은 교육을 투자로 보고 그 투자에 대한 경제적 효과를 분석하는 방법이다. 장점은 ① 교육운영의 경제적 효율성을 제고시킬 수 있음, ② 비용-수익 분석을 통해 교육투자의 합리성을 제고할 수 있음이며, 단점은 ① 교육투입과 교육산출을 계산하는 방식이 너무 다양해 측정이 용이하지 않음, ② 수익률 계산에 따르는 어려움과 과거의 소득을 가지고 미래의 소득을 추정하는 기법 자체에 문제가 있음이다.","id":"haengjeong-m188"},{"ch":"CH05 정책론","t":"교육기획의 효과","q":"교육기획의 효과로 옳지 않은 것은?","opts":["미래에 대한 정확한 예측이 가능하여 불확실성을 완전히 제거할 수 있음","교육정책 수행과 교육행정의 안정화에 기여함","교육행정 또는 교육경영의 효율성과 타당성을 높일 수 있음","한정된 재원을 합리적으로 배분할 수 있도록 해줌"],"a":0,"exp":"교육기획의 효과는 ① 교육정책 수행과 교육행정의 안정화에 기여함, ② 교육행정 또는 교육경영의 효율성과 타당성을 높일 수 있음, ③ 한정된 재원을 합리적으로 배분할 수 있도록 해줌이다. 미래 예측의 한계는 오히려 교육기획의 한계에 해당한다.","id":"haengjeong-m189"},{"ch":"CH05 정책론","t":"교육기획의 한계","q":"교육기획의 한계로 옳은 것은?","opts":["미래에 대한 정확한 예측을 기반으로 하는데 인간의 합리성에는 한계가 있기 때문에 미래 예측에 한계가 있음 / 교육계획 수립을 위하여 교육현황 등에 대한 다양한 정보와 자료가 필요한데 정확하고 적절한 정보와 자료의 취득에는 한계가 있음","교육정책 수행과 교육행정의 안정화에 기여함 / 한정된 재원을 합리적으로 배분할 수 있음","자원배분에 관한 의사결정을 일관성 있게 함 / 다년도 예산을 기본으로 함","회계책임을 분명히 할 수 있음 / 사전ㆍ사후 통제가 가능함"],"a":0,"exp":"교육기획의 한계는 ① 미래에 대한 정확한 예측을 기반으로 하는데 인간의 합리성에는 한계가 있기 때문에 미래 예측에 한계가 있음, ② 교육계획 수립을 위하여 교육현황 등에 대한 다양한 정보와 자료가 필요한데 정확하고 적절한 정보와 자료의 취득에는 한계가 있음, ③ 각종 예측과 추정을 위해 여러 가지 상황을 전제하는데 급변하는 현대사회에서 이러한 전제 설정은 매우 어렵고, 전제를 설정하더라도 변화를 예상하기 어려움이다.","id":"haengjeong-m190"},{"ch":"CH06 교원인사행정론","t":"단위학교중심연수","q":"단위학교중심연수의 개념과 구체적인 방안으로 옳은 것은?","opts":["개념: 단위학교를 중심으로 계획을 수립하여 실시하는 연수 / 방안: 전문적 학습공동체, 컨설팅장학, 교내자율장학 중 임상장학ㆍ동료장학 등, 교사 간 워크숍, 전문성을 갖춘 교사(수석교사 등)의 특강을 기반으로 한 자체연수 등, 교사 간 마이크로티칭, 교사 간 수업연구, 교사협의회 등","개념: 연수기관을 중심으로 실시하는 집합연수 / 방안: 원격연수, 직무연수","개념: 교육청 단위에서 실시하는 연수 / 방안: 소지구 컨설팅장학","개념: 교사가 개인적으로 실시하는 연수 / 방안: 대학원 진학"],"a":0,"exp":"단위학교중심연수는 단위학교를 중심으로 계획을 수립하여 실시하는 연수이다. 방안은 ① 전문적 학습공동체, 컨설팅장학, 교내자율장학 중 임상장학, 동료장학 등, ② 교사 간 워크숍, 전문성을 갖춘 교사(수석교사 등)의 특강을 기반으로 한 자체연수 등, ③ 교사 간 마이크로티칭, 교사 간 수업연구, 교사협의회 등이다.","id":"haengjeong-m191"},{"ch":"CH06 교원인사행정론","t":"연수기관중심 현직연수 문제점","q":"연수기관중심 현직연수의 문제점으로 옳은 것은?","opts":["교사의 단순 연수시간은 교수학습 개선에 유의미한 영향을 미치지 못함 / 불확실한 연수목적, 경직된 연수기회와 여건, 현실성이 부족한 연수내용, 획일적인 연수방법, 비합리적인 연수일정과 운영 등","교사가 자율적으로 팀을 구성하여 연수함으로써 체계성이 떨어짐","연수내용이 학교 단위의 특수성을 지나치게 반영함","연수 참여자의 자발성이 지나치게 높아 통제가 어려움"],"a":0,"exp":"연수기관중심 현직연수의 문제점은 ① 교사의 단순 연수시간은 교수학습 개선에 유의미한 영향을 미치지 못함, ② 불확실한 연수목적, 경직된 연수기회와 여건, 현실성이 부족한 연수내용, 획일적인 연수방법, 비합리적인 연수일정과 운영 등이다.","id":"haengjeong-m192"},{"ch":"CH06 교원인사행정론","t":"학습모델 연수방안","q":"현직연수가 학습모델로 가기 위한 연수방안으로 옳지 않은 것은?","opts":["연수내용을 전국적으로 표준화하여 획일적으로 운영해야 함","교사들이 스스로 교직에 대한 비전과 가치관을 확립할 수 있어야 함","현직연수의 내용은 학교 단위의 특수성이 반영되어야 함","교사가 자율적으로 팀을 구성하여 연수하는 자율적인 연수풍토를 조성해야 함"],"a":0,"exp":"학습모델로 가기 위한 연수방안은 ① 교사들이 스스로 교직에 대한 비전과 가치관을 확립할 수 있어야 함, ② 현직연수의 내용은 학교 단위의 특수성이 반영되어야 함, ③ 교사가 자율적으로 팀을 구성하여 연수하는 자율적인 연수풍토를 조성해야 함이다.","id":"haengjeong-m193"},{"ch":"CH06 교원인사행정론","t":"학습공동체 개념","q":"학습공동체의 개념과 이를 통해 교원역량 개발이 이루어지는 양상으로 옳은 것은?","opts":["개념: 학습에 대한 교사 간의 공유된 가치와 교수ㆍ학습활동에 관련한 교사들의 풍부한 대화 및 협동을 근간으로 하는 전문적 집단 / 양상: 전문적 대화, 전문적 협력활동, 교육활동 목표 공유, 교사지도성 함양","개념: 교육청 단위에서 이루어지는 컨설팅 집단 / 양상: 진단, 대안수립, 해결과정 지원","개념: 경험 있는 교사가 1:1로 지원하는 장학활동 / 양상: 멘토 지원, 정기교육","개념: 단위학교 내에서 교장ㆍ교감이 행하는 지도ㆍ조언활동 / 양상: 임상장학, 약식장학"],"a":0,"exp":"학습공동체는 학습에 대한 교사 간의 공유된 가치와 교수ㆍ학습활동에 관련한 교사들의 풍부한 대화 및 협동을 근간으로 하는 전문적 집단이다. 학습공동체를 통해 교원역량 개발이 이루어지는 양상은 ① 전문적 대화, ② 전문적 협력활동, ③ 교육활동 목표 공유, ④ 교사지도성 함양이다.","id":"haengjeong-m194"},{"ch":"CH06 교원인사행정론","t":"학습공동체 효과","q":"학습공동체의 효과로 옳은 것은?","opts":["동료교사와의 교육활동에 관한 일상적 대화를 통하여 자신의 교수ㆍ학습의 실제에 대해 성찰할 수 있는 기회를 갖게 됨 / 교수ㆍ학습에 관한 이론과 방법, 학생에 대한 가정에 대해 다시 생각해 보게 되고 이는 교수ㆍ학습의 향상으로 이어짐 / 교육활동에 관한 목표 공유를 통해 공동체의식을 높이고, 교사공동체를 통해 교사리더십을 함양시킬 수 있음","교사의 연수시간을 획일적으로 확보하여 형평성을 높임","교사 개인의 자율성을 제한하여 조직의 통제력을 높임","교사의 승진 가능성을 높여 외적 보상을 강화함"],"a":0,"exp":"학습공동체의 효과는 ① 동료교사와의 교육활동에 관한 일상적 대화를 통하여 자신의 교수ㆍ학습의 실제에 대해 성찰할 수 있는 기회를 갖게 됨, ② 교수ㆍ학습에 관한 이론과 방법, 학생에 대한 가정에 대해 다시 생각해 보게 되고 이는 교수ㆍ학습의 향상으로 이어짐, ③ 교육활동에 관한 목표 공유를 통해 공동체의식을 높이고 교사공동체를 통해 교사리더십을 함양시킬 수 있음이다.","id":"haengjeong-m195"},{"ch":"CH07 장학론","t":"장학의 기능","q":"장학의 기능에 해당하지 않는 것은?","opts":["교원의 근무성적을 평정하여 인사관리의 자료로 활용하는 기능","교원의 성장ㆍ발달을 돕는 기능: 교원으로 하여금 교직생활과 관련된 제반 영역에서 필요한 가치관, 신념, 태도, 지식, 기능, 행동 등을 갖추도록 도와주는 기능","교육과정 운영의 효율화를 돕는 기능: 교육목적을 달성하기 위하여 학생에게 제공되는 교육내용 및 교육활동에 대한 개발, 운영, 평가에 있어서 효과를 높이도록 도와주는 기능","학교경영의 합리화를 돕는 기능: 학교체제 내 인적ㆍ물적ㆍ재정적 자원을 효과적으로 유지ㆍ통합ㆍ운영하고 제반 교육활동 기능을 최적화하도록 도와주는 기능"],"a":0,"exp":"장학의 기능은 ① 교원의 성장ㆍ발달을 돕는 기능, ② 교육과정 운영의 효율화를 돕는 기능, ③ 학교경영의 합리화를 돕는 기능이다.","id":"haengjeong-m196"},{"ch":"CH07 장학론","t":"발달장학","q":"발달장학의 개념과 특징으로 옳은 것은?","opts":["개념: 교사의 발달 정도에 따라 다른 장학방법을 적용하여 교사의 발달수준을 높인다는 원리에 근거한 장학 / 특징: 교사의 발달 정도에 따라 장학에 대한 교사 참여 정도를 높임","개념: 교사가 원하는 장학유형을 스스로 선택ㆍ결정할 수 있도록 함 / 특징: 교사마다 장학의 방법이 각기 다름","개념: 교사 개인의 욕구와 학교목적 및 과업을 통합하는 데 중점을 둠 / 특징: 교사의 직무만족도를 중시함","개념: 실제적인 교수행위를 직접 관찰하여 자료를 수집하는 수업장학 / 특징: Y이론의 입장"],"a":0,"exp":"발달장학은 교사의 발달 정도에 따라 다른 장학방법을 적용하여 교사의 발달수준을 높인다는 원리에 근거한 장학이며, 특징은 교사의 발달 정도에 따라 장학에 대한 교사 참여 정도를 높이는 것이다.","id":"haengjeong-m197"},{"ch":"CH07 장학론","t":"글래손 선택적 장학","q":"글래손(Glatthorn)의 선택적 장학의 개념으로 옳은 것은?","opts":["교사의 필요와 상황에 따라 여러 가지 장학유형들 중 교사가 원하는 것을 스스로 선택ㆍ결정할 수 있도록 함(장학의 대상인 교사의 발달수준과 장학의 필요가 교사마다 다르기 때문에 교사에 따라 장학의 방법이 각기 달라야 하기 때문)","교사의 발달 정도에 따라 다른 장학방법을 적용하여 발달수준을 높임","교사 개인의 욕구와 학교목적 및 과업을 통합하는 데 중점을 둠","각 지구 내에 인접한 학교 또는 교원 간의 교육활동 개선을 위하여 상호 협력하는 장학활동"],"a":0,"exp":"글래손의 선택적 장학은 교사의 필요와 상황에 따라 여러 가지 장학유형들 중 교사가 원하는 것을 스스로 선택ㆍ결정할 수 있도록 하는 것이다. 이는 장학의 대상인 교사의 발달수준과 장학의 필요가 교사마다 다르기 때문에 교사에 따라 장학의 방법이 각기 달라야 하기 때문이다.","id":"haengjeong-m198"},{"ch":"CH07 장학론","t":"인간자원장학","q":"서지오바니(Sergiovanni)가 제안한 인간자원장학의 특징으로 옳지 않은 것은?","opts":["교사를 통제의 대상으로 보고 관리자의 지시에 따라 과업을 수행하도록 하는 데 중점을 둠","교사 개인의 욕구와 학교목적 및 과업을 통합하는 데 중점을 둠","교사의 직무만족도를 중시함. 직무만족은 중요하고 의미 있는 일을 성취할 때 생기며 이러한 성취가 학교효과성의 중요한 구성요소가 됨","장학을 통해 교사의 능력을 향상시키면 학생의 능력이 향상되고 궁극적으로 인간자본이 형성될 것이라고 생각함"],"a":0,"exp":"인간자원장학의 특징은 ① 교사 개인의 욕구와 학교목적 및 과업을 통합하는 데 중점을 둠, ② 교사의 직무만족도를 중시함(직무만족은 중요하고 의미 있는 일을 성취할 때 생기며 이러한 성취가 학교효과성의 중요한 구성요소가 됨), ③ 교사는 학교효과성을 증대시키는 잠재가능성과 책임감을 갖고 있다는 점에서 학교경영자는 교사들이 학교목표 달성을 위해 스스로의 능력을 최대한 발휘할 수 있는 환경을 조성해야 함, ④ 장학을 통해 교사의 능력을 향상시키면 학생의 능력이 향상되고 궁극적으로 인간자본이 형성될 것이라고 생각함이다.","id":"haengjeong-m199"},{"ch":"CH07 장학론","t":"지구별자율장학 개념","q":"지구별자율장학의 개념으로 옳은 것은?","opts":["각 지구 내에 인접한 학교 또는 교원 간의 교육활동 개선을 위하여 상호 협력하는 장학활동","단위학교 내에서 교사의 수업개선을 위해 교장, 교감, 부장교사 및 동료교사가 행하는 지도ㆍ조언활동","교사가 자신의 전문성 개발을 위해 동료 간 협동하는 장학","교사 개인이 자신의 전문적인 발달을 위하여 스스로 체계적인 계획을 세우고 실천하는 과정"],"a":0,"exp":"지구별자율장학은 각 지구 내에 인접한 학교 또는 교원 간의 교육활동 개선을 위하여 상호 협력하는 장학활동이다.","id":"haengjeong-m200"},{"ch":"CH07 장학론","t":"지구별자율장학 방안","q":"지구별자율장학의 구체적인 방안으로 옳은 것은?","opts":["학교 간 방문장학: 교육활동 상호 참관(공개보고회, 공개수업 등) 및 교육정보 교환, 학교경영, 학습지도, 특별활동 개선방안 협의 등 / 교육연구활동: 수업 및 평가방법 개선을 위한 공개수업, 교육현장의 문제점ㆍ해결방안 및 공동관심사에 관한 현장연구 발표 등 / 학생생활지도활동: 교내외 생활지도방법 개선 협의, 초ㆍ중ㆍ고등학교 지구별 통합협의회 활동, 연말연시 방학 중 합동 교외지도, 지구별 학생선도협의회 운영, 청소년단체 합동 수련활동 등","임상장학, 동료장학, 자기장학, 약식장학","수업 녹화 후 분석, 학생의 수업평가 분석, 대학원 진학","교내 컨설팅장학, 소지구 컨설팅장학, 진단형 컨설팅장학"],"a":0,"exp":"지구별자율장학은 지구자율장학회별 간사학교가 중심이 되어 지구 내 학교 간 협의를 통하여 장학활동 과제 및 과제별 주관학교를 선정한 후 지역 특성에 맞게 자율적으로 추진한다. 방안은 ① 학교 간 방문장학, ② 교육연구활동, ③ 학생생활지도활동이다.","id":"haengjeong-m201"},{"ch":"CH07 장학론","t":"교내자율장학","q":"교내자율장학의 개념과 운영 방안으로 옳은 것은?","opts":["개념: 단위학교 내에서 교사의 수업개선을 위해 교장, 교감, 부장교사 및 동료교사가 행하는 지도ㆍ조언활동 / 방안: 임상장학, (협동적) 동료장학, 자기장학, 약식장학(일상장학)","개념: 각 지구 내 인접한 학교 또는 교원 간 상호 협력하는 장학활동 / 방안: 학교 간 방문장학, 교육연구활동, 학생생활지도활동","개념: 교사가 원하는 장학유형을 스스로 선택하는 장학 / 방안: 발달장학, 선택적 장학","개념: 경험이 많은 교사가 적은 교사를 1:1로 지원하는 장학 / 방안: 멘토 지원단 조직"],"a":0,"exp":"교내자율장학은 단위학교 내에서 교사의 수업개선을 위해 교장, 교감, 부장교사 및 동료교사가 행하는 지도ㆍ조언활동이다. 방안은 ① 임상장학, ② (협동적) 동료장학, ③ 자기장학, ④ 약식장학(일상장학)이다.","id":"haengjeong-m202"},{"ch":"CH07 장학론","t":"동료장학 개념·특징","q":"동료장학의 개념과 특징으로 옳은 것은?","opts":["개념: 교사가 자신의 전문성 개발을 위해 동료 간 협동하는 장학 / 특징: 교사의 자율성과 협동성을 기초로 함, 학교의 형편과 교사의 필요와 요구에 기초하여 다양하고 융통성 있게 운영됨, 대상 교사ㆍ학생의 장ㆍ단점을 이해하고 실제적 경험을 바탕으로 지도ㆍ조언함","개념: 교사 개인이 스스로 체계적인 계획을 세우고 실천하는 과정 / 특징: 자율성 기초","개념: 실제적인 교수행위를 직접 관찰하여 자료를 수집하는 수업장학 / 특징: 1:1의 친밀한 관계","개념: 경험과 지식이 있는 교사가 멘토를 담당함 / 특징: 학교적응 지원"],"a":0,"exp":"동료장학은 교사가 자신의 전문성 개발을 위해 동료 간 협동하는 장학이다. 특징은 ① 교사의 자율성과 협동성을 기초로 함, ② 학교의 형편과 교사의 필요와 요구에 기초하여 다양하고 융통성 있게 운영됨, ③ 대상 교사, 학생의 장ㆍ단점을 이해하고 실제적 경험을 바탕으로 지도ㆍ조언함이다.","id":"haengjeong-m203"},{"ch":"CH07 장학론","t":"동료장학 장점","q":"동료장학의 장점으로 옳은 것은?","opts":["교사들이 경험을 공유함으로써 교수능력의 향상을 도모할 뿐만 아니라 협동적인 인간관계의 수립을 통해 공동성취감 등을 향상시킴 / 성공적인 수업혁신은 동료관계를 증진시키고, 교사 간의 적극적 인간관계는 교육활동과 교사 전문성 신장에 효과적임","장학담당자와 교사가 1:1의 친밀한 관계 속에서 행해져 심층적인 지도가 가능함","교사가 자기 편의에 따라 시간과 장소를 정할 수 있어 부담이 적음","외부 전문가의 객관적 시각을 통해 문제를 진단할 수 있음"],"a":0,"exp":"동료장학의 장점은 ① 교사들이 경험을 공유함으로써 교수능력의 향상을 도모할 뿐만 아니라 협동적인 인간관계의 수립을 통해 공동성취감 등을 향상시킴, ② 성공적인 수업혁신은 동료관계를 증진시키고 교사 간의 적극적 인간관계는 교육활동과 교사 전문성 신장에 효과적임, ③ 수업개선 전략의 설계와 시행에 대한 책임감 부여는 교사 개인이 수업개선에 공헌할 수 있다는 인정과 성취감을 느끼게 해줄 뿐 아니라 학교개선에도 긍정적 효과를 가져올 수 있음이다.","id":"haengjeong-m204"},{"ch":"CH07 장학론","t":"자기장학 개념","q":"자기장학의 개념으로 옳은 것은?","opts":["교사 개인이 자신의 전문적인 발달을 위하여 스스로 체계적인 계획을 세우고 실천하는 과정","교사가 자신의 전문성 개발을 위해 동료 간 협동하는 장학","단위학교 내에서 교장, 교감, 부장교사가 행하는 지도ㆍ조언활동","장학담당자와 교사 간의 대면적 상호작용 속에서 교사의 행위와 활동을 분석하는 수업장학"],"a":0,"exp":"자기장학은 교사 개인이 자신의 전문적인 발달을 위하여 스스로 체계적인 계획을 세우고 실천하는 과정이다.","id":"haengjeong-m205"},{"ch":"CH07 장학론","t":"자기장학 방법","q":"자기장학의 구체적인 방법에 해당하지 않는 것은?","opts":["장학담당자와의 협의를 통한 수업관찰 전략 수립 및 협의회 개최","수업 녹화 후 분석 / 학생의 수업평가 분석","대학원 진학 / 수업 관련 연수 및 워크숍 참여","수업 관련 전문가의 자문과 조언 / 교내ㆍ외 전문적 학습공동체 참여"],"a":0,"exp":"자기장학의 방법은 ① 수업 녹화 후 분석, ② 학생의 수업평가 분석, ③ 대학원 진학, ④ 수업 관련 연수 및 워크숍 참여, ⑤ 수
