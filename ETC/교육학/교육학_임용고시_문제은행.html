":"CH04 교수방법과 교수매체","t":"팀티칭","q":"효과적인 팀티칭을 위한 고려사항으로 옳은 것은?","opts":["함께 협업하는 교수자 간의 활발한 의사소통과 명확한 수업계획 공유가 진행되어야 하며, 팀을 이룬 교사는 그 팀에 각자 고유하게 공헌할 수 있는 역할을 맡는 것이 필요함","교사들이 각자 독립적으로 수업을 진행해야 함","교사 간 역할을 완전히 동일하게 배분해야 함","한 교사가 모든 결정권을 가져야 함"],"a":0,"exp":"팀티칭의 고려사항은 ①활발한 의사소통과 명확한 수업계획 공유 ②각자 고유하게 공헌할 수 있는 역할 분담이다.","id":"bangbeop-m114"},{"ch":"CH04 교수방법과 교수매체","t":"개별화교수","q":"개별화교수의 개념으로 옳은 것은?","opts":["학습자의 특성에 맞게 교수·학습의 요소들을 조정하여 개별 학습자가 가장 효과적으로 학습할 수 있는 학습환경을 조성하는 교수방법으로, 학습준비도·학습속도·학습양식·흥미·동기 등에 따라 적합한 학습방법을 적용함","모든 학습자에게 동일한 내용을 동일한 속도로 가르치는 교수방법","2인 이상의 교사가 협력하여 지도하는 교수방법","소집단이 협력하여 문제를 해결하는 교수방법"],"a":0,"exp":"개별화교수는 학습자 특성에 맞게 교수·학습 요소들을 조정하여 개별 학습자가 가장 효과적으로 학습할 수 있는 환경을 조성하는 교수방법이다.","id":"bangbeop-m115"},{"ch":"CH04 교수방법과 교수매체","t":"개별화교수","q":"개별화교수의 단점으로 옳은 것은?","opts":["학생 간의 협업이나 의사소통이 단절되어 협동기술, 사회적 기능 발달이 제한되며, 개별 학생의 특성에 맞게 수업자료를 개발하고 수업을 조정하는 것에 많은 시간과 노력이 소요됨","학습자의 독립심과 책임감을 기를 수 없음","교사와 학습자 간 상호작용이 단절됨","학습효과가 증진되지 않음"],"a":0,"exp":"개별화교수의 단점은 협동기술·사회적 기능 발달의 제한과 수업자료 개발·조정에 많은 시간과 노력이 소요된다는 점이다. ②③④는 장점과 반대된다.","id":"bangbeop-m116"},{"ch":"CH04 교수방법과 교수매체","t":"켈러 개별화교수체제","q":"켈러(Keller)의 개별화교수체제(PSI)의 특징으로 옳지 않은 것은?","opts":["모든 학생이 동일한 속도로 학습하도록 통제함","학생은 저마다 다른 자신만의 학습속도에 따라 학습할 수 있음","각 단원의 시험에서 높은 성취도(80~90%)를 요구한다는 점에서 완전학습을 지향함","학생의 학습을 돕고 결과를 평가하고 오답을 교정하는 보조관리자가 존재함"],"a":0,"exp":"켈러의 개별화교수체제는 학생 각자의 학습속도에 따라 학습할 수 있게 하므로 ①은 정반대이다.","id":"bangbeop-m117"},{"ch":"CH04 교수방법과 교수매체","t":"적성처치상호작용","q":"크론바흐(Cronbach)의 적성처치상호작용이론에서 학습결과에 영향을 미치는 요인 2가지로 옳은 것은?","opts":["학습자의 적성, 교사가 진행하는 수업방법","학습자의 동기, 학습환경","교사의 전문성, 학교의 시설","교육과정, 평가방법"],"a":0,"exp":"적성처치상호작용이론에서 학습결과에 영향을 미치는 요인은 ①학습자의 적성 ②교사가 진행하는 수업방법이다.","id":"bangbeop-m118"},{"ch":"CH04 교수방법과 교수매체","t":"적성처치상호작용","q":"크론바흐(Cronbach)의 적성처치상호작용이론의 시사점으로 옳지 않은 것은?","opts":["적성이 높은 학생에게 효과적인 교수방법은 적성이 낮은 학생에게는 전혀 효과가 없으므로 완전히 다른 방법을 써야 함","개별 학습자는 각기 다른 적성을 가지기 때문에 이에 따른 적절한 교수방법을 다르게 활용하면 학업성취를 극대화할 수 있음","학습자 개개인의 적성에 적절하게 수업을 계획하면 개인차에 따른 문제를 줄일 수 있음","적성이 높은 학생에게 효과적인 교수방법은 적성이 낮은 학생에게도 효과가 있기 때문에 다양한 교수변인을 통해 학생 간의 개인차를 줄이는 교수방법을 사용해야 함"],"a":0,"exp":"'적성이 높은 학생에게 효과적인 교수방법은 적성이 낮은 학생에게도 효과가 있다'는 것이 시사점이므로 ①은 정반대이다.","id":"bangbeop-m119"},{"ch":"CH04 교수방법과 교수매체","t":"토의법","q":"토의법의 장점으로 옳지 않은 것은?","opts":["정보의 전달이 매우 빠름","활발한 의사소통을 통해 학습이 이루어지므로 학습자의 적극적인 참여를 유도하기 쉽고 학습동기와 흥미를 유발할 수 있음","자신의 생각을 명료하게 전달하는 의사소통능력을 향상시킬 수 있음","대화를 통해 의견을 조율하고 문제를 해결하면서 사회적 기능을 향상시킬 수 있음"],"a":0,"exp":"'정보의 전달이 매우 늦음'은 단점이므로 ①은 정반대이다.","id":"bangbeop-m120"},{"ch":"CH04 교수방법과 교수매체","t":"토의법","q":"토의법의 단점으로 옳지 않은 것은?","opts":["교수자가 토의수업을 준비하고 진행하는 데 시간과 노력이 거의 들지 않음","소수의 토론자에 의해 토의가 장악될 수 있음","주제에 대한 학습자의 충분한 이해와 진지한 태도가 부족한 경우, 기대한 만큼 학습효과를 거두기 어려울 수 있음","정보의 전달이 매우 늦음"],"a":0,"exp":"'교수자가 토의수업을 준비하고 진행하는 데 많은 시간과 노력이 소요됨'이 단점이므로 ①은 정반대이다.","id":"bangbeop-m121"},{"ch":"CH04 교수방법과 교수매체","t":"배심토의","q":"배심토의(패널)의 개념과 단점으로 옳은 것은?","opts":["상반된 견해를 가진 소수의 배심원과 다수의 일반 청중으로 구성되어 사회자의 진행에 따라 전개하는 토의이며, 단점은 패널 구성원에 따라 학습효과의 차이가 있을 수 있음","2~5명의 전문가가 개인의 입장이나 의견을 발표한 후 질의·토론하는 토의이며, 단점은 수동적 학습이 되기 쉬움","소집단으로 나누어 동시에 토의를 진행하는 방식이며, 단점은 토론이 불분명해질 수 있음","원탁에 둘러앉아 자유롭게 의견을 교환하는 토의이며, 단점은 결론이 나지 않을 가능성이 높음"],"a":0,"exp":"배심토의(패널)는 상반된 견해를 가진 소수의 배심원과 다수의 일반 청중으로 구성되며, 장점은 다양한 의견의 광범위한 수렴·제시, 충분한 준비 시 효과적, 활발한 토의 가능이고 단점은 패널 구성원에 따른 학습효과 차이이다.","id":"bangbeop-m122"},{"ch":"CH04 교수방법과 교수매체","t":"심포지엄","q":"심포지엄(단상토의)의 개념과 단점으로 옳은 것은?","opts":["해당 주제에 대해 2~5명의 전문가가 개인의 입장이나 의견을 발표한 후 사회자의 진행 하에 청중과 발표자 간의 질의 또는 토론이 이루어지며(청중과의 질의 및 토론은 선택사항), 단점은 학생이 토론에 직접적으로 참여하지 않으므로 수동적 학습이 이루어지기 쉽고 연속된 발표로 인해 흥미가 저하될 수 있음","소수의 배심원과 다수 청중으로 구성되는 토의이며, 단점은 패널 구성원에 따른 차이","소집단으로 나누어 동시에 토의하는 방식이며, 단점은 토론이 불분명해질 수 있음","1~3명의 전문가가 공개연설 후 전체 토의를 진행하며, 단점은 산만해질 수 있음"],"a":0,"exp":"심포지엄은 2~5명의 전문가 발표 후 질의·토론이 이루어지며, 장점은 간접학습을 통한 집단학습력 향상과 다양한 전문지식 학습이고 단점은 수동적 학습과 흥미 저하이다.","id":"bangbeop-m123"},{"ch":"CH04 교수방법과 교수매체","t":"버즈토의","q":"버즈(buzz)토의의 진행방식과 장점으로 옳은 것은?","opts":["토의에 참여하는 학생들을 소집단으로 나누고 각 소집단이 동시에 토의를 진행한 후 개별 토의결과를 전체 집단에 발표하고 사회자는 비슷한 집단끼리 토의를 유도하며 이를 정리 및 전체 집단 결론을 내며, 장점은 모두가 토론의 주체가 되어 구성원 전체의 학습참여가 가능하고 소수 인원끼리 토의함으로써 심리적 긴장감을 낮추고 적극적인 토의를 할 수 있음","전문가가 발표한 후 청중이 질의하는 방식이며, 장점은 전문지식 학습","원탁에 둘러앉아 자유롭게 의견을 교환하며, 장점은 민주적 방식","짝을 이루어 논쟁하며, 장점은 찬반양론을 동시에 경험"],"a":0,"exp":"버즈토의는 소집단으로 나누어 동시에 토의한 후 결과를 전체에 발표하고 정리하는 방식이며, 단점은 소집단 토론이 대토론 주제와 직결되지 않으면 토론이 불분명해질 수 있다는 점이다.","id":"bangbeop-m124"},{"ch":"CH04 교수방법과 교수매체","t":"포럼","q":"포럼의 개념으로 옳은 것은?","opts":["1~3명의 전문가가 10~20분간 공개연설을 한 후 사회자가 구성원 전체를 대상으로 토의를 진행하는 형식(심포지엄과 비슷하나 심포지엄보다 청중에게 기회가 더 많음)","2~5명의 전문가가 개인의 의견을 발표한 후 질의·토론하는 형식","상반된 견해를 가진 소수의 배심원과 다수 청중으로 구성되는 형식","사회자와 서기를 포함하여 원탁에 둘러앉아 진행되는 토의"],"a":0,"exp":"포럼은 1~3명의 전문가가 10~20분간 공개연설 후 사회자가 구성원 전체를 대상으로 토의를 진행하는 형식이며, 장점은 구성원 모두의 참여를 통한 전체의 학습향상 도모, 단점은 참가자가 많아 산만해질 수 있다는 점이다.","id":"bangbeop-m125"},{"ch":"CH04 교수방법과 교수매체","t":"원탁회의","q":"원탁회의의 개념과 단점으로 옳은 것은?","opts":["사회자와 서기를 포함하여 토의에 참여하는 학생들이 원탁에 둘러앉아 자유로운 분위기에서 의견을 교환하며 진행되는 토의로 상호 대등한 관계에서 좌담 형식으로 진행되며, 단점은 결론이 나지 않을 가능성이 높고 논의가 탁상공론에 머무를 수 있음","전문가가 공개연설 후 전체 토의를 진행하며, 단점은 산만해질 수 있음","소집단으로 나누어 동시에 토의하며, 단점은 토론이 불분명해질 수 있음","짝을 이루어 논쟁하며, 단점은 이기기 위한 논쟁이 될 수 있음"],"a":0,"exp":"원탁회의는 원탁에 둘러앉아 자유로운 분위기에서 좌담 형식으로 진행되며, 장점은 가장 민주적인 토의방식으로 모두가 만족하는 결과를 기대할 수 있다는 점이다.","id":"bangbeop-m126"},{"ch":"CH04 교수방법과 교수매체","t":"하브루타","q":"하브루타의 개념과 장점으로 옳은 것은?","opts":["학생들끼리 짝을 이루어 서로 질문을 주고받으며 논쟁하는 유대인 전통 토론교육법이며, 장점은 하나의 주제에 대한 찬반양론을 동시에 경험하면서 새로운 아이디어와 해법을 이끌어낼 수 있음","소수의 배심원이 토의하는 방식이며, 장점은 다양한 의견 수렴","전문가가 발표하는 방식이며, 장점은 전문지식 학습","소집단이 동시에 토의하는 방식이며, 장점은 전체 참여 가능"],"a":0,"exp":"하브루타는 짝을 이루어 질문을 주고받으며 논쟁하는 유대인 전통 토론교육법이며, 단점은 이기기 위해 논쟁하는 것이 아니라 논쟁을 통해 서로 학습하기 위함임을 주지시켜야 한다는 점이다.","id":"bangbeop-m127"},{"ch":"CH04 교수방법과 교수매체","t":"자기주도학습","q":"자기주도학습법의 특징으로 옳지 않은 것은?","opts":["교사가 학습목표, 학습내용, 평가기준을 모두 결정함","학습자는 자신의 학습에 주도권을 가짐","학습자의 가치, 욕구, 선호에 따라 학습목표, 학습수준, 학습내용, 학습방법, 평가기준이 결정됨","학생 간의 개인차를 중시하며, 학습자는 자신의 학습결과에 대한 책임을 짐"],"a":0,"exp":"자기주도학습은 학습자의 가치·욕구·선호에 따라 학습목표·수준·내용·방법·평가기준이 결정되므로 ①은 정반대이다.","id":"bangbeop-m128"},{"ch":"CH04 교수방법과 교수매체","t":"자기주도학습","q":"자기주도학습능력을 기르기 위한 d":"bangbeop-m134"},{"ch":"CH04 교수방법과 교수매체","t":"STAD","q":"성취과제분담학습(STAD)의 특징과 교육적 효과로 옳지 않은 것은?","opts":["학습능력이 높은 학습자에게만 차등 보상함으로써 경쟁을 극대화함","구성원 각자의 목표뿐만 아니라 집단의 목표가 있음 ⇒ 서로 돕고 도움을 받으려 함","집단에 대한 책무성과 과제에 대한 분담이 이루어짐 ⇒ 개별적 책무성이 강조됨으로써 개인의 능력을 최대로 발휘하게 됨","개인의 능력에 관계없이 집단에 기여할 수 있는 성공의 기회가 균등하게 주어짐 ⇒ 스스로 노력하게 함"],"a":0,"exp":"STAD는 '학습자의 기여도나 학습능력에 관계없이 모든 학습자에게 공평하게 보상하는 평등체제를 이용함으로써 소집단에 스스로 더 기여하게 함'이 특징이므로 ①은 정반대이다.","id":"bangbeop-m135"},{"ch":"CH04 교수방법과 교수매체","t":"TGT","q":"팀경쟁학습(TGT)의 특징으로 옳지 않은 것은?","opts":["보상은 개인의 절대적 성취수준에 따라서만 주어짐","게임을 통해 팀 간의 경쟁을 유도함","학습은 협동적으로 집단 속에서 이루어짐","기본적으로 모든 교과에 쉽게 적용 가능하지만 특히 단순암기, 훈련적 교수가 필요한 교과에 효과적임"],"a":0,"exp":"TGT는 '보상은 집단 간의 경쟁을 통해 주어짐'이 특징이므로 ①은 옳지 않다. 또한 외적 동기인 점수에만 지나치게 초점을 맞추면 내적 동기를 잃을 수 있어 유념해야 한다.","id":"bangbeop-m136"},{"ch":"CH04 교수방법과 교수매체","t":"TGT","q":"팀경쟁학습(TGT)의 학습절차로 옳은 것은?","opts":["교사의 학습지 배부 및 강의 → 소집단별 연습문제 해결 → 학업성취도가 비슷한 학생들로 구성된 토너먼트 테이블에서 문제해결 게임 → 원래 소집단으로 복귀하여 점수 합산 및 평균 → 교사가 집단 평균점수에 의거하여 소집단별 보상","개인별 학습 → 개별시험 → 개인별 향상점수 합산 → 팀 보상","전문가 집단 학습 → 원소속 집단 복귀 → 동료 교수 → 개별시험","대주제를 소주제로 나눔 → 미니과제 개별학습 → 소주제 종합 → 전체 학습 완성"],"a":0,"exp":"TGT의 학습절차는 강의 → 소집단별 연습문제 해결 → 토너먼트 테이블에서 게임 → 원 소집단 복귀 및 점수 합산·평균 → 소집단별 보상 순이다.","id":"bangbeop-m137"},{"ch":"CH04 교수방법과 교수매체","t":"직소모형","q":"직소모형(과제분담학습)의 특징으로 옳지 않은 것은?","opts":["모둠 내 구성원은 각자 전체 학습내용을 모두 학습해야 함","소모둠 협동학습 구조의 형태임","모둠 내 구성원들은 전체 학습내용의 일부분을 각각 담당함","모둠 내 다른 동료의 도움 없이는 학습이 불가능함"],"a":0,"exp":"직소모형에서 모둠 내 구성원들은 전체 학습내용의 일부분을 각각 담당하므로 ①은 정반대이다.","id":"bangbeop-m138"},{"ch":"CH04 교수방법과 교수매체","t":"직소Ⅱ","q":"직소Ⅱ 모형이 직소Ⅰ 모형과 구별되는 특징으로 옳은 것은?","opts":["직소Ⅰ + 보상, 균등한 성공기회의 요소를 추가한 모형이며, 소집단 학습 이후 개별시험을 치르게 하고 개인별 향상점수의 합으로 팀 점수를 부여(STAD의 보상방식 적용)","직소Ⅰ에서 전문가 집단 활동을 제거한 모형","직소Ⅰ에서 개별 책무성을 제거한 모형","직소Ⅰ에서 토너먼트 게임을 추가한 모형"],"a":0,"exp":"직소Ⅱ는 직소Ⅰ에 보상과 균등한 성공기회 요소를 추가한 모형으로, 개별시험 후 개인별 향상점수의 합으로 팀 점수를 부여한다(STAD의 보상방식 적용).","id":"bangbeop-m139"},{"ch":"CH04 교수방법과 교수매체","t":"팀보조개별학습","q":"팀보조개별학습의 특징으로 옳은 것은?","opts":["협동학습과 개별학습이 결합된 모형이며 협동보상과 개별보상이 모두 이루어짐","협동학습만으로 구성되며 집단보상만 이루어짐","개별학습만으로 구성되며 개별보상만 이루어짐","게임을 통한 팀 간 경쟁으로 보상이 주어짐"],"a":0,"exp":"팀보조개별학습은 협동학습과 개별학습이 결합된 모형이며 협동보상과 개별보상이 모두 이루어진다.","id":"bangbeop-m140"},{"ch":"CH04 교수방법과 교수매체","t":"자율적 협동학습","q":"자율적 협동학습(co-op co-op)의 학습절차 측면의 특징과 효과로 옳은 것은?","opts":["대주제를 소주제로 나누어 모둠별로 학습하고 각 모둠에서는 소주제를 다시 미니과제로 나누어 개별학습자들이 개별학습을 진행하며, 미니과제를 종합하여 소주제를, 다시 소주제를 종합하여 전체 학습을 완성함 ⇒ 모둠 간·모둠 내 협력이 모두 필요한 '협동을 위한 협동'이 진행됨","각 모둠이 서로 다른 주제를 독립적으로 해결하며 모둠 간 협력은 필요하지 않음","토너먼트 게임을 통해 집단 간 경쟁을 유도함","짝을 이루어 자료를 요약하고 서로 점검함"],"a":0,"exp":"자율적 협동학습은 모둠별로 한 가지 주제를 해결하는 것이 아니라 학급 전체가 한 가지 주제를 해결하기 위해 협동하며, 모둠 간 협력과 모둠 내 협력이 모두 필요한 '협동을 위한 협동'이 진행된다.","id":"bangbeop-m141"},{"ch":"CH04 교수방법과 교수매체","t":"자율적 협동학습","q":"자율적 협동학습(co-op co-op)의 평가 측면의 특징으로 옳은 것은?","opts":["동료에 의한 팀 기여도, 교사에 의한 소주제 학습 기여도, 전체 학급에 의한 팀 보고서 평가 등 ⇒ 다면평가","교사에 의한 지필평가만 실시","개인별 향상점수의 합으로만 평가","토너먼트 게임 점수로만 평가"],"a":0,"exp":"자율적 협동학습의 평가 측면 특징은 동료에 의한 팀 기여도, 교사에 의한 소주제 학습 기여도, 전체 학급에 의한 팀 보고서 평가 등의 다면평가이다.","id":"bangbeop-m142"},{"ch":"CH04 교수방법과 교수매체","t":"각본협동","q":"각본협동의 목적과 운영방안으로 옳은 것은?","opts":["학생들이 짝을 이루어 읽기, 요약하기, 이해하기, 퀴즈 공부 등 서로를 돕는 데 초점을 두며, 두 명의 학생이 짝을 지어 정해진 순서에 따라 교대로 자료를 요약하고 그 내용을 서로 점검하고 논평해주는 방식으로 진행됨","소집단이 토너먼트 테이블에서 경쟁하는 방식","전문가 집단으로 나뉘어 학습 후 원소속 집단에 돌아가 가르치는 방식","현장의 문제를 해결하며 학습하는 방식"],"a":0,"exp":"각본협동은 짝을 이루어 읽기·요약하기·이해하기·퀴즈 공부 등 서로를 돕는 데 초점을 두며, 정해진 순서에 따라 교대로 자료를 요약하고 서로 점검·논평하는 방식이다.","id":"bangbeop-m143"},{"ch":"CH04 교수방법과 교수매체","t":"액션러닝","q":"액션러닝의 특징으로 옳은 것은?","opts":["소수의 인원으로 구성된 학습자 집단이 현장의 문제를 해결하기 위한 행동을 취하며 그러한 과정으로부터 학습이 이루어지며, 촉진자라고 지칭되는 외부 전문가가 관여하지만 전문가가 제시한 해결방안보다는 성인학습자들의 경험과 상호작용에 중점을 둠","교사가 제시한 시나리오 속에서 역할을 맡아 임무를 수행함","짝을 이루어 서로 질문하고 논쟁함","글의 내용을 예측·질문·명료화·요약하며 읽음"],"a":0,"exp":"액션러닝은 소수 인원의 학습자 집단이 현장의 문제를 해결하기 위한 행동을 취하며 학습이 이루어지고, 촉진자(외부 전문가)가 관여하되 성인학습자들의 경험과 상호작용에 중점을 둔다.","id":"bangbeop-m144"},{"ch":"CH04 교수방법과 교수매체","t":"협동학습 효과","q":"협동학습의 교육적 효과 중 '인지적 측면'에 해당하는 것은?","opts":["인지발달: 구성원 간의 협의를 통하여 사회적 인지갈등의 평형이 깨지고 학습자의 인지적 재구성이 이루어짐 / 인지정교화: 동료학습자의 설명과 튜터링은 정보의 기억과 장기기억화에 효과적임","집단보상, 개별책무성, 학습참여의 균등한 기회 보장","긍정적 상호작용, 대면적 상호작용, 개별책무성","학습목표보다 집단과정에 더 집중하게 됨"],"a":0,"exp":"협동학습의 교육적 효과는 동기 측면(집단보상, 개별책무성, 학습참여의 균등한 기회 보장), 사회응집성 측면(긍정적 상호작용, 대면적 상호작용, 개별책무성), 인지적 측면(인지발달, 인지정교화)이다.","id":"bangbeop-m145"},{"ch":"CH04 교수방법과 교수매체","t":"협동학습 유의점","q":"협동학습 운영 시 유의점으로 제시되지 않은 것은?","opts":["학습능력이 높은 학생에게 집단 리더 역할을 고정적으로 부여해야 함","특정 학생의 오개념이 심화되고 그룹 내 다른 학생들로 확산될 가능성이 있음에 유의해야 함","내성적이거나 학습능력이 낮아서 소집단 참여에서 소외되는 경우 심리적 모멸감과 수치심을 갖게 될 수 있음에 유의해야 함","학습목표보다 집단과정에 더 집중하여 학습의 효과성이 낮아질 수 있음에 유의해야 함"],"a":0,"exp":"제시된 유의점은 ②③④이다.","id":"bangbeop-m146"},{"ch":"CH05 교수매체","t":"교수매체의 기능","q":"교수매체의 기능 중 '정보전달 기능'에 해당하는 설명은?","opts":["매체의 본질적인 기능으로, 매체는 교수·학습의 정보를 더욱 효율적·효과적으로 전달할 수 있도록 도움","매체의 가장 일반적인 기능으로, 교수·학습과정의 보조수단으로 매체를 사용함으로써 학습자의 주의집중과 동기유발을 도울 수 있음","매체 자체가 학습의 대상이 되고 학습경험을 구성함","어떻게 정보를 전달하는지에 따라서 학습자의 인지적 사고를 촉진시킬 수 있음"],"a":0,"exp":"교수매체의 기능은 매개적 보조기능(②), 정보전달 기능(①), 학습경험 구성기능(③), 교수기능(④)이다.","id":"bangbeop-m147"},{"ch":"CH05 교수매체","t":"경험의 원추","q":"데일(Dale)의 경험의 원추와 브루너(Bruner)의 매체 분류에 대한 설명으로 옳은 것은?","opts":["경험의 원추는 아래로 갈수록 구체적·직접적인 경험에 가까워지고 위로 갈수록 추상적·간접적인 경험에 가까워지며, 브루너는 이를 행동적 경험(행동에 의한 학습), 영상적 경험(관찰을 통한 학습), 상징적 경험(추상을 통한 학습)으로 나누었다","경험의 원추는 아래로 갈수록 추상적인 경험에 가까워지고 위로 갈수록 구체적인 경험에 가까워진다","브루너는 매체를 시각적·청각적·시청각적 경험으로 나누었다","경험의 원추는 하나의 매체만 사용할 것을 시사한다"],"a":0,"exp":"경험의 원추는 아래로 갈수록 구체적·직접적, 위로 갈수록 추상적·간접적 경험에 가까워지며, 브루너는 행동적·영상적·상징적 경험으로 나누었다. 시사점은 다양한 교수·학습매체를 활용해야 하며 추상을 통한 학습을 위해서는 적절한 행동적 또는 영상적 단계가 필요하다는 것이다.","id":"bangbeop-m148"},{"ch":"CH05 교수매체","t":"매체 선정","q":"교수매체 선정 시 고려사항으로 제시되지 않은 것은?","opts":["매체의 최신 출시 여부","학습자 특성: 매체 선정 시 학습자의 연령, 지적 수준, 적성, 태도 등과 같은 학습자 특성을 고려해야 함","수업상황: 수업집단의 형태나 규모, 수업방법(교사중심, 학생중심, 발견중심 등)에 따라 적절한 교수매체가 달라짐","실용적 요인: 매체 이용 가능성, 매체 준비 및 활용에 소요되는 시간, 난이도, 비용 등을 고려해야 함"],"a":0,"exp":"교수매체 선정 시 고려사항은 학습자 특성, 수업상황, 학습목표와 내용, 매체의 물리적 속성과 기능, 수업장소의 시설, 실용적 요인이다.","id":"bangbeop-m149"},{"ch":"CH05 교수매체","t":"ASSURE","q":"하이니히(Heinich)의 ASSURE 모형의 목적과 절차의 첫 단계로 옳은 것은?","opts":["체제적 교수설계의 한 모형으로 교수매체를 체계적으로 활용하기 위한 절차를 제시하고자 하며, 첫 단계는 학습자분석(학습자의 일반적인 특성, 출발점행동, 학습양식 등에 대해 분석)","교수내용을 계열화하기 위한 모형이며, 첫 단계는 목표진술","학습동기를 유발하기 위한 모형이며, 첫 단계는 주의 획득","복잡한 인지기능을 개발하기 위한 모형이며, 첫 단계는 학습과제 설계"],"a":0,"exp":"ASSURE 모형의 목적은 교수매체를 체계적으로 활용하기 위한 절차 제시이며, 절차는 학습자분석 → 목표진술 → 전략·테크놀로지·매체·자료 선정 → 테크놀로지·매체·자료의 활용 → 학습자 참여 요구 → 평가와 수정이다.","id":"bangbeop-m150"},{"ch":"CH05 교수매체","t":"ASSURE","q":"ASSURE 모형의 '테크놀로지·매체·자료의 활용' 단계에서 수행하는 교사의 활동 중 '환경 준비하기'에 해당하는 것은?","opts":["준비한 자료를 활용하는 데 필요한 기기가 갖추어져 있는지, 기기가 잘 작동되는지 등을 확인하고 준비함","수업자료에 비교육적인 내용이 들어있지는 않은지, 수업자료가 최신의 내용을 담고 있는지 등을 사전에 검토","필요한 자료를 어떤 순서와 방법으로 제공할 것인지 등을 결정하고 필요한 기자재를 확인함","학습자에게 동기부여, 학습목표 안내, 수업자료에서 중요하게 확인할 내용이 무엇인지를 미리 안내함"],"a":0,"exp":"이 단계의 교사 활동은 자료에 대한 사전검토(②), 자료 준비하기(③), 환경 준비하기(①), 학습자 준비시키기(④), 학습경험 제공하기(수업 진행)이다.","id":"bangbeop-m151"},{"ch":"CH05 교수매체","t":"ASSURE","q":"ASSURE 모형의 '평가와 수정' 단계에서 평가의 대상으로 옳은 것은?","opts":["학습자 성취의 평가와 방법·매체·자료의 평가","학습자의 출발점행동과 학습양식","수업목표와 평가기준","교사의 전문성과 학교 시설"],"a":0,"exp":"평가와 수정 단계의 평가 대상은 ①학습자 성취의 평가(학습목표 달성 여부 확인) ②방법과 매체, 자료의 평가(교사 자신, 학생, 동료교사, 관리자들로부터 평가받음) ③수정하기(평가결과를 차시 수업에 반영)이다.","id":"bangbeop-m152"},{"ch":"CH05 교수매체","t":"인지부하","q":"인지부하의 개념과 종류 중 '본질적 인지부하'에 해당하는 설명은?","opts":["학습내용을 이해하거나 적용하기 위해 새로운 지식체계를 생성하거나 새로운 지식을 기존의 지식체계에 통합시키려는 인지적 노력(긍정적 인지부하)","학습과제 자체의 난이도에 의해 결정되는 인지부하","학습과정에서 불필요하게 투입된 인지적 노력","과제를 수행할 때 학습자의 인지체계에 부과되는 정신적인 노력"],"a":0,"exp":"인지부하는 과제 수행 시 인지체계에 부과되는 정신적 노력이며, 종류는 내재적(②), 본질적(①), 외생적(③) 인지부하이다.","id":"bangbeop-m153"},{"ch":"CH05 교수매체","t":"멀티미디어 설계원리","q":"내재적 인지부하 측면에서 고려해야 하는 멀티미디어 설계원리로 옳은 것은?","opts":["완성된 예제 원리, 사전훈련 원리, 양식 원리","개인화 원리, 자기설명 및 인지리허설 원리","근접성 원리, 중복 원리, 일관성 원리","주의 원리, 관련성 원리, 자신감 원리"],"a":0,"exp":"내재적 인지부하는 완성된 예제 원리(문제해결과정을 단계별로 명료하게 제시), 사전훈련 원리, 양식 원리(시각채널과 청각채널을 모두 활용)이다. ②는 본질적, ③은 외생적 인지부하 관련 원리이다.","id":"bangbeop-m154"},{"ch":"CH05 교수매체","t":"멀티미디어 설계원리","q":"외생적 인지부하 측면의 멀티미디어 설계원리 중 '중복 원리'에 해당하는 설명은?","opts":["동일한 내용을 담고 있는 시각과 청각 정보의 중복을 피해야 함","관련된 정보를 공간적·시간적으로 가깝게 제시해야 함","학습내용에 관련된 내용만을 구성해야 하며 불필요한 내용을 제거해야 함","학습자와 대화하듯이 내용을 전달하는 방법"],"a":0,"exp":"중복 원리는 동일 내용의 시각·청각 정보 중복을 피하는 것이다. ②는 근접성 원리, ③은 일관성 원리, ④는 개인화 원리(본질적 인지부하)이다.","id":"bangbeop-m155"},{"ch":"CH05 교수매체","t":"멀티미디어 설계원리","q":"본질적 인지부하 측면의 설계원리 중 '개인화 원리'에 해당하는 설명은?","opts":["학습자와 대화하듯이 내용을 전달하는 방법(ex. 학습자의 이름을 불러주어 동기를 유발하고 학습에 집중하게 함)","학습내용을 학습자 스스로 점검하도록 유도함","문제해결과정을 단계별로 명료하게 제시해주는 완성된 예제를 활용함","관련된 정보를 공간적·시간적으로 가깝게 제시함"],"a":0,"exp":"개인화 원리는 학습자와 대화하듯이 내용을 전달하는 방법이다. ②는 자기설명 및 인지리허설 원리, ③은 완성된 예제 원리, ④는 근접성 원리이다.","id":"bangbeop-m156"},{"ch":"CH06 테크놀로지 기반 교육","t":"e-러닝","q":"e-러닝의 장점으로 제시되지 않은 것은?","opts":["교사의 ICT 활용능력과 무관하게 동일한 효과를 보장함","학습자 동기유발: 다양한 멀티미디어를 수업에 사용하여 학습자의 주의를 집중시키고 능동적인 반응을 유도함","학습의 개별화: 학습자의 학습양식 및 능력 등에 따라 개별화된 학습이 이루어질 수 있음","시·공간 제약 초월: 교사, 학생, 전문가들이 시간과 공간의 제약을 초월하여 정보를 교환하고 소통할 수 있음"],"a":0,"exp":"'교사와 학생의 ICT(디지털) 활용능력 점검'은 e-러닝 적용 시 유의사항이므로 ①은 옳지 않다. 장점에는 '다양한 교수·학습활동 추진', '문제해결력 및 자기주도적 학습능력 신장'도 포함된다.","id":"bangbeop-m157"},{"ch":"CH06 테크놀로지 기반 교육","t":"e-러닝","q":"e-러닝 적용 시 유의사항으로 옳지 않은 것은?","opts":["특정 기술이 제공하는 기능을 사용하는 것 자체에 초점을 맞추어야 함","강의중심적 사고 배제: 전통적 강의식 수업에서 탈피하여 학습자중심의 학습환경 구성에 초점을 맞추어야 함","교사 역할의 변화: 지식전달자가 아닌 학생의 학습지원자 및 촉진자가 되어야 함","적극적 지원체제 구축: 교사에게 충분한 교육콘텐츠 제공, ICT 활용수업 지원 전문가 배치, 자료와 정보 공유 등의 지원체제가 확립되어야 함"],"a":0,"exp":"'기법보다 내용중심 설계: 특정 기술이 제공하는 기능을 사용하는 것 자체에 초점을 맞추기보다는 목표된 학습을 효과적으로 지원하는 기술 활용에 집중해야 함'이 유의사항이므로 ①은 정반대이다.","id":"bangbeop-m158"},{"ch":"CH06 테크놀로지 기반 교육","t":"블렌디드 러닝","q":"블렌디드 러닝(blended learning)의 개념과 장점으로 옳은 것은?","opts":["온라인 강좌(온라인 학습)와 오프라인 강좌(면대면 학습)가 혼합된 형태의 교육이며, 학습자의 특성에 맞는 학습내용 및 방법으로 교육효과를 극대화하고 학습공간과 기회를 확대함","온라인 학습만으로 구성된 교육이며, 시공간 제약이 없음","면대면 학습만으로 구성된 교육이며, 상호작용이 활발함","게임 요소를 적용한 교육이며, 동기를 유발함"],"a":0,"exp":"블렌디드 러닝은 온라인과 오프라인 강좌가 혼합된 형태의 교육이며, 장점은 교육효과 극대화, 학습공간과 기회 확대, 개별화 수업·자기주도적 학습·면대면 상호작용을 통한 학업성취도 제고, 학습상황 데이터 수집 가능이다.","id":"bangbeop-m159"},{"ch":"CH06 테크놀로지 기반 교육","t":"블렌디드 러닝","q":"블렌디드 러닝을 위한 온라인 도구 중 '인터랙티브 학습 플랫폼'의 예로 옳은 것은?","opts":["Kahoot, Quizlet, Socrative 등","Google Classroom, Moodle, Canvas 등","Zoom, Microsoft Teams 등","시각화도구, 모델링도구"],"a":0,"exp":"온라인 도구는 온라인 학습 플랫폼(Google Classroom, Moodle, Canvas 등), 동영상 강의(녹화도구: Zoom, Microsoft Teams 등), 인터랙티브 학습 플랫폼(Kahoot, Quizlet, Socrative 등)이다.","id":"bangbeop-m160"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습(flipped learning)의 개념으로 옳은 것은?","opts":["블렌디드 러닝의 한 형태로 학습자가 교실수업 전에 동영상 강의 등 온라인 학습을 통해 학습내용(영상, 논문자료 등)을 미리 학습하고, 교실수업에서는 활동중심 학습(토론, 과제풀이 등)을 통해 수업의 효과를 극대화하는 교수·학습방식","교실에서 강의를 듣고 집에서 과제를 하는 전통적 방식","온라인 학습만으로 진행하는 방식","게임 요소를 적용하여 학습하는 방식"],"a":0,"exp":"거꾸로 학습은 교실수업 전 온라인으로 학습내용을 미리 학습하고 교실에서는 활동중심 학습을 하는 블렌디드 러닝의 한 형태이다.","id":"bangbeop-m161"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습 설계 시 고려사항으로 제시되지 않은 것은?","opts":["교사 중심의 수업 구조를 유지해야 함","유연한 환경: 탄력적이고 다양한 학습의 형태를 허용해야 함","의도된 내용: 교사는 수업시간에 어떠한 내용을 가르칠 것인지, 학생들로 하여금 사전에 어떠한 내용을 배워서 오게 할 것인지에 대한 의도적이고 분명한 계획이 있어야 함","전문성을 갖춘 교사: 교사는 학생들로 하여금 어떻게 보다 체계적인 지식을 갖도록 할 것인지, 나아가 필요할 경우 어떻게 더욱 깊이 있는 지식을 제공할 수 있을지에 대해 고민하는 것이 중요함"],"a":0,"exp":"'학습문화의 변화: 교사중심의 수업에서 학생중심의 수업으로의 변화가 수반되어야 함'이 고려사항이므로 ①은 정반대이다.","id":"bangbeop-m162"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습의 단점과 그 해결방안으로 옳은 것은?","opts":["학생이 온라인 사전학습을 충분히 하지 않을 수 있음 ⇒ 흥미롭고 부담스럽지 않은 길이의 동영상 강의를 준비하고 학생의 준비도 확인을 철저히 해야 함","학습자 중심 수업이 어려움 ⇒ 강의식 수업으로 전환해야 함","학습자의 자신감이 저하됨 ⇒ 과제를 줄여야 함","역동적 학습이 불가능함 ⇒ 실험을 줄여야 함"],"a":0,"exp":"거꾸로 학습의 단점은 학생이 온라인 사전학습을 충분히 하지 않을 수 있다는 점이며, 해결방안은 흥미롭고 부담스럽지 않은 길이의 동영상 강의 준비와 준비도 확인 철저이다.","id":"bangbeop-m163"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"전통적 교실학습과 구별되는 거꾸로 학습의 '수업 중' 특징으로 옳은 것은?","opts":["교수자는 수업시간 동안 해야 할 과제를 제시하고, 학습자는 수업 도입 이후부터 수업시간 동안 학습내용을 적용시키기 위한 토론, 프로젝트학습 등을 수행하게 되며 이 과정에 교수자는 피드백과 소규모 강의를 제공함","교수자는 강의를 준비하고 학습자에게 과제를 배정함","교수자는 지난 과제를 평가하고 학습자는 보통 과제를 수행함","학습자는 수업내용을 이해하려 하고 교수자는 모든 학습자료를 활용해 학습자의 이해를 돕고자 노력함"],"a":0,"exp":"①이 거꾸로 학습의 수업 중 특징이다. ②는 전통적 교실학습의 수업 전, ③은 전통적 교실학습의 수업 후, ④는 전통적 교실학습의 수업 중 특징이다.","id":"bangbeop-m164"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습의 장점으로 제시되지 않은 것은?","opts":["교사의 수업준비 부담이 크게 감소함","학습자중심 수업의 확대: 수업 전에 미리 학습내용을 익히고 참여하게 되므로 토론 및 토의, 프로젝트학습 등 다양한 학습자중심의 수업을 운영할 수 있음","학습자의 자신감 형성: 사전학습을 통해 본 수업에 대한 자신감이 형성됨","역동적 학습: 실험, 탐구, 학습자 간의 상호작용을 촉진하는 수업이 가능해짐"],"a":0,"exp":"거꾸로 학습의 장점은 ②③④와 '흥미와 동기 고양'이다.","id":"bangbeop-m165"},{"ch":"CH06 테크놀로지 기반 교육","t":"AI 디지털교과서","q":"서책형 교과서와 구별되는 AI 디지털교과서의 특징으로 옳지 않은 것은?","opts":["자료유형이 텍스트와 이미지 중심의 평면적·선형적 학습자료임","내용전달 매체와 데이터: 서책형 교과서는 인쇄매체이나 AI 디지털교과서는 정보기기를 사용하므로 학습데이터 수집 및 분석이 가능함","다른 교과와의 관계: 서책형 교과서는 교과 간 서로 단절된 개별학습이나 AI 디지털교과서는 교과 내·학년 간 연계학습이 가능함","수업효과: 서책형 교과서는 학습자의 능력에 따른 수업이 어려운 일제식 수업이나 AI 디지털교과서는 학생중심 수업활동과 자기주도적 학습 시행이 가능함"],"a":0,"exp":"AI 디지털교과서는 동영상, 가상현실 등과 같은 멀티미디어 학습자료를 제공하며, 텍스트와 이미지 중심의 평면적·선형적 자료는 서책형 교과서의 특징이므로 ①은 옳지 않다.","id":"bangbeop-m166"},{"ch":"CH06 테크놀로지 기반 교육","t":"컴퓨터기반 협력학습","q":"컴퓨터기반 협력학습의 특징으로 옳지 않은 것은?","opts":["교사는 협력도구를 제공하지 않고 학습자의 자율에만 맡김","컴퓨터를 기반으로 학습자가 공유와 협력을 통하여 공동의 문제를 해결하고 지식을 형성하는 학습이 가능함","시간과 장소에 구애받지 않고 협력적으로 학습하고, 공동의 산출물을 구성해 나갈 수 있으며 학습자 간의 활발한 상호작용이 가능함","교사는 다양한 협력도구와 인지·정서적 지원을 통해 학습자의 협력과 상호작용을 지원함"],"a":0,"exp":"교사는 다양한 협력도구와 인지·정서적 지원을 통해 학습자의 협력과 상호작용을 지원하므로 ①은 정반대이다.","id":"bangbeop-m167"},{"ch":"CH06 테크놀로지 기반 교육","t":"컴퓨터기반 협력학습","q":"컴퓨터기반 협력학습 시 교사가 지원해야 하는 학습지원도구 중 '수행지원도구'의 역할로 옳은 것은?","opts":["학습자의 현재 학습과제보다 낮은 수준의 학습과제를 자동화하거나 대체하여 인지활동의 부담을 덜어줌","학습자의 수행과제를 더 잘 나타낼 수 있도록 지원","문제해결을 위한 중요한 정보수집 지원","학습자 상호간의 원활한 원격 의사소통 지원"],"a":0,"exp":"학습지원도구는 시각화도구(②), 수행지원도구(①), 정보수집도구(③), 의사소통도구(④), 협업도구(학습자 간 공동의 학습문제 해결을 위한 학습활동 공간 제공)이다.","id":"bangbeop-m168"},{"ch":"CH06 테크놀로지 기반 교육","t":"컴퓨터기반 협력학습","q":"컴퓨터기반 협력학습의 단점으로 옳은 것은?","opts":["협력학습 초기에는 프로그램에 익숙하지 않은 학습자가 학습에 어려움을 호소할 수 있고, 학습자 간의 활발한 의사소통이 부족한 경우 공동의 지식 구성이 이루어지지 않고 단순한 분업으로 과제가 진행될 수 있음","수정과 편집이 자유롭지 않음","수줍음이 많은 학생은 참여할 수 없음","시간과 장소의 제약이 큼"],"a":0,"exp":"컴퓨터기반 협력학습의 단점은 ①프로그램 미숙 학습자의 어려움 ②의사소통 부족 시 단순 분업 ③상대방과의 논의 없이 동료의 글을 임의로 수정·삭제할 경우 정서적 갈등 초래이다. ②③④는 장점과 반대된다.","id":"bangbeop-m169"},{"ch":"CH06 테크놀로지 기반 교육","t":"클라우드 컴퓨팅","q":"클라우드 컴퓨팅의 단점으로 옳은 것은?","opts":["시·공간을 불문하고 클라우드 컴퓨팅 어플리케이션을 이용해서 협력활동에 참여할 수 있지만, 그룹과제를 수행하기 위해 면대면 회의를 가지는 횟수가 줄어들 경우 오히려 학습자 간의 상호작용을 제한하게 될 수도 있음","공동의 작업공간을 제공할 수 없음","상호작용을 도울 수 없음","학습성과와 무관함"],"a":0,"exp":"클라우드 컴퓨팅의 장점은 공동의 작업공간 제공, 그룹 구성원들과 작업물에 대한 상호작용 지원, 공동의 이해 형성과 협력과정 조절을 통한 더 나은 학습성과이며, 단점은 면대면 회의 감소 시 상호작용 제한 가능성이다.","id":"bangbeop-m170"},{"ch":"CH06 테크놀로지 기반 교육","t":"모바일 러닝","q":"모바일 러닝의 장점 중 '실제적인 맥락에서의 학습'에 해당하는 설명은?","opts":["이동하는 개인의 위치와 처해 있는 상황과 맥락을 반영하여 그에 적합한 학습내용 제공 가능","언제 어디서나 학습이 가능함","언제 어디서나 필요한 정보를 검색하고 기억하고 싶은 내용을 메모하거나 사진 및 동영상으로 기록할 수 있음","SNS를 이용하여 모바일 러닝 활동과 결과물을 교수자 및 다른 학습자와 쉽게 공유할 수 있음"],"a":0,"exp":"모바일 러닝의 장점은 시·공간 한계 극복(②), 실제적인 맥락에서의 학습(①), 학습자의 개별성 지원(③), 사회적 상호작용을 통한 공유성(④)이다.","id":"bangbeop-m171"},{"ch":"CH06 테크놀로지 기반 교육","t":"모바일 러닝","q":"모바일 러닝의 단점으로 옳은 것은?","opts":["작은 스크린상에서 구동되는 특징이 있어 신체적인 피로나 장애로 이어질 수 있고, 무선인터넷 활용이 어려운 지역에서는 학습이 불가능함","시·공간의 한계를 극복할 수 없음","개별성을 지원할 수 없음","사회적 상호작용이 불가능함"],"a":0,"exp":"모바일 러닝의 단점은 ①작은 스크린으로 인한 신체적 피로나 장애 ②무선인터넷 활용이 어려운 지역에서 학습 불가능이다.","id":"bangbeop-m172"},{"ch":"CH06 테크놀로지 기반 교육","t":"게이미피케이션","q":"게이미피케이션의 개념과 구성요소로 옳은 것은?","opts":["게임이 아닌 것에 게임의 요소나 원리를 적용하는 것이며, 구성요소는 명확한 목표와 규칙, 지속적인 과제 제시, 즉각적인 피드백 및 재도전 기회 제시, 보상 제공","게임을 통해 학습하는 방법이며, 구성요소는 경쟁, 승패, 규칙","가상현실을 이용한 학습이며, 구성요소는 몰입, 실재감, 상호작용","시나리오 속 역할을 수행하는 학습이며, 구성요소는 미션, 커버스토리, 역할"],"a":0,"exp":"게이미피케이션은 게임이 아닌 것에 게임의 요소나 원리를 적용하는 것이며, 구성요소는 명확한 목표와 규칙, 지속적인 과제 제시, 즉각적인 피드백 및 재도전 기회 제시, 보상 제공이다.","id":"bangbeop-m173"},{"ch":"CH06 테크놀로지 기반 교육","t":"실감미디어","q":"실감미디어의 목적과 종류별 특징으로 옳은 것은?","opts":["사용자의 실재감과 몰입감을 최대로 높이기 위함이며, 증강현실(AR)은 학습자에게 조작하는 경험을 제공하면서 학습자료와 직접적으로 상호작용할 수 있어 능동적인 학습이 가능해짐","학습자의 인지부하를 줄이기 위함이며, 가상현실은 텍스트 자료를 제공함","교사의 수업 부담을 줄이기 위함이며, 메타버스는 강의를 자동화함","평가의 객관성을 높이기 위함이며, AR은 자동채점을 지원함"],"a":0,"exp":"실감미디어의 목적은 사용자의 실재감과 몰입감을 최대로 높이는 것이며, AR은 조작 경험과 직접 상호작용을 통한 능동적 학습, VR은 실제 움직임과 가상공간 움직임의 일치로 몰입, 메타버스는 아바타를 통한 사회적 실재감 제고와 사회적 상호작용 촉진이 특징이다.","id":"bangbeop-m174"},{"ch":"CH06 테크놀로지 기반 교육","t":"실감미디어","q":"실감미디어의 종류 중 '메타버스'의 특징으로 옳은 것은?","opts":["아바타를 통해 사회적 실재감을 높이고 사회적 상호작용을 촉진할 수 있음","학습자에게 조작하는 경험을 제공하면서 학습자료와 직접적으로 상호작용할 수 있음","학습자의 실제 움직임과 가상공간에서의 움직임이 일치하도록 나타나기 때문에 학습활동에 더욱 몰입하게 됨","텍스트와 이미지 중심의 평면적 자료를 제공함"],"a":0,"exp":"메타버스는 아바타를 통해 사회적 실재감을 높이고 사회적 상호작용을 촉진한다. ②는 증강현실(AR), ③은 가상현실(VR)이다.","id":"bangbeop-m175"},{"ch":"CH06 테크놀로지 기반 교육","t":"실감미디어","q":"실감미디어 활용교육의 단점으로 옳은 것은?","opts":["가상 혹은 증강현실을 체험하는 동안 학생들은 현실과 다른 시각적 자극을 받게 되는데, 이러한 시각적 자극은 뇌와 몸의 감각정보가 일치하지 않을 수 있기 때문에 어지러움증이나 멀미 등의 증상이 발생할 수 있으며, 교사들에게 기존의 교육방식과 다른 접근법과 교수법을 습득하고 적용하는 역량을 요구함","학생들의 참여가 저조해짐","체험중심 학습이 불가능함","위험한 실험을 안전하게 실습할 수 없음"],"a":0,"exp":"실감미디어 활용교육의 단점은 ①어지러움증과 시각피로 ②교사 부담이다. ②③④는 장점과 반대된다.","id":"bangbeop-m176"},{"ch":"CH06 테크놀로지 기반 교육","t":"인공지능 교육","q":"인공지능 교육의 종류 중 '인공지능 가치교육'에 해당하는 설명은?","opts":["인공지능 기술의 사회경제적 영향 및 윤리적 가치에 초점을 두는 교육으로, 인공지능의 인간중심성, 책임성, 투명성, 개인정보보호, 공정성, 안정성, 신뢰성 등을 다룸","인공지능 기술 자체에 대해 이해하고 배우는 것에 초점을 두는 교육","인공지능을 다양한 교과의 교수·학습상황에서 교육의 도구로 활용하는 교육","인공지능 챗봇을 학습튜터로 활용하는 교육"],"a":0,"exp":"인공지능 교육의 종류는 인공지능 이해교육(②), 인공지능 활용교육(③), 인공지능 가치교육(①)이다.","id":"bangbeop-m177"},{"ch":"CH06 테크놀로지 기반 교육","t":"AI 챗봇","q":"인공지능 챗봇의 활용방안으로 제시되지 않은 것은?","opts":["학생의 성적을 최종 확정하고 서열을 결정하는 데 활용","학습튜터 역할: 학생들이 교과목에 관련하여 질문하거나 의문점을 해결하기 위해 활용","학습평가와 피드백 제공: 학생들의 학습성과를 평가하고 피드백을 제공하는 데 활용","언어학습 지원: 단어, 문법, 어휘 등의 학습을 돕는 데에 사용"],"a":0,"exp":"인공지능 챗봇의 활용방안은 ②학습튜터 역할 ③학습평가와 피드백 제공 ④언어학습 지원이다.","id":"bangbeop-m178"},{"ch":"CH06 테크놀로지 기반 교육","t":"AI 챗봇","q":"인공지능 챗봇 활용교육의 단점으로 옳지 않은 것은?","opts":["학생들의 학습기록을 분석하여 개별 맞춤형 학습내용을 제공하지 못함","사람 간 상호작용 부족: 인공지능 챗봇은 인간의 감정이나 커뮤니케이션 측면에서 제한적일 수 있기 때문에 교사와 학생 사이의 강한 상호작용을 대체하기엔 한계가 있음","기술적 한계: 일부 챗봇은 정교한 질문에 적절한 답변을 제공하지 못할 수 있으며 특정 도메인에 대해서만 효과적일 수 있음","의존성 문제: 학생들이 인공지능 챗봇에 지나치게 의존할 경우, 자체적인 문제해결능력이나 창의성이 저하될 수 있음"],"a":0,"exp":"'개별 맞춤학습 지원: 학생들의 학습기록을 분석하여 개별 맞춤형 학습내용을 제공하고 최적의 학습경로를 제시할 수 있음'은 장점이므로 ①은 정반대이다.","id":"bangbeop-m179"}],"essay":[{"ch":"CH01 교육공학","t":"학습자중심교육","q":"학습자중심교육을 구현하기 위한 방안 2가지, 이에 따른 교사의 역할 2가지와 학습자중심교육의 장점 2가지를 제시하시오.","ans":"방안\n① 탐구·발견 중심의 수업 ② 개인차를 고려한 개별지도 ③ 사고력·문제해결력 증진을 위한 수업 ④ 능동적인 수업참여 ⑤ 다양한 학습자료에 의존\n교사의 역할\n① 수업의 안내자 ② 동료학습자 ③ 학습촉진자\n장점\n① 흥미 있는 수업 ② 창의력 향상 ③ 학습자의 성취욕구 충족 ④ 개인차를 인정하는 교육","kw":["탐구·발견","개별지도","문제해결력","능동적인 수업참여","안내자","동료학습자","학습촉진자","창의력","성취욕구","개인차"],"id":"bangbeop-e0"},{"ch":"CH01 교육공학","t":"객관주의와 구성주의","q":"교수목표, 교수-학습방법, 평가의 측면에서 객관주의와 구별되는 구성주의의 특징 각각 1가지를 제시하시오.","ans":"교수목표: 객관주의는 가장 효과적·효율적인 방식으로 학습자에게 지식이나 기술을 전달하는 것인 반면 구성주의는 학습자가 아이디어를 스스로 이해하고 구성할 수 있는 학습경험을 제공함\n교수-학습방법: 객관주의는 지식전달식 교수인 반면 구성주의는 문제해결에 초점을 맞추어 학습자의 능동적 지식구성을 촉진함\n평가: 객관주의는 주어진 지식이나 기능을 잘 습득했는지를 확인하는 반면 구성주의는 실제적 과제를 수행하고 문제를 해결할 수 있는 능력을 갖추었는가를 확인","kw":["스스로 이해하고 구성","학습경험","문제해결","능동적 지식구성","실제적 과제","문제를 해결할 수 있는 능력"],"id":"bangbeop-e1"},{"ch":"CH01 교육공학","t":"비고츠키 지식론","q":"비고츠키(Vygotsky) 지식론의 명칭, 이 지식론에서 학습의 성격, 학습이 이루어지는 방법, 교사의 역할 각각 1가지를 제시하시오.","ans":"명칭: 사회적 구성주의\n학습의 성격: 학습은 사회적으로 맥락화된 지식을 학습자가 내면화하는 과정임\n학습이 이루어지는 방법: 동료학습자나 주변인물과의 상호작용을 통하여 촉진됨\n교사의 역할: 학생이 새로운 지식과 기술을 습득함에 있어 활발한 사회적 상호작용의 기회를 제공함. 효과적 학습이 이루어질 수 있도록 알맞은 비계(scaffolding)를 제공함","kw":["사회적 구성주의","맥락화된 지식","내면화","상호작용","비계","scaffolding"],"id":"bangbeop-e2"},{"ch":"CH01 교육공학","t":"구성주의 교수설계","q":"구성주의 교수설계에서 학습자와 교사의 역할 각각 1가지, 과제의 성격 2가지, 과제해결을 지원하는 방안 2가지를 제시하시오.","ans":"학습자의 역할: 학습의 주체로서 학습경험을 통해 능동적으로 의미를 구성함\n교사의 역할: 학습자의 학습을 돕는 조언자이자 안내자, 함께 배워나가는 동료학습자\n과제의 성격\n① 구체성·관련성: 학습자에게 의미 있고 적절한 과제, 구체적이고 학습자의 삶과 관련성이 있는 과제\n② 실제 상황과 맥락 강조: 지식이 실제 적용되는 상황이나 현장과 관련해서 학습이 이루어질 때 학습이 실제적이며 학교학습이 사회적 과제해결 상황에서의 유용성과 적용 가능성을 가질 수 있게 됨\n③ 활발한 의미협상의 과정: 과제해결을 위해서는 학습자 간 활발한 의미협상이 일어날 수 있는 협동학습이 필요함\n해결지원방안\n① 협동학습 강조: 학습자가 사회적 상호작용을 통해 능동적으로 학습에 참여할 수 있도록 함\n② 학습자원의 제공: 학습자가 학습과제를 스스로 해결하기 위해서 사용할 수 있는 다양한 자원들을 제공함","kw":["학습의 주체","능동적으로 의미를 구성","조언자","안내자","동료학습자","구체성","관련성","실제 상황과 맥락","의미협상","협동학습","학습자원"],"id":"bangbeop-e3"},{"ch":"CH01 교육공학","t":"벌로 SMCR","q":"벌로(Berlo)의 SMCR 모형에서 송신자와 수신자를 구성하는 요소 5가지, 전달내용(Message)을 구성하는 요소 5가지를 설명하고 이 이론의 시사점 1가지를 제시하시오.","ans":"송신자 & 수신자: 통신기술, 태도, 지식수준, 사회체계, 문화양식\n전달내용\n① 내용: 전달하고자 하는 것\n② 요소: 많은 내용 중에서 어떤 내용을 선택하는가에 대한 것\n③ 구조: 선택된 내용을 조직하는 방식(ex. 순서)\n④ 코드: 언어적 코드와 비언어적 코드로 구분됨\n⑤ 처리: 내용을 전달하는 방식\n시사점: 송신자와 수신자의 통신기술, 태도, 지식수준, 사회체계, 문화양식의 유사성 정도에 따라 송신자가 의도한 메시지와 수신자가 받아들이는 메시지가 일치할 수도 있지만 대부분의 경우 완전히 일치하지 않음 ⇒ 통신기술, 태도, 지식수준, 사회체계, 문화양식이 유사할수록 커뮤니케이션이 원만해짐","kw":["통신기술","태도","지식수준","사회체계","문화양식","내용","요소","구조","코드","처리","유사할수록"],"id":"bangbeop-e4"},{"ch":"CH01 교육공학","t":"섀넌-슈람","q":"섀넌(Shannon)-슈람(Schramm)의 커뮤니케이션 모형의 관점에서 의사소통의 효과성을 높이는 방안 2가지를 제시하시오.","ans":"① 송신자와 수신자의 경험의 장이 일치할수록 메시지가 의도한 대로 해석될 가능성이 커지고 더욱 효과적인 의사소통이 이루어질 수 있으므로 활발한 피드백을 주고받음으로써 경험의 장의 일치도를 높여감\n② 물리적 잡음(소음, 통신 불안정성 등), 심리적 잡음(송신자와 수신자 사이의 편견, 선입견, 거부감 등), 의미적 잡음(모호한 표현 등)의 잡음을 제거하도록 함","kw":["경험의 장","일치","활발한 피드백","물리적 잡음","심리적 잡음","의미적 잡음"],"id":"bangbeop-e5"},{"ch":"CH02 교수설계모형과 이론","t":"수업요구분석","q":"수업요구분석의 개념과 필요성 2가지, 수업요구분석의 기법 3가지를 제시하시오.","ans":"수업요구분석: 학습자의 현재 상태에서 바람직한 상태의 차이를 확인하고 원인을 규명하며 이루어짐. 이때 '차이'는 바람직한 상태에서 현재 상태를 뺀 것\n필요성: 수업에서 교수학습의 문제가 발생했을 때 그 원인을 분석하고 최적의 해결방안을 도출하기 위해 필요함. 적절한 수업목표 수립과 효과적인 수업내용, 수업방법, 평가전략 선정 및 개발의 근거가 됨\n기법\n① 설문조사: 관심집단의 작은 표본을 대상으로 다양한 정보를 수집하기 위함\n② 면담: 직접 관련된 사람을 찾아가 대화를 통해 필요한 정보를 얻는 방법으로 일반적으로 수업체제설계의 초기 단계에서 실시\n③ 초점집단 인터뷰: 관심을 두는 대상집단 중에서 해당 사안을 가장 적절하게 대변할 수 있는 사람들을 선발하여 그룹을 편성한 후 집단면담을 실시하는 기법\n④ 관찰: 실제 현장을 방문하여 당사자의 실제 수행 정도 및 그를 둘러싼 환경의 제약조건이나 실태를 파악하는 것","kw":["현재 상태","바람직한 상태","차이","원인을 규명","설문조사","면담","초점집단 인터뷰","관찰"],"id":"bangbeop-e6"},{"ch":"CH02 교수설계모형과 이론","t":"학습자·맥락 분석","q":"학습자특성분석과 수업맥락분석 시 살펴보아야 하는 것의 구체적인 예시 각각 2가지를 제시하시오.","ans":"학습자특성분석: 성별, 연령, 학습능력, 학습동기, 관심사 등\n수업맥락분석: 수업매체, 학생 수, 교실의 크기, 교실의 형태, 책상 배치 형태, 칠판과 스크린의 크기 및 위치, 마이크 시설 등","kw":["성별","연령","학습능력","학습동기","관심사","수업매체","학생 수","교실의 크기","책상 배치","마이크 시설"],"id":"bangbeop-e7"},{"ch":"CH02 교수설계모형과 이론","t":"수업목표","q":"수업목표의 역할 2가지를 제시하시오.","ans":"① 수업에 대한 방향을 제시 ② 수업내용 선정과 조직의 지침이 됨 ③ 학습을 촉진시킴 ④ 평가의 준거로 활용됨","kw":["방향을 제시","선정과 조직의 지침","학습을 촉진","평가의 준거"],"id":"bangbeop-e8"},{"ch":"CH02 교수설계모형과 이론","t":"신교육목표분류학","q":"앤더슨(Anderson)과 크래스월(Krathwohl)의 신교육목표분류학(2001)이 블룸(Bloom)의 인지영역 교육목표분류학과 구별되는 특징 2가지와 지식차원의 명칭 4가지 및 각각의 개념을 제시하시오.","ans":"특징\n① 동사형 제시: Bloom의 인지수준 6단계는 명사형으로 제시되었으나 신교육목표분류학에서는 동사형으로 제시되었음. '지식' 영역은 별도로 독립되고, 지식 대신 '기억하다'는 동사로 대체되었음\n② 종합과 평가의 위계 변화: Bloom의 6단계에서 가장 상위 능력이었던 종합과 평가의 위계가 바뀌었음. 더불어, '종합'은 '창안하다'로 변경됨\n③ 지식의 독립과 세부 유형화: Bloom이 단지 '지식'이라고 보았던 것을 신교육목표분류학에서는 4가지 세부유형(사실적 지식, 개념적 지식, 절차적 지식, 메타인지적 지식)으로 나눔\n지식차원\n① 사실적 지식: 기본적인 정보와 용어, 세부사항에 대한 지식\n② 개념적 지식: 범주, 원리, 이론 등의 상호관계에 대한 지식\n③ 절차적 지식: 방법, 기술, 알고리즘, 과정에 대한 지식\n④ 메타인지적 지식: 자신의 사고과정이나 학습방법에 대한 지식","kw":["동사형","기억하다","종합과 평가의 위계","창안하다","사실적 지식","개념적 지식","절차적 지식","메타인지적 지식"],"id":"bangbeop-e9"},{"ch":"CH02 교수설계모형과 이론","t":"수업목표 진술","q":"수업목표 진술 시 유의사항 3가지와 메이거(Mager)의 수업목표 진술의 구성요소 3가지를 제시하시오.","ans":"유의사항\n① 수업 이전에는 할 수 없었지만 수업 이후에 수업의 결과로 획득하여 할 수 있게 된 행동인 '도착점행동'을 기술해야 함\n② 내용과 행동이 포함된 행동적 용어를 사용해서 구체적으로 진술해야 함\n③ 하나의 목표는 한 개의 학습유형만을 포함해야 함\n메이거의 구성요소\n① 행동: 관찰 및 측정 가능한 용어로 진술되는 구체적 행동\n② 상황·조건: 학습상황이 아닌 수행상황에서 직면하는 제약조건\n③ 준거: 목표 달성 여부를 판별할 수 있는 준거로 양과 질 두 가지 측면 모두 포함","kw":["도착점행동","행동적 용어","한 개의 학습유형","행동","상황","조건","준거","양과 질"],"id":"bangbeop-e10"},{"ch":"CH02 교수설계모형과 이론","t":"과제분석","q":"과제분석의 종류 4가지와 각각의 적용대상을 제시하시오.","ans":"① 군집분석: 언어정보의 학습과제 분석을 위해 주로 사용 ⇒ 위계적 관계가 없는 언어정보의 경우, 서로 관련이 있는 정보들을 묶는 분석방법\n② 위계분석: 지적기능이나 운동기능의 학습과제 분석을 위해 주로 사용 ⇒ 과제를 달성하기 위해 필요한 기능들을 분석하고, 이 기능들을 상위기능에서 하위기능으로 계열화함\n③ 절차분석: 운동기능의 학습과제 분석을 위해 주로 사용 ⇒ 학습과제 실행을 위해 필요한 절차적 단계를 분석함\n④ 통합분석: 태도의 학습과제 분석을 위해 주로 사용 ⇒ 위계분석과 군집분석을 통합적으로 활용","kw":["군집분석","언어정보","위계분석","지적기능","운동기능","절차분석","절차적 단계","통합분석","태도"],"id":"bangbeop-e11"},{"ch":"CH02 교수설계모형과 이론","t":"ADDIE","q":"ADDIE 모형의 절차별 명칭과 각각의 개념, 각 절차별 수행하는 구체적인 활동 2가지를 제시하시오.","ans":"분석(Analysis): 수업설계의 초기에 설계를 위한 조직적인 계획을 정의하는 활동 / 수행활동: 요구분석, 학습자분석, 환경분석, 직무 및 과제분석\n설계(Design): 이전 단계인 분석과정에서 나온 산출물을 토대로 효과적이고 효율적인 수업 프로그램을 개발하기 위하여 수업의 세부요소들을 기획하는 활동 / 수행활동: 학습목표 진술, 평가도구 설계, 구조화와 계열화, 교수전략 및 매체 선정\n개발(Development): 이전 단계인 분석 및 설계 단계에서 만들어진 수업의 청사진에 따라 수업에서 사용할 다양한 유형의 자료들을 실제로 개발하고 제작하는 활동 / 수행활동: 교수·학습자료 개발, 형성평가 및 수정\n실행(Implementation): 이전 단계에서 개발된 수업 프로그램을 실제 수업현장에서 사용하거나 교육과정에 반영하면서 계속 유지하거나 필요한 경우 수정·보완하는 활동 / 수행활동: 교수프로그램 설치·사용 및 유지·관리\n평가(Evaluation): 수업개발의 전반적인 과정 및 결과물의 효과성과 효율성, 가치 등을 평가하는 활동 / 수행활동: 교수프로그램의 성과 및 효과성 평가","kw":["분석","설계","개발","실행","평가","요구분석","학습목표 진술","평가도구 설계","교수·학습자료 개발","형성평가","유지·관리","효과성"],"id":"bangbeop-e12"},{"ch":"CH02 교수설계모형과 이론","t":"딕과 캐리","q":"딕(Dick)과 캐리(Carey)의 체제적 교수설계모형의 절차별 명칭과 절차별 수행해야 하는 과업을 제시하시오.","ans":"① 요구분석(교수목표 확인): 학생의 현재 수준과 이상적인 수준 사이의 괴리인 '요구'를 분석하여 교수목적을 확인하고 목표를 설정함\n② 수업분석(교수분석): 교수목표를 성공적으로 달성하기 위해서 학습자가 학습해야 하는 하위기능들을 분석하고 그 기능들이 어떤 절차로 학습되어야 하는가를 규명함 ⇒ 수업을 시작하기 전에 학생들에게 어떤 출발점행동(지식, 기능, 태도)이 요구되는지 결정하고, 이들 간의 관계를 일목요연하게 정리하여 제시\n③ 학습자 및 학습환경(맥락) 분석: 학습자의 출발점행동 및 나이, 학년, 흥미 등의 일반적 행동과 학습자가 학습내용을 활용하고 학습하는 맥락을 분석함\n④ 성취목표(수행목표) 진술: 학습자가 교수를 통해 성취해야 하는 목표를 구체적으로 행동, 조건, 준거를 포함하여 진술함\n⑤ 평가도구 개발: 목표에 근거한 평가도구와 문항(준거지향평가)을 개발함\n⑥ 수업(교수)전략 수립: 교수목표의 달성을 위한 교수활동전략, 정보제시전략, 학습자참여전략 등을 개발함. 교수목표를 계열화·조직화하고 교수 전 활동 및 검사를 선택하며, 목표별로 제시될 학습내용과 학습자 참여활동을 결정함\n⑦ 수업자료 개발: 이전 단계에서 수립한 수업전략에 따라 수업과 관련된 모든 형태의 자료를 만드는 단계\n⑧ 형성평가 설계 및 실행: 프로그램의 질을 개선하기 위해 필요한 자료를 수집하고 단계별로 수정할 부분을 수정함. 일대일 평가, 소집단 평가, 현장평가 등을 실시함\n⑨ 총괄평가 설계 및 실행: 프로그램의 가치를 측정하고 프로그램의 지속적인 활용이나 수정 필요성 등을 판단함","kw":["요구분석","수업분석","출발점행동","학습환경","성취목표","평가도구 개발","수업전략","수업자료 개발","형성평가","총괄평가"],"id":"bangbeop-e13"},{"ch":"CH02 교수설계모형과 이론","t":"래피드 프로토타입","q":"래피드 프로토타입(Rapid Prototype) 모형에서 원형의 개념, 이 모형의 특징과 장점 각각 1가지를 제시하시오.","ans":"원형: 설계 초기에 최종 결과물의 기능과 형태를 가진 형태\n특징: 사용자와 설계자가 서로 협동하며 원형을 개발한 후 문제점을 발견하고 수정·보완함. 교수설계의 현장을 반영하여 상황특성과 맥락적 특성을 고려하는 비선형적 교수설계 방식\n장점\n① 구성원의 요구를 세세하게 반영함으로써 발생하는 교육과정 개발의 어려움을 최소화하기 위해 분석단계에서 원형을 개발함 ⇒ 교육과정 설계를 더욱 빠르고 효율적으로 할 수 있음\n② 개발 원형에 교육과정 설계자뿐 아니라 사용자도 참여함 ⇒ 학습자와 교수자라는 교육과정 사용자의 다양한 요구가 효과적으로 반영될 수 있음","kw":["최종 결과물의 기능과 형태","협동","수정·보완","비선형적","분석단계","빠르고 효율적","사용자도 참여"],"id":"bangbeop-e14"},{"ch":"CH02 교수설계모형과 이론","t":"켐프·윌리스","q":"켐프(Kemp)의 교수체제설계모형의 특징 2가지와 윌리스(Willis)의 R2D2 모형의 특징 2가지를 제시하시오.","ans":"켐프 모형\n① 순환적인 형태를 지니며 교수설계자는 모형의 어느 단계, 어느 과정에서든지 시작할 수 있고 여러 단계를 동시에 진행하는 것도 가능\n② 요구분석을 시작으로 시계방향으로 움직이며, 교수설계에서 필요한 요소들만 뽑아서 진행할 수도 있음\n③ 확인평가, 형성평가, 총괄평가를 구분하며 평가의 중요성 강조\nR2D2 모형\n① 분명한 시작과 끝이 없고 '정의, 설계와 개발, 확산'이라는 세 가지 주요 초점 간의 계속적인 상호작용을 통해 설계가 이루어짐\n② 초반에 명시적인 목표를 설정하지 않고 설계·개발과정에서 자연스럽게 나타나는 목표에 주목함\n③ 프로토타입에 대한 형성평가를 통해 지속적이고 순환적인 설계·개발과정을 거쳐 최종적인 수업산출물을 만듦","kw":["순환적","어느 단계에서든지","확인평가","형성평가","총괄평가","정의","설계와 개발","확산","명시적인 목표","프로토타입"],"id":"bangbeop-e15"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 관점에서 교수조건의 특징 1가지와 교수조건의 구성요소 4가지의 명칭을 개념과 함께 제시하시오.","ans":"교수조건의 특징: 교수설계자 또는 교사가 통제할 수 없는 제약조건으로 교수방법에 영향을 미침\n구성요소\n① 교과내용의 특성: 학습의 대상이 되는 교과의 내용이나 지식(개념, 원리, 절차, 기법, 명제적 지식, 절차적 지식 등)\n② 교수목적: 교수·학습활동의 결과로서 달성해야 하는 목표와 그 수준이나 정도 등\n③ 제약점: 기자재, 재정, 자원, 인원 등 교수·학습을 제약하는 조건 등\n④ 학습자 특성: 학습자의 선수학습수준, 적성, 동기, 학습양식 등","kw":["통제할 수 없는 제약조건","교과내용의 특성","교수목적","제약점","학습자 특성"],"id":"bangbeop-e16"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 관점에서 교수방법의 개념과 교수방법의 구성요소 3가지의 명칭을 개념과 함께 제시하시오.","ans":"개념: 교수조건에 따라 의도하는 학습결과를 효과적으로 성취하기 위하여 사용되는 다양한 교수전략의 총체. 교수조건과 달리 교사의 개인적 노력과 발상에 따라 다양하게 실현될 수 있음\n구성요소\n① 조직전략: 교수조건과 학습내용의 종류와 크기에 따라 내용을 어떻게 최적의 상태로 조직할 것인지에 대한 전략\nⓐ 미시적 조직전략: 하나의 아이디어를 가르치는 데 있어 이를 어떻게 조직할 것인가에 대한 전략\nⓑ 거시적 조직전략: 여러 복합적인 아이디어에 대한 수업전략\n② 전달전략: 조직된 학습내용을 언제, 어떻게 제시할 것인가에 대한 전략. 매체활용, 교수모형, 학습자료 등\n③ 관리전략: 교수·학습의 설계, 개발, 실행, 평가 등의 모든 과정을 체계적으로 관리하는 전략","kw":["교수전략의 총체","개인적 노력","조직전략","미시적","거시적","전달전략","관리전략"],"id":"bangbeop-e17"},{"ch":"CH02 교수설계모형과 이론","t":"롸이겔루스","q":"롸이겔루스(Reigeluth)의 이론에서 교수결과를 구성하는 3가지 요소 각각의 명칭과 개념을 제시하시오.","ans":"① 효과성: 교수·학습과정을 통해 학습자가 지식 및 기능을 얼마나 효과적으로 습득하였는가\n② 효율성: 교육목표 달성에 있어 얼마나 많은 노력, 비용, 시간이 소요되었는가\n③ 매력성: 학습자의 학습동기와 관련. 학습자가 교수·학습과정에서 얼마나 학습에 매력과 열의를 느끼고 배운 내용을 활용하고자 하는 성향을 의미","kw":["효과성","효율성","매력성","노력","비용","시간","학습동기"],"id":"bangbeop-e18"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)의 관점에서 5가지 학습유형의 명칭을 개념과 함께 제시하시오.","ans":"① 언어정보: 진술 가능한 지식. 선언적 지식에 해당\n② 지적기능: 언어, 숫자 등의 상징을 사용해서 환경을 설명하고 반응하게 하는 기능\n③ 인지전략: 학습자가 자신의 사고, 행동, 감정 등을 통제하고 안내하기 위하여 활용하는 전략\n④ 운동기능: 근육을 활용해서 목표하는 동작을 잘 실행하는 것\n⑤ 태도: 사물, 사람, 사건에 대해 습득된 특정한 경향성","kw":["언어정보","선언적 지식","지적기능","상징","인지전략","운동기능","태도","경향성"],"id":"bangbeop-e19"},{"ch":"CH02 교수설계모형과 이론","t":"가네","q":"가네(Gagné)가 주장한 학습의 내적조건과 외적조건 각각의 개념과 각 조건의 구성요소의 명칭을 개념과 함께 제시하시오.","ans":"내적조건: 학습이 발생하기 위한 학습자의 내적 인지과정\n① 선행학습: 새로운 학습과제에 대한 선행학습 정도\n② 학습동기: 학습을 시작하고 방향을 결정하며 끈기와 강도를 결정하는 힘\n③ 자아개념: 긍정적 자아개념은 성공적인 학습에 영향을 줌\n④ 주의력: 학습과제에 집중하는 정도\n외적조건: 학습의 내적 과정을 활성화하고 지원하는 다양한 교수사태\n① 강화의 원리: 새로운 행동에 강화가 제공되면 학습이 잘 이루어짐\n② 접근의 원리: 자극과 반응이 시간적으로 근접할 때 학습이 잘 이루어짐\n③ 연습의 원리: 새로운 학습내용에 대한 충분한 연습이 필요함","kw":["내적 인지과정","선행학습","학습동기","자아개념","주의력","교수사태","강화의 원리","접근의 원리","연습의 원리"],"id":"bangbeop-e20"},{"ch":"CH02 교수설계모형과 이론","t":"가네 9교수사태","q":"가네(Gagné)가 제안한 9가지 교수사태의 단계별 명칭을 그에 따른 학습자의 학습과정과 함께 제시하시오.","ans":"[학습 준비]\n1단계-주의획득 → 주의집중\n2단계-학습목표 제시 → 기대감 형성\n3단계-선수학습의 회상 자극 → 작동기억으로 인출\n[정보 획득과 수행]\n4단계-자극자료 제시 → 학습자료에 대한 선택적 지각\n5단계-학습안내 제공 → 의미적 부호화를 통한 장기기억으로 저장\n6단계-수행유도 → 학습결과를 보여주는 반응(수행)\n7단계-피드백 제공 → 학습결과에 대한 강화\n[학습 전이]\n8단계-수행평가 → 인출 및 강화\n9단계-파지와 전이 증진 → 인출 및 일반화","kw":["주의획득","학습목표 제시","선수학습의 회상 자극","자극자료 제시","학습안내 제공","수행유도","피드백 제공","수행평가","파지와 전이 증진","의미적 부호화","일반화"],"id":"bangbeop-e21"},{"ch":"CH02 교수설계모형과 이론","t":"메릴","q":"메릴(Merrill)이 내용요소제시이론을 통해 제안한 4가지 내용수준과 3가지 수행수준의 명칭, 학습유형에 따른 1차적 자료제시형태 4가지를 설명하시오.","ans":"4가지 내용수준: 사실, 개념, 절차, 원리\n3가지 수행수준: 기억하기, 활용하기, 발견하기\n1차적 자료제시형태\n① 일반·설명식: 교사가 학생에게 개념이나 원리 등의 인지적 학습내용을 설명해주는 것\n② 사례·설명식: 교사가 개념이나 원리 등이 직접 적용되는 구체적인 사례를 제시하는 것\n③ 일반·질문식: 교사가 학생에게 이미 배운 내용의 정의나 일반원리를 회상시키는 것이나 아직 배우지 않은 일반적인 내용을 학생으로부터 이끌어내는 것\n④ 사례·질문식: 교사가 개념이나 원리 등이 적용된 구체적인 사례에 대한 질문을 던지는 것","kw":["사실","개념","절차","원리","기억하기","활용하기","발견하기","일반·설명식","사례·설명식","일반·질문식","사례·질문식"],"id":"bangbeop-e22"},{"ch":"CH02 교수설계모형과 이론","t":"메릴","q":"메릴(Merrill)에 따를 때 2차 제시형의 세부전략 4가지를 제시하시오.","ans":"① 맥락: 학습내용과 관련된 상황이나 배경지식, 맥락정보를 함께 제시\n② 선수학습: 특정 내용 학습을 위해 사전에 알고 있어야 할 정보 제시\n③ 기억촉진: 특정 내용을 잘 기억할 수 있도록 암기방법 제공\n④ 도움: 특정 내용을 쉽게 이해할 수 있도록 관련 도움정보 제공\n⑤ 표현: 같은 내용이나 정보를 나타낼 수 있는 다양한 표현방법을 사용하여 내용 제시\n⑥ 피드백: 학습자에게 질문을 하고 답변내용에 대해 적절히 반응하고 교정함","kw":["맥락","선수학습","기억촉진","도움","표현","피드백"],"id":"bangbeop-e23"},{"ch":"CH02 교수설계모형과 이론","t":"정교화이론","q":"롸이겔루스(Reigeluth)가 주장한 정교화이론의 특징 2가지와 이 이론에서 제시하는 교수전략 중 3가지를 설명하시오.","ans":"특징\n① 메릴의 내용요소제시이론을 거시적인 수준으로 확장시키기 위하여 개발된 이론\n② 교수내용의 선정, 계열화, 종합, 요약에 있어 적절한 방법을 처방함\n③ 카메라 렌즈는 대상의 전체적인 내용을 보여주고, 줌렌즈는 각 부분을 확대해서 자세하게 보여줌\n교수전략\n① 정교화 계열: 단순한 내용으로부터 시작하여 점점 더 복잡한 내용으로 교수·학습과제를 조직함\n② 선행학습의 계열: 특정 과제를 해결하기 위해 학습해야 할 내용을 쉬운 것에서 어려운 것, 단순한 것에서 복잡한 것으로 계열화함\n③ 요약자: 수업에서 학습한 내용을 잊어버리지 않고 체계적으로 복습하기 위해 요약자를 제시함\n④ 종합자: 단일 유형 아이디어들의 관계를 정의하고 이들을 통합하는 요소(일반성, 사례, 연습문항 등으로 제시)\n⑤ 비유: 새로운 아이디어를 학습자에게 친숙한 아이디어와 연관지어 설명함\n⑥ 인지전략 활성자: 학습자에게 명시적으로 인지전략을 활용할 것을 제시함\n⑦ 학습자 통제: 학습자가 자신의 학습에 있어 선택권과 통제력을 갖도록 함(내용, 속도, 교수전략 제시, 인지전략을 선택·계열화하는 자유 부여)","kw":["거시적인 수준","선정","계열화","종합","요약","카메라 렌즈","줌렌즈","정교화 계열","선행학습의 계열","요약자","종합자","비유","인지전략 활성자","학습자 통제"],"id":"bangbeop-e24"},{"ch":"CH02 교수설계모형과 이론","t":"개념학습","q":"롸이겔루스(Reigeluth)의 개념학습의 절차를 설명하시오.","ans":"① 제시: 일반성(정의), 상위개념, 결정적 속성으로 제시하며 결정적 속성을 지닌 사례를 제시함\n② 연습: 이전에 접하지 못한 사태에 개념을 적용하도록 발산적 사례들을 다양하게 제시함\n③ 피드백: 학습자가 개념을 적용하는 과정에서 피드백을 제공하고 칭찬이나 격려를 통해 학습동기를 유발함","kw":["제시","일반성","상위개념","결정적 속성","연습","발산적 사례","피드백","칭찬","격려"],"id":"bangbeop-e25"},{"ch":"CH02 교수설계모형과 이론","t":"ARCS","q":"켈러(Keller)의 ARCS 전략의 구성요소 4가지의 명칭을 각각을 높이는 구체적 방안 2가지와 함께 제시하시오.","ans":"주의(Attention)\n∙지각적 주의환기: 새롭고, 놀라우면서, 기존의 것과 모순되거나 불확실한 사실 또는 정보를 교수상황에 사용함으로써 학습자의 주의를 유발·유지시키는 전략\n∙탐구적 주의환기: 학습자에게 스스로 문제나 질문 등을 만들게 함으로써 정보탐색 행동을 자극하는 것\n∙다양성: 교수요소에 다양한 변화를 주어 학습자의 흥미를 유지시키는 것\n관련성(Relevance)\n∙친밀성: 학습자의 경험과 가치에 연관되는 예문이나 구체적인 용어, 개념 등을 사용하는 것\n∙목적지향성: 결과 측면의 관련성을 높일 수 있는 구체적 방법을 제시해주기 위해 교수의 목표나 실용성을 나타내는 진술이나 예문을 포함시키는 것\n∙필요나 동기와의 부합성: 교수과정 또는 방법 측면의 관련성과, 학습자의 필요나 동기와 부합되는 수업전략을 사용하는 것\n자신감(Confidence)\n∙학습의 필요조건 제시: 수업목표를 구체적으로 진술하거나 평가기준을 공개하고, 새로운 학습에 요구되는 선행학습 정도를 제시하면서 학습자에게 학습에 대한 요건을 분명하게 설명해줌으로써 학습자가 성공의 가능성 여부를 짐작하도록 도와주려는 것\n∙성공의 기회 제시: 성공의 기회는 학습과정과 수행의 조건에서 적절한 수준의 도전감을 제공하는가와 관련 있음\n∙개인적인 통제감 제시: 학업에서의 성공이 개인의 노력이나 능력에 기인한다는 피드백과 그 조절의 기회를 제공함으로써 얻어질 수 있는 것\n만족감(Satisfaction)\n∙자연적 결과 강조(내재적 강화): 학습자의 내적 동기를 유지시키려는 것으로, 학습자가 새로 습득한 지식이나 기술을 실제 또는 모의 상황에 적용해 보는 기회를 제공하는 것\n∙긍정적 결과 강조(외재적 강화): 바람직한 행동을 유지하기 위해 성공적인 학습결과에 대한 긍정적 피드백이나 보상을 제공하는 것\n∙공정성 강조: 학습자의 학업성취에 대한 기준과 결과가 일관성 있게 유지되어야 한다는 것","kw":["주의","관련성","자신감","만족감","지각적 주의환기","탐구적 주의환기","다양성","친밀성","목적지향성","부합성","학습의 필요조건","성공의 기회","개인적인 통제감","자연적 결과","긍정적 결과","공정성"],"id":"bangbeop-e26"},{"ch":"CH02 교수설계모형과 이론","t":"프로그램 교수법","q":"스키너(Skinner)의 프로그램 교수법의 장점과 단점 각각 2가지, 학습원리 중 점진적 접근의 원리와 적극적 반응의 원리 각각의 개념, 프로그램 학습의 형태 2가지를 제시하시오.","ans":"장점\n① 개별화 학습이 가능하고, 학습자의 능동적인 참여가 이루어짐\n② 단순한 지식 및 기능 학습에 효과적임\n③ 학습자의 수행에 대한 즉각적인 피드백이 가능함\n단점\n① 프로그램을 개발하는 데 많은 비용이 듦\n② 협동학습과 고등정신기능의 함양이 어려움\n점진적 접근의 원리: 학습과제를 활용한 학습은 쉬운 것 → 어려운 것, 단순한 것 → 복잡한 것의 순서로 이루어져야 함\n적극적 반응의 원리: 학습자가 제시된 내용에 대하여 능동적이고 적극적으로 반응할 때 효과적인 학습이 가능함\n프로그램 학습의 형태\n① 직선형 프로그램: 모든 학습내용이 동일한 순서로 계열화되어 있으며 모든 학습자들은 같은 순서로 같은 내용을 학습함\n② 분지형 프로그램: 학습과제에 대한 학습자의 반응 정도 및 종류에 따라 다양한 순차가 가능","kw":["개별화 학습","능동적인 참여","즉각적인 피드백","비용","협동학습","고등정신기능","점진적 접근","적극적 반응","직선형","분지형"],"id":"bangbeop-e27"},{"ch":"CH02 교수설계모형과 이론","t":"캐롤","q":"캐롤(Carroll)의 학교학습이론에서 학습효과를 극대화하는 방안 2가지와 학습자 변인 3가지, 교사 변인 2가지의 명칭과 각각의 개념을 제시하시오.","ans":"학습효과 극대화 방안\n① 학습에 필요한 시간을 최소화: 수업의 질을 높이면 학습자의 이해력이 높아지므로 학습에 필요한 시간을 줄여 학습의 정도를 높일 수 있음. 학습에 필요한 시간을 최소화하고, 학습에 사용된 시간을 최대화하면 학습의 정도를 극대화할 수 있음\n② 학습지속력과 학습기회를 높임: 동기화 전략을 통해 학습지속력을 최대한 유지시키고, 학습기회를 충분히 제공하면 학습에 사용된 시간이 늘어나므로 완전학습에 이르도록 함\n학습자 변인\n① 적성: 학습자가 주어진 학습과제를 일정한 수준까지 학습하는 데 필요한 시간\n② 수업이해력: 수업내용을 이해하는 학습자의 능력(일반지능, 언어적 지능 포함)\n③ 학습지구력(=학습지속력): 학습자가 인내심을 가지고 학습과제에 적극적으로 참여하는 시간(학습자의 주의집중, 흥미, 태도 등에 영향을 받는 일종의 학습동기)\n교사 변인\n① 수업의 질: 교수방법, 수업목표의 구체성, 교사가 사용하는 언어의 명확성, 학습활동의 계열화 등이 효과적으로 이루어졌는지를 의미\n② 학습기회: 학습자에게 학습과제의 해결을 위해 허용된 시간","kw":["필요한 시간을 최소화","사용된 시간을 최대화","학습지속력","학습기회","적성","수업이해력","학습지구력","수업의 질"],"id":"bangbeop-e28"},{"ch":"CH02 교수설계모형과 이론","t":"블룸 완전학습","q":"블룸(Bloom)의 완전학습모형의 관점에서 수업의 질을 높이는 데 기여하는 요인 2가지를 제시하시오.","ans":"① 단서: 학습과제를 제시할 때 교사가 제공하는 모든 정보\n② 참여: 학습과제를 학습하고자 하는 학습자의 노력행동\n③ 강화: 학습과정에서 교사가 제공하는 칭찬이나 지지 등과 같은 학습자 행동에 대한 교사의 정의적 반응\n④ 피드백과 학습교정: 학습자의 수행에 대해 교사가 제공하는 강화","kw":["단서","참여","강화","피드백","학습교정","정의적 반응"],"id":"bangbeop-e29"},{"ch":"CH02 교수설계모형과 이론","t":"블룸 완전학습","q":"블룸(Bloom)의 완전학습모형에서 수업 전 단계, 수업 중 단계, 수업 후 단계 각각에서 교사가 하는 활동 2가지를 설명하시오.","ans":"수업 전 단계\n① 기초학력 진단(학습결손 발견): 개별 학습자의 선행학습 정도를 진단하여 어떤 학습자가 선행학습 결손을 가지고 있는지 파악\n② 기초학습 보충과정(학습결손 처치): 학습결손이 있는 학습자에게 연습문제나 교재 등을 제공하여 가정학습으로 학습결손 정도를 보충할 수 있도록 함\n수업 중 단계\n① 형성평가: 형성평가를 통해 교사는 수업의 개선을 위한 정보를 획득하고 학습자는 스스로의 학습 정도를 확인함\n② 보충과정: 형성평가에서 부진한 학습자에게 재학습의 기회를 제공함\n③ 심화과정: 형성평가에서 일정한 수준에 도달한 학습자에게 학습경험을 심화시킬 수 있는 기회를 제공함\n수업 후 단계\n① 총합적 평가: 일정 기간의 수업이 종결된 후 학습자의 성취도를 평가하고 수업활동에 대한 효과성과 효율성을 판단함","kw":["기초학력 진단","학습결손","기초학습 보충과정","형성평가","보충과정","심화과정","총합적 평가"],"id":"bangbeop-e30"},{"ch":"CH02 교수설계모형과 이론","t":"탐구학습","q":"듀이(Dewey)의 관점에서 탐구학습과 반성적 사고 각각의 개념, 탐구학습모형의 장점과 단점 각각 2가지를 제시하시오.","ans":"탐구학습: 학습자가 스스로 탐구주제를 설정하고 탐구과정을 통해서 학습내용을 능동적으로 습득하는 학습\n반성적 사고: 문제의 원인과 결과의 관계를 파악하고 탐색해 나가는 정신활동. 실제적인 문제에 대한 인식에서부터 시작함\n장점\n① 학생의 자율성과 능동적 태도를 기를 수 있음\n② 학생이 문제를 스스로 해결함으로써 내적 보상을 얻을 수 있음\n③ 자기주도성과 협업기술 향상에 효과적임\n④ 고차적 사고력, 초인지적 능력, 자기주도적 학습능력 등을 기를 수 있음\n단점\n① 기초학력 향상에 비효율적임\n② 학습의 방향성을 잃기 쉬움\n③ 노력에 비해 지적 성장이 비능률적일 수 있음","kw":["탐구주제","능동적으로 습득","반성적 사고","원인과 결과","자율성","내적 보상","자기주도성","기초학력","방향성","비능률적"],"id":"bangbeop-e31"},{"ch":"CH02 교수설계모형과 이론","t":"발견학습","q":"브루너(Bruner)가 발견학습모형을 통해 제안한 효율적 수업을 위한 4가지 요소와 발견학습의 장점과 단점 각각 2가지를 제시하시오.","ans":"4가지 요소\n① 학습경향성의 자극: 학습자의 학습하고자 하는 성향 또는 욕구를 자극하는 것\n② 지식의 구조: 학문을 구성하는 가장 기본적인 아이디어, 개념, 원리와 법칙 등을 체계화한 것\n③ 학습의 계열화: 학습과제를 제시해주는 순서\n④ 강화: 학습자의 학습 정도를 수시로 확인하고 학습결과에 대해 보상을 주는 것\n장점\n① 학습자의 정보조직능력, 문제해결능력, 자신감, 지적 잠재력을 증대시킬 수 있음\n② 발견학습을 성공적으로 마쳤을 때 지적 만족감, 희열 등과 같은 내재적인 보상을 경험할 수 있음\n③ 학습자는 스스로 지식의 구조를 발견하는 과정 속에서 내용적인 지식뿐만 아니라 이를 획득하는 탐구방법과 전략까지 습득할 수 있음\n단점\n① 학습에 소요되는 시간이 큼\n② 단시간에 많은 양의 단순개념을 습득하는 학습에 비효율적임\n③ 수업준비에 대해 교사가 가지는 부담이 큼","kw":["학습경향성의 자극","지식의 구조","학습의 계열화","강화","정보조직능력","내재적인 보상","탐구방법","소요되는 시간","수업준비"],"id":"bangbeop-e32"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 주장한 유의미학습이 일어나기 위한 학습과제의 조건 2가지와 학습자의 조건 2가지 각각의 명칭을 개념과 함께 제시하시오.","ans":"학습과제의 조건\n① 실사성: 불변적·절대적인 특성. 한 명제를 어떻게 표현하더라도 그 의미와 본성이 변하지 않는 것\n② 구속성: 임의로 맺어진 관계가 시간이 흐른 이후에도 변경될 수 없는 것\n학습자의 조건\n① 관련정착의미(지식): 학습자의 기존 인지구조 속에 존재하는 새로운 과제와 관련된 지식\n② 학습자의 학습태세: 과제를 학습하고자 하는 학습자의 동기","kw":["실사성","불변적","절대적","구속성","임의로 맺어진 관계","관련정착의미","인지구조","학습태세"],"id":"bangbeop-e33"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 주장한 선행조직자의 개념과 목적, 선행조직자의 종류 2가지 각각의 명칭을 개념과 함께 제시하시오.","ans":"선행조직자: 유의미학습을 촉진하기 위해 학습 전에 제공되는 자료. 인지구조를 강화하고 새로운 정보의 파지를 촉진하기 위해 우선적으로 도입되는 정보 및 자료\n목적: 새로운 학습을 위해 개념망 부여, 학습자가 가지고 있는 정보 연결, 장기적인 부호화를 촉진함\n종류\n① 설명조직자: 학습자의 선행지식과 새로운 학습과제 간에 유사성이 없을 때 제시. 개념의 정착 근거 마련을 위한 포괄적이고 일반적인 자료\n② 비교조직자: 학습자의 선행지식과 새로운 학습과제 간에 상당한 유사성이 존재할 때 제시. 선행지식에 있는 개념과 새로운 학습과제의 개념 간의 유사성과 차이점을 분명히 제시함으로써 상호간의 변별력을 증대시킴","kw":["학습 전에 제공","인지구조를 강화","파지","개념망","장기적인 부호화","설명조직자","비교조직자","변별력"],"id":"bangbeop-e34"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 제안한 포섭(Subsumption)의 개념과 포섭의 종류 3가지의 명칭을 개념과 함께 제시하고, 하위적 포섭의 종류 2가지의 명칭을 개념과 함께 제시하시오.","ans":"포섭: 새로운 학습과제를 학습자의 인지구조 속으로 병합시키는 과정 (≒학습)\n종류\n① 하위적 포섭: 학습자가 기존에 갖고 있던 개념보다 하위의 학습과제를 포섭하는 것\n② 상위적 포섭: 학습자가 기존에 갖고 있던 개념보다 상위의 학습과제를 포섭하는 것\n③ 병위적 포섭(병렬적 포섭): 학습자가 기존에 갖고 있던 개념과 대등한 수준의 학습과제를 포섭하는 것\n하위적 포섭의 종류\n① 상관적 포섭: 새로운 학습과제가 기존에 갖고 있는 개념을 확장·수정·정교화할 때 발생\n② 파생적 포섭: 새로운 학습과제가 기존 개념의 구체적인 사례일 때 발생","kw":["병합","하위적 포섭","상위적 포섭","병위적 포섭","병렬적","상관적 포섭","확장","수정","정교화","파생적 포섭","구체적인 사례"],"id":"bangbeop-e35"},{"ch":"CH02 교수설계모형과 이론","t":"오수벨","q":"오수벨(Ausubel)이 제안한 수업원리 중 선행조직자의 원리와 점진적 분화의 원리, 학습준비도의 원리 각각의 개념을 제시하시오.","ans":"선행조직자의 원리: 새로운 학습과제를 제시하기 전에 관련된 선행조직자로서 일반성·포괄성을 지닌 자료를 먼저 제시함\n점진적 분화의 원리: 학문의 내용 중 가장 포괄적인 것부터 세부적인 것, 특수한 것으로 점차 내용을 분화시켜서 제시함\n학습준비도의 원리: 학습자의 기존 인지구조 이외에도 학습자의 발달수준을 확인하고 관련된 학습경험을 제공함","kw":["선행조직자의 원리","일반성","포괄성","점진적 분화","세부적","특수한","학습준비도","발달수준"],"id":"bangbeop-e36"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"조나센(Jonassen)의 구성주의 학습환경설계모형(CLEs)에서 구성주의 환경의 구성요소 6가지의 명칭을 개념과 함께 제시하시오.","ans":"① 문제·프로젝트: 학생들이 해결해야 할 문제나 완성해야 할 프로젝트\n② 관련사례: 문제해결을 위해 참조할 수 있는 관련 경험\n③ 정보자원: 학습자가 문제를 확인하고 가설을 설정하는 데 필요한 정보(ex. 텍스트, 그래픽, 음성자원, 비디오 등)\n④ 인지적 도구: 학습자들이 생각을 시각화하거나 조직하는 것을 도와주기 위해 개발된 컴퓨터 소프트웨어 등(ex. 시각화도구, 모델링도구, 수행지원도구, 검색도구 등)\n⑤ 대화·협력도구: 학생이 동료학습자와 협력할 수 있는 도구(ex. 토론게시판, 채팅도구, 공동작업 문서 등)\n⑥ 사회적·맥락적 지원: 성공적인 학습과 실행이 가능하도록 하는 물리적·조직적·문화적 측면 등의 맥락적 요인을 지원함(ex. 오리엔테이션)","kw":["문제","프로젝트","관련사례","정보자원","인지적 도구","대화·협력도구","사회적","맥락적 지원"],"id":"bangbeop-e37"},{"ch":"CH03 구성주의 교수·학습","t":"조나센 CLEs","q":"구성주의 학습환경에서 사용되는 문제에 포함되는 세 가지 요소를 설명하고, 조나센(Jonassen)에 따를 때 구성주의 학습환경에서의 학습활동과 교수활동 각각 3가지의 명칭을 개념과 함께 제시하시오.","ans":"문제의 세 요소\n① 맥락: 문제는 구체적인 맥락이 함께 제시되어야 함\n② 표상: 학습자의 관심을 이끌어낼 수 있도록 실제적으로 제시되어야 함\n③ 조작공간: 학습자들이 문제를 조작할 수 있도록 해야 함\n학습활동\n① 탐색: 학습자는 다양한 탐색활동을 통해 가설설정, 자료수집, 잠정적 결론의 도출 등을 수행하며 학습대상을 탐색함\n② 명료화: 이미 알고 있는 것이나 알게 된 것을 분명히 함\n③ 반추: 탐색하고 명료화한 정보를 다시 돌아보며 이해도를 확인하고 학습과정과 결과를 평가함\n교수활동\n① 모델링: 교수자가 시연을 보이면서 생각을 소리 내어 말하거나 중요한 행동이나 과정에 대한 단서를 설명함\n② 코칭: 개인이 학습을 하거나 과제를 수행하는 동안 그들을 관찰하고 도움\n③ 스캐폴딩: 학습자에 맞는 과제난이도 조절, 부족한 사전지식을 보완할 수 있도록 과제 재구성, 기존과는 다른 평가기회 제공 등의 형태로 주어질 수 있음. 스캐폴딩은 학습자의 성장에 따라 점차 소거되어야 함","kw":["맥락","표상","조작공간","탐색","명료화","반추","모델링","코칭","스캐폴딩","소거"],"id":"bangbeop-e38"},{"ch":"CH03 구성주의 교수·학습","t":"4C/ID","q":"4C/ID 모형의 목적과 4C/ID 모형의 4가지 요소를 설명하시오.","ans":"목적: 복잡하고 비구조화된 실제적 과제를 통한 문제해결력 향상을 위한 교수설계모형으로 실제적 문제해결을 위한 복잡한 인지기능을 개발하기 위함\n요소\n① 학습과제: 단순한 수준에서 현실적 문제를 해결하는 복잡한 수준에 이르기까지 다양하게 구성(학습과제를 계열화함)\n② 지원적 정보: 문제해결에 필요한 일반적, 추상적 지식에 대한 정보(선언적 지식 형태의 학습지원)\n③ 절차적 정보: 문제해결에 필요한 순환적·절차적 지식에 대한 정보\n④ 부분과제 연습: 학습과제와 관련된 특정 기능을 자동화하기 위한 목적에서 제시","kw":["비구조화된 실제적 과제","복잡한 인지기능","학습과제","계열화","지원적 정보","선언적 지식","절차적 정보","부분과제 연습","자동화"],"id":"bangbeop-e39"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습(situated learning)에서 학습자와 교사의 역할 각각 1가지, 학습과제를 제시하는 방법 2가지를 제시하시오.","ans":"학습자의 역할: 협동학습 통해 의미를 공유하고 자신의 아이디어를 반성하고 명료화하는 주도적인 역할\n교사의 역할: 인지적 코치, 전문가로서 과제를 수행하면서 인지적 전략 시연, 학습자의 문제해결과정을 코칭, 스캐폴딩을 제공하는 학습촉진자\n학습과제 제시방법\n① 미시적 수준: 주제에 관한 다양한 작은 사례나 맥락을 제공함\n② 거시적 수준: 여러 관점에서 해석될 수 있는 충분히 복잡한 맥락을 제공함","kw":["의미를 공유","반성","명료화","주도적인 역할","인지적 코치","인지적 전략 시연","학습촉진자","미시적 수준","거시적 수준"],"id":"bangbeop-e40"},{"ch":"CH03 구성주의 교수·학습","t":"상황학습","q":"상황학습(situated learning)에서 실천공동체의 개념과 학습이 이루어지는 과정을 설명하고, 상황학습 설계의 주안점 3가지를 제시하시오.","ans":"실천공동체의 개념: 자신의 일에 대한 열정을 공유하고 정기적으로 상호작용하여 그것을 더 잘하는 방법을 배우려는 사람들의 모임\n학습이 이루어지는 과정: 실천공동체의 '합법적(정당한) 주변적 참여'로부터 핵심적인 구성원이 되어가는 과정에서 발생함 ⇒ 초보자는 학습의 주변적 참여자로서 전체 과정을 관찰하고 전체 그림을 이해하면서 기존 경험이 있는 구성원에게 지속적인 피드백을 받는 과정을 통해 점차 공동체의 중심 구성원으로 활동할 수 있게 됨\n설계의 주안점\n① 학습자 중심의 협동학습: 학생들끼리 협동하여 현실 상황에서 접할 수 있는 협동체제를 경험하도록 함\n② 맥락화된 실제적 과제: 실제적 활동은 상황화된 인지의 핵심적인 부분으로 실제 삶과 연관되고 목적이 있는 실제적 활동이 제시되어야 함\n③ 피드백 과정: 교사와 동료학습자들이 학습자의 수행을 관찰하고 관찰결과를 제공해야 함. 이를 통해 학습자는 자신이 사고한 절차를 전문가나 다른 학습자와 비교하고 반성적으로 성찰할 수 있게 됨","kw":["실천공동체","열정을 공유","합법적 주변적 참여","핵심적인 구성원","협동학습","맥락화된 실제적 과제","상황화된 인지","피드백 과정","반성적으로 성찰"],"id":"bangbeop-e41"},{"ch":"CH03 구성주의 교수·학습","t":"정착식 교수","q":"정착식 교수(anchored instruction)의 개념과 정착식 교수가 일반적인 상황학습에 비해 강조하고 있는 점 2가지를 제시하시오.","ans":"개념: 장편적이고 복선적으로 배열된 맥락적 상황(실제적 장면, 거시적 맥락)을 제공하여 이를 통해 장편적 맥락의 학습에 닻을 내리고 복잡한 문제상황 속에서 존재하는 다양한 맥락을 장기간 동안 경험하도록 함\n강조점\n① 상황학습처럼 학생의 상황과 학습상황을 맥락적으로 연결시키는 것을 강조\n② 학생들이 문제해결을 위해 필요한 자료와 정보를 능동적으로 찾을 기회를 제공하기 위해 여러 멀티미디어를 활용해 현장감 있는 상황을 제공하는 것을 강조","kw":["장편적","복선적","맥락적 상황","닻","다양한 맥락","맥락적으로 연결","멀티미디어","현장감"],"id":"bangbeop-e42"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 도제학습","q":"인지적 도제학습의 특징 2가지와 6단계 각 교수절차의 명칭을 절차별로 이루어지는 구체적인 교수-학습활동과 함께 제시하시오.","ans":"특징\n① 학습의 실제적 맥락의 중요성을 강조함\n② 학습자는 한 분야의 전문가들이 공유하는 문화에 점진적으로 동참해 나가며 학습함\n③ 학습자는 단순한 지식습득뿐만 아니라 전문가들의 사고과정, 즉 메타인지적 기술을 학습함\n교수절차\n① 모델링: 문제상황이 제시되면 전문가는 문제해결과정을 시범 보이고, 학습자는 관찰을 통해 문제해결을 위한 지식과 전략을 확인·이해함\n② 코칭: 전문가는 학습자가 스스로 과제를 수행해 보도록 하고, 그 과정을 관찰하며 학습자가 문제를 잘 해결할 수 있도록 피드백을 제공함\n③ 스캐폴딩: 학습자의 근접발달영역(ZPD)을 고려하여 학습자가 현재 수준에서 상위 수준으로 도달할 수 있도록 단서, 힌트, 모델링 등을 제공하며, 학습자의 수준이 향상됨에 따라 비계설정(스캐폴딩)을 점진적으로 감소시킴\n④ 명료화: 학습자는 자신이 학습한 지식, 기능, 문제해결과정 등을 말 또는 글로 명료하게 표현해 봄\n⑤ 반성적 사고: 학습자는 자신의 과제수행을 전문가나 동료학습자의 문제해결과정과 비교하고 반성적으로 되돌아봄\n⑥ 탐색: 학습자는 교사의 지원 없이 자신만의 방법으로 문제를 직접 해결하기 위해 가설을 설정하고 검증하며 학습한 지식과 기능을 다른 과제에 새로운 방식으로 활용할 수 있도록 함","kw":["실제적 맥락","전문가들이 공유하는 문화","메타인지적 기술","모델링","코칭","스캐폴딩","명료화","반성적 사고","탐색","근접발달영역"],"id":"bangbeop-e43"},{"ch":"CH03 구성주의 교수·학습","t":"인지적 유연성","q":"인지적 유연성(cognitive flexibility theory)의 개념과 인지적 유연성을 높이기 위한 교수전략 2가지를 제시하시오.","ans":"개념: 여러 지식의 범주를 넘나들며 지식을 상황적 요구에 맞게 종합·구성해내는 능력\n교수전략\n① 주제 중심으로 학습함\n② 다양한 소규모의 예들을 제시함\n③ 학습자들이 충분히 다룰 수 있는 정도의 복잡성을 지닌 과제로 작게 세분화함","kw":["범주를 넘나들며","상황적 요구","종합","구성","주제 중심","소규모의 예","세분화"],"id":"bangbeop-e44"},{"ch":"CH03 구성주의 교수·학습","t":"목표기반 시나리오","q":"목표기반 시나리오의 특징 3가지와 7가지 단계를 설명하시오.","ans":"특징\n① 가상의 시나리오 속에 학습에 필요한 정보들을 배치시키고, 학습자로 하여금 시나리오 속에서 역할을 맡아 모종의 임무를 수행하게 함으로써 그 과정 속에서 목표로 하는 지식과 기술을 습득하게 함\n② 학습자 중심 ③ 사례 중심 ④ 기술훈련 중심 ⑤ 역할을 통해 학습함\n단계\n① 핵심기술 도출 및 목표설정: 핵심기술은 교수자가 가르치고자 하는 지식과 기술로 학습자가 핵심기술을 제대로 학습할 수 있도록 핵심기술 달성목표를 중심으로 설계함\n② 미션설정: 학습자가 설정된 목표를 성취하기 위하여 수행해야 하는 미션 및 과제를 개발함\n③ 커버스토리(표지 이야기) 개발: 학습자가 미션을 달성하고자 하는 것을 전제로 하여 목표달성을 위해 수행할 미션을 이야기 형식으로 설명함\n④ 역할개발: 학습자가 커버스토리 내에서 맡게 되는 인물로, 역할에 따라 미션을 수행하게 됨\n⑤ 시나리오 운영설계: 학습자들이 미션을 수행하는 모든 구체적인 활동을 설계함\n⑥ 학습자원 개발: 학습자가 미션을 수행하는 데 필요한 정보는 학습자원의 형태로 잘 조직되고 접근에 용이해야 하며, 적시에 제공해야 함\n⑦ 피드백 제공: 미션 수행 중 취해진 행동결과에 대한 피드백, 학습자를 돕는 조언 등의 코칭을 제공","kw":["가상의 시나리오","역할","임무","핵심기술","미션설정","커버스토리","역할개발","시나리오 운영설계","학습자원 개발","피드백 제공"],"id":"bangbeop-e45"},{"ch":"CH03 구성주의 교수·학습","t":"상보적 교수","q":"상보적 교수(reciprocal teaching)의 목적과 특징 2가지, 상보적 교수를 위한 4가지 교수전략을 설명하시오.","ans":"목적: 교사와 학습자 간, 학습자와 학습자 간의 역할교체를 통해 주어진 글의 내용을 학습하는 교수방법\n특징\n① 근접발달영역 내에서 성인 또는 우수한 동료와의 학습을 통해 잠재발달수준으로 나아갈 수 있다는 비고츠키의 이론에 영향을 받음\n② 초반에는 교사중심의 수업이 이루어지다가 점진적으로 학생들이 학습의 주도권을 가지게 됨\n③ 학생들은 소집단에서 번갈아 가며 논의의 주도권을 쥐고 읽기 텍스트에 대해 대화함\n교수전략\n① 예측하기: 글의 제목, 사진, 삽화, 글의 서두 등을 보고 내용을 예측함\n② 질문하기: 중요한 내용을 파악하면서 글을 읽어나가고 글을 읽는 과정에서 중요한 내용을 질문으로 만들어 봄\n③ 명료화하기: 본문에 있는 어려운 단어의 뜻을 알아보기 위해 글을 다시 읽어보고 이해가 어려운 문맥의 뜻을 파악하며 본문내용을 점검함\n④ 요약하기: 주요 내용에 대해 서로 문답하고 답변을 모아서 요약함","kw":["역할교체","근접발달영역","잠재발달수준","비고츠키","주도권","예측하기","질문하기","명료화하기","요약하기"],"id":"bangbeop-e46"},{"ch":"CH03 구성주의 교수·학습","t":"PBL","q":"배로우즈(Barrows)의 문제중심학습(PBL)의 특징 2가지와 과제의 성격 4가지, 장점과 단점 각각 2가지를 설명하시오.","ans":"특징\n① 학생은 그룹활동을 중심으로 문제를 해결하면서 협력기술을 기르고 문제에 대한 다양한 시각과 접근방법을 익힘\n② 학생이 문제해결의 주체가 되는 학습자중심의 학습환경을 제공함\n③ 소그룹을 통한 협동학습과 자기주도적 학습을 병행함\n과제의 성격\n① 비구조화: 문제상황이나 요소가 분명하게 정의되어 있지 않으므로 학습자가 문제를 스스로 이해하고 정의해야 함\n② 실제성: 실세계에 존재하는 진짜 문제\n③ 관련성: 학습자가 자신의 삶에 있어 관련성을 가지기 때문에 중요한 문제로 인식할 수 있는 문제\n④ 복잡성: 문제가 충분히 복잡하여 문제의 개념, 아이디어 등에 대하여 구성원 간의 활발한 토의가 이루어져 공통의 합의가 도출되어야 함\n장점\n① 가설을 설정하고, 가설검증을 위한 자료를 수집·분석하고, 문제를 해결하는 가설연역적 추론기능이 향상됨\n② 학생은 문제해결을 위해 스스로 정보를 탐색하고, 구성원들과 이를 공유 및 평가함으로써 자기주도적 학습능력과 성찰적 사고능력을 기를 수 있음\n③ 소집단 그룹학습으로 협동기술을 배우고 민주적인 생활태도를 기를 수 있음\n④ 실생활 문제를 학습의 대상으로 하기 때문에 학습의 내용이 실생활과 유리되지 않음\n단점\n① 체계적인 기초학력을 기르기 어려움\n② 수업설계 및 진행에 많은 시간과 에너지가 소모됨\n③ 학습의 노력에 비하여 습득지식의 효율성이 낮을 수 있음","kw":["그룹활동","협력기술","학습자중심","자기주도적 학습","비구조화","실제성","관련성","복잡성","가설연역적 추론","성찰적 사고","기초학력"],"id":"bangbeop-e47"},{"ch":"CH03 구성주의 교수·학습","t":"프로젝트학습","q":"프로젝트학습(project-based learning)의 개념과 특징 2가지, 절차, 장점과 단점 각각 2가지를 설명하시오.","ans":"개념: 한 명 또는 그 이상의 학습자가 자신의 프로젝트에 책임을 지고 특정한 주제를 심층적으로 연구하는 학습\n특징\n① 학습자가 실제적인 문제해결에 참여하여 결과물을 창조하는 과정을 통하여 새로운 지식과 기술을 습득하는 것을 강조\n② 지식기반사회와 기술기반사회를 위해 필요한 능력을 신장시킬 수 있음\n③ 학생이 자신의 생각과 주장을 표현할 수 있는 학습임\n④ 학생이 자신의 학습에 대한 큰 통제력과 자율성을 가짐\n절차\n① 목표와 주제 설정: 교사는 학생의 흥미와 능력에 맞는 학습목표를 설정하고 주제, 주제망 및 자원목록을 잠정적으로 결정하거나 작성함\n② 계획: 학습목표 달성을 위한 대안적인 방법을 생각하고 비교·검토함\n③ 실행: 계획에 따라 학습을 실행해 나감\n④ 평가: 문제해결 및 학습의 전 과정을 확인하고 평가함\n장점\n① 프로젝트의 주제가 학습자의 흥미에서 출발하기 때문에 높은 학습동기를 가짐\n② 학습자의 계획과 실천을 요구하기 때문에 학습자의 학습에 대한 주체성과 자기주도적 학습능력 함양에 효과적임\n③ 학습내용이 실생활과 긴밀하게 연결됨\n④ 구체적인 결과물을 만들어가는 과정이므로 내적 동기부여에 효과적임\n⑤ 창조적·구성적 태도를 함양하는 데 효과적임\n단점\n① 학습량에 비해 시간과 노력이 많이 소요됨\n② 학습교재의 논리적인 체계가 무시될 수 있음\n③ 학습과정이 혼란스러울 수 있음\n④ 프로젝트학습을 위한 재료, 도구, 자원 등이 제대로 준비되지 않을 수 있음","kw":["책임","심층적으로 연구","결과물을 창조","통제력과 자율성","목표와 주제 설정","계획","실행","평가","학습동기","주체성","논리적인 체계"],"id":"bangbeop-e48"},{"ch":"CH03 구성주의 교수·학습","t":"웹기반 프로젝트","q":"웹기반 프로젝트의 장점 3가지를 제시하시오.","ans":"① 다양한 멀티미디어 학습정보를 활용하기 때문에 풍부한 학습환경을 제공할 수 있음\n② 온라인 환경의 특성상 학급 내, 학교 내, 학교 간의 상호작용이 가능하여 상호작용의 양과 질이 확대됨\n③ 소극적·내성적 학습자의 능동적인 학습참여를 유도할 수 있음\n④ 매체의 다양성 때문에 다양한 산출물의 생산이 가능함\n⑤ 자기주도적 학습능력, 문제해결능력, 정보활용능력, 정보매체 활용능력, 고차원적 사고능력, 협동학습능력을 키울 수 있음","kw":["멀티미디어","풍부한 학습환경","상호작용의 양과 질","소극적","내성적","다양한 산출물","정보활용능력"],"id":"bangbeop-e49"},{"ch":"CH03 구성주의 교수·학습","t":"자원기반학습","q":"자원기반학습(resource-based learning)의 개념과 교육적 효과, 특징 2가지를 제시하시오.","ans":"개념: 학습자가 사용 가능한 자원들을 직접 활용 및 적용하도록 하면서 이루어지는 학습자중심 학습\n교육적 효과: 학습자가 다양한 정보자원을 활용하여 문제를 해결함으로써 문제해결능력과 정보활용능력을 동시에 함양할 수 있음\n특징\n① 학습자 스스로 목표를 설정하고 이에 적합한 학습방법이나 매체, 도구를 선택하는 학습자 주도적인 환경을 제공함\n② 학습자의 학습을 보조하는 스캐폴딩이 주어짐\n③ 학습자의 학습속도에 맞춰 개별화 학습이 가능하고, 학습양식에 따른 다양한 자원 활용형태가 가능함\n④ 학습자의 문제상황에 따라 다양한 관점을 조사할 수 있도록 여러 학습자원을 포함함","kw":["사용 가능한 자원","학습자중심","문제해결능력","정보활용능력","학습자 주도적","스캐폴딩","개별화 학습","다양한 관점"],"id":"bangbeop-e50"},{"ch":"CH03 구성주의 교수·학습","t":"Big 6 Skills","q":"Big 6 Skills의 목적과 6단계를 설명하고, 이 모형의 장점 2가지를 제시하시오.","ans":"목적\n① 교사와 도서관 미디어 전문사서가 협동하여 실제 학습상황에서 학생에게 정보활용능력을 가르치고자 함\n② 정보 리터러시 함양을 위해 체계적인 정보기반 활동이 이루어지도록 훈련시킴\n6단계\n① 과제정의: 과제의 요점 파악 및 과제해결의 정보유형을 파악하여 성취해야 할 과제의 범위와 본질을 결정함\n② 정보탐색전략: 정보원을 파악하고 최적의 정보원을 선택하여 적절한 정보원의 범위를 정함\n③ 소재파악과 접근: 정보원의 소재를 파악하여 정보원에서 정보를 찾아 필요한 자료를 수집함\n④ 정보활용: 정보를 읽거나, 보거나, 들어서 적합한 정보를 가려내며, 노트에 필기하거나 발췌, 요약, 인용 등을 사용함\n⑤ 통합정리: 정보를 체계적으로 정리하여 최종 결과물을 만듦\n⑥ 평가: 과정의 효율성, 결과의 유효성에 대해 평가하고, 문제해결과정을 검토·평가하여 얼마나 효율적으로 수행되었는지 확인함\n장점\n① 개인적 숙련과 기술을 팀 활동에 접목시킬 수 있음\n② 교과, 비교과, 생활, 평생교육 어디나 광범위하게 적용할 수 있음\n③ 학생의 사고력, 컴퓨터능력, 창의성 등을 학업성취도 및 체험활동 성과와 연결해주는 구체적인 지도가 될 수 있음\n④ 모든 연령의 학생, 대학원생, 일반인, 교사에게도 필요한 능력이며, 적용 가능한 상황이 다양함","kw":["도서관 미디어 전문사서","정보활용능력","정보 리터러시","과제정의","정보탐색전략","소재파악과 접근","정보활용","통합정리","평가"],"id":"bangbeop-e51"},{"ch":"CH03 구성주의 교수·학습","t":"자원기반학습","q":"자원기반학습의 효과성을 증진시킬 수 있는 설계전략 2가지와 자원기반학습의 제한점 2가지를 제시하시오.","ans":"설계전략\n① 교수자는 다루어야 할 주제영역에 관련된 지식, 기능, 태도 등을 확인하고 학습자의 수준과 다양성을 고려하여 정보활용능력의 난이도를 확인하고 학습목표와 수행준거를 작성함\n② 주제영역이 다른 교과와 어떻게 통합되어 있는지를 확인하여 장단기간 계획을 구성함\n③ 수업을 지원할 수 있는 다양한 자원을 탐색하여 잠재적인 자원을 선정함\n제한점\n① 개인학습을 하는 경우 학습자의 고립 문제가 생길 수 있음\n② 출처나 질적인 측면을 신뢰할 수 있는 자원을 확보하기가 어려움\n③ 학습자 인지양식의 다양성에 따라 풍부한 경험을 제대로 제공하는 것이 어려움","kw":["수행준거","장단기간 계획","잠재적인 자원","고립","신뢰할 수 있는 자원","인지양식의 다양성"],"id":"bangbeop-e52"},{"ch":"CH03 구성주의 교수·학습","t":"스캐폴딩","q":"스캐폴딩의 개념과 스캐폴딩을 제공하는 구체적인 방안 2가지를 제시하시오.","ans":"개념: 학생들이 자신들의 기존 능력을 넘어서 주어진 과제에 참여하고, 기술을 얻도록 전문가나 더 많은 지식을 가진 또래들이 제공하는 지원\n방안\n① 개념적 스캐폴딩: 내용에 대한 힌트와 프롬프트를 제공함\n② 메타인지적 스캐폴딩: 학생들이 학습과정에 대해 성찰하도록 하며 가능한 문제해결책을 고려하도록 격려하는 스캐폴딩\n③ 전략적 스캐폴딩: 문제해결과정에 초점을 맞추고 문제해결전략에 대한 지침을 제공함\n④ 동기적 스캐폴딩: 학습에서 나오는 어려움에 당당히 맞서면서 지속할 수 있는 학생들의 능력을 직접적으로 향상시키기 위한 스캐폴딩","kw":["기존 능력을 넘어서","전문가","또래","개념적","메타인지적","전략적","동기적"],"id":"bangbeop-e53"},{"ch":"CH04 교수방법과 교수매체","t":"강의법","q":"강의법의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 기초적 내용의 학습, 추상적 개념의 학습, 논리적 설명에 효과적임\n② 전체 내용을 개괄하거나 요약할 때 학습자의 이해를 향상시킬 수 있음\n③ 다수의 학습자에게 방대한 양의 지식을 효과적으로 전달하기에 용이함\n④ 활동 및 경험 위주의 학습방법을 싫어하는 순응형 학습자에게 심리적으로 편안한 교수방법임\n단점\n① 수동적 학습이 되기 쉽고, 학습의 동기유발이 어려움\n② 주의력이 부족한 저학년 학생에게 효과적이지 못함\n③ 개별화 학습이 어렵고 획일적인 학습이 이루어짐\n④ 고등정신능력 계발이나 정의적인 학습에 제한이 있음","kw":["기초적 내용","추상적 개념","논리적 설명","개괄","요약","방대한 양","순응형 학습자","수동적 학습","획일적","고등정신능력"],"id":"bangbeop-e54"},{"ch":"CH04 교수방법과 교수매체","t":"헤르바르트","q":"헤르바르트(Herbart)가 제안한 교수의 4단계를 설명하시오.","ans":"① 명료: 새로운 개념을 제시하는 단계. 학생이 새로 배울 개념이 다른 개념과 어떤 차이가 있는지 잘 이해하고 더 잘 인식할 수 있도록 하는 제시방법 사용\n② 연합: 학생의 의식 속에서 이미 존재하던 관념과 새로운 관념의 연합이 이루어지고 이들 간의 공통된 요소를 이해하는 단계\n③ 계통: 배운 내용을 하나의 체계로 일반화하는 단계\n④ 방법: 일반화된 원리를 실제 문제에 적용하고 해결하는 단계","kw":["명료","연합","계통","방법","새로운 개념","관념","일반화","적용"],"id":"bangbeop-e55"},{"ch":"CH04 교수방법과 교수매체","t":"팀티칭","q":"팀티칭을 운영하는 방안 2가지와 효과적인 팀티칭을 위한 고려사항 2가지를 제시하시오.","ans":"운영방안\n① 2인 또는 그 이상의 교사가 협력해서 동일 학생집단의 수업 전반이나 중요한 부분에 대해 책임을 지는 교수방법\n② 교사가 돌아가면서 대집단으로 일제수업을 진행 ⇒ 수업목적에 따라 20~30명의 중집단(능력별·내용별 편성)으로 나누어 각각의 교사가 분담·지도 ⇒ 다시 5~6명의 소집단으로 나눠서 개별적인 지도나 개별학습을 시킴\n고려사항\n① 함께 협업하는 교수자 간의 활발한 의사소통과 명확한 수업계획 공유가 진행되어야 함\n② 팀을 이룬 교사는 그 팀에 각자 고유하게 공헌할 수 있는 역할을 맡는 것이 필요함","kw":["2인 또는 그 이상","동일 학생집단","대집단","중집단","소집단","의사소통","수업계획 공유","고유하게 공헌"],"id":"bangbeop-e56"},{"ch":"CH04 교수방법과 교수매체","t":"개별화교수","q":"개별화교수의 개념과 장점, 단점 각각 2가지, 켈러(Keller)의 개별화교수체제의 특징 2가지를 제시하시오.","ans":"개념\n① 학습자의 특성에 맞게 교수·학습의 요소들을 조정, 개별 학습자가 가장 효과적으로 학습할 수 있는 학습환경을 조성하는 교수방법\n② 학습자의 학습준비도, 학습속도, 학습양식, 흥미, 동기 등에 따라서 적합한 학습방법을 적용함\n장점\n① 학습자의 특성에 맞는 교수를 통해 학습효과가 증진됨\n② 교사와 학습자 간의 상호작용이 활발함\n③ 학습자가 학습의 주도권을 가지게 하므로, 자신의 학습에 대한 학습자의 독립심과 책임감을 기를 수 있음\n단점\n① 학생 간의 협업이나 의사소통이 단절되어 협동기술, 사회적 기능 발달이 제한됨\n② 개별 학생의 특성에 맞게 수업자료를 개발하고 수업을 조정하는 것에 많은 시간과 노력이 소요됨\n켈러의 개별화교수체제 특징\n① 학생은 저마다 다른 자신만의 학습속도에 따라 학습할 수 있음\n② 각 단원의 시험에서 높은 성취도(80~90%)를 요구한다는 점에서 완전학습을 지향함\n③ 학생의 학습을 돕고 결과를 평가하고 오답을 교정하는 보조관리자 존재","kw":["학습자의 특성","조정","학습환경","학습준비도","학습속도","학습양식","독립심","책임감","협동기술","자신만의 학습속도","80~90%","완전학습","보조관리자"],"id":"bangbeop-e57"},{"ch":"CH04 교수방법과 교수매체","t":"적성처치상호작용","q":"크론바흐(Cronbach)의 적성처치상호작용이론에서 학습결과에 영향을 미치는 요인 2가지와 이 이론의 시사점 2가지를 제시하시오.","ans":"영향을 미치는 요인: ① 학습자의 적성 ② 교사가 진행하는 수업방법\n시사점\n① 개별 학습자는 각기 다른 적성을 가지기 때문에 이에 따른 적절한 교수방법을 다르게 활용하면 학업성취를 극대화할 수 있음\n② 학습자 개개인의 적성에 적절하게 수업을 계획하면 개인차에 따른 문제를 줄일 수 있음\n③ 적성이 높은 학생에게 효과적인 교수방법은 적성이 낮은 학생에게도 효과가 있기 때문에 다양한 교수변인을 통해 학생 간의 개인차를 줄이는 교수방법을 사용해야 함","kw":["학습자의 적성","수업방법","학업성취를 극대화","개인차","다양한 교수변인"],"id":"bangbeop-e58"},{"ch":"CH04 교수방법과 교수매체","t":"토의법","q":"토의법의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 활발한 의사소통을 통해 학습이 이루어지므로 학습자의 적극적인 참여를 유도하기 쉽고 학습동기와 흥미를 유발할 수 있음\n② 자신의 생각을 명료하게 전달하는 의사소통능력을 향상시킬 수 있음\n③ 대화를 통해 의견을 조율하고 문제를 해결하면서 사회적 기능을 향상시킬 수 있음\n④ 창의적 사고능력과 협동적 기술 및 태도를 향상시킬 수 있음\n단점\n① 교수자가 토의수업을 준비하고 진행하는 데 많은 시간과 노력이 소요됨\n② 소수의 토론자에 의해 토의가 장악될 수 있음\n③ 주제에 대한 학습자의 충분한 이해와 진지한 태도가 부족한 경우, 기대한 만큼 학습효과를 거두기 어려울 수 있음\n④ 정보의 전달이 매우 늦음","kw":["적극적인 참여","학습동기","의사소통능력","사회적 기능","창의적 사고능력","시간과 노력","소수의 토론자","정보의 전달"],"id":"bangbeop-e59"},{"ch":"CH04 교수방법과 교수매체","t":"토의 유형","q":"배심토의(패널), 심포지엄(단상토의), 버즈(buzz)토의 각각의 개념과 장점·단점을 제시하시오.","ans":"[배심토의(패널)] 개념: 상반된 견해를 가진 소수의 배심원과 다수의 일반 청중으로 구성되어 사회자의 진행에 따라 전개하는 토의\n장점: ① 다양한 의견을 광범위하게 수렴하고 제시할 수 있음 ② 주제에 대한 준비가 충분할 때 효과적임 ③ 활발한 토의가 가능함\n단점: 패널 구성원에 따라 학습효과의 차이가 있을 수 있음\n[심포지엄(단상토의)] 개념: 해당 주제에 대해 2~5명의 전문가가 개인의 입장이나 의견을 발표한 후 사회자의 진행 하에 청중과 발표자 간의 질의 또는 토론이 이루어짐(청중과의 질의 및 토론은 선택사항임)\n장점: ① 간접학습을 통해 집단학습력이 높아질 수 있음 ② 전문주제를 다룸으로써 다양한 전문지식을 학습할 수 있음\n단점: ① 학생은 토론에 직접적으로 참여하지 않으므로 수동적 학습이 이루어지기 쉬움 ② 연속된 발표로 인해 흥미가 저하될 수 있음\n[버즈토의] 진행방식: 토의에 참여하는 학생들을 소집단으로 나누고 각 소집단이 동시에 토의 진행 ⇒ 개별 토의결과를 전체 집단에 발표하고 사회자는 비슷한 집단끼리 토의를 유도하며 이를 정리 및 전체 집단 결론을 냄\n장점: ① 모두가 토론의 주체가 되며 구성원 전체의 학습참여가 가능함 ② 소수 인원끼리 토의를 함으로써 심리적 긴장감을 낮추고 적극적인 토의를 할 수 있음\n단점: 소집단 토론이 대토론 주제와 직결되지 않으면 토론이 불분명해질 수 있음","kw":["배심원","일반 청중","광범위하게 수렴","전문가","간접학습","수동적 학습","소집단","심리적 긴장감","불분명"],"id":"bangbeop-e60"},{"ch":"CH04 교수방법과 교수매체","t":"토의 유형","q":"원탁회의, 포럼, 하브루타 각각의 개념과 장점·단점 1가지씩을 제시하시오.","ans":"[원탁회의] 개념: 사회자와 서기를 포함하여 토의에 참여하는 학생들이 원탁에 둘러앉아 자유로운 분위기에서 의견을 교환하며 진행되는 토의. 상호 대등한 관계에서 좌담 형식으로 진행\n장점: 가장 민주적인 토의방식으로 모두가 만족하는 결과를 기대할 수 있음\n단점: 결론이 나지 않을 가능성이 높음. 논의가 탁상공론에 머무를 수 있음\n[포럼] 개념: 1~3명의 전문가가 10~20분간 공개연설을 한 후 사회자가 구성원 전체를 대상으로 토의를 진행하는 형식(심포지엄과 비슷하나 심포지엄보다 청중에게 기회가 더 많음)\n장점: 구성원 모두의 참여를 통한 전체의 학습향상을 도모함\n단점: 참가자가 많으므로 산만해질 수 있음\n[하브루타] 개념: 학생들끼리 짝을 이루어 서로 질문을 주고받으며 논쟁하는 유대인 전통 토론교육법\n장점: 하나의 주제에 대한 찬반양론을 동시에 경험하면서 새로운 아이디어와 해법을 이끌어낼 수 있음\n단점: 이기기 위해 논쟁하는 것이 아니라 논쟁을 통해 서로 학습하기 위함을 주지시켜야 함","kw":["원탁","좌담","민주적","탁상공론","공개연설","산만","짝을 이루어","유대인","찬반양론"],"id":"bangbeop-e61"},{"ch":"CH04 교수방법과 교수매체","t":"자기주도학습","q":"자기주도학습법의 특징 2가지와 인지적·동기적·행동적 측면에서 자기주도학습능력을 기르기 위한 방안 각 2가지를 제시하시오.","ans":"특징\n① 학습자는 자신의 학습에 주도권을 가짐\n② 학습자의 가치, 욕구, 선호에 따라 학습목표, 학습수준, 학습내용, 학습방법, 평가기준이 결정됨\n③ 학생 간의 개인차를 중시함\n④ 학습자는 자신의 학습결과에 대한 책임을 짐\n방안\n*인지적 측면: 학습을 위해 적절한 인지전략과 메타인지전략 사용\n① 인지전략 ⇒ 시연, 정교화, 조직화 ② 메타인지전략 ⇒ 학습을 계획, 점검, 조절하는 것\n*동기적 측면: 강한 학습동기를 가지고 학습할 수 있도록 함\n① 숙달목표를 지향 ② 자아효능감 제고 ③ 성취가치 인식\n*행동적 측면: 학습을 성공적으로 이끌기 위해 가장 적합한 환경을 만듦\n① 학습에 필요한 시간관리 ② 학습에 투자할 노력 분배 ③ 타인에게 도움 요청 ④ 학습을 방해하는 요소 차단","kw":["주도권","가치","욕구","선호","개인차","책임","인지전략","메타인지전략","숙달목표","자아효능감","성취가치","시간관리","노력 분배","도움 요청"],"id":"bangbeop-e62"},{"ch":"CH04 교수방법과 교수매체","t":"협동학습 원리","q":"협동학습 상황에서 고려해야 하는 원리 5가지를 설명하시오.","ans":"① 긍정적 상호의존성: 공동의 목표를 달성하기 위해 다른 구성원들의 수행이 자신의 목표성취에 도움이 되고 또 자신의 수행이 다른 구성원들에게 도움이 됨\n② 면대면 상호작용: 면대면 상호작용을 통해 서로 믿고 격려하며 필요 시 즉각적인 의사소통을 통해 학습과제를 신속·정확하게 수행할 수 있음\n③ 개별적 책무감: 집단 구성원의 수행은 집단 전체의 수행결과에 영향을 줌\n④ 사회적 기술: 공동의 문제를 함께 해결하면서 신뢰를 형성하고 의사소통기술 등과 같은 사회적 기술을 향상시킴\n⑤ 집단과정: 협동학습에서 요구되는 원칙이나 기술들을 익히고, 서로의 수행에 피드백을 제공하며, 적절한 보상체제를 사용함\n⑥ 이질적 팀 구성: 집단은 전통적 소집단과는 달리 이질집단으로 구성됨","kw":["긍정적 상호의존성","면대면 상호작용","개별적 책무감","사회적 기술","집단과정","이질적 팀 구성"],"id":"bangbeop-e63"},{"ch":"CH04 교수방법과 교수매체","t":"소집단학습 문제점","q":"전통적 소집단학습의 문제점 3가지를 각각 이의 극복방안 1가지와 함께 제시하시오.","ans":"① 빈익빈 부익부 현상 ⇒ 협동을 위한 스크립트를 제공하거나 협력과정에 대한 집단수준의 보상을 제시하여 극복\n② 무임승차 효과 ⇒ 개별적 책무감 강조, 투명한 평가체계, 협동적 리더십 강조, 개별적 평가와 피드백 등의 전략을 취함\n③ 봉 효과 ⇒ 개별적 책무감 강조, 투명한 평가체계, 협동적 리더십 강조, 개별적 평가와 피드백 등의 전략을 취함\n④ 집단 간 편파현상 ⇒ 주기적으로 집단을 재편성하거나 과목별로 집단을 다르게 구성하여 극복","kw":["빈익빈 부익부","스크립트","집단수준의 보상","무임승차 효과","봉 효과","개별적 책무감","투명한 평가체계","집단 간 편파현상","재편성"],"id":"bangbeop-e64"},{"ch":"CH04 교수방법과 교수매체","t":"STAD","q":"성취과제분담학습(STAD)의 팀 점수 산출방법을 설명하고, 이 협동학습의 특징 2가지를 이에 따른 교육적 효과와 함께 제시하시오.","ans":"팀 점수 산출방법: 개인별 향상점수의 합\n특징 & 교육적 효과\n① 구성원 각자의 목표뿐만 아니라 집단의 목표가 있음 ⇒ 서로 돕고 도움을 받으려 함\n② 집단에 대한 책무성과 과제에 대한 분담이 이루어짐 ⇒ 개별적 책무성이 강조됨으로써 개인의 능력을 최대로 발휘하게 됨\n③ 개인의 능력에 관계없이 집단에 기여할 수 있는 성공의 기회가 균등하게 주어짐 ⇒ 스스로 노력하게 함\n④ 소집단 간의 경쟁이 유발됨 ⇒ 구성원들의 결속이 다져지고 학습동기가 촉진됨\n⑤ 학습자의 기여도나 학습능력에 관계없이 모든 학습자에게 공평하게 보상하는 평등체제를 이용함으로써 소집단에 스스로 더 기여하게 함","kw":["개인별 향상점수의 합","집단의 목표","개별적 책무성","성공의 기회","균등","소집단 간의 경쟁","평등체제"],"id":"bangbeop-e65"},{"ch":"CH04 교수방법과 교수매체","t":"TGT","q":"팀경쟁학습(TGT)의 특징 2가지와 이 모형의 학습절차를 설명하시오.","ans":"특징\n① 게임을 통해 팀 간의 경쟁을 유도함\n② 학습은 협동적으로 집단 속에서 이루어짐\n③ 보상은 집단 간의 경쟁을 통해 주어짐\n④ 기본적으로 모든 교과에 쉽게 적용 가능하지만 특히 단순암기, 훈련적 교수가 필요한 교과에 효과적임\n⑤ 게임을 통해 동기를 유발할 수 있으나 외적 동기인 점수에만 지나치게 초점을 맞추면 내적 동기를 잃을 수 있어 유념해야 함\n학습절차: 교사는 소집단에 학습지를 배부하고 해당 학습단원에 대해 강의를 진행함 ⇒ 강의 후 학습자는 소집단별로 배포된 학습지의 연습문제를 해결함 ⇒ 각 학습자는 학업성취도가 비슷한 학생들로 구성된 토너먼트 테이블로 이동하여 문제해결 게임에 참여함 ⇒ 모든 테이블에서의 토너먼트가 끝나면 학습자는 다시 원래 소집단으로 되돌아가 각자가 받은 점수를 합산하고 평균을 냄 ⇒ 교사는 각 집단의 평균점수에 의거하여 소집단별로 보상을 함","kw":["게임","팀 간의 경쟁","협동적","단순암기","토너먼트 테이블","평균점수","소집단별로 보상"],"id":"bangbeop-e66"},{"ch":"CH04 교수방법과 교수매체","t":"직소모형","q":"직소모형(과제분담학습)의 특징 2가지와 직소Ⅱ 모형이 직소Ⅰ 모형과 구별되는 특징 2가지를 제시하시오.","ans":"직소모형의 특징\n① 소모둠 협동학습 구조의 형태임\n② 모둠 내 구성원들은 전체 학습내용의 일부분을 각각 담당함\n③ 모둠 내 다른 동료의 도움 없이는 학습이 불가능함\n직소Ⅱ 모형이 직소Ⅰ 모형과 구별되는 특징\n① 직소Ⅰ + 보상, 균등한 성공기회의 요소를 추가한 모형임\n② 소집단 학습 이후 개별시험을 치르게 하고, 개인별 향상점수의 합으로 팀 점수 부여(STAD의 보상방식 적용)","kw":["소모둠","일부분을 각각 담당","동료의 도움","보상","균등한 성공기회","개별시험","개인별 향상점수의 합"],"id":"bangbeop-e67"},{"ch":"CH04 교수방법과 교수매체","t":"자율적 협동학습","q":"팀보조개별학습의 특징 2가지와 자율적 협동학습(co-op co-op)의 학습절차 측면 및 평가 측면의 특징을 제시하시오.","ans":"팀보조개별학습의 특징\n① 협동학습과 개별학습이 결합된 모형\n② 협동보상과 개별보상이 모두 이루어짐\n자율적 협동학습의 학습절차 측면 특징\n① 대주제를 소주제로 나누어 모둠별로 학습하고, 각 모둠에서는 각각의 소주제를 다시 미니과제로 나누어 개별 학습자들이 개별학습 진행\n② 미니과제를 종합하여 소주제를 만들고, 다시 소주제를 종합하여 전체 학습을 완성함\n*효과 ⇒ 전체 학습을 위해 모둠 간·모둠 내 협력이 모두 필요한 협동을 위한 협동이 진행됨(모둠 간 협력 + 모둠 내 협력). 모둠별로 한 가지 주제를 해결하는 것이 아니라 학급 전체가 한 가지 주제를 해결하기 위해 협동함\n평가 측면의 특징: 동료에 의한 팀 기여도, 교사에 의한 소주제 학습 기여도, 전체 학급에 의한 팀 보고서 평가 등 ⇒ 다면평가","kw":["협동학습과 개별학습","협동보상","개별보상","대주제","소주제","미니과제","협동을 위한 협동","다면평가"],"id":"bangbeop-e68"},{"ch":"CH04 교수방법과 교수매체","t":"각본협동·액션러닝","q":"각본협동의 목적 1가지와 이를 운영하는 방안을 설명하고, 액션러닝의 특징 2가지를 제시하시오.","ans":"각본협동의 목적: 학생들이 짝을 이루어 읽기, 요약하기, 이해하기, 퀴즈 공부 등 서로를 돕는 데 초점을 둠\n운영방안: 두 명의 학생이 짝을 지어 정해진 순서에 따라 교대로 자료를 요약하고, 그 내용을 서로 점검하고 논평해주는 방식으로 진행됨\n액션러닝의 특징\n① 소수의 인원으로 구성된 학습자 집단이 현장의 문제를 해결하기 위한 행동을 취하며 그러한 과정으로부터 학습이 이루어짐\n② 촉진자라고 지칭되는 외부 전문가가 관여하지만 전문가가 제시한 해결방안보다는 성인학습자들의 경험과 상호작용에 중점을 둠","kw":["짝을 이루어","읽기","요약하기","교대로","점검","논평","현장의 문제","촉진자","경험과 상호작용"],"id":"bangbeop-e69"},{"ch":"CH04 교수방법과 교수매체","t":"협동학습 효과","q":"협동학습의 교육적 효과를 동기, 사회응집성, 인지적 측면에서 각각 1가지씩 서술하고, 운영 시 유의점 2가지를 제시하시오.","ans":"*동기 측면\n① 집단보상: 학습성과에 대한 집단 구성원에의 동일한 보상은 학습동기 유발에 효과적임\n② 개별책무성: 개별 구성원의 수행은 집단 전체의 수행에 영향을 미치므로 서로 격려하고 도우며 학습과제를 해결해 나감\n③ 학습참여의 균등한 기회 보장: 누구나 집단의 중요한 구성원임을 인정하고 함께 참여할 수 있도록 기회를 동등하게 부여함\n*사회응집성 측면\n① 긍정적 상호작용: 개인이 목표를 완수할 때 집단과제도 성취되고, 이는 다시 개인에게도 도움이 되며 집단 내 학습자들은 집단 전체의 성공을 위해 서로 도움을 주고받는 관계임\n② 대면적 상호작용: 대면적 상호작용을 통해 상호작용과 문제해결의 효과성과 효율성을 높임\n③ 개별책무성: 무임승차를 방지하기 위해 학습자 개개인의 과제를 명확히 하고 이것이 집단 내에서 잘 공유되도록 함\n*인지적 측면\n① 인지발달: 구성원 간의 협의를 통하여 사회적 인지갈등의 평형이 깨지고 학습자의 인지적 재구성이 이루어짐\n② 인지정교화: 동료학습자의 설명과 튜터링은 정보의 기억과 장기기억화에 효과적임\n유의점\n① 특정 학생의 오개념이 심화되고 그룹 내 다른 학생들로 확산될 가능성이 있음에 유의해야 함\n② 내성적이거나 학습능력이 낮아서 소집단 참여에서 소외되는 경우 심리적 모멸감과 수치심을 갖게 될 수 있음에 유의해야 함\n③ 학습목표보다 집단과정에 더 집중하여 학습의 효과성이 낮아질 수 있음에 유의해야 함","kw":["집단보상","개별책무성","균등한 기회","긍정적 상호작용","대면적 상호작용","인지발달","인지정교화","오개념","소외","심리적 모멸감"],"id":"bangbeop-e70"},{"ch":"CH05 교수매체","t":"교수매체","q":"교수매체의 기능 3가지를 제시하시오.","ans":"① 매개적 보조기능: 매체의 가장 일반적인 기능. 교수·학습과정의 보조수단으로 매체를 사용함으로써 학습자의 주의집중과 동기유발을 도울 수 있음\n② 정보전달 기능: 매체의 본질적인 기능. 매체는 교수·학습의 정보를 더욱 효율적·효과적으로 전달할 수 있도록 도움\n③ 학습경험 구성기능: 매체 자체가 학습의 대상이 되고 학습경험을 구성함\n④ 교수기능: 어떻게 정보를 전달하는지에 따라서 학습자의 인지적 사고를 촉진시킬 수 있음","kw":["매개적 보조기능","주의집중","동기유발","정보전달 기능","학습경험 구성기능","교수기능","인지적 사고"],"id":"bangbeop-e71"},{"ch":"CH05 교수매체","t":"경험의 원추","q":"경험의 원추에 관한 다음 빈칸을 채우시오.","ans":"경험의 원추는 아래로 갈수록 (구체적·직접적)인 경험에 가까워지고, 위로 갈수록 (추상적·간접적)인 경험에 가까워진다. 브루너(Bruner)는 이 매체 분류를 다시 (행동적) 경험(행동에 의한 학습), (영상적) 경험(관찰을 통한 학습), (상징적) 경험(추상을 통한 학습)으로 나누었다. 경험의 원추는 효과적인 학습을 위하여 다양한 교수·학습매체를 활용해야 한다는 점, 추상을 통한 학습을 위해서는 적절한 (행동적) 또는 (영상적) 단계가 필요하다는 점을 시사한다.","kw":["구체적","직접적","추상적","간접적","행동적","영상적","상징적"],"id":"bangbeop-e72"},{"ch":"CH05 교수매체","t":"매체 선정","q":"교수매체 선정 시 고려사항 3가지를 구체적으로 설명하시오.","ans":"① 학습자 특성: 매체 선정 시 학습자의 연령, 지적 수준, 적성, 태도 등과 같은 학습자 특성을 고려해야 함\n② 수업상황: 수업집단의 형태나 규모, 수업방법(교사중심, 학생중심, 발견중심 등)에 따라 적절한 교수매체가 달라짐\n③ 학습목표와 내용: 학습목표와 내용(지적기능, 태도 등) 또한 교수매체 선정에 영향을 끼침\n④ 매체의 물리적 속성과 기능: 시각, 청각, 시청각, 크기, 색채 등 매체의 속성을 고려해야 함\n⑤ 수업장소의 시설: 수업장소에 인터넷, 전자교탁, 빔프로젝터 등의 시설이 갖추어져 있는지의 여부도 매체를 활용할 수 있는지 영향을 끼침\n⑥ 실용적 요인: 매체 이용 가능성, 매체 준비 및 활용에 소요되는 시간, 난이도, 비용 등을 고려해야 함","kw":["학습자 특성","수업상황","학습목표와 내용","물리적 속성","수업장소의 시설","실용적 요인"],"id":"bangbeop-e73"},{"ch":"CH05 교수매체","t":"ASSURE","q":"하이니히(Heinich)의 ASSURE 모형의 목적과 ASSURE 모형의 절차를 설명하시오.","ans":"목적: 체제적 교수설계의 한 모형으로, 교수매체를 체계적으로 활용하기 위한 절차를 제시하고자 함\n절차\n① 학습자분석: 학습자의 일반적인 특성, 출발점행동, 학습양식 등에 대해 분석\n② 목표진술: 학습자가 학습 후에 어떠한 지점에 도달해야 하는지를 나타내는 것으로 구체적인 학습목표(대상, 행동, 조건, 정도)를 제시\n③ 전략·테크놀로지·매체·자료 선정: 목표를 달성하기 위해 적절한 수업방법, 매체, 자료를 선택\n④ 테크놀로지·매체·자료의 활용: 선택한 매체와 자료를 활용(자료에 대한 사전검토, 자료 준비하기, 환경 준비하기, 학습자 준비시키기, 학습경험 제공하기)\n⑤ 학습자 참여 요구: 학습자의 능동적인 사고활동을 요구하기 위해 연습의 기회와 피드백을 제공\n⑥ 평가와 수정: 학습자의 성취도에 대해서 평가하고 활용된 전략, 테크놀로지, 매체 및 자료에 대해 평가하여 이들이 학습목표 성취에 도움이 되었는지 판단","kw":["학습자분석","목표진술","전략","테크놀로지","매체","자료 선정","활용","학습자 참여 요구","평가와 수정"],"id":"bangbeop-e74"},{"ch":"CH05 교수매체","t":"ASSURE","q":"하이니히(Heinich)의 ASSURE 모형 절차 중 테크놀로지·매체·자료의 활용 단계에서 수행하는 교사의 활동 5가지와 평가와 수정 단계에서 평가의 대상 2가지를 설명하시오.","ans":"테크놀로지·매체·자료의 활용 단계에서의 교사의 활동\n① 자료에 대한 사전검토: 수업자료에 비교육적인 내용이 들어 있지는 않은지, 수업자료가 최신의 내용을 담고 있는지 등을 사전에 검토\n② 자료 준비하기: 필요한 자료를 어떤 순서와 방법으로 제공할 것인지 등을 결정하고 필요한 기자재를 확인함\n③ 환경 준비하기: 준비한 자료를 활용하는 데 필요한 기기가 갖추어져 있는지, 기기가 잘 작동되는지 등을 확인하고 준비함\n④ 학습자 준비시키기: 학습자에게 동기부여, 학습목표 안내, 수업자료에서 중요하게 확인할 내용이 무엇인지를 미리 안내하는 등 효과적인 학습이 가능하도록 학습자를 준비시킴\n⑤ 학습경험 제공하기(수업 진행): 준비한 자료를 활용하여 학습경험 제공\n평가와 수정 단계에서 평가의 대상\n① 학습자 성취의 평가: 설정한 학습목표를 학습자들이 수업을 통해 제대로 달성했는지의 여부 확인\n② 방법과 매체, 자료의 평가: 수업방법 및 수업에 사용된 매체와 자료의 적절성에 대해 교사 자신, 학생, 동료교사, 관리자들로부터 평가받음\n③ 수정하기: 평가자료 수집의 결과를 환류하기 위해 평가결과를 살펴보고 이를 참고로 하여 차시 수업에 반영함","kw":["사전검토","자료 준비하기","환경 준비하기","학습자 준비시키기","학습경험 제공하기","학습자 성취의 평가","방법과 매체","수정하기"],"id":"bangbeop-e75"},{"ch":"CH05 교수매체","t":"인지부하","q":"인지부하의 개념과 인지부하의 종류 3가지의 명칭을 개념과 함께 제시하시오.","ans":"개념: 과제를 수행할 때 학습자의 인지체계에 부과되는 정신적인 노력\n종류\n① 내재적 인지부하: 학습과제 자체의 난이도에 의해 결정되는 인지부하\n② 본질적 인지부하: 학습내용을 이해하거나 적용하기 위해 새로운 지식체계를 생성하거나 새로운 지식을 기존의 지식체계에 통합시키려는 인지적 노력(긍정적 인지부하)\n③ 외생적 인지부하: 학습과정에서 불필요하게 투입된 인지적 노력","kw":["정신적인 노력","내재적 인지부하","난이도","본질적 인지부하","긍정적 인지부하","외생적 인지부하","불필요하게 투입"],"id":"bangbeop-e76"},{"ch":"CH05 교수매체","t":"멀티미디어 설계원리","q":"내재적 인지부하, 본질적 인지부하, 외생적 인지부하 각각의 측면에서 고려해야 하는 멀티미디어 설계의 원리 각각 2가지를 설명하시오.","ans":"내재적 인지부하\n① 완성된 예제 원리: 문제해결과정을 단계별로 명료하게 제시해주는 완성된 예제를 활용함\n② 사전훈련 원리: 학습내용을 이해하기 위해서 알고 있어야 하는 구성을 먼저 이해하도록 함\n③ 양식 원리: 시각채널과 청각채널을 모두 활용할 수 있도록 제시함\n본질적 인지부하\n① 개인화 원리: 학습자와 대화하듯이 내용을 전달하는 방법(ex. 학습자의 이름을 불러주어 동기를 유발하고 학습에 집중하게 함)\n② 자기설명 및 인지리허설 원리: 학습내용을 학습자 스스로 점검하도록 유도함\n외생적 인지부하\n① 근접성 원리: 관련된 정보를 공간적·시간적으로 가깝게 제시해야 함\n② 중복 원리: 동일한 내용을 담고 있는 시각과 청각 정보의 중복을 피해야 함\n③ 일관성 원리: 학습내용에 관련된 내용만을 구성해야 하며 불필요한 내용을 제거해야 함","kw":["완성된 예제","사전훈련","양식 원리","시각채널","청각채널","개인화","자기설명","인지리허설","근접성","중복","일관성"],"id":"bangbeop-e77"},{"ch":"CH06 테크놀로지 기반 교육","t":"e-러닝","q":"e-러닝의 장점 3가지, 적용 시 유의사항 3가지를 제시하시오.","ans":"장점\n① 학습자 동기유발: 다양한 멀티미디어를 수업에 사용하여 학습자의 주의를 집중시키고 능동적인 반응을 유도함\n② 학습의 개별화: 학습자의 학습양식 및 능력 등에 따라 개별화된 학습이 이루어질 수 있음\n③ 시·공간 제약 초월: 교사, 학생, 전문가들이 시간과 공간의 제약을 초월하여 정보를 교환하고 소통할 수 있음\n④ 다양한 교수·학습활동 추진: 문제해결학습, 프로젝트학습, 상황학습, 협동학습 등의 다양하고 유연한 학습경험을 제공함\n⑤ 문제해결력 및 자기주도적 학습능력 신장: 학생들은 ICT를 활용하여 정보를 검색·수집·분석·종합하고, 새로운 정보 창출에 참여하면서 문제해결력을 신장시킬 수 있음. 학습목표, 전략수립, 결과평가 등의 과정을 통해 자기주도적 학습능력을 향상시킬 수 있음\n유의사항\n① 기법보다 내용중심 설계: 특정 기술이 제공하는 기능을 사용하는 것 자체에 초점을 맞추기보다는 목표된 학습을 효과적으로 지원하는 기술 활용에 집중해야 함\n② 강의중심적 사고 배제: 전통적 강의식 수업에서 탈피하여 학습자중심의 학습환경 구성에 초점을 맞추어야 함\n③ 교사 역할의 변화: 지식전달자가 아닌 학생의 학습지원자 및 촉진자가 되어야 함\n④ 교사와 학생의 ICT(디지털) 활용능력 점검\n⑤ 적극적 지원체제 구축: 교사에게 충분한 교육콘텐츠 제공, ICT 활용수업 지원 전문가 배치(컨설팅단 확보), 자료와 정보 공유 등의 지원체제가 확립되어야 함","kw":["동기유발","학습의 개별화","시·공간 제약 초월","다양한 교수·학습활동","문제해결력","내용중심 설계","강의중심적 사고 배제","교사 역할의 변화","ICT 활용능력","지원체제"],"id":"bangbeop-e78"},{"ch":"CH06 테크놀로지 기반 교육","t":"블렌디드 러닝","q":"블렌디드 러닝(blended learning)의 개념, 블렌디드 러닝을 위한 온라인 도구의 예 1가지, 블렌디드 러닝의 장점 2가지를 제시하시오.","ans":"개념: 온라인 강좌(온라인 학습)와 오프라인 강좌(면대면 학습)가 혼합된 형태의 교육\n온라인 도구\n① 온라인 학습 플랫폼: 학생들이 수업자료를 업로드하고, 강의 동영상을 시청하며, 과제를 제출하는 등의 학습활동을 수행할 수 있는 플랫폼 => Google Classroom, Moodle, Canvas 등\n② 동영상 강의: 수업내용을 동영상으로 녹화하여 학생들이 언제 어디서든 접근하고 학습할 수 있도록 함 => 녹화도구: Zoom, Microsoft Teams 등\n③ 인터랙티브 학습 플랫폼: 학생들이 상호작용하고 활동할 수 있는 인터랙티브 학습 플랫폼 => Kahoot, Quizlet, Socrative 등\n장점\n① 학습자의 특성에 맞는 학습내용 및 방법으로 교육효과를 극대화함\n② 학습공간과 기회를 확대함 ⇨ 온·오프라인의 통합으로 지속적인 학습을 가능하게 함\n③ 개별화 수업, 자기주도적 학습, 교사와의 직접적인 면대면 상호작용을 통한 학습의 촉진·안내·관리도 가능하기 때문에 학업성취도를 다각적인 방법을 통해 높일 수 있음\n④ 학생의 학습상황에 대한 데이터 수집이 가능하고, 지도·평가과정을 사용자가 정의할 수 있음","kw":["온라인 강좌","오프라인 강좌","혼합","Google Classroom","Zoom","Kahoot","교육효과를 극대화","학습공간과 기회","데이터 수집"],"id":"bangbeop-e79"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습(flipped learning)의 개념과 거꾸로 학습 설계 시 고려사항 3가지를 제시하시오.","ans":"개념: 블렌디드 러닝의 한 형태로 학습자가 교실수업 전에 동영상 강의 등 온라인 학습을 통해 학습내용(영상, 논문자료 등)을 미리 학습하고, 교실수업에서는 활동중심 학습(토론, 과제풀이 등)을 통해 수업의 효과를 극대화하는 교수·학습방식\n고려사항\n① 유연한 환경: 탄력적이고 다양한 학습의 형태를 허용해야 함\n② 학습문화의 변화: 교사중심의 수업에서 학생중심의 수업으로의 변화가 수반되어야 함\n③ 의도된 내용: 교사는 수업시간에 어떠한 내용을 가르칠 것인지, 학생들로 하여금 사전에 어떠한 내용을 배워서 오게 할 것인지에 대한 의도적이고 분명한 계획이 있어야 함\n④ 전문성을 갖춘 교사: 교사는 학생들로 하여금 어떻게 보다 체계적인 지식을 갖도록 할 것인지, 나아가 필요할 경우 어떻게 더욱 깊이 있는 지식을 제공할 수 있을지에 대해 고민하는 것이 중요함","kw":["온라인 학습","활동중심 학습","유연한 환경","학습문화의 변화","의도된 내용","전문성을 갖춘 교사"],"id":"bangbeop-e80"},{"ch":"CH06 테크놀로지 기반 교육","t":"거꾸로 학습","q":"거꾸로 학습의 장점 2가지, 단점 1가지를 이의 해결방안 1가지와 함께 제시하고, 전통적 교실학습과 구별되는 거꾸로 학습의 특징을 수업 전·중·후의 관점에서 각각 1가지씩 제시하시오.","ans":"장점\n① 학습자중심 수업의 확대: 수업 전에 미리 학습내용을 익히고 참여하게 되므로 토론 및 토의, 프로젝트학습 등 다양한 학습자중심의 수업을 운영할 수 있음\n② 학습자의 자신감 형성: 사전학습을 통해 본 수업에 대한 자신감이 형성됨\n③ 흥미와 동기 고양: 오프라인 수업이 학습자중심 활동으로 운영되기 때문에 지루하지 않고 흥미로운 수업이 가능하며 사전학습을 통해 친숙한 과제를 다루므로 학습동기 또한 촉진됨\n④ 역동적 학습: 실험, 탐구, 학습자 간의 상호작용을 촉진하는 수업이 가능해진다.\n단점: 학생이 온라인 사전학습을 충분히 하지 않을 수 있음\n⇒ 해결방안: 학생이 온라인 사전학습을 충분히 하지 않는 경우를 대비하여 흥미롭고 부담스럽지 않은 길이의 동영상 강의를 준비하고, 학생의 준비도 확인을 철저히 해야 함\n[전통적 교실학습 vs 거꾸로 학습]\n수업 전: 교수자는 강의를 준비하고 학습자에게 과제를 배정하는 반면, (거꾸로 학습에서는) 교수자는 여러 가지 학습내용들을 준비하고 학습자는 교수자가 제공하는 절차에 따라 학습하며 학습 관련 질문사항 등을 기록함\n수업 중: 학습자는 수업내용을 이해하려 하고 교수자는 모든 학습자료를 활용해 학습자의 이해를 돕고자 노력하는 반면, (거꾸로 학습에서는) 교수자는 수업시간 동안 해야 할 과제를 제시하고 학습자는 수업 도입 이후부터 수업시간 동안 학습내용을 적용시키기 위한 토론, 프로젝트학습 등을 수행하게 되며 이 과정에 교수자는 피드백과 소규모 강의를 제공함\n수업 후: 교수자는 지난 과제를 평가하고 학습자는 보통 과제를 수행하는 반면, (거꾸로 학습에서는) 교수자는 학습자가 고차적인 적용활동을 수행하도록 다양한 교육자원을 제공하고 학습자와 정보적 상호작용을 통해 피드백을 주고받는 활동을 수행함","kw":["학습자중심 수업의 확대","자신감 형성","흥미와 동기 고양","역동적 학습","사전학습","준비도 확인","고차적인 적용활동","정보적 상호작용"],"id":"bangbeop-e81"},{"ch":"CH06 테크놀로지 기반 교육","t":"AI 디지털교과서","q":"서책형 교과서와 구별되는 AI 디지털교과서의 특징 3가지를 구체적으로 설명하시오.","ans":"① 자료유형: 서책형 교과서는 텍스트와 이미지 중심의 평면적·선형적인 학습자료이나 AI 디지털교과서는 동영상, 가상현실 등과 같은 멀티미디어 학습자료 제공\n② 내용전달 매체와 데이터: 서책형 교과서는 인쇄매체이나 AI 디지털교과서는 정보기기를 사용하므로 학습데이터 수집 및 분석 가능\n③ 다른 교과와의 관계: 서책형 교과서는 교과 간 서로 단절된 개별학습이나 AI 디지털교과서는 교과 내·학년 간 연계학습 가능\n④ 수업효과: 서책형 교과서는 학습자의 능력에 따른 수업이 어려운 일제식 수업이나 AI 디지털교과서는 학생중심 수업활동과 자기주도적 학습 시행 가능","kw":["평면적","선형적","멀티미디어","인쇄매체","정보기기","학습데이터","연계학습","일제식 수업","학생중심"],"id":"bangbeop-e82"},{"ch":"CH06 테크놀로지 기반 교육","t":"컴퓨터기반 협력학습","q":"컴퓨터기반 협력학습의 특징과 교사가 지원해야 하는 학습지원도구 2가지를 이의 역할과 함께 제시하고, 장점과 단점 각각 2가지를 제시하시오.","ans":"특징\n① 컴퓨터를 기반으로 학습자가 공유와 협력을 통하여 공동의 문제를 해결하고 지식을 형성하는 학습이 가능함\n② 시간과 장소에 구애받지 않고 협력적으로 학습하고, 공동의 산출물을 구성해 나갈 수 있으며, 학습자 간의 활발한 상호작용이 가능함\n③ 교사는 다양한 협력도구와 인지·정서적 지원을 통해 학습자의 협력과 상호작용을 지원함\n학습지원도구 & 역할\n① 시각화도구 ⇒ 학습자의 수행과제를 더 잘 나타낼 수 있도록 지원\n② 수행지원도구 ⇒ 학습자의 현재 학습과제보다 낮은 수준의 학습과제를 자동화하거나 대체하여 인지활동의 부담을 덜어줌\n③ 정보수집도구 ⇒ 문제해결을 위한 중요한 정보수집 지원\n④ 의사소통도구 ⇒ 학습자 상호간의 원활한 원격 의사소통 지원\n⑤ 협업도구 ⇒ 학습자 간 공동의 학습문제 해결을 위한 학습활동 공간 제공\n장점\n① 시간과 장소의 제약 없이 공동으로 또는 자신이 편한 시간과 장소에서 협력과제를 수행할 수 있음\n② 수정과 편집이 자유로움\n③ 평소 수줍음이 많은 학생도 협력과제에 적극적으로 참여할 수 있음\n단점\n① 협력학습 초기에는 프로그램에 익숙하지 않은 학습자가 학습에 어려움을 호소할 수 있음\n② 학습자 간의 활발한 의사소통이 부족한 경우, 공동의 지식 구성이 이루어지지 않고 단순한 분업으로 과제가 진행될 수 있음\n③ 상대방과의 논의 없이 동료학습자가 작성한 글을 임의로 수정하거나 삭제하는 경우, 학습자 간의 정서적 갈등이 초래될 수 있음","kw":["공유와 협력","공동의 산출물","시각화도구","수행지원도구","정보수집도구","의사소통도구","협업도구","수정과 편집","단순한 분업","정서적 갈등"],"id":"bangbeop-e83"},{"ch":"CH06 테크놀로지 기반 교육","t":"클라우드 컴퓨팅","q":"클라우드 컴퓨팅의 장점 2가지, 단점 1가지를 제시하시오.","ans":"장점\n① 어떤 시·공간에서나 손쉽게 접근할 수 있는 공동의 작업공간을 제공함\n② 학습자들이 그룹 구성원들과 작업물에 대해 상호작용하는 것을 도움\n③ 클라우드 컴퓨팅 기술이 과제물에 대한 공동의 이해를 형성하고 협력과정을 효과적으로 조절하는 것을 도와 상대적으로 더 나은 학습성과로 이어짐\n단점: 시·공간을 불문하고 클라우드 컴퓨팅 어플리케이션을 이용해서 협력활동에 참여할 수 있지만, 그룹과제를 수행하기 위해 면대면 회의를 가지는 횟수가 줄어들 경우 오히려 학습자 간의 상호작용을 제한하게 될 수도 있음","kw":["공동의 작업공간","상호작용","공동의 이해","협력과정","면대면 회의","상호작용을 제한"],"id":"bangbeop-e84"},{"ch":"CH06 테크놀로지 기반 교육","t":"모바일 러닝","q":"모바일 기기의 종류 2가지와 모바일 러닝의 장점과 단점 각각 2가지를 제시하시오.","ans":"종류: 스마트폰, 태블릿 PC 등\n장점\n① 시·공간 한계 극복: 언제 어디서나 학습이 가능함\n② 실제적인 맥락에서의 학습: 이동하는 개인의 위치와 처해 있는 상황과 맥락을 반영하여 그에 적합한 학습내용 제공 가능\n③ 학습자의 개별성 지원: 언제 어디서나 필요한 정보를 검색하고 기억하고 싶은 내용을 메모하거나 사진 및 동영상으로 기록할 수 있음\n④ 사회적 상호작용을 통한 공유성: SNS를 이용하여 모바일 러닝 활동과 결과물을 교수자 및 다른 학습자와 쉽게 공유할 수 있음\n단점\n① 모바일 러닝은 작은 스크린상에서 구동되는 특징이 있어 신체적인 피로나 장애로 이어질 수 있음\n② 모바일 러닝을 위해 필요한 무선인터넷 활용이 어려운 지역에서는 학습이 불가능함","kw":["스마트폰","태블릿 PC","시·공간 한계 극복","실제적인 맥락","개별성 지원","공유성","작은 스크린","무선인터넷"],"id":"bangbeop-e85"},{"ch":"CH06 테크놀로지 기반 교육","t":"게이미피케이션","q":"게이미피케이션의 개념과 게이미피케이션의 구성요소 3가지를 제시하시오.","ans":"개념: 게임이 아닌 것에 게임의 요소나 원리를 적용하는 것\n구성요소\n① 명확한 목표와 규칙\n② 지속적인 과제 제시\n③ 즉각적인 피드백 및 재도전 기회 제시\n④ 보상 제공","kw":["게임의 요소","원리를 적용","명확한 목표와 규칙","지속적인 과제","즉각적인 피드백","재도전 기회","보상"],"id":"bangbeop-e86"},{"ch":"CH06 테크놀로지 기반 교육","t":"실감미디어","q":"실감미디어의 목적을 설명하고, 실감미디어의 종류 3가지를 각각의 특징 1가지와 함께 제시하시오.","ans":"목적: 사용자의 실재감과 몰입감을 최대로 높이기 위함\n종류 & 특징\n① 증강현실(AR; Augmented Reality) ⇒ 학습자에게 조작하는 경험을 제공하면서 학습자료와 직접적으로 상호작용할 수 있어 능동적인 학습이 가능해짐\n② 가상현실(VR; Virtual Reality) ⇒ 학습자의 실제 움직임과 가상공간에서의 움직임이 일치하도록 나타나기 때문에 학습활동에 더욱 몰입하게 됨\n③ 메타버스(metaverse) ⇒ 아바타를 통해 사회적 실재감을 높이고 사회적 상호작용을 촉진할 수 있음","kw":["실재감","몰입감","증강현실","AR","가상현실","VR","메타버스","아바타","사회적 실재감"],"id":"bangbeop-e87"},{"ch":"CH06 테크놀로지 기반 교육","t":"실감미디어","q":"실감미디어 활용교육의 장점과 단점 각각 2가지를 제시하시오.","ans":"장점\n① 적극적인 참여: 학생들이 더욱 적극적으로 참여할 수 있으며 이로 인해 더 흥미를 느끼고, 학습에 대한 동기부여가 증가함\n② 체험중심 학습: 학생들에게 추상적인 개념이나 이론보다는 실제 경험을 통해 학습할 수 있는 기회를 제공함\n③ 시뮬레이션과 실험: 어려운 실험이나 위험한 상황을 시뮬레이션의 형태로 안전하게 실습할 수 있음\n④ 다양한 학습환경: 역사적인 사건을 가상현실로 체험하거나, 지리적인 장소를 증강현실로 탐험하는 등 학생들에게 다양한 학습환경을 제공함\n단점\n① 어지러움증과 시각피로: 가상 혹은 증강현실을 체험하는 동안 학생들은 현실과 다른 시각적 자극을 받게 되는데, 이러한 시각적 자극은 뇌와 몸의 감각정보가 일치하지 않을 수 있기 때문에 어지러움증이나 멀미 등의 증상이 발생할 수 있음\n② 교사 부담: 교사들에게 기존의 교육방식과 다른 접근법과 교수법을 습득하고 적용하는 역량을 요구함","kw":["적극적인 참여","체험중심 학습","시뮬레이션과 실험","다양한 학습환경","어지러움증","시각피로","교사 부담"],"id":"bangbeop-e88"},{"ch":"CH06 테크놀로지 기반 교육","t":"인공지능 교육","q":"인공지능 교육의 종류 2가지를 설명하시오.","ans":"① 인공지능 이해교육: 인공지능 기술 자체에 대해 이해하고 배우는 것에 초점을 두는 교육\n② 인공지능 활용교육: 인공지능을 다양한 교과의 교수·학습상황에서 교육의 도구로 활용하는 교육\n③ 인공지능 가치교육: 인공지능 기술의 사회경제적 영향 및 윤리적 가치에 초점을 두는 교육. 인공지능의 인간중심성, 책임성, 투명성, 개인정보보호, 공정성, 안정성, 신뢰성 등","kw":["이해교육","활용교육","가치교육","사회경제적 영향","윤리적 가치","인간중심성","책임성","투명성"],"id":"bangbeop-e89"},{"ch":"CH06 테크놀로지 기반 교육","t":"AI 챗봇","q":"인공지능 챗봇의 활용방안 2가지, 인공지능 챗봇 활용교육의 장점과 단점 각각 3가지를 제시하시오.","ans":"활용방안\n① 학습튜터 역할: 학생들이 교과목에 관련하여 질문하거나 의문점을 해결하기 위해 활용\n② 학습평가와 피드백 제공: 학생들의 학습성과를 평가하고 피드백을 제공하는 데 활용\n③ 언어학습 지원: 단어, 문법, 어휘 등의 학습을 돕는 데에 사용\n장점\n① 시공간의 제약 극복: 시간과 장소에 제약을 받지 않고 항상 사용 가능하기 때문에 학생들이 필요할 때 언제든지 질문하고 학습할 수 있음\n② 개별 맞춤학습 지원: 학생들의 학습기록을 분석하여 개별 맞춤형 학습내용을 제공하고, 학생 개개인의 학습수준과 관심사를 고려하여 최적의 학습경로를 제시할 수 있음\n③ 대화형 학습경험: 학생들은 대화형식으로 학습을 진행하며, 보다 적극적으로 학습에 참여할 수 있음\n단점\n① 사람 간 상호작용 부족: 인공지능 챗봇은 인간의 감정이나 커뮤니케이션 측면에서 제한적일 수 있기 때문에 교사와 학생 사이의 강한 상호작용을 대체하기엔 한계가 있음\n② 기술적 한계: 일부 챗봇은 정교한 질문에 적절한 답변을 제공하지 못할 수 있으며, 특정 도메인에 대해서만 효과적일 수 있음\n③ 의존성 문제: 학생들이 인공지능 챗봇에 지나치게 의존할 경우, 자체적인 문제해결능력이나 창의성이 저하될 수 있음","kw":["학습튜터","학습평가와 피드백","언어학습 지원","시공간의 제약 극복","개별 맞춤학습","대화형 학습경험","상호작용 부족","기술적 한계","의존성 문제"],"id":"bangbeop-e90"}]},"교육행정":{"mc":[{"ch":"CH00 교육연구","t":"표집방법","q":"단순무선표집의 개념과 장점으로 옳은 것은?","opts":["의식적 조작 없이 표본을 추출하는 방법으로 모집단에 속한 모든 요소는 표본으로 선택될 수 있는 독립적인 기회를 동등하게 가지며, 모집단의 특성에 대하여 특별한 사전지식이 필요 없고 자료분석이나 오차계산이 용이함","모집단을 구성하고 있는 중요한 특성을 기준으로 하위집단으로 구분한 후 무선표집하는 방법","이미 형성되어 있는 자연적·행정적 집단을 표집단위로 하여 추출하는 방법","연구자가 연구목적에 비추어 주관적 판단하에 사례들을 의도적으로 표집하는 방법"],"a":0,"exp":"단순무선표집은 의식적 조작 없이 표본을 추출하는 방법이며 방법으로는 난수표를 활용한다. ②는 유층표집, ③은 군집표집, ④는 의도적 표집이다.","id":"haengjeong-m0"},{"ch":"CH00 교육연구","t":"표집방법","q":"단순무선표집의 단점으로 옳은 것은?","opts":["모집단에 대해 연구자가 알고 있는 지식의 활용이 유용하지 못하며, 동일한 크기의 표집일 경우 유층표집에 비해 표집오차가 큼","연구자가 모집단의 주요 특성 및 하위집단의 구성비율에 대한 지식을 갖추고 있어야 함","군집의 수가 적을수록 표집오차가 커져서 대표성이 떨어짐","개인 성적 산출에는 대체값을 사용해야 한다는 점에서 부적절함"],"a":0,"exp":"단순무선표집의 단점은 연구자의 지식 활용이 유용하지 못하고 유층표집에 비해 표집오차가 크다는 점이다. ②는 유층표집, ③은 군집표집, ④는 행렬표집의 단점이다.","id":"haengjeong-m1"},{"ch":"CH00 교육연구","t":"표집방법","q":"유층표집의 개념과 장점으로 옳은 것은?","opts":["모집단을 구성하고 있는 중요한 특성을 기준으로 몇 가지 하위집단으로 구분한 후 분류된 각 집단으로부터 무선표집하는 방법이며, 표본과 모집단의 동질성을 확보하여 표본의 대표성을 높일 수 있고 같은 크기의 표집을 뽑을 때 단순무선표집에 비해 표집오차가 작음","의식적 조작 없이 표본을 추출하는 방법이며 오차계산이 용이함","자연적·행정적 집단을 표집단위로 하며 조사과정이 간편함","최종 단위의 표집을 위해 몇 개의 단계를 거치며 시간과 경비를 줄일 수 있음"],"a":0,"exp":"유층표집은 중요한 특성을 기준으로 하위집단으로 구분한 후 각 집단으로부터 무선표집하는 방법으로, 대표성이 높고 표집오차가 작다.","id":"haengjeong-m2"},{"ch":"CH00 교육연구","t":"표집방법","q":"군집표집의 개념과 단점으로 옳은 것은?","opts":["이미 형성되어 있는 자연적·행정적 집단(지역, 학교, 학급 등)을 표집단위로 하여 추출하는 방법이며, 군집의 수가 적을수록 표집오차가 커져서 대표성이 떨어짐","모집단의 중요 특성을 기준으로 하위집단으로 구분한 후 무선표집하며, 편파적 표집이 될 우려가 있음","피험자와 문항을 동시에 표집하며, 관리·시행·자료 처리과정이 복잡함","최종 단위의 표집을 위해 몇 단계를 거치며, 표집오차가 크게 나타날 수 있음"],"a":0,"exp":"군집표집은 자연적·행정적 집단을 표집단위로 추출하는 방법으로 장점은 조사과정이 간편하고 노력과 비용이 절감된다는 점, 단점은 군집의 수가 적을수록 표집오차가 커진다는 점이다.","id":"haengjeong-m3"},{"ch":"CH00 교육연구","t":"표집방법","q":"행렬표집의 개념과 장점으로 옳은 것은?","opts":["피험자와 문항을 동시에 표집할 수 있는 표본추출방법으로 전집의 각 특성별로 서로 다르게 표집단위들을 표집하는 방법이며, 일부의 피험자에게 일부의 문제만을 풀게 하여 피험자의 심리적 부담을 감소시키고 평가자의 시간과 비용을 절약함","자연적·행정적 집단을 표집단위로 추출하며 조사과정이 간편함","모집단을 하위집단으로 구분한 후 무선표집하며 대표성이 높음","연구목적에 비추어 주관적 판단으로 표집하며 편의성이 높음"],"a":0,"exp":"행렬표집은 가로축은 문항, 세로축은 피험자를 기준으로 하는 행렬을 작성한 후 문항을 N등분하고 N개 집단의 피험자를 무선표집하여 일부의 문항을 일부 피험자가 풀도록 설계하는 방법이다.","id":"haengjeong-m4"},{"ch":"CH00 교육연구","t":"표집방법","q":"비확률적 표집의 종류 중 '할당표집'에 해당하는 설명은?","opts":["모집단의 여러 특성을 대표할 수 있는 여러 개의 하위집단을 구성해 각 집단에 알맞은 표집수를 할당한 후 그 범위 내에서 임의로 표집하는 방법","연구자가 연구목적에 비추어 주관적 판단하에 사례들을 의도적으로 표집하는 방법","모집단의 중요 특성을 기준으로 하위집단으로 구분한 후 무선표집하는 방법","자연적·행정적 집단을 표집단위로 하여 추출하는 방법"],"a":0,"exp":"비확률적 표집의 종류는 의도적 표집(②)과 할당표집(①)이다.","id":"haengjeong-m5"},{"ch":"CH01 교육행정의 이해","t":"국가공
