팅장학 유형","q":"컨설팅장학의 유형에 대한 설명으로 옳은 것은?","opts":["운영범위에 따라 교내에서 실시되는 '교내 컨설팅장학'과 교육청 단위에서 이루어지는 '소지구 컨설팅장학'으로 구분되고, 의뢰과제의 성격에 따라 진단형, 대안수립형, 해결과정 지원형, 교육훈련형 컨설팅장학 등으로 구분되며, 의뢰영역에 따라 교수ㆍ학습, 교육과정 운영, 생활지도, 학급 및 학교경영 등의 컨설팅장학으로 구분됨","임상장학, 동료장학, 자기장학, 약식장학으로 구분됨","학교 간 방문장학, 교육연구활동, 학생생활지도활동으로 구분됨","발달장학, 선택적 장학, 인간자원장학으로 구분됨"],"a":0,"exp":"컨설팅장학의 유형은 ① 운영범위에 따라: 교내에서 실시되는 '교내 컨설팅장학', 교육청 단위에서 이루어지는 '소지구 컨설팅장학', ② 의뢰과제의 성격에 따라: 진단형, 대안수립형, 해결과정 지원형, 교육훈련형 컨설팅장학 등, ③ 의뢰영역에 따라: 교수ㆍ학습, 교육과정 운영, 생활지도, 학급 및 학교경영 등의 컨설팅장학으로 구분된다.","id":"haengjeong-m211"},{"ch":"CH07 장학론","t":"멘토링장학","q":"멘토링장학의 개념과 활성화 방안으로 옳은 것은?","opts":["개념: 경험과 지식이 있는 교사가 멘토를 담당해 경험과 지식이 적은 교사를 1:1로 지원하고 교수ㆍ학습 개선을 넘어 교사의 전문성 신장과 학교적응을 돕는 장학활동 / 방안: 퇴임교원 등을 활용한 멘토 지원단 조직, 멘토 대상 정기교육 실시, 멘토링 운영 매뉴얼 작성ㆍ공유, 멘토링 우수사례 발굴 및 사례집 발간","개념: 교사가 원하는 장학유형을 스스로 선택하는 장학 / 방안: 발달수준별 장학 제공","개념: 소규모 모의수업을 통해 교수기술을 제공하는 장학 / 방안: 수업 녹화 및 피드백","개념: 교사 간 협동하는 장학 / 방안: 공동 수업연구"],"a":0,"exp":"멘토링장학은 경험과 지식이 있는 교사가 멘토를 담당해 경험과 지식이 적은 교사를 1:1로 지원하고, 교수ㆍ학습 개선을 넘어 교사의 전문성 신장과 학교적응을 돕는 장학활동이다. 활성화 방안은 ① 퇴임교원 등을 활용한 멘토 지원단 조직, ② 멘토 대상 정기교육 실시, ③ 멘토링 운영 매뉴얼을 작성ㆍ공유함, ④ 멘토링 우수사례 발굴 및 사례집 발간이다.","id":"haengjeong-m212"},{"ch":"CH07 장학론","t":"마이크로티칭 개념·방법","q":"마이크로티칭의 개념과 구체적인 방법으로 옳은 것은?","opts":["개념: 소규모 학생들을 대상으로 짧은 시간 동안 한두 가지 내용을 가르치는 축소된 수업을 통해 장학담당자가 교사들에게 실제 수업사태를 기술ㆍ분석하여 교수기술을 제공해 주는 형태의 장학 / 방법: 수업 시 고려해야 하는 다양한 요소(학생 수, 시간, 수업장소, 교수법 등)를 반영하여 실제 수업장면과 유사한 형태로 축소한 후 예비적ㆍ압축적인 방식으로 소규모 모의수업을 진행","개념: 실제적인 교수행위를 직접 관찰하여 분석하는 수업장학 / 방법: 관찰 전 계획-수업관찰-평가","개념: 경험 있는 교사가 1:1로 지원하는 장학 / 방법: 멘토 지원단 조직","개념: 교사 간 협동하는 장학 / 방법: 공개수업 및 상호 참관"],"a":0,"exp":"마이크로티칭은 소규모 학생들을 대상으로 짧은 시간 동안 한두 가지 내용을 가르치는 축소된 수업을 통해 장학담당자가 교사들에게 실제 수업사태를 기술ㆍ분석하여 교수기술을 제공해 주는 형태의 장학이다. 방법은 수업 시 고려해야 하는 다양한 요소(학생 수, 시간, 수업장소, 교수법 등)를 반영하여 실제 수업장면과 유사한 형태로 축소한 후 예비적ㆍ압축적인 방식으로 소규모 모의수업을 진행하는 것이다.","id":"haengjeong-m213"},{"ch":"CH07 장학론","t":"마이크로티칭 장단점","q":"마이크로티칭의 장점과 단점으로 옳은 것은?","opts":["장점: 녹화된 화면을 통해 자신의 성취에 대하여 즉각적인 피드백을 받을 수 있고, 연습을 통한 수업능력 향상에 용이함 / 단점: 수업을 처음부터 끝까지 경험하지는 못한다는 점에서 실제 교실로의 전이가 어려울 수 있고, 대규모 학생들이 참여할 때 학생들 간의 개인차를 설명하기가 어려울 수 있음","장점: 실제 교실 상황을 그대로 재현함 / 단점: 시간과 비용이 많이 듦","장점: 교사 간 협동적 인간관계 수립 / 단점: 자율성이 제한됨","장점: 장학담당자와 1:1 관계 형성 / 단점: 교사에게 부담이 됨"],"a":0,"exp":"마이크로티칭의 장점은 ① 녹화된 화면을 통해 자신의 성취에 대하여 즉각적인 피드백을 받을 수 있음, ② 연습을 통한 수업능력 향상에 용이함이며, 단점은 ① 수업을 처음부터 끝까지 경험하지는 못한다는 점에서 실제 교실로의 전이가 어려울 수 있음, ② 대규모 학생들이 참여할 때 학생들 간의 개인차를 설명하기가 어려울 수 있음이다.","id":"haengjeong-m214"},{"ch":"CH08 교육재정","t":"학교회계제도 특징","q":"학교회계제도의 특징으로 옳지 않은 것은?","opts":["학교회계의 회계연도는 매년 1월 1일에 시작하여 그해 12월 31일에 종료함","학교교육 예산을 총액으로 배분함","교사 등 학교구성원의 참여와 학교운영위원회의 심의를 통해 자율적으로 우선순위를 정하여 세출예산을 편성ㆍ집행함","모든 세입과 세출을 일원화함"],"a":0,"exp":"학교회계의 회계연도는 매년 3월 1일에 시작하여 다음 해 2월 말일에 종료한다. 학교회계제도의 특징은 ① 학교교육 예산을 총액으로 배분함, ② 교사 등 학교구성원의 참여와 학교운영위원회의 심의를 통해 자율적으로 우선순위를 정하여 세출예산을 편성ㆍ집행함, ③ 학교회계의 회계연도는 매년 3월 1일에 시작하여 다음 해 2월 말일에 종료함이다.","id":"haengjeong-m215"},{"ch":"CH08 교육재정","t":"학교회계제도 장점","q":"학교회계제도의 장점으로 옳지 않은 것은?","opts":["교육청이 세출예산의 항목별 사용처를 사전에 지정하여 예산집행의 통제력을 높일 수 있음","자율적인 예산운영을 통한 다양한 교육활동으로 학교교육의 질적 수준이 높아질 수 있음","교사와 학부모가 학교재정 운영에 참여하여 투명성과 신뢰성이 높아짐","모든 세입과 세출을 일원화하여 학교재정의 효율적 운영이 가능해지고 회계 관련 업무가 간소화됨"],"a":0,"exp":"학교회계제도의 장점은 ① 자율적인 예산운영을 통한 다양한 교육활동으로 학교교육의 질적 수준이 높아질 수 있음, ② 교사와 학부모가 학교재정 운영에 참여하여 투명성과 신뢰성이 높아짐, ③ 모든 세입과 세출을 일원화하여 학교재정의 효율적 운영이 가능해지고 회계 관련 업무가 간소화됨, ④ 학교회계제도의 시행과 함께 사용료를 학교에서 직접 사용할 수 있도록 함으로써 학교가 지역사회 주민들이 이용하는 평생학습센터 기능을 할 수 있게 됨이다.","id":"haengjeong-m216"},{"ch":"CH08 교육재정","t":"품목별 예산제도","q":"품목별 예산제도의 개념, 장점, 단점으로 옳은 것은?","opts":["개념: 지출대상을 (인건비, 시설비, 운영비) 등과 같이 품목별로 세분화하여 지출대상과 그 한계를 명확히 규정함으로써 예산집행에 있어 유용이나 부정을 방지하고자 하는 통제지향 예산제도 / 장점: 행정부의 세출예산에 대한 엄격한 사전ㆍ사후 통제가 가능하고 회계책임을 분명히 할 수 있음 / 단점: 지나치게 자유재량을 제한해 예산집행 시 예상치 못한 사태에 신축성(융통성) 있게 대응하기 어려움","개념: 사업계획별ㆍ활동별로 분류한 다음 업무측정단위를 선정하여 예산액을 표시함 / 장점: 사업 이해가 용이함 / 단점: 성과측정이 어려움","개념: 장기적 계획과 단기적 예산편성을 유기적으로 통합한 제도 / 장점: 자원배분의 합리성 / 단점: 중앙집권적 성향","개념: 모든 사업을 원점에서 재검토하는 제도 / 장점: 예산 절감 / 단점: 업무부담 증가"],"a":0,"exp":"품목별 예산제도는 지출대상을 (인건비, 시설비, 운영비) 등과 같이 품목별로 세분화하여 지출대상과 그 한계를 명확히 규정함으로써 예산집행에 있어 유용이나 부정을 방지하고자 하는 통제지향 예산제도이다. 장점은 행정부의 세출예산에 대한 엄격한 사전ㆍ사후 통제가 가능하고 회계책임을 분명히 할 수 있다는 것이며, 단점은 지나치게 자유재량을 제한해 예산집행 시 예상치 못한 사태에 신축성(융통성) 있게 대응하기 어렵다는 것이다.","id":"haengjeong-m217"},{"ch":"CH08 교육재정","t":"성과주의 예산제도","q":"성과주의 예산제도의 개념과 장점으로 옳은 것은?","opts":["개념: 예산과목을 사업계획별ㆍ활동별로 분류한 다음 세부사업별로 업무측정단위를 선정하여 양적으로 표시하고 단위원가에 업무량을 곱하여 예산액을 표시함으로써 집행 성과를 측정ㆍ분석ㆍ평가할 수 있도록 하는 예산제도 / 장점: 일반인이 그 기관이 어떤 사업을 어떻게 추진하고 있는지 용이하게 이해할 수 있고, 정책이나 계획 수립이 용이하고 예산심의가 편리함","개념: 지출대상을 품목별로 세분화하는 통제지향 예산제도 / 장점: 회계책임이 분명함","개념: 장기적 계획과 단기적 예산편성을 통합한 제도 / 장점: 의사결정과정의 일원화","개념: 학교교육 예산을 총액으로 배분하는 제도 / 장점: 자율적 예산운영"],"a":0,"exp":"성과주의 예산제도는 예산과목을 사업계획별ㆍ활동별로 분류한 다음 세부사업별로 업무측정단위를 선정하여 양적으로 표시하고 단위원가에 업무량을 곱하여 예산액을 표시함으로써 집행 성과를 측정ㆍ분석ㆍ평가할 수 있도록 하는 예산제도이다. 장점은 ① 일반인이 그 기관이 어떤 사업을 어떻게 추진하고 있는지 용이하게 이해할 수 있음, ② 정책이나 계획 수립이 용이하고 예산심의가 편리함이다.","id":"haengjeong-m218"},{"ch":"CH08 교육재정","t":"성과주의 예산제도 단점","q":"성과주의 예산제도의 단점으로 옳은 것은?","opts":["업무측정단위의 선정, 성과측정이 어렵고 단위원가 계산도 곤란하며, 교육분야에 적용하는 데 여러 가지 어려움이 예상됨","지나치게 자유재량을 제한해 신축성 있게 대응하기 어려움","최고 의사결정자에게 정보가 집중되어 지나친 중앙집권적 성향을 초래할 수 있음","회계연도가 3월에 시작되어 국가 회계연도와 불일치함"],"a":0,"exp":"성과주의 예산제도의 단점은 ① 업무측정단위의 선정, 성과측정이 어렵고 단위원가 계산도 곤란함, ② 교육분야에 적용하는 데 여러 가지 어려움이 예상됨이다.","id":"haengjeong-m219"},{"ch":"CH08 교육재정","t":"기획 예산제도 특징","q":"기획 예산제도(PPBS)의 특징으로 옳지 않은 것은?","opts":["1년 단위로 운영되는 전통적 예산제도를 유지하면서 통제 중심으로 운영하는 제도","장기적 계획의 수립과 단기적 예산편성을 실행계획을 통해 유기적으로 통합ㆍ연결시킨 제도","자원배분에 관한 의사결정을 일관성 있게 함","1년 단위로 운영되고 있는 전통적 예산제도에서 탈피하여 다년도 예산을 기본으로 하겠다는 5년 단위 연동예산제도"],"a":0,"exp":"기획 예산제도의 특징은 ① 장기적 계획의 수립과 단기적 예산편성을 실행계획을 통해 유기적으로 통합ㆍ연결시킨 제도, ② 자원배분에 관한 의사결정을 일관성 있게 함, ③ 1년 단위로 운영되고 있는 전통적 예산제도에서 탈피하여 다년도 예산을 기본으로 하겠다는 5년 단위 연동예산제도이다.","id":"haengjeong-m220"},{"ch":"CH08 교육재정","t":"기획 예산제도 장단점","q":"기획 예산제도(PPBS)의 장점과 단점으로 옳은 것은?","opts":["장점: 사업계획의 목적, 대안, 효용 및 소요자원이 잘 연결되어 있어 상부의 의사결정이 용이하며 모든 것을 중앙집권적으로 처리할 수 있기 때문에 의사결정 과정을 일원화할 수 있고, 사업계획과 예산편성을 유기적으로 연결해 주기 때문에 자원배분이 합리적으로 이루어질 수 있음 / 단점: 최고 의사결정자에게 정보가 집중되어 지나친 중앙집권적 성향을 초래할 수 있고, 목표달성 정도를 계량화하기 어렵고 계량적 분석기법의 도입에 한계가 있음","장점: 회계책임을 분명히 할 수 있음 / 단점: 자유재량이 제한됨","장점: 일반인이 사업 추진 상황을 이해하기 쉬움 / 단점: 업무측정단위 선정이 어려움","장점: 자율적인 예산운영이 가능함 / 단점: 학교 간 격차가 발생함"],"a":0,"exp":"기획 예산제도의 장점은 ① 사업계획의 목적, 대안, 효용 및 소요자원이 잘 연결되어 있어 상부의 의사결정이 용이하며 모든 것을 중앙집권적으로 처리할 수 있기 때문에 의사결정 과정을 일원화할 수 있음, ② 사업계획과 예산편성을 유기적으로 연결해 주기 때문에 자원배분이 합리적으로 이루어질 수 있음이다. 단점은 ① 최고 의사결정자에게 정보가 집중되어 지나친 중앙집권적 성향을 초래할 수 있음, ② 목표달성 정도를 계량화하기 어렵고 계량적 분석기법의 도입에 한계가 있음이다.","id":"haengjeong-m221"}],"essay":[{"ch":"교육연구","t":"단순무선표집","q":"단순무선표집의 개념, 장점과 단점 각각 1가지, 단순무선표집의 방법 1가지를 서술하시오.","ans":"개념: 의식적 조작 없이 표본을 추출하는 방법 ⇒ 모집단에 속한 모든 요소는 표본으로 선택될 수 있는 독립적인 기회를 동등하게 가짐\n장점: 모집단의 특성에 대하여 특별한 사전지식이 필요 없음. 자료분석이나 오차계산이 용이함\n단점: 모집단에 대해 연구자가 알고 있는 지식의 활용이 유용하지 못함. 동일한 크기의 표집일 경우 유층표집에 비해 표집오차가 큼\n방법: 난수표 활용","kw":["의식적 조작 없이","독립적인 기회","동등","사전지식","표집오차","난수표"],"id":"haengjeong-e0"},{"ch":"교육연구","t":"유층표집","q":"유층표집의 개념, 장점과 단점 각각 1가지를 서술하시오.","ans":"개념: 모집단을 구성하고 있는 중요한 특성을 기준으로 몇 가지 하위집단으로 구분한 후 분류된 각 집단으로부터 무선표집하는 방법\n장점: 표본과 모집단의 동질성을 확보하여 표본의 대표성을 높일 수 있음. 같은 크기의 표집을 뽑을 때 단순무선표집에 비해 표집오차가 작음\n단점: 연구자가 모집단을 구성하고 있는 주요 특성 및 하위집단의 구성비율에 대한 지식을 갖추고 있어야 함. 비비례유층표집의 경우 모집단의 구성비율을 무시하고 표집함으로써 편파적 표집이 될 우려가 있음","kw":["중요한 특성","하위집단","무선표집","동질성","대표성","구성비율","비비례유층표집","편파적"],"id":"haengjeong-e1"},{"ch":"교육연구","t":"군집표집","q":"군집표집의 개념과 방법, 장점과 단점 각각 1가지를 서술하시오.","ans":"개념: 이미 형성되어 있는 자연적ㆍ행정적 집단(지역, 학교, 학급 등)을 표집단위로 하여 추출하는 방법\n방법: 모집단을 '군집'이라는 많은 수의 집단으로 분류한 후 군집들 중 표집의 대상이 될 군집을 무선으로 추출하고, 여기에서 추출된 군집에 속한 모든 사례를 표본집단으로 삼음\n장점: 조사과정이 간편하고 표집을 위한 노력과 비용이 절감됨\n단점: 군집의 수가 적을수록 표집오차가 커져서 대표성이 떨어짐","kw":["자연적ㆍ행정적 집단","표집단위","군집","무선","모든 사례","간편","비용 절감","대표성"],"id":"haengjeong-e2"},{"ch":"교육연구","t":"다단계표집","q":"다단계표집의 개념, 장점과 단점 각각 1가지를 서술하시오.","ans":"개념: 최종 단위의 표집을 위해 몇 개의 단계를 거쳐 표집하는 방법으로, 전집의 크기가 매우 큰 경우 적용됨\n장점: 표집에 드는 시간과 경비를 줄일 수 있음\n단점: 표본의 크기가 동일할 경우 다른 표집방법들보다 표집오차가 크게 나타날 수 있음","kw":["최종 단위","몇 개의 단계","전집의 크기","시간과 경비","표집오차"],"id":"haengjeong-e3"},{"ch":"교육연구","t":"행렬표집","q":"행렬표집의 개념, 방법, 장점과 단점 각각 1가지를 서술하시오.","ans":"개념: 피험자와 문항을 동시에 표집할 수 있는 표본추출방법. 전집의 각 특성별로 서로 다르게 표집단위들을 표집하는 방법\n방법: 가로축은 문항, 세로축은 피험자가 기준이 되는 행렬을 작성한 후 문항을 N등분하고 N개 집단의 피험자를 무선표집하여 일부의 문항을 일부 피험자가 풀도록 설계\n장점: 일부의 피험자에게 일부의 문제만을 풀게 하여 피험자의 심리적 부담을 감소시킴. 평가자의 시간과 비용을 절약함\n단점: 개인성적 산출에는 대체값을 사용해야 한다는 점에서 부적절함. 서로 다른 문항들로 구성된 여러 종류의 검사를 실시하고 채점해야 하므로 관리, 시행, 자료, 처리과정이 복잡하며 시간과 노력이 많이 듦","kw":["피험자와 문항을 동시에","행렬","N등분","심리적 부담","대체값","복잡"],"id":"haengjeong-e4"},{"ch":"교육연구","t":"비확률적 표집","q":"비확률적 표집의 종류 2가지의 명칭을 개념과 함께 제시하시오.","ans":"의도적 표집: 연구자가 연구목적에 비추어 주관적 판단하에 사례들을 의도적으로 표집하는 방법\n할당표집: 모집단의 여러 특성을 대표할 수 있는 여러 개의 하위집단을 구성해 각 집단에 알맞은 표집수를 할당한 후 그 범위 내에서 임의로 표집하는 방법","kw":["의도적 표집","주관적 판단","할당표집","하위집단","표집수를 할당","임의로"],"id":"haengjeong-e5"},{"ch":"CH01 교육행정의 이해","t":"국가공권설","q":"국가공권설의 개념, 특징과 한계 각각 1가지를 서술하시오.","ans":"개념: 교육행정을 국가권력작용으로 파악. '교육부가 수행하는 법적 기능 또는 행정작용'\n특징: 교육활동의 특수성과 전문성보다 행정의 통합성이 강조됨. 교육행정을 국가의 수많은 행정영역 중에서 교육을 대상으로 하는 일반행정작용으로 여김\n한계: 교육행정의 특수성과 전문성을 무시하고 행정의 관료성과 획일성을 강조함. 교육의 정치적 중립성과 자주성을 간과함","kw":["국가권력작용","교육부","법적 기능","행정의 통합성","일반행정작용","관료성","획일성","정치적 중립성","자주성"],"id":"haengjeong-e6"},{"ch":"CH01 교육행정의 이해","t":"조건정비설","q":"조건정비설의 개념, 특징과 한계 각각 1가지를 서술하시오.","ans":"개념: 교육목표를 효율적으로 달성하기 위해 필요한 인적ㆍ물적 조건을 정비 및 확립하는 수단적ㆍ봉사적 활동으로 봄\n특징: 교육활동의 특수성ㆍ전문성 강조. 교육행정을 교육활동의 목표를 설정 및 달성하는 데 필요한 인적ㆍ물적 조건을 구비하는 수단으로 여김\n한계: 교육행정의 봉사활동, 기술적 측면, 정치적 중립 등이 강조되지만, 행정에 작용하는 권력적 측면은 소홀히 취급됨","kw":["인적ㆍ물적 조건","정비","수단적ㆍ봉사적","특수성ㆍ전문성","권력적 측면","소홀"],"id":"haengjeong-e7"},{"ch":"CH01 교육행정의 이해","t":"협동행위론","q":"협동행위론의 특징 2가지를 서술하시오.","ans":"① 주로 행정행위, 특히 '의사결정과정'에 초점을 둠\n② 합리성 추구 ⇒ 협동행위를 통하여 과업을 효과적으로 성취하는 것\n③ 단위학교책임경영제가 대두되며 협동행위로서 교육행정을 바라보는 관점 강조","kw":["의사결정과정","합리성 추구","협동행위","단위학교책임경영제"],"id":"haengjeong-e8"},{"ch":"CH01 교육행정의 이해","t":"성장지원론","q":"성장지원론의 특징 2가지를 서술하시오.","ans":"① 궁극적 지향점을 학습자의 학습활동에 두고, 학습동기를 유발하고 활발한 학습활동을 유지ㆍ조장함으로써 교육적 성장을 달성할 수 있도록 제반 조건과 환경을 정비하는 활동임\n② 학습의 주체와 학습활동 자체를 중시함","kw":["학습자의 학습활동","학습동기","유지ㆍ조장","교육적 성장","제반 조건과 환경","학습의 주체"],"id":"haengjeong-e9"},{"ch":"CH01 교육행정의 이해","t":"민주성·기회균등의 원리","q":"교육행정의 원리 중 민주성의 원리와 기회균등의 원리 각각의 개념과 그에 적합한 예시 각 1가지를 제시하시오.","ans":"민주성의 원리: 국민의 의사를 행정에 반영하고 국민을 위한 행정을 해야 함 ⇒ 예시: 교직원회의, 협의회, 연구회 등을 통해 의사소통의 길을 개방하고 협조나 이해를 토대로 사무를 집행함\n기회균등의 원리: 모든 국민이 능력에 따라 균등하게 교육을 받을 권리. 법적으로 보장됨 ⇒ 예시: 의무교육, 장학금제도, 사회보장제도, 야간제ㆍ계절제ㆍ시간제 학교 운영 등","kw":["국민의 의사","교직원회의","협의회","의사소통의 길을 개방","능력에 따라 균등","법적으로 보장","의무교육","장학금제도"],"id":"haengjeong-e10"},{"ch":"CH01 교육행정의 이해","t":"효율성·적도집권의 원리","q":"교육행정의 원리 중 효율성의 원리와 적도집권의 원리 각각의 개념을 서술하시오.","ans":"효율성의 원리: 효과성 + 능률성. 가장 능률적인 방법으로 최대의 목표를 달성하는 것\n적도집권의 원리: 중앙집권과 지방분권 사이에서 적도의 균형점을 확보해야 함. 집권주의가 행정의 능률 향상에 기여하는 한편 분권주의는 민주주의적 권한의 위양과 참여의 기회를 보장하므로 적절한 균형을 도모해야 함","kw":["효과성","능률성","최대의 목표","중앙집권","지방분권","적도의 균형점","권한의 위양","참여의 기회"],"id":"haengjeong-e11"},{"ch":"CH01 교육행정의 이해","t":"관료제 개념·몰인정성·경력지향성","q":"관료제의 개념을 제시하고, 관료제의 특징 중 '몰인정성'과 '경력지향성'의 개념 및 이러한 특징이 학교조직에 미치는 순기능과 역기능 각각 1가지를 서술하시오.","ans":"개념: 합법적 권위를 기초로 하여 성립하는 이상적인 조직형태\n몰인정성: 직원은 개인적 감정을 드러내지 않고 형식주의적인 비인격성에 입각해 직무를 수행함 ⇒ 순기능: 합리성 증진 / 역기능: 사기 저하\n경력지향성: 직원의 보수는 직위에 따라 책정ㆍ지급되며, 승진은 상급자의 판단에 의하되 경력이나 실적에 의해 결정됨 ⇒ 순기능: 동기의 유발 / 역기능: 실적과 연공의 갈등\n[참고: 관료제의 특징별 순기능-역기능] 분업과 전문화-전문성 향상/권태감의 누적, 권위의 위계-순응과 원활한 조정/의사소통 장애, 규정과 규칙-계속성과 통일성 확보/경직과 목표전도, 몰인정성-합리성 증진/사기 저하, 경력지향성-동기의 유발/실적과 연공의 갈등","kw":["합법적 권위","이상적인 조직형태","개인적 감정","비인격성","합리성 증진","사기 저하","보수는 직위","경력이나 실적","동기의 유발","실적과 연공의 갈등"],"id":"haengjeong-e12"},{"ch":"CH01 교육행정의 이해","t":"학교의 관료제적 특징","q":"학교의 관료제적 특징 2가지를 각각 이에 적합한 예시와 함께 제시하시오.","ans":"기능적 분업: 학교의 업무는 크게 교수ㆍ학습활동을 중심으로 한 수업과 이를 지원하기 위한 각종 행정업무로 나누어짐\n공식적 직무로서 교직원 역할의 정의: 「초ㆍ중등교육법」 제20조에는 교장과 교감, 교사, 행정직원과 같은 직원의 역할이 명확하게 규정되어 있음. 부장교사 같은 학교의 보직교사의 경우, 그 명칭은 관할 교육지원청이 정하고 업무분장은 학교장이 정하도록 규정함\n절차 규정에 따른 운영: 공식적 행위의 목적과 형태를 상술하여 교사의 재량에 제한을 두는 절차가 존재함\n직책의 위계구조: 학교조직은 직제표에 따라 명확하고 엄격한 위계구조를 지님\n승진구조: 교사는 전문적인 능력에 따라서 채용되고, 연공서열과 업적에 따라 승진이 결정됨","kw":["기능적 분업","수업","행정업무","초ㆍ중등교육법 제20조","보직교사","절차 규정","재량에 제한","직제표","위계구조","연공서열","업적"],"id":"haengjeong-e13"},{"ch":"CH01 교육행정의 이해","t":"브루코버 과정변인","q":"브루코버(Brookover)의 사회체제접근에서 과정변인 2가지를 서술하시오.","ans":"① 학교의 사회심리적 규범: 학교구성원의 학교교육에 대한 일반적인 신념, 기대, 규범, 평가, 감정, 분위기 등 ⇒ 학교의 역사적 전통에서 파생된 것\n② 학교의 조직구조 및 운영방식: 학교의 행정적 조직부터 학급 내 학습집단 구성형태까지 포함\n③ 학급 내 수업실천행위: 학급 내에서 개인 또는 집단적으로 표출되는 의사소통의 방식, 행동강화, 보상방식, 규제나 평가, 수업자료 제공과 수업에 투입하는 시간 등","kw":["사회심리적 규범","신념, 기대, 규범","역사적 전통","조직구조 및 운영방식","학습집단 구성형태","수업실천행위","의사소통의 방식","행동강화"],"id":"haengjeong-e14"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 구바","q":"겟젤스(Getzels)와 구바(Guba)의 사회과정모형에서 인간의 행동이 사회적 행위로 나타나는 데에 영향을 미치는 두 가지 차원의 명칭을 그에 적합한 개념과 함께 제시하시오.","ans":"① 규범적 차원(조직적 차원): 체제의 목적을 달성하기 위한 과업분담체제. 지위, 역할, 역할에 따른 기대 등을 규정한 제도\n② 개인적 차원(심리적 차원): 독특한 특성을 가지고 있는 개인을 포함하는 사회체제. 개인, 인성, 욕구성향을 의미함","kw":["규범적 차원","조직적 차원","과업분담체제","지위, 역할","역할에 따른 기대","개인적 차원","심리적 차원","인성","욕구성향"],"id":"haengjeong-e15"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 텔렌 3차원","q":"겟젤스(Getzels)와 텔렌(Thelen)의 수정모형에서 조직과 개인 차원 외에 인간의 행위에 영향을 미치는 세 가지 차원의 명칭을 그에 적합한 개념과 함께 제시하시오.","ans":"① 인류학적 차원: 한 제도에 소속된 개인의 행동은 보다 큰 차원의 사회의식에 의해 영향을 받고, 사회적 행동에 영향을 미침. 사회의식은 한 개인이 소속한 집단과 관련 맺고 있는 보다 큰 사회체제의 문화를 의미함\n② 조직풍토 차원: 어떠한 조직이든 특수한 조직풍토 또는 집단의식이 있으며 이들에 의해 개인의 사회적 행위는 아주 다르게 나타남\n③ 생물학적 차원: 인간의 신체구조와 내적 잠재력 등 물리적ㆍ정서적 조건이 개인의 인성과 욕구에 영향을 주고 사회적 행동에도 영향을 미침","kw":["인류학적 차원","사회의식","사회체제의 문화","조직풍토 차원","집단의식","생물학적 차원","신체구조","내적 잠재력","인성과 욕구"],"id":"haengjeong-e16"},{"ch":"CH01 교육행정의 이해","t":"겟젤스와 텔렌 목표 조건","q":"겟젤스(Getzels)와 텔렌(Thelen)의 수정모형(1960)에서 개인의 행동이 목표로 나타나기 위한 조건 3가지의 명칭을 그에 적합한 개념과 함께 제시하시오.","ans":"① 합리성: 목표행위에 대한 역할기대가 논리적으로 부합해야 함\n② 소속감: 집단의 제도적 목표달성에 의식적으로 참여함으로써 공동체의식을 가져야 함\n③ 일체감: 제도적 목표와 자신의 욕구성향을 일치시켜야 함","kw":["합리성","역할기대","논리적으로 부합","소속감","제도적 목표달성","공동체의식","일체감","욕구성향을 일치"],"id":"haengjeong-e17"},{"ch":"CH01 교육행정의 이해","t":"호이와 미스켈 4체제","q":"호이(Hoy)와 미스켈(Miskel)의 관점에서 학교조직을 구성하는 4가지 체제의 명칭을 개념과 함께 제시하시오.","ans":"구조체제: 학교조직의 목적 달성을 위해 설계 및 조직된 공식적ㆍ관료적 기대\n개인체제: 학교구성원의 욕구, 목적, 신념, 역할에 대한 인지적 이해의 관점\n문화체제: 학교관리자와 교사를 비롯한 교직원이 일에 대해 공유하고 있는 지향점\n정치체제: 학교구조에서 '교장-교감-교사', '교사-교사' 간의 권력관계","kw":["구조체제","공식적ㆍ관료적 기대","개인체제","욕구, 목적, 신념","문화체제","공유하고 있는 지향점","정치체제","권력관계"],"id":"haengjeong-e18"},{"ch":"CH01 교육행정의 이해","t":"개방체제로서의 학교조직","q":"개방체제로서 학교조직의 특징 2가지를 서술하시오.","ans":"① 학교운영위원회와 같은 공식적 의사소통구조, 정치적 성격을 지닌 비공식적인 활동을 통해 학교 내외에서 피드백을 제공함\n② 학교체제에서의 환경은 학교체제를 구성하는 내적 요소에 영향을 줌. 교육청의 정책, 교육청에 근무하는 교육행정가, 다른 학교, 지역사회 등을 포함","kw":["학교운영위원회","공식적 의사소통구조","비공식적인 활동","피드백","환경","내적 요소","교육청의 정책","지역사회"],"id":"haengjeong-e19"},{"ch":"CH01 교육행정의 이해","t":"전문적 학습공동체 목표·조건","q":"전문적 학습공동체의 목표와 전문적 학습공동체의 활성화를 위한 조건 2가지를 서술하시오.","ans":"목표: 교사들이 함께 일하는 것에 가치를 두고, 협조를 통하여 교사의 교수ㆍ학습활동을 개선하는 데 지속적인 노력을 기울이는 것\n활성화 조건: ① 분산적 리더십을 통해 학교발전을 위한 참여 및 책임을 서로 공유할 수 있는 문화 생성, ② 전문적 학습공동체를 유지하는 데 필요한 인적ㆍ재정적ㆍ물적 자원의 확보가 필요함, ③ 교사전문가로 구성된 연결망은 전문적 학습공동체를 구성 및 유지하는 데 필요한 인적자원을 제공함, ④ 다양한 교육책무성 지표를 설정하여 학생의 성장을 다양한 방식으로 나타낼 필요가 있음","kw":["함께 일하는 것에 가치","교수ㆍ학습활동을 개선","분산적 리더십","참여 및 책임","인적ㆍ재정적ㆍ물적 자원","연결망","교육책무성 지표"],"id":"haengjeong-e20"},{"ch":"CH02 조직론","t":"비공식조직","q":"비공식조직의 개념, 비공식조직이 공식조직과 구별되는 특징 2가지, 비공식조직의 순기능과 역기능 각각 2가지를 서술하시오.","ans":"개념: 공식조직 내에 자연발생적으로 생기는 조직(=자생조직)\n특징: ① 공식조직은 권한의 위계, 분명한 책임, 표준화된 업무수행, 비인정적 인간관계인 반면 비공식조직은 지역, 학연 등을 바탕으로 형성된 비공식 규범과 권위의 위계 속에서 활동함, ② 공식조직의 규모는 계속 확대되는 반면 비공식조직은 친숙한 인간관계를 요건으로 하므로 항상 소집단을 유지함\n순기능: ① 구성원의 태도, 이해, 관습, 습관, 제도를 형성함, ② 공식조직에서 필요로 하는 조건을 형성하여 조직의 기능을 활성화함, ③ 공식조직 내 자유로운 의사소통을 원활하게 함\n역기능: ① 파벌을 조성하고 공식조직의 목표달성을 저해할 수 있음, ② 공식조직의 의사소통을 차단 또는 왜곡하여 비합리적 의사결정이나 편파적 행정행위 등을 초래함. 조직의 혼란을 가중시킬 수 있음","kw":["자연발생적","자생조직","권한의 위계","비공식 규범","소집단","태도, 이해, 관습","자유로운 의사소통","파벌","차단 또는 왜곡","편파적 행정행위"],"id":"haengjeong-e21"},{"ch":"CH02 조직론","t":"계선조직과 참모조직","q":"계선조직과 참모조직 각각의 개념을 이에 적합한 예시 1가지와 함께 제시하고, 계선조직과 참모조직 각각의 장점과 단점 2가지씩 서술하시오.","ans":"계선조직 - 개념: 행정의 수직적 지휘명령계통이 명확히 정립되어 업무를 직접 수행하는 1차적인 조직 / 예) '장관-실ㆍ국장-과장-계장-계원'으로 이어지는 행정관료조직\n계선조직 장점: 권한과 책임의 한계가 명확해 업무수행의 효율성을 제고할 수 있음, 단일기관으로 구성되어 신속하게 정책을 결정할 수 있음, 업무처리가 간편하여 조직운영비가 적게 듦, 강력한 통솔력을 발휘할 수 있음\n계선조직 단점: 복잡하고 과다한 업무처리가 어려움, 지도자의 주관적ㆍ독단적인 결정을 방지할 수 없음, 전문가의 지식과 경험을 충분하게 활용할 수 없음, 조직의 경직성을 초래할 수 있음\n참모조직 - 개념: 계선조직의 기능을 원활하게 추진하도록 기획, 자문, 협의, 경고, 정보수집, 통제, 인사, 조사, 연구 등의 기능을 수행하는 조직(=막료조직) / 예) 각종 위원회\n참모조직 장점: 기관장의 통솔범위를 확대시킴, 전문적 지식과 경험을 활용하여 합리적인 결정을 할 수 있음, 수평적 업무조정을 가능하게 함, 조직의 신축성을 기할 수 있음\n참모조직 단점: 조직의 복잡성으로 조직구성원이나 부서 간 갈등, 불화가 생길 수 있음, 조직운영을 위한 경비지출이 많이 듦, 계선과 참모 간에 책임전가 사태를 빚을 우려가 있음, 의사전달의 혼란을 일으킬 수 있음","kw":["수직적 지휘명령계통","1차적인 조직","권한과 책임의 한계","신속하게 정책을 결정","통솔력","독단적인 결정","경직성","막료조직","기획, 자문, 협의","통솔범위를 확대","수평적 업무조정","신축성","책임전가"],"id":"haengjeong-e22"},{"ch":"CH02 조직론","t":"칼슨의 봉사조직","q":"칼슨(Carlson)의 관점에서 봉사조직을 분류하는 기준 2가지를 제시하고, 야생조직과 사육조직 각각의 특징 2가지와 조직별 예시 각 1가지를 서술하시오.","ans":"분류기준: 고객의 참여결정권, 조직의 고객선택권 여부\n야생조직 - 특징: ① 조직과 고객이 독자적 선택권을 갖는 조직, ② 살아남기 위해 경쟁이 필수적임 / 예시: 사립학교, 개인병원, 공공복지기관 등\n사육조직(온상조직, 보호조직) - 특징: ① 조직이나 고객 모두 선택권을 갖지 못하는 조직, ② 법적으로 존립을 보장받고 있음 / 예시: 공립학교, 정신병원, 형무소 등","kw":["고객의 참여결정권","조직의 고객선택권","야생조직","독자적 선택권","경쟁이 필수적","사립학교","사육조직","온상조직","선택권을 갖지 못하는","법적으로 존립을 보장","공립학교"],"id":"haengjeong-e23"},{"ch":"CH02 조직론","t":"에치오니 규범조직","q":"에치오니(Etzioni)의 조직유형 중 학교가 속하는 조직유형의 명칭과 이 유형의 목적, 특성 2가지를 서술하시오.","ans":"명칭: 규범조직\n목적: 새로운 문화의 창출ㆍ계승ㆍ활용\n특성: ① 규범적 권력: 상징적 보상을 사용하는 것 / 헌신적 참여: 매우 긍정적 태도를 가지고 적극적으로 참여하는 것, ② 규범적 권력을 사용하여 구성원의 높은 헌신적 참여를 유도","kw":["규범조직","새로운 문화의 창출ㆍ계승ㆍ활용","규범적 권력","상징적 보상","헌신적 참여","긍정적 태도"],"id":"haengjeong-e24"},{"ch":"CH02 조직론","t":"기계식·전문적 관료제","q":"기계식 관료제와 전문적 관료제의 특성 각각 2가지를 서술하시오.","ans":"기계식 관료제: ① 표준화된 작업과정을 통해 조정되는 조직, ② 표준화를 주도하는 기술구조층이 핵심부문이 됨, ③ 규칙과 규정의 적용, 공식적 의사소통, 위계적 의사결정(≒베버형 관료제 조직)\n전문적 관료제: ① 기술의 표준화를 조정기제로 하는 조직, ② 현업 핵심계층이 조직의 핵심이 되어 실무 전문가들의 기술과 지식에 의존하는 조직, ③ 전문가 스스로가 자신을 통제하고 작업기준을 개발하기 때문에 분권화 및 이완된 형태를 보임","kw":["표준화된 작업과정","기술구조층","위계적 의사결정","기술의 표준화","현업 핵심계층","실무 전문가","분권화","이완된 형태"],"id":"haengjeong-e25"},{"ch":"CH02 조직론","t":"홀의 관료적·전문적 패턴","q":"홀(Hall)의 분류에 따를 때, 관료제의 특징 중 관료적 패턴의 특징과 전문적 패턴의 특징 각각 2가지를 서술하시오.","ans":"관료적 패턴의 특징: 권위의 위계, 규정과 규칙, 몰인정성, 절차 상세화\n전문적 패턴의 특징: 기술적 능력, 전문화","kw":["권위의 위계","규정과 규칙","몰인정성","절차 상세화","기술적 능력","전문화"],"id":"haengjeong-e26"},{"ch":"CH02 조직론","t":"홀의 학교조직 4유형","q":"홀(Hall)의 분류에 따를 때, 학교조직의 유형 4가지의 명칭을 각각의 특징 2가지와 함께 제시하시오.","ans":"베버형 구조(관료성↑, 전문성↑): ① 전문성과 관료성이 상호보완적 관계에 있음, ② 베버가 기술한 이상적 관료제 구조\n권위주의형 구조(관료성↑, 전문성↓): ① 권위는 직위와 위계에 토대를 두고 있음, ② 상급자가 최종 결정을 하며 권력은 집중되어 있음, ③ 규칙과 절차가 객관적으로 적용됨, ④ 처벌 중심적 관료제와 유사\n전문형 구조(관료성↓, 전문성↑): ① 실질적 의사결정이 구성원들에게 위임되어 있는 구조, ② 구성원들은 조직의 중요한 의사결정을 할 수 있는 전문지식과 능력을 갖춘 전문가로 간주됨, ③ 규정은 행동과 결정의 지침으로 작용하며 교사들이 조직의 의사결정 과정에 상당한 영향력을 행사함\n혼돈형 구조(관료성↓, 전문성↓): ① 혼란과 갈등이 일상의 조직운영에서 나타남, ② 모순, 반목 및 비효과성이 조직 전반에 퍼져 있음, ③ 다른 구조유형으로 이동하려는 강력한 압력이 존재","kw":["베버형 구조","상호보완적","이상적 관료제","권위주의형 구조","직위와 위계","처벌 중심적 관료제","전문형 구조","의사결정이 위임","혼돈형 구조","혼란과 갈등","모순, 반목"],"id":"haengjeong-e27"},{"ch":"CH02 조직론","t":"(공립)학교조직의 유형 종합","q":"(공립)학교조직의 유형을 종합하여 제시하시오.","ans":"유형유지조직 / 사육조직 / 규범조직 / 전문적 관료제","kw":["유형유지조직","사육조직","규범조직","전문적 관료제"],"id":"haengjeong-e28"},{"ch":"CH02 조직론","t":"학교조직의 관료제 구별점","q":"학교조직의 관료제가 일반적인 관료제와 구별되는 점 2가지를 서술하시오.","ans":"① 구성원인 교사가 고도의 교육을 받은 전문가라는 점에서 일반적 관료제와 구별됨\n② 교사는 독립적이고 한정된 교실에서 다양한 배경의 학생을 가르치면서 상당한 자유재량권을 행사함(전문조직)","kw":["고도의 교육을 받은 전문가","독립적이고 한정된 교실","다양한 배경의 학생","자유재량권","전문조직"],"id":"haengjeong-e29"},{"ch":"CH02 조직론","t":"학교의 관료제적·전문조직적 특징","q":"학교의 관료제적 특징 3가지와 전문조직적 특징 3가지를 서술하시오.","ans":"관료제적 특징:\n∙ 가르치는 교수활동과 학교의 행정을 다루는 일이 분리되어 있고 교무부, 학생부 등 여러 부서를 두어 직무를 분담함(분업과 전문화)\n∙ '학교장-교감-부장교사-교사' 순으로 권한과 책임에 관한 명확한 서열적 위계가 존재함(서열적 위계)\n∙ 학교의 모든 활동은 각종 법률이나 규정 및 규칙에 근거하여 수행됨(규칙ㆍ규정 중시)\n∙ 경력이 많은 교원이 보수와 승진 등에서 유리함(경력지향성)\n∙ 교육활동이나 행정업무는 사사로운 감정에 치우치지 않음(몰인정성)\n전문조직적 특징:\n∙ 교사는 교육에 관한 전문성을 근거로 독립적인 교실에서 상당한 자유재량권을 가지고 학생을 가르침\n∙ 교장의 지시나 통제가 교사의 개별적인 교육활동에 영향을 미치는 데는 한계가 있음\n∙ 교사는 학교의 전문적 교육활동에 관한 의사결정에 깊이 참여하기 때문에 어느 정도 분권화된 조직의 특성을 지님\n∙ 학교에는 교육목표가 있지만 대개 추상적 표현으로 모호하게 되어 있어 직무수행의 통일된 표준을 설정하고 이에 근거해 교사들을 감독하는 것이 어려움","kw":["분업과 전문화","교무부, 학생부","서열적 위계","규칙ㆍ규정 중시","경력지향성","몰인정성","자유재량권","교장의 지시나 통제","분권화","추상적 표현","통일된 표준"],"id":"haengjeong-e30"},{"ch":"CH02 조직론","t":"조직화된 무질서조직","q":"조직화된 무질서조직의 특징 3가지와 이러한 조직에서 의사결정이 일어나는 형태를 설명하시오.","ans":"① 불분명한 목표: 교육조직의 목표는 구체적이지 않고 불분명하며, 수시로 변하고, 대립적 목표가 상존하며, 구성원마다 다르게 규정함\n② 불확실한 기술: 교육조직에서는 아주 많은 기술이 활용되지만 그것이 학습자에게 어떠한 영향을 미칠지 불분명함. 특히 어떤 방법과 자료를 활용해야 학습자로 하여금 요구된 목표에 도달하게 할 수 있는지에 대해 교사와 행정가 등의 합의된 견해가 없음\n③ 유동적 참여: 학생은 입학 후 일정한 기간이 지나면 졸업, 교사와 행정가도 정기적으로 이동, 학부모와 지역사회 관계자도 필요시에만 참여함\n의사결정모형 - 쓰레기통모형: 조직화된 무정부 조직 상태에서 '문제, 해결책, 선택기회 및 참여자'라는 4요소가 독자적으로 움직이다가 어떤 우연한 사건을 계기로 교차하여 결합하게 될 때 결정이 이루어진다고 봄","kw":["불분명한 목표","대립적 목표가 상존","불확실한 기술","합의된 견해가 없음","유동적 참여","쓰레기통모형","문제, 해결책, 선택기회 및 참여자","우연한 사건"],"id":"haengjeong-e31"},{"ch":"CH02 조직론","t":"이완조직","q":"이완조직의 개념과 학교의 이완조직으로서의 특징 2가지를 서술하시오.","ans":"개념: 느슨하게 결합된 조직. 서로 연결되어 있으나 각자 분리ㆍ독립되어 정체성을 보존하는 하부단위들의 연결체\n특징: ① 각 하부단위들이 독립되어 있기 때문에 한 부분에서의 성패가 다른 부분과 연결되지 않음. 즉, 한 과목의 성패가 다른 과목과 연결되지 않으며 한 학급의 어려움 또한 다른 학급과 독립적인 사건으로 여겨짐, ② 교육목표와 평가방법이 모호하다는 점에서 교사에 대한 감독과 평가가 제한적임, ③ 교사는 전문직으로서 상당한 자율권을 가짐","kw":["느슨하게 결합","정체성을 보존","하부단위들의 연결체","성패가 다른 부분과 연결되지 않음","감독과 평가가 제한적","자율권"],"id":"haengjeong-e32"},{"ch":"CH02 조직론","t":"이중조직","q":"이중조직의 개념과 이중조직으로서의 학교의 특징 2가지를 각각에 적합한 구체적인 예시와 함께 제시하고, 이의 시사점 1가지를 서술하시오.","ans":"개념: 느슨하게 결합된 측면도 있지만 엄격한 관료제적 특성 또한 지니고 있음\n특징: ① 학교장과 교사는 매우 느슨한 결합구조를 가지고 있음 ⇒ 수업과 관련해 교사는 상당한 자율권을 행사함(이완조직), ② 수업행동에 미치는 많은 관료제적 장치(수업시간 운영, 학습집단 구성, 자원의 활용), 수업을 제외한 많은 학교경영활동(인사관리, 시설관리, 재무관리) ⇒ 엄격한 결합구조를 가짐(관료제적 특성)\n시사점: 지나친 독립성의 보장은 조직의 생산성과 효율성을 떨어뜨릴 수 있고, 엄격한 경직성 또한 교사들의 사기를 떨어뜨려 과업수행의 효과를 감소시킬 수 있음 ⇒ 교육행정가는 이러한 학교의 특성을 이해하고 양자의 순기능을 확보할 수 있는 능력을 갖추어야 함","kw":["느슨하게 결합","엄격한 관료제적 특성","자율권","수업시간 운영","학습집단 구성","인사관리, 시설관리, 재무관리","지나친 독립성","경직성","양자의 순기능"],"id":"haengjeong-e33"},{"ch":"CH02 조직론","t":"전문적 학습공동체 특징·순기능","q":"전문적 학습공동체의 특징 3가지를 이에 따른 순기능 각각 1가지와 함께 제시하시오.","ans":"① 개인적 경험의 공유 및 반성적 대화: 동료교사들과 교육활동에 관한 일상적인 대화를 통해 자신의 교수ㆍ학습 실제에 대해 성찰하는 기회를 가짐 *순기능 ⇒ 교사의 전문성을 신장시키고 실제 교수ㆍ학습의 향상으로 이어질 수 있음\n② 협력적 학습 및 적용: 공동연구를 통해 실천하며 집단 성장을 도모함 *순기능 ⇒ 공동체의식을 높이고 교사공동체를 통해 교사지도성을 함양시킬 수 있음\n③ 비전과 가치의 공유: 구성원 모두가 조직의 방향과 목적에 대한 비전과 가치의 공감대를 형성함 *순기능 ⇒ 협력적인 문화로 개선될 수 있음","kw":["개인적 경험의 공유","반성적 대화","성찰","전문성을 신장","협력적 학습 및 적용","공동연구","공동체의식","교사지도성","비전과 가치의 공유","공감대","협력적인 문화"],"id":"haengjeong-e34"},{"ch":"CH02 조직론","t":"학습조직","q":"학습조직의 특징 2가지와 학습조직의 기본원리 5가지의 명칭을 이것의 개념과 함께 제시하시오.","ans":"특징: ① 개인수준의 학습이 조직수준으로 확장된 형태, ② 구성원의 학습 자발성, 지식 및 학습정보의 공유, 협력적인 학습활동, 새로운 지식의 창출과 활용, 개인과 집단 및 조직 전체가 유기적으로 상호작용하는 체제 강조\n기본원리: ① 개인적 숙련: 개인이 추구하는 지식, 기술, 태도를 형성하기 위하여 개인적 역량을 지속적으로 넓혀가고 심화시키는 행위, ② 정신모델: 주변에서 발생하는 현상들을 이해하는 인식체계. 개인이 무엇을 어떻게 보는지를 결정하고 어떻게 행동할지를 이끄는 인식의 틀, ③ 팀학습: 구성원이 팀을 이루어 학습하는 것. 개인수준 학습을 증진시키고 조직학습을 유도하는 것, ④ 시스템적 사고: 조직에서 일어나는 여러 가지 사건들을 전체적으로 인지하고 이에 포함된 요소들 간의 관계를 순환적 인과관계 또는 역동적 관계로 이해하고 사고하는 접근방식, ⑤ 공유된 비전: 조직이 추구하는 방향이 무엇이며 그것이 왜 중요한지에 대해 모든 구성원들이 공감대를 형성하는 것","kw":["개인수준의 학습","조직수준으로 확장","학습 자발성","유기적으로 상호작용","개인적 숙련","정신모델","인식의 틀","팀학습","시스템적 사고","순환적 인과관계","공유된 비전"],"id":"haengjeong-e35"},{"ch":"CH02 조직론","t":"리커트 관리체제","q":"리커트(Likert)의 관리체제 유형에서 조직풍토를 구분하는 기준과 이 이론의 시사점 1가지를 제시하고, 체제1 유형과 체제4 유형의 명칭을 각각의 특징 3가지와 함께 서술하시오.","ans":"기준: 지도자와 구성원 간의 관계\n시사점: 조직풍토와 조직의 성과는 밀접한 관계를 가지기 때문에 조직의 변화를 위해서는 조직풍토를 조절하는 경영과정이 중요함을 시사함\n체제1 유형: 이기적(착취적)-권위주의적 풍토 *특징 ① 관리자는 구성원에 대해 맥그리거의 X이론을 가정함. 지도자와 구성원 간의 상호신뢰가 적어 서로 지지하지 않는 체제임, ② 과업지향적, 고도로 구조화된 권위적 관리유형임, ③ 구성원들은 공포, 처벌이나 제약에 의해 동기화됨. 통제구조는 최고관리층에 집중됨. 의사결정은 일방적ㆍ하향적으로 이루어짐\n체제4 유형: 참여적 풍토 *특징 ① 관리자는 맥그리거의 Y이론을 가정함. 팀워크, 상호신뢰, 상호작용에 기반을 둔 가장 이상적인 학교풍토임, ② 관리자가 구성원을 온전히 신뢰함. 관리자와 구성원의 관계는 광범위하고 우호적임. 의사결정의 주체는 광범위하게 분담되어 있고 의사소통은 상하좌우로 원활하게 이루어짐, ③ 지지적 지도성, 고도로 동기화된 구성원, 의사결정의 분담, 원활한 의사소통, 원만한 인간관계, 높은 성취목표 등을 특징으로 함, ④ 교사들은 높은 성취목표, 많은 협동심, 공동협력과 배분, 높은 합리성, 호의적인 태도, 높은 성취동기를 보임","kw":["지도자와 구성원 간의 관계","조직풍토를 조절하는 경영과정","이기적(착취적)-권위주의적 풍토","X이론","공포, 처벌","최고관리층에 집중","참여적 풍토","Y이론","팀워크","광범위하게 분담","지지적 지도성","높은 성취목표"],"id":"haengjeong-e36"},{"ch":"CH02 조직론","t":"할핀과 크로프트","q":"할핀(Halpin)과 크로프트(Croft)의 관점에서 개방적 풍토와 통제적 풍토, 친교적 풍토 각각의 개념을 서술하시오.","ans":"개방적 풍토: 목표를 향해 움직이고 학교구성원의 사회적 욕구를 충족시키는 활력 있는 풍토\n통제적 풍토: 과업수행을 강조하고 교사들의 사회적 욕구 충족을 소홀히 하는 풍토\n친교적 풍토: 교장과 교사들 간 우호적인 태도가 형성되고 사회적 욕구는 잘 충족되지만 조직의 목적달성을 위한 집단활동이 부족한 풍토","kw":["목표를 향해 움직이고","사회적 욕구를 충족","활력 있는","과업수행을 강조","소홀히","우호적인 태도","집단활동이 부족"],"id":"haengjeong-e37"},{"ch":"CH02 조직론","t":"호이·미스켈 학교풍토","q":"호이(Hoy)와 미스켈(Miskel)이 측정한 교사행동특성과 교장행동특성 각각 3가지를 제시하고, 학교풍토 유형 4가지의 명칭을 각각의 특징과 함께 서술하시오.","ans":"교사행동특성: 단체적(동료적)-교사 간에 이루어지는 지시적이고 전문적인 상호작용의 정도 / 친밀한-학교 안팎에서 교사 간에 형성된 긴밀한 개인적 관계 정도 / 일탈적-교사 간에 조성된 소외와 격리 정도\n교장행동특성: 지원적-교사에게 진실한 관심을 보이고 지원하는 정도 / 지시적-교사의 개인적 욕구에 전혀 관심을 두지 않는 엄격한 과업지향 / 제한적-교사업무를 수행할 때 장애를 주는 정도\n개방풍토: 교직원 간, 교직원과 학교장 간의 협동, 존경, 신뢰를 바탕으로 학교장은 교사의 제안을 경청하고 전문성을 존중하며, 교사는 일에 대하여 헌신적인 풍토\n몰입풍토: 한쪽에서는 학교장의 통제가 비효과적으로 시도되고, 다른 한쪽에서는 교사의 높은 전문적 업무수행이 이루어지는 풍토\n일탈풍토: 학교장은 개방적이고 관심이 많으며 지원적인 반면, 교사는 학교장을 무시하거나 최악의 경우 태업하거나 무력화하려 하고 교사 간에도 불화하고 편협하며 헌신적이지 않은 풍토\n폐쇄풍토: 학교장은 일상적이거나 불필요한 잡무만을 강조하는 비효과적인 리더십을 엄격하고 통제적으로 나타내는 반면, 교사는 교장과 불화하고 업무에 대한 관심 및 책임감이 없고 헌신적이지 않은 풍토","kw":["단체적(동료적)","친밀한","일탈적","지원적","지시적","제한적","개방풍토","몰입풍토","일탈풍토","폐쇄풍토","태업","잡무만을 강조"],"id":"haengjeong-e38"},{"ch":"CH02 조직론","t":"윌로어","q":"윌로어(Willower)의 관점에서 학교풍토를 구분하는 기준과 이에 따른 두 가지 학교풍토의 명칭, 각각에서 규정하는 학교의 개념과 학생지도방식을 서술하시오.","ans":"기준: 학교에서의 학생 통제방식\n인간주의적 학교: 학교는 학생이 협동적 상호작용과 경험을 통해 배우는 교육공동체 ⇒ 학생지도방식: 엄격한 교사의 통제보다는 스스로의 자제가 중요(민주적 통제방식)\n보호지향적 학교: 학교는 학생과 교사의 지위체계가 잘 정비된 권위적인 조직 ⇒ 학생지도방식: 학생은 무책임하고 훈련되지 않은 존재이므로 엄격한 규율과 체벌로 통제함","kw":["학생 통제방식","인간주의적 학교","협동적 상호작용","교육공동체","스스로의 자제","민주적 통제방식","보호지향적 학교","지위체계","권위적인 조직","엄격한 규율과 체벌"],"id":"haengjeong-e39"},{"ch":"CH02 조직론","t":"맥그리거 X·Y이론","q":"맥그리거(McGregor)에 따를 때, X이론과 Y이론 각각에 따른 인간에 대한 가정과 경영의 초점을 1가지씩 설명하시오.","ans":"X이론: ① 인간은 일하기 싫어하고 지시받기 좋아하며, 책임을 회피하려 하고, 야망이 없고 안전을 원함, ② 적극적 개입이 없으면 조직의 필요에 대하여 저항하거나 수동적이 됨 *경영의 초점: 외적 통제\nY이론: ① 인간은 본질적으로 수동적이거나 게으르지 않고, 무책임하지 않으며, 조직의 필요에 저항하지도 않음, ② 인간은 일에 대한 동기와 잠재력, 책임감, 목표성취 의지 등을 가짐 *경영의 초점: 자율적 통제와 자기지향","kw":["일하기 싫어하고","책임을 회피","야망이 없고","외적 통제","수동적이거나 게으르지 않고","동기와 잠재력","자율적 통제와 자기지향"],"id":"haengjeong-e40"},{"ch":"CH02 조직론","t":"아지리스","q":"아지리스(Argyris)의 이론에 따를 때 미성숙한 조직과 성숙한 조직의 특성 각각 3가지와 이 이론의 시사점 1가지를 서술하시오.","ans":"미성숙조직: ① X이론에 근거하면서 관료적 가치체계를 따르는 조직, ② 인간을 부정적이고 미성숙한 존재로 여겨 의심 많은 인간관계가 형성되어 대인관계 능력을 저하시키고 집단 간 갈등을 야기함, ③ 조직의 문제해결력이 저하됨\n성숙조직: ① Y이론에 근거하면서 인간적 가치체제를 따르는 조직, ② 인간을 긍정적이고 성숙한 존재로 여겨 신뢰하는 인간관계를 형성하고 집단 간 협동 및 융통성을 향상시킴, ③ 조직의 효과성이 증대됨\n시사점: 조직관리자는 구성원을 성숙한 인간으로 대하고 성숙한 문화풍토를 조성하도록 해야 함. 즉, 구성원에게 자율성을 부여하고 신뢰하며, 직장 내에서 전문성을 기르고 성숙하는 기회를 제공할 때 구성원의 자아실현욕구가 충족되고 조직의 목표도 달성할 수 있음","kw":["X이론","관료적 가치체계","의심 많은 인간관계","문제해결력이 저하","Y이론","인간적 가치체제","신뢰하는 인간관계","효과성이 증대","자율성을 부여","자아실현욕구"],"id":"haengjeong-e41"},{"ch":"CH02 조직론","t":"세시아와 글리노우","q":"세시아(Sethia)와 글리노우(Glinow)의 조직문화를 구분하는 기준 2가지와 이에 따른 조직문화의 유형 4가지의 명칭을 각각의 특징과 주요가치 1가지와 함께 제시하시오.","ans":"조직문화 구분기준: ① 인간에 대한 관심: 조직이 구성원의 만족과 복지를 위해 노력하는 것, ② 성과에 대한 관심: 구성원이 최선을 다해 직무를 수행하도록 하려는 조직의 기대\n보호문화: 구성원이 조직관리자에게 순응할 준비가 되어 있음. 구성원의 충성심과 애정으로 생존ㆍ번창함 ⇒ 주요가치: 팀워크, 협동, 동조, 상사에 대한 복종 등\n냉담문화: 특별한 상황과 환경에 의해 보호를 받지 못하면 생존할 수 없음. 효과성과 능률성에 대한 관심보다 기득권과 이해관계에 의해 운영됨 ⇒ 주요가치: 음모, 파당, 분열, 불신, 불확실 혼란 등\n실적문화: 인간은 소모품으로 간주됨. 개인의 성과가 높을 때만 보상을 제공함 ⇒ 주요가치: 성공, 경쟁, 모험, 혁신, 적극성 등\n통합문화: 인간에 대한 관심이 온정적인 것이 아니라 인간의 존엄성을 바탕으로 한 진지한 관심임. 구성원에게 모든 것을 할 수 있도록 자유를 허용하는 것을 기본원칙으로 함 ⇒ 주요가치: 협동, 창의성, 모험, 자율 등","kw":["인간에 대한 관심","성과에 대한 관심","보호문화","충성심과 애정","복종","냉담문화","기득권과 이해관계","음모, 파당","실적문화","소모품","통합문화","인간의 존엄성","자유를 허용"],"id":"haengjeong-e42"},{"ch":"CH02 조직론","t":"스타인호프와 오웬스","q":"스타인호프(Steinhoff)와 오웬스(Owens)의 학교문화유형에 따를 때, 학교문화의 유형 4가지의 명칭을 이러한 문화유형의 특징 1가지와 함께 제시하시오.","ans":"가족문화: 구성원은 의무를 넘어 서로에 대한 관심을 가지고 가족의 일부로서 제 몫을 다할 것을 요구받음. 학교는 애정 어리고 우정적ㆍ협동적ㆍ보호적임\n기계문화: 모든 관계를 기계적으로 파악함. 학교의 원동력은 조직 자체의 구조에서 나오고, 학교는 목표달성을 위하여 교사를 이용하는 일종의 기계에 해당함\n공연문화: 공연뿐만 아니라 청중의 반응이 중요함. 교장의 훌륭한 지도 아래 탁월하고 멋진 가르침을 추구하는 문화\n공포문화: 학교를 밀폐된 상자 또는 형무소라고 표현함. 교사는 고립된 생활을 하고 사회적 활동이 거의 없으며, 구성원끼리 서로 비난하고 적의를 가짐","kw":["가족문화","의무를 넘어","애정 어리고","기계문화","조직 자체의 구조","일종의 기계","공연문화","청중의 반응","공포문화","밀폐된 상자","형무소","고립된 생활"],"id":"haengjeong-e43"},{"ch":"CH02 조직론","t":"하그리브스","q":"하그리브스(Hargreaves)의 학교문화유형론에 따를 때, 학교문화를 구분하는 차원 2가지와 5가지 학교문화 유형의 명칭을 각각의 특징 2가지와 함께 제시하시오.","ans":"구분하는 차원: 도구적 차원(사회적 통제), 표현적 차원(사회적 응집)\n형식적 학교문화(도구적 차원↑, 표현적 차원↓) ⇒ 학생이 학습목표를 달성하도록 과도한 압력을 가하지만, 교사와 학생 간 응집력이 약함. 학교생활은 교수ㆍ학습과 관련하여 질서화ㆍ계획화되어 있는 모습\n복지주의자 학교문화(도구적 차원↓, 표현적 차원↑) ⇒ 관대, 태평, 편안한 분위기로 비형식적이고 친구 같은 교사-학생 관계 강조. 강한 보살핌이 중시되는 학교가 이런 유형에 해당함\n온실 학교문화(도구적 차원↑, 표현적 차원↑) ⇒ 학교구성원의 적극적 참여를 요구하며, 일과 자기계발에 대한 압력이 강함. 교사들은 교육의 실험자 또는 개혁자로서 정열적이고 헌신적임. 학교 내 친밀함의 확산 속에서 구성원은 감시와 통제하에 있음\n생존주의자 학교문화(도구적 차원↓, 표현적 차원↓) ⇒ 불안, 낙망, 사기저하 등이 나타나며, 교사-학생 간의 관계가 친밀하지 않고 제대로 된 교육이 이루어지지 않음. 이러한 유형의 학교는 붕괴의 처지에 놓이게 됨\n효과적 학교문화(도구적ㆍ표현적 차원 적절함) ⇒ 구성원의 일과 행동에 대한 기대가 높으며, 이들의 노력에 대하여 학교는 지원적임. 가장 이상적인 모습으로 묘사되는 학교유형","kw":["도구적 차원","사회적 통제","표현적 차원","사회적 응집","형식적 학교문화","과도한 압력","복지주의자 학교문화","강한 보살핌","온실 학교문화","감시와 통제","생존주의자 학교문화","붕괴의 처지","효과적 학교문화","지원적"],"id":"haengjeong-e44"},{"ch":"CH02 조직론","t":"순기능적·역기능적 갈등","q":"순기능적 갈등과 역기능적 갈등이 조직에 미치는 영향 각각 2가지를 서술하시오.","ans":"순기능적 갈등: ① 조직의 생존과 성공에 필요한 쇄신적 변동을 유발하는 원동력이 됨, ② 적정수준 자극 제공으로 조직이 자원배분 등을 자율적으로 조정함, ③ 행동주체의 정체성 인식을 돕고 자기반성의 기회를 제공함, ④ 행동주체가 정체된 사고방식에서 벗어나 능동적으로 행동하고 성장할 수 있는 기회를 제공함, ⑤ 순기능적 갈등의 존재는 창조와 성장, 민주주의의 다양성, 자기실현 등을 반영함\n역기능적 갈등: ① 조직구성원의 협력적 노력을 좌절시킴, ② 조직구성원의 사기를 떨어뜨리고 낭비를 초래함, ③ 이러한 갈등이 심해지는 경우 조직이 와해될 수도 있음","kw":["쇄신적 변동","원동력","적정수준 자극","자율적으로 조정","정체성 인식","자기반성의 기회","창조와 성장","협력적 노력을 좌절","사기를 떨어뜨리고","와해"],"id":"haengjeong-e45"},{"ch":"CH02 조직론","t":"토마스와 제미슨","q":"토마스(Thomas)와 제미슨(Jamieson)의 관점에서 갈등관리전략의 분류기준 2가지의 명칭을 이의 개념과 함께 제시하고, 제안한 갈등관리전략 5가지 각각의 명칭을 이러한 전략이 효과적인 상황 2가지와 함께 서술하시오.","ans":"기준: ① 협조성(협동성): 한쪽 당사자가 타인의 욕구(이익)를 충족시키려는 정도, ② 독단성(적극성): 자신의 욕구(이익)를 충족시키려는 정도\n협력: 목표가 학습하는 것일 경우 / 합의와 헌신이 중요한 경우\n경쟁: 신속한 결정이 필요한 긴급상황 / 조직의 성장에 매우 중요한 문제인 경우\n회피: 다른 사람의 관심을 이해할 시간적 여유가 없는 경우 / 다른 문제가 해결되면 해당 문제가 자연스럽게 해결될 수 있는 경우\n수용(동조): 자기가 잘못한 것을 알아차린 경우 / 보다 중요한 문제를 위하여 좋은 관계를 유지해야 하는 경우\n타협: 복잡한 문제에 대하여 일시적인 해결책을 얻고자 하는 경우 / 시간이 부족하여 신속한 행동이 요구되는 경우","kw":["협조성","타인의 욕구","독단성","자신의 욕구","협력","합의와 헌신","경쟁","긴급상황","회피","시간적 여유가 없는","수용","잘못한 것을 알아차린","타협","일시적인 해결책"],"id":"haengjeong-e46"},{"ch":"CH02 조직론","t":"갈등조성·해소전략","q":"갈등조성과 갈등해소를 위한 전략 각각 2가지를 서술하시오.","ans":"갈등조성전략: ① 의사전달 통로의 변경: 특정한 의사전달 통로에 통상적으로 포함되던 사람을 일부러 제외하거나 본래 포함되지 않았던 사람을 새로 포함시키는 방법, ② 정보전달 억제 또는 정보과다 조성: 정보전달을 억제하거나 정보과다 현상이 나타나도록 하여 조직구성원이 모든 의사전달을 무비판적으로 받아들이는 무관심 상태를 타파함, ③ 구조적 분화: 조직 내의 계층 수, 기능적 조직단위의 수를 늘려 서로 견제의 역할을 수행하게 함으로써 갈등을 조성함, ④ 구성원의 태도 변화: 조직구성원의 태도 변화를 통해 간접적으로 갈등을 조성함\n갈등해소전략: ① 문제해결: 갈등을 일으키고 있는 당사자들이 직접 접촉하여 갈등의 원인이 되는 문제를 공동으로 해결하게 하는 방법, ② 상위목표 제시: 갈등을 일으키고 있는 당사자들이 공동으로 추구해야 할 상위목표를 제시함으로써 갈등관계에 있는 행동의 주체가 모두 목표를 위해 협력하도록 독려함, ③ 회피: 단기적으로 갈등을 회피하는 방법. 갈등을 야기할 수 있는 의사결정을 보류 또는 회피하거나 갈등상황에 처한 당사자들이 접촉을 피하도록 하는 것 또는 갈등행동을 억압하는 것, ④ 완화 또는 수용: 갈등 당사자들의 차이점을 호도하고 유사점이나 공동의 이익을 강조함으로써 갈등을 해소하는 방법","kw":["의사전달 통로의 변경","정보과다 조성","무관심 상태를 타파","구조적 분화","견제","구성원의 태도 변화","문제해결","직접 접촉","상위목표 제시","회피","완화 또는 수용","유사점이나 공동의 이익"],"id":"haengjeong-e47"},{"ch":"CH02 조직론","t":"과업평가검토기법","q":"과업평가검토기법(PERT)의 개념과 효과 2가지를 서술하시오.","ans":"개념: 과업의 수행과정을 도표화하여 과업을 합리적ㆍ체계적으로 수행하는 방법\n효과: ① 세부 작업활동의 순서 및 상호관계를 유기적으로 파악할 수 있어 계획을 신중하고 체계적으로 수립할 수 있고 계획을 신속하게 분석ㆍ평가할 수 있음, ② 작업과정을 파악하기가 용이해 작업추진상의 어려운 점을 사전에 파악하여 이에 따라 인적ㆍ물적 자원을 효과적으로 활용할 수 있음, ③ 작업과정 작성을 위해 모든 조직구성원이 참여한다는 점에서 구성원의 참여의식이 높아지고 협조를 이끌어내기 용이함","kw":["수행과정을 도표화","합리적ㆍ체계적","세부 작업활동의 순서","유기적으로 파악","사전에 파악","인적ㆍ물적 자원","참여의식"],"id":"haengjeong-e48"},{"ch":"CH02 조직론","t":"목표관리기법","q":"목표관리기법(MBO)의 개념과 특징 2가지, 이의 효과 2가지와 한계점 2가지를 서술하시오.","ans":"개념: 활동목표를 명료화ㆍ체계화함으로써 관리의 효율화를 기하려는 관리기법\n특징: ① 구성원을 목표설정에 참여시켜 각자의 목표를 공동목표에 일치시키고 내면화하는 과정이 강조됨, ② 명확한 목표의 설정, 책임한계의 규정, 구성원의 참여와 협조, 원활한 의사소통과 참여를 통한 의사결정, 업적평가 및 환류과정을 통해 관리계획을 개선하고 구성원의 동기유발과 조직의 효율성을 증진시킴\n효과: ① 모든 학교교육활동을 학교교육목표에 집중시켜 교육의 효율성을 제고시킬 수 있음, ② 모든 교사들이 함께 참여해 목표를 설정, 활동계획 수립을 통해 교직원들의 참여의식을 높이고 인력자원 활용의 효율성을 도모할 수 있음, ③ 목표와 책임에 대한 명료한 설정으로 교직원의 역할갈등을 해소하고, 학교관리의 문제나 장애를 조기에 발견 및 치유할 수 있음, ④ 수시로 피드백 과정을 거쳐 활동의 과정과 결과에 대해 평가할 수 있음, ⑤ 학교운영의 분권화와 참여관리를 통하여 학교의 관료화를 방지하고 교직의 전문성을 살릴 수 있음\n한계점: ① 목표에 대한 지나친 중시와 단기적ㆍ구체적 목표에 대한 강조 때문에 과정을 중시하고 장기적ㆍ전인적 목표를 내세우는 학교교육활동에는 부적합한 측면이 있음, ② 목표설정과 성과보고 등은 많은 노력과 시간을 필요로 한다는 점에서 교직원의 잡무부담 가중과 불만의 원인이 되기 쉬움, ③ 측정 가능하고 계량적인 교육목표의 설정과 평가 때문에 학교교육을 오도할 가능성이 있음","kw":["활동목표를 명료화ㆍ체계화","관리의 효율화","목표설정에 참여","공동목표에 일치","내면화","업적평가 및 환류","역할갈등을 해소","분권화와 참여관리","단기적ㆍ구체적 목표","잡무부담 가중","계량적인 교육목표","오도"],"id":"haengjeong-e49"},{"ch":"CH02 조직론","t":"정보관리체제·총체적 질관리","q":"정보관리체제(MIS)의 개념과 총체적 질관리(TQM)의 개념을 서술하시오.","ans":"정보관리체제: 의사결정자가 합리적인 결정을 내릴 수 있도록 필요한 정보를 적시에 신속하고 정확하게 제공하는 체제. 단순한 사무관리 차원을 넘어서 정보의 수집, 저장, 처리, 전달 등과 관련된 인간, 도구, 방법의 통합적인 관리망\n총체적 질관리: 고객만족과 관리개선을 위해 고객지향적인 서비스 품질에 초점을 두고 전 직원의 참여를 통하여 지속적으로 서비스를 개선해 나가는 통합관리체계. 제품이나 서비스의 품질뿐 아니라 경영과 업무, 직장환경, 조직구성원의 자질까지도 품질 개념에 넣어 관리해야 한다고 주장","kw":["적시에 신속하고 정확하게","사무관리 차원을 넘어서","통합적인 관리망","고객만족","고객지향적인 서비스 품질","전 직원의 참여","통합관리체계","직장환경","조직구성원의 자질"],"id":"haengjeong-e50"},{"ch":"CH02 조직론","t":"조직개발기법","q":"조직개발(발전)기법의 개념과 특징 2가지, 대표적 기법 2가지를 서술하시오.","ans":"개념: 사람 또는 조직문화 중심의 변화전략으로 조직구성원의 잠재력을 최대한 개발하고 행태를 개선함으로써 조직 전체의 개혁을 이루려는 조직혁신의 접근방법을 의미함\n특징: ① 조직이 환경변화에 대응하기 위한 노력: 조직이 새로운 기술, 도전에 보다 잘 적응할 수 있도록 구성원의 신념, 태도, 가치관 및 조직구조를 변화시키고자 하는 노력, ② 변화를 위한 계획된 노력: 조직의 체계적 진단, 개선을 위한 전략적 계획 수립, 이를 위한 자원의 동원 등을 포함하는 계획된 노력, ③ 전체 조직의 변화를 위한 노력: 조직문화 또는 분위기, 구성원의 가치관 등의 변화, 보수체제의 변화 등 조직 전체에 걸쳐 행해짐, ④ 최고관리층으로부터 시작: 조직의 최고관리층은 조직발전의 과정과 그 결과에 대해 최종 책임을 지고 있기 때문에 조직발전 사업에 적극적으로 참여하고 헌신함, ⑤ 효율성과 건전성 증진: 조직의 효율성에는 환경의 변화에 적절히 적응하고 대처할 수 있는 자기혁신이 포함되고, 조직의 건전성에는 임무의 완수, 내적인 통합, 혁신의 의욕, 발전적 가치체계 등이 포함됨, ⑥ 행태과학적 지식 활용: 조직진단에 있어 행태과학에서 다루는 개인의 동기, 의사전달, 문화적 규범, 인간관계, 집단관계, 갈등의 관리 등에 관한 지식이 사용되고, 이에 의해 전략을 세우게 됨\n기법: ① 감수성 훈련: 참가자들이 소집단을 구성해 집단 내에서 다양한 갈등, 조화, 지도성, 상호작용을 경험하는 훈련 ⇒ 인간관계 능력 개선, ② 팀빌딩: 팀원들의 작업 및 커뮤니케이션 능력, 문제해결 능력을 향상시켜 조직효율을 높이려는 조직개발기법","kw":["조직문화 중심의 변화전략","잠재력을 최대한 개발","행태를 개선","조직혁신","계획된 노력","최고관리층으로부터 시작","효율성과 건전성","행태과학적 지식","감수성 훈련","팀빌딩"],"id":"haengjeong-e51"},{"ch":"CH03 동기이론","t":"매슬로우 결핍·성장욕구","q":"매슬로우(Maslow)의 욕구체계이론에 따를 때, 결핍욕구와 성장욕구 각각의 특징 2가지와 각각의 구체적인 예시 3가지를 서술하시오.","ans":"결핍욕구: ① 충족되면 더 이상 욕구로 작동하지 않으며 완전한 충족이 가능함, ② 만족의 대상으로 외부로부터 오는 타율적 충족을 추구함, ③ 하위 4개 욕구 ⇒ 생리적 욕구, 안전의 욕구, 소속의 욕구(애정과 공감의 욕구), 자존(존경)의 욕구\n성장욕구: ① 결핍욕구가 충족되어야만 발현되는 욕구. 완전한 충족이 불가능하고 계속적으로 추구함, ② 만족의 대상이 자기 자신인 자율적 충족을 요구함, ③ 하위 3개 욕구 ⇒ 지적 욕구, 심미적 욕구, 자아실현의 욕구\n[욕구별 예시] 생리적 욕구 → 배고픔, 갈증, 배설, 수면 / 안전의 욕구 → 신분보장, 직업안정성, 연금제도 / 소속ㆍ애정의 욕구 → 타인과의 접촉, 모임, 사랑 / 자존의 욕구 → 인정, 명예, 지위, 자아존중감, 자기효능감 / 지적 욕구 → 새로운 것을 알고 이해하고자 함 / 심미적 욕구 → 아름다움, 질서, 조화, 완성","kw":["완전한 충족이 가능","타율적 충족","생리적 욕구","안전의 욕구","소속의 욕구","자존(존경)의 욕구","완전한 충족이 불가능","자율적 충족","지적 욕구","심미적 욕구","자아실현의 욕구"],"id":"haengjeong-e52"},{"ch":"CH03 동기이론","t":"허즈버그 동기·위생요인","q":"허즈버그(Herzberg)의 동기-위생이론에서 동기요인과 위생요인의 관계를 서술하고, 동기요인과 위생요인 각각의 특징 2가지를 서술하시오.","ans":"동기요인과 위생요인의 관계: 동기(만족)요인이 존재할 경우 만족하겠지만 부재상태라고 해서 불만족하지 않으며, 위생(불만족)요인이 충족되지 않을 경우 불만을 갖게 되지만 충족된다고 해도 만족에는 크게 기여하지 못함\n동기요인(만족요인) 특징: 직무 그 자체에서 도출된 내용적ㆍ내적ㆍ심리적인 것에 직접적 관련됨. 사람들은 일을 하는 과정에서 성취감이나 책임감, 발전하고 있다는 느낌을 갖도록 설계하고, 일의 목표나 수행방식 등을 스스로 결정하도록 자유재량권을 주면 만족을 느낌. 충족되지 않아도 불만은 없지만, 일단 충족하게 되면 직무태도와 직무만족에 긍정적 영향을 줄 수 있음. 매슬로우가 말한 욕구계층 중 상위욕구와 일치\n위생요인(불만족요인) 특징: 작업환경에서 도출된 상황적ㆍ외적ㆍ물리적인 것에 직접적 관련. 직무를 수행하는 환경과 관련된 요인. 회사의 정책과 행정, 감독, 임금, 대인관계, 작업조건 등. 위생요인은 그것의 충족이 단지 직무에 대한 불만족의 감소만을 가져올 뿐 직무만족으로 이어지지는 않음(매슬로우의 욕구체계이론과의 차이점. 매슬로우는 생리적 욕구가 충족되면 안전의 욕구가 자동적으로 나타난다고 한 반면, 허즈버그는 위생요인이 충족되면 불만족요인이 줄어들 뿐이지 만족요인은 나타나지 않는다고 하였음). 매슬로우가 말한 욕구계층 중 하위욕구와 일치","kw":["부재상태라고 해서 불만족하지 않으며","만족에는 크게 기여하지 못함","내용적ㆍ내적ㆍ심리적","성취감이나 책임감","자유재량권","상위욕구","상황적ㆍ외적ㆍ물리적","정책과 행정, 감독, 임금","불만족의 감소만","하위욕구"],"id":"haengjeong-e53"},{"ch":"CH03 동기이론","t":"허즈버그 시사점·직무동기 방안","q":"허즈버그(Herzberg)의 동기-위생이론의 시사점 1가지와 이에 따라 교사의 직무동기를 높이는 구체적인 방안 3가지를 설명하시오.","ans":"시사점: 학교조직 내에서 교사의 동기요인을 충족할 수 있도록 노력해야 함을 시사함\n방안: ① 직무풍요화: 직무수행에 다양한 작업내용이 포함되고 보다 높은 수준의 지식과 기술을 필요로 함. 작업자에게 자신의 성과를 계획ㆍ지휘ㆍ통제할 수 있는 자율성과 책임을 많이 부여. 개인적 성장과 의미 있는 작업경험에 대한 기회가 제공될 수 있게끔 직무의 내용을 재편성함, ② 직무특성이론: 직무에 내재된 특성(기술다양성, 과업정체성, 과업중요성, 자율성, 피드백)이 구성원의 심리상태를 변화시키고 이러한 심리상태가 개인의 직무동기와 만족, 직무효과까지 높여줌, ③ 경력단계프로그램: 교사의 자격과 단계를 보다 세분화하여 지속적으로 새로운 지식과 기술, 전문성을 계발할 수 있는 기회와 보상을 제공하고 직무의 다양성과 책임을 증가시켜 궁극적으로 교직의 보람과 만족을 경험하게 하려는 것(ex. 수석교사제)","kw":["동기요인을 충족","직무풍요화","자율성과 책임","직무의 내용을 재편성","직무특성이론","기술다양성, 과업정체성, 과업중요성","경력단계프로그램","자격과 단계를 세분화","수석교사제"],"id":"haengjeong-e54"},{"ch":"CH03 동기이론","t":"앨더퍼 ERG","q":"앨더퍼(Alderfer)의 관점에서 인간의 욕구 3단계 각각의 명칭, 그에 적합한 개념과 충족방법 1가지를 제시하고, 매슬로우(Maslow) 이론과의 차이점 2가지를 서술하시오.","ans":"생존욕구: 인간이 생존을 위해 필요로 하는 욕구 *충족방법 ⇒ 보수, 작업환경, 직업안정, 근무조건, 연금제도, 복리후생, 근무환경 개선\n관계욕구: 인간이 사회적 존재로서 타인과 인간관계를 맺고자 하는 욕구 *충족방법 ⇒ 교사 간 비공식조직 모임 활성화, 전문적 학습공동체 지원, 동료교사 및 교장ㆍ교감과의 소통기회 마련\n성장욕구: 인간이 성장ㆍ발전하고 잠재력을 최대한으로 발휘하고자 하는 내적 욕구 *충족방법 ⇒ 교사 전문성 함양을 위한 연수, 교사 훈련프로그램 지원, 다양한 자율장학, 직업에 대한 자긍심 함양 기회, 직무풍요화\n매슬로우 이론과의 차이점: ① 하위단계의 욕구가 만족되어야 다음 단계의 욕구가 발생한다고 보는 매슬로우의 이론과 달리 여러 가지 욕구를 동시에 경험할 수 있음, ② 매슬로우의 이론과는 달리 하위단계의 욕구가 충족되지 않더라도 상위단계의 욕구가 발생할 수 있음","kw":["생존욕구","보수, 작업환경, 직업안정","관계욕구","비공식조직 모임 활성화","전문적 학습공동체","성장욕구","잠재력을 최대한","자율장학","동시에 경험","하위단계의 욕구가 충족되지 않더라도"],"id":"haengjeong-e55"},{"ch":"CH03 동기이론","t":"브룸 기대이론","q":"브룸(Vroom)의 기대이론에서 유인가, 성과, 성과기대, 보상기대 각각의 개념을 제시하고, 이 이론의 관점에서 동기를 부여하는 방안 2가지를 서술하시오.","ans":"유인가(목표매력성): 보상에 대해 가지는 매력 또는 인지적 가치\n성과: 행위를 하고 나서 얻을 수 있는 결과 ∙1차 수준의 성과: 사람이 어떤 일을 해서 직접적으로 또는 즉시 얻어진 결과(직무성, 생산성, 노동이동 등) ∙2차 수준의 성과: 1차 수준의 성과가 가져올 보상(금전, 승진, 휴가, 인정 등)\n성과기대(기대감, 노력과 성과의 연계): 과업에 관련된 노력이 어떠한 수준의 성과를 가져올 것인가에 대한 신념의 강도\n보상기대(수단성, 성과와 보상의 연계): 좋은 과업수행은 주목을 받고 또 보상을 받을 것이라고 지각된 확률\n동기부여방안: ① 높은 성과기대: 노력하면 성과를 얻을 수 있다는 믿음을 주어야 함, ② 높은 보상기대: 높은 성과가 보상으로 이어질 수 있다는 보상기대를 갖게 하며 보상에 대해 구체적으로 제안해야 함, ③ 높은 유인가: 보상의 매력도를 높이고자 구성원들이 원하는 보상내용을 파악하고 이를 활용해야 함","kw":["유인가","목표매력성","인지적 가치","1차 수준의 성과","2차 수준의 성과","성과기대","신념의 강도","보상기대","수단성","지각된 확률","보상의 매력도"],"id":"haengjeong-e56"},{"ch":"CH03 동기이론","t":"포터와 로울러","q":"포터(Porter)와 로울러(Lawler)의 성취-만족이론의 특징 3가지를 서술하시오.","ans":"① 피고용자의 능력 및 특성과 역할지각이 성과에 영향을 미침\n② 성과(성취)의 수준은 내적 보상이나 외적 보상을 가져옴\n③ 개인은 실제로 받은 보상이 얼마나 공정(정당)한가(지각된 공정한 보상)를 측정하고, 그 결과는 피고용자가 경험하는 만족의 수준으로 나타남\n④ 직무수행에 대한 노력은 보상에 부여하는 가치, 어떤 노력이 보상을 가져다줄 것인가에 대한 기대에 의해 좌우됨\n⑤ 노력에 의한 직무성취는 개인에게 만족을 주는데, 이때 만족은 그에 결부된 내재적 및 외재적 보상에 의하여 강화됨\n⑥ 내적ㆍ외적 보상이 있더라도 그것이 불공정하다고 지각되면 개인에게 만족을 줄 수 없음","kw":["능력 및 특성","역할지각","내적 보상이나 외적 보상","지각된 공정한 보상","만족의 수준","보상에 부여하는 가치","내재적 및 외재적 보상","불공정하다고 지각되면"],"id":"haengjeong-e57"},{"ch":"CH03 동기이론","t":"아담스 공정성이론","q":"아담스(Adams)의 관점에서 공정성의 개념을 제시하고, 사람들이 불공정하다고 느낄 때 긴장을 감소시키고 공정성을 회복하기 위해 선택하는 행동 6가지를 설명하며, 공정성을 회복하기 위한 이 이론의 시사점 2가지를 서술하시오.","ans":"공정성: 자신이 수행한 일로 받은 성과와 이를 얻기 위해 자신이 투자한 투입에 대한 특정한 신념. 자신의 투입-성과의 비율을 타인의 투입-성과의 비율과 비교하여 동등할 때 공정한 대우를 받고 있다고 느끼고 직무에 대해 만족함\n공정성 회복을 위한 행동: ① 투입 조정(투입의 변경), ② 성과 조정(결과의 변경), ③ 투입과 성과에 대한 인지적 왜곡, ④ 비교대상의 투입과 성과의 변경(비교대상의 투입과 성과에 대한 영향력 행사), ⑤ 비교대상의 변경, ⑥ 조직이탈(퇴직)\n시사점: ① 학교경영자는 조직에서의 사회적 비교과정에 주의를 기울여 교사를 공정하게 대우하도록 노력해야 함, ② 학교경영자는 교사의 동기유발 시 지각의 중요성을 인식하고 공정한 조직문화풍토를 구축해야 함, ③ 공정성 또는 불공정성에 관한 판단은 개인적인 차원에서만 이루어지는 것은 아니며, 조직 내ㆍ외의 다른 작업자와의 비교가 포함된다는 점을 유의해야 함","kw":["투입-성과의 비율","비교하여 동등할 때","투입 조정","성과 조정","인지적 왜곡","비교대상의 변경","조직이탈","사회적 비교과정","지각의 중요성","공정한 조직문화풍토"],"id":"haengjeong-e58"},{"ch":"CH03 동기이론","t":"로크 목표설정이론","q":"로크(Locke)의 관점에서 인간의 행동을 결정하는 인지적 요인 2가지와 목표의 기능 2가지를 제시하고, 스티어스(Steers)가 제시한 좋은 목표의 특징 3가지를 서술하시오.","ans":"인간의 행동을 결정하는 인지적 요인: 가치관, 목표\n목표의 기능: ① 개인의 동기와 과업에 대한 주의력을 증진시켜 과업수행을 높이는 결정적인 동인, ② 개인이 행동에 투입하는 노력과 지속성을 증대시킴, ③ 과업을 수행하는 방법을 효율화함으로써 동기와 과업수행력을 증진시키는 기제가 됨\n좋은 목표의 특징: ① 목표의 구체성, ② 목표의 곤란성, ③ 목표설정에의 참여, ④ 노력에 대한 피드백, ⑤ 목표달성에 대한 동료들 간의 경쟁, ⑥ 목표의 수용성","kw":["가치관","목표","주의력을 증진","결정적인 동인","노력과 지속성","효율화","목표의 구체성","목표의 곤란성","목표설정에의 참여","피드백","동료들 간의 경쟁","목표의 수용성"],"id":"haengjeong-e59"},{"ch":"CH04 지도성이론","t":"피들러 상황적합이론","q":"피들러(Fiedler)의 이론에서 상황을 결정하는 3가지 요인의 명칭과 개념을 제시하고, 과업지향형 지도자와 관계지향형 지도자가 효과적인 구체적인 각각의 상황 2가지를 상황의 호의성 관점에서 설명하시오.","ans":"상황결정요인: ① 지도자-구성원 관계: 지도자와 구성원 간 관계의 질 => 구성원에 대한 지도자의 신뢰나 지도자에 대한 구성원의 존경도 등, ② 과업구조: 과업의 특성 => 명확하게 규정되고 수행방법이 체계화되어 있으면 구조화, 그렇지 않으면 비구조화되었다고 함, ③ 지도자의 지위권력: 지도자가 합법적ㆍ보상적ㆍ강압적인 권력을 가지고 구성원의 행위에 영향을 줄 수 있는 능력을 소유한 정도\n① 과업지향형 지도자는 지도자의 영향력이 대단히 크거나 작은 극단적인 상황에서 가장 효과적임\n② 관계지향형 지도자는 지도자의 영향력이 중간 정도인 상황에서 가장 효과적임","kw":["지도자-구성원 관계","관계의 질","신뢰","존경도","과업구조","구조화","비구조화","지위권력","합법적ㆍ보상적ㆍ강압적","극단적인 상황","중간 정도인 상황"],"id":"haengjeong-e60"},{"ch":"CH04 지도성이론","t":"하우스 행로-목표이론","q":"하우스(House)의 행로-목표이론의 관점에서 지도자의 행위 5가지와 상황적 요인 2가지를 서술하시오.","ans":"지도자의 행위: ① 명료화 행동: 과업의 수행목적, 이행수단, 수행기준, 타인의 기대, 상벌 등의 명료화를 통해 구성원의 욕구와 선호를 효과적인 수행과 결부되도록 함, ② 성취지향적 행동: 구성원에게 도전적인 목표를 설정해 주고, 개선을 추구하며, 구성원이 높은 수준의 성취목표를 가지도록 자신감을 심어주는 행동을 함, ③ 지원적 행동: 구성원의 복지에 관심을 가지며, 친절하고 지원적인 직무환경을 조성하고, 구성원의 욕구와 선호를 배려하고 지원함, ④ 가치중심적 행동: 구성원이 소중히 생각하는 가치에 호소하고, 자기효능감과 언행일치 행동을 증대시키며, 자신의 가치기준을 지도자의 비전과 집단의 목적에 기여하는 데 두도록 유도함, ⑤ 참여적 행동: 일에 관련된 문제에 관해 구성원과 상담하고, 그들의 의견을 구하며, 의사결정에서 구성원의 아이디어를 활용하려고 노력함\n상황적 요인: ① 구성원의 개인적 특성: 능력, 인성, 욕구, 동기 등, ② 직무환경의 특성: 과업성격, 집단특성, 권위체제","kw":["명료화 행동","수행목적, 이행수단, 수행기준","성취지향적 행동","도전적인 목표","지원적 행동","복지에 관심","가치중심적 행동","자기효능감","언행일치","참여적 행동","구성원의 개인적 특성","직무환경의 특성"],"id":"haengjeong-e61"},{"ch":"CH04 지도성이론","t":"허쉬와 블랜차드 행동유형","q":"허쉬(Hersey)와 블랜차드(Blanchard)의 관점에서 지도자의 행동유형 2가지와 지도자 행동의 효과성에 영향을 주는 요인 2가지를 설명하시오.","ans":"지도자의 행동유형: ① 과업중심행동: 지도자는 부하직원에게 무슨 과업을 언제, 어떻게 수행해야 할 것인가를 지시 ⇒ 일방적 의사소통, ② 관계중심행동: 지도자는 사회ㆍ정서적인 지원, 즉 '심리적 위로'를 제공하고 일을 촉진시키는 행동을 함 ⇒ 쌍방적 의사소통\n지도자 행동의 효과성에 영향을 주는 요인 - 구성원의 성숙도: ① 직무성숙도(능력): 교육과 경험에 의해 영향을 받게 되는 개인적 직무수행능력, ② 심리적 성숙도(동기): 성취욕구와 책임을 지려는 의지를 반영한 개인적 동기수준","kw":["과업중심행동","일방적 의사소통","관계중심행동","심리적 위로","쌍방적 의사소통","구성원의 성숙도","직무성숙도","심리적 성숙도","성취욕구"],"id":"haengjeong-e62"},{"ch":"CH04 지도성이론","t":"상황적 지도성 4유형","q":"허쉬(Hersey)와 블랜차드(Blanchard)의 관점에서 상황적 지도성의 유형 4가지의 명칭을 각각이 효과적인 상황과 함께 제시하시오.","ans":"① 위임형: 능력과 동기 모두 높은 경우(능력↑, 동기↑)\n② 지원형(참여적): 능력은 높으나 동기가 낮은 경우(능력↑, 동기↓)\n③ 지도형(설득적): 능력은 낮으나 동기가 높은 경우(능력↓, 동기↑)\n④ 지시형: 능력과 동기 모두 낮은 경우(능력↓, 동기↓)","kw":["위임형","지원형","참여적","지도형","설득적","지시형","능력","동기"],"id":"haengjeong-e63"},{"ch":"CH04 지도성이론","t":"커와 제르미어","q":"커(Kerr)와 제르미어(Jermier)의 이론에 따를 때 지도성 행동의 영향력을 결정하는 요인 3가지를 제시하고, 대용상황과 억제상황의 개념 각각 1가지를 서술하시오.","ans":"상황변인: ① 구성원: 구성원의 능력, 훈련, 경험과 지식, 전문지향성, 보상에 대한 무관심 등, ② 과업: 구조화된 일상적 과업, 내재적 만족을 주는 과업, 과업에 의해 제공하는 피드백 등, ③ 조직: 역할과 절차의 공식화, 규정과 정책의 신축성, 작업집단의 응집력, 행정가와 구성원 사이의 공간적 거리 등\n대용상황: 구성원의 태도, 지각, 행동에 영향을 미치는 지도자의 능력을 대신하거나 감소시키는 상황적 측면\n억제상황: 지도자가 특정한 방식으로 행동하지 못하게 하거나 지도자 행동의 영향력을 무력화시키는 상황적 측면","kw":["구성원","전문지향성","보상에 대한 무관심","과업","구조화된 일상적 과업","조직","역할과 절차의 공식화","공간적 거리","대용상황","대신하거나 감소시키는","억제상황","무력화"],"id":"haengjeong-e64"},{"ch":"CH04 지도성이론","t":"거래적 vs 변혁적 지도성","q":"변혁적 지도성이 구성원의 동기부여와 구성원과의 관계의 측면에서 거래적 지도성과 구분되는 특징 각각 1가지를 서술하시오.","ans":"① 구성원의 동기부여: 거래적 지도성 ⇒ 구성원의 개인적 이익에 호소 / 변혁적 지도성 ⇒ 구성원의 도덕적 가치에 호소, 그들의 성장욕구를 자극하여 동기화시킴으로써 구성원의 태도와 신념을 변화시켜 자신감을 갖게 함\n② 구성원-지도자의 관계: 거래적 지도성 ⇒ 수행의 대가로 보상을 교환하는 상호교환적 관계 / 변혁적 지도성 ⇒ 단순한 상호교환적 관계를 넘어서 구성원으로 하여금 조직목적에 헌신하도록 함","kw":["개인적 이익에 호소","도덕적 가치에 호소","성장욕구를 자극","태도와 신념을 변화","상호교환적 관계","조직목적에 헌신"],"id":"haengjeong-e65"},{"ch":"CH04 지도성이론","t":"변혁적 지도성 구성요소","q":"변혁적 지도성의 개념과 변혁적 지도성의 구성요소 4가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"개념: 구성원의 성장욕구를 자극하여 동기화시킴으로써 태도와 신념을 변화시켜 자신감을 갖게 하며, 더 많은 노력과 헌신을 이끌어내어 기대 이상의 성과를 달성하게 하는 지도성\n구성요소: ① 이상적인 완전한 영향력: 지도자가 높은 기준의 윤리적ㆍ도덕적 행위를 보임. 목표수행 과정에서 발생하는 위험을 구성원과 함께 분담함. 자신보다는 타인의 욕구를 배려함. 개인의 이익이 아니라 조직의 이익을 위해 행동하는 것을 토대로 구성원의 존경과 신뢰를 받고 칭송을 얻음, ② 감화력: 조직의 미래와 비전을 창출하는 데 사람들을 참여시키고 구성원이 바라는 기대를 분명하게 전달함으로써 조직의 문제를 해결할 수 있음. 조직이 발전할 수 있다고 믿도록 구성원의 동기를 변화시켜 단체정신, 낙관주의, 열성과 헌신 등을 이끌어냄, ③ 지적 자극: 일상적인 생각에 대하여 의문을 제기하고 문제들을 재구조화하며 종래의 상황을 새로운 방식으로 접근함으로써 구성원이 혁신적이고 창의적이 되도록 유도함, ④ 개별적 배려: 성취하고 성장하려는 개개인의 욕구에 특별한 관심을 보임으로써 새로운 학습기회를 만들어 구성원으로 하여금 잠재력을 계발하고 자신의 개인적 발전을 모색하며 그에 대해 책임을 지도록 함","kw":["성장욕구를 자극","기대 이상의 성과","이상적인 완전한 영향력","윤리적ㆍ도덕적 행위","위험을 구성원과 함께 분담","감화력","미래와 비전을 창출","단체정신, 낙관주의","지적 자극","재구조화","개별적 배려","잠재력을 계발"],"id":"haengjeong-e66"},{"ch":"CH04 지도성이론","t":"분산적 지도성","q":"분산적 지도성의 개념과 특징 3가지, 한계 2가지를 서술하시오.","ans":"개념: 지도성이 한 사람이 아니라 다수의 조직구성원, 또는 조직구성원 전부에게 분산되어 있다고 여기고 전체적 관점에서 파악하는 지도성\n특징: ① 지도성의 영역이 구성원에까지 확대되어 학교장과 학교구성원 모두가 집단지도성을 실행하며 그에 대한 공동책임을 수행, ② 비위계적 지도성을 지향해 조직의 하위에 있는 구성원들도 주요 의사결정에 참여, ③ 다수의 지도자가 네트워크를 통해 상호의존 및 신뢰와 협력을 기반으로 지도성을 공동으로 실행, ④ 조직역량과 개인의 전문성 극대화 추구\n한계: ① 상향적 참여와 공유 방식을 지향하지만 실질적으로는 하향식 접근으로 이루어진다는 점에서 하부조직에 잘못된 지도성 이양이나 분산을 강요할 가능성을 배제할 수 없음, ② 책임과 권력 분산이 오히려 조직경영의 효과성을 저해할 수도 있으며 학교장의 법적 의무 및 책무성 이행과 상충될 수 있음","kw":["다수의 조직구성원","분산되어 있다고","전체적 관점","집단지도성","공동책임","비위계적 지도성","네트워크","조직역량","하향식 접근","지도성 이양","책무성 이행과 상충"],"id":"haengjeong-e67"},{"ch":"CH04 지도성이론","t":"문화적 지도성","q":"문화적 지도성의 개념과 지도자의 역할 1가지, 효과적인 학교문화 형성을 위한 방안 2가지를 서술하시오.","ans":"개념: 인간의 가치와 의미추구 욕구를 만족시킴으로써 구성원들을 조직의 주인으로 만들고 조직의 제도적 통합을 가능하게 하는 지도성\n지도자의 역할: 독특한 정체성을 갖게 만드는 가치, 믿음, 관점을 창조ㆍ강화ㆍ유지하는 것을 중요시하고 이를 통해 전통과 문화를 만듦. 지도자는 학교를 이완구조로 파악하고 교사들을 고도의 전문성 신장이 요구되는 전문직업인으로 간주함\n방안: 버티컬 슬라이스(조직에서 각 계층 대표자들이 직위에 관계없이 허심탄회하게 토론하고 조정하는 의사소통방법), 비전, 동료관계, 신뢰와 지원, 가치와 흥미, 폭넓은 참여, 지속적 성장, 장기적인 전망에 따른 현재의 생활, 질 높은 정보에 대한 용이한 접근, 개선의 유지와 지속, 개인적 권한 부여 등","kw":["가치와 의미추구 욕구","조직의 주인","제도적 통합","독특한 정체성","창조ㆍ강화ㆍ유지","전통과 문화","이완구조","전문직업인","버티컬 슬라이스","개인적 권한 부여"],"id":"haengjeong-e68"},{"ch":"CH04 지도성이론","t":"초우량지도성·셀프지도성","q":"초우량지도성(슈퍼리더십)의 개념과 지도자의 역할 2가지, 초우량지도성 신장방안 2가지를 서술하고, 셀프지도성(자율적 지도성)의 개념을 제시하시오.","ans":"개념: ① 조직의 지도자가 구성원 개개인을 스스로를 지도할 수 있는 지도자로 성장ㆍ변화시키는 리더십, ② 구성원 각자 자율적으로 자신의 지도력을 발휘할 수 있게 함 ⇒ 셀프지도성(셀프리더십/자율적 지도성). 즉, 조직구성원 각자가 스스로를 통제하고 삶의 진정한 주인이 될 수 있도록 셀프지도성을 개발하는 데 중점을 둠\n지도자의 역할: ① 구성원이 스스로 생각하여 해결책을 찾고 의사결정을 하도록 도와줌, ② 구성원에게 셀프지도성을 가르치고 그들이 조직 내에서 셀프지도성을 실천할 수 있는 기회를 제공함, ③ 지도자가 구성원 개개인을 지도자로 성장시킴으로써 지도자가 '지도자들의 지도자'가 되게 하여 구성원을 지도자로 변혁시키려는 지도성\n신장방안: ① 교사는 일상적 업무에 대한 통제에 있어 높은 수준의 자율성을 경험하고 기대함. 전문직업인으로서 일상의 과업에서 상당한 재량권을 행사함, ② 교사에게 셀프지도성을 가르치고 조직 내에서 셀프지도성을 실천할 수 있는 기회를 제공함. 교사가 자기주도적으로 통제할 수 있도록 내적 동기를 부여하고, 교사가 스스로 지도자로서의 능력을 개발할 수 있도록 함\n셀프지도성: 구성원 각자 자율적으로 자신의 지도력을 발휘할 수 있게 되는 것 ⇒ 조직구성원 각자가 스스로를 통제하고 삶의 진정한 주인이 될 수 있도록 셀프지도성을 개발하는 데 중점을 두는 리더십","kw":["스스로를 지도할 수 있는 지도자","셀프지도성","삶의 진정한 주인","지도자들의 지도자","자율성","재량권","내적 동기"],"id":"haengjeong-e69"},{"ch":"CH04 지도성이론","t":"도덕적 지도성","q":"도덕적 지도성의 개념과 도덕적 지도성을 통해 궁극적으로 만들고자 하는 조직의 특징, 도덕적 지도성의 의의 2가지를 서술하시오.","ans":"개념: 지도자가 자신의 도덕적 품성과 능력을 바탕으로 추종자의 존경과 신뢰를 획득하고 나아가 추종자의 능력을 계발하고 추종자의 자율적 직무수행을 조장해 추종자들을 '셀프리더'가 되도록 자극하고 지도자 자신은 '리더들의 리더'가 되도록 함\n특징: 궁극적으로 효과적이고 도덕적인 조직이 될 수 있도록 하는 지도성\n의의: ① 전문직업적 사회화, 목적설정과 공유가치, 동료의식과 상호의존성은 추종자들이 일에 헌신하도록 하는 데 필요한 규범적 권력을 제공하여 이완구조를 가진 학교에서 통제문제를 해결할 수 있도록 하고 궁극적으로 교사들을 추종자에서 자기관리자로 변혁시킬 수 있음, ② 행정가들은 지시적인 대인적 지도성을 발휘하는 대신 교사들로 하여금 지도자가 되도록 자극하고 조건을 확립하는 데 노력을 투자할 수 있게 됨","kw":["도덕적 품성과 능력","존경과 신뢰","자율적 직무수행","셀프리더","리더들의 리더","효과적이고 도덕적인 조직","전문직업적 사회화","규범적 권력","이완구조","자기관리자"],"id":"haengjeong-e70"},{"ch":"CH04 지도성이론","t":"교육지도성","q":"교육지도성의 개념과 교육지도자의 권위가 인정받기 위한 조건 1가지, 교육지도성의 구성요소 3가지를 서술하시오.","ans":"개념: '교육을 위한 지도성'으로 교육자가 교육자로서의 권위와 기술을 발휘하여 구성원의 배움을 자극하고 학교 또는 특정 조직을 학습공동체로 만드는 활동\n조건: 자기학습에 철저하고 타인의 배움에 도움을 줄 때 인정받을 수 있음\n구성요소: ① 자기학습, ② 목적의식, ③ 교육프로그램 개발능력, ④ 인간관계능력, ⑤ 기술적(관리적) 능력, ⑥ 문화형성능력","kw":["교육을 위한 지도성","권위와 기술","배움을 자극","학습공동체","자기학습","목적의식","교육프로그램 개발능력","인간관계능력","기술적(관리적) 능력","문화형성능력"],"id":"haengjeong-e71"},{"ch":"CH05 정책론","t":"의사소통의 기능","q":"의사소통의 기능 2가지를 서술하시오.","ans":"① 조정 및 통제의 수단: 구성원의 행동을 일사분란하게 하고 질서 확보, 직무 관련하여 책임과 권한의 소재를 명확하게 규정함\n② 합리적 의사결정의 수단: 의사소통을 통해 의사결정 과정에 참여하고 그 내용이 정확ㆍ신속ㆍ적절, 정보의 질이 우수할 경우 의사결정의 수준을 높임\n③ 조직 통솔과 리더십의 발휘: 구성원을 통솔하고 조직목표에의 공헌과 추종을 유도함\n④ 사기 증진 및 동기유발: 구성원을 자극하고 격려함으로써 구성원의 동기유발, 사기증진, 조직목표 달성을 위한 구성원 간의 협동이나 몰입을 불러일으킬 수 있음","kw":["조정 및 통제의 수단","일사분란","책임과 권한의 소재","합리적 의사결정의 수단","정보의 질","조직 통솔과 리더십","사기 증진 및 동기유발","협동이나 몰입"],"id":"haengjeong-e72"},{"ch":"CH05 정책론","t":"의사소통의 원칙","q":"의사소통의 원칙 중 '분포성의 원칙'과 '적응성의 원칙'을 설명하시오.","ans":"분포성의 원칙: 의사소통이 시작되는 지점에서 목적지까지 모든 정보가 의사소통의 대상에게 골고루 도달되어야 함\n적응성(융통성)의 원칙: 구체적인 상황에 적응할 수 있는 현실 적합성","kw":["시작되는 지점","목적지","골고루 도달","적응성","융통성","현실 적합성"],"id":"haengjeong-e73"},{"ch":"CH05 정책론","t":"수평적 의사소통","q":"수평적 의사소통의 장애요인 1가지와 이의 해결방안 1가지, 수평적 의사소통의 장점과 단점 각각 1가지를 서술하시오.","ans":"장애요인: 조직의 목표 대신 부서의 목표달성에만 초점을 두는 문화, 전문가의 편견, 수평적 관계의 낮은 영향력으로 인한 수평적 관계 경시현상 등\n해결방안: 목표관리방법 등을 도입함\n장점: 구성원 간 또는 부서 간에 나타날 수 있는 대립이나 이해관계를 효과적으로 조정하는 역할을 함\n단점: 수평적 의사소통의 지나친 강조는 비공식집단이나 압력단체를 형성해 다른 부서와 원활한 협조체계를 저해하거나 조직의 위계질서를 파괴할 수 있음","kw":["부서의 목표달성에만","전문가의 편견","수평적 관계 경시현상","목표관리방법","대립이나 이해관계","조정","비공식집단","압력단체","위계질서를 파괴"],"id":"haengjeong-e74"},{"ch":"CH05 정책론","t":"비공식적 의사소통","q":"비공식적 의사소통의 수단 2가지, 장점과 단점 각각 2가지를 서술하시오.","ans":"수단: 개별적인 인간적 만남, 각종 친목회에서의 의견 교환, 조직 내 소문\n장점: 신속하게 전달이 이루어짐 / 외적으로 나타나지 않는 배후사정을 소상히 전달함 / 긴장과 소외감을 극복하고 개인적인 욕구를 충족할 수 있음 / 행동의 통일성을 확보할 수 있음 / 관리자에 대한 조언의 역할 가능 / 의견교환의 융통성이 높음 / 공식적 전달을 보완할 수 있음\n단점: 책임소재가 불분명함 / 개인적 목적에 역이용될 수 있음 / 공식적 의사소통 기능의 마비 / 수직적 계층에서 상관의 권위 손상 / 조정ㆍ통제가 곤란함","kw":["개별적인 인간적 만남","친목회","조직 내 소문","신속하게 전달","배후사정","긴장과 소외감","행동의 통일성","책임소재가 불분명","역이용","권위 손상","조정ㆍ통제가 곤란"],"id":"haengjeong-e75"},{"ch":"CH05 정책론","t":"조하리의 창","q":"조하리(Johari)의 창에서 자기공개와 피드백 각각의 개념을 제시하고, 조하리의 창의 영역 네 가지의 명칭을 각각의 개념 및 특징 1가지와 함께 제시하며, 이 이론의 시사점 1가지를 서술하시오.","ans":"자기공개: 자신의 입장을 분명하게 보여주고 남에게 자신을 보여줌으로써 타인으로 하여금 나를 알 수 있도록 하는 행위\n피드백: 나에 대한 정보를 타인을 통해 얻게 되는 행위\n① 개방적 영역(민주형): 자신의 정보가 자신이나 타인에게 잘 알려짐 ⇒ 개방적인 상호작용으로 효과적인 의사소통이 가능한 영역\n② 맹목적 영역(독단형): 자신은 타인에게 잘 알려져 있지만 자기 스스로는 잘 모름 ⇒ 타인으로부터 자신에 대한 의견을 알지 못할 때 의사소통에서 자신의 주장을 앞세우고 타인의 의견은 불신ㆍ비판하여 수용하지 않는 영역\n③ 잠재적 영역(과묵형): 자신은 스스로를 잘 알고 있지만 타인에게는 알려져 있지 않음 ⇒ 타인이 취하는 자신에 대한 반응을 예측할 수 없어 타인에게 방어적인 태도를 취함\n④ 미지의 영역(폐쇄형): 자기 스스로와 타인에게 모두 알려지지 않음 ⇒ 자신에 대한 견해를 표명하지도 않으며 타인으로부터 피드백을 받지도 못함\n시사점: 효과적인 의사소통을 위해서는 자기공개와 피드백이 활성화되어 있는 개방의 영역을 넓혀가는 것이 바람직함","kw":["자기공개","피드백","개방적 영역","민주형","맹목적 영역","독단형","잠재적 영역","과묵형","미지의 영역","폐쇄형","개방의 영역을 넓혀가는"],"id":"haengjeong-e76"},{"ch":"CH05 정책론","t":"참여적·우연적 관점","q":"의사결정에 있어 참여적 관점이 적합한 조직의 특징 2가지와 우연적 관점에서의 의사결정이 적합한 조직의 특징 2가지를 서술하시오.","ans":"참여적 관점이 적합한 조직의 특징: ① 관료제적 조직보다는 관련자의 능력과 자율이 보장되는 전문직 조직, ② 공동의 가치에 대한 인식, 전문가의 식견에 대한 신뢰, 관련자들의 합리성에 대한 신뢰가 전제되고 이러한 토대 위에서 결정이 이루어질 수 있는 조직\n우연적 관점이 적합한 조직의 특징: 목표가 불분명하고 목표달성을 위한 방법적 체제나 관련 당사자의 참여체제가 제대로 정비되지 않은 '무질서 속의 질서', '쓰레기통'으로 비유되는 특정한 조직","kw":["관련자의 능력과 자율","전문직 조직","공동의 가치에 대한 인식","전문가의 식견에 대한 신뢰","목표가 불분명","참여체제가 제대로 정비되지 않은","무질서 속의 질서","쓰레기통"],"id":"haengjeong-e77"},{"ch":"CH05 정책론","t":"합리모형·만족모형","q":"합리모형의 개념, 특징과 한계 각각 1가지 및 만족모형의 개념, 특징과 한계 각각 1가지를 서술하시오.","ans":"[합리모형] 개념: 최적화된 기준에 따라 문제를 완전히 이해하고 고려할 수 있는 모든 대안을 포괄적으로 탐색ㆍ평가하여 조직의 목표와 목적의 달성을 극대화할 수 있는 가장 합리적인 대안을 선택 / 특징: 계량적 방법 강조, 객관적ㆍ합리적인 선택을 강조함 / 한계: 인간의 합리성을 전제하고 있다는 점에서 이상적ㆍ비현실적인 모형임\n[만족모형] 개념: 인간의 제한된 합리성을 인식하고 사회ㆍ심리적 측면을 고려해서 의사결정 시 (최적의 대안을 선택하기보다는) 만족할 만한 대안을 선택한다는 것을 강조 / 특징: 최선은 최고가 아니라 '만족스러운 상태'를 의미함. 일정 수준의 만족할 만한 기준을 정해놓고 고려 가능한 대안들만을 모색한 후 주관적ㆍ현실적 수준에서 의사결정을 내림 / 한계: 만족화 기준을 형성하는 척도가 의사결정자의 주관에 의존함. 혁신적ㆍ창의적 문제해결방안을 기대하기 어려움","kw":["최적화된 기준","포괄적으로 탐색ㆍ평가","계량적 방법","인간의 합리성을 전제","제한된 합리성","만족할 만한 대안","만족스러운 상태","주관적ㆍ현실적 수준","의사결정자의 주관","혁신적ㆍ창의적"],"id":"haengjeong-e78"},{"ch":"CH05 정책론","t":"점증모형·혼합모형","q":"점증모형의 개념, 장점 2가지, 단점 1가지 및 혼합모형의 개념, 장점과 단점 각각 1가지를 서술하시오.","ans":"[점증모형] 개념: 의사결정 시 현실을 긍정하고 이전의 상태보다 다소 향상된 대안을 추구 / 장점: 실제 교육조직이 처한 상황이나 여건을 충분히 고려해 기존 정책과 일관성을 찾고 변화에 따른 충격을 최소화할 수 있음. 현재 수준보다 더 나은 개선책을 모색할 수 있음 / 단점: (과거 관례나 기존 정책을 바탕으로 구체적ㆍ실제적 소수의 대안들을 비교해 나가는 방식으로) 보수적ㆍ소극적임\n[혼합모형] 개념: 기본적인 방향설정과 전체의 윤곽은 광범위하게 포괄적으로 검토하고(합리모형), 특별한 관심을 기울여야 할 부분만 면밀하게 검토(점증모형)하여 결정하는 방식으로 합리모형과 점증모형의 장점을 혼합한 방식 / 장점: 합리모형의 이성적 요소와 점증모형의 보수적 특성을 적절히 혼합함 / 단점: 의사결정 과정이 다소 불분명하고, 의사결정자의 기본방향에 대한 통제를 제외하면 점증모형과 크게 다르지 않음","kw":["현실을 긍정","다소 향상된 대안","기존 정책과 일관성","충격을 최소화","보수적ㆍ소극적","기본적인 방향설정","광범위하게 포괄적으로","면밀하게 검토","이성적 요소","보수적 특성"],"id":"haengjeong-e79"},{"ch":"CH05 정책론","t":"최적모형","q":"최적모형의 개념, 이 모형의 특징, 장점과 단점 각각 1가지를 서술하시오.","ans":"개념: 합리모형과 점증모형의 절충을 시도하고 있다는 점에서 혼합모형과 유사하나 양자의 단순 혼합이 아니라 합리성과 초합리성을 동시에 고려하는 최적치를 추구하는 규범적 모형\n특징: ① 의사결정은 때때로 초합리적인 직관, 판단, 창의 등과 같은 잠재적 의식이 개입되어 이루어진다는 점에서 초합리적 과정을 의사결정에서 필수불가결한 역할로 파악, ② 의사결정 시 비현실적인 것이라 해도 항상 가능성을 찾아 합리적 측면을 발견하고 그것이 최적인 것인지 확인함\n장점: 그동안 비합리성으로 배제해 온 요인들도 최적의 의사결정을 위한 핵심 요소가 될 수 있음을 확인함으로써 창의적ㆍ혁신적 의사결정을 정당화할 수 있는 이론적 근거 마련\n단점: 달성방법이 명확하지 않고 개념도 불명료한 초합리성에 의존하고 있어서 비현실적이고 이상적임","kw":["합리성과 초합리성","최적치","규범적 모형","초합리적인 직관, 판단, 창의","잠재적 의식","필수불가결한 역할","창의적ㆍ혁신적 의사결정","초합리성에 의존","비현실적이고 이상적"],"id":"haengjeong-e80"},{"ch":"CH05 정책론","t":"쓰레기통모형","q":"쓰레기통모형의 개념과 요소 4가지, 좋은 의사결정의 특징 1가지를 서술하시오.","ans":"개념: 조직화된 무정부상태에서 '문제, 해결책, 선택기회, 참여자'라는 네 가지 요소가 독자적으로 움직이다가 어떤 우연한 사건을 계기로 교차하여 결합할 때 결정이 이루어지는 상황\n요소: ① 문제: 일상생활에서 주의를 필요로 하거나 불만족되고 있는 요소, ② 해결책: 채택을 위해 이미 제안되어 있는 것으로 문제와는 별개로 존재할 수 있으며 어떤 경우엔 해결책이 먼저 발견되는 경우도 있음, ③ 선택기회: 특정 개인이나 조직이 의사결정할 것이라고 기대하는 경우, ④ 참여자: 문제를 알건 모르건, 해결책을 알건 모르건 간에 결정에 관여하는 모든 사람들\n특징: ① 의사결정 과정이 특정 문제에서 시작하지도 않고 해결책으로도 끝나지 않으며 조직에서 일어나는 의사결정은 상호독립적 사건들의 산물임, ② 문제와 해결책이 조화를 이룰 때 좋은 의사결정이 이루어짐, ③ 의사결정은 합리성보다는 우연성에 기초해 이루어짐","kw":["조직화된 무정부상태","문제, 해결책, 선택기회, 참여자","독자적으로 움직이다가","우연한 사건","교차하여 결합","상호독립적 사건들의 산물","조화를 이룰 때","우연성에 기초"],"id":"haengjeong-e81"},{"ch":"CH05 정책론","t":"의사결정 참여의 필요성","q":"의사결정 참여의 필요성 3가지를 서술하시오.","ans":"① 구성원의 직무만족과 사기를 제고시키고 조직의 일체감을 증대시킴\n② 과업에 대한 사명감과 책임감을 더 크게 느끼도록 함\n③ 의사결정에 대한 반감이나 저항을 줄이고, 순조로운 수행을 보장함\n④ 구성원의 발전에 기여하고, 조직의 목적달성이 용이해짐","kw":["직무만족과 사기","조직의 일체감","사명감과 책임감","반감이나 저항","순조로운 수행","구성원의 발전","목적달성이 용이"],"id":"haengjeong-e82"},{"ch":"CH05 정책론","t":"브릿지스 참여적 의사결정","q":"브릿지스(Bridges)의 참여적 의사결정모형에서 수용영역의 개념과 의사결정에 구성원을 참여시키는 기준 2가지를 설명하시오.","ans":"수용영역: 구성원이 상급자의 의사결정을 기꺼이 받아들일 수 있는 정도\n기준: ① 적절성(이해관계): 구성원이 그 결정에 대해 높은 개인적 이해관계를 가지고 있는지의 여부. 이해관계가 높을 시 결정에 참여하고 싶은 관심이 높아짐, ② 전문성: 구성원이 문제를 규명하고 해결하는 데 있어 어느 정도 유용하게 기여할 수 있는지의 여부. 의사결정 과정에서 유익한 공헌을 할 수 있는 전문적 지식을 가지고 있는 정도가 높을수록 전문성이 있다고 판단","kw":["수용영역","기꺼이 받아들일 수 있는 정도","적절성","이해관계","전문성","문제를 규명하고 해결","유익한 공헌","전문적 지식"],"id":"haengjeong-e83"},{"ch":"CH05 정책론","t":"브릿지스 참여방법·방식","q":"브릿지스(Bridges)의 참여적 의사결정모형에서 교사와 학생, 교육전문가를 의사결정에 참여시키는 방법과 의사결정의 방식 각각 1가지를 서술하시오.","ans":"교사: 초기 단계부터 자주, 적극적으로 참여시킴 / 의사결정방식: 의회식(다수결의 원칙)\n학생: 의사결정 결과에 대해 이해를 구한 후 설득 및 합의를 도출하여 저항을 최소화하기 위해 구성원을 가끔 참여시키고 최종 대안을 선택할 때만 제한적으로 참여시킴 / 의사결정방식: 민주적-중앙집권주의적\n교육전문가: 대안 제시나 결과의 평가 단계에 구성원을 제한적으로 참여시킴 / 의사결정방식: 민주적-중앙집권주의적","kw":["초기 단계부터 자주","의회식","다수결의 원칙","설득 및 합의","저항을 최소화","최종 대안을 선택할 때만","민주적-중앙집권주의적","대안 제시나 결과의 평가 단계"],"id":"haengjeong-e84"},{"ch":"CH05 정책론","t":"호이와 타터","q":"호이(Hoy)와 타터(Tarter)의 참여적 의사결정모형에서 교사의 의사결정에 대한 참여 정도를 결정하는 기준 3가지를 서술하시오.","ans":"교사의 의사결정에 대한 참여 정도를 결정하는 기준: 관련성 검증, 전문성 검증, 구성원 헌신 검증","kw":["관련성 검증","전문성 검증","구성원 헌신 검증"],"id":"haengjeong-e85"},{"ch":"CH05 정책론","t":"교육기획 개념·접근방법","q":"교육기획의 개념과 교육기획 접근방법 4가지를 서술하시오.","ans":"교육기획: 미래의 교육활동에 대한 사전 준비과정 ⇒ 미래의 교육활동에 대비해 교육목표 달성을 위한 효과적인 수단과 방법을 제시함으로써 교육정책 결정의 효율성과 안정성을 보장해 주는 지적ㆍ합리적 과정\n접근방법: ① 사회수요에 의한 접근방법, ② 인력수요에 의한 접근방법, ③ 수익률에 의한 접근방법, ④ 국제비교에 의한 접근방법","kw":["사전 준비과정","효과적인 수단과 방법","효율성과 안정성","지적ㆍ합리적 과정","사회수요","인력수요","수익률","국제비교"],"id":"haengjeong-e86"},{"ch":"CH05 정책론","t":"사회수요 접근방법","q":"사회수요에 의한 접근방법의 개념과 장점, 단점 각각 1가지를 서술하시오.","ans":"개념: 교육을 받고자 하는 모든 사람에게 교육의 기회를 부여해야 한다는 원칙하에서 이루어지는 교육기획\n장점: ① 사회의 교육적 수요에 부응함으로써 적어도 단기적으로는 사회적ㆍ정치적 안정에 기여할 수 있음, ② 기획의 과정이 비교적 단순하여 손쉽게 교육계획을 세울 수 있음\n단점: ① 교육에 대한 사회적 필요와는 동떨어진 교육계획을 수립할 가능성이 있음, ② 재정적 제약 등을 고려하지 않은 사회수요의 충족은 교육의 질적 수준을 하락시키는 요인이 되기도 함, ③ 투자의 우선순위 등을 상세화하지 않고 모든 교육수요를 충족시킬 만큼 자원의 여유가 없을 때 어떻게 해야 되는가에 대한 방안을 제시하지 못함","kw":["모든 사람에게 교육의 기회","사회적ㆍ정치적 안정","기획의 과정이 비교적 단순","사회적 필요와는 동떨어진","재정적 제약","질적 수준을 하락","투자의 우선순위"],"id":"haengjeong-e87"},{"ch":"CH05 정책론","t":"인력수요 접근방법","q":"인력수요에 의한 접근방법의 개념과 장점, 단점 각각 1가지를 서술하시오.","ans":"개념: 경제성장에 필요한 인적자본의 중요성을 전제로 경제성장을 뒷받침하는 인력수요를 예측하고 이를 충족시킬 수 있도록 교육적 측면의 공급을 조절함\n장점: ① 교육과 취업, 나아가 교육과 경제성장을 보다 긴밀하게 연결하여 교육계획을 수립할 수 있음, ② 교육운영에서 낭비를 줄여 효율성을 높일 수 있음\n단점: ① 교육과 취업이 반드시 1:1의 대응관계를 갖지 않고, 급변하는 사회에서는 교육수요나 인력수요의 구조도 급변하기 때문에 추정 자체가 어려움, ② 교육과 취업 간의 시차 때문에 수급 측면에서 차질을 빚기 쉽고, 예측의 어려움 등으로 기술상 많은 어려움이 있음","kw":["인적자본","인력수요를 예측","공급을 조절","교육과 취업","경제성장","낭비를 줄여","1:1의 대응관계","추정 자체가 어려움","시차","수급 측면"],"id":"haengjeong-e88"},{"ch":"CH05 정책론","t":"수익률 접근방법","q":"수익률에 의한 접근방법의 개념과 장점, 단점 각각 1가지를 서술하시오.","ans":"개념: 교육을 투자로 보고 그 투자에 대한 경제적 효과를 분석하는 방법\n장점: ① 교육운영의 경제적 효율성을 제고시킬 수 있음, ② 비용-수익 분석을 통해 교육투자의 합리성을 제고할 수 있음\n단점: ① 교육투입과 교육산출을 계산하는 방식이 너무 다양해 측정이 용이하지 않음, ② 수익률 계산에 따르는 어려움과 과거의 소득을 가지고 미래의 소득을 추정하는 기법 자체에 문제가 있음","kw":["교육을 투자로","경제적 효과를 분석","경제적 효율성","비용-수익 분석","교육투입과 교육산출","측정이 용이하지 않음","과거의 소득","미래의 소득을 추정"],"id":"haengjeong-e89"},{"ch":"CH05 정책론","t":"교육기획의 효과·한계","q":"교육기획의 효과와 한계 각각 2가지를 서술하시오.","ans":"효과: ① 교육정책 수행과 교육행정의 안정화에 기여함, ② 교육행정 또는 교육경영의 효율성과 타당성을 높일 수 있음, ③ 한정된 재원을 합리적으로 배분할 수 있도록 해줌\n한계: ① 미래에 대한 정확한 예측을 기반으로 하는데, 인간의 합리성에는 한계가 있기 때문에 미래 예측에 한계가 있음, ② 교육계획 수립을 위하여 교육현황 등에 대한 다양한 정보와 자료가 필요한데, 정확하고 적절한 정보와 자료의 취득에는 한계가 있음, ③ 각종 예측과 추정을 위해 여러 가지 상황을 전제하는데, 급변하는 현대사회에서 이러한 전제 설정은 매우 어려움. 전제를 설정하더라도 변화를 예상하기 어려움","kw":["안정화에 기여","효율성과 타당성","한정된 재원","합리적으로 배분","인간의 합리성에는 한계","정보와 자료의 취득","전제 설정","변화를 예상하기 어려움"],"id":"haengjeong-e90"},{"ch":"CH06 교원인사행정론","t":"단위학교중심연수","q":"단위학교중심연수의 개념과 구체적인 방안 4가지를 서술하시오.","ans":"개념: 단위학교를 중심으로 계획을 수립하여 실시하는 연수\n방안: ① 전문적 학습공동체, 컨설팅장학, 교내자율장학 중 임상장학, 동료장학 등, ② 교사 간 워크숍, 전문성을 갖춘 교사(수석교사 등)의 특강을 기반으로 한 자체연수 등, ③ 교사 간 마이크로티칭, 교사 간 수업연구, 교사협의회 등","kw":["단위학교를 중심으로","전문적 학습공동체","컨설팅장학","교내자율장학","임상장학","동료장학","워크숍","수석교사","자체연수","마이크로티칭","수업연구","교사협의회"],"id":"haengjeong-e91"},{"ch":"CH06 교원인사행정론","t":"연수기관중심 현직연수","q":"연수기관중심 현직연수의 문제점과 학습모델로 가기 위한 연수방안 각각 2가지를 서술하시오.","ans":"문제점: ① 교사의 단순 연수시간은 교수학습 개선에 유의미한 영향을 미치지 못함, ② 불확실한 연수목적, 경직된 연수기회와 여건, 현실성이 부족한 연수내용, 획일적인 연수방법, 비합리적인 연수일정과 운영 등\n방안: ① 교사들이 스스로 교직에 대한 비전과 가치관을 확립할 수 있어야 함, ② 현직연수의 내용은 학교 단위의 특수성이 반영되어야 함, ③ 교사가 자율적으로 팀을 구성하여 연수하는 자율적인 연수풍토를 조성해야 함","kw":["단순 연수시간","유의미한 영향을 미치지 못함","불확실한 연수목적","경직된 연수기회","획일적인 연수방법","비전과 가치관","학교 단위의 특수성","자율적인 연수풍토"],"id":"haengjeong-e92"},{"ch":"CH06 교원인사행정론","t":"학습공동체","q":"학습공동체의 개념과 학습공동체를 통해 교원역량 개발이 이루어지는 양상 2가지, 이의 효과 2가지를 서술하시오.","ans":"개념: 학습에 대한 교사 간의 공유된 가치와 교수ㆍ학습활동에 관련한 교사들의 풍부한 대화 및 협동을 근간으로 하는 전문적 집단\n교원역량 개발이 이루어지는 양상: ① 전문적 대화, ② 전문적 협력활동, ③ 교육활동 목표 공유, ④ 교사지도성 함양\n효과: ① 동료교사와의 교육활동에 관한 일상적 대화를 통하여 자신의 교수ㆍ학습의 실제에 대해 성찰할 수 있는 기회를 갖게 됨, ② 교수ㆍ학습에 관한 이론과 방법, 학생에 대한 가정에 대해 다시 생각해 보게 되고 이는 교수ㆍ학습의 향상으로 이어짐, ③ 교육활동에 관한 목표 공유를 통해 공동체의식을 높이고, 교사공동체를 통해 교사리더십을 함양시킬 수 있음","kw":["공유된 가치","풍부한 대화 및 협동","전문적 집단","전문적 대화","전문적 협력활동","교육활동 목표 공유","교사지도성 함양","성찰","교수ㆍ학습의 향상","공동체의식","교사리더십"],"id":"haengjeong-e93"},{"ch":"CH07 장학론","t":"장학의 기능","q":"장학의 기능 2가지를 서술하시오.","ans":"① 교원의 성장ㆍ발달을 돕는 기능: 교원으로 하여금 교직생활과 관련된 제반 영역에서 필요한 가치관, 신념, 태도, 지식, 기능, 행동 등을 갖추도록 도와주는 기능을 함\n② 교육과정 운영의 효율화를 돕는 기능: 교육목적을 달성하기 위하여 학생에게 제공되는 교육내용 및 교육활동에 대한 개발, 운영, 평가에 있어서 효과를 높이도록 도와주는 기능을 함\n③ 학교경영의 합리화를 돕는 기능: 학교체제 내 인적ㆍ물적ㆍ재정적 자원을 효과적으로 유지ㆍ통합ㆍ운영하고, 제반 교육활동 기능을 최적화하도록 도와주는 기능을 함","kw":["교원의 성장ㆍ발달","가치관, 신념, 태도","교육과정 운영의 효율화","개발, 운영, 평가","학교경영의 합리화","인적ㆍ물적ㆍ재정적 자원","최적화"],"id":"haengjeong-e94"},{"ch":"CH07 장학론","t":"발달장학·선택적 장학·인간자원장학","q":"발달장학의 개념과 특징 1가지, 글래손(Glatthorn)의 선택적 장학의 개념, 서지오바니(Sergiovanni)가 제안한 인간자원장학의 특징 2가지를 서술하시오.","ans":"[발달장학] 개념: 교사의 발달 정도에 따라 다른 장학방법을 적용하여 교사의 발달수준을 높인다는 원리에 근거한 장학 / 특징: 교사의 발달 정도에 따라 장학에 대한 교사 참여 정도를 높임\n[선택적 장학] 교사의 필요와 상황에 따라 여러 가지 장학유형들 중 교사가 원하는 것을 스스로 선택ㆍ결정할 수 있도록 함(장학의 대상인 교사의 발달수준과 장학의 필요가 교사마다 다르기 때문에 교사에 따라 장학의 방법이 각기 달라야 하기 때문)\n[인간자원장학] ① 교사 개인의 욕구와 학교목적 및 과업을 통합하는 데 중점을 둠, ② 교사의 직무만족도를 중시함 ⇒ 직무만족은 중요하고 의미 있는 일을 성취할 때 생기며 이러한 성취가 학교효과성의 중요한 구성요소가 됨, ③ 교사는 학교효과성을 증대시키는 잠재가능성과 책임감을 갖고 있다는 점에서 학교경영자는 교사들이 학교목표 달성을 위해 스스로의 능력을 최대한 발휘할 수 있는 환경을 조성해야 함, ④ 장학을 통해 교사의 능력을 향상시키면 학생의 능력이 향상되고 궁극적으로 인간자본이 형성될 것이라고 생각함","kw":["교사의 발달 정도","교사 참여 정도","스스로 선택ㆍ결정","교사마다 다르기 때문","교사 개인의 욕구","학교목적 및 과업을 통합","직무만족도","학교효과성","잠재가능성과 책임감","인간자본"],"id":"haengjeong-e95"},{"ch":"CH07 장학론","t":"지구별자율장학","q":"지구별자율장학의 개념과 지구별자율장학의 구체적인 방안 3가지를 서술하시오.","ans":"개념: 각 지구 내에 인접한 학교 또는 교원 간의 교육활동 개선을 위하여 상호 협력하는 장학활동\n방안: 지구자율장학회별 간사학교가 중심이 되어 지구 내 학교 간 협의를 통하여 장학활동 과제 및 과제별 주관학교를 선정한 후 지역 특성에 맞게 자율적으로 추진함. ① 학교 간 방문장학: 교육활동 상호 참관(공개보고회, 공개수업 등) 및 교육정보 교환, 학교경영, 학습지도, 특별활동 개선방안 협의 등, ② 교육연구활동: 수업 및 평가방법 개선을 위한 공개수업, 교육현장의 문제점ㆍ해결방안 및 공동관심사에 관한 현장연구 발표 등, ③ 학생생활지도활동: 교내외 생활지도방법 개선 협의, 초ㆍ중ㆍ고등학교 지구별 통합협의회 활동, 연말연시 방학 중 합동 교외지도, 지구별 학생선도협의회 운영, 청소년단체 합동 수련활동 등","kw":["인접한 학교","상호 협력","간사학교","주관학교","학교 간 방문장학","공개보고회","교육연구활동","현장연구 발표","학생생활지도활동","합동 교외지도"],"id":"haengjeong-e96"},{"ch":"CH07 장학론","t":"교내자율장학","q":"교내자율장학의 개념과 운영하는 방안 4가지를 서술하시오.","ans":"개념: 단위학교 내에서 교사의 수업개선을 위해 교장, 교감, 부장교사 및 동료교사가 행하는 지도ㆍ조언활동\n방안: ① 임상장학, ② (협동적) 동료장학, ③ 자기장학, ④ 약식장학(일상장학)","kw":["단위학교 내에서","수업개선","교장, 교감, 부장교사","지도ㆍ조언활동","임상장학","동료장학","자기장학","약식장학","일상장학"],"id":"haengjeong-e97"},{"ch":"CH07 장학론","t":"동료장학","q":"동료장학의 개념, 특징과 장점 각각 2가지를 서술하시오.","ans":"개념: 교사가 자신의 전문성 개발을 위해 동료 간 협동하는 장학\n특징: ① 교사의 자율성과 협동성을 기초로 함, ② 학교의 형편과 교사의 필요와 요구에 기초하여 다양하고 융통성 있게 운영됨, ③ 대상 교사, 학생의 장ㆍ단점을 이해하고 실제적 경험을 바탕으로 지도ㆍ조언함\n장점: ① 교사들이 경험을 공유함으로써 교수능력의 향상을 도모할 뿐만 아니라, 협동적인 인간관계의 수립을 통해 공동성취감 등을 향상시킴, ② 성공적인 수업혁신은 동료관계를 증진시키고, 교사 간의 적극적 인간관계는 교육활동과 교사 전문성 신장에 효과적임, ③ 수업개선 전략의 설계와 시행에 대한 책임감 부여는 교사 개인이 수업개선에 공헌할 수 있다는 인정과 성취감을 느끼게 해줄 뿐 아니라 학교개선에도 긍정적 효과를 가져올 수 있음","kw":["전문성 개발","동료 간 협동","자율성과 협동성","융통성 있게 운영","실제적 경험","경험을 공유","공동성취감","수업혁신","책임감 부여","학교개선"],"id":"haengjeong-e98"},{"ch":"CH07 장학론","t":"자기장학","q":"자기장학의 개념과 구체적인 방법 3가지를 서술하시오.","ans":"개념: 교사 개인이 자신의 전문적인 발달을 위하여 스스로 체계적인 계획을 세우고 실천하는 과정\n방법: ① 수업 녹화 후 분석, ② 학생의 수업평가 분석, ③ 대학원 진학, ④ 수업 관련 연수 및 워크숍 참여, ⑤ 수업 관련 전문가의 자문과 조언, ⑥ 교내ㆍ외 전문적 학습공동체 참여 등","kw":["전문적인 발달","스스로 체계적인 계획","수업 녹화 후 분석","학생의 수업평가 분석","대학원 진학","연수 및 워크숍","전문가의 자문과 조언","전문적 학습공동체"],"id":"haengjeong-e99"},{"ch":"CH07 장학론","t":"임상장학","q":"임상장학의 개념과 단계, 특징 2가지를 서술하시오.","ans":"개념: 실제적인 교수행위를 직접 관찰하여 자료를 수집하고 수업개선을 위해 장학담당자와 교사 간의 대면적 상호작용 속에서 교사의 행위와 활동을 분석하는 수업장학\n단계: 관찰 전 계획 ⇨ 수업관찰 및 협의 ⇨ 수업관찰 후 평가 (교사와 장학담당자 간의 관계 확립 ⇒ 교사와의 협의를 통한 수업계획 작성 ⇒ 수업관찰 전략 수립 ⇒ 수업관찰 ⇒ 교수ㆍ학습과정 분석 ⇒ 교사와의 협의회 전략 수립 ⇒ 협의회 ⇒ 새로운 계획 수립)\n특징: ① 인간은 본래 일에 대한 동기와 잠재력, 책임감, 목표의식을 가지고 있다는 'Y이론'의 입장에서 장학담당자와 교사 간의 지속적이고 성숙한 상호관계성의 형성과 유지를 강조함, ② 교사의 필요와 요청에 의해 교사와 장학담당자가 1:1의 친밀한 관계 속에서 행해짐. 장학담당자와 교사 간의 동료적 관계 형성과 유지를 강조함","kw":["실제적인 교수행위","직접 관찰","대면적 상호작용","수업장학","관찰 전 계획","수업관찰 및 협의","수업관찰 후 평가","Y이론","성숙한 상호관계성","1:1의 친밀한 관계","동료적 관계"],"id":"haengjeong-e100"},{"ch":"CH07 장학론","t":"컨설팅장학","q":"컨설팅장학의 기본원리 4가지와 유형 2가지를 서술하시오.","ans":"기본원리: ① 자발성: 교원의 자발적 의뢰에 기초해야 함, ② 전문성: 컨설팅단은 의뢰과제에 대한 내용적ㆍ방법적 전문성을 갖춘 전문가집단이어야 함, ③ 한시성: 한정된 시간 동안만 의뢰함, ④ 독립성: 의뢰교사와 독립적 관계를 유지함, ⑤ 자문성: 컨설팅단은 의뢰과제에 대해 자문함, ⑥ 학습성: 의뢰교사는 전문성을 심화시킬 수 있음\n유형: ① 운영범위에 따라: 교내에서 실시되는 '교내 컨설팅장학', 교육청 단위에서 이루어지는 '소지구 컨설팅장학', ② 의뢰과제의 성격에 따라: 진단형, 대안수립형, 해결과정 지원형, 교육훈련형 컨설팅장학 등으로 구분됨, ③ 의뢰영역에 따라: 교수ㆍ학습, 교육과정 운영, 생활지도, 학급 및 학교경영 등의 컨설팅장학으로 구분됨","kw":["자발성","전문성","한시성","독립성","자문성","학습성","교내 컨설팅장학","소지구 컨설팅장학","진단형","대안수립형","해결과정 지원형","교육훈련형"],"id":"haengjeong-e101"},{"ch":"CH07 장학론","t":"멘토링장학","q":"멘토링장학의 개념과 활성화 방안 2가지를 서술하시오.","ans":"개념: 경험과 지식이 있는 교사가 멘토를 담당해 경험과 지식이 적은 교사를 1:1로 지원하고 교수ㆍ학습 개선을 넘어 교사의 전문성 신장과 학교적응을 돕는 장학활동\n방안: ① 퇴임교원 등을 활용한 멘토 지원단 조직, ② 멘토 대상 정기교육 실시, ③ 멘토링 운영 매뉴얼을 작성ㆍ공유함, ④ 멘토링 우수사례 발굴 및 사례집 발간","kw":["경험과 지식이 있는 교사","1:1로 지원","전문성 신장","학교적응","퇴임교원","멘토 지원단","정기교육","운영 매뉴얼","우수사례 발굴"],"id":"haengjeong-e102"},{"ch":"CH07 장학론","t":"마이크로티칭","q":"마이크로티칭의 개념과 구체적인 방법 1가지, 장점과 단점 각각 2가지를 서술하시오.","ans":"개념: 소규모 학생들을 대상으로 짧은 시간 동안 한두 가지 내용을 가르치는 축소된 수업을 통해 장학담당자가 교사들에게 실제 수업사태를 기술ㆍ분석하여 교수기술을 제공해 주는 형태의 장학\n방법: 수업 시 고려해야 하는 다양한 요소(학생 수, 시간, 수업장소, 교수법 등)를 반영하여 실제 수업장면과 유사한 형태로 축소한 후 예비적ㆍ압축적인 방식으로 소규모 모의수업을 진행\n장점: ① 녹화된 화면을 통해 자신의 성취에 대하여 즉각적인 피드백을 받을 수 있음, ② 연습을 통한 수업능력 향상에 용이함\n단점: ① 수업을 처음부터 끝까지 경험하지는 못한다는 점에서 실제 교실로의 전이가 어려울 수 있음, ② 대규모 학생들이 참여할 때 학생들 간의 개인차를 설명하기가 어려울 수 있음","kw":["소규모 학생","축소된 수업","기술ㆍ분석","교수기술","예비적ㆍ압축적","소규모 모의수업","즉각적인 피드백","연습을 통한 수업능력 향상","실제 교실로의 전이","개인차"],"id":"haengjeong-e103"},{"ch":"CH08 교육재정","t":"학교회계제도","q":"학교회계제도의 특징 2가지와 장점 2가지를 서술하시오.","ans":"특징: ① 학교교육 예산을 총액으로 배분함, ② 교사 등 학교구성원의 참여와 학교운영위원회의 심의를 통해 자율적으로 우선순위를 정하여 세출예산을 편성ㆍ집행함, ③ 학교회계의 회계연도는 매년 3월 1일에 시작하여 다음 해 2월 말일에 종료함\n장점: ① 자율적인 예산운영을 통한 다양한 교육활동으로 학교교육의 질적 수준이 높아질 수 있음, ② 교사와 학부모가 학교재정 운영에 참여하여 투명성과 신뢰성이 높아짐, ③ 모든 세입과 세출을 일원화하여 학교재정의 효율적 운영이 가능해지고, 회계 관련 업무가 간소화됨, ④ 학교회계제도의 시행과 함께 사용료를 학교에서 직접 사용할 수 있도록 함으로써 학교가 지역사회 주민들이 이용하는 평생학습센터 기능을 할 수 있게 됨","kw":["총액으로 배분","학교운영위원회의 심의","자율적으로 우선순위","3월 1일","2월 말일","질적 수준","투명성과 신뢰성","세입과 세출을 일원화","평생학습센터"],"id":"haengjeong-e104"},{"ch":"CH08 교육재정","t":"품목별 예산제도","q":"품목별 예산제도의 개념과 장점, 단점 각각 1가지를 서술하시오.","ans":"개념: 지출대상을 (인건비, 시설비, 운영비) 등과 같이 품목별로 세분화하여 지출대상과 그 한계를 명확히 규정함으로써 예산집행에 있어 유용이나 부정을 방지하고자 하는 통제지향 예산제도\n장점: 행정부의 세출예산에 대한 엄격한 사전ㆍ사후 통제가 가능하고 회계책임을 분명히 할 수 있음\n단점: 지나치게 자유재량을 제한해 예산집행 시 예상치 못한 사태에 신축성(융통성) 있게 대응하기 어려움","kw":["품목별로 세분화","지출대상과 그 한계","유용이나 부정을 방지","통제지향","사전ㆍ사후 통제","회계책임","자유재량을 제한","신축성"],"id":"haengjeong-e105"},{"ch":"CH08 교육재정","t":"성과주의 예산제도","q":"성과주의 예산제도의 개념과 장점, 단점 각각 2가지를 서술하시오.","ans":"개념: 예산과목을 사업계획별ㆍ활동별로 분류한 다음 세부사업별로 업무측정단위를 선정하여 양적으로 표시하고 단위원가에 업무량을 곱하여 예산액을 표시함으로써 집행 성과를 측정ㆍ분석ㆍ평가할 수 있도록 하는 예산제도\n장점: ① 일반인이 그 기관이 어떤 사업을 어떻게 추진하고 있는지 용이하게 이해할 수 있음, ② 정책이나 계획 수립이 용이하고, 예산심의가 편리함\n단점: ① 업무측정단위의 선정, 성과측정이 어렵고, 단위원가 계산도 곤란함, ② 교육분야에 적용하는 데 여러 가지 어려움이 예상됨","kw":["사업계획별ㆍ활동별","업무측정단위","단위원가","집행 성과를 측정ㆍ분석ㆍ평가","일반인이 용이하게 이해","예산심의가 편리","성과측정이 어렵고","교육분야에 적용"],"id":"haengjeong-e106"},{"ch":"CH08 교육재정","t":"기획 예산제도","q":"기획 예산제도(PPBS)의 특징 2가지와 장점, 단점 각각 2가지를 서술하시오.","ans":"특징: ① 장기적 계획의 수립과 단기적 예산편성을 실행계획을 통해 유기적으로 통합ㆍ연결시킨 제도, ② 자원배분에 관한 의사결정을 일관성 있게 함, ③ 1년 단위로 운영되고 있는 전통적 예산제도에서 탈피하여 다년도 예산을 기본으로 하겠다는 5년 단위 연동예산제도\n장점: ① 사업계획의 목적, 대안, 효용 및 소요자원이 잘 연결되어 있어 상부의 의사결정이 용이하며 모든 것을 중앙집권적으로 처리할 수 있기 때문에 의사결정 과정을 일원화할 수 있음, ② 사업계획과 예산편성을 유기적으로 연결해 주기 때문에 자원배분이 합리적으로 이루어질 수 있음\n단점: ① 최고 의사결정자에게 정보가 집중되어 지나친 중앙집권적 성향을 초래할 수 있음, ② 목표달성 정도를 계량화하기 어렵고 계량적 분석기법의 도입에 한계가 있음","kw":["장기적 계획","단기적 예산편성","유기적으로 통합ㆍ연결","일관성","다년도 예산","5년 단위 연동예산제도","의사결정 과정을 일원화","자원배분이 합리적","중앙집권적 성향","계량화하기 어렵고"],"id":"haengjeong-e107"}]}};

/* ── util ── */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* deterministic shuffle from a string seed — 보기 순서가 매번 동일하게 유지됨 */
function seeded(seed){
  let h = 2166136261 >>> 0;
  for (let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return function(){ h ^= h<<13; h>>>=0; h ^= h>>17; h ^= h<<5; h>>>=0; return h/4294967296; };
}
function shuf(arr, rnd){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ── data access ── */
function pool(){
  let list = DATA[S.sub][S.mode];
  if (S.chap !== '__ALL__') list = list.filter(x => x.ch === S.chap);
  if (S.order){
    const map = new Map(list.map(x => [x.id, x]));
    const out = [];
    S.order.forEach(id => { if (map.has(id)) out.push(map.get(id)); });
    return out.length ? out : list;
  }
  return list;
}
function chaps(){
  const seen = [];
  DATA[S.sub][S.mode].forEach(x => { if (!seen.includes(x.ch)) seen.push(x.ch); });
  return seen;
}

/* ── render: tabs / bar ── */
function paintTabs(){
  const t = $('#tabs'); t.innerHTML = '';
  SUBS.forEach(s => {
    const b = el('button', 'tab' + (s===S.sub?' on':''), esc(s));
    b.style.setProperty('--acc', META[s].color);
    b.onclick = () => { S.sub=s; S.chap='__ALL__'; S.idx=0; S.order=null; paintAll(); };
    t.appendChild(b);
  });
  document.documentElement.style.setProperty('--acc', META[S.sub].color);
  document.documentElement.style.setProperty('--accent', META[S.sub].color);
}
function paintBar(){
  const sel = $('#chap'); sel.innerHTML='';
  const all = el('option', null, '전체 단원 (' + DATA[S.sub][S.mode].length + '문항)');
  all.value='__ALL__'; sel.appendChild(all);
  chaps().forEach(c => {
    const n = DATA[S.sub][S.mode].filter(x=>x.ch===c).length;
    const o = el('option', null, esc(c) + ' (' + n + ')'); o.value = c; sel.appendChild(o);
  });
  sel.value = S.chap;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m===S.mode));
}

/* ── render: MC ── */
function cardMC(it, i, n){
  const c = el('div','card');
  c.appendChild(el('span','chip acc', esc(it.ch)));
  c.appendChild(el('span','chip', esc(it.t)));
  c.appendChild(el('span','chip', (i+1) + ' / ' + n));
  c.appendChild(el('div','q', esc(it.q)));

  const rnd = seeded(it.id);
  const idxs = shuf(it.opts.map((_,k)=>k), rnd);          // 보기 순서 셔플
  const ansPos = idxs.indexOf(it.a);                       // 셔플 후 정답 위치

  const box = el('div','opts');
  const rec = LOG[it.id];
  const done = rec && rec.picked !== undefined;

  const CIRC = ['①','②','③','④'];
  idxs.forEach((orig, pos) => {
    const o = el('div','opt');
    o.appendChild(el('div','no', String(pos+1)));
    o.appendChild(el('div','body', esc(it.opts[orig])));
    // 해설 원문의 ①②③④ 표기와 대조할 수 있도록, 채점 후에만 원표기를 함께 노출
    if (done) o.appendChild(el('div','key', CIRC[orig]));
    if (done){
      o.classList.add('dis');
      if (pos === ansPos) o.classList.add('correct');
      else if (pos === rec.picked) o.classList.add('wrong');
    } else {
      o.onclick = () => {
        LOG[it.id] = { picked: pos, ok: pos === ansPos }; save();
        paintStage(); paintCount();
      };
    }
    box.appendChild(o);
  });
  c.appendChild(box);

  if (done){
    c.appendChild(el('div','verdict ' + (rec.ok?'o':'x'), rec.ok ? '✔ 정답입니다' : '✘ 오답 — 정답은 ' + (ansPos+1) + '번'));
    c.appendChild(el('div','exp', '<b>해설</b>' + esc(it.exp)));
    if (/[①②③④]/.test(it.exp))
      c.appendChild(el('div','note','※ 해설에 나오는 ①②③④ 중 보기를 가리키는 표기는, 보기가 매번 섞이므로 각 보기 오른쪽의 작은 번호와 대조하세요.'));
    const again = el('button','btn','다시 풀기');
    again.style.marginTop='12px';
    again.onclick = () => { delete LOG[it.id]; save(); paintStage(); paintCount(); };
    c.appendChild(again);
  }
  return c;
}

/* ── render: ESSAY ── */
function cardES(it, i, n){
  const c = el('div','card');
  c.appendChild(el('span','chip acc', esc(it.ch)));
  c.appendChild(el('span','chip', esc(it.t)));
  c.appendChild(el('span','chip', (i+1) + ' / ' + n));
  c.appendChild(el('div','q', esc(it.q)));

  const ta = el('textarea');
  ta.placeholder = '여기에 답안을 직접 작성한 뒤 아래 [모범답안 보기]를 눌러 대조하세요.';
  try { ta.value = (LOG['draft:'+it.id] || ''); } catch(e){}
  ta.oninput = () => { LOG['draft:'+it.id] = ta.value; save(); };
  c.appendChild(ta);

  const row = el('div','nav');
  const show = el('button','btn primary','모범답안 보기');
  const clr  = el('button','btn','지우기');
  row.appendChild(show); row.appendChild(clr);
  c.appendChild(row);

  const holder = el('div');
  c.appendChild(holder);

  clr.onclick = () => { ta.value=''; LOG['draft:'+it.id]=''; save(); };
  show.onclick = () => {
    if (holder.firstChild){ holder.innerHTML=''; show.textContent='모범답안 보기'; return; }
    show.textContent = '모범답안 닫기';
    const mine = ta.value.replace(/\s/g,'');
    if (it.kw && it.kw.length){
      const kw = el('div','kw');
      let hit = 0;
      it.kw.forEach(k => {
        const bare = k.replace(/\s/g,'');
        const on = bare && mine.includes(bare);
        if (on) hit++;
        const s = el('span', on?'hit':'', esc(k));
        kw.appendChild(s);
      });
      holder.appendChild(el('div','small','핵심 키워드 포함 ' + hit + ' / ' + it.kw.length + ' (내가 쓴 답안에 포함된 키워드는 초록색으로 표시됩니다)'));
      holder.appendChild(kw);
    }
    holder.appendChild(el('div','ans','<b>모범답안 (교재 해설편 원문)</b>' + esc(it.ans)));
    LOG[it.id] = { seen:true }; save(); paintCount();
  };
  return c;
}

/* ── stage ── */
function paintStage(){
  const list = pool(); const st = $('#stage'); st.innerHTML='';
  if (!list.length){ st.appendChild(el('div','empty','해당 조건의 문항이 없습니다.')); return; }
  if (S.idx >= list.length) S.idx = list.length-1;
  if (S.idx < 0) S.idx = 0;
  const it = list[S.idx];
  st.appendChild(S.mode==='mc' ? cardMC(it, S.idx, list.length) : cardES(it, S.idx, list.length));

  const nav = el('div','nav');
  const prev = el('button','btn','← 이전'), next = el('button','btn primary','다음 →');
  prev.onclick = () => { S.idx--; paintStage(); window.scrollTo({top:0,behavior:'smooth'}); };
  next.onclick = () => { S.idx++; paintStage(); window.scrollTo({top:0,behavior:'smooth'}); };
  prev.disabled = S.idx===0; next.disabled = S.idx===list.length-1;
  if (prev.disabled) prev.style.opacity=.4;
  if (next.disabled) next.style.opacity=.4;

  const jump = el('input'); jump.type='number'; jump.className='jump'; jump.min=1; jump.max=list.length; jump.value=S.idx+1;
  jump.onchange = () => { const v=parseInt(jump.value,10); if(v>=1&&v<=list.length){ S.idx=v-1; paintStage(); window.scrollTo({top:0,behavior:'smooth'}); } };

  nav.appendChild(prev);
  nav.appendChild(jump);
  nav.appendChild(el('span','cnt','/ ' + list.length));
  nav.appendChild(el('div','spacer'));

  if (S.mode==='mc'){
    const un = el('button','btn','✗ 오답만 보기');
    un.onclick = () => {
      const wrong = list.filter(x => LOG[x.id] && LOG[x.id].ok===false);
      if (!wrong.length){ alert('아직 오답이 없습니다.'); return; }
      S.order = wrong.map(x=>x.id); S.idx=0; paintStage(); paintCount();
    };
    nav.appendChild(un);
  }
  nav.appendChild(next);
  st.appendChild(nav);

  $('#bar').style.width = (((S.idx+1)/list.length)*100) + '%';
}

function paintCount(){
  const list = pool();
  if (S.mode==='mc'){
    let d=0,o=0;
    list.forEach(x => { const r=LOG[x.id]; if(r&&r.picked!==undefined){ d++; if(r.ok)o++; } });
    $('#cnt').innerHTML = '푼 문항 <b>'+d+'</b> / '+list.length+' · 정답 <b>'+o+'</b>' + (d? ' (정답률 '+Math.round(o/d*100)+'%)' : '');
  } else {
    let d=0; list.forEach(x => { if(LOG[x.id]&&LOG[x.id].seen) d++; });
    $('#cnt').innerHTML = '확인한 문항 <b>'+d+'</b> / '+list.length;
  }
}

function paintAll(){ paintTabs(); paintBar(); paintStage(); paintCount(); }

/* ── events ── */
document.querySelectorAll('#mode button').forEach(b => {
  b.onclick = () => { S.mode=b.dataset.m; S.chap='__ALL__'; S.idx=0; S.order=null; paintAll(); };
});
$('#chap').onchange = e => { S.chap = e.target.value; S.idx=0; S.order=null; paintStage(); paintCount(); };
$('#shuffle').onclick = () => {
  const list = DATA[S.sub][S.mode].filter(x => S.chap==='__ALL__' || x.ch===S.chap);
  S.order = shuf(list.map(x=>x.id), Math.random); S.idx=0; paintStage();
};
$('#reset').onclick = () => {
  if (!confirm('현재 저장된 풀이 기록과 작성한 답안을 모두 지울까요?')) return;
  LOG = {}; save(); paintStage(); paintCount();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight'){ S.idx++; paintStage(); }
  if (e.key==='ArrowLeft'){ S.idx--; paintStage(); }
});

paintAll();
</script>
</body>
</html>
