.","id":"simri-m227"},{"ch":"CH04 학습의 이해","t":"정교화 전략","q":"정교화의 세부전략 중 '자신의 말로 설명하기'에 대한 설명으로 옳은 것은?","opts":["설명된 내용을 그대로 반복하는 것이 아니라 자신의 언어로 설명하는 과정에서 기존에 형성되어 있던 지식과 새로운 지식의 연결이 촉진됨","구체적인 여러 사례를 제시하여 사전지식과 새로운 정보 간 연결을 촉진함","비유적으로 설명하여 이미 알고 있던 내용에 새로운 정보 연결을 용이하게 함","새로운 정보를 친숙한 장소에 연결하여 심상을 구성함"],"a":0,"exp":"'자신의 말로 설명하기'는 그대로 반복하는 것이 아니라 자신의 언어로 설명하는 과정에서 기존 지식과 새 지식의 연결이 촉진되는 전략이다. ②는 사례 제시, ③은 유추, ④는 기억술의 장소법이다.","id":"simri-m228"},{"ch":"CH04 학습의 이해","t":"기억술","q":"기억술 중 '장소법'에 해당하는 설명은?","opts":["새로운 정보를 자신과 친숙한 장소에 연결하여 심상을 구성하는 방법","어떤 사실을 단어나 숫자와 관련지어 기억하는 방법","학습한 단어의 의미와 단어를 심상으로 결합하여 부호화하는 방법","새로운 정보를 익숙한 리듬이 있는 기존의 노래에 가사로 넣어 따라 부르며 정교화하는 방법"],"a":0,"exp":"장소법은 새로운 정보를 자신과 친숙한 장소에 연결하여 심상을 구성하는 방법이다. ②는 연상법, ③은 핵심단어법, ④는 음운기억법이다.","id":"simri-m229"},{"ch":"CH04 학습의 이해","t":"기억술","q":"기억술 중 '음운기억법'에 대한 설명으로 옳은 것은?","opts":["새로운 정보를 익숙한 리듬이 있는 기존의 노래에 가사로 넣어 따라 부르며 정교화하는 방법","새로운 정보를 친숙한 장소에 연결하여 심상을 구성하는 방법","어떤 사실을 단어나 숫자와 관련지어 기억하는 방법","학습한 단어의 의미와 단어를 심상으로 결합하여 부호화하는 방법"],"a":0,"exp":"음운기억법은 새로운 정보를 익숙한 리듬이 있는 기존 노래에 가사로 넣어 따라 부르며 정교화하는 방법이다.","id":"simri-m230"},{"ch":"CH04 학습의 이해","t":"인출","q":"인출의 개념으로 옳은 것은?","opts":["장기기억에 저장된 정보를 작업기억으로 가져오는 과정","처리된 정보를 장기기억에 표상하는 과정","자극과 경험에 의미와 해석을 부여하는 과정","기억저장소에서 정보가 손실되는 것"],"a":0,"exp":"인출은 '장기기억에 저장된 정보를 작업기억으로 가져오는 과정'이다.","id":"simri-m231"},{"ch":"CH04 학습의 이해","t":"인출","q":"인출의 방법 중 '재인'에 해당하는 것은?","opts":["단서나 도움이 제공되는 상황에서 장기기억의 정보를 인출해내는 방법","어떠한 단서나 도움이 제공되지 않은 상태에서 장기기억의 정보를 인출하는 방법","정보를 소리 내어 반복하는 방법","정보를 기존 지식과 연결하는 방법"],"a":0,"exp":"재인은 '단서나 도움이 제공되는 상황에서 장기기억의 정보를 인출해내는 방법'이며, ②는 회상이다.","id":"simri-m232"},{"ch":"CH04 학습의 이해","t":"부호화 특수성","q":"'부호화 특수성(encoding specificity)'의 개념으로 옳은 것은?","opts":["장기기억에 저장된 정보를 인출할 수 있도록 도와주는 단서(인출단서)의 맥락이 부호화 맥락과 일치할 때 인출이 가장 잘됨","정보가 장기기억에 저장되어 있으나 해당 정보에 대한 접근이 제대로 되지 않아 발생하는 인출실패 현상","기억을 사용하지 않으면 시간이 경과함에 따라 기억 흔적이 약해짐","관련된 다른 내용의 기억이 회상하고자 하는 내용의 인출을 방해함"],"a":0,"exp":"부호화 특수성은 인출단서의 맥락이 부호화 맥락과 일치할 때 인출이 가장 잘 된다는 것이다. ②는 설단현상, ③은 쇠잔이론, ④는 간섭이론이다.","id":"simri-m233"},{"ch":"CH04 학습의 이해","t":"설단현상","q":"'설단현상'의 개념으로 옳은 것은?","opts":["정보가 장기기억에 저장되어 있으나 해당 정보에 대한 접근이 제대로 되지 않아 발생하는 인출실패의 한 가지 현상","인출단서의 맥락이 부호화 맥락과 일치할 때 인출이 잘 되는 현상","시간 경과에 따라 기억 흔적이 약해지는 현상","다른 기억이 인출을 방해하는 현상"],"a":0,"exp":"설단현상은 정보가 장기기억에 저장되어 있으나 접근이 제대로 되지 않아 발생하는 인출실패의 한 가지 현상이다.","id":"simri-m234"},{"ch":"CH04 학습의 이해","t":"망각","q":"망각의 개념으로 옳은 것은?","opts":["기억저장소에서 정보가 손실되거나 인출될 수 없는 것","장기기억의 정보를 작업기억으로 가져오는 과정","처리된 정보를 장기기억에 표상하는 과정","자극에 의식적으로 집중하는 과정"],"a":0,"exp":"망각은 '기억저장소에서 정보가 손실되거나 인출될 수 없는 것'이다.","id":"simri-m235"},{"ch":"CH04 학습의 이해","t":"망각","q":"망각의 원인을 설명하는 이론 중 '쇠잔이론(불용이론)'에 해당하는 설명은?","opts":["기억을 사용하지 않으면 시간이 경과함에 따라 기억 흔적이 약해진다고 설명","관련된 다른 내용의 기억이 회상하고자 하는 내용의 인출을 방해하여 망각이 일어난다고 설명","저장된 정보에 대해 접근하는 적절한 인출단서가 없기 때문에 기억 실패하는 것으로 설명","부호화 맥락과 인출 맥락이 일치하지 않기 때문이라고 설명"],"a":0,"exp":"쇠잔이론(불용이론)은 기억을 사용하지 않으면 시간 경과에 따라 기억 흔적이 약해진다고 설명한다. ②는 간섭이론, ③은 인출실패이론이다.","id":"simri-m236"},{"ch":"CH04 학습의 이해","t":"망각","q":"망각의 원인 중 '간섭이론'에 대한 설명으로 옳은 것은?","opts":["관련된 다른 내용의 기억이 회상하고자 하는 내용의 인출을 방해하여 망각이 일어난다고 설명","시간이 경과함에 따라 기억 흔적이 약해진다고 설명","적절한 인출단서가 없기 때문에 기억 실패한다고 설명","정보가 애초에 부호화되지 않았다고 설명"],"a":0,"exp":"간섭이론은 관련된 다른 내용의 기억이 회상하고자 하는 내용의 인출을 방해하여 망각이 일어난다고 설명한다.","id":"simri-m237"},{"ch":"CH04 학습의 이해","t":"메타인지","q":"메타인지의 개념으로 옳은 것은?","opts":["'인지에 대한 인지'로 자신의 인지과정에 대한 자각과 통제","하나의 맥락에서 이해한 것을 다른 맥락에 적용·응용하는 능력","장기기억에 저장된 정보를 작업기억으로 가져오는 과정","새롭고 적절한 산출물을 생산해내는 능력"],"a":0,"exp":"메타인지는 '인지에 대한 인지'로 자신의 인지과정에 대한 자각과 통제이다.","id":"simri-m238"},{"ch":"CH04 학습의 이해","t":"메타인지","q":"메타인지의 과정으로 옳은 것은?","opts":["계획 - 점검 - 평가 - 계획의 재수립","주의집중 - 파지 - 재생산 - 동기화","시연 - 조직화 - 정교화 - 인출","부호화 - 저장 - 인출 - 망각"],"a":0,"exp":"메타인지의 과정은 '계획 - 점검 - 평가 - 계획의 재수립'이다.","id":"simri-m239"},{"ch":"CH04 학습의 이해","t":"메타인지","q":"메타인지를 높이는 교수방법으로 제시된 것은?","opts":["설명 및 시범, 메타인지 체크리스트, 시험 및 백지쓰기","반복적인 시연과 암송","외적 보상의 제공","경쟁적 평가 실시"],"a":0,"exp":"메타인지를 높이는 교수방법은 ①설명 및 시범 ②메타인지 체크리스트 ③시험 및 백지쓰기이다.","id":"simri-m240"},{"ch":"CH04 학습의 이해","t":"전이","q":"전이의 개념으로 옳은 것은?","opts":["하나의 맥락에서 이해한 것을 다른 맥락에 적용·응용하는 능력","자신의 인지과정에 대한 자각과 통제","장기기억의 정보를 작업기억으로 가져오는 과정","경험의 결과로 나타나는 행동의 변화"],"a":0,"exp":"전이는 '하나의 맥락에서 이해한 것을 다른 맥락에 적용·응용하는 능력'이다.","id":"simri-m241"},{"ch":"CH04 학습의 이해","t":"전이","q":"'형식도야설'에 대한 설명으로 옳은 것은?","opts":["능력심리학에 기초하며, 인간의 마음을 구성하는 기본능력(기억력, 추리력, 주의력, 의지력, 상상력 등)을 연습을 통해 강화시킬 수 있고 이러한 일반정신능력을 잘 훈련시키면 그 효과가 여러 분야에 자동적으로 전이됨","이전의 학습과 새로운 학습의 과제나 상황이 동일한 요소를 많이 포함할수록 전이가 잘 일어남","학습의 기저에 있는 일반 원리나 법칙을 학습하게 되면 이후 학습에서의 전이가 잘 일어남","상황을 구성하는 요소들 간의 관계를 파악하거나 문제의 구조적 성질을 이해하였을 때 전이가 잘 일어남"],"a":0,"exp":"형식도야설은 능력심리학에 기초하며 일반정신능력을 훈련시키면 여러 분야에 자동적으로 전이된다고 본다. ②는 동일요소설, ③은 일반화설, ④는 형태이조설이다.","id":"simri-m242"},{"ch":"CH04 학습의 이해","t":"전이","q":"'동일요소설'에 대한 설명으로 옳은 것은?","opts":["이전의 학습과 새로운 학습의 과제나 상황이 동일한 요소를 많이 포함할수록 전이가 잘 일어남","일반정신능력을 훈련시키면 여러 분야에 자동적으로 전이됨","일반 원리나 법칙을 학습하면 이후 학습에서 전이가 잘 일어남","문제의 구조적 성질을 이해하였을 때 전이가 잘 일어남"],"a":0,"exp":"동일요소설은 이전 학습과 새로운 학습의 과제나 상황이 동일한 요소를 많이 포함할수록 전이가 잘 일어난다고 본다.","id":"simri-m243"},{"ch":"CH04 학습의 이해","t":"전이","q":"'형태이조설'에 대한 설명으로 옳은 것은?","opts":["형태주의 이론과 연관되며, 상황을 구성하는 요소들 간의 관계를 파악하거나 문제의 구조적 성질을 이해하였을 때 전이가 잘 일어남","동일한 요소를 많이 포함할수록 전이가 잘 일어남","일반 원리나 법칙을 학습하면 전이가 잘 일어남","기본 정신능력을 훈련시키면 자동적으로 전이됨"],"a":0,"exp":"형태이조설은 형태주의 이론과 연관되며, 요소들 간의 관계 파악이나 문제의 구조적 성질 이해 시 전이가 잘 일어난다고 본다.","id":"simri-m244"},{"ch":"CH04 학습의 이해","t":"전이","q":"'일반화설'에 대한 설명으로 옳은 것은?","opts":["학습의 기저에 있는 일반 원리나 법칙을 학습하게 되면 이후 학습에서의 전이가 잘 일어남","동일한 요소를 많이 포함할수록 전이가 잘 일어남","형태주의 이론과 연관되며 구조적 성질 이해 시 전이가 일어남","일반정신능력을 훈련시키면 자동적으로 전이됨"],"a":0,"exp":"일반화설은 학습의 기저에 있는 일반 원리나 법칙을 학습하면 이후 학습에서 전이가 잘 일어난다고 본다.","id":"simri-m245"},{"ch":"CH04 학습의 이해","t":"구성주의","q":"피아제의 인지적 구성주의에서 사회적 상호작용의 역할로 옳은 것은?","opts":["개인의 인지적 갈등을 유발할 수 있는 촉매제의 역할을 함","모든 고차원적 심리기능(비판적 사고, 논리적 사고)을 유발하는 역할을 함","학습자의 행동을 강화하는 역할을 함","정보를 부호화하는 역할을 함"],"a":0,"exp":"피아제의 인지적 구성주의에서 사회적 상호작용은 개인의 인지적 갈등을 유발할 수 있는 촉매제 역할을 한다. ②는 비고츠키의 사회적 구성주의이다.","id":"simri-m246"},{"ch":"CH04 학습의 이해","t":"구성주의","q":"비고츠키의 사회적 구성주의에서 사회적 상호작용의 역할로 옳은 것은?","opts":["모든 고차원적 심리기능(비판적 사고, 논리적 사고)을 유발하는 역할","개인의 인지적 갈등을 유발하는 촉매제 역할","행동을 강화하는 역할","정보를 인출하는 역할"],"a":0,"exp":"비고츠키의 사회적 구성주의에서 사회적 상호작용은 모든 고차원적 심리기능(비판적 사고, 논리적 사고)을 유발하는 역할을 한다.","id":"simri-m247"}],"essay":[{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)가 주장한 인지발달의 핵심 경향성 2가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 조직화: 아동이 환경과 직접 접촉하지 않고 내적인 과정을 통해 기존의 도식을 새롭고 더욱 복잡한 지적 구조로 통합하는 과정. 행동과 사고를 결합, 배열, 재결합, 재배열하여 논리적인 체계로 통합하는 것\n② 적응: 평형화 유지를 위해 도식과 새로운 경험을 조정하는 과정. 도식을 유지(동화)하거나 바꾸면서(조절) 이루어짐","kw":["조직화","적응","도식","통합","평형화","동화","조절"],"id":"simri-e0"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)의 이론에서 적응(adaptation)하기 위한 2가지 기본 과정의 명칭을 개념과 함께 제시하시오.","ans":"① 동화: 새로운 정보를 기존의 도식에 맞추는 것\n② 조절: 기존 도식이 새로운 정보를 받아들이는 데 적합하지 않을 때 기존의 도식을 바꾸거나 새로운 도식을 만들어내는 것","kw":["동화","조절","기존 도식","새로운 정보","새로운 도식"],"id":"simri-e1"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)가 주장한 평형화와 인지적 불평형의 개념을 각각 제시하시오.","ans":"평형화: 기존의 이해를 통해 새로운 경험을 이해·설명할 수 있는 인지적 상태 ⇒ 자신의 지식구조로 세상을 이해할 수 있는 평안한 상태\n인지적 불평형: 자신의 현재 도식으로는 문제를 해결하거나 상황을 이해할 수 없음을 인식할 때 발생하는 균형이 깨진 상태","kw":["평형화","인지적 불평형","지식구조","균형이 깨진","도식"],"id":"simri-e2"},{"ch":"CH01 학습자의 발달","t":"피아제 인지발달","q":"피아제(Piaget)에 따를 때 11세 이상의 청소년기 아동이 속하는 발달단계의 명칭과 이 단계 아동의 특징 2가지를 제시하시오.","ans":"명칭: 형식적 조작기\n특징\n① 논리적으로 추상적인 문제해결: 추상적·과학적 사고능력이 발달함\n② 가설연역적 추론: 가설을 가지고 추상적으로 사고할 수 있는 능력을 가짐\n③ 명제적 사고: 현실 세계의 상황을 고려하지 않고도 명제의 논리(언어적 진술)를 평가할 수 있음","kw":["형식적 조작기","추상적","가설연역적 추론","명제적 사고"],"id":"simri-e3"},{"ch":"CH01 학습자의 발달","t":"엘킨드","q":"엘킨드(Elkind)가 설명한 청소년기 자아중심성의 특징 2가지를 설명하시오.","ans":"상상적 관중: 자신이 모든 사람의 주의와 관심을 받는다고 믿으며, 자기의식이 심해지고 외모의 섬세한 부분까지 신경을 쓰거나 대중의 비판에 매우 민감해함\n개인적 신화: 자신이 특별하고 독특하다고 느끼며, 다른 사람이 이해할 수 없는 경험을 자신이 겪거나 자신이 가장 영예로운 수준 또는 절망의 깊은 곳에 있다고 생각함","kw":["상상적 관중","개인적 신화","주의와 관심","특별하고 독특"],"id":"simri-e4"},{"ch":"CH01 학습자의 발달","t":"피아제 교육적 방안","q":"피아제(Piaget)의 관점에서 학습자의 인지발달을 촉진하는 방안 3가지를 제시하시오.","ans":"① 사고능력의 신장: 특정 사실이나 개념 전수보다 각 발달단계에 적합한 사고능력 신장에 중점을 둠\n② 학습자의 자발성 중시: 아동이 스스로 지식을 구성해야 함\n③ 눈높이 교육의 실시: 교사는 아동의 인지발달 단계를 이해하는 지적 공감을 갖추고 인지발달 단계에 적절한 교육을 실시해야 함\n④ 대립전략 사용: 학습자에게 새로운 내용을 제시하여 동화와 조절의 인지활동을 활발하게 할 수 있도록 유도함\n⑤ 적절히 도전적인 과제 제시: 발달단계를 훌쩍 뛰어넘는 선행학습은 지양하고, 현실적으로 해결이 가능한 도전적인 과제를 제시함","kw":["사고능력의 신장","자발성","눈높이 교육","대립전략","도전적인 과제"],"id":"simri-e5"},{"ch":"CH01 학습자의 발달","t":"비고츠키","q":"비고츠키(Vygotsky)의 관점에서 인지발달 촉진요인 3가지를 제시하시오.","ans":"① 사회적 상호작용 ② 언어 ③ 문화 ④ 학습","kw":["사회적 상호작용","언어","문화","학습"],"id":"simri-e6"},{"ch":"CH01 학습자의 발달","t":"비고츠키 ZPD","q":"비고츠키(Vygotsky)가 주장한 근접발달영역(ZPD)의 개념, 근접발달영역의 의의 2가지와 근접발달영역에 영향을 주는 요인 2가지를 제시하시오.","ans":"개념: 아동이 타인의 도움 없이 스스로 문제를 해결할 수 있는 실제적 발달수준과 성인이나 유능한 또래들의 도움으로 문제를 해결할 수 있는 잠재적 발달수준 사이의 영역\n의의\n① 타인의 도움으로 성공할 수 있는 영역: 혼자서는 해결할 수 없지만 성인의 지도나 더 유능한 또래들과의 협력에 의해 성취할 수 있는 과제의 범위\n② 학습이 이루어져야 할 수준: 자신의 인지발달 수준을 조금 넘어서는 수준의 학습내용이 제시되어야 하고 교사 또는 또래의 도움이 제공되어야 함\n영향을 주는 요인\n① 학습자 개인차: 현재의 발달수준이 같더라도 근접발달영역은 개인에 따라 다를 수 있음\n② 교수의 질: 동일한 발달수준을 가진 아동의 근접발달영역은 교수·학습활동의 질에 따라 달라질 수 있음","kw":["실제적 발달수준","잠재적 발달수준","협력","학습자 개인차","교수의 질"],"id":"simri-e7"},{"ch":"CH01 학습자의 발달","t":"비계설정","q":"비계(Scaffolding)의 개념, 비계설정의 유의점 2가지와 효과적인 비계설정의 구성요소 4가지, 비계설정의 유형 2가지를 각각의 예시와 함께 제시하시오.","ans":"개념: 능숙한 참여자의 도움으로 미숙한 학습자가 문제를 잘 이해할 수 있도록 학습자의 현재 상황에 대한 적절한 도움을 조정·제공하는 것. 근접발달영역에서 제공되는 더 뛰어난 친구나 성인의 도움\n유의점\n① 학습자 스스로 학습할 수 있도록 지원해 주는 것으로 국한해야 함\n② 초기 단계에는 많은 도움을 제공하다가 점차적으로 줄이면서 스스로 해결할 수 있는 단계로 나아감\n③ 비계설정은 근접발달영역 내에서 아동에게 적합하고 도전적인 과제를 제시하고 아동의 요구와 능력에 맞추어 도움을 조정해야 함\n구성요소\n① 공동의 문제해결: 다른 사람들과 함께 과제를 해결할 때 가장 잘 배울 수 있음\n② 상호주관성: 어떤 과제에 대해서 서로 다르게 알고 있던 과제 참여자들이 공유된 이해에 도달하는 것\n③ 따뜻한 반응: 교사나 부모의 따뜻한 반응, 언어적 칭찬, 적절한 자신감 유발 등은 아동의 집중력과 도전정신 향상에 도움이 됨\n④ 자기조절 증진하기: 다양한 사회적 상호작용 과정에서 스스로의 사고와 행동을 조절하는 자기조절 능력을 증진할 수 있도록 해야 함\n유형\n① 모델링: 미술교사가 학생들에게 새로운 화법을 사용하여 그림을 그리도록 말하기 전에 먼저 시범 보이기\n② 소리 내어 생각하기: 물리교사가 칠판에 운동량 문제를 풀면서 자신의 생각을 소리 내어 말하기\n③ 질문: 물리교사가 학생들에게 중요한 시점에 질문을 던져 학생들이 문제를 보다 구체적으로 이해할 수 있도록 하기\n④ 자료조정: 체육교사가 농구 슛하는 기술을 가르치는 동안 농구대의 높이를 낮췄다가, 학생들이 능숙해짐에 따라 농구대의 높이를 조절하기\n⑤ 조언과 단서: 미취학 아동이 신발끈 묶는 것을 배울 때 교사가 줄을 엇갈리면서 끼우도록 옆에서 힌트를 주기","kw":["능숙한 참여자","조정","공동의 문제해결","상호주관성","따뜻한 반응","자기조절","모델링","소리 내어 생각하기","질문","자료조정","조언과 단서"],"id":"simri-e8"},{"ch":"CH01 학습자의 발달","t":"비고츠키 시사점","q":"비고츠키(Vygotsky) 이론의 교육적 시사점 3가지를 제시하시오.","ans":"① 협동학습의 적극적 활용: 학생이 서로 사회적 상호작용을 할 수 있도록 하고 자신이 이해한 것을 언어로 설명하는 기회 제공\n② 학습자의 근접발달영역 내에 있는 학습활동 만들기: 교사는 실제 발달수준보다는 발달 가능한 잠재력을 고려하여 근접발달영역 내에서 수업을 계획하고 학습활동을 만들어야 함\n③ 학습과 발달 촉진의 발판 제공: 교사가 학습자에게 다양한 비계설정을 제공하면 학습자가 해결할 수 있는 문제의 범위가 넓어짐","kw":["협동학습","근접발달영역","잠재력","비계설정","발판"],"id":"simri-e9"},{"ch":"CH01 학습자의 발달","t":"프로이트","q":"프로이트(Freud)의 심리성적 성격발달이론에 따를 때 정신의 구조 3가지의 명칭을 각각의 개념과 함께 설명하시오.","ans":"① 의식: 특별한 노력 없이도 항상 지각하고 있는 사고, 지각, 정서경험 등\n② 전의식: 평소에 지각하지 못하지만 약간의 노력을 기울이면 쉽게 의식으로 떠올릴 수 있는 기억과 경험\n③ 무의식: 지각하려 노력해도 쉽게 의식되지 않는 다양한 심리적 경험","kw":["의식","전의식","무의식","약간의 노력","심리적 경험"],"id":"simri-e10"},{"ch":"CH01 학습자의 발달","t":"프로이트","q":"프로이트(Freud)의 이론에 따를 때 성격의 구조 3가지의 명칭을 각각의 개념과 함께 설명하시오.","ans":"① 원초아 - 생물체로서의 본능: 현실 여건을 고려하지 않고 욕구를 즉각적으로 충족시키는 '쾌락원리'에 따라 작동함\n② 자아 - 욕구를 통제하는 힘: 환경에 대한 현실적인 적응을 담당하는 기능\n③ 초자아 - 도덕과 양심: 아동의 마음에 내면화된 부모의 가치관과 사회적 규범","kw":["원초아","쾌락원리","자아","현실적인 적응","초자아","도덕과 양심"],"id":"simri-e11"},{"ch":"CH01 학습자의 발달","t":"에릭슨","q":"에릭슨(Erikson)의 심리사회적 성격발달이론에서 4단계와 5단계의 발달과업과 이를 해결하지 못한 채 성장했을 때 겪는 어려움 각각 1가지, 이 이론의 청소년 교육에 대한 시사점 2가지를 제시하시오.","ans":"4단계 - 근면성 대 열등감: 성공을 경험하면 근면성과 유능감을 키우게 되지만 자신이 숙제나 과제를 제대로 할 능력이 없음을 인지하거나 실패할 경우에는 열등감을 느낌\n5단계 - 자아정체성 대 역할혼란: 이 시기의 주요 발달과제는 자아정체성을 형성하는 것으로, 자신이 누구이며 자신의 삶에서 중요한 것은 무엇인지에 대하여 스스로 규정한 신념체계. 긍정적인 자아정체성을 형성하기도 하지만 혼란과 시행착오로 절망감을 느끼는 심리적 유예를 겪기도 함\n시사점\n① 이 시기 청소년은 급격한 신체적·정서적 변화로 혼란을 느끼고 감수성이 예민해지므로 교사는 공평하고 중립적인 입장에서 학생을 지도해야 함\n② 다양한 경험과 상황을 통해서 자신의 가치와 신념을 시험·탐색할 수 있도록 격려해야 함\n③ 학생이 개인적인 문제를 해결함에 있어 필요한 자원을 찾을 수 있도록 지원함(ex. 교내 상담교사 및 프로그램 등)\n④ 학생들에게 실제적인 피드백을 제공하며, 발전할 때마다 격려해 주도록 함","kw":["근면성","열등감","자아정체성","역할혼란","심리적 유예","공평하고 중립적","탐색","피드백"],"id":"simri-e12"},{"ch":"CH01 학습자의 발달","t":"자아정체성","q":"에릭슨에 따르면 청소년기의 주요 발달과업은 자아정체성을 형성하는 것이다. 자아정체성 형성을 촉진하기 위한 전략 3가지를 제시하시오.","ans":"① 직업선택과 성인의 역할에 대한 다양한 모델을 제공함\n② 학생이 개인적 문제를 해결하는 데 필요한 자원을 찾을 수 있도록 도와줌\n③ 자신의 모습을 있는 그대로 수용하게 함","kw":["다양한 모델","자원","있는 그대로 수용"],"id":"simri-e13"},{"ch":"CH01 학습자의 발달","t":"마샤","q":"마샤(Marcia)의 정체성 지위이론에서 정체성을 분류하는 기준 2가지의 명칭을 각각의 개념과 함께 제시하고, 정체성 지위 4가지 상태의 명칭을 각각의 특징 2가지와 함께 제시하시오.","ans":"분류기준\n① 전념: 무엇인가에 헌신하고 있는가\n② 탐색/위기: 자신에게 무엇이 중요한지 알기 위하여 다양한 신념, 가치, 행동을 탐색하고 있는가\n정체성 지위\n① 정체성 혼미: 어떤 가능성도 탐색하지 않고 어떤 활동에도 전념하지 않은 상태. 타인이 어떤 일을 하는지, 내가 어떤 일을 해야 하는지에 대한 관심이 없음\n② 정체성 상실(유실): 정체성 형성에 있어 탐색과정 없이 헌신하는 상태. 정체성 확립을 위해 다양한 신념, 가치 등을 시험해 보지 않은 채 특정한 목표, 가치, 생활방식에 전념\n③ 정체성 유예: 직업이나 가치 선택에 있어 판단을 미뤄두고 다양한 탐색을 해 보는 상태. 현재 정체성 위기나 변화를 경험하고 있으며 정체성을 확립하기 위해 탐색함\n④ 정체성 성취(확립): 개인의 현실적 선택사항을 고려하고 충분히 탐색한 후 결정을 내리고, 자신이 선택한 것에 대해 전념하는 상태","kw":["전념","탐색","위기","정체성 혼미","정체성 상실","유실","정체성 유예","정체성 성취"],"id":"simri-e14"},{"ch":"CH01 학습자의 발달","t":"브론펜브레너","q":"브론펜브레너(Bronfenbrenner)가 생물생태학적 모형을 통해 제시한 생태학적 환경의 5가지 구조 체제의 명칭을 각각의 개념, 예시 1가지, 특징 1가지와 함께 제시하시오.","ans":"① 미시체계: 아동의 발달에 가장 강력한 영향을 주는 환경. 아동이 직접 접하는 직접적인 관계 및 활동. 예) 부모, 형제자매, 교사, 학교, 친구, 놀이활동 등\n② 중간체계: 미시체계 모든 요소들 간의 상호작용과 관계의 집합. 예) 교사-부모, 아동의 친구-아동의 형제 등의 상호작용이 아동에게 영향을 줌\n③ 외체계: 아동이 직접 접촉하지는 않지만 아동에게 간접적인 영향을 미치는 모든 사회적 구조. 예) 부모의 일터, 부모의 건강이나 고용상태, 가족의 종교, 가족의 친구들, 대중매체, 여가활동에 대한 지역사회의 자원 등\n④ 거시체계: 아동이 속하여 자란 문화이며 개인에게 영향을 미치는 관습, 법, 규범, 관념, 사회의 가치, 전통 등. 예) 사회·경제적 지위, 부, 빈곤, 인종, 지리적 위치, 이데올로기 등\n⑤ 시간체계: 시간의 차원으로 일생 동안 일어나는 인간의 변화, 사회·역사적 환경의 변화 등. 예) 아동의 입학, 이사, 부모의 이혼 등과 같은 일생에서 경험하는 변화 등","kw":["미시체계","중간체계","외체계","거시체계","시간체계","간접적인 영향","문화","일생"],"id":"simri-e15"},{"ch":"CH01 학습자의 발달","t":"사회적 조망수용","q":"사회적 조망수용능력의 개념과 이러한 능력이 발달한 아동의 특징 2가지를 제시하시오.","ans":"개념: 타인의 관점, 입장, 사고, 감정 등을 추론하여 이해하는 능력\n특징\n① 타인의 정서를 간접적으로 경험하는 감정이입 능력과 동정심을 가지고 있음. 어려운 사회적 문제를 효과적으로 잘 처리하는 사회적 문제해결 능력을 지님\n② 자신과 타인을 객체로 이해하고 타인의 관점에서 자신의 행동을 인지함으로써 타인의 의도, 태도, 감정을 추론할 수 있음","kw":["관점","추론","감정이입","동정심","사회적 문제해결"],"id":"simri-e16"},{"ch":"CH01 학습자의 발달","t":"셀만","q":"셀만(Selman)의 사회적 조망수용이론에 따를 때, 조망수용 단계별 명칭(0~4단계)을 각각의 특징 2가지와 함께 제시하시오.","ans":"0단계 - 자기중심적(미분화된) 조망수용(3~6세)\n∙타인을 자기중심적으로 봄 ⇒ 타인이 자신과 다른 관점(생각, 느낌)을 가지고 있다는 것을 이해하지 못함\n∙타인이 자신의 견해와 동일한 생각을 가진다고 여김 ⇒ 즉, 다른 사람들이 다른 관점을 가지고 있을 수 있음을 깨닫지 못함\n1단계 - 주관적(사회정보적) 조망수용(6~8세)\n∙타인과 자신이 동일한 상황에 대해서 조망이 다를 수 있다는 것은 이해하지만 여전히 자신의 입장에서 이해하려고 함\n∙자신의 행동을 타인의 조망에서 평가하기 어려움\n∙사람들이 다른 정보를 가지고 있으면 다른 조망을 가지게 된다고 생각함\n2단계 - 자기반성적 조망수용(8~10세)\n∙타인의 조망을 고려할 수 있고 타인도 자신의 조망을 고려할 수 있다는 것을 이해함\n∙다른 사람이 자신의 행동에 대해 어떻게 생각하는지 알 수 있으며, 다른 사람이 서로 다르게 생각하고 느낀다는 것을 앎\n∙다른 사람의 입장이 되어서 그 사람의 의도와 목적, 행동을 이해할 수 있음\n∙같은 정보를 가지고 있어도 사람들이 다른 조망을 가질 수 있음을 이해하지만 타인과 자신의 조망을 동시에 고려하지는 못함\n3단계 - 상호적(제3자적) 조망수용(10~12세)\n∙동시상호적으로 자신과 타인의 조망을 각각 이해할 수 있음\n∙타인과의 상호작용 속에서 발생하는 문제에 대해 제3자의 입장에서 객관적으로 생각할 수 있음\n∙즉, 자신과 상대방의 입장에서 벗어나 이해관계가 없는 제3자의 입장에서 자신과 상대방이 어떻게 보일지를 생각할 수 있음\n4단계 - 사회관습적 조망수용(12~15세(성인))\n∙동일한 상황에 대해 다른 조망을 가진다고 해서 그 조망이 틀렸다고 생각하지 않음\n∙자신이 타인의 조망을 완전하게 이해하지 못한다는 것을 이해함\n∙제3자의 입장을 넘어 사회 구성원이 갖는 일반화된 관점을 이해함","kw":["자기중심적","주관적","사회정보적","자기반성적","상호적","제3자적","사회관습적","일반화된 관점"],"id":"simri-e17"},{"ch":"CH01 학습자의 발달","t":"피아제 도덕성","q":"피아제(Piaget)의 이론에 따를 때, 전조작기에 해당하는 아동과 구체적 조작기를 넘어선 아동의 도덕성 발달단계 각각의 명칭을 특징 1가지와 함께 제시하시오.","ans":"① 전조작기 - 타율적 도덕성(4~8세)\n∙규칙과 질서는 권위 있는 사람에 의해 만들어져 절대적이고 수정 불가능한 것으로 인식하는 도덕적 사실주의를 따름\n∙아동은 외부의 규율과 법칙의 권위에 의존하여 행동의 결과에 따라서 선악을 판단하는 구속의 도덕성을 발달시킴\n② 구체적 조작기 이후 - 자율적 도덕성(8~12세)\n∙아동은 규칙이나 질서가 타인과의 협의를 통해서 만들어지고 수정될 수 있는 것이라고 생각함\n∙행동의 결과보다는 의도를 기준으로 선악을 판단함","kw":["타율적 도덕성","도덕적 사실주의","구속의 도덕성","자율적 도덕성","협의","의도"],"id":"simri-e18"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)가 주장한 도덕성 발달이론 중 전인습수준의 특징 1가지, 전인습수준 중 1단계와 2단계의 특징 각각 1가지를 제시하시오.","ans":"전인습수준: 사회적 인습을 무시하는 것이 아니라 전혀 고려하지 못하는 시기. 인습에 대한 인식 자체가 없기 때문에 권위적 인물의 지시나 명령, 자신과 타인의 손익을 기준으로 도덕판단을 함\n1단계 - 복종과 처벌 지향: 행위의 옳고 그름은 결과에 달려 있음\n2단계 - 개인적 쾌락주의(도구적 상대주의 지향): 도덕판단의 기준은 자신과 타인과의 욕구충족임","kw":["전인습수준","권위적 인물","손익","복종과 처벌","결과","개인적 쾌락주의","욕구충족"],"id":"simri-e19"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)가 주장한 도덕성 발달이론에서 인습수준의 특징 1가지, 인습수준 중 3단계와 4단계의 특징 각각 1가지를 제시하시오.","ans":"인습수준: 도덕적 추론이 자신의 결과에 의존하지 않고 옳고 그름에 대한 사회적인 관습을 받아들임. 타인의 기대와 사회의 질서를 절대적으로 존중하고 따르고자 하며 정당화하는 모습을 보임\n3단계 - 착한 소년/소녀 지향(대인 간 조화): 타인을 기쁘게 하고 타인에게 인정받는 행동이 도덕적으로 옳은 행동임\n4단계 - 사회질서와 권위 지향: 법과 질서를 준수하는 것이 도덕적으로 옳은 행위이므로 권위와 성문화된 규칙, 사회질서의 유지를 지향하며 사회 속에서 개인의 의무를 다하고자 함","kw":["인습수준","사회적인 관습","착한 소년","대인 간 조화","사회질서와 권위","성문화된 규칙"],"id":"simri-e20"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)가 주장한 도덕성 발달이론에서 후인습수준의 특징 1가지, 후인습수준 중 5단계와 6단계의 특징 각각 1가지를 제시하시오.","ans":"후인습수준: 법, 사회질서를 뛰어넘어 보편적 원리와 윤리에 기초해 도덕판단을 함\n5단계 - 사회계약 지향: 법은 사회적 계약(약속)에 따라 만들어진 것이므로 고정불변한 것이 아니라 약속을 다시 하면 얼마든지 수정될 수 있음을 이해함\n6단계 - 보편적 원리 지향: 가장 높은 발달단계로 정의, 평등, 존엄성과 같은 도덕적 원리에 기준한 도덕적 판단에 따름","kw":["후인습수준","보편적 원리","사회계약","수정","정의","평등","존엄성"],"id":"simri-e21"},{"ch":"CH01 학습자의 발달","t":"콜버그","q":"콜버그(Kohlberg)의 관점에서 도덕성을 발달시키는 방안 3가지를 제시하시오.","ans":"① 도덕적 발달수준에 기초한 교육: 학생의 도덕적 발달수준을 고려한 교육내용 제공\n② 도덕적 판단능력을 기르는 교육: '왜 그렇게 행동해야 하는지'에 대해 생각해 보도록 하여 학습자가 스스로 도덕적 판단을 할 수 있도록 함\n③ +1단계 전략: 도덕적 딜레마 상황 제시를 통해 도덕적 인지갈등을 유발. 이후 한 단계 높은 단계에 있는 학생들과의 토론을 통해 자신과 타인의 도덕적 사고를 비교하고 상위 수준의 도덕적 사고에 노출시킴으로써 도덕적 발달수준을 높임\n④ 도덕적 토론(딜레마) 수업: 도덕적 문제에 관한 토론을 통해 도덕적 사고력과 판단력을 증진시킴","kw":["도덕적 발달수준","도덕적 판단능력","+1단계 전략","인지갈등","도덕적 토론","딜레마"],"id":"simri-e22"},{"ch":"CH01 학습자의 발달","t":"레스트","q":"레스트(Rest)가 주장한 도덕성 이론의 특징 2가지와 도덕적 행동을 일으키는 4가지 심리과정의 명칭을 각각의 개념과 함께 제시하시오.","ans":"특징\n① 도덕성을 도덕적 행동의 표출에 주목함\n② 도덕성을 인지적 측면에 국한하지 않고 행동적 측면도 포함하여 종합적으로 파악함\n4가지 심리과정\n① 제1요소 - 도덕감수성: 상황 속에 내재된 도덕적 이슈를 인지하고 상황을 해석하며 자신의 행동이 타인에게 미칠 수 있는 영향이나 결과에 대해 미리 예측할 수 있는 능력\n② 제2요소 - 도덕판단력: 제1요소에서 자신의 행동이 타인에게 미칠 영향을 지각한 후 그 행동이 도덕적으로 옳고 정의로운지 판단하는 능력\n③ 제3요소 - 도덕동기화: 제2요소에서 자신의 행동이 옳다고 판단하였더라도 도덕적 가치를 다른 가치들보다 더 우위에 두고자 하는 동기부여가 충분히 이루어졌을 때 ⇒ 도덕적 행동이 표출됨\n④ 제4요소 - 도덕적 품성: 자아강도, 인내심, 용기 등의 특성들을 포함. 제1~3요소가 갖추어졌더라도 실제로 도덕적 행동을 실천하는 의지가 약하거나 외부의 압력에 견디는 인내심이나 용기가 부족할 경우 ⇒ 도덕적 행동 어려움","kw":["도덕적 행동의 표출","행동적 측면","도덕감수성","도덕판단력","도덕동기화","도덕적 품성","자아강도"],"id":"simri-e23"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 도덕성 발달이론의 특징 3가지와 길리건의 관점에서 도덕성을 발달시키는 방안 2가지를 제시하시오.","ans":"특징\n① 여성은 인간관계와 타인을 돌보는 것을 바탕으로 한 배려와 책임감을 중심으로 도덕적 판단을 함\n② 여성은 추상적인 도덕적 원리보다는 인간에 대한 책임을 강조하며 타인의 요구에 민감히 반응하고 타인과의 관계를 고려하는 대인지향적인 도덕적 사고를 함\n③ 여성의 도덕성이 자신의 필요에 몰두하는 이기적 단계에서 시작해 자신의 욕구보다는 타인의 입장을 중요시하는 도덕성 단계를 거쳐 타인은 물론 자신의 책임의 중요성을 인식하고 자신과 관련된 모든 사람에게 최선의 방법을 모색하는 도덕성으로 나아감\n방안\n① 학생들이 보살핌과 관련한 도덕적 주제에 대해 생각하고 토론할 수 있는 기회를 교육과정을 통해 제공\n② 돌봄의 주제로 교육과정 준비(조직)하기: 자신을 돌보기, 가족과 친구 돌보기, 낯선 사람과 세계를 돌보기 등의 주제 포함","kw":["배려","책임감","대인지향적","보살핌","돌봄의 주제","교육과정"],"id":"simri-e24"},{"ch":"CH01 학습자의 발달","t":"길리건","q":"길리건(Gilligan)의 이론에 따를 때, 도덕성이 발달하는 3수준 2전환기의 단계별 명칭을 각 단계별 특징 2가지와 함께 제시하시오.","ans":"① 수준1 - 자기지향: 자신의 이익과 생존에 자기중심적으로 몰두하는 단계. 자기 자신의 필요에만 관심을 가짐\n② 전환기1 - 이기심에서 책임감으로: 애착과 다른 사람과의 관계 형성이 중요해지는 단계. 도덕적 판단기준이 독립적이고 이기적인 것에서 관계와 책임감으로 옮겨가기 시작함\n③ 수준2 - 자기희생으로서의 선: 타인에 대한 배려, 책임감, 자기희생을 지향. 사회적 조망이 발달하면서 자신의 욕구를 억제하고 타인의 요구에 응하려 노력하게 됨\n④ 전환기2 - 선에서 진실로: 도덕적 판단기준이 자기 주변의 타인에서 보다 넓은 범위의 타인의 욕구와 통합되는 것으로 발전. 왜 다른 사람을 위해서 자신을 희생해야 하는가에 대한 의문을 가짐\n⑤ 수준3 - 비폭력 도덕성: 대인 간 도덕적 추론의 마지막 단계. 개인의 권리주장과 타인에 대한 책임이 조화를 이룬 상태로, 전체 인류에 대한 공감을 갖춤","kw":["자기지향","이기심에서 책임감으로","자기희생으로서의 선","선에서 진실로","비폭력 도덕성","조화","공감"],"id":"simri-e25"},{"ch":"CH02 학습자의 인지적 특성","t":"카텔·혼","q":"카텔(Cattell)과 혼(Horn)의 지능이론에 따를 때, 스피어만의 g요인과 써스톤의 기본정신능력을 구성하는 두 가지 요인의 명칭을 각각의 특징 2가지와 함께 제시하시오.","ans":"유동적 지능\n① 생물학적으로 결정되는 생리적·신경적 요인. 생리적 발달이 지속되는 청년기까지는 계속적으로 증가하나 청년기에 절정을 이루고 성인기 이후 감퇴함\n② 개인의 독특한 사고력, 기억력, 정보처리 속도 등의 능력에서 나타남\n결정적 지능\n① 환경, 경험, 문화, 교육의 영향을 받아 발달되는 지능. 연령의 영향을 받지 않으며 환경적 자극이 있다면 성인기 이후에도 꾸준히 발달함\n② 환경적응능력으로서 언어능력, 상식, 문제해결력 등의 능력에서 잘 나타남","kw":["유동적 지능","생리적","신경적","청년기","감퇴","결정적 지능","환경","경험","문화","교육","언어능력"],"id":"simri-e26"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너","q":"가드너(Gardner) 다중지능이론의 주요 주장 2가지와 다중지능 핵심성분 9가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"주요 주장\n① 9개 지능의 상호독립성: 9개의 지능은 각자의 능력이 구분되고 뇌의 특정 영역과 관련되어 있으며 각기 다른 발달적 경로를 따름\n② 인간의 잠재능력 확장: 기존의 IQ 검사 점수에서 벗어나 인간 개인이 지니고 있는 고유한 잠재능력의 범위를 확장시킴\n다중지능 핵심성분\n① 언어지능: 단어 의미, 소리, 언어의 구조, 언어 사용방법에 대한 민감성\n② 논리-수학지능: 논리적·수리적 유형에 대한 민감성과 구분능력\n③ 공간지능: 시·공간체계에 대한 예민한 지각\n④ 신체운동지능: 몸의 움직임을 통제하고 사물을 능숙하게 다루는 능력\n⑤ 음악지능: 음정, 리듬, 음색 등을 만들고 평가하는 능력\n⑥ 대인관계지능: 타인의 기분, 기질, 동기, 욕망을 구분하고 대응하는 능력\n⑦ 개인 내 지능: 자신의 감정에 충실하고 정서를 구분하는 능력\n⑧ 자연지능: 다양한 종을 구분하고 인지할 수 있는 능력\n⑨ 영적/존재론적 지능: 삶의 의미, 죽음, 인간적 조건 등에 대한 민감성","kw":["상호독립성","잠재능력 확장","언어지능","논리-수학지능","공간지능","신체운동지능","음악지능","대인관계지능","개인 내 지능","자연지능","영적","존재론적"],"id":"simri-e27"},{"ch":"CH02 학습자의 인지적 특성","t":"가드너","q":"가드너(Gardner) 다중지능이론이 갖는 교육적 시사점을 교육과정, 방법, 평가의 측면에서 각각 2가지씩 서술하시오.","ans":"① 교육과정: 9가지 다중지능이 골고루 반영되도록 교육과정을 다양화함. 9가지 다중지능을 통합할 수 있는 교육내용이 포함되어야 하며 여러 지능의 통합적 발달을 통해 전인교육이 가능함. 학생들의 지능과 관심의 차이를 인정하고, 스스로 배울 것을 선택할 수 있도록 장려함\n② 교수방법: 학생 간 지능의 구성 차이를 인정하고 개인차를 고려한 맞춤형 교육을 실시함. 학생의 강점지능을 활용하여 여러 과목을 가르치는 교수방법인 2차적 통로를 사용함\n③ 평가: 학생 간의 차이보다는 한 개인의 지능의 강점과 약점에 관심을 가지고 학생의 지능 발달을 위해 평가와 교육과정, 교수방법을 연계시킴. 다양한 형태의 수행평가를 통해 학생의 강점을 파악하고 적절한 학습방법을 제공함","kw":["다양화","통합","전인교육","맞춤형 교육","2차적 통로","강점과 약점","수행평가"],"id":"simri-e28"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그","q":"스턴버그(Sternberg) 삼원지능이론의 주요 주장 2가지와 지능을 구성하는 3가지 하위지능의 명칭을 각각의 개념과 함께 제시하시오.","ans":"주요 주장\n① 정보처리적 접근: 사람들이 세상에 대해 어떻게 학습하고, 알고 있는 것을 어떻게 조작하며, 알게 된 것을 어떻게 활용하는지에 대해 관심이 있음\n② 지능의 삼원론: 모든 사람에게 공통적으로 나타나는 인지과정을 강조함\n지능의 구성요소\n① 분석적 지능(구성요소적 지능, 요소이론): 개인의 지적 행동과 관련된 정신과정에 대한 지능. 문제를 분석, 판단, 평가, 비교, 대조하는 능력을 말함. '어떻게' 지적 행동이 발생되는가에 초점을 둠\n② 창의적 지능(경험적 지능, 경험이론): 새로운 환경을 효과적으로 다루고 익숙한 문제를 능숙하게 해결하는 능력과 관련된 지능. 경험을 통해서 증진됨\n③ 실제적 지능(맥락이론, 상황이론): 외부 세계와 관련된 지능. 환경에 적응하고, 환경을 자신에게 맞도록 변경하고, 개인의 목표와 일상생활 및 세계의 요구에 적절한 환경을 선택하는 능력","kw":["정보처리적 접근","지능의 삼원론","분석적 지능","창의적 지능","경험적","실제적 지능","맥락이론"],"id":"simri-e29"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그","q":"스턴버그(Sternberg) 삼원지능이론에 따를 때, 분석적 지능의 구성요소 3가지의 명칭을 각각의 기능과 함께 제시하시오.","ans":"① 메타요소(상위요소): 인간의 고등정신과정 ⇒ 수행요소와 지식획득요소를 실질적으로 통제하며 일반적인 메타인지, 인지전략과 유사함. 해결해야 될 과제의 본질을 파악하고, 그것을 해결하기 위해 계획을 세우고, 해결과정을 점검·평가하는 기능을 수행함\n② 수행요소: 메타요소인 고등정신과정을 실행하기 위한 하위수준의 과정 ⇒ 메타요소에 의해 설계된 계획이나 전략을 실제 실행에 옮김. 과제를 수행할 때 과제를 입력시키고, 관계를 추리하며, 가능한 해결전략을 비교하여 최선의 해결책을 탐색하는 요소\n③ 지식획득요소: 새로운 정보를 학습하는 데 사용하는 요소. 새로운 것을 학습할 때 적절한 정보와 무관한 정보를 구분하고, 새로운 정보를 기존의 정보에 관련시키는 정신과정의 기능","kw":["메타요소","상위요소","고등정신과정","수행요소","지식획득요소","점검","평가"],"id":"simri-e30"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그","q":"스턴버그(Sternberg) 삼원지능이론에 따를 때, 경험적 지능의 두 가지 능력의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 신기성을 다루는 능력: 통찰력과 새로운 상황을 효과적으로 다루는 능력\n② 정보처리를 자동화하는 능력: 새로운 해결책을 신속하게 일상적인 과정으로 바꾸어 인지적 노력 없이 적용 가능한 능력","kw":["신기성","통찰력","자동화","인지적 노력"],"id":"simri-e31"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그","q":"스턴버그(Sternberg)에 따를 때, 새로운 상황을 효과적으로 다루는 세 가지 통찰력의 명칭을 각각의 개념과 함께 제시하시오.","ans":"① 선택적 부호화: 사고나 문제해결 과정에서 중요하고 적절한 정보에 주의를 기울이는 능력\n② 선택적 결합: 처음에는 서로 관련 없는 요소들을 연관시켜 새로운 것을 창출해내는 능력\n③ 선택적 비교: 이미 갖고 있는 정보와 새로운 정보 사이의 관계를 비교하고 새로운 것을 유추해낼 수 있는 능력","kw":["선택적 부호화","선택적 결합","선택적 비교","유추"],"id":"simri-e32"},{"ch":"CH02 학습자의 인지적 특성","t":"스턴버그","q":"실제적 지능을 구성하는 능력 3가지와 실제적 지능의 특징 2가지를 제시하시오.","ans":"① 적응: 환경에 적응하는 능력\n② 변경: 환경을 자신에게 맞도록 변경하는 능력. 환경에 적응할 수 없을 때에는 환경을 조성하거나 변화시킴\n③ 선택: 개인의 목표와 일상생활 및 세계의 요구에 적절한 환경을 선택하는 능력. 환경을 변경할 수 없을 때에는 자신의 기술과 가치, 목표에 적합한 새로운 환경을 선택함\n특징\n① 문화 또는 하위문화, 시대, 생애주기에서 어떤 시기에 있는지에 따라 다름\n② 개인의 경험을 통해 획득되고 발전함","kw":["적응","변경","선택","하위문화","생애주기","경험"],"id":"simri-e33"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"정서지능의 개념, 골만(Goleman)의 관점에서 정서지능을 구성하는 4가지 요인, 정서지능을 높이는 교수-학습방법 2가지를 제시하시오.","ans":"개념: 자신이나 타인의 감정을 인지하고 조절하는 개인의 능력\n구성요인(골만): 개인적 능력 - 자기감정 인식, 자기감정 조절 + 자기동기부여 / 사회적 능력 - 타인감정 인식, 타인감정 조절(관계조절)\n교수-학습방법\n① 토의 및 토론, 협동학습 기반 프로젝트 학습, 협동학습, 목표기반 시나리오 등 ⇒ 사회적 상호작용을 함으로써 문제해결 과정에서 정서적 인지와 조절, 자기통제, 정서표현 능력을 향상시킴\n② 감정을 주제로 한 수업: 감정인식 수업, 감정조절 수업, 감정조사하기 등","kw":["감정을 인지하고 조절","자기감정 인식","자기감정 조절","타인감정 인식","관계조절","협동학습","감정을 주제로 한 수업"],"id":"simri-e34"},{"ch":"CH02 학습자의 인지적 특성","t":"정서지능","q":"샐로비(Salovey)와 메이어(Mayer)에 따를 때, 정서지능의 영역 4가지를 각각의 의미와 함께 제시하시오.","ans":"① 영역Ⅰ - 정서의 인식, 평가, 표현: 자신과 타인의 감정과 기분을 정확하게 이해하고 표현하는 능력\n② 영역Ⅱ - 정서를 통한 사고의 촉진: 중요한 사건에 주의를 기울이게 하여 사고를 형성하고 촉진할 수 있는 능력\n③ 영역Ⅲ - 정서의 이해와 분석: 정서를 이해하고 정서정보가 담고 있는 지식을 활용하는 능력\n④ 영역Ⅳ - 정서의 반성적 조절: 정서적-지적 성장의 향상을 위하여 정서를 의식적으로 조절하는 능력","kw":["인식","평가","표현","사고의 촉진","이해와 분석","반성적 조절"],"id":"simri-e35"},{"ch":"CH02 학습자의 인지적 특성","t":"지능지수","q":"지능지수 해석 시 유의점 3가지를 제시하시오.","ans":"① 지능지수는 단지 개인의 지적 기능 중 한 가지 지표로 생각해야 함\n② 지능검사는 부정확할 수도 있다는 합리적·융통적인 생각을 가져야 함\n③ 지능지수는 개인의 절대적 지적 수준이 아니라 상대적 지적 수준을 의미함","kw":["한 가지 지표","부정확","상대적 지적 수준"],"id":"simri-e36"},{"ch":"CH02 학습자의 인지적 특성","t":"문화공평검사","q":"문화공평검사의 개념과 종류 3가지를 각각의 특징 1가지와 함께 제시하시오.","ans":"개념: 문화적·경제적 배경의 영향에 따라서 점수가 달라지지 않도록 검사에서 문화적·경제적 요인을 제거한 검사\n종류\n① SOMPA: 웩슬러 아동용 지능검사를 해석하는 데 의료적·사회적·문화·인종적 요소를 고려한 척도를 포함하여 문화적·경제적 차이를 극복하고자 함\n② 카우프만 아동평가 종합검사: 아동의 연령에 따라 사용되는 검사의 수와 종류를 달리하여 아동의 학습잠재력과 성취도를 측정하는 검사\n③ 레이븐(Raven) 지능검사: 시·공간적 지각력과 추론능력을 통해 지적 능력을 평가하는 검사","kw":["문화적","경제적 요인 제거","SOMPA","카우프만","레이븐","시·공간적 지각력"],"id":"simri-e37"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성","q":"창의성의 개념과 창의성의 인지적 특성 5가지를 제시하시오.","ans":"개념: 새롭고 적절한 산출물을 생산해내는 능력\n인지적 특성\n① 유창성: 가능한 많은 양의 아이디어를 산출할 수 있는 능력\n② 융통성: 사고방식이나 관점을 변화시켜 다양한 해결책을 찾아내는 능력\n③ 독창성: 기존의 것과 다른 새롭고 독특한 아이디어를 생산하는 능력\n④ 정교성: 다듬어지지 않은 아이디어를 수정 및 검토하며 정교하게 조직하는 능력\n⑤ 민감성: 주변 환경과 사물에 대해 호기심을 느끼고 변화에 예민하게 반응하며 끊임없이 궁금증을 느끼고 탐색하고자 하는 태도","kw":["새롭고 적절한 산출물","유창성","융통성","독창성","정교성","민감성"],"id":"simri-e38"},{"ch":"CH02 학습자의 인지적 특성","t":"브레인스토밍","q":"브레인스토밍의 개념과 기본원리 2가지를 제시하시오.","ans":"개념: 문제해결을 위해서 제한 시간 동안 최대한 많은 생각을 해보는 기법\n기본원리\n① 비판금지: 자신이나 타인의 의견을 성급하게 판단하거나 비판하지 않음\n② 자유분방: 어떤 생각이라도 자유롭게 하고 그 발표의 자유도 허용함\n③ 양산: 가능한 많은 아이디어를 산출함\n④ 결합 및 개선: 두 개 이상의 아이디어를 결합시켜 새로운 아이디어를 만듦","kw":["제한 시간","비판금지","자유분방","양산","결합 및 개선"],"id":"simri-e39"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"시네틱스의 개념과 특징 1가지를 제시하시오.","ans":"개념: 서로 다른 성질이나 전혀 관련이 없는 요소를 비교하여 문제해결책을 찾도록 하는 기법\n특징: 유추와 비유를 통하여 개인이 당연하다고 받아들였던 요소를 이상한 것으로 파악하거나 이상한 것으로 받아들이던 것을 친밀한 것으로 받아들임으로써 사고에서의 민감성을 증진시킴","kw":["관련이 없는 요소","유추","비유","민감성"],"id":"simri-e40"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"PMI 기법의 개념과 특징 1가지를 제시하시오.","ans":"개념: 어떤 상황에 대해 긍정적인 면을 살펴보고(plus), 부정적인 면을 살펴본 뒤에(minus), 마지막으로 주목할 만한 가치가 있지만 중립적인 측면(interesting)을 생각하도록 함으로써 아이디어를 생성·평가하는 기법\n특징: 일반적으로 생성된 아이디어에 대해 좀 더 깊게 분석해보고자 할 때 사용하는 수렴적 사고기법","kw":["plus","minus","interesting","수렴적 사고기법"],"id":"simri-e41"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"SCAMPER 기법의 장점 1가지와 이 기법에 따를 때 사용할 수 있는 질문 2가지를 제시하시오.","ans":"장점: 실생활에 많은 도움을 주는 기법으로 창의성 함양에 사용되며 많은 양의 아이디어를 얻을 수 있음\n질문\n① 대체: 사람, 성분, 장소, 과정 등을 대체하면 어떨까?\n② 결합: 별개의 사물, 사람, 목적, 재료들을 어떻게 결합시킬까?\n③ 적용: 원래 기능과는 다른 용도에 응용·활용할 수 없을까?\n④ 수정, 크게, 작게: 향기, 색, 맛을 바꾸거나 모양을 크게·작게 하면 어떨까?\n⑤ 활용: 다른 용도로 활용할 수 있는 방법은?\n⑥ 제거: 부품 수를 줄이거나 구성요소 중 어느 것을 뺀다면?\n⑦ 반전: 앞, 뒤, 좌, 우, 안, 밖, 위, 아래, 원인, 결과 등을 거꾸로 한다면?","kw":["실생활","많은 양의 아이디어","대체","결합","적용","수정","활용","제거","반전"],"id":"simri-e42"},{"ch":"CH02 학습자의 인지적 특성","t":"창의성 기법","q":"문제가 되는 대상이나 아이디어의 다양한 속성을 목록으로 작성하여 세분화된 속성에 주의를 기울이고 새로운 아이디어를 얻는 데 용이하게 해주는 아이디어 창출기법의 명칭과, 6색 사고모자기법의 장점 2가지를 제시하시오.","ans":"명칭: 속성열거법\n6색 사고모자기법의 장점\n① 한정된 역할을 제시하여 자아의 손상 없이 자유롭게 사고하고 말할 수 있음\n② 문제해결에 필요한 다른 유형의 사고를 해보면서 새로운 관점을 획득하고, 습관적인 사고의 틀을 벗어날 수 있음","kw":["속성열거법","한정된 역할","자아의 손상","새로운 관점","습관적인 사고의 틀"],"id":"simri-e43"},{"ch":"CH02 학습자의 인지적 특성","t":"영재성","q":"렌줄리(Renzulli)가 주장한 영재성의 세 가지 요소를 설명하시오.","ans":"① 평균 이상의 능력: 특정 영역에서의 평균 이상 능력\n② 과제집착력: 과제를 해결하려는 의지와 노력\n③ 창의성: 사고의 유창성, 독창성, 융통성, 개방성 등","kw":["평균 이상의 능력","과제집착력","창의성","유창성","독창성","융통성","개방성"],"id":"simri-e44"},{"ch":"CH02 학습자의 인지적 특성","t":"영재교육","q":"교육과정을 압축하는 방법 2가지의 명칭을 각각의 개념, 장점과 단점 1가지씩과 함께 제시하시오.","ans":"① 속진: 영재학생이 동일한 교육과정을 좀 더 빨리 학습하도록 함. 학년을 속진하기도 하고, 대부분의 수업을 또래와 들으며 일부 과목만 속진하기도 함\n∙장점: 경제적인 면에서 효과적이며, 영재학생에게 지적 호기심을 제공할 수 있음\n∙단점: 교육과정의 수직적 운영으로 인하여 폭넓은 학습경험을 하지 못할 수 있음\n② 심화: 또래학생들과 함께 학습하되 영재학생이 좀 더 복잡하고 생각을 자극하는 과제를 다양하게 학습하도록 함\n∙장점: 학습자의 흥미, 관심에 따라서 연구과제를 설정할 수 있고, 실생활과 관련된 문제를 중심으로 학습하기 때문에 학습자의 동기를 유발하여 자발적인 학습과 창의적인 결과물을 낼 수 있음\n∙단점: 재정적인 부담이 크며, 프로그램 개발이 쉽지 않음","kw":["속진","심화","수직적 운영","폭넓은 학습경험","흥미","재정적인 부담"],"id":"simri-e45"},{"ch":"CH02 학습자의 인지적 특성","t":"학습양식","q":"학습양식의 개념과 학습양식의 의의 2가지를 제시하시오.","ans":"개념: 학습과 학업에 접근하는 방식. 학습환경에 대한 선호 또는 정보를 선택·처리·저장하는 방식\n의의\n① 자신의 학습양식을 이해하고 있는 학생은 신중하게 자신의 학습을 관리하고 효과적으로 학습하며 자의식을 개발할 수 있음\n② 교사는 학생의 학습양식을 파악하고 때로는 학생에게 새롭고 더 효과적인 학습양식을 제공할 필요가 있음\n③ 교사는 개별 학생들이 어떻게 학습에 접근하는지 파악함으로써 학생의 차이를 인정·수용·조절할 수 있음","kw":["접근하는 방식","선택","처리","저장","자의식","차이를 인정"],"id":"simri-e46"},{"ch":"CH02 학습자의 인지적 특성","t":"위트킨","q":"위트킨(Witkin)의 주장에 따를 때, 학습양식을 구분하는 기준을 설명하고, 이에 따른 학습양식의 유형 2가지의 명칭을 각각의 특징 3가지와 함께 제시하며, 유형에 따른 효과적인 교수법과 동기유발 전략 각각 1가지를 제시하시오.","ans":"학습양식 구분기준: 전체적인 장(환경, 맥락, 배경) 속에 포함된 자극을 지각하는 데 장이 얼마나 영향을 주는지에 따라 나눔\n[장독립형]\n특징: ∙분석적·논리적으로 지각 ∙구조화 능력이 우수 ∙상황을 분석하고 재조직·구조화하는 능력이 우수 ∙비구조화된 학습자료 선호\n효과적인 수업전략: ∙점수 등 비사회적 보상 ∙탐구-발견식 수업, 프로젝트법 등 ∙독자적으로 문제를 해결할 기회 제공\n동기유발 방식: 내적 동기 - 활동의 선택, 목표추구를 통해 동기화되는 경향. 외부 비판에 민감하지 않음 ⇒ 스스로 선택\n[장의존형]\n특징: ∙전체적·직관적으로 지각 ∙기존의 구조를 수용 ∙비구조화된 학습자료에 어려움을 겪음 ∙명료하게 구조화된 학습자료 선호\n효과적인 수업전략: ∙언어적 칭찬 등 사회적 보상 ∙직접교수법 ∙교사의 시범, 설명, 개별지도를 제공\n동기유발 방식: 외적 동기 - 언어적 칭찬, 외적 보상이 효과적인 동기유발. 외부 비판에 민감","kw":["장","장독립형","장의존형","분석적","전체적","직관적","비사회적 보상","사회적 보상","탐구-발견식","직접교수법","내적 동기","외적 동기"],"id":"simri-e47"},{"ch":"CH02 학습자의 인지적 특성","t":"케이건","q":"케이건(Kagan)이 인지양식을 분류한 기준을 설명하고, 분류에 따른 학습양식의 유형 2가지의 명칭을 각각의 특징 2가지, 이에 따른 지도방안 1가지와 함께 제시하시오.","ans":"인지양식 분류기준: 개념적 속도 - 반응속도와 반응오류\n[숙고형]\n∙행동하기 전에 정보를 수집하고 분석하는 것을 선호함\n∙문제해결 시 가능한 대안을 차분하게 심사숙고하여 실수가 적으나 느림\n∙다차원적인 복잡한 과제에서 높은 수행수준을 보임\n∙지도방안: 어렵고 까다로운 문제에 부딪혔을 때 건너뛰는 전략을 가르침\n[충동형]\n∙빠르게 행동으로 옮기는 것을 선호함\n∙문제해결 시 문제를 성급하게 해결하려고 하여 빠르나 실수가 많음\n∙단순한 문제에서 높은 수행수준을 보임\n∙지도방안: 인지적 자기교수 - 문제해결 과정을 말로 표현하도록 하여 충동성을 줄임. 사지선다의 경우 오답이라고 생각하는 것에 먼저 표시하여 충동성을 줄임","kw":["개념적 속도","반응속도","반응오류","숙고형","충동형","건너뛰는 전략","인지적 자기교수"],"id":"simri-e48"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브","q":"콜브(Kolb)의 이론에 따를 때, 학습유형을 구분하는 기준 2가지를 설명하시오.","ans":"정보지각방식의 유형\n① 구체적 경험을 통해 지각하는 유형(Learning by feeling): 직접 경험하고 깨달은 일을 통해 학습하는 것을 선호함. 대인관계를 중시함\n② 추상적으로 개념화하는 유형(Learning by thinking): 논리와 아이디어를 사용해 학습하고 문제를 해결함. 체계적 계획, 정확·논리적 사고\n정보처리방식의 유형\n① 활동적으로 실험하는 유형(Learning by doing): 실제로 문제를 해결하고자 실험을 시도함. 문제해결, 실제적 결론, 기술적 과제를 선호함\n② 반성적으로 관찰하는 유형(Learning by watching): 판단을 유보하고 주의 깊게 관찰하며, 여러 관점에서 사물을 파악하고 아이디어를 냄","kw":["정보지각방식","정보처리방식","구체적 경험","추상적 개념화","활동적 실험","반성적 관찰"],"id":"simri-e49"},{"ch":"CH02 학습자의 인지적 특성","t":"콜브","q":"콜브(Kolb)의 주장에 따를 때, 네 가지 학습유형의 명칭을 각각의 개념, 특징 1가지와 함께 제시하시오.","ans":"① 발산형 학습자(확산자): 구체적 경험을 통해 지각하고, 반성적으로 관찰하는 유형\n∙상상력이 뛰어나고 한 상황을 여러 관점에서 파악 가능하며, 아이디어가 많음\n② 동화형 학습자(융합자): 추상적으로 개념화하여 지각하고, 반성적으로 관찰하는 유형\n∙논리적 사고, 귀납적 추리에 능숙하고 넓은 범위의 아이디어를 종합하며 다각적으로 이해할 수 있어 이론적으로 모형을 만드는 것을 잘함\n③ 수렴형 학습자(수렴자): 추상적으로 개념화하여 지각하고, 활동적으로 실험하는 유형\n∙아이디어와 이론을 응용하는 능력과 의사결정, 문제해결 능력이 우수함. 기술적·과학적 과제에 강함\n④ 조절형 학습자(적응자): 구체적 경험을 통해 지각하고 활동적으로 실험하는 유형\n∙계획을 잘 실행하고 새로운 경험을 추구하며 새로운 상황에 잘 적응함. 문제해결 시 다른 사람에게 의존함","kw":["발산형","확산자","동화형","융합자","수렴형","조절형","적응자","귀납적 추리","의존"],"id":"simri-e50"},{"ch":"CH02 학습자의 인지적 특성","t":"정보처리방식","q":"학습상황에서 정보를 처리하는 방식 2가지를 각각의 학습에 대한 관점, 학습자 특성 1가지씩과 함께 설명하시오.","ans":"심층적 정보처리방식\n① 학습에 대한 관점: 학습활동을 기저에 깔린 개념이나 의미를 이해하는 방법으로 바라봄\n② 학습자 특성: 학습 그 자체를 위해 학습함 ⇒ 어떻게 평가될지에 대한 걱정을 덜 하는 편이며 동기화되어 있음\n피상적 정보처리방식\n① 학습에 대한 관점: 학습을 단순히 기억하는 것으로 접근하며 깊은 이해를 시도하지 않음\n② 학습자 특성: 학습 그 자체보다는 성적이나 외부 요소에 동기화되어 있음","kw":["심층적","피상적","기저","의미를 이해","단순히 기억","성적","외부 요소"],"id":"simri-e51"},{"ch":"CH03 학습자의 정의적 특성","t":"동기","q":"내재적 동기와 외재적 동기 각각의 개념, 특징 각 2가지를 제시하시오.","ans":"내재적 동기: 외부의 보상과 상관없이 주어진 과제를 하거나 활동하는 그 자체가 보상이 됨\n∙특징 ① 개인의 욕구, 흥미, 호기심, 즐거움과 같은 심리적 요인에 의한 동기화 ② 과제를 하거나 활동하는 그 자체가 보상\n외재적 동기: 외부로부터 보상을 얻으려는 것과 관련\n∙특징 ① 사회적 압력, 보상, 처벌과 같은 환경적 요인에 의한 동기화 ② 과제와 상관없이 외부의 보상을 추구","kw":["내재적 동기","외재적 동기","심리적 요인","환경적 요인","보상"],"id":"simri-e52"},{"ch":"CH03 학습자의 정의적 특성","t":"동기","q":"내재적 동기의 증진방안 3가지를 제시하시오.","ans":"① 외적 제약 사용의 최소화: 보상이나 감독과 같은 외적 제약을 최소한으로 사용하고 사용이 필요한 경우에는 점진적으로 사용을 줄임\n② 과제 선택의 자유와 가능성: 수행할 과제의 종류나 수준을 선택할 수 있도록 복수의 유형이나 수준을 제시하거나 과제 수행 절차나 순서에 자유를 줌\n③ 실패에 대한 노력귀인 권장: 실패에 대한 노력귀인은 좀 더 노력하면 좋은 결과를 얻을 수 있다는 기대를 상승시키고 수행에 대한 내재적 동기를 높일 수 있음\n④ 수행결과에 대한 구체적·정보적 피드백: 다른 사람과의 비교보다 수행의 질적 측면에 초점을 두고 구체적·즉각적인 피드백을 줌\n⑤ 적정 수준의 과제 난이도: 학생에게 적당히 어려운 과제를 제시함","kw":["외적 제약","과제 선택의 자유","노력귀인","구체적","정보적 피드백","과제 난이도"],"id":"simri-e53"},{"ch":"CH03 학습자의 정의적 특성","t":"매슬로우","q":"매슬로우 욕구위계이론의 특징 2가지, 결핍욕구의 종류 4가지와 성장욕구의 종류 3가지 각각의 명칭과 개념, 이 이론의 교육적 시사점 2가지를 제시하시오.","ans":"특징\n① 인본주의적(humanistic) 접근: 개인의 욕구나 내적 상태를 강조\n② 자기실현: 개인의 잠재적 능력을 실현하려는 심리적 욕구이자 삶의 궁극적인 목표\n③ 욕구의 위계성: 자기실현의 궁극적인 목표를 달성하려는 욕구는 그것에 선행하는 기본적인 욕구로부터 위계적으로 발달함\n결핍욕구\n∙생리적 욕구: 인간의 삶을 유지하기 위한 가장 기초적 욕구로 의식주, 성, 수면 등의 욕구\n∙안전의 욕구: 신체의 위협이나 위험, 불안, 공포, 박탈로부터 벗어나고자 하는 욕구\n∙소속의 욕구: 사회적 존재로서 친밀한 대인관계를 맺고, 애정과 소속감을 느끼고자 하는 욕구\n∙자존(자아존중감)의 욕구: 타인에게 가치 있는 존재가 되고 존중받고자 하는 욕구로 타인의 인정을 추구\n성장욕구\n∙지적 욕구: 새로운 것을 알고 이해하고자 하는 욕구\n∙심미적 욕구: 아름다움, 질서, 조화, 완성 등을 추구하는 욕구\n∙자아실현의 욕구: 자신이 타고난 능력 또는 성장 잠재력을 실행하려는 욕구\n시사점\n① 학생의 결핍욕구에 대한 교사의 관심\n② 안전하고 따뜻한 교실 분위기 조성","kw":["인본주의적","자기실현","욕구의 위계성","생리적 욕구","안전의 욕구","소속의 욕구","자존","지적 욕구","심미적 욕구","자아실현의 욕구","결핍욕구","교실 분위기"],"id":"simri-e54"},{"ch":"CH03 학습자의 정의적 특성","t":"로저스","q":"로저스(Rogers) 이론의 가정 1가지, 실현경향성의 개념, 개인의 실현경향 과정에 있어 주요한 요소 1가지를 설명하시오.","ans":"이론의 가정: 자아실현 욕구란 타고난 잠재력을 계발하기 위한 지속적인 노력의 욕구로, 이는 선천적인 것이라고 간주함\n실현경향성: 성장을 위해서는 '투쟁과 고통'이 수반되며 이러한 고통을 이겨나가는 것\n요소: 타인과의 상호작용 ⇒ 타인의 무조건적이고 긍정적인 관심은 개인이 충분히 기능하는 인간(fully functioning individual)으로 성장할 수 있게 함","kw":["선천적","투쟁과 고통","타인과의 상호작용","무조건적","긍정적인 관심","충분히 기능하는 인간"],"id":"simri-e55"},{"ch":"CH03 학습자의 정의적 특성","t":"자기장애전략","q":"코빙톤(Covington)이 주장한 자기장애전략의 개념, 자기장애전략이 나타나는 양상 2가지, 이 이론의 교육적 시사점 2가지를 제시하시오.","ans":"개념: 실패가 예견되는 상황에서 자기가치를 보호하기 위해 수행에 방해가 될 만한 방해물이나 핑계거리를 만들어 두는 행동\n자기장애전략(자기손상화전략)이 나타나는 양상\n① 언어적 자기장애전략: 실제 수행에 영향을 미칠 수 있는 부적응적인 행동을 하지 않으나, 변명거리를 찾음. 실제로 노력했더라도 노력하지 않았음을 강조하여 실패 상황에서 타인이 자신을 무능하다고 평가하는 것을 피하고 자기가치를 보호함\n② 행동적 자기장애전략: 실제 수행에 방해가 될 만한 부적응적 행동을 함으로써 저조한 수행결과를 방해행동으로 귀인함. 실제로 방해가 될 만한 행동을 하는 것이므로 언어적 자기장애전략에 비해 학업수행과 동기에 부정적인 영향을 미침\n시사점\n① 능력은 고정된 것이 아니라 노력에 의해 향상될 수 있는 것임을 강조함\n② 능력은 유동적이며, 능력을 신장시키는 데 있어 노력의 역할이 크다는 믿음을 갖게 함\n③ 도움을 요청하고 도움을 줄 것을 권장함","kw":["자기가치","핑계거리","언어적 자기장애전략","행동적 자기장애전략","변명거리","노력","도움을 요청"],"id":"simri-e56"},{"ch":"CH03 학습자의 정의적 특성","t":"자기결정성","q":"데시(Deci)와 라이언(Ryan)이 주장한 자기결정성의 개념, 이론을 구성하는 3가지 심리욕구의 명칭과 개념, 학교 상황에서 각각을 높일 수 있는 전략 2가지를 제시하시오.","ans":"자기결정성: 환경에 대하여 어떤 행동을 취할 것인지 스스로 결정하는 것. 개인의 의지를 사용하는 과정\n① 유능성 욕구: 자신이 능력 있는 사람이라는 믿음을 갖고 싶은 욕구\n∙전략: 도전적 과제 제공, 노력귀인, 칭찬과 비판, 구체적·즉각적 피드백, 도움 제공\n② 자율성 욕구: 자기결정성 이론의 핵심으로, 스스로 결정하고 행동하려 하며 외적 보상이나 압력보다 자신이 원하는 것에 따라 행동하려는 욕구\n∙전략: 학생들이 스스로 교실의 규칙과 절차 만들기, 스스로 학습목표 설정, 학생의 참여 수준이 높은 수업\n③ 관계성 욕구: 다른 사람들과 좋은 관계를 맺고자 하는 욕구\n∙전략: 인정과 믿음, 학생의 흥미와 복지에 대한 관심, 협동학습과 긍정적 상호작용","kw":["스스로 결정","유능성","자율성","관계성","도전적 과제","노력귀인","교실의 규칙","협동학습"],"id":"simri-e57"},{"ch":"CH03 학습자의 정의적 특성","t":"유기적 통합이론","q":"유기적 통합이론에서 동기유형을 구분하는 기준을 제시하시오.","ans":"기준: 개인이 수행해야 하는 행동의 가치가 내재화된 정도","kw":["내재화된 정도","행동의 가치"],"id":"simri-e58"},{"ch":"CH03 학습자의 정의적 특성","t":"기대×가치","q":"에클스(Eccles)와 위그필드(Wigfield)의 기대×가치이론에서 기대에 영향을 미치는 요소 5가지, 가치에 영향을 미치는 요소 4가지를 설명하고, 이 이론의 관점에서 동기를 높이는 방법 2가지를 제시하시오.","ans":"기대에 영향을 미치는 요소\n∙과제특수적 신념: 개인이 특정 과제 수행을 위해 필요한 능력을 얼마나 가지고 있다고 믿는가\n∙지각된 과제난이도: 해당 과제의 난이도에 대한 주관적 판단\n∙개인의 목표: 학습자가 가지고 있는 장기적 목표와 단기적 목표를 모두 포함\n∙자기도식: 스스로의 능력에 대한 자기개념으로 개인적 정체성과 사회적 정체성을 모두 포함하는 개념\n∙정서적 기억: 이전 경험에 대한 해석을 통해 얻게 되는 정서적인 반응 및 기억\n가치에 영향을 미치는 요소\n∙달성가치: 과제를 잘 수행하는 것이 나의 삶에서 가지는 가치\n∙내적가치(흥미): 과제를 수행하는 것이 나에게 즐거움을 주는지에 대한 가치\n∙효용가치: 과제가 실용적이며 미래의 목표를 달성하는 데 얼마나 도움이 되는지에 관한 가치\n∙비용: 과제에 참여함으로써 지불해야 하는 시간, 노력, 감정 등\n동기를 높이는 방법\n① 피드백 제공: 능력에 대한 합리적 인식 도움, 발전에 대한 긍정적 인식\n② 도전적, 적합한 수준의 난이도 과제 제시\n③ 교사의 가치부여: 교사가 학습 또는 과제에 어떤 가치를 부여하고 있는지 안내\n④ 비용 줄이기: 노력비용을 줄일 수 있는 학습활동 제시(쓸모없는 활동에 참여시키지 않기)","kw":["과제특수적 신념","지각된 과제난이도","개인의 목표","자기도식","정서적 기억","달성가치","내적가치","효용가치","비용","피드백","가치부여"],"id":"simri-e59"},{"ch":"CH03 학습자의 정의적 특성","t":"와이너 귀인","q":"와이너(Weiner)가 주장한 귀인의 개념과 지각된 원인의 인과차원 3가지를 설명하시오.","ans":"귀인: 결과와 관련된 '지각된' 원인으로, 성공이나 실패의 실제 원인이 아니라 학습자가 설명하는 원인. 학습자의 정서와 기대에 영향을 미치고 결과적으로 실제 수행에도 영향을 줌\n지각된 원인의 인과차원\n① 원인소재 - 성공과 실패의 원인을 자신의 내부 혹은 외부에 두는가의 차원\n② 안정성 - 성공과 실패의 원인이 시간의 경과나 과제에 따라서 변하는가 변하지 않는가\n③ 통제가능성 - 성공과 실패의 원인이 자신의 의지에 따라서 통제될 수 있는가 없는가","kw":["지각된 원인","정서","기대","원인소재","안정성","통제가능성"],"id":"simri-e60"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인","q":"귀인경향성의 영향 2가지와 실패를 누적적으로 경험한 학습자의 귀인경향성의 특징 1가지를 제시하시오.","ans":"귀인경향성의 영향: 학습자는 자신의 성공이나 실패의 원인을 귀인할 때 늘 비슷한 방식으로 반응하는 경향이 있음. 이는 앞으로 선택하는 과제의 종류, 과제의 수행 정도, 과제 지속력에 영향을 미침\n실패를 누적적으로 경험한 학습자의 귀인경향성의 특징: 학업의 실패를 내적 요인 ⇒ 자신의 무능력이나 노력의 부족으로 귀인하는 경향이 높음","kw":["비슷한 방식","과제의 종류","과제 지속력","내적 요인","무능력","노력의 부족"],"id":"simri-e61"},{"ch":"CH03 학습자의 정의적 특성","t":"귀인훈련","q":"귀인훈련의 필요성 1가지와 귀인훈련 3단계를 설명하시오.","ans":"필요성: 바람직한 귀인유형은 학습자의 동기를 향상시키며 결과 또한 향상시키므로 바람직하지 않은 귀인을 바람직한 귀인유형으로 바꾸어야 함\n귀인훈련 3단계\n① 1단계: 노력귀인을 하도록 함\n② 2단계: 전략귀인 활용 ⇒ 실패의 원인을 학습방법이나 학습전략으로 귀인하도록 하고 학생의 학습방법이나 습관을 점검하고 바꾸어 보도록 조언함\n③ 3단계: 포기귀인 유도 ⇒ 충분히 노력하였고 다양한 학습방법과 전략을 했음에도 실패했을 경우 학습자의 기대 자체를 수정하고 새로운 관심이나 길로 안내함","kw":["바람직한 귀인유형","노력귀인","전략귀인","포기귀인","기대 자체를 수정"],"id":"simri-e62"},{"ch":"CH03 학습자의 정의적 특성","t":"자기효능감","q":"자기효능감의 개념, 자기효능감의 정보원 4가지, 자기효능감을 증진시키는 방법 2가지를 제시하시오.","ans":"자기효능감: 특정한 목표를 달성해낼 수 있다는 능력에 대한 신념\n자기효능감의 정보원: ① 과거 경험 ② 대리경험 ③ 언어적 설득 ④ 심리적 상태\n증진방법\n① 성공경험 제공: 학생의 능력수준보다 약간 낮은 과제를 제시하여 성공경험을 갖게 함\n② 타인의 성공을 관찰: 자신과 비슷한 타인의 성취를 관찰하는 모델학습의 기회 제공\n③ 권위자의 설득: 교사나 부모의 긍정적인 평가 피드백\n④ 실패의 노력귀인: 실패의 원인을 능력보다 자신이 통제할 수 있는 노력으로 귀인하도록 함","kw":["능력에 대한 신념","과거 경험","대리경험","언어적 설득","심리적 상태","성공경험","모델학습","권위자의 설득","노력귀인"],"id":"simri-e63"},{"ch":"CH03 학습자의 정의적 특성","t":"교사효능감","q":"교사효능감의 개념, 교사효능감의 영향, 교사효능감을 높이는 방법 2가지를 제시하시오.","ans":"교사효능감: 교사들이 자신의 교수활동 관련 능력에 대해 지니고 있는 신념. 주어진 교육목표를 이루기 위해 요구되는 활동들을 계획·조직·실행하는 데 있어 필요한 자신의 능력에 대한 교사 개인의 신념\n영향: 교육성과에 영향을 미치는 중요 요인으로 수업 전·중·후의 교사활동에 영향을 미쳐 학생의 학업성취도에까지 영향을 미침\n높이는 방법\n① 성공적 수행: 변화를 위한 일을 교사들이 함께 성공적으로 수행했을 때\n② 대리경험: 다른 성공적인 학교로부터 학습할 때\n③ 사회적 설득: 교육지원청으로부터 변화에 대한 격려를 받았을 때","kw":["교수활동","계획","조직","실행","교육성과","학업성취도","성공적 수행","대리경험","사회적 설득"],"id":"simri-e64"},{"ch":"CH03 학습자의 정의적 특성","t":"드웩","q":"드웩(Dweck)의 능력에 대한 2가지 신념의 명칭을 각각의 개념과 함께 제시하고, 각 신념에 따른 목표지향과 학습전략, 부족함에 대한 반응을 설명하시오.","ans":"[고정적(실체적)/총체적 신념]\n∙지능은 고정되어 있음: 능력은 안정적이고 통제 불가능한 특성. 변화시킬 수 없는 타고난 개인의 특성\n∙수행목표 지향: 학습을 희생하더라도 똑똑해 보이고자 함\n∙학습전략: 피상적·기계적인 학습전략\n∙부족함에 대한 반응: 회피적, 방어적으로 대응. 자기손상화 전략을 사용\n[증가적/향상적/성장 신념]\n∙지능은 성장함: 능력은 비안정적이고 통제 가능. 개인의 노력으로 변화시킬 수 있는 특성\n∙숙달목표 지향: 힘들거나 위험 소지가 있어도 새로운 것을 배우고자 함\n∙학습전략: 심층적 인지전략, 메타인지전략\n∙부족함에 대한 반응: 학습의 기회로 인식. 자신의 부족함을 인정하고 직면함","kw":["고정적","실체적","증가적","성장 신념","수행목표","숙달목표","피상적","심층적 인지전략","자기손상화","학습의 기회"],"id":"simri-e65"},{"ch":"CH03 학습자의 정의적 특성","t":"학습된 무기력","q":"학습된 무기력의 개념, 학습된 무기력의 영향을 동기적·인지적·정서적 측면에서 설명하고, 학습자가 학습된 무기력에서 벗어나도록 돕는 방안 3가지를 제시하시오.","ans":"개념: 통제가 어려웠던 이전 경험에 근거하여 자신의 어떤 노력도 실패할 것이라 생각함. 개인이 과제를 달성할 능력이 없고 환경을 거의 통제할 수 없다고 생각하는 개인을 무력화시키는 신념\n학습된 무기력의 영향\n① 동기적 결손: 자발적으로 반응(학습, 노력)하려는 동기를 저하시킴\n② 인지적 결손: 자신의 반응이 실제로 효과가 있다는 것을 인지하지 못함\n③ 정서적 결손: 우울증이나 불안, 자존감의 저하와 같은 정서적 동요를 경험함\n방안\n① 실패로부터 과잉보호 금지\n② 통제감을 경험할 수 있는 환경 제공\n③ 반복적으로 어려운 과제를 부과하지 않기\n④ 구체적인 피드백\n⑤ 귀인 변경","kw":["무력화시키는 신념","동기적 결손","인지적 결손","정서적 결손","과잉보호","통제감","구체적인 피드백","귀인 변경"],"id":"simri-e66"},{"ch":"CH03 학습자의 정의적 특성","t":"목표지향성","q":"숙달목표, 수행목표의 개념과 목표에 따른 귀인, 정서적·인지적·행동적 특징 각각 1가지를 제시하시오.","ans":"숙달목표: 자신의 기준과 자기발전을 위하여 학습하고 숙달하고자 하는 목표. 역량 향상과 개발에 초점을 둠\n수행목표: 자신의 역량과 능력을 증명하려는 목표. 다른 사람과 비교하여 자신이 어떻게 평가될 것인지에 초점을 둠\n[귀인] 숙달목표: 긍정적, 적응적 귀인 / 노력, 적절한 전략, 충분한 지식 / 학습결과는 개인의 노력에 결부되는 것\n수행목표: 부정적, 부적응적 귀인 / 능력(능력 부족으로 인한 실패귀인) / 학습결과는 개인의 능력에 따른 것\n[정서] 숙달목표: 노력으로 인한 성공 ⇒ 자부심 / 노력 부족으로 인한 실패 ⇒ 죄책감 / 학습에 대한 긍정적 태도 / 학습에 대한 내재적 흥미\n수행목표: 실패 후의 부정적 정서 / 학습에 대한 무관심한 태도 / 학습에 대한 외재적 동기\n[인지] 숙달목표: 심층적인 인지처리 전략 사용 / 계획, 인식, 자기점검과 같은 자기조절 전략 사용\n수행목표: 표면적·기계적인 학습전략 사용\n[행동] 숙달목표: 도전적인 과제 선택 / 새로운 과제에 개방적·모험적 태도 / 높은 수준의 성취도 / 적응적인 도움행동 추구\n수행목표: 쉬운 과제 선택 / 새로운 것을 시도하는 것을 주저 / 낮은 수준의 성취도 / 적응적인 도움행동 부족","kw":["숙달목표","수행목표","적응적 귀인","부적응적 귀인","자부심","죄책감","심층적","표면적","도전적인 과제","쉬운 과제"],"id":"simri-e67"},{"ch":"CH03 학습자의 정의적 특성","t":"2×2 목표구조","q":"2×2 목표구조에 따를 때, 4가지 목표지향의 명칭을 각각의 개념 및 특징 1가지와 함께 제시하시오.","ans":"① 숙달접근목표: 과제를 이해하고 숙달하고자 하며, 학습자의 학습과 향상에 초점을 맞춘 목표\n∙특징 ① 과제를 이해하고 학습하기 위해 필요한 적절한 도움을 요청함 ② 심층적인 인지전략을 사용하며, 학습과제에 자신감을 가지고 접근함\n② 숙달회피목표: 과제를 완벽하게 이해하지 못하거나 학습하지 못하는 상황을 피하려는 목표\n∙특징 ① 오류를 범하는 것을 기피 ② 정답을 정확히 맞히는 것에 초점을 둔 완벽주의자적 경향\n③ 수행접근목표: 타인과의 비교에서 상대적으로 유능하다고 평가받으려는 목표\n∙특징 ① 피상적인 전략을 사용하고 목표에 이르는 정도까지만 노력을 기울임 ② 목표를 이룰 수 없다고 생각될 때 노력을 하지 않거나 부정행위를 하는 역기능도 존재함\n④ 수행회피목표: 자신이 무능해 보이거나 지는 것을 피하려는 목표\n∙특징 ① 수행접근목표를 가진 학생이 반복적인 실패 경험을 하면 수행회피목표를 가지게 됨 ② 방어적이고, 실패회피전략을 채택하며, 자기효능감이 낮고, 자신감이 부족하며, 시험과 과제에 대한 불안이 높음 ③ 실패를 반복할 경우는 학습된 무기력 상태의 학습자가 됨","kw":["숙달접근목표","숙달회피목표","수행접근목표","수행회피목표","완벽주의","피상적인 전략","실패회피전략","학습된 무기력"],"id":"simri-e68"},{"ch":"CH03 학습자의 정의적 특성","t":"흥미발달","q":"레닌거(Renninger)의 흥미발달 4단계 모형에 따를 때, 흥미발달의 방향성을 설명하고 흥미에 대한 교육적 적용 2가지를 제시하시오.","ans":"흥미발달 4단계: 상황적 흥미 발동 ⇒ 상황적 흥미 유지 ⇒ 개인적 흥미 발생 ⇒ 개인적 흥미 발달\n② 우연히 발생된 상황적 흥미가 유지되며 개인적 흥미가 생겨나고 발달함\n교육적 적용\n① 학습내용을 학생의 개인적 흥미와 연결 짓는 것이 도움이 됨\n② 가르칠 내용이 정해져 있을 경우, 상황적 흥미를 일으키는 것이 중요함\n③ 흥미의 발동뿐만 아니라 유지도 매우 중요함. 흥미의 유지를 위해서는 실생활 문제와의 연결, 공상을 통한 문제해결, 과제의 유용성을 강조하기와 같은 방법을 활용할 수 있음","kw":["상황적 흥미","개인적 흥미","발동","유지","실생활 문제","공상","유용성"],"id":"simri-e69"},{"ch":"CH03 학습자의 정의적 특성","t":"정서","q":"정적 정서와 부적 정서 각각의 예시 1가지, 기능 1가지를 제시하시오.","ans":"정적 정서\n∙예시: '행복한, 만족스러운, 흥미' 등 ⇒ 학생들의 학습에 긍정적 영향을 미침\n∙기능: 총체적·직관적인 문제해결과 관련됨\n부적 정서\n∙예시: '슬픈, 지루한, 불안함' 등 ⇒ 일반적으로 학생들의 학습에 부정적 영향을 미침\n∙기능: 분석적·세부적인 절차의 정보처리와 연관됨. 기피나 회피를 유발하지만, 세부사항에 초점을 두고 실수를 하지 않으려는 것 등을 포함하는 순응적인 기능도 있음","kw":["정적 정서","부적 정서","총체적","직관적","분석적","세부적","순응적인 기능"],"id":"simri-e70"},{"ch":"CH03 학습자의 정의적 특성","t":"몰입","q":"칙센트미하이(Csikszentmihalyi)에 따를 때, 몰입(flow)의 개념, 몰입을 위한 조건 2가지, 몰입경험의 특징 2가지를 제시하시오.","ans":"몰입의 개념: 개인이 흥미를 느끼는 과제 수행에 몰입하여 '최적경험'을 하는 심리상태. 활동이 주는 즐거움 때문에 반복적으로 그 활동을 하려고 하는 것으로 행위에 완전히 몰입한 집중상태\n몰입의 조건\n① 자신이 가진 능력(기술) 수준과 도전하는 과제 수준의 적절한 조화\n② 명확하고 근접한 목표와 과제의 진행 상태에 대한 즉각적인 피드백\n몰입의 특징\n① 도전과 기술의 균형 ② 행동과 지각의 일치 ③ 제한된 자극에 대한 주의집중 ④ 자의식의 상실 ⑤ 행위와 환경에 대한 통제감 ⑥ 자기목적적 경험 ⑦ 시간의 변형된 느낌(시간이 빠르거나 느리게 간다고 지각함)","kw":["최적경험","도전과 기술의 균형","즉각적인 피드백","자의식의 상실","통제감","자기목적적","시간의 변형"],"id":"simri-e71"},{"ch":"CH04 학습의 이해","t":"행동주의","q":"행동주의의 관점에 따를 때 학습의 개념과 고전적 조건형성의 과정에서 가장 중요한 연합을 설명하시오.","ans":"행동주의의 관점에서의 학습: 경험의 결과로 나타나는 관찰 가능한 행동의 변화\n고전적 조건형성의 과정에서 가장 중요한 연합: 무조건자극(본능적인 생리반응 또는 정서반응을 일으키는 사물이나 사건)과 중성자극(무조건자극과 연합되기 이전의 사물이나 사건)의 연합","kw":["관찰 가능한 행동의 변화","무조건자극","중성자극","연합"],"id":"simri-e72"},{"ch":"CH04 학습의 이해","t":"강화와 처벌","q":"강화와 처벌의 개념과 각각의 종류 2가지를 제시하시오.","ans":"강화: 행동이 다시 나타날 가능성을 증가시키는 사건\n∙종류 ① 정적 강화: 좋아하는 것을 수여함으로써 특정 자극을 얻기 위한 행동이 증가하는 것 ② 부적 강화: 싫어하는 상황을 없애줌으로써 특정 자극을 제거하기 위한 행동이 증가하는 것\n처벌: 행동이 다시 나타날 가능성을 감소시키는 사건\n∙종류 ① 수여성 처벌: 특정 행동에 자극을 수여함으로써 행동을 감소시키는 것 ② 제거형 처벌: 특정 행동에 자극을 제거함으로써 행동을 감소시키는 것","kw":["증가시키는 사건","감소시키는 사건","정적 강화","부적 강화","수여성 처벌","제거형 처벌"],"id":"simri-e73"},{"ch":"CH04 학습의 이해","t":"강화계획","q":"간헐적 강화의 종류 2가지를 설명하고, 일반적으로 가장 높은 행동빈도를 장기간 이끌어낸다고 알려져 있는 강화의 명칭을 개념과 함께 설명하시오.","ans":"간헐적 강화의 종류\n① 간격강화: 강화 간 시간을 중심으로 세워진 강화계획. 행동의 빈도와 관계없이 일정 시간 간격이 지나면 강화가 주어지는 것\n② 비율강화: 강화할 행동의 빈도를 중심으로 세워진 강화계획. 시간이 아닌 행동이 일어나는 횟수에 따라 강화가 주어지는 것\n가장 높은 행동빈도를 장기간 이끌어낼 수 있는 강화: 변동비율강화","kw":["간격강화","비율강화","시간 간격","행동의 빈도","변동비율강화"],"id":"simri-e74"},{"ch":"CH04 학습의 이해","t":"토큰강화","q":"토큰강화(token reinforcement)의 개념과 장점 1가지를 제시하시오.","ans":"개념: 바람직한 목표행동 수행 시 다른 물건으로 교환 가능한 토큰(상징물)을 제공하는 방법\n장점: 강화물이 포화되는 현상을 어느 정도 막을 수 있음","kw":["교환 가능한 토큰","상징물","강화물","포화"],"id":"simri-e75"},{"ch":"CH04 학습의 이해","t":"행동수정","q":"체계적 둔감화의 목적을 설명하시오.","ans":"목적: 불안을 일으키는 자극에 대해 불안을 가장 적게 일으키는 자극부터 가장 많이 일으키는 자극의 순서로 불안 위계표를 작성하고 역조건화를 통해 불안을 형성한 조건형성을 깨뜨리는 방법","kw":["불안 위계표","역조건화","조건형성을 깨뜨리는"],"id":"simri-e76"},{"ch":"CH04 학습의 이해","t":"행동수정","q":"프리맥(Premack)의 원리의 개념과 예시 1가지를 제시하시오.","ans":"개념: 행동에 대한 상대적인 선호 차이를 이용하는 것으로, 상대적으로 덜 좋아하는 행동(향상시키고자 하는 행동)을 마친 이후에 더 좋아하는 행동을 할 수 있게 하는 방법\n예) 숙제하기보다 축구하기를 좋아하는 학생에게 숙제를 하면 축구를 할 수 있게 해주기","kw":["상대적인 선호 차이","덜 좋아하는 행동","더 좋아하는 행동"],"id":"simri-e77"},{"ch":"CH04 학습의 이해","t":"행동수정","q":"타임아웃의 개념을 제시하시오.","ans":"개념: 잘못된 행동을 한 아동을 다른 장소에 잠시 격리시키는 방법","kw":["격리","잘못된 행동","다른 장소"],"id":"simri-e78"},{"ch":"CH04 학습의 이해","t":"반두라","q":"반두라(Bandura)의 상호결정주의 관점의 특징 2가지와 구성요소의 명칭을 각각을 예시 1가지와 함께 제시하시오.","ans":"상호결정주의\n① 환경, 개인, 행동 간의 관계가 쌍방향적이라는 관점\n② 환경, 개인, 행동이 분리된 것처럼 보이지만 상호의존적으로 개인의 기능에 영향을 미침\n구성요소\n① 환경: 모델의 행동, 모델 행동의 결과, 주변 상황 등\n② 개인: 자기효능감, 기대, 목표 등\n③ 행동: 개인의 반응적 행동","kw":["쌍방향적","상호의존적","환경","개인","행동","자기효능감"],"id":"simri-e79"},{"ch":"CH04 학습의 이해","t":"모델링","q":"반두라(Bandura)가 주장한 모델링의 개념, 모델링의 효과 2가지, 모델링의 과정 4단계를 설명하시오.","ans":"개념: 한 명 또는 여러 명의 모델을 관찰한 결과로 발생한 행동·인지·정서의 변화\n효과\n① 새로운 행동의 학습: 모델 관찰을 통해 새로운 행동을 학습함\n② 이미 학습한 행동의 촉진: 이미 알고 있던 행동을 이끌어냄\n③ 억제의 변화: 대리처벌이나 대리강화를 관찰했을 때 옳지 않은 행동을 약화 또는 강화시킴\n과정: 주의집중 - 파지 - 재생산 - 동기화","kw":["행동·인지·정서의 변화","새로운 행동의 학습","촉진","억제의 변화","대리처벌","주의집중","파지","재생산","동기화"],"id":"simri-e80"},{"ch":"CH04 학습의 이해","t":"자기조절학습","q":"자기조절학습의 개념, 자기조절학습의 하위요소 3가지를 설명하고 각각을 촉진하는 전략 1가지씩 제시하시오.","ans":"개념: 목표를 세우고 도달할 수 있도록 이끌어주는 동기, 사고과정, 전략, 행동 등을 계획, 점검, 평가하는 일련의 학습과정\n① 인지조절 - 내용: 인지전략(시연, 정교화, 조직화), 메타인지전략(계획, 점검, 조절, 평가) / 구체적 전략: 시험 준비를 위해 복습계획서를 세우고 점검하기, 매일/일주일 목표 세우기, 할 일 목록 만들기\n② 동기조절 - 내용: 과제가치 인식, 숙달목표 지향, 자기효능감, 통제인식 / 구체적 전략: 이번 학습으로 이루고자 하는 나의 목표가 무엇인지 생각해보기\n③ 행동조절 - 내용: 행동통제, 시간관리, 도움추구, 물리적 환경 추구 / 구체적 전략: 타이머를 사용해서 자기 학습시간 측정하고 점검하기","kw":["인지조절","동기조절","행동조절","인지전략","메타인지전략","과제가치","시간관리","도움추구"],"id":"simri-e81"},{"ch":"CH04 학습의 이해","t":"작업기억","q":"작업기억(Working memory)의 용량의 한계를 극복하기 위한 전략 3가지를 설명하시오.","ans":"① 자동화: 자각이나 의식적인 노력 없이 수행할 수 있는 정신적 조작의 사용\n② 청킹(의미 덩이짓기): 정보의 개별 단위를 보다 크고 의미 있는 단위로 묶는 정신적 과정\n③ 이중처리: 시각과 청각의 두 가지 구성요소가 작업기억에서 함께 정보를 처리하는 방식","kw":["자동화","청킹","의미 덩이짓기","이중처리","시각","청각"],"id":"simri-e82"},{"ch":"CH04 학습의 이해","t":"정보처리","q":"감각기억에서 단기기억·작업기억으로 가져오는 과정에서 이루어지는 정보처리 2가지의 명칭을 각각의 개념과 함께 제시하시오.","ans":"주의집중: 자극에 의식적으로 집중하는 주의집중 과정\n지각: 자극과 경험에 의미와 해석을 부여하는 과정","kw":["주의집중","지각","의미와 해석"],"id":"simri-e83"},{"ch":"CH04 학습의 이해","t":"부호화","q":"부호화(encoding)의 개념과 부호화를 위한 전략 7가지를 설명하시오.","ans":"개념: 처리된 정보들을 장기기억에 표상하는 과정\n전략\n① 시연: 정보의 형태를 바꾸지 않고 소리 내거나 마음속으로 계속해서 반복하는 과정\n② 조직화: 학습할 내용 중 서로 관련이 있거나 의미가 연결되는 것끼리 범주화하거나 유형을 묶어 제시하는 학습전략. 예) 도표, 구조도, 목차나 개요, 모형 제시 등\n③ 심상화: 개념에 대한 마음속 그림을 만드는 과정임. 예) 사진, 그림, 영상자료나 다이어그램, 모형 제시\n④ 맥락화: 새로 배울 내용을 맥락(상황)과 연결 짓는 학습전략\n⑤ 정교화: 새로운 정보를 기존에 알고 있던 지식과 연결하여 새로운 정보의 유의미성을 증가시킴. 예) 사례 제시, 유추, 자신의 말로 설명하기, 기억술 등\n⑥ 도식활성화: 새로운 지식이 기존 지식과 연결될 수 있도록 적절한 사전지식을 활성화시키는 부호화 전략\n⑦ 생성: 새로운 정보와 관련된 정보를 스스로 만들어내는 학습전략","kw":["장기기억에 표상","시연","조직화","심상화","맥락화","정교화","도식활성화","생성"],"id":"simri-e84"},{"ch":"CH04 학습의 이해","t":"조직화·정교화","q":"조직화와 정교화 각각의 구체적인 세부전략 2가지를 설명하시오.","ans":"조직화의 세부전략\n① 도표: 많은 양의 정보를 체계적으로 파악 가능하고 관련 있는 것끼리 묶을 수 있음\n② 구조도: 관련 개념들을 위계화해서 제시하여 정보에 대한 구조 파악 및 전체적인 흐름을 파악할 수 있게 함\n③ 목차나 개요: 학습내용 전체에 대해 목차나 개요를 만드는 것은 전체 내용에 대한 흐름을 제시하여 이해를 촉진시킴\n④ 모형 제시: 관계 간의 모형을 만들어 직접 관찰이 불가능한 관계를 제시하면 학습내용에 대한 이해를 촉진시킴\n정교화의 세부전략\n① 사례 제시: 구체적인 여러 사례를 제시하게 되면 학생의 사전지식과 새로운 정보 간 연결이 촉진됨\n② 유추: 유추를 사용하여 비유적으로 설명하면 학생이 이미 알고 있던 내용에 새로운 정보 연결이 용이해짐\n③ 자신의 말로 설명하기: 설명된 내용을 그대로 반복하는 것이 아니라 자신의 언어로 설명하는 과정에서 기존에 형성되어 있던 지식과 새로운 지식의 연결이 촉진됨\n④ 기억술\n∙장소법: 새로운 정보를 자신과 친숙한 장소에 연결하여 심상을 구성하는 방법\n∙연상법: 어떤 사실을 단어나 숫자와 관련지어 기억하는 방법\n∙핵심단어법: 학습한 단어의 의미와 단어를 심상으로 결합하여 부호화하는 방법\n∙음운기억법: 새로운 정보를 익숙한 리듬이 있는 기존의 노래에 가사로 넣어 따라 부르며 정교화하는 방법","kw":["도표","구조도","목차","개요","모형 제시","사례 제시","유추","자신의 말로 설명","장소법","연상법","핵심단어법","음운기억법"],"id":"simri-e85"},{"ch":"CH04 학습의 이해","t":"인출","q":"인출의 개념과 인출의 방법 2가지를 설명하시오.","ans":"개념: 장기기억에 저장된 정보를 작업기억으로 가져오는 과정\n인출의 방법\n① 회상: 어떠한 단서나 도움이 제공되지 않은 상태에서 장기기억의 정보를 인출하는 방법\n② 재인: 단서나 도움이 제공되는 상황에서 장기기억의 정보를 인출해내는 방법","kw":["장기기억","작업기억","회상","재인","단서"],"id":"simri-e86"},{"ch":"CH04 학습의 이해","t":"인출","q":"부호화 특수성(encoding specificity)과 설단현상 각각의 개념을 제시하시오.","ans":"부호화 특수성: 장기기억에 저장된 정보를 인출할 수 있도록 도와주는 단서(인출단서)의 맥락이 부호화 맥락과 일치할 때 인출이 가장 잘됨\n설단현상: 정보가 장기기억에 저장되어 있으나 해당 정보에 대한 접근이 제대로 되지 않아 발생하는 인출실패의 한 가지 현상","kw":["인출단서","맥락","일치","설단현상","인출실패"],"id":"simri-e87"},{"ch":"CH04 학습의 이해","t":"망각","q":"망각의 개념과 망각의 원인을 설명할 수 있는 이론 2가지를 제시하시오.","ans":"개념: 기억저장소에서 정보가 손실되거나 인출될 수 없는 것\n원인 설명 이론\n① 쇠잔이론(불용이론): 기억을 사용하지 않으면 시간이 경과함에 따라 기억 흔적이 약해진다고 설명\n② 간섭이론: 관련된 다른 내용의 기억이 회상하고자 하는 내용의 인출을 방해하여 망각이 일어난다고 설명\n③ 인출실패이론: 저장된 정보에 대해 접근하는 적절한 인출단서가 없기 때문에 기억 실패하는 것으로 설명","kw":["기억저장소","쇠잔이론","불용이론","간섭이론","인출실패이론","기억 흔적"],"id":"simri-e88"},{"ch":"CH04 학습의 이해","t":"메타인지","q":"메타인지의 개념, 메타인지의 과정, 메타인지를 높이는 교수방법 2가지를 제시하시오.","ans":"개념: '인지에 대한 인지'로 자신의 인지과정에 대한 자각과 통제\n과정: 계획 - 점검 - 평가 - 계획의 재수립\n교수방법: ① 설명 및 시범 ② 메타인지 체크리스트 ③ 시험 및 백지쓰기","kw":["인지에 대한 인지","자각과 통제","계획","점검","평가","체크리스트","백지쓰기"],"id":"simri-e89"},{"ch":"CH04 학습의 이해","t":"전이","q":"전이의 개념과 형식도야설, 동일요소설, 일반화설, 형태이조설을 설명하시오.","ans":"개념: 하나의 맥락에서 이해한 것을 다른 맥락에 적용·응용하는 능력\n형식도야설: 능력심리학에 기초함. 인간의 마음을 구성하는 기본능력(기억력, 추리력, 주의력, 의지력, 상상력 등)을 연습을 통해 강화시킬 수 있으며, 이러한 일반정신능력을 잘 훈련시키면 그 효과가 여러 분야에 자동적으로 전이됨\n동일요소설: 이전의 학습과 새로운 학습의 과제나 상황이 동일한 요소를 많이 포함할수록 전이가 잘 일어남\n일반화설: 학습의 기저에 있는 일반 원리나 법칙을 학습하게 되면 이후 학습에서의 전이가 잘 일어남\n형태이조설: 형태주의 이론과 연관. 상황을 구성하는 요소들 간의 관계를 파악하거나 문제의 구조적 성질을 이해하였을 때 전이가 잘 일어남","kw":["다른 맥락에 적용","형식도야설","능력심리학","동일요소설","일반화설","형태이조설","구조적 성질"],"id":"simri-e90"},{"ch":"CH04 학습의 이해","t":"구성주의","q":"피아제(Piaget)의 지식론과 비고츠키(Vygotsky)의 지식론 각각의 명칭을 그에 따른 사회적 상호작용의 역할 1가지와 함께 제시하시오.","ans":"피아제의 인지적 구성주의\n∙사회적 상호작용의 역할: 개인의 인지적 갈등을 유발할 수 있는 촉매제의 역할을 함\n비고츠키의 사회적 구성주의\n∙사회적 상호작용의 역할: 모든 고차원적 심리기능(비판적 사고, 논리적 사고)을 유발하는 역할","kw":["인지적 구성주의","사회적 구성주의","인지적 갈등","촉매제","고차원적 심리기능"],"id":"simri-e91"}]},"교육평가":{"mc":[{"ch":"CH01 교육평가의 이해","t":"교육평가의 기본가정","q":"교육평가의 기본가정에 해당하지 않는 것은?","opts":["평가의 일회성 — 평가는 정해진 시점에 한 번 실시하고 종료해야 한다","학습자의 잠재능력 개발 가능성 — 인간은 개발할 수 있는 무한한 잠재능력을 지니고 있다","교육평가의 대상과 자료의 무한성 — 어떠한 행위, 대상, 자료도 교육평가의 대상으로 자료는 무한하다","평가의 종합성 — 평가대상이 가지고 있는 모든 자료를 종합적으로 수집하여 평가하여야 한다"],"a":0,"exp":"교육평가의 기본가정에는 '시간의 연속성 — 일회적으로 실시하고 종료하는 것이 아니라 지속적으로 이루어져야 함'이 포함되므로 ①은 정반대의 서술이다.","id":"pyeongga-m0"},{"ch":"CH01 교육평가의 이해","t":"교육평가의 목적","q":"교육평가의 목적으로 제시되지 않은 것은?","opts":["학생 간 서열을 고정하여 경쟁을 유지함","학습을 극대화함","교육과정, 교수·학습 프로그램, 교육자료 등을 개선함","공공기금의 지출을 점검함"],"a":0,"exp":"교육평가의 목적은 ①학습을 극대화함 ②학업성취수준을 총평함 ③교육의 질을 향상시킴 ④교육과정·교수학습 프로그램·교육자료 등을 개선함 ⑤정책구안이나 의사결정을 위한 기초를 제공함 ⑥공공기금의 지출을 점검함이다.","id":"pyeongga-m1"},{"ch":"CH01 교육평가의 이해","t":"교육평가의 기능","q":"교육평가의 기능으로 옳지 않은 것은?","opts":["학생의 잠재능력을 고정된 것으로 확정함","교육의 진행과정에 있는 교육과정, 프로그램, 교구, 교재 등을 개선하고 발전시킴","교육의 질을 통제하기 위하여 국가단위나 지역단위의 학업성취도 시험을 실시하여 교육에 대한 책임 여부를 점검함","평가 자체가 행위에 대한 동기를 부여함"],"a":0,"exp":"교육평가의 기능은 ②③④와 '신입생 또는 신입사원을 선발하거나 자격증을 부여함'이다. ①은 기본가정(잠재능력 개발 가능성)에도 반한다.","id":"pyeongga-m2"},{"ch":"CH01 교육평가의 이해","t":"측정관","q":"평가의 개념에 따른 분류 중 '측정관'의 의미로 옳은 것은?","opts":["정해진 규정 및 법칙에 따라 사물의 속성을 수량화·객관화하는 것","수량화되지 않은 정보까지 모두 포함해서 사물을 종합적으로 파악하는 것","가치판단을 통하여 사물의 속성을 세밀하게 파악하는 것까지 포함하는 것","평가에 대한 평가를 실시하는 것"],"a":0,"exp":"측정관의 의미는 '정해진 규정 및 법칙에 따라 사물의 속성을 수량화·객관화하는 것'이다. ②는 총평관, ③은 평가관, ④는 메타평가이다.","id":"pyeongga-m3"},{"ch":"CH01 교육평가의 이해","t":"측정관","q":"측정관의 특징으로 옳지 않은 것은?","opts":["양적 자료와 질적 자료를 모두 이용하여 전인적 평가를 진행한다","신뢰성이 높고 객관성 있는 측정을 위해서는 어떤 상황이나 시점, 평가자와 상관없이 동일한 결과를 얻어야 한다","측정하는 절차에 대한 표준화가 요구된다","사람이나 사물의 속성을 측정할 때에는 측정단위인 '척도(scale)'를 설정해야 한다"],"a":0,"exp":"①은 총평관의 특징이다. 측정관은 표준화, 척도 설정, 상황·시점·평가자와 무관한 동일 결과를 강조한다.","id":"pyeongga-m4"},{"ch":"CH01 교육평가의 이해","t":"교육관","q":"측정관과 관련된 교육관인 '선발적 교육관'에 대한 설명으로 옳은 것은?","opts":["인간의 지적 능력은 타고난다고 생각하며 우수자 선발을 평가의 목적으로 삼고, 교육을 통한 인간 행동 변화에 부정적임","교육은 자아실현의 과정으로 보며 학습자는 환경과 능동적으로 상호작용하는 존재로 여김","모든 학습자에게 적절한 교수·학습방법만 제시되면 누구나 교육목표를 달성할 수 있다고 여김","교육의 실패는 교사의 책임으로 여김"],"a":0,"exp":"선발적 교육관은 지적 능력이 타고난다고 보고 우수자 선발을 평가의 목적으로 삼으며 인간 행동 변화에 부정적이다. ②는 인본주의적 교육관, ③④는 발달적 교육관이다.","id":"pyeongga-m5"},{"ch":"CH01 교육평가의 이해","t":"총평관","q":"'총평관'의 의미로 옳은 것은?","opts":["수집된 정보뿐만 아니라 측정되지 않은 정보, 즉 수량화되지 않은 정보까지 모두 포함해서 사물을 종합적으로 파악하는 것","규정 및 법칙에 따라 사물의 속성을 수량화·객관화하는 것","가치판단을 통해 사물의 속성을 세밀하게 파악하는 것까지 포함하는 것","교육에 관한 의사결정을 촉진하고 도와주는 것"],"a":0,"exp":"총평관은 수량화되지 않은 정보까지 모두 포함해 사물을 종합적으로 파악하는 것이다.","id":"pyeongga-m6"},{"ch":"CH01 교육평가의 이해","t":"총평관","q":"총평관의 특징으로 옳은 것은?","opts":["양적 자료와 질적 자료를 모두 이용할 수 있으며 주로 평가대상에 대해서 전인적 평가를 진행하고자 할 때 사용함","측정 절차의 표준화가 요구됨","가치판단 요소가 반드시 내재되어 있어야 함","평가에 대한 평가를 목적으로 함"],"a":0,"exp":"총평관의 특징은 ①양적 자료와 질적 자료를 모두 이용할 수 있음 ②주로 평가대상에 대해서 전인적 평가를 진행하고자 할 때 사용함이다.","id":"pyeongga-m7"},{"ch":"CH01 교육평가의 이해","t":"총평관","q":"총평관의 관점에서 학생을 평가하는 방안으로 옳은 것은?","opts":["학교생활기록부에 교과별 학업성취도뿐 아니라 출석정보, 전인적 발달을 포함하는 행동특성, 면담기록, 독서기록, 희망진로 등 다양한 정보를 기술함","표준화된 지필검사 점수만으로 서열을 산출함","성취기준 도달 여부만을 이분적으로 판정함","평가 자체의 질적 수준을 평가함"],"a":0,"exp":"총평관의 방안은 ①학교생활기록부 ②수행평가(지필검사에 의하여 학습자를 평가하는 수준을 넘어 보다 종합적인 평가를 통해 학생들을 평가함)이다.","id":"pyeongga-m8"},{"ch":"CH01 교육평가의 이해","t":"교육관","q":"총평관과 관련된 '인본주의적 교육관'에 대한 설명으로 옳은 것은?","opts":["교육은 자아실현의 과정으로 보며 학습자는 환경과 능동적으로 상호작용하는 존재로 여기고, 교육 실패는 학습자와 교사의 공동책임이며 전인적인 특성을 파악하고자 함","인간의 지적 능력은 타고난다고 생각하며 우수자 선발을 목적으로 삼음","교육의 실패는 오로지 교사의 책임으로 여김","모든 학습자가 교육목표를 달성할 수 있다고 여김"],"a":0,"exp":"인본주의적 교육관은 교육을 자아실현의 과정으로 보고, 교육 실패를 학습자와 교사의 공동책임으로 여기며 전인적 특성 파악을 지향한다.","id":"pyeongga-m9"},{"ch":"CH01 교육평가의 이해","t":"평가관","q":"'평가관'의 의미로 옳은 것은?","opts":["검사를 통해 사물의 속성을 수량화하거나 관찰, 면담 등 수량화하기 어려운 정보를 종합적으로 수집하는 것에서 나아가 그 결과에 대한 가치판단을 통하여 사물의 속성을 세밀하게 파악하는 것까지 포함","규정과 법칙에 따라 속성을 수량화·객관화하는 것","수량화되지 않은 정보까지 포함해 종합적으로 파악하는 것","의사결정에 필요한 정보를 획득·기술·제공하는 과정"],"a":0,"exp":"평가관은 측정과 총평을 넘어 가치판단까지 포함하여 사물의 속성을 세밀하게 파악하는 것이다.","id":"pyeongga-m10"},{"ch":"CH01 교육평가의 이해","t":"평가관","q":"평가관의 특징으로 옳은 것은?","opts":["평가는 측정과 총평 양쪽 모두를 포괄할 수는 있으나 가치판단 요소가 내재되어 있어야 함","평가는 오직 양적 자료만을 사용해야 함","평가는 가치판단을 배제해야 함","평가는 교육목표와 무관하게 이루어져야 함"],"a":0,"exp":"평가관의 특징은 ①평가도구가 의도한 목표를 얼마나 잘 대표하고 있는가, 교육목표 달성 여부를 판단하기 위한 증거들이 타당한가에 중점을 둠 ②평가는 측정과 총평 양쪽 모두를 포괄할 수는 있으나 가치판단 요소가 내재되어 있어야 함이다.","id":"pyeongga-m11"},{"ch":"CH01 교육평가의 이해","t":"교육관","q":"평가관과 관련된 '발달적 교육관'에 대한 설명으로 옳은 것은?","opts":["모든 학습자에게 적절한 교수·학습방법만 제시되면 누구나 의도하는 바의 주어진 교육목표를 달성할 수 있다고 여기며, 교육의 실패는 교사의 책임으로 여김","인간의 지적 능력은 타고난다고 봄","교육 실패는 학습자와 교사의 공동책임으로 봄","우수자 선발을 평가의 목적으로 삼음"],"a":0,"exp":"발달적 교육관은 적절한 교수·학습방법이 제시되면 모든 학습자가 교육목표를 달성할 수 있다고 보며, 교육의 실패는 교사의 책임으로 여긴다.","id":"pyeongga-m12"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"총괄적 평가의 목적으로 옳은 것은?","opts":["학생의 인지적·정의적·심동적 영역의 성장·발달 수준을 변별하거나 판단하기 위함","학생의 성장·발달 수준을 이해하여 교수·학습과정을 개선하기 위함","평가를 통해 개별 학생들의 학습을 돕기 위함","평가 자체의 질적 수준을 향상시키기 위함"],"a":0,"exp":"총괄적 평가의 목적은 '학생의 인지적·정의적·심동적 영역의 성장·발달 수준을 변별하거나 판단하기 위함'이다. ②③은 형성적 평가의 목적이다.","id":"pyeongga-m13"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"총괄적 평가 수행 시 학습과 평가의 관계로 옳은 것은?","opts":["학습에 대한 평가 — 규준참조평가는 학생의 성취도가 규준을 바탕으로 어디에 위치하는지를 판단하고, 준거참조평가는 성취기준에 어느 정도 도달했는지 판단함","학습을 위한 평가 — 교수·학습과정 중에 시행하여 다음 단계 교수법을 개선함","학습으로서의 평가 — 학생이 자기평가를 통해 학습과정을 주도적으로 성찰함","평가에 대한 평가 — 평가활동의 질적 수준을 향상시킴"],"a":0,"exp":"총괄적 평가는 '학습에 대한 평가'이며, 규준참조평가는 규준상의 위치를, 준거참조평가는 성취기준 도달 정도를 판단한다.","id":"pyeongga-m14"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"형성적 평가 수행 시 '학습을 위한 평가'에 대한 설명으로 옳은 것은?","opts":["교수·학습과정 중에 시행하여 그다음 단계의 교수법을 개선하고 피드백을 제공하기 위한 평가","교사는 학생이 문제해결 과정에서 드러내는 탁월성이나 적극성을 평가하고 피드백을 통해 학습과정을 지도·조언함","학생의 성취도가 규준을 바탕으로 어디에 위치하는지를 판단함","성취기준에 어느 정도 도달했는지 판단함"],"a":0,"exp":"'학습을 위한 평가'는 교수·학습과정 중에 시행하여 다음 단계 교수법을 개선하고 피드백을 제공하는 평가이다. ②는 '학습으로서의 평가'이다.","id":"pyeongga-m15"},{"ch":"CH01 교육평가의 이해","t":"총괄적/형성적 평가","q":"'학습으로서의 평가'에 대한 설명으로 옳은 것은?","opts":["교사는 학생이 문제해결 과정에서 드러내는 탁월성(지식이나 기능)이나 적극성(태도)을 평가하고 피드백을 통해 학생의 학습과정을 지도·조언하며, 학생은 교사의 피드백이나 자기평가를 통해 학습과정을 주도적으로 성찰함","성취도가 규준상 어디에 위치하는지 판단함","다음 단계의 교수법을 개선하기 위한 평가","교육목표 달성 여부를 종합적으로 판정하는 평가"],"a":0,"exp":"'학습으로서의 평가'는 학생이 피드백이나 자기평가를 통해 학습과정을 주도적으로 성찰하도록 하는 평가이다.","id":"pyeongga-m16"},{"ch":"CH01 교육평가의 이해","t":"평가결과 활용","q":"평가결과를 효과적으로 활용하기 위한 교사의 역할로 제시되지 않은 것은?","opts":["평가결과를 단순 보고와 기록으로 정확히 남기는 데 집중하기","유용한 정보 제공 — 평가결과가 학생의 다음 단계 학습을 위한 유용한 정보를 제공해야 함","풍부한 피드백 제공 — 교사의 구체적이고 풍부한 피드백을 통해 학생은 자신의 학습상태를 스스로 이해하고 다음 단계의 학습을 계획하도록 할 필요가 있음","다음 단계 학습을 위한 계획 — 교사는 학생의 다음 단계 학습을 위하여 가르쳐야 할 내용이나 안내해야 하는 활동에 대해 계획할 수 있음"],"a":0,"exp":"'실질적인 의사소통'은 단순 보고와 기록에 그치지 않고 평가결과를 토대로 학생 및 학부모와의 실질적인 의사소통을 해야 한다는 것이므로 ①은 옳지 않다.","id":"pyeongga-m17"},{"ch":"CH01 교육평가의 이해","t":"학습을 위한 평가 과제","q":"평가결과가 학습을 위한 평가로 활용되기 위한 과제로 제시되지 않은 것은?","opts":["규준참조평가를 강화하여 상대적 위치 정보를 명확히 제공","준거참조평가와 성장참조평가 강조 — 학습의 목표에 비추어 자신의 현 상태를 이해하고 그 목표를 성취하기 위해 필요한 정보를 얻기 위해서 평가를 받도록 함","교사의 긍정적인 피드백 — 학생 스스로 자신의 학습에 대해 반성할 기회를 제공하고 학습동기를 촉진함","교사의 전문성 계발 지원 — 교사의 학생평가 전문성은 교수·학습활동 자체를 위해 중요함"],"a":0,"exp":"제시된 과제는 준거참조평가와 성장참조평가 강조, 교사의 긍정적인 피드백, 교사의 전문성 계발 지원이다.","id":"pyeongga-m18"},{"ch":"CH01 교육평가의 이해","t":"메타평가","q":"메타평가의 개념으로 옳은 것은?","opts":["평가에 대한 평가","평가에 대한 학생의 자기평가","평가결과에 대한 통계적 분석","평가도구의 신뢰도 추정"],"a":0,"exp":"메타평가는 '평가에 대한 평가'이다.","id":"pyeongga-m19"},{"ch":"CH01 교육평가의 이해","t":"메타평가","q":"메타평가의 유형으로 옳은 것은?","opts":["평가계획에 대한 진단적 메타평가, 평가 실행과정에 대한 형성적 메타평가, 평가결과에 대한 총괄적 메타평가","내용 메타평가, 준거 메타평가, 구인 메타평가","양적 메타평가, 질적 메타평가, 혼합 메타평가","내부 메타평가, 외부 메타평가, 자기 메타평가"],"a":0,"exp":"메타평가의 유형은 ①평가계획에 대한 진단적 메타평가 ②평가 실행과정에 대한 형성적 메타평가 ③평가결과에 대한 총괄적 메타평가(평가의 가치, 장점, 확인)이다.","id":"pyeongga-m20"},{"ch":"CH01 교육평가의 이해","t":"메타평가","q":"메타평가의 평가기준 중 '적합성(propriety)'에 해당하는 것은?","opts":["평가가 도덕적으로 적합하게 실시되었는가","평가가 실현 가능하였는가","평가가 실제적으로 필요하였는가","정확한 정보를 전달하였는가"],"a":0,"exp":"메타평가의 평가기준은 실현성(feasibility), 실용성(utility), 적합성(propriety), 정확성(accuracy)이며, 적합성은 평가가 도덕적으로 적합하게 실시되었는가이다.","id":"pyeongga-m21"},{"ch":"CH02 교육평가의 모형","t":"타일러","q":"타일러(Tyler)의 목표중심평가모형의 특징으로 옳지 않은 것은?","opts":["교육평가는 교육의 전체 과정과 무관하게 평가 자체를 위해 존재한다","교육목표가 평가에서 핵심적인 역할을 한다","교육목표의 행동적 정의와 명세적 진술은 측정 및 평가를 용이하게 해주며 평가의 효율성을 증대시킨다","교육평가가 평가 자체를 위해 존재하는 것이 아니라 교육의 전체 과정과 관련되어 있다고 본다"],"a":0,"exp":"타일러 모형은 '교육평가가 평가 자체를 위해 존재하는 것이 아니라 교육의 전체 과정과 관련되어 있다고 봄'이 특징이므로 ①은 정반대이다.","id":"pyeongga-m22"},{"ch":"CH02 교육평가의 모형","t":"타일러","q":"타일러(Tyler) 목표중심평가모형의 장점으로 옳은 것은?","opts":["교육과정과 평가 사이의 논리적 일관성이 유지될 수 있고, 교육목표가 구체적이어서 정확한 평가기준의 적용이 가능함","부수적·확산적 목표의 중요성을 충분히 반영함","행동적 용어로 진술하기 힘든 목표도 쉽게 평가할 수 있음","교육 실제의 복합적이고 복잡한 측면을 잘 평가할 수 있음"],"a":0,"exp":"타일러 모형의 장점은 ①논리적 일관성 유지 ②구체적 교육목표로 정확한 평가기준 적용 가능 ③논리적·합리적 절차가 명확히 제시되어 적용이 쉬움이다. ②③④는 오히려 단점에 해당한다.","id":"pyeongga-m23"},{"ch":"CH02 교육평가의 모형","t":"타일러","q":"타일러(Tyler) 목표중심평가모형의 단점으로 옳지 않은 것은?","opts":["논리적·합리적 절차가 불명확하여 적용이 어렵다","사전 목표의 설정을 강조함으로써 부수적·확산적 목표의 중요성을 간과할 수 있다","과정보다는 결과에 대한 그램의 개선에 직접적으로 기여할 수 있음"],"a":0,"exp":"해몬드 모형의 장점은 신규 프로그램 개발 및 적합성·효율성 확인, 현행 프로그램의 수정·보완 정보 수집이다.","id":"pyeongga-m30"},{"ch":"CH02 교육평가의 모형","t":"스크리븐","q":"스크리븐(Scriven)의 탈목표평가모형의 특징으로 옳지 않은 것은?","opts":["프로그램이 사전에 설정한 목표의 달성도만을 엄격히 확인한다","프로그램이 의도했던 효과뿐만 아니라 부수적인 효과까지 포함하여 실제 효과를 평가한다","교육목표 자체의 질과 가치를 중시하는 평가의 필요성을 강조한다","형성평가와 총괄평가(총합평가)를 구별하여 판단한다"],"a":0,"exp":"탈목표평가모형은 의도한 효과뿐 아니라 부수적 효과까지 포함해 모든 효과를 포괄적으로 검토하므로 ①은 정반대의 서술이다.","id":"pyeongga-m31"},{"ch":"CH02 교육평가의 모형","t":"스크리븐","q":"스크리븐(Scriven)이 구별한 '내재적 준거'와 '외재적 준거'에 대한 설명으로 옳은 것은?","opts":["내재적 준거는 프로그램에 내재된 기본적 속성(목표, 내용선정과 조직 등)이고, 외재적 준거는 프로그램이 발휘하는 기능적 속성(실제 운영상황, 프로그램의 효과 등)이다","내재적 준거는 프로그램의 효과이고, 외재적 준거는 프로그램의 목표이다","내재적 준거는 형성평가이고, 외재적 준거는 총괄평가이다","내재적 준거는 비교평가이고, 외재적 준거는 비(非)비교평가이다"],"a":0,"exp":"내재적 준거는 목표·내용선정과 조직 등 프로그램의 기본적 속성이고, 외재적 준거는 실제 운영상황·프로그램 효과 등 기능적 속성이다.","id":"pyeongga-m32"},{"ch":"CH02 교육평가의 모형","t":"스크리븐","q":"스크리븐(Scriven)의 탈목표평가모형의 장점으로 옳지 않은 것은?","opts":["각기 다른 판단준거를 사용해도 결과를 동일하게 볼 수 있어 비교가 용이하다","교육과정 중 발생하는 잠재적 결과까지 포함해 교육의 실제적 효과를 평가한다","목표가 전혀 없는 상황에서도 평가 수행이 가능하다","목표에 반영되어 있지 않은 프로그램의 부수적 효과 탐색에도 관심이 있다"],"a":0,"exp":"'각기 다른 판단준거를 사용하여 내린 결과를 동일하게 생각하는 문제가 발생할 수 있음'은 단점이므로 ①은 옳지 않다.","id":"pyeongga-m33"},{"ch":"CH02 교육평가의 모형","t":"스크리븐","q":"스크리븐(Scriven) 탈목표평가모형의 단점으로 옳은 것은?","opts":["각기 다른 판단준거를 사용하여 내린 결과를 동일하게 생각하는 문제가 발생할 수 있고, 판단의 타당성을 평가하는 방법이 부재함","목표가 없는 상황에서는 평가를 수행할 수 없음","평가할 요소가 너무 많고 수량화가 어려움","평가자의 전문성에 지나치게 의존함"],"a":0,"exp":"탈목표평가모형의 단점은 ①각기 다른 판단준거를 사용하여 내린 결과를 동일하게 생각하는 문제 ②판단의 타당성을 평가하는 방법이 부재함이다.","id":"pyeongga-m34"},{"ch":"CH02 교육평가의 모형","t":"스테이크","q":"스테이크(Stake)의 반응적 평가모형의 목적으로 옳은 것은?","opts":["교육 프로그램의 여러 측면에 대한 전체적인 실상을 평가하기 위함","교육목표의 달성도를 정확히 측정하기 위함","불일치 정보를 도출하기 위함","의사결정을 촉진하고 도와주기 위함"],"a":0,"exp":"스테이크 반응적 평가모형의 목적은 '교육 프로그램의 여러 측면에 대한 전체적인 실상을 평가하기 위함'이다.","id":"pyeongga-m35"},{"ch":"CH02 교육평가의 모형","t":"스테이크","q":"스테이크(Stake)의 반응적 평가모형에서 평가의 대상 3가지로 옳은 것은?","opts":["선행조건, 실행과정, 성과요인","수업, 기관, 행동","상황, 투입, 과정, 산출","기술, 해석, 평가"],"a":0,"exp":"평가의 대상은 ①선행조건(수업 실시 이전의 학습자 및 교사의 특성, 교육과정, 교육시설, 학교환경 등) ②실행과정(수업 중 교사와 학생 또는 학생과 학생 간의 상호작용 과정) ③성과요인(수업 프로그램의 효과)이다.","id":"pyeongga-m36"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner)의 평가모형의 특징으로 옳지 않은 것은?","opts":["자료에 대한 통계적 분석을 적극적으로 활용한다","예술교육에 대한 관점을 질적인 형태로 조합하여 교육적 감식안과 교육비평이라는 평가관점을 제시한다","평가자의 전문성이나 경험에 입각한 질적 평가를 중시한다","평가자의 지각적 민감성, 풍부한 경험, 세련된 통찰, 전문가적 판단 등과 같은 평가자의 전문성과 자질이 무엇보다 중시된다"],"a":0,"exp":"아이즈너 모형은 '자료에 대한 통계적 분석을 지양함'이 특징이므로 ①은 정반대이다.","id":"pyeongga-m37"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner)의 '교육적 감식안'의 개념으로 옳은 것은?","opts":["교육현장에서 관찰할 수 있는 일상적인 것들 간 존재하는 미묘한 질적 차이를 감지하는 것","지각한 사건이나 사물의 특징과 중요성을 비판적인 글로 표현하는 일종의 표출예술","교육현상을 사진 보듯이 사실 그대로 묘사하고 표현하는 것","교육현상에 대하여 교육적 의미와 가치를 발견하고 질적으로 판단하는 것"],"a":0,"exp":"교육적 감식안은 교육현장의 일상적인 것들 간 미묘한 질적 차이를 감지하는 것으로, 감식의 대상은 교육의 의도, 학교의 구조, 교육과정, 교수법, 평가이다. ②는 교육비평이다.","id":"pyeongga-m38"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner)의 '교육비평'에 대한 설명으로 옳은 것은?","opts":["교육적 감식안을 통해 지각한 사건이나 사물의 특징과 중요성을 비판적인 글로 표현하는 일종의 표출예술이자 공적인 성질의 행동","일상적인 것들 간의 미묘한 질적 차이를 감지하는 것","교육현상의 질적 속성을 정확하게 기술하고 묘사하는 것","프로그램의 부수적 효과를 탐색하는 것"],"a":0,"exp":"교육비평은 교육적 감식안을 통해 지각한 것을 비판적인 글로 표현하는 표출예술이며 공적인 성질의 행동이다.","id":"pyeongga-m39"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner) 평가모형에서 비평의 '해석적 측면'에 해당하는 것은?","opts":["교육현상에 대한 기술을 바탕으로 사회적 맥락 속에서 수행되는 다양한 형태의 행동이 지닌 의미와 중요성을 이해하고 그 가치를 논리적으로 설명함","교육현상을 사진 보듯이 사실 그대로 묘사하고 표현함","기술하고 해석한 교육현상에 대하여 교육적 의미와 가치를 발견하고 질적으로 판단함","교육현장의 미묘한 질적 차이를 감지함"],"a":0,"exp":"해석적 측면은 기술을 바탕으로 사회적 맥락 속 행동의 의미와 중요성을 이해하고 가치를 논리적으로 설명하는 것이다. ②는 기술적 측면, ③은 평가적 측면이다.","id":"pyeongga-m40"},{"ch":"CH02 교육평가의 모형","t":"아이즈너","q":"아이즈너(Eisner) 평가모형의 단점으로 옳은 것은?","opts":["평가자의 전문성에 지나치게 의존하므로 평가의 주관성에 관한 문제를 초래할 수 있음","교육적 관찰에 대한 질적인 해석이 불가능함","평가자료의 해석이 피상적임","목표가 없는 상황에서 평가가 불가능함"],"a":0,"exp":"아이즈너 모형의 단점은 '평가자의 전문성에 지나치게 의존하므로 평가의 주관성에 관한 문제를 초래할 수 있음'이다.","id":"pyeongga-m41"},{"ch":"CH02 교육평가의 모형","t":"스터플빔 CIPP","q":"스터플빔(Stufflebeam)의 CIPP 모형에서 평가의 개념으로 옳은 것은?","opts":["교육평가의 기능은 교육에 관한 의사결정을 촉진하고 도와주는 것으로 보며, 평가란 의사결정의 대안을 판단하는 데 필요한 정보를 획득·기술·제공하는 과정","교육목표의 달성도를 확인하는 과정","교육현상의 질적 차이를 감지하고 비평하는 과정","성취기준과 수행의 불일치를 확인하는 과정"],"a":0,"exp":"CIPP 모형에서 평가의 기능은 교육목표 달성도 확인이 아니라 의사결정을 촉진·조력하는 것이며, 평가는 의사결정 대안 판단에 필요한 정보를 획득·기술·제공하는 과정이다.","id":"pyeongga-m42"},{"ch":"CH02 교육평가의 모형","t":"스터플빔 CIPP","q":"CIPP 모형의 '상황평가(C)'에 대응하는 의사결정 유형과 내용으로 옳은 것은?","opts":["계획 의사결정 — 목표를 설정하려는 의사결정으로, 목표설정을 위한 합리적 기초나 이유를 제공하기 위한 평가","구조화 의사결정 — 설정된 목표 달성에 적합한 전략과 절차 등 프로그램 구성에 대한 의사결정을 위한 평가","실행 의사결정 — 수립된 전략과 절차의 실행 등 프로그램 실행에 도움을 주는 평가","재순환 의사결정 — 목표 달성 정도의 판단 및 프로그램의 존속·변경 여부 판단"],"a":0,"exp":"상황평가(C)는 계획 의사결정에 대응한다. ②는 투입평가(I), ③은 과정평가(P), ④는 산출평가(P)이다.","id":"pyeongga-m43"},{"ch":"CH02 교육평가의 모형","t":"스터플빔 CIPP","q":"CIPP 모형의 '산출평가'에 대응하는 의사결정 유형은?","opts":["재순환 의사결정","계획 의사결정","구조화 의사결정","실행 의사결정"],"a":0,"exp":"산출평가는 재순환 의사결정에 대응하며, 목표 달성 정도의 판단 및 프로그램의 존속·변경 여부를 판단한다.","id":"pyeongga-m44"},{"ch":"CH02 교육평가의 모형","t":"스터플빔 CIPP","q":"CIPP 모형의 단점으로 옳지 않은 것은?","opts":["프로그램의 특정 단계에서만 평가를 실행할 수 있어 적용 범위가 좁다","의사결정 과정이 명확하지 않고 의사결정 방법이 구체적으로 정의되지 않는다","평가자는 정보를 수집·제공만 하고 가치판단은 의사결정자에게 위임하여 평가자의 역할이 경시된다","모든 과정에 대해 평가하기에는 비용이 많이 들고 복잡하다"],"a":0,"exp":"'어떠한 프로그램의 단계에서도 평가를 실행할 수 있고 여러 상황 또는 모든 요소에 대한 평가가 가능함'은 장점이므로 ①은 옳지 않다.","id":"pyeongga-m45"},{"ch":"CH02 교육평가의 모형","t":"스터플빔 CIPP","q":"CIPP 모형의 장점으로 옳은 것은?","opts":["피드백에 민감하며 의사결정과 평가 간에 체계적인 접근이 가능하고, 프로그램의 개선에 직접적으로 기여할 수 있음","가치평가까지 평가자가 직접 수행함","평가자의 질적 감식안을 중시함","목표가 없는 상황에서 부수적 효과를 탐색함"],"a":0,"exp":"CIPP의 장점은 모든 단계·요소에 대한 평가 가능, 피드백에 민감하고 체계적 접근 가능, 프로그램 개선에 직접 기여이다.","id":"pyeongga-m46"},{"ch":"CH02 교육평가의 모형","t":"제4세대 평가","q":"구바(Guba)와 링컨(Lincoln)의 제4세대 평가모형의 특징으로 옳은 것은?","opts":["현상학적·해석학적·구성주의적 패러다임에 대한 새로운 평가적 접근방법을 제안함","실증주의적·양적 패러다임을 강화함","교육목표의 행동적 진술을 강조함","의사결정자에게 정보만 제공하고 가치판단은 배제함"],"a":0,"exp":"제4세대 평가모형은 현상학적·해석학적·구성주의적 패러다임에 대한 새로운 평가적 접근방법을 제안한다.","id":"pyeongga-m47"},{"ch":"CH02 교육평가의 모형","t":"제4세대 평가","q":"제4세대 평가모형의 한계로 지적되는 것은?","opts":["평가자의 주관적 관찰과 판단을 지나치게 강조하여 평가자의 선입견·임의성 등이 평가 계획·실시·결과에 악영향을 미칠 수 있음","평가결과를 수량화하기 쉬워 질적 정보를 놓침","목표 달성도만을 확인하여 부수적 효과를 놓침","의사결정 방법이 지나치게 구체적임"],"a":0,"exp":"제4세대 평가모형은 평가자의 주관적 관찰과 판단을 지나치게 강조하여 선입견·임의성이 평가 계획·실시·결과에 악영향을 미칠 수 있다는 한계가 있다.","id":"pyeongga-m48"},{"ch":"CH03 교육평가의 유형","t":"규준지향평가","q":"규준지향평가의 개념으로 옳은 것은?","opts":["학습자의 평가결과를 그가 속한 규준집단(비교집단) 내에서의 상대적 위치나 서열을 통해 밝히는 평가방식","준거에 비추어 학습자가 성취해야 할 과제의 영역 또는 분야를 알고 얼마만큼 수행할 수 있는가에 관심을 두는 평가방식","학생이 지니는 능력에 비추어 얼마나 최선을 다했는가에 초점을 두는 평가","초기의 능력수준과 비교했을 때 얼마만큼의 향상을 보였는가를 강조하는 평가"],"a":0,"exp":"규준지향평가는 '상대평가' 또는 '상대비교평가'라고도 하며, 규준집단 내에서의 상대적 위치나 서열을 밝히는 평가방식이다. ②는 준거지향평가, ③은 능력지향평가, ④는 성장지향평가이다.","id":"pyeongga-m49"},{"ch":"CH03 교육평가의 유형","t":"규준지향평가","q":"규준지향평가의 장점으로 옳지 않은 것은?","opts":["학생이 무엇을 알고 얼마나 수행할 수 있는지를 구체적으로 파악할 수 있다","상대적인 비교가 가능한 표준점수를 활용하기 때문에 개인차 변별이 용이하다","선발적 교육관에 바탕을 두며 경쟁학습을 강조하기 때문에 외적 동기유발에 긍정적으로 작용한다","객관적 검사를 통해 성적이 표시되므로 교사의 편견이 배제된다"],"a":0,"exp":"'학생이 교수·학습목표를 얼마나 달성하였고, 구체적으로 무엇을 알고, 얼마나 수행할 수 있는지를 파악하기 어려움'은 규준지향평가의 단점이다.","id":"pyeongga-m50"},{"ch":"CH03 교육평가의 유형","t":"규준지향평가","q":"규준지향평가의 단점으로 제시되지 않은 것은?","opts":["준거 설정에 고도의 전문성이 요구되어 점수 해석의 자의성이 높다","학생 간의 경쟁을 고조시켜 서열 위주의 사고방식이 팽배해진다","교실에서의 협동학습이 무시될 수 있다","상대적 위치에 관한 정보만 제공하므로 개인의 결손 확인 후 개선되어야 할 정보 제공을 충분히 하지 못한다"],"a":0,"exp":"①은 준거지향평가의 단점이다.","id":"pyeongga-m51"},{"ch":"CH03 교육평가의 유형","t":"규준","q":"'규준'의 개념으로 옳은 것은?","opts":["원점수를 의미 있게 비교·해석할 수 있도록 변환한 점수의 척도로, 대상집단의 전형적인 수행수준을 보여주는 규준집단의 점수분포","교육목표를 설정할 때 도달해야 하는 최저기준","규준을 기준으로 원점수에 대한 상대적 위치를 나타내는 점수","평균 5, 표준편차 2로 표준화한 9개 범주의 점수"],"a":0,"exp":"규준은 원점수를 의미 있게 비교·해석할 수 있도록 변환한 점수의 척도이며 규준집단의 점수분포를 의미한다. ②는 준거, ③은 규준점수, ④는 스테나인 점수이다.","id":"pyeongga-m52"},{"ch":"CH03 교육평가의 유형","t":"규준","q":"규준의 필요성으로 옳은 것은?","opts":["시험을 통하여 얻은 원점수는 그 자체로 상대적 비교를 하는 데 직접적으로 활용되기 어려우므로, 규준지향평가에서는 상대적인 비교의 근거가 되는 규준이 필요함","원점수만으로는 절대적 도달 여부를 판단할 수 없기 때문","교육목표의 최저기준을 설정해야 하기 때문","평가의 실용도를 확보해야 하기 때문"],"a":0,"exp":"규준의 필요성은 원점수 자체로는 상대적 비교가 어렵기 때문에 상대적 비교의 근거가 되는 규준이 필요하다는 것이다.","id":"pyeongga-m53"}, a":0,"exp":"규준참조평가는 개인차 변별을 위해 다양한 난이도의 문항을, 준거참조평가는 최저 준거에 부합하는 난이도의 문항을 제작한다.","id":"pyeongga-m83"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 목적으로 옳은 것은?","opts":["학습자의 잠재력을 자극해 개인의 근접발달영역(ZPD)을 측정하고 개인이 교육목표를 제대로 달성할 수 있게 개별적으로 도움을 주기 위함","교육목표 달성도에 대한 정보만을 정확히 제공하기 위함","학생 간 상대적 서열을 정확히 산출하기 위함","평가 자체의 질을 향상시키기 위함"],"a":0,"exp":"역동적 평가의 목적은 잠재력을 자극해 ZPD를 측정하고, 개별 학생의 강점·약점을 파악하여 교육목표 달성을 개별적으로 돕는 것이다.","id":"pyeongga-m84"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 전체적인 구성으로 옳은 것은?","opts":["검사 - 중재(교육적 처방) - 재검사","진단 - 형성 - 총괄","계획 - 실행 - 평가","사전검사 - 사후검사"],"a":0,"exp":"역동적 평가의 구성은 '검사 - 중재(교육적 처방) - 재검사'이다.","id":"pyeongga-m85"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가와 고정적 평가의 차이점 중 '평가시기' 측면의 설명으로 옳은 것은?","opts":["고정적 평가는 특정 시점(주로 도착점)에, 역동적 평가는 출발점 및 도착점을 포함한 교수·학습활동의 전 과정에 실시함","고정적 평가는 전 과정에, 역동적 평가는 도착점에 실시함","둘 다 출발점에만 실시함","둘 다 도착점에만 실시함"],"a":0,"exp":"평가시기 측면에서 고정적 평가는 특정 시점(주로 도착점), 역동적 평가는 출발점 및 도착점을 포함한 교수·학습활동의 전 과정이다.","id":"pyeongga-m86"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 유형 중 '샌드위치 방식'에 대한 설명으로 옳은 것은?","opts":["사전검사와 사후검사 사이에 수업을 끼워 넣는 방식으로, 사전검사를 치른 후 측정한 기능을 바탕으로 수업이 개별적 또는 집단적으로 진행됨","학습자가 검사문항을 풀 때마다 반응을 제시하는 방식으로, 문항의 반응에 따라 지속적으로 힌트 등의 활동을 제공함","검사를 두 번 시행하여 상관계수로 신뢰도를 추정하는 방식","문항을 맞히면 더 어려운 문항을, 틀리면 더 쉬운 문항을 제시하는 방식"],"a":0,"exp":"샌드위치 방식은 사전검사와 사후검사 사이에 수업을 끼워 넣는 방식이다. ②는 케이크 방식이다.","id":"pyeongga-m87"},{"ch":"CH03 교육평가의 유형","t":"역동적 평가","q":"역동적 평가의 '케이크 방식'에 대한 설명으로 옳은 것은?","opts":["학습자가 검사문항을 풀 때마다 반응을 제시하는 방식으로, 문항의 반응에 따라 지속적으로 힌트 등의 활동을 제공하므로 문항과 힌트가 순차적으로 쌓임","사전검사와 사후검사 사이에 수업을 끼워 넣는 방식","동형검사를 두 번 시행하는 방식","문항을 반분하여 상관을 구하는 방식"],"a":0,"exp":"케이크 방식은 문항을 풀 때마다 반응을 제시하여 힌트 등이 순차적으로 쌓이는 방식이다.","id":"pyeongga-m88"},{"ch":"CH03 교육평가의 유형","t":"능력지향평가","q":"능력지향평가의 개념으로 옳은 것은?","opts":["학생이 지니는 능력에 비추어 얼마나 최선을 다했는가, 능력의 최대치가 발휘되었는가에 초점을 두는 평가","초기의 능력수준과 비교했을 때 얼마만큼의 향상을 보였는가를 강조하는 평가","규준집단 내에서의 상대적 위치를 밝히는 평가","준거 도달 여부를 판정하는 평가"],"a":0,"exp":"능력지향평가는 학생이 지니는 능력에 비추어 얼마나 최선을 다했는가, 능력의 최대치가 발휘되었는가에 초점 적 관찰","비형식적 — 질문지법 / 형식적 — 면담법","비형식적 — 수행평가 / 형식적 — 관찰"],"a":0,"exp":"인지적 평가의 비형식적 수행방안은 비형식적 관찰, 형식적 수행방안은 교실성취도검사, 수행평가, 산출물 평가이다.","id":"pyeongga-m124"},{"ch":"CH03 교육평가의 유형","t":"정의적 평가","q":"정의적 평가의 평가대상으로 제시된 것은?","opts":["인간의 정서 및 의지의 발달을 바탕으로 형성되는 태도, 흥미, 자아개념, 가치, 불안, 도덕성, 학업적 자기존중, 통제, 동기 등","지능, 적성, 학업성취도","신체 운동능력과 기능","교육과정과 프로그램의 효과"],"a":0,"exp":"정의적 평가의 대상은 정서 및 의지의 발달을 바탕으로 형성되는 태도, 흥미, 자아개념, 가치, 불안, 도덕성, 학업적 자기존중, 통제, 동기 등이다.","id":"pyeongga-m125"},{"ch":"CH03 교육평가의 유형","t":"정의적 평가","q":"정의적 평가의 수행방안 중 '투사법'에 해당하는 설명은?","opts":["개인의 욕구 등이 밖으로 나올 수 있는 자극을 제시함으로써 인간의 내면에 숨어 있는 특성을 표출하게 하는 방법(예: 잉크반점검사, 드로잉 테스트)","여러 가지 사물, 인간, 사상 등의 개념에 대한 심리적인 의미를 분석해 의미공간상의 위치로 표현하는 방법","인간의 관점, 의견과 같은 주관성을 과학적으로 연구하는 방법","소집단 내 구성원 간의 호의, 혐오, 무관심 등의 관계를 조사하는 방법"],"a":0,"exp":"투사법은 자극을 제시하여 내면에 숨어 있는 특성을 표출하게 하는 방법으로 잉크반점검사, 드로잉 테스트가 예이다. ②는 의미분석법, ③은 Q방법론, ④는 사회성측정법이다.","id":"pyeongga-m126"},{"ch":"CH03 교육평가의 유형","t":"정의적 평가","q":"정의적 평가의 수행방안 중 '의미분석법'에 대한 설명으로 옳은 것은?","opts":["여러 가지 사물, 인간, 사상 등의 개념에 대한 심리적인 의미를 분석해 의미공간상의 위치로 표현하는 방법","구체적인 질문을 던져 응답하게 하는 측정방법","피험자를 통제하지 않으며 일정한 시간에 걸쳐 지켜보고 결과를 기록하는 방법","인간의 주관성을 과학적으로 연구하는 방법"],"a":0,"exp":"의미분석법은 개념에 대한 심리적 의미를 분석해 의미공간상의 위치로 표현하는 방법이다. ②는 질문지법, ③은 관찰법, ④는 Q방법론이다.","id":"pyeongga-m127"},{"ch":"CH03 교육평가의 유형","t":"사회성측정법","q":"사회성측정법의 개념으로 옳은 것은?","opts":["소집단 내 구성원 간의 호의, 혐오, 무관심 등의 관계를 조사하여 집단 자체의 역동적 구조 상태를 알아보기 위한 방법","개인의 내면에 숨어 있는 특성을 표출하게 하는 방법","개념의 심리적 의미를 의미공간상의 위치로 표현하는 방법","대화를 통해서 특성을 파악하는 방법"],"a":0,"exp":"사회성측정법은 소집단 내 구성원 간의 호의·혐오·무관심 등의 관계를 조사하여 집단의 역동적 구조 상태를 알아보는 방법이다.","id":"pyeongga-m128"},{"ch":"CH03 교육평가의 유형","t":"사회성측정법","q":"사회성측정법의 장점으로 옳은 것은?","opts":["개인의 사회적 적응 개선, 집단의 사회적 구조 개선, 집단 재조직 등에 도움을 주며 전문적 훈련 없이도 작성·실시할 수 있어 일선 교사들에게 유용함","한 번의 측정으로 관계를 고정적으로 파악할 수 있음","질문 내용과 무관하게 학생 관계에 영향을 주지 않음","통계적 분석이 불필요함"],"a":0,"exp":"사회성측정법의 장점은 사회적 적응·집단구조 개선·집단 재조직에 도움을 주고 전문적 훈련 없이도 작성·실시가 가능하다는 점이다.","id":"pyeongga-m129"},{"ch":"CH03 교육평가의 유형","t":"사회성측정법","q":"사회성측정법의 단점으로 옳은 것은?","opts":["한 번의 측정결과를 가지고 집단 구성원 간의 관계를 고정적으로 보는 오류를 범할 수 있고, 질문의 내용에 따라 학생들의 관계에 악영향을 줄 수도 있음","전문적 훈련이 필요하여 교사가 실시하기 어려움","집단의 역동적 구조를 파악할 수 없음","개인의 사회적 적응 개선에 도움이 되지 않음"],"a":0,"exp":"사회성측정법의 단점은 한 번의 측정으로 관계를 고정적으로 보는 오류와 질문 내용에 따른 관계 악영향 가능성이다.","id":"pyeongga-m130"},{"ch":"CH03 교육평가의 유형","t":"CBT","q":"컴퓨터 이용 검사(CBT)의 장점으로 옳지 않은 것은?","opts":["문항과 피험자에 대한 정보를 수집할 수 없어 검사 보안이 강화된다","검사결과의 채점 및 보고에 소요되는 시간과 경비를 줄일 수 있다","응답결과나 검사결과의 즉각적인 피드백은 검사를 통한 학습 향상을 도모할 수 있다","동영상이나 음향파일, 그래프, 사진 등을 이용하여 다양한 형태의 문항을 제작할 수 있다"],"a":0,"exp":"CBT는 '문항과 피험자에 대한 다양한 정보를 제공하고 지속적으로 저장, 관리할 수 있음'이 장점이므로 ①은 정반대이다.","id":"pyeongga-m131"},{"ch":"CH03 교육평가의 유형","t":"CAT","q":"컴퓨터 능력적응검사(CAT)의 특징으로 옳은 것은?","opts":["개별 피험자의 능력에 맞는 문항을 제시하여 문항을 맞히면 더 어려운 문항을, 틀리면 더 쉬운 문항을 제시하여 피험자의 응답 결과에 적응하는 방식으로 실시함","모든 피험자에게 동일한 문항을 동일한 순서로 제시함","고전검사이론이 문항반응이론보다 적합함","소수의 문항만으로 문제은행을 구성할 수 있음"],"a":0,"exp":"CAT는 피험자 응답에 적응하는 방식으로 실시되며, 지필검사보다 충분한 수의 양질의 문항을 가진 문제은행을 필요로 하고, 문항반응이론이 적합하다(문항모수와 피험자 능력모수의 불변성을 가지므로).","id":"pyeongga-m132"},{"ch":"CH03 교육평가의 유형","t":"CAT","q":"컴퓨터 능력적응검사(CAT)의 장점으로 옳지 않은 것은?","opts":["모든 피험자가 동일한 문항을 풀기 때문에 결과 비교가 용이하다","피험자의 능력에 맞는 문제를 제시함으로써 동기를 유발하고 사기를 진작시킨다","보다 적은 수의 문항으로 보다 정확한 피험자의 능력을 추정할 수 있어 측정의 효율성이 높다","개인마다 다른 형태의 검사를 시행함으로써 검사 도중 발생하는 부정행위를 방지할 수 있다"],"a":0,"exp":"CAT는 개인마다 다른 형태의 검사를 시행하므로 ①은 옳지 않다.","id":"pyeongga-m133"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가의 개념으로 옳은 것은?","opts":["평가도구의 개발, 시행, 채점, 결과분석, 피드백 등을 포함한 평가의 모든 과정이 디지털 환경에서 이루어지는 평가방식","컴퓨터를 이용해 문항을 제시하는 검사","피험자의 능력에 적응하는 검사","온라인으로 제출하는 포트폴리오"],"a":0,"exp":"디지털평가는 평가도구의 개발, 시행, 채점, 결과분석, 피드백 등 평가의 모든 과정이 디지털 환경에서 이루어지는 평가방식이다.","id":"pyeongga-m134"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가의 특징 및 장점으로 옳지 않은 것은?","opts":["평가의 모든 과정이 표준화되어 개별화된 피드백은 제공하기 어렵다","텍스트 기반의 평가를 넘어 멀티미디어 및 상호작용적 요소를 활용하여 다양한 방식의 평가가 가능하다","학생의 응답에 따라 문항 난이도를 실시간으로 조절하는 등 적응형 평가로 구현될 수 있다","학습지원을 위한 유니버설 디자인(UDL)과 보조기술(assistive technology)의 통합이 가능하여 평가의 공정성을 증진하는 데 기여한다"],"a":0,"exp":"디지털평가는 'AI와 빅데이터 분석기술을 활용하여 개별화된 피드백을 실시간으로 제공할 수 있어 학생의 학습경험을 최적화함'이 장점이므로 ①은 정반대이다.","id":"pyeongga-m135"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가의 구성요소 5가지에 포함되지 않는 것은?","opts":["교사의 수기 채점 기록부","평가도구 및 플랫폼(온라인 시험 시스템, 학습관리시스템(LMS), 자동채점 도구 등)","채점 및 피드백 시스템","보안 및 개인정보 보호"],"a":0,"exp":"디지털평가의 구성요소는 ①평가도구 및 플랫폼 ②문항 설계 및 구현방식 ③채점 및 피드백 시스템 ④학습데이터 수집 및 분석 도구 ⑤보안 및 개인정보 보호이다.","id":"pyeongga-m136"},{"ch":"CH03 교육평가의 유형","t":"디지털 포트폴리오","q":"일반 포트폴리오와 구별되는 디지털 포트폴리오의 장점으로 옳지 않은 것은?","opts":["학생의 학습 여정보다 최종 결과물 중심의 평가를 지향한다","자료의 저장 및 관리가 용이하다","저장된 자료에 대한 수정과 재편집이 가능하여 학습자가 지속적으로 자신의 학습결과를 보완할 수 있는 기회를 제공한다","비디오, 오디오 파일 등 다양한 멀티미디어 자료를 포함할 수 있고 플립북 형태의 동적인 페이지 전환, 슬라이드 쇼 등을 통해 더욱 생동감 있는 콘텐츠 표현이 용이하다"],"a":0,"exp":"두 방식 모두 '단순한 결과물보다는 과정을 중시하는 평가방식을 지향'하므로 ①은 옳지 않다.","id":"pyeongga-m137"},{"ch":"CH03 교육평가의 유형","t":"디지털 포트폴리오","q":"디지털 포트폴리오와 일반 포트폴리오의 공통점으로 옳은 것은?","opts":["학습과정의 기록과 반영이라는 측면에서 두 방식 모두 학생의 학습 여정을 보여주며, 단순한 결과물보다는 과정을 중시하는 평가방식을 지향함","두 방식 모두 다양한 멀티미디어 자료를 포함할 수 있음","두 방식 모두 자료의 수정과 재편집이 자유로움","두 방식 모두 피드백이 즉각적으로 제공됨"],"a":0,"exp":"공통점은 ①학습과정의 기록과 반영 측면에서 학습 여정을 보여주며 과정을 중시함 ②개별 학습자의 특성과 성취를 반영하는 맞춤형 평가도구로 널리 활용됨 ③다양한 학습성과를 종합적으로 평가할 수 있음이다. ②③④는 디지털 포트폴리오의 장점이다.","id":"pyeongga-m138"},{"ch":"CH03 교육평가의 유형","t":"디지털평가","q":"디지털평가 개발 및 적용의 고려사항으로 옳지 않은 것은?","opts":["학생마다 동일한 시험을 치르게 하여 결과 비교 가능성을 우선 확보해야 한다","디지털평가의 무결성(데이터의 정확성과 안정성을 보장하는 것)이 필요하다","디지털평가의 보안 및 개인정보 보호가 고려되어야 한다","디지털평가의 공정성과 관련하여 학생들의 디지털 격차와 기술 및 정보 접근성의 환경적 불균형 문제가 발생할 수 있다"],"a":0,"exp":"'학생마다 다른 시험을 치르고 개별 피드백을 받기 때문에, 평가의 목적에 따라 디지털평가가 실시되어야 함'이 고려사항이므로 ①은 옳지 않다.","id":"pyeongga-m139"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항 제작 시 '질문 작성'의 유의사항으로 옳지 않은 것은?","opts":["질문은 가급적 부정문으로 하여 변별력을 높인다","출제 의도가 학생에게 분명하게 전달되도록 질문이 무엇에 대해 묻는 것인지 명확하게 드러나도록 작성한다","질문 중 답을 암시하거나 단서가 되는 내용이 포함되지 않도록 한다","가능한 단순하게 제시하되 조건이 부족하지 않도록 유의한다"],"a":0,"exp":"'질문은 가급적 긍정문으로 하고, 부정문일 경우 밑줄로 표시함'이 유의사항이므로 ①은 정반대이다.","id":"pyeongga-m140"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항의 '선지 작성' 유의사항으로 옳지 않은 것은?","opts":["오답지는 정답과 명확히 구별되도록 이질적으로 만들어야 한다","가능한 한 간단명료하게 제시하고 반복되는 단어는 문두에 제시한다","오답지는 그럴듯하고 매력적으로 만들어야 한다","답지의 길이는 가급적 비슷하게 맞추되 길이가 다를 경우 짧은 것부터 긴 것 순서로 배열한다"],"a":0,"exp":"'답지들은 너무 이질적이지 않도록 해야 함'과 '오답지는 그럴듯하고 매력적으로 만들어야 함'이 원칙이므로 ①은 옳지 않다.","id":"pyeongga-m141"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항의 장점으로 옳은 것은?","opts":["채점이 쉽고 객관성과 신뢰성이 높으며, 문항의 답지를 조금만 수정해도 쉽게 문항의 난이도 조정이 용이함","교수·학습과정에 대한 풍부한 정보를 제공함","추측 요인을 완전히 배제할 수 있음","고등사고기능 평가에 가장 적합함"],"a":0,"exp":"선택형 문항의 장점은 채점의 용이성, 객관성·신뢰성, 난이도 조정의 용이함이다. ②③은 단점과 반대된다.","id":"pyeongga-m142"},{"ch":"CH04 교육평가의 실제","t":"선택형 문항","q":"선택형 문항의 단점으로 옳은 것은?","opts":["교수·학습과정에 대한 정보를 제공하지 못하며, 문항의 제작이 다소 어렵고 추측 요인을 배제할 수 없음","채점이 어렵고 객관성이 낮음","난이도 조정이 어려움","채점에 시간이 많이 소요됨"],"a":0,"exp":"선택형 문항의 단점은 ①교수·학습과정에 대한 정보를 제공하지 못함 ②문항 제작이 다소 어렵고 추측 요인을 배제할 수 없음이다.","id":"pyeongga-m143"},{"ch":"CH04 교육평가의 실제","t":"논·서술형 문항","q":"논·서술형 문항의 특징으로 옳지 않은 것은?","opts":["학생이 제시된 답지 중에서 정답을 선택하도록 하여 채점의 객관성을 확보한다","학생이 답이라고 생각하는 지식이나 의견 등을 직접 서술하는 방식이다","학생의 생각이나 의견을 직접 서술하도록 하기 때문에 창의성, 문제해결력, 비판력, 판단력, 통합력, 정보수집력 및 분석력 등 고등사고기능 평가가 가능하다","기술된 응답의 내용을 통해 학생이 어떠한 과정을 거쳐 그러한 답에 도달했는지와 같은 학습과 성취에 대한 풍부한 정보를 얻을 수 있다"],"a":0,"exp":"논·서술형은 직접 서술하는 방식이므로 ①은 옳지 않다.","id":"pyeongga-m144"},{"ch":"CH04 교육평가의 실제","t":"논술형 문항","q":"논술형 문항의 제작원리로 옳지 않은 것은?","opts":["선발을 위한 시험에서는 여러 문항 중 일부만 선택하여 응답하게 하여 학생의 부담을 줄여야 한다","가능한 한 학생이 자신의 생각이나 의견을 드러낼 수 있도록 작성해야 한다","구체적인 교육목적을 평가할 수 있도록 문항을 구조화시키고 제한성을 갖도록 출제해야 한다","출제 과정에서 출제자는 사전에 모범답안을 작성해야 하며 모범답안 작성 후에는 채점기준표를 작성해야 한다"],"a":0,"exp":"'선발을 위한 시험에서는 여러 문항 중 일부만 선택하여 응답하게 하는 일이 없도록 해야 함'이 원칙이므로 ①은 정반대이다.","id":"pyeongga-m145"},{"ch":"CH04 교육평가의 실제","t":"논술형 문항","q":"논술형 문항의 장점으로 옳은 것은?","opts":["피험자의 응답을 어느 형태로든 제한하지 않고 자유를 주므로 피험자가 지니고 있는 모든 정신능력을 발휘할 수 있으며, 조직력·분석력·비판력·종합력·창의력·문제해결능력을 함양시킬 수 있음","넓은 교과 영역을 측정하기 쉬움","채점의 일관성이 높음","문장력이 채점에 영향을 주지 않음"],"a":0,"exp":"논술형의 장점은 응답의 자유로 모든 정신능력 발휘 가능, 조직력·분석력·비판력·종합력·창의력·문제해결능력 함양이다. ②③④는 단점과 반대된다.","id":"pyeongga-m146"},{"ch":"CH04 교육평가의 실제","t":"논술형 문항","
